<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of the Lab</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- ATLAS OF THE LAB · the repository as a city. Districts are the works the pages serve (read from what each page says and the data
     it reads, not from its file name); buildings are pages, their footprint the measure you choose (code, hours, commits, importance),
     their colour the kind of thing they are, their height their commits; roads run from the gate (the lab's front door) along the way
     a visitor actually clicks; a building with no road is an orphan. WORK compares the effort, LINEAGE shows which pages are versions
     and descendants of which, TIME lays them down by day, LIST is the catalogue, DIG is what to fix. Bolas (set 06: line, circle,
     dot) is the gate and the "you are here": red is only ever the thread. Data: atlas.json from atlas_build.py and git history. -->
<style>
:root { --bg: #0b0a09; --panel: #12110f; --ink: #ece6da; --dim: #b3ab9e; --faint: #7b7468; --rule: #2a2621; --red: #e0483a; --gold: #f2c14e; --lime: #c4f46a;
  --serif: 'Fraunces', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); display: grid; grid-template-rows: auto minmax(0, 1fr); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
header { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 12px 24px; align-items: center; padding: 12px 18px 0; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1; }
.brand small { display: block; font: 600 11.5px var(--mono); letter-spacing: .14em; color: var(--dim); margin-top: 5px; }
.search { position: relative; min-width: 0; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); font: 17px var(--serif); padding: 11px 14px 11px 40px; outline: none; }
.search input:focus { border-color: var(--dim); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); }
nav.views { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav.views button { flex: none; text-align: left; padding: 10px 16px 12px; border-bottom: 3px solid transparent; min-width: 132px; }
nav.views button b { display: block; font: 600 15px var(--mono); letter-spacing: .1em; }
nav.views button span { display: block; font-size: 13.5px; color: var(--faint); margin-top: 3px; }
nav.views button.on { border-bottom-color: var(--ink); } nav.views button.on span { color: var(--dim); }
nav.views button:hover b { color: #fff; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 400px; min-height: 0; }
aside.ctl { border-right: 1px solid var(--rule); overflow: auto; padding: 12px 16px 50px; }
.cg { margin: 14px 0 18px; }
.cg h4 { margin: 0 0 8px; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 15.5px; line-height: 1.15; text-align: left; }
.seg button small { display: block; font: 11.5px var(--mono); color: var(--faint); margin-top: 3px; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); } .seg button.on small { color: #4a453d; }
.seg button:hover:not(.on) { border-color: var(--dim); }
.leg { display: flex; flex-direction: column; gap: 4px; }
.leg button { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; text-align: left; font-size: 15.5px; line-height: 1.2; }
.leg button:hover { border-color: var(--rule); } .leg button.off { opacity: .3; }
.leg button i { width: 20px; height: 20px; border-radius: 5px; background: var(--c); }
.leg button b { font: 13px var(--mono); color: var(--dim); font-weight: 400; }
.hint { font: 12.5px/1.6 var(--mono); color: var(--faint); }
main { position: relative; overflow: hidden; min-width: 0; }
.view { position: absolute; inset: 0; overflow: auto; display: none; }
.view.on { display: block; }
aside.dot { border-left: 1px solid var(--rule); overflow: auto; padding: 0 20px 50px; }
.dot h2 { margin: 4px 0 4px; font-size: 28px; line-height: 1.12; font-weight: 600; }
.dot .path { font: 12.5px var(--mono); color: var(--dim); word-break: break-all; }
.dot .desc { font-size: 16.5px; line-height: 1.5; color: #ddd5c8; margin: 12px 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; font: 600 13px var(--mono); letter-spacing: .08em; text-decoration: none; border: 1px solid var(--dim); border-radius: 99px; padding: 8px 16px; margin: 8px 6px 4px 0; }
.btn:hover { background: var(--ink); color: var(--bg); }
.pill { display: inline-block; font: 600 11.5px var(--mono); letter-spacing: .1em; padding: 4px 9px; border-radius: 4px; text-transform: uppercase; color: #000; background: var(--c); }
.warn { border-left: 4px solid var(--gold); background: #1b1810; padding: 10px 12px; margin: 10px 0; font-size: 15.5px; line-height: 1.4; }
.meters { display: grid; grid-template-columns: 112px minmax(0, 1fr) 70px; gap: 7px 10px; align-items: center; margin: 14px 0; font-size: 14.5px; }
.meters .bar { height: 12px; background: #1d1b17; border-radius: 6px; overflow: hidden; } .meters .bar i { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
.meters b { font: 600 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; } .meters span { color: var(--dim); }
.sh { font: 600 12px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin: 18px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; font-size: 14.5px; border: 1px solid var(--rule); border-radius: 99px; padding: 4px 12px 4px 8px; max-width: 100%; text-align: left; }
.chip:hover { border-color: var(--dim); } .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chip small { font: 11.5px var(--mono); color: var(--faint); }
.chip i, .sw { width: 13px; height: 13px; border-radius: 3px; background: var(--c); flex: none; display: inline-block; }
.route { font: 13px/1.9 var(--mono); color: var(--dim); }
.route button { text-decoration: underline; text-decoration-color: #4a453d; }
.empty { color: var(--dim); font-size: 16.5px; line-height: 1.55; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: #050505f0; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font: 13px/1.5 var(--mono); max-width: 380px; display: none; }
.tip b { font: 600 16px var(--serif); display: block; margin-bottom: 2px; }
.work { padding: 16px 22px 60px; }
.wrow { display: grid; grid-template-columns: minmax(160px, 300px) minmax(0, 1fr) 84px; gap: 12px; align-items: center; min-height: 30px; cursor: pointer; border-radius: 6px; padding: 2px 6px; }
.wrow:hover { background: #15130f; } .wrow.sel { background: #211d16; }
.wrow .t { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .wrow .v { font: 13px var(--mono); text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.wrow .b { height: 16px; border-radius: 3px; background: var(--c); min-width: 2px; }
.wh { font: 600 13px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin: 22px 0 8px; display: flex; justify-content: space-between; }
.stack { display: flex; height: 26px; border-radius: 4px; overflow: hidden; }
.stack i { display: block; height: 100%; background: var(--c); border-right: 1px solid var(--bg); }
.lin { padding: 18px 24px 60px; max-width: 1100px; }
.lin h3 { font-size: 24px; margin: 26px 0 6px; } .lin p { color: var(--dim); font-size: 16px; line-height: 1.5; max-width: 70ch; margin: 0 0 12px; }
.tree { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.tree .node { display: flex; align-items: center; gap: 10px; min-height: 36px; flex-wrap: wrap; }
.tree .node .arrow { font: 13px var(--mono); color: var(--faint); white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
thead th { position: sticky; top: 0; background: var(--bg); font: 600 11.5px var(--mono); letter-spacing: .08em; color: var(--faint); text-transform: uppercase; text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--rule); cursor: pointer; white-space: nowrap; }
tbody tr { border-bottom: 1px solid #1a1815; cursor: pointer; } tbody tr:hover { background: #15130f; } tbody tr.sel { background: #211d16; }
td { padding: 8px 8px; vertical-align: top; } td.t { font-weight: 600; } td.t small { display: block; font: 11.5px var(--mono); color: var(--faint); font-weight: 400; }
td.n { font: 13px var(--mono); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.dig { max-width: 1000px; padding: 22px 28px 80px; }
.dig h2 { font-size: 34px; margin: 0 0 8px; } .dig h3 { font-size: 23px; margin: 30px 0 6px; border-top: 1px solid var(--rule); padding-top: 18px; }
.dig p { font-size: 17px; line-height: 1.55; color: #ddd5c8; max-width: 72ch; }
.prob { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.prob button { display: grid; grid-template-columns: 14px minmax(0, 260px) minmax(0, 1fr); gap: 12px; align-items: baseline; text-align: left; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; font-size: 15px; }
.prob button:hover { border-color: var(--dim); } .prob button em { color: var(--dim); font-style: normal; }
@media (max-width: 1250px) { .app { grid-template-columns: 260px minmax(0, 1fr) 340px; } }
@media (max-width: 980px) { body { display: block; height: auto; } .app { display: flex; flex-direction: column; } main { order: -1; } aside.ctl, aside.dot { border: 0; border-bottom: 1px solid var(--rule); overflow: visible; } main { height: 75vh; } main { min-height: 60vh; } header { grid-template-columns: minmax(0, 1fr); } .prob button { grid-template-columns: 14px minmax(0, 1fr); } .prob button em { grid-column: 2; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="./" title="Back to the lab"><svg width="34" height="46" viewBox="-17 -32 34 46"><line x1="0" y1="-32" x2="0" y2="-13" stroke="#e0483a" stroke-width="2.4"/><circle r="12" fill="none" stroke="#ece6da" stroke-width="3"/><circle cx="4" cy="2" r="3.2" fill="#ece6da"/></svg>
    <span><h1>Atlas of the Lab</h1><small id="sub">THE REPOSITORY AS A CITY</small></span></a>
  <label class="search"><svg width="17" height="17" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#b3ab9e" stroke-width="2"/><line x1="11" y1="11" x2="15" y2="15" stroke="#b3ab9e" stroke-width="2"/></svg>
    <input id="q" type="search" placeholder="Find a page by name, project, word… (press / ; Enter jumps to it)" autocomplete="off" aria-label="Search the atlas"></label>
  <nav class="views" aria-label="Views">
    <button data-v="city"><b>CITY</b><span>districts, buildings, roads</span></button>
    <button data-v="work"><b>WORK</b><span>how much went into each</span></button>
    <button data-v="lineage"><b>LINEAGE</b><span>versions and descendants</span></button>
    <button data-v="time"><b>TIME</b><span>when each was built</span></button>
    <button data-v="list"><b>LIST</b><span>every page, sortable</span></button>
    <button data-v="dig"><b>DIG</b><span>what to fix</span></button></nav>
</header>
<div class="app">
  <aside class="ctl" id="ctl"></aside>
  <main><div class="view" id="v-city"></div><div class="view" id="v-work"></div><div class="view" id="v-lineage"></div><div class="view" id="v-time"></div><div class="view" id="v-list"></div><div class="view" id="v-dig"></div></main>
  <aside class="dot" id="dot"></aside>
</div>
<div class="tip" id="tip"></div>
<script src="atlas-app.js?v=3"></script>
</body>
</html>
