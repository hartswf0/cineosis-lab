<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slopfeeder Films</title>
<meta name="description" content="The eight Slopfeeder films, one for each song of The Liturgy of the Two Buttons: each cut by CUTBASTARD from the song's own lyric, with its logline, story and how it was made.">
<meta name="theme-color" content="#0c0d0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0f'/%3E%3Crect x='4' y='16' width='24' height='5' rx='1.5' fill='%23383d44'/%3E%3Cpath d='M9 16 L11 9 H16 L18 16 Z' fill='%23f25a17'/%3E%3Ccircle cx='22' cy='14' r='2.4' fill='%235600f5'/%3E%3Ccircle cx='25' cy='14.5' r='1.8' fill='%23e6c808'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0c0d0f; --top:#16181b; --ink:#ebe5d8; --dim:#858b93; --faint:#24282d; --hot:#f25a17; --sans:'Barlow Condensed',Impact,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#0c0d0f; } }
*{ box-sizing:border-box; } html,body{ margin:0; } body{ background:var(--bg); color:var(--ink); font:400 13px/1.6 var(--mono); }
header{ padding:28px 16px 8px; max-width:1240px; margin:0 auto; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
h1{ margin:0; font:700 34px var(--sans); letter-spacing:.14em; } h1 b{ color:var(--hot); } header p{ margin:0; color:var(--dim); max-width:620px; } header a{ color:var(--hot); text-decoration:none; font:700 13px var(--sans); letter-spacing:.14em; margin-left:auto; }
main{ max-width:1240px; margin:0 auto; padding:12px 16px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:22px; }
.film{ background:var(--top); border:1px solid var(--faint); border-radius:4px; overflow:hidden; display:flex; flex-direction:column; }
.pic{ position:relative; aspect-ratio:16/9; background:#000; cursor:pointer; } .pic img,.pic video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.pic .play{ position:absolute; left:12px; bottom:10px; font:700 13px var(--sans); letter-spacing:.16em; background:#000c; padding:4px 10px; border-radius:2px; } .pic:hover .play{ background:var(--hot); color:#170b04; }
.pic .no{ position:absolute; right:10px; top:8px; font:700 12px var(--sans); letter-spacing:.12em; background:#000c; padding:2px 8px; border-radius:2px; }
.body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; } .body h2{ margin:0; font:700 22px var(--sans); letter-spacing:.06em; } .body .song{ color:var(--dim); font-size:11px; }
.log{ font:600 17px/1.35 var(--sans); letter-spacing:.02em; color:var(--ink); } .desc{ color:#cfc9bc; } .story{ color:var(--dim); font-size:11.5px; } .story b{ color:var(--ink); font-weight:500; }
details{ border-top:1px solid var(--faint); padding-top:8px; color:var(--dim); font-size:11.5px; } summary{ cursor:pointer; font:700 12px var(--sans); letter-spacing:.14em; color:var(--ink); }
.nums{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--dim); } .nums b{ color:var(--ink); font-weight:500; }
@media (max-width:600px){ main{ grid-template-columns:1fr; } h1{ font-size:26px; } header a{ margin-left:0; } }
</style></head><body>
<header><h1>SLOP<b>FEEDER</b> · THE EIGHT FILMS</h1><p>One film for each song of <i>The Liturgy of the Two Buttons</i>, each cut from its own lyric by CUTBASTARD in Blacktop, and each opening on the meme the whole world grew from.</p><a href="blacktop.html">OPEN BLACKTOP ↗</a></header>
<main id="films"></main>
<script>
(() => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  fetch('slopfeeder/films.json').then(r => r.json()).then(({ films }) => {
    document.getElementById('films').innerHTML = films.map(f => `<article class="film"><div class="pic" data-v="${esc(f.video)}"><img src="${esc(f.thumb)}" alt="${esc(f.title)}" loading="lazy"><span class="no">${esc(f.n)}</span><span class="play">▶ WATCH · ${Math.floor(f.numbers.dur / 60)}:${String(Math.round(f.numbers.dur % 60)).padStart(2, '0')}</span></div>
      <div class="body"><h2>${esc(f.title)}</h2><div class="song">${esc(f.n)} · ${esc(f.song)}</div><div class="log">${esc(f.logline)}</div><div class="desc">${esc(f.description)}</div>
        <div class="story"><b>wants</b> ${esc(f.story.want)} · <b>turns</b> ${esc(f.story.turn)} · <b>ends</b> ${esc(f.story.end)}</div>
        <details><summary>HOW IT'S MADE</summary><p>${esc(f.how)}</p><div class="nums"><span><b>${f.numbers.shots}</b> shots</span><span><b>${f.numbers.ai}</b> AI</span><span><b>${f.numbers.archive}</b> archive films</span><span><b>${f.numbers.patches}</b> patches</span><span><b>${f.numbers.locked}</b> on the beat</span><span>look <b>${esc(f.numbers.look)}</b></span></div></details></div></article>`).join('');
    document.querySelectorAll('.pic').forEach(p => p.onclick = () => { if (p.querySelector('video')) return; const v = document.createElement('video'); v.src = p.dataset.v; v.controls = true; v.playsInline = true; v.poster = p.querySelector('img').src; p.querySelector('img').replaceWith(v); p.querySelector('.play').remove(); v.play().catch(() => { }); });
  });
})();
</script></body></html>
