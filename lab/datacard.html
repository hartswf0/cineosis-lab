<!-- CINEOSIS LAB · DATA CARD. What kind of thing the lab is (collection, database, taxonomy, zoo, archive, operative archive,
     counter-archive), read through Loukissas's data settings; what it is counter to, and what it is not; where its material came
     from and what is in it; every kind of missing kept apart in an absence ledger (after Kumbier's distinction between absence and
     failed retrieval); who decides; and what would make it a counter-archive. In the form of Datasheets for Datasets and Data Cards.
     Numbers are read live from explain/lesson/ledger.json (explain/ledger.py, from the lab's own records). The film above the card is

<style>
:root { --bg: #0b0a09; --panel: #12110f; --ink: #ece6da; --dim: #b3ab9e; --faint: #7b7468; --rule: #2a2621; --red: #e0483a; --gold: #f2c14e; --lime: #c4f46a; --warn: #ff8f6e;
  --serif: 'Fraunces', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); }
a { color: inherit; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header.top b { font-size: 22px; } header.top small { display: block; font: 600 11.5px var(--mono); letter-spacing: .14em; color: var(--dim); margin-top: 4px; }
header.top nav { display: flex; gap: 8px; flex-wrap: wrap; } header.top nav a { font: 600 12.5px var(--mono); letter-spacing: .1em; text-decoration: none; color: var(--dim); border: 1px solid var(--rule); border-radius: 99px; padding: 9px 14px; }

.meta { font: 13px var(--mono); color: var(--faint); }

.film iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.sh { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; align-items: end; border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 14px; }
.sh h2 { margin: 0; font-size: 30px; line-height: 1.1; } .sh h2 small { display: block; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin-bottom: 6px; }
p.body { font-size: 18px; line-height: 1.6; color: #ddd5c8; max-width: 70ch; }

.lk small { display: block; font: 13.5px var(--mono); color: var(--dim); margin-top: 6px; line-height: 1.45; }

.ex figcaption { font-size: 14.5px; line-height: 1.4; margin-top: 6px; color: #cfc7ba; } .ex figcaption small { display: block; font: 12px var(--mono); color: var(--faint); margin-top: 3px; }

.facts dt, .facts dd { padding: 11px 0; border-bottom: 1px solid #1d1a16; margin: 0; } .facts dt { font: 600 12.5px var(--mono); letter-spacing: .08em; color: var(--faint); text-transform: uppercase; padding-top: 14px; } .facts dd { font-size: 17px; line-height: 1.5; }
.dec { display: flex; align-items: flex-end; gap: 3px; height: 70px; margin: 6px 0 2px; } .dec i { flex: 1; background: var(--dim); min-height: 1px; } .decl { display: flex; justify-content: space-between; font: 11.5px var(--mono); color: var(--faint); }
ul.todo { padding-left: 0; list-style: none; } ul.todo li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 17.5px; line-height: 1.5; padding: 9px 0; border-bottom: 1px solid #1d1a16; } ul.todo li span { font: 600 14px var(--mono); color: var(--gold); }
.refs { font-size: 15px; line-height: 1.6; color: var(--dim); columns: 2 340px; } .refs p { margin: 0 0 8px; break-inside: avoid; }
.note { font: 13px/1.6 var(--mono); color: var(--faint); }
@media (max-width: 700px) { .lk { grid-template-columns: minmax(0, 1fr); } .lk .n { text-align: left; } .facts { grid-template-columns: minmax(0, 1fr); } .answer { grid-template-columns: 56px minmax(0, 1fr); } .answer p { font-size: 19px; } }

<body>
<header class="top"><div><b>Cineosis Lab · Data Card</b><small>WHAT KIND OF ARCHIVE IS THIS?</small></div><nav><a href="series.html">EXPLAINERS</a><a href="atlas.html">ATLAS</a><a href="papers.html">PAPERS</a></nav></header>
<main id="m"><p class="meta">Loading the card…</p></main>
<script>
const $ = s => document.querySelector(s), esc = t => String(t ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fmt = n => Number(n).toLocaleString('en-GB'), pct = (a, b) => Math.round(a / b * 100) + '%';
/* Bolas, with the face each section deserves */
function bolas(mood = 'open', r = 22) {
  const ex = r * .34, er = r * .17; const eye = (x, side) => mood === 'blink' || (mood === 'wink' && side > 0) ? `<path d="M${x - er * 1.2},1 Q${x},${er} ${x + er * 1.2},1" stroke="#ece6da" stroke-width="${r * .08}" fill="none" stroke-linecap="round"/>`
    : mood === 'happy' ? `<path d="M${x - er * 1.2},${er * .4} Q${x},${-er * 1.4} ${x + er * 1.2},${er * .4}" stroke="#ece6da" stroke-width="${r * .08}" fill="none" stroke-linecap="round"/>`
    : mood === 'sad' ? `<path d="M${x - er},${-er * .2} L${x + er},${-er * .2} L${x + er * .8},${er} Q${x},${er * 1.4} ${x - er * .8},${er} Z" fill="#ece6da" transform="rotate(${side * -12} ${x} 0)"/>`
    : mood === 'think' ? `<ellipse cx="${x + er * .5}" cy="${-er * .5}" rx="${er}" ry="${er * .7}" fill="#ece6da"/>`
    : mood === 'suspicious' ? `<rect x="${x - er}" y="${-er * .2}" width="${er * 2}" height="${er * .9}" rx="${er * .4}" fill="#ece6da"/>` : `<circle cx="${x}" cy="0" r="${er}" fill="#ece6da"/>`;
  return `<svg width="${r * 2.6}" height="${r * 3.4}" viewBox="${-r * 1.3} ${-r * 2.2} ${r * 2.6} ${r * 3.4}" aria-hidden="true"><line x1="0" y1="${-r * 2.2}" x2="0" y2="${-r}" stroke="#e0483a" stroke-width="${Math.max(2, r * .09)}"/><circle r="${r}" fill="#0b0a09" stroke="#ece6da" stroke-width="${r * .13}"/>${eye(-ex, -1)}${eye(ex, 1)}</svg>`;
}
const sh = (k, title, mood) => `<div class="sh">${bolas(mood)}<h2><small>${k}</small>${title}</h2></div>`;
const V = { yes: '<span class="v yes">yes</span>', part: '<span class="v part">partly</span>', no: '<span class="v no">no</span>', na: '<span class="v na">not this</span>' };
Promise.all([fetch('explain/lesson/ledger.json?v=' + Date.now()).then(r => r.json()), fetch('explain/machines/eyes.json').then(r => r.json()).catch(() => ({ blip: { invented: [] } }))]).then(([L, EY]) => {
  const decMax = Math.max(...L.decades.map(d => d[1])), fetchedOut = L.measured - L.kept;
  const kinds = [
    ['Never reached', L.archive_films - L.films_found, `films of the Moving Image Archive (about ${fmt(L.archive_films)}) that no question of the lab ever brought back`, (L.archive_films - L.films_found) / L.archive_films, 'About the archive, as the lab can see it: these films were never asked about in a way that found them. Unknown, not absent.'],
    ['Asked, weakly answered', L.weak, `of ${fmt(L.questions)} questions got a best answer under ${L.weak_threshold} (CLIP nearness of words to a frame; the median best is ${L.median_best.toFixed(2)}). None came back empty.`, L.weak / L.questions, 'Failed retrieval, not absence: the archive may hold it, the search did not find it.'],
    ['Found, never fetched', L.not_fetched, `of ${fmt(L.found)} shots the searches found were never downloaded or watched`, L.not_fetched / L.found, 'The biggest cut in the lab, and not a rule about pictures: which shots someone fetched.'],
    ['Fetched, removed by a rule', fetchedOut, `of ${fmt(L.measured)} measured shots: ${L.rules.filter(r => !/measured/.test(r.rule)).map(r => `${fmt(r.removed)} by “${r.rule}”`).join(', ')}`, fetchedOut / L.measured, 'Removed for being unusable as pictures, not for what they show.'],
    ['Withheld on purpose', L.withheld_shots, `shots from ${L.withheld_films.length} films the lab will not show: ${L.withheld_films.map(f => `${f.title} (${fmt(f.shots)})`).join(', ')}`, L.withheld_shots / L.found, 'A choice, written into every pipeline as a rule. The only place the lab exercises the authority to withhold.'],
    ['Misdescribed by a machine', L.misdescribed, `of ${L.captions} captions sampled from BLIP begin with a word that does not exist: “arafed”`, L.misdescribed / L.captions, 'Present, but wrongly named. Every machine word in the lab is marked as a machine’s.']];
  $('#m').innerHTML = `
  <p class="meta">CINEOSIS LAB · DATA CARD · as of 16 October 2026 · numbers from the lab’s own records (<a href="explain/ledger.py">ledger.py</a>)</p>
  <h1>What kind of archive is this?</h1>
  <div class="film"><iframe src="archive-kind.html" title="What Kind of Archive Is This? (film)" allow="autoplay; fullscreen"></iframe></div>
  <p class="note">The film, about four minutes. <a href="archive-kind.html">Open it full screen</a>.</p>
  <div class="answer">${bolas('wink', 28)}<p><b>An operative counter-reading of a public archive.</b> A database made intentional by its questions; a taxonomy, and a zoo of shots out of their films; an archive that acts on what it holds. Not, yet, a counter-archive.</p></div>

  <section>${sh('the words', 'Six words, kept strict', 'curious')}
  <div class="tbl"><table><tr><th>Word</th><th>What it is</th><th>The lab</th><th>Because</th></tr>
    <tr><td>Collection</td><td>Things of one kind, gathered with some coherence</td><td>${V.yes}</td><td>${fmt(L.found)} shots: each a few seconds cut from a film, with an in and an out</td></tr>
    <tr><td>Database</td><td>Records you can query, with no order of their own; every query makes one (Manovich: database against narrative)</td><td>${V.yes}</td><td>${fmt(L.questions)} questions from the 45 signs, about ${L.questions_per_sign} each; vectors from CLIP and DINO; every finder in the Atlas is a query</td></tr>
    <tr><td>Catalogue</td><td>A database <i>about</i> works, as IMDb is: it describes, it does not hold</td><td>${V.part}</td><td>The lab describes 1,420 films it does not own; it holds copies of ${fmt(L.measured)} shots</td></tr>
    <tr><td>Taxonomy</td><td>A scheme that sorts things into kinds</td><td>${V.yes}</td><td>The 45 signs of the cineosis, in eight families, laid over every shot</td></tr>
    <tr><td>Zoo</td><td>Specimens taken out of their habitat and shown by kind</td><td>${V.yes}</td><td>Each shot is shown away from its film; its source and seconds are kept, its surroundings are not</td></tr>
    <tr><td>Archive, strictly</td><td>Records kept on purpose by someone with a mandate and custody, in their original order (Derrida’s arkheion: a beginning and a command)</td><td>${V.no}</td><td>No custody of originals, no mandate, no original order: a layer of questions over the Moving Image Archive</td></tr>
    <tr><td>Operative archive</td><td>An archive that acts: it computes, sorts and makes (Ernst; Farocki’s operational images)</td><td>${V.yes}</td><td>It searches, scores, sieves and cuts; the films it makes are its output</td></tr>
    <tr><td>Counter-archive</td><td>A situated practice against a dominant record: it exposes absence, misdescription and exclusion, and its politics live in governance, circulation, transparency and the authority to revise or withhold</td><td>${V.part}</td><td>See below: counter to use and to machine authority; not in governance</td></tr></table></div>
  <p class="body">Two more ideas belong to this lab. Jaimie Baron’s <i>archive effect</i>: footage feels archival because of a gap, between when it was made and when it is seen, and between what it was for and how it is now used. And Jay Leyda’s <i>films beget films</i>, the old name for making films out of archives. The lab lives in both gaps.</p></section>

  <section>${sh('a data setting', 'Read through Loukissas', 'think')}
  <p class="body">Yannis Loukissas, in <i>All Data Are Local</i>, asks less what data are than where and how they were made: data settings rather than datasets. His six principles, paraphrased, applied here:</p>
  <div class="tbl"><table><tr><th>Principle</th><th>In this lab</th></tr>
    <tr><td>Data are local</td><td>Every shot exists because a project asked for it: forage summoned ${fmt(L.projects.find(p => p[0] === 'forage')?.[1] || 0)}, cineosis ${fmt(L.projects.find(p => p[0] === 'cineosis')?.[1] || 0)}, the poem ${fmt(L.projects.find(p => p[0] === 'wygwyl')?.[1] || 0)} (a shot can be summoned by more than one)</td></tr>
    <tr><td>Data have attachments to place</td><td>Each shot keeps its film, its year and its seconds; mid-century American institutional and amateur film dominates (median year ${L.year_median})</td></tr>
    <tr><td>Data come from many sources</td><td>${fmt(L.films_found)} films across ${L.year_min} to ${L.year_max}; uploaders’ titles and dates, often missing or wrong</td></tr>
    <tr><td>Data and algorithms are entangled</td><td>What the lab holds is what CLIP’s nearness returned for its words; the order of the archive is the search’s order</td></tr>
    <tr><td>Interfaces put data in new contexts</td><td>The same shot plays as a sign, an answer to a poem, a building in the Atlas, a specimen in this card</td></tr>
    <tr><td>Data point to local knowledge</td><td>The signs come from Deleuze, read through Deamer’s table: one school of film theory, not a neutral grid</td></tr></table></div></section>

  <section>${sh('the counter', 'Counter to what?', 'suspicious')}
  <p class="body">“Counter” means nothing until it names what it is against. Four senses, with a verdict on each.</p>
  <div class="tbl"><table><tr><th>Counter to</th><th>Verdict</th><th>Evidence</th><th>What would change it</th></tr>
    <tr><td>The films’ intended use</td><td>${V.yes}</td><td>Civil-defence, industrial and teaching films read against their purpose: <i>Duck and Cover</i> answers a poem; <i>The Myth</i> asks what these films were made for, and what we made them into</td><td>Already its practice</td></tr>
    <tr><td>Machine authority</td><td>${V.yes}</td><td>Machine words marked as machines’; a warn field on every paper; one poem cut four ways; the wink as a reading that can be contested</td><td>Keep it so</td></tr>
    <tr><td>The dominant record</td><td>${V.part}</td><td>It finds some absences by accident (27 of 45 signs never used in a film; the scripts asked for men first), but it re-reads the most institutional films there are, rather than gathering what institutions left out</td><td>The absence ledger below, kept on purpose; searches aimed at what is missing</td></tr>
    <tr><td>Archival power, governance</td><td>${V.no}</td><td>One author with machines. Three films withheld by rule; no face named by a machine; no voice imitating a real person. No one filmed was asked; no one can contest their use; no contributors</td><td>A way to contest and withdraw; contributors with editing rights; consent where people can still be asked</td></tr></table></div>
  <p class="body">Against the feminist counter-archive in the literature (Kumbier on archive activism; Cooper on metaphorical archives; the governance arguments around collective editing), the lab meets two criteria, transparency of evidence and interpretive instability, and largely fails the ones that carry the politics: collective authority, consent, contributor presence, the right of the recorded to withhold.</p></section>

  <section>${sh('where it came from', 'Composition and provenance', 'open')}
  <dl class="facts">
    <dt>Intent</dt><dd>To read moving images through the signs of the cineosis, and to cut films for poems from what the archive returns.</dd>
    <dt>Unit</dt><dd>A shot: a few seconds of a source film, with its in and out seconds, its film title and year.</dd>
    <dt>Source</dt><dd>The Moving Image Archive (about ${fmt(L.archive_films)} films, as the lab estimates); ${fmt(L.films_found)} films reached, ${L.hours_found} hours.</dd>
    <dt>Selection</dt><dd>Summoned by questions: ${fmt(L.questions)} from the 45 signs alone, each answered by CLIP nearness of words to frames. Then fetched (${fmt(L.measured)} of ${fmt(L.found)}), then the sieve (${fmt(L.kept)} usable).</dd>
    <dt>Dates</dt><dd>${L.year_min} to ${L.year_max}, median ${L.year_median}. By decade:<div class="dec">${L.decades.map(([d, n]) => `<i title="${d}s: ${fmt(n)} shots" style="height:${Math.max(1, n / decMax * 100)}%"></i>`).join('')}</div><div class="decl"><span>${L.decades[0][0]}s</span><span>${L.decades.at(-1)[0]}s</span></div></dd>
    <dt>Colour</dt><dd>${Math.round(L.bw_share * 100)}% black and white, by the lab’s measure.</dd>
    <dt>Annotations</dt><dd>All by machines, and marked as such: CLIP and DINO vectors; BLIP captions; Whisper transcripts; sign affinities. Readings of signs are kept apart from machine labels.</dd>
    <dt>Not measured</dt><dd>Who appears in the shots; where they were filmed; languages; the rights of each film, which follow the archive’s terms and are not checked film by film.</dd></dl></section>

  <section>${sh('the absence ledger', 'Six kinds of missing, kept apart', 'think')}
  <p class="body">After Kumbier’s distinction: “missing” can mean never recorded, destroyed, not collected, misdescribed, restricted. The lab can tell its own kinds apart, because it kept every step. Each bar is a share of its own whole.</p>
  <div class="ledger">${kinds.map(([t, n, s, f, why]) => `<div class="lk"><div><b>${t}</b><small>${esc(why)}</small></div><span class="n">${fmt(n)}</span><div><div class="bar"><i style="width:${Math.max(.5, f * 100).toFixed(1)}%"></i></div><small>${esc(s)}</small></div></div>`).join('')}</div>
  <h3 style="font-size:21px;margin:26px 0 4px">Asked, weakly answered: what came back</h3>
  <div class="ex">${L.weak_examples.filter(w => w.thumb).slice(0, 4).map(w => `<figure><img src="${esc(w.thumb)}" alt=""><figcaption>asked: “${esc(w.q)}”<small>${esc(w.name)} · got ${esc(w.got || '')} · nearness ${w.best.toFixed(2)}</small></figcaption></figure>`).join('')}</div>
  <h3 style="font-size:21px;margin:26px 0 4px">Misdescribed: what the machine wrote</h3>
  <div class="ex">${(EY.blip.invented || []).slice(0, 4).map(c => `<figure><img src="${esc(c.thumb)}" alt=""><figcaption>“${esc(c.cap)}”<small>BLIP · ${esc(c.title || '')}</small></figcaption></figure>`).join('')}</div>
  <p class="note" style="margin-top:14px">Withheld films are listed by name and never shown, here or anywhere in the lab.</p></section>

  <section>${sh('who decides', 'Governance', 'sad')}
  <dl class="facts">
    <dt>Authority</dt><dd>One author, working with machines. The machines propose; the author keeps or refuses.</dd>
    <dt>Withholding</dt><dd>${L.withheld_films.map(f => esc(f.title)).join(', ')}: withheld by a rule written into every pipeline (${fmt(L.withheld_shots)} shots).</dd>
    <dt>Faces and voices</dt><dd>No face is named by recognition. No generated voice imitates a real person.</dd>
    <dt>Consent</dt><dd>None. The people filmed, most of them long ago, were not asked and cannot contest their use here.</dd>
    <dt>Circulation</dt><dd>Public: the site, the code and the data are open; every film has a paper with what it asked, found and warns.</dd>
    <dt>Revision</dt><dd>Plural by design: one poem in four takes; readings shown as contestable; every number regenerated from records.</dd></dl></section>

  <section>${sh('uses', 'Uses and misuses', 'open')}
  <div class="tbl"><table><tr><th>Good for</th><th>Not for</th></tr>
    <tr><td style="font-weight:400;white-space:normal">Reading films through signs; teaching what machines see; making poem-films; studying how search shapes an archive</td><td>Treating a sign affinity as a reading; treating a failed search as proof that something was never filmed; identifying the people in the footage; standing in for the Moving Image Archive itself</td></tr></table></div></section>

  <section>${sh('next', 'What would make it a counter-archive', 'determined')}
  <ul class="todo"><li><span>1</span>Keep the absence ledger on purpose: aim searches at what the archive seems to lack, and record the failures as failures.</li>
    <li><span>2</span>Give the people and communities in the footage a way to contest, annotate or withdraw a shot, and honour it.</li>
    <li><span>3</span>Invite contributors with real editing rights, attribution and an exit.</li>
    <li><span>4</span>Measure who appears and who is missing, without naming anyone, and publish it.</li>
    <li><span>5</span>Check rights film by film, and say so on the card.</li></ul></section>

  <section>${sh('sources', 'Read further', 'open')}
