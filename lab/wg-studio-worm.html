<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WARGAMES // CINEMA + WORM TRACE</title>
<style>
  :root {
    --bg: #000000;
    --fg: #33ff77;
    --fg-bright: #d0ffe4;
    --fg-dim: #1d6b38;
    --border: #0f381d;
    --amber: #ffb000;
    --cyan: #00e5ff;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: var(--fg);
    font-family: var(--mono); font-size: 11px;
    user-select: none; -webkit-user-select: none;
  }

  .app {
    display: grid;
    grid-template-rows: 32px 1fr 84px 64px;
    width: 100vw; height: 100vh;
    background: #000;
  }

  /* 1. TOP TRANSPORT & LENS BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-bottom: 1px solid var(--border);
    background: #020804; overflow-x: auto; white-space: nowrap; gap: 10px;
  }
  .bar-group { display: flex; align-items: center; gap: 4px; }
  .btn {
    font-family: var(--mono); font-size: 10px;
    background: #000; color: var(--fg);
    border: 1px solid var(--fg-dim); padding: 3px 8px;
    cursor: pointer; text-decoration: none;
  }
  .btn:hover, .btn.on { background: var(--fg); color: #000; font-weight: 700; }
  .btn.amber { color: var(--amber); border-color: #775200; }
  .btn.amber.on, .btn.amber:hover { background: var(--amber); color: #000; }
  .btn.cyan { color: var(--cyan); border-color: #006677; }
  .btn.cyan.on, .btn.cyan:hover { background: var(--cyan); color: #000; }

  /* 2. MAIN CINEMA STAGE: TWO HUGE, CLEAN, UNCLUTTERED 16:9 VIDEO SCREENS */
  .cinema-stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 10px 14px;
    background: #000; align-items: center; justify-items: center;
    min-height: 0; overflow: hidden;
  }
  .screen-wrap {
    width: 100%; max-width: 100%;
    display: flex; flex-direction: column; gap: 4px;
  }
  .screen-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; color: #99e6b3; padding: 0 2px;
  }
  .video-16x9 {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--fg-dim);
    overflow: hidden;
    cursor: pointer;
  }
  .video-16x9 video,
  .video-16x9 img.vid-fallback {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }
  /* Optional subtle overlay on the video — OFF or super subtle by default so the film is 100% watchable */
  .video-16x9 svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  body.hide-overlay .video-16x9 svg { opacity: 0; }

  .sub-bar {
    min-height: 22px;
    padding: 3px 6px;
    background: #030a05;
    border: 1px solid var(--border);
    color: var(--fg-bright);
    font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 3. STILL HORIZONTAL WORM TRACK (f1 -> f8 LEFT TO RIGHT, NEVER SPINS!) */
  .worm-track-row {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px; padding: 4px 14px;
    border-top: 1px solid var(--border);
    background: #020603;
    position: relative;
    align-items: center;
  }
  .f-card {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
  }
  .f-card.active {
    border: 2px solid var(--amber);
  }
  .f-strip-img {
    position: absolute; top: 0; height: 100%; width: 800%; max-width: none;
    opacity: 0.85;
  }
  .f-card.active .f-strip-img { opacity: 1; }
  .f-card svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
  }
  .f-num {
    position: absolute; top: 2px; left: 3px; z-index: 8;
    background: rgba(0,0,0,0.75); padding: 0 3px; font-size: 8.5px; color: var(--fg-bright);
  }
  .f-color-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px; z-index: 8;
    display: grid; grid-template-columns: 1fr 1fr;
  }

  /* 4. BOTTOM 105-SCENE FILMSTRIP */
  .filmstrip {
    display: flex; align-items: center; gap: 4px;
    overflow-x: auto; overflow-y: hidden; padding: 4px 14px;
    border-top: 1px solid var(--border); background: #000;
    scroll-behavior: smooth;
  }
  .tile-16x9 {
    position: relative;
    height: 52px;
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: #000; cursor: pointer; overflow: hidden;
  }
  .tile-16x9 img {
    width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.65;
  }
  .tile-16x9:hover img { opacity: 0.95; }
  .tile-16x9.active { border: 2px solid var(--amber); }
  .tile-16x9.active img { opacity: 1; }
  .tile-id {
    position: absolute; bottom: 1px; left: 2px;
    background: rgba(0,0,0,0.8); padding: 0 3px; font-size: 8px; color: var(--fg-bright);
  }

  @media (max-width: 960px) {
    .app { grid-template-rows: 32px 1fr 62px 54px; }
    .cinema-stage {
      grid-template-columns: 1fr;
      overflow-y: auto;
      padding: 6px; gap: 6px;
    }
    .worm-track-row { padding: 3px 6px; gap: 2px; }
    .filmstrip { padding: 3px 6px; }
    .tile-16x9 { height: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 1. TOP BAR: PLAY, SOUND, 10 CUT SWITCHER, OVERLAY TOGGLE -->
  <div class="topbar">
    <div class="bar-group">
      <button class="btn amber on" id="btnPlay" onclick="togglePlay()">[PAUSE]</button>
      <button class="btn cyan on" id="btnSound" onclick="toggleSound()">[UNMUTE SOUND]</button>
      <button class="btn" onclick="stepShot(-1)">[&lt; PREV]</button>
      <span id="shotNum" style="color:var(--fg-bright);font-weight:700;padding:0 4px;">001 / 105</span>
      <button class="btn" onclick="stepShot(1)">[NEXT &gt;]</button>
      <button class="btn on" id="btnOverlay" onclick="toggleOverlay()">[DOT/CIRCLE: ON]</button>
    </div>

    <div class="bar-group" id="lensBar">
      <span style="color:var(--amber);font-size:9.5px;margin-right:2px;">CUT:</span>
      <button class="btn amber on" data-lens="synthesis" onclick="setLens('synthesis')">SYNTHESIS</button>
      <button class="btn amber" data-lens="clip" onclick="setLens('clip')">CLIP</button>
      <button class="btn amber" data-lens="vjepa" onclick="setLens('vjepa')">V-JEPA</button>
      <button class="btn amber" data-lens="blip" onclick="setLens('blip')">BLIP</button>
      <button class="btn amber" data-lens="cineosis" onclick="setLens('cineosis')">CINEOSIS</button>
      <button class="btn amber" data-lens="murch" onclick="setLens('murch')">MURCH</button>
      <button class="btn amber" data-lens="trurl" onclick="setLens('trurl')">TRURL</button>
      <button class="btn amber" data-lens="klapaucius" onclick="setLens('klapaucius')">KLAP</button>
      <button class="btn amber" data-lens="novelty" onclick="setLens('novelty')">NOVELTY</button>
      <a class="btn cyan" href="wg-studio-stgl.html">[4D GRID]</a>
      <a class="btn" href="wg-studio-screens.html">[68 SCREENS]</a>
    </div>
  </div>

  <!-- 2. MAIN CINEMA STAGE: TWO LARGE, CLEAN 16:9 VIDEO MONITORS -->
  <div class="cinema-stage">
    <!-- LEFT SCREEN: 1983 ORIGINAL FILM -->
    <div class="screen-wrap">
      <div class="screen-head">
        <span id="hdrMaster" style="color:var(--fg-bright);font-weight:700;">1983 WARGAMES // S01-B01</span>
        <span id="hdrTopo" style="color:var(--cyan);">HELICAL CORKSCREW</span>
      </div>
      <div class="video-16x9" onclick="togglePlay()">
        <video id="vidMaster" autoplay muted playsinline webkit-playsinline preload="auto"></video>
        <svg id="svgMaster" viewBox="0 0 160 90" preserveAspectRatio="none"></svg>
      </div>
      <div class="sub-bar" id="subMaster">Loading dialogue...</div>
    </div>

    <!-- RIGHT SCREEN: FOUND ARCHIVAL COUNTER-CUT -->
    <div class="screen-wrap">
      <div class="screen-head">
        <span id="hdrCut" style="color:var(--amber);font-weight:700;">ARCHIVE CUT // SYNTHESIS</span>
        <span id="hdrCutMeta" style="color:#99e6b3;">--</span>
      </div>
      <div class="video-16x9" onclick="nextLens()">
        <img class="vid-fallback" id="imgCutFallback" alt="">
        <video id="vidCut" autoplay muted playsinline webkit-playsinline preload="auto"></video>
        <svg id="svgCut" viewBox="0 0 160 90" preserveAspectRatio="none"></svg>
      </div>
      <div class="sub-bar" id="subCut" style="color:var(--amber);">Click right screen or top buttons to switch among the 10 cuts</div>
    </div>
  </div>

  <!-- 3. STILL HORIZONTAL WORM TRACK (f1..f8 LEFT TO RIGHT — NO SPINNING!)
       Shows the 8 sub-frames of the shot with the Cyan Dot (action center), Circle (spread), and Core/Background Color Bar -->
  <div class="worm-track-row" id="strip8"></div>

  <!-- 4. BOTTOM 105-SCENE FILMSTRIP -->
  <div class="filmstrip" id="filmstrip"></div>
</div>

<audio id="sceneAudio" preload="auto"></audio>

<script>
const LENS_KEYS = ['synthesis','clip','vjepa','blip','cineosis','murch','trurl','klapaucius','novelty'];
let SHOTS = [], CUR = 0, TAU = 0, LENS = 'synthesis';
let PLAYING = true, SOUND_ON = false, SHOW_OVERLAY = true;

async function init() {
  const res = await fetch('wargames-worm-volume.json');
  const data = await res.json();
  SHOTS = data.beats || [];
  renderFilmstrip();
  setupKeys();
  if (SHOTS.length) selectShot(0);
  requestAnimationFrame(loop);
}

function toggleOverlay() {
  SHOW_OVERLAY = !SHOW_OVERLAY;
  document.body.classList.toggle('hide-overlay', !SHOW_OVERLAY);
  const btn = document.getElementById('btnOverlay');
  btn.textContent = SHOW_OVERLAY ? '[DOT/CIRCLE: ON]' : '[DOT/CIRCLE: OFF]';
  btn.classList.toggle('on', SHOW_OVERLAY);
}

function setLens(l) {
  LENS = l;
  document.querySelectorAll('#lensBar button[data-lens]').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-lens') === l);
  });
  if (SHOTS[CUR]) syncCutVideo(SHOTS[CUR], TAU);
}

function nextLens() {
  const idx = (LENS_KEYS.indexOf(LENS) + 1) % LENS_KEYS.length;
  setLens(LENS_KEYS[idx]);
}

function toggleSound() {
  SOUND_ON = !SOUND_ON;
  const btn = document.getElementById('btnSound');
  btn.textContent = SOUND_ON ? '[SOUND: ON]' : '[UNMUTE SOUND]';
  btn.classList.toggle('on', !SOUND_ON);
  if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
}

function syncAudio(sh) {
  const aud = document.getElementById('sceneAudio');
  if (!SOUND_ON || !PLAYING) { aud.pause(); return; }
  const src = sh.audio_orig;
  if (!src) return;
  if (aud.dataset.src !== src) { aud.dataset.src = src; aud.src = src; }
  aud.currentTime = 0;
  aud.play().catch(() => {});
}

function togglePlay() {
  PLAYING = !PLAYING;
  const btn = document.getElementById('btnPlay');
  btn.textContent = PLAYING ? '[PAUSE]' : '[PLAY]';
  btn.classList.toggle('on', PLAYING);
  const vA = document.getElementById('vidMaster');
  const vB = document.getElementById('vidCut');
  const aud = document.getElementById('sceneAudio');
  if (PLAYING) {
    vA.play().catch(() => {});
    vB.play().catch(() => {});
    if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
  } else {
    vA.pause(); vB.pause(); aud.pause();
  }
}

function renderFilmstrip() {
  const el = document.getElementById('filmstrip');
  el.innerHTML = SHOTS.map((s, i) => `
    <div class="tile-16x9 ${i === CUR ? 'active' : ''}" id="tile_${i}" onclick="selectShot(${i})">
      <img src="${s.thumb}" loading="lazy" alt="">
      <div class="tile-id">${s.id}</div>
    </div>
  `).join('');
}

function renderStrip8(sh) {
  const el = document.getElementById('strip8');
  const frames = sh.worm_frames || [];
  const W = 160, H = 90;
  el.innerHTML = frames.map((wf, k) => {
    const ux = wf.u * W, uy = wf.v * H, rx = wf.r * W, ry = wf.r * H;
    const prev = k > 0 ? frames[k-1] : wf;
    return `
      <div class="f-card ${k === TAU ? 'active' : ''}" id="fc_${k}" onclick="onTapSubframe(${k})"
           title="f${k+1}: Dot=(${wf.u.toFixed(2)}, ${wf.v.toFixed(2)}), Circle r=${wf.r.toFixed(2)}">
        <img class="f-strip-img" src="${sh.strip}" style="left:${-(k*100)}%;">
        <svg viewBox="0 0 160 90" preserveAspectRatio="none">
          <line x1="${prev.u*W}" y1="${prev.v*H}" x2="${ux}" y2="${uy}" stroke="#00e5ff" stroke-width="2"/>
          <ellipse cx="${ux}" cy="${uy}" rx="${rx}" ry="${ry}"
                   fill="${wf.core_color.hex}28" stroke="${wf.core_color.hex}" stroke-width="2"/>
          <circle cx="${ux}" cy="${uy}" r="3.5" fill="#00e5ff" stroke="#fff" stroke-width="0.8"/>
        </svg>
        <div class="f-num">f${k+1}</div>
        <div class="f-color-bar">
          <div style="background:${wf.core_color.hex};"></div>
          <div style="background:${wf.shell_color.hex};"></div>
        </div>
      </div>
    `;
  }).join('');
}

function onTapSubframe(k) {
  const sh = SHOTS[CUR];
  if (!sh) return;
  const vA = document.getElementById('vidMaster');
  if (vA.duration > 0) {
    vA.currentTime = ((k + 0.2) / 8.0) * vA.duration;
  }
  setTau(k);
  syncCutVideo(sh, k);
}

function selectShot(idx) {
  if (!SHOTS.length) return;
  CUR = (idx + SHOTS.length) % SHOTS.length;
  const sh = SHOTS[CUR];

  document.getElementById('shotNum').textContent =
    `${String(CUR+1).padStart(3,'0')} / ${String(SHOTS.length).padStart(3,'0')}`;

  document.querySelectorAll('#filmstrip .tile-16x9').forEach((t, i) => t.classList.toggle('active', i === CUR));
  const tile = document.getElementById(`tile_${CUR}`);
  if (tile) tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const vA = document.getElementById('vidMaster');
  vA.src = sh.video;
  vA.currentTime = 0;
  if (PLAYING) vA.play().catch(() => {});

  document.getElementById('hdrMaster').textContent = `1983 WARGAMES // ${sh.id} (${sh.shot_id}) · ${sh.book_title || ''}`;
  document.getElementById('hdrTopo').textContent = `WORM: ${sh.topology.replace(/_/g, ' ')}`;
  document.getElementById('subMaster').textContent =
    `${sh.who ? sh.who + ': ' : ''}"${sh.fulcrum_line || ''}"`;

  renderStrip8(sh);
  setTau(0);
  syncCutVideo(sh, 0);
  syncAudio(sh);
}

function stepShot(d) { selectShot(CUR + d); }

function setTau(k) {
  const sh = SHOTS[CUR];
  if (!sh || !sh.worm_frames || !sh.worm_frames[k]) return;
  TAU = k;
  document.querySelectorAll('.f-card').forEach((c, idx) => c.classList.toggle('active', idx === k));
  const wf = sh.worm_frames[k];
  renderMasterOverlay(sh, wf);
}

function renderMasterOverlay(sh, wf) {
  const svg = document.getElementById('svgMaster');
  const W = 160, H = 90;
  const wFrames = sh.worm_frames || [];
  const spine = wFrames.map(f => `${f.u*W},${f.v*H}`).join(' ');
  const ux = wf.u * W, uy = wf.v * H, rx = wf.r * W, ry = wf.r * H;

  svg.innerHTML = `
    <polyline points="${spine}" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
    <ellipse cx="${ux}" cy="${uy}" rx="${rx}" ry="${ry}"
             fill="none" stroke="${wf.core_color.hex}" stroke-width="1.8"/>
    <circle cx="${ux}" cy="${uy}" r="3" fill="#00e5ff" stroke="#fff" stroke-width="0.6"/>
  `;
}

function syncCutVideo(sh, k) {
  const cw = (sh.cuts_10_worms || []).find(c => c.cut_lens === LENS) || (sh.cuts_10_worms || [])[0];
  const vB = document.getElementById('vidCut');
  const fb = document.getElementById('imgCutFallback');
  const svgB = document.getElementById('svgCut');

  if (!cw || !cw.subshots || !cw.subshots.length) {
    vB.src = sh.video;
    fb.style.display = 'none';
    if (PLAYING) vB.play().catch(() => {});
    svgB.innerHTML = '';
    return;
  }

  const sIdx = Math.min(cw.subshots.length - 1, Math.floor((k / 8.0) * cw.subshots.length));
  const sub = cw.subshots[sIdx];

  document.getElementById('hdrCut').textContent = `ARCHIVE CUT // ${LENS.toUpperCase()} (${sIdx+1}/${cw.subshots.length})`;
  document.getElementById('hdrCutMeta').textContent = `${sub.title || ''} (${sub.year || ''})`;
  document.getElementById('subCut').textContent = sub.spoken ? `"${sub.spoken}"` : `${sub.title || ''} (${sub.year || ''})`;

  if (sub.thumb) { fb.src = sub.thumb; fb.style.display = 'block'; }
  const url = sub.media_url || '';
  if (url && vB.dataset.src !== url) {
    vB.dataset.src = url;
    vB.src = url;
    vB.onloadeddata = () => {
      fb.style.display = 'none';
      if (sub.t0) { try { vB.currentTime = sub.t0; } catch(e) {} }
      if (PLAYING) vB.play().catch(() => {});
    };
    vB.onerror = () => { fb.style.display = 'block'; };
  } else if (PLAYING && vB.paused) {
    vB.play().catch(() => {});
  }

  const W = 160, H = 90;
  const pt = (cw.pts_uvr && cw.pts_uvr[k]) || [sub.u || 0.5, sub.v || 0.5, sub.r || 0.22];
  const allPts = (cw.pts_uvr || []).map(p => `${p[0]*W},${p[1]*H}`).join(' ');
  const col = sub.core_hex || cw.core_hex || '#ffb000';
  svgB.innerHTML = `
    <polyline points="${allPts}" fill="none" stroke="#ffb000" stroke-width="1.4"/>
    <ellipse cx="${pt[0]*W}" cy="${pt[1]*H}" rx="${pt[2]*W}" ry="${pt[2]*H}"
             fill="none" stroke="${col}" stroke-width="1.8"/>
    <circle cx="${pt[0]*W}" cy="${pt[1]*H}" r="3" fill="#00e5ff" stroke="#fff" stroke-width="0.6"/>
  `;
}

function loop() {
  const sh = SHOTS[CUR];
  const vA = document.getElementById('vidMaster');
  if (PLAYING && sh) {
    if (vA.ended) {
      selectShot(CUR + 1);
    } else if (vA.duration > 0) {
      const k = Math.min(7, Math.floor((vA.currentTime / vA.duration) * 8));
      if (k !== TAU) {
        setTau(k);
        syncCutVideo(sh, k);
      }
    }
  }
  requestAnimationFrame(loop);
}

function setupKeys() {
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); stepShot(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepShot(-1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); nextLens(); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
}

init();
</script>
</body>
</html>
