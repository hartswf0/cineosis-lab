<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slopfeeder Chapters</title>
<meta name="description" content="The eight SLOPFEEDER music videos as eight chapters and eight bets on how Cineosis makes meaning: arcs, signs, symbols, the four's lives, and the AI moments still to generate, with references and prompts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a1f'/%3E%3Cpath d='M8.5 25 L11.5 11 H20.5 L23.5 25 Z' fill='%23f25a17'/%3E%3Crect x='7.5' y='24' width='17' height='3' rx='1.2' fill='%23f25a17'/%3E%3Cpath d='M16 11 V5' stroke='%23e9e1cf' stroke-width='2'/%3E%3Cpath d='M10 7 H22' stroke='%23b98a5a' stroke-width='2.2'/%3E%3C/svg%3E">
<meta name="theme-color" content="#14171c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#14171c; --deep:#0e1014; --ink:#ece4d4; --dim:#8d939c; --faint:#272c34; --orange:#f25a17; --purple:#5600f5; --yellow:#e6c808; --sans:'Barlow Condensed',Impact,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Cormorant Garamond',Georgia,serif;
  --LANDING:#d8452b; --FLEET:#3a6ea8; --RENDER:#5600f5; --SCREEN:#3fa57a; --KITCHEN:#e8a32c; --DRILL:#b98a5a; --TIDE:#4f8f9c; --AFTERMATH:#6d6f75; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; } body{ background:var(--bg); color:var(--ink); font:400 12px var(--mono); overflow:hidden; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; } a{ color:var(--dim); }
#app{ height:100dvh; display:grid; grid-template-columns:250px minmax(0,1fr); }
aside{ border-right:1px solid var(--faint); overflow:auto; padding:14px 10px; } aside h1{ font:700 20px var(--sans); letter-spacing:.14em; margin:0 6px 4px; } aside h1 b{ color:var(--orange); }
aside .sub{ color:var(--dim); font-size:10px; margin:0 6px 12px; line-height:1.5; } aside nav a{ display:block; color:var(--dim); text-decoration:none; font:600 12px var(--sans); letter-spacing:.14em; margin:0 6px 10px; }
.ch{ display:block; width:100%; text-align:left; padding:8px; border-radius:3px; margin-bottom:4px; border:1px solid transparent; } .ch.on{ border-color:var(--orange); background:#21140e; }
.ch b{ display:block; font:700 15px var(--sans); letter-spacing:.08em; } .ch span{ color:var(--dim); font-size:10px; } .ch i{ font-style:normal; color:var(--orange); font:700 13px var(--sans); margin-right:6px; }
main{ overflow:auto; padding:18px 22px 40px; } h2{ font:700 30px var(--sans); letter-spacing:.06em; margin:0; } h3{ font:700 13px var(--sans); letter-spacing:.2em; color:var(--orange); margin:22px 0 8px; }
.song{ color:var(--dim); margin:2px 0 12px; } .idea{ font:italic 400 21px/1.4 var(--serif); max-width:900px; color:#e9e1cf; margin:0 0 10px; } .bet{ max-width:900px; line-height:1.55; color:#cfc8ba; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; } .chip{ border:1px solid var(--faint); border-radius:12px; padding:3px 9px; font-size:10.5px; } .chip b{ color:var(--yellow); font-weight:500; }
.sign{ border:1px solid var(--faint); border-radius:3px; padding:7px 9px; max-width:290px; } .sign b{ font:700 18px var(--sans); color:var(--yellow); margin-right:6px; } .sign div{ color:var(--dim); font-size:10.5px; line-height:1.45; margin-top:3px; }
.triad{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; max-width:1100px; } .triad div{ background:var(--deep); border:1px solid var(--faint); border-radius:3px; padding:10px; font:italic 400 17px/1.35 var(--serif); } .triad small{ display:block; font:600 11px var(--sans); letter-spacing:.18em; color:var(--dim); font-style:normal; margin-bottom:4px; }
.two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; max-width:1100px; } .two div{ border-left:3px solid var(--faint); padding:4px 10px; font:italic 400 17px/1.4 var(--serif); } .two small{ display:block; font:600 11px var(--sans); letter-spacing:.18em; color:var(--dim); font-style:normal; }
ul.sym{ margin:0; padding-left:18px; line-height:1.7; max-width:1000px; }
.arc{ display:flex; height:34px; border-radius:2px; overflow:hidden; max-width:1100px; } .arc div{ display:grid; place-items:center; font:700 11px var(--sans); letter-spacing:.08em; color:#0c0c0c; border-right:2px solid var(--bg); overflow:hidden; white-space:nowrap; }
.rc{ display:grid; grid-template-columns:minmax(0,640px) minmax(0,1fr); gap:14px; align-items:start; max-width:1200px; } .rc video{ width:100%; background:#000; border-radius:2px; } .cov{ font-size:11px; line-height:1.7; color:var(--dim); } .cov b{ color:var(--ink); font-weight:500; }
#shots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:14px; } .shot{ background:var(--deep); border:1px solid var(--faint); border-radius:3px; padding:12px; }
.shot h4{ margin:0 0 6px; font:700 17px var(--sans); letter-spacing:.04em; } .shot h4 span{ color:var(--orange); margin-right:8px; } .refs{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:8px 0; }
.ref{ position:relative; aspect-ratio:16/10; background:#000 center/cover; border-radius:2px; cursor:pointer; } .ref span{ position:absolute; left:0; right:0; bottom:0; font-size:9px; padding:2px 4px; background:#000b; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pr{ font-size:11px; line-height:1.55; color:#cfc8ba; } .btn{ border:1px solid var(--faint); border-radius:2px; padding:5px 10px; font:600 12px var(--sans); letter-spacing:.12em; margin-top:8px; } .btn:hover{ border-color:var(--orange); }
details{ margin-top:6px; } summary{ cursor:pointer; color:var(--dim); font-size:10.5px; } details p{ font-size:10.5px; line-height:1.55; color:#b8b1a4; white-space:pre-wrap; }
.hero{ background:var(--deep); border:1px solid var(--faint); border-radius:3px; padding:12px; max-width:1100px; font-size:11.5px; line-height:1.6; color:#cfc8ba; }
#pick{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; } .pk{ background:var(--deep); border:1px solid var(--faint); border-radius:3px; padding:8px; } .pk video{ width:100%; aspect-ratio:16/9; background:#000; border-radius:2px; } .pk b{ font:700 14px var(--sans); letter-spacing:.04em; }
.pk .sh{ font-size:10px; color:var(--dim); line-height:1.6; margin-top:4px; } .flag{ color:var(--orange); }
#view{ position:fixed; inset:0; background:#000d; display:none; place-items:center; z-index:9; padding:16px; } #view.on{ display:grid; } #view video, #view img{ max-width:min(1100px,100%); max-height:86dvh; } #view p{ text-align:center; color:var(--ink); }
@media (max-width:900px){ body{ overflow:auto; } #app{ height:auto; grid-template-columns:1fr; } aside{ border-right:0; border-bottom:1px solid var(--faint); } .triad, .two, .rc{ grid-template-columns:1fr; } #shots{ grid-template-columns:1fr; } }
</style></head><body>
<div id="app">
  <aside><h1>SLOP<b>FEEDER</b></h1><div class="sub">Eight songs, eight chapters, eight bets on how the lab makes meaning. A tool between montage, collage and a feed: working with slop in all its forms, shaping and steering it.</div>
    <nav><a href="griddle.html" style="color:#f25a17">THE GRIDDLE · EDIT ↗</a><a href="slopfeeder-studio.html">THE OLD STUDIO ↗</a><a href="slopfeeder-cartoon.html">THE CARTOONS ↗</a><a href="slopfeeder.html">THE WORLD ↗</a></nav><div id="chs"></div>
    <button class="ch" id="pkbtn"><b>THE PICKUPS</b><span>44 AI clips, read shot by shot</span></button></aside>
  <main id="main"></main>
</div>
<div id="view"><div id="vbox"></div></div>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const COL = w => getComputedStyle(document.documentElement).getPropertyValue('--' + w.replace('THE ', '').split(' ')[0]).trim() || '#888';
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  let B = null, AI = null;
  function view(html) { $('#vbox').innerHTML = html; $('#view').classList.add('on'); } $('#view').onclick = e => { if (e.target.id === 'view') { $('#vbox').innerHTML = ''; $('#view').classList.remove('on'); } };
  const copy = t => navigator.clipboard && navigator.clipboard.writeText(t);
  function chapter(i) { const c = B.chapters[i]; $$('.ch').forEach((b, k) => b.classList.toggle('on', k === i)); const dur = c.dur || 1;
    $('#main').innerHTML = `<h2>${esc(c.roman)} · ${esc(c.title)}</h2><div class="song">${esc(c.song)} · ${Math.round(c.dur || 0)} s · ${c.tempo || ''} bpm${c.note ? ' · “' + esc(c.note) + '”' : ''}</div>
      <p class="idea">${esc(c.idea)}</p><div class="bet"><b style="color:var(--orange)">THE BET ·</b> ${esc(c.bet)}</div>
      <h3>THE SIGNS (OF THE 45)</h3><div class="chips">${c.signs_full.map(s => `<div class="sign"><b>${esc(s.symbol)}</b>${esc(s.name)}<div>${esc(s.definition)}</div></div>`).join('')}</div>
      <h3>THE LIE, ITS BREAKING, AND AFTER</h3><div class="triad"><div><small>THE LIE</small>${esc(c.lie)}</div><div><small>THE SHATTERING</small>${esc(c.shatter)}</div><div><small>THE PRINCIPLE</small>${esc(c.principle)}</div></div>
      <h3>THE FOUR IN THIS CHAPTER</h3><p class="idea" style="font-size:18px">${esc(c.four)}</p>
      <h3>SYMBOLS</h3><ul class="sym">${c.symbols.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <h3>TWO WAYS OF SEEING THE SAME BEACH</h3><div class="two"><div><small>EMBEDDED · FIRST PERSON</small>${esc(c.first)}</div><div><small>WORLD-WATCHER · THE SMALL WITNESS</small>${esc(c.watcher)}</div></div>
      <h3>THE ARC OVER THE SONG</h3><div class="arc">${c.arc.map(a => `<div style="flex:${a.t1 - a.t0};background:${COL(a.world)}" title="${fmt(a.t0)}–${fmt(a.t1)} · ${esc(a.sound.join(', '))} · energy ${a.energy}">${esc(a.world.replace('THE ', ''))}</div>`).join('')}</div>
      <h3>THE ROUGH CUT</h3><div class="rc"><video src="slopfeeder/roughcut/song-${c.n}-archive.mp4" controls playsinline preload="metadata"></video>
        <div class="cov">Cut from the plan: the chapter's cartoons open their parts of the world, the AI pickups and the archive alternate on the beat, and this chapter's moments-to-generate sit on stand-ins until they exist.<br><br>${Object.entries(c.coverage).map(([w, v]) => `<b>${esc(w.replace('THE ', ''))}</b> · ${v.ai} pickup shots · ${esc(v.povs.join(', ') || 'none yet')}`).join('<br>')}</div></div>
      <h3>WHAT TO GENERATE NEXT · ${c.shots.length} AI MOMENTS</h3><div id="shots">${c.shots.map((s, k) => `<div class="shot"><h4><span>${esc(s.id)}</span>${esc(s.moment)}</h4>
        <div class="chips"><span class="chip" style="border-color:${COL(s.world)}">${esc(s.world.replace('THE ', ''))}</span><span class="chip"><b>${esc(s.sign)}</b> ${esc(s.sign_name)}</span><span class="chip">${esc(s.pov)}</span><span class="chip">${esc(s.blend)}</span></div>
        <div class="refs"><div class="ref" data-img="slopfeeder/${esc(s.refs.frame.src)}" style="background-image:url('slopfeeder/${esc(s.refs.frame.src)}')"><span>series frame</span></div>
          <div class="ref" data-vid="slopfeeder/${esc(s.refs.pickup.web)}" data-t="${s.refs.pickup.t0}" style="background-image:url('slopfeeder/${esc(s.refs.pickup.key)}')"><span>nearest pickup</span></div>
          ${s.refs.archive ? `<div class="ref" data-vid="${esc(s.refs.archive.v)}" style="background-image:url('${esc(s.refs.archive.t)}')"><span>archive · ${esc(s.refs.archive.title)}</span></div>` : '<div></div>'}
          ${s.refs.model_sheet ? `<div class="ref" data-img="slopfeeder/${esc(s.refs.model_sheet)}" style="background-image:url('slopfeeder/${esc(s.refs.model_sheet)}')"><span>the four · model sheet</span></div>` : '<div></div>'}</div>
        <div class="pr">${esc(s.prompt)}</div><div class="chips" style="margin-top:6px"><span class="chip">HOLD · ${esc(s.hold.join('; '))}</span><span class="chip">VARY · ${esc(s.vary.join('; '))}</span></div>
        <button class="btn" data-copy="${k}">COPY THE FULL PROMPT</button><details><summary>the full prompt (${s.full_prompt.length} characters)</summary><p>${esc(s.full_prompt)}</p></details></div>`).join('')}</div>
      <h3>THE HERO PROMPT FOR THE WHOLE CHAPTER</h3><div class="hero">${esc(c.hero)}</div><button class="btn" id="cphero">COPY THE HERO PROMPT</button>`;
    $$('[data-copy]').forEach(b => b.onclick = () => { copy(c.shots[+b.dataset.copy].full_prompt); b.textContent = 'COPIED'; setTimeout(() => b.textContent = 'COPY THE FULL PROMPT', 1400); });
    $('#cphero').onclick = () => copy(c.hero);
    $$('.ref[data-img]').forEach(d => d.onclick = () => view(`<img src="${d.dataset.img}">`));
    $$('.ref[data-vid]').forEach(d => d.onclick = () => { view(`<video src="${d.dataset.vid}" controls autoplay playsinline></video>`); const v = $('#vbox video'); if (d.dataset.t) v.addEventListener('loadedmetadata', () => v.currentTime = +d.dataset.t, { once: true }); });
    $('#main').scrollTop = 0; }
  function pickups() { $$('.ch').forEach(b => b.classList.toggle('on', b.id === 'pkbtn'));
    const S = AI.clips.flatMap(c => c.shots), n = S.length, cnt = k => S.filter(s => s.world === k).length;
    $('#main').innerHTML = `<h2>THE PICKUPS</h2><div class="song">${AI.clips.length} clips generated from the studio's prompts · split at their own cuts into ${n} shots · each read by CLIP for its world, its camera, its motifs, its archival rhyme and the series frame it grew from</div>
      <p class="bet">The coverage tilts: ${cnt('THE LANDING')} of ${n} shots are the landing, almost all medium or embedded; there are no true wide establishing shots, ${S.filter(s => s.pov === 'witness').length} hovering-witness shots, ${S.filter(s => s.pov === 'face').length} faces, and the four appear in only ${S.filter(s => s.motifs.includes('characters')).length}. The chapters' moments-to-generate fill those gaps. Riverbed failures to watch for: the four rendered as 3-D or plush figures (they must stay flat), burned-in subtitles (flagged), pails turned right-side up.</p>
      <div id="pick">${AI.clips.map(c => `<div class="pk"><video src="slopfeeder/${esc(c.web)}" muted loop playsinline preload="none" onmouseenter="this.play()" onmouseleave="this.pause()" controls></video><b>${esc(c.title)}</b>
        <div class="sh">${c.shots.map(s => `${s.t0}–${s.t1} s · <span style="color:${COL(s.world)}">${esc(s.world.replace('THE ', ''))}</span> · ${esc(s.pov)} · ${esc(s.motifs.join(', '))}${s.motifs.includes('subtitle') ? ' <span class="flag">· burned-in text</span>' : ''} · rhymes with ${esc((s.rhyme.title || '').slice(0, 34))}`).join('<br>')}</div></div>`).join('')}</div>`; $('#main').scrollTop = 0; }
  Promise.all([fetch('slopfeeder/bible.json').then(r => r.json()), fetch('slopfeeder/ai/ai.json').then(r => r.json())]).then(([b, a]) => { B = b; AI = a;
    $('#chs').innerHTML = B.chapters.map((c, i) => `<button class="ch" data-i="${i}"><i>${esc(c.roman)}</i><b style="display:inline">${esc(c.title)}</b><span style="display:block">${esc(c.song)}</span></button>`).join('');
    $$('.ch[data-i]').forEach(b => b.onclick = () => chapter(+b.dataset.i)); $('#pkbtn').onclick = pickups; chapter(0); });
})();
</script></body></html>
