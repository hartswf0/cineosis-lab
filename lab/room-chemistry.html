<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Chemistry, on Trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- CINEOSIS · A ROOM, FILMED · NARRATIVE CHEMISTRY, ON TRIAL. The chemistry rooms (chemistry.html, compounds.html,
     chemistry-trials.html) treat signs as atoms and cuts as bonds. Four predictions were fixed before the first run; three were
     refuted. This film shows the theory, the blind test, the verdicts, the vacuity (no pair of signs is forbidden), the pattern
     the theory has no word for, and the one idea that held: same atoms, different order, different film.
     Data: explain/lchem.py -> explain/lesson/chem.json, from chemistry/trials.json and chemistry/TRIALS.md. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; --atom: #f2c14e; }
body, #stage { background: var(--bg); }
.mol { position: absolute; left: 80px; right: 80px; top: 120px; height: 420px; }
.mol .at { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: grid; place-items: center; background: #1d1b17; border: 3px solid var(--atom); font: 600 44px var(--serif); color: var(--ink); opacity: 0; transform: scale(.6); transition: opacity .6s, transform .6s; }
.mol .at small { position: absolute; top: 128px; width: 220px; left: -50px; text-align: center; font: 13px var(--mono); color: var(--dim); }
.mol .at.on { opacity: 1; transform: none; }
.mol svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.reading { position: absolute; left: 120px; right: 120px; top: 580px; font: italic 26px/1.35 var(--serif); color: var(--dim); opacity: 0; transition: opacity 1s; }
.strips { position: absolute; left: 40px; right: 40px; top: 40px; display: flex; flex-direction: column; gap: 14px; }
.strips .row { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: center; opacity: 0; transition: opacity .6s; } .strips .row.on { opacity: 1; }
.strips .row b { font: 600 14px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--c); text-align: right; }
.strips .row div { display: flex; gap: 2px; height: 76px; } .strips .row div i { flex: 1; background: #111 center/cover; }
.dist { position: absolute; left: 80px; right: 80px; top: 60px; display: flex; flex-direction: column; gap: 18px; }
.dist div { display: grid; grid-template-columns: 290px 1fr 80px; gap: 16px; align-items: center; font: 22px var(--serif); color: var(--ink); opacity: 0; transition: opacity .5s; } .dist div.on { opacity: 1; }
.dist i { height: 36px; background: var(--c); width: 0; transition: width 1.2s cubic-bezier(.3,.7,.3,1); } .dist b { font: 600 20px var(--mono); text-align: right; }
.vd { position: absolute; left: 100px; right: 100px; top: 70px; display: flex; flex-direction: column; gap: 30px; }
.vd div { display: grid; grid-template-columns: 70px 1fr 220px; gap: 24px; align-items: center; opacity: 0; transition: opacity .6s; } .vd div.on { opacity: 1; }
.vd .k { font: 600 34px var(--mono); color: var(--dim); } .vd p { margin: 0; font: 25px/1.3 var(--serif); color: var(--ink); }
.vd .st { font: 600 22px var(--mono); letter-spacing: .14em; text-align: center; padding: 12px; border: 3px solid var(--sc); color: var(--sc); transform: rotate(-4deg) scale(1.6); opacity: 0; transition: all .35s cubic-bezier(.3,1.6,.5,1); } .vd .st.on { transform: rotate(-4deg); opacity: 1; }
.vac { position: absolute; left: 160px; right: 160px; top: 70px; display: grid; grid-template-columns: repeat(46, 1fr); gap: 5px; }
.vac i { aspect-ratio: 1; border-radius: 50%; background: #3a362f; transition: background .3s; } .vac i.ok { background: var(--lime); }
.adj { position: absolute; left: 80px; right: 80px; top: 70px; display: grid; grid-template-columns: 180px repeat(6, 1fr); gap: 8px; font: 18px var(--mono); }
.adj > div { height: 92px; display: grid; place-items: center; color: var(--ink); border-radius: 4px; opacity: 0; transition: opacity .5s; } .adj > div.on { opacity: 1; } .adj .h { height: 40px; color: var(--dim); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: 1; }
.adj .cn { font-weight: 600; color: var(--lime); justify-content: end; text-transform: uppercase; letter-spacing: .1em; }
.two { position: absolute; left: 40px; right: 40px; top: 40px; height: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two figure { margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; } .two .scn { position: relative; inset: auto; height: 100%; } .two figcaption { padding-top: 8px; font: 600 15px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); }
.two .chips { display: flex; gap: 6px; padding-top: 8px; } .two .chips span { font: 600 18px var(--serif); padding: 4px 10px; border-radius: 14px; border: 2px solid var(--atom); color: var(--ink); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · A ROOM, FILMED</p><h1 style="font-weight:600;color:#ece6da">Narrative Chemistry, on Trial</h1><p>A theory of signs as atoms, four predictions written down first, and what happened to them. About six minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script src="explain/lesson.js?v=3"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/chem.json?v=1'],
  cues: ['dae-cedar-tank-splash', 'dae-preparation-drift', 'dae-slide-carousel-at-blue-hour', 'dae-cold-current-paddle', 'dae-salvaged-room-traveling-light', 'dae-compass-spin-in-heavy-fog', 'dae-snowbound-umea-cabin', 'dae-cedar-and-cassette'],
  build(D, B, K) {
    const C = D[0], esc = LX.esc, SY = C.signs, SN = C.sign_names, P1 = C.poems[0], P7 = C.poems[1], AU = C.audio;
    const NAMES = { 'B-random': 'random', 'B-taxonomy': 'ordinary taxonomy', 'G-bond': 'strongest bond', 'G-resonance': 'resonance', 'G-break': 'one break', 'G-compound': 'blind compound', 'G-isomer': 'its isomer', 'cuts ceiling': 'the cuts to each other' };
    const GC = { 'B-random': '#a29d90', 'B-taxonomy': '#d8d0c0', 'G-bond': '#f2c14e', 'G-resonance': '#ffb86b', 'G-break': '#ff9f8e', 'G-compound': '#c9a4ff', 'G-isomer': '#8ea6ff', 'cuts ceiling': '#c4f46a' };
    const differ = (p, a, b) => { const A = p.films[a], Bf = p.films[b]; const i = A.findIndex((x, k) => !Bf[k] || x.video !== Bf[k].video); const t = i < 0 ? p.t0 + 1 : Math.max(p.t0, A[i].t0 - 4); return [t, t + 15]; };
    const sc = (p, g) => ({ audio: AU, pics: p.films[g].map(s => ({ sw: s.t0, video: s.video, in: s.in || 0 })) });
    const pos = [[12, 50], [30, 22], [30, 78], [52, 50], [72, 22], [88, 60]];
    function molecule(p) { const at = p.compound.slice(0, 6);
      return `<div class="mol"><svg>${at.slice(1).map((a, i) => `<line class="bd" x1="${pos[i][0]}%" y1="${pos[i][1]}%" x2="${pos[i + 1][0]}%" y2="${pos[i + 1][1]}%" stroke="#f2c14e" stroke-width="4" opacity="0" style="transition:opacity .6s"/>`).join('')}</svg>
        ${at.map((a, i) => `<div class="at" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${esc(SY[a] || a)}<small>${esc(SN[a] || '')}</small></div>`).join('')}</div>`; }
    function grow(el, at = .6, gap = 1) { el.querySelectorAll('.mol .at').forEach((a, i) => K.later((at + i * gap) * 1000, () => { a.classList.add('on'); LX.tick(700 + i * 90, .08, .03); if (i) el.querySelectorAll('.mol .bd')[i - 1].setAttribute('opacity', 1); })); }

    /* COLD OPEN · a molecule for a poem */
    B('Cold open', 15, () => molecule(P7) + `<div class="reading">${esc(P7.natural.reading.split('. ').slice(0, 2).join('. '))}.</div>` + LX.band([[.3, 'A theory of editing should at least beat cutting at random.'], [5, 'This one treats signs as atoms and cuts as bonds, and it lost to random.'], [10, `Here is how it sees one poem: a molecule called <em>${esc(P7.natural.name)}</em>.`]]),
      el => { LX.runBand(el, K); grow(el, .8, 1.1); K.later(7600, () => el.querySelector('.reading').style.opacity = 1); });
    B('Cold open', 9, () => `<div class="tc"><small>CINEOSIS · A ROOM, FILMED</small><h1>Narrative Chemistry, on Trial</h1><p>Four predictions, written down before any number was run.</p></div>`, el => LX.ping());

    /* THE TEST · seven films per poem, made blind */
    const gens = C.generators;
    B('The test', 20, () => `<div class="strips">${gens.map(g => `<div class="row" style="--c:${GC[g]}"><b>${NAMES[g]}</b><div>${P7.films[g].map(s => `<i style="background-image:url('${esc(s.thumb)}')"></i>`).join('')}</div></div>`).join('')}</div>`
      + LX.band([[.3, 'The test: for each of the fourteen poems, build seven films blind, without looking at the cuts we already had.'], [8, 'Two without chemistry: random shots, and the ordinary taxonomy\'s best pick. Five built by the chemistry\'s rules.'], [15, 'Then ask: which films come nearest to the cuts?']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.strips .row').forEach((r, i) => K.later(600 + i * 900, () => { r.classList.add('on'); LX.tick(900 + i * 80, .06, .03); })); });
    B('The test', 16, () => `<div class="two"><figure><div class="scn" id="a"></div><figcaption>random</figcaption></figure><figure><div class="scn" id="b"></div><figcaption>strongest bond</figcaption></figure></div>` + LX.band([[.3, 'Two of the seven, side by side, on the same poem: random, and the strongest bond the theory allows.']]),
      el => { LX.runBand(el, K);
        const A = el.querySelector('#a'), Bx = el.querySelector('#b');
        const [a1, b1] = differ(P7, 'B-random', 'G-bond'); K.scene({ querySelector: s => s === '.scn' ? A : null }, sc(P7, 'B-random'), a1, b1, []); sceneMute(Bx, sc(P7, 'G-bond'), a1, b1); });
    function sceneMute(box, s, a, b) { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.className = 'full'; box.appendChild(v); const pics = s.pics; let k = -1; const voice = K.voice();
      K.raf(() => { const t = voice.currentTime || a; let j = 0; pics.forEach((p, i) => { if (p.sw <= t) j = i; }); if (j !== k) { k = j; v.src = pics[j].video; v.addEventListener('loadedmetadata', () => { try { v.currentTime = pics[j].in + Math.max(0, t - pics[j].sw); } catch (e) { } v.play().catch(() => { }); }, { once: true }); } return t < b; }); }

    /* THE DISTANCES */
    const DT = C.metrics.d_trans, keys = Object.keys(DT).sort((a, b) => DT[a] - DT[b]), mx = Math.max(...Object.values(DT));
    B('The verdicts', 17, () => `<div class="dist">${keys.map(g => `<div style="--c:${GC[g]}"><span>${NAMES[g]}</span><i data-w="${(DT[g] / mx * 100).toFixed(1)}"></i><b>${DT[g].toFixed(3)}</b></div>`).join('')}</div>`
      + LX.band([[.3, 'How far each film\'s cuts are from the cut films\' cuts, by the kinds of join they make. Shorter is nearer.'], [8, 'The nearest film is the <b>random</b> one. Every chemistry film is farther away.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.dist div').forEach((d, i) => K.later(500 + i * 600, () => { d.classList.add('on'); d.querySelector('i').style.width = d.querySelector('i').dataset.w + '%'; })); });
    const V = C.verdicts;
    B('The verdicts', 19, () => `<div class="vd">${Object.entries(V).map(([k, v]) => `<div><span class="k">${k}</span><p>${esc(v.claim.replace(/plan\.py cuts/g, 'cut films').replace(/plan\.py cuts’/g, 'cut films\''))}</p><span class="st" style="--sc:${v.holds ? 'var(--lime)' : 'var(--red)'}">${v.holds ? 'HOLDS' : 'REFUTED'}</span></div>`).join('')}</div>`
      + LX.band([[.3, 'The four predictions, as they were written before the first run.'], [11, 'Three refuted. One holds.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.vd > div').forEach((d, i) => { K.later(800 + i * 2200, () => d.classList.add('on')); K.later(2000 + i * 2200, () => { d.querySelector('.st').classList.add('on'); LX.tick(i === 3 ? 900 : 260, .3, .06); }); }); });

    /* VACUITY */
    const VC = C.vacuity;
    B('Forbids nothing', 15, () => `<div class="vac">${Array.from({ length: VC.pairs }, () => '<i></i>').join('')}</div>` + LX.band([[.3, `A law should forbid something. Here are all ${VC.pairs} pairs of signs that meet at a cut in the films.`], [8, `How many does the theory forbid? <b>${VC.forbidden}</b>. Any sign may join any sign. It cannot be broken.`]]),
      el => { LX.runBand(el, K); const is = [...el.querySelectorAll('.vac i')]; K.raf(t => { const n = Math.min(is.length, Math.floor(is.length * Math.max(0, t - 8.5) / 3)); for (let i = 0; i < n; i++) is[i].classList.add('ok'); return t < 12; }); });

    /* WHAT THE CUTS ACTUALLY DO */
    const AJ = C.adjacency, cls = ['same', 'rhyme', 'resonance', 'break', 'unbreak', 'within'], CL = { same: 'same sign held', rhyme: 'rhyme', resonance: 'resonance', break: 'break into time', unbreak: 'back', within: 'within one regime' };
    const zc = z => z >= 2 ? `rgba(196,244,106,${Math.min(1, .25 + z / 8)})` : z <= -2 ? `rgba(224,72,58,${Math.min(1, .25 - z / 8)})` : '#1f1d19';
    B('What the cuts do', 18, () => `<div class="adj"><div class="h"></div>${cls.map(c => `<div class="h">${CL[c]}</div>`).join('')}${Object.entries(AJ).map(([cut, r]) => `<div class="cn on">${cut}</div>${cls.map(c => `<div style="background:${zc(r[c].z)};color:${r[c].z >= 2 ? '#111' : 'var(--ink)'}">${r[c].z > 0 ? '+' : ''}${r[c].z.toFixed(1)}</div>`).join('')}`).join('')}</div>`
      + LX.band([[.3, 'What the cut films actually do, against shuffles of their own shots. Lime: more than chance. Red: less.'], [8.5, 'The strongest pattern is <b>the same sign held across a cut</b>. The theory has no word for it; it files it under rhyme, which the films avoid.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.adj > div:not(.h):not(.cn)').forEach((d, i) => K.later(600 + i * 90, () => d.classList.add('on'))); });

    /* WHAT HELD · same atoms, different order */
    B('What held', 18, () => `<div class="two"><figure><div class="scn" id="c"></div><figcaption>the blind compound</figcaption><div class="chips">${P7.compound.map(a => `<span>${esc(SY[a] || a)}</span>`).join('')}</div></figure><figure><div class="scn" id="d"></div><figcaption>its isomer: same atoms, bonds reordered</figcaption><div class="chips">${P7.compound.map(a => `<span>${esc(SY[a] || a)}</span>`).join('')}</div></figure></div>`
      + LX.band([[.3, 'The prediction that held: keep the same signs, change only the order of the bonds, and you get a different film.'], [9, 'Order matters as much as which signs are in it. Of the whole theory, that is the part that survived.']]),
      el => { LX.runBand(el, K); const c = el.querySelector('#c'), d = el.querySelector('#d'); const [a2, b2] = differ(P7, 'G-compound', 'G-isomer'); K.scene({ querySelector: s => s === '.scn' ? c : null }, sc(P7, 'G-compound'), a2, b2 + 2, []); sceneMute(d, sc(P7, 'G-isomer'), a2, b2 + 2); });

    /* PRACTICE */
    B('Practice', 16, () => molecule(P1) + LX.band([[.3, `<small>Your turn · ${esc(P1.title)}</small>`]]), el => { LX.runBand(el, K); grow(el, .6, 1.4); });
    B('Practice', 16, () => `<div class="strips">${gens.map(g => `<div class="row on" style="--c:${GC[g]}"><b>${NAMES[g]}</b><div>${P1.films[g].map(s => `<i style="background-image:url('${esc(s.thumb)}')"></i>`).join('')}</div></div>`).join('')}</div>`, el => { });

    /* NOW YOU CAN READ */
    B('Now you can read', 13, () => `<div class="vd">${Object.entries(V).map(([k, v]) => `<div class="on"><span class="k">${k}</span><p>${esc(v.claim.replace(/plan\.py cuts’?/g, 'cut films'))}</p><span class="st on" style="--sc:${v.holds ? 'var(--lime)' : 'var(--red)'}">${v.holds ? 'HOLDS' : 'REFUTED'}</span></div>`).join('')}</div>`
      + LX.band([[.3, 'Now you can read a trial: a prediction written first, a dumb rival to beat, and a verdict.'], [7, 'A theory that loses to random shots has still taught us something: what the films really do.']]), el => LX.runBand(el, K));
    B('Now you can read', 9, () => `<div class="tc"><small>THE ROOMS</small><h1 style="font-size:84px">Narrative Chemistry</h1><p>chemistry.html, compounds.html, chemistry-trials.html: the theory, its instruments, and its trial.</p></div>`, el => LX.ping());
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
