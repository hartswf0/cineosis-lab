<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cineosis Cinema Patch</title>
<meta name="description" content="The Cineosis cinema as an operator console: the film, the line and the archive's answer, and only the part of the patch that is firing now; the whole patch on request.">
<meta name="theme-color" content="#0b0908">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0b0908; --ink:#efe9dd; --dim:#8a8378; --faint:#2a2521; --box:#f4ede1; --boxink:#1d1714; --gold:#e8c070; --red:#d0574f; --taupe:#9c8a76;
  --b1:#1a1614; --b2:#211b17; --b3:#2a201b; --b4:#33231e; --b5:#3d2622; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:12px var(--mono); } button,select{ font:inherit; color:inherit; }
/* one screen, nothing scrolls: bar · film · now · chain · transport */
body{ display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto auto; height:100dvh; }
#bar{ display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--faint); }
#bar a{ color:var(--dim); text-decoration:none; letter-spacing:.16em; font-size:10.5px; white-space:nowrap; } #scene{ flex:1; min-width:0; background:#151110; border:1px solid var(--faint); border-radius:14px; padding:6px 10px; font-size:11.5px; }
#state{ font:600 10px var(--mono); letter-spacing:.18em; padding:4px 9px; border-radius:10px; border:1px solid var(--faint); color:var(--dim); white-space:nowrap; } #state.working{ color:var(--gold); border-color:#5a4e33; } #state.fault{ color:var(--red); border-color:#6b2f2a; }
#film{ position:relative; background:#000; min-height:0; } #film iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
#view{ position:absolute; right:8px; top:8px; z-index:2; display:flex; background:#000a; border:1px solid #ffffff22; border-radius:12px; overflow:hidden; } #view button{ background:none; border:0; padding:5px 10px; font-size:10px; letter-spacing:.14em; color:#bdb5a9; cursor:pointer; } #view button.on{ color:var(--gold); background:#e8c07022; }
#fault{ position:absolute; inset:0; display:none; place-content:center; text-align:center; gap:10px; background:#000d; z-index:3; } #fault.on{ display:grid; } #fault p{ margin:0; color:#e9c9c4; } #fault div{ display:flex; gap:8px; justify-content:center; }
#now{ padding:10px 14px 4px; min-height:0; } #now .who{ font:600 10px var(--mono); letter-spacing:.2em; color:var(--gold); }
#now .call{ font:300 clamp(15px,2.1vw,20px)/1.3 var(--serif); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
#now .ans{ font:italic 300 clamp(15px,2.1vw,20px)/1.3 var(--serif); color:#cfc8bb; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; } #now .src{ font-size:10px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#now mark{ background:none; color:var(--gold); border-bottom:1px solid #e8c07066; } #now .dim{ opacity:.45; }
/* the live chain: only the modules firing now, and what they changed */
#chain{ display:flex; align-items:center; gap:0; padding:6px 14px; min-height:44px; overflow:hidden; }
#chain .n{ flex:none; background:var(--box); color:var(--boxink); font:600 11px var(--mono); padding:6px 9px; border-radius:2px; cursor:pointer; white-space:nowrap; transition:background .3s; } #chain .n.hot{ background:#ffe3a0; }
#chain .w{ flex:1 1 18px; min-width:12px; max-width:60px; height:2px; background:var(--gold); position:relative; overflow:hidden; } #chain .w.red{ background:var(--red); } #chain .w i{ position:absolute; top:-2px; width:6px; height:6px; border-radius:50%; background:#fff; animation:run .7s linear; } @keyframes run{ from{ left:-6px; } to{ left:100%; } }
#chain .c{ flex:0 1 auto; min-width:0; margin-left:10px; color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #chain .c b{ color:var(--ink); font-weight:500; }
#chain .rest{ color:var(--dim); font-size:11px; }
#tx{ display:flex; align-items:center; gap:8px; padding:6px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--faint); }
.ico{ width:46px; height:46px; display:grid; place-items:center; border-radius:50%; background:#151110; border:1px solid var(--faint); cursor:pointer; flex:none; } .ico svg{ width:20px; height:20px; } #bPlay{ width:56px; height:56px; background:#e8c07022; border-color:#5a4e33; color:var(--gold); }
#trace{ flex:1; min-width:0; color:var(--dim); font-size:10.5px; line-height:1.45; overflow:hidden; } #trace div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #trace div:first-child{ color:#cfc8bb; }
.tg{ border:1px solid var(--faint); background:#151110; border-radius:14px; padding:8px 12px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; color:var(--dim); flex:none; } .tg.on{ color:var(--gold); border-color:#5a4e33; }
/* the whole patch, on request, fitted to the screen */
#map{ position:fixed; inset:0; z-index:20; background:#0b0908; display:none; grid-template-rows:auto minmax(0,1fr); } #map.on{ display:grid; }
#map header{ display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--faint); color:var(--dim); font-size:10.5px; letter-spacing:.14em; } #map header b{ color:var(--ink); flex:1; font-weight:600; }
#map svg{ width:100%; height:100%; display:block; } #mapList{ display:none; }
@media (max-width:760px){ #map svg{ display:none; } #mapList{ display:grid; grid-auto-rows:auto; align-content:stretch; gap:0; min-height:0; }
  #mapList section{ padding:8px 12px; border-bottom:1px solid var(--faint); } #mapList h3{ margin:0 0 6px; font:600 9.5px var(--mono); letter-spacing:.18em; color:var(--dim); } #mapList h3 i{ font-style:normal; font-weight:400; letter-spacing:.04em; }
  #mapList .ch{ display:flex; flex-wrap:wrap; gap:5px; } #mapList button{ background:var(--box); color:var(--boxink); border:0; border-radius:2px; padding:5px 7px; font:600 10.5px var(--mono); cursor:pointer; } #mapList button.off{ background:#cfc5b5; } #mapList button.fire{ background:#ffe3a0; box-shadow:0 0 0 2px var(--gold); } }
.box rect.b{ fill:var(--box); stroke:var(--boxink); stroke-width:1.5; } .box text{ font:600 13px var(--mono); fill:var(--boxink); } .box rect.io{ fill:var(--boxink); } .box{ cursor:pointer; } .box.off rect.b{ fill:#cfc5b5; } .box.fire rect.b{ fill:#ffe3a0; } .box .val{ font:500 10px var(--mono); fill:var(--gold); }
.band text{ font:600 10px var(--mono); letter-spacing:.14em; fill:var(--dim); } .col text{ font:600 13px var(--mono); letter-spacing:.12em; fill:var(--ink); }
.cab{ fill:none; stroke-linecap:round; } .cab.event{ stroke:var(--gold); stroke-width:2.2; } .cab.stream{ stroke:var(--ink); stroke-width:2; stroke-dasharray:6 5; } .cab.data{ stroke:var(--taupe); stroke-width:1.6; opacity:.75; } .cab.choice{ stroke:var(--red); stroke-width:2.2; } .cab.feedback{ stroke:var(--ink); stroke-width:5; } .cab.feedback2{ stroke:var(--b2); stroke-width:2; }
.playing .cab.stream{ animation:flow .6s linear infinite; } @keyframes flow{ to{ stroke-dashoffset:-22; } } .msg{ fill:var(--gold); } .msg.red{ fill:var(--red); }
/* a module, explained, beside where it was tapped */
#sheet{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#151110; border-top:1px solid #5a4e33; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .25s; max-height:62dvh; overflow:auto; }
#sheet.on{ transform:none; } #sheet h2{ margin:0 40px 2px 0; font:600 15px var(--mono); } #sheet .f{ color:var(--gold); font-size:11px; } #sheet p{ margin:8px 0; font:italic 300 15px/1.45 var(--serif); color:#d8d1c4; }
#sheet .k{ display:flex; flex-wrap:wrap; gap:6px; } #sheet .k span{ border:1px solid var(--faint); border-radius:12px; padding:3px 9px; font-size:11px; } #sheet .x{ position:absolute; right:10px; top:8px; background:none; border:0; color:var(--ink); font-size:26px; cursor:pointer; }
@media (min-width:1000px){ body{ grid-template-columns:minmax(0,1fr) 400px; grid-template-rows:auto minmax(0,1fr) auto; }
  #bar{ grid-column:1 / 3; } #film{ grid-row:2 / 3; } #now{ grid-column:2; grid-row:2; align-self:start; padding-top:18px; } #chain{ grid-column:2; grid-row:2; align-self:end; flex-wrap:wrap; row-gap:8px; padding-bottom:16px; } #tx{ grid-column:1 / 3; } #now .call, #now .ans{ -webkit-line-clamp:5; } }
</style></head><body>
<div id="bar"><a href="index.html#wall" aria-label="Exit to the lab">◂ LAB</a><select id="scene" aria-label="Scene"></select><span id="state">LOADING</span></div>
<div id="film"><iframe id="scr" title="The Found Odyssey"></iframe><div id="view"><button data-v="grid">GRID</button><button data-v="film">FILM</button></div>
  <div id="fault"><p id="faultMsg">The film stopped answering.</p><div><button class="tg" id="retry">RETRY</button><a class="tg" href="index.html#wall">EXIT</a></div></div></div>
<div id="now"><div class="who" id="who">—</div><div class="call" id="call"></div><div class="ans" id="ans"></div><div class="src" id="src"></div></div>
<div id="chain"><span class="rest">The patch fires here as the film plays.</span></div>
<div id="tx"><button class="ico" id="bPrev" aria-label="Previous line"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="ico" id="bPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
  <button class="ico" id="bNext" aria-label="Next line"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <div id="trace" aria-live="polite"></div><button class="tg" id="mapBtn">MAP</button></div>
<div id="map" aria-label="The whole patch"><header><b>THE WHOLE PATCH</b><span id="mapNow"></span><button class="tg" id="mapX">CLOSE</button></header><svg id="patch" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg><div id="mapList"></div></div>
<div id="sheet" role="dialog" aria-label="Module"><button class="x" id="sheetX" aria-label="Close">×</button><div id="sheetBody"></div></div>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const NS = 'http://www.w3.org/2000/svg', mk = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.append(e); return e; };
  const W = 1200, COLS = { SOUND: 150, WORDS: 450, PICTURE: 760, ARCHIVE: 1040 };
  const BANDS = [['archive', 'ONCE PER ARCHIVE', 'built offline, once', 290], ['scene', 'ONCE PER SCENE', 'built offline, per scene', 340], ['line', 'ONCE PER LINE', 'live', 140], ['few', 'EVERY FEW SECONDS', 'live', 130], ['frame', 'EVERY FRAME', 'live', 160]];
  const M = [
    // once per archive
    ['mia', 'Moving Image Archive', 'archive', 'ARCHIVE', 0, 'movingimagearchive.com', 'A public archive of sponsored, educational, amateur, government and early cinema, searched by meaning, 24 clips a question.', ['1,859 films', '28,611 clips foraged']],
    ['forage', 'Forage', 'archive', 'PICTURE', 0, 'odyssey/forage.py', 'Asks the archive for every beat and shot of the Odyssey: grounds, figures, motions, places, the cast; serial and resumable.', ['1,534 shot questions', 'about 20k new clips']],
    ['clip', 'CLIP eyes', 'archive', 'PICTURE', 1, 'odyssey/ingest.py', 'Every clip seen once: a thumbnail and two image embeddings (OpenAI and LAION ViT-B-32), the space everything else is chosen in.', ['36,538 shots in one space']],
    ['sam', 'SAM figures', 'archive', 'PICTURE', 2, 'seg_track.py', 'Segment Anything cuts the figures out of the shots that need a figure, tracked through the shot, for the storyboards and the Markov-SAM wall.', ['525 clips cut', '806 tracked figures']],
    ['shape', 'Shape & kind', 'archive', 'ARCHIVE', 1, 'aspect/measure.py', 'The frame and the picture inside it (black bars found and agreed across a film), named by the standards of cinema; each film labelled cinema, animation, documentary, sponsored, government, television, amateur or record.', ['cinema 109 films', 'letterbox 104', 'pillarbox 138']],
    ['fetch', 'Fetch sound', 'archive', 'SOUND', 0, 'odyssey/fetch_audio.py', 'The first thirty seconds of every clip, as 48 kHz sound.', ['22,330 clips with sound']],
    ['whisper', 'Whisper words', 'archive', 'WORDS', 1, 'archive_words(_mlx).py', 'Every clip transcribed word by word with its seconds (faster-whisper on the CPU, mlx-whisper on the GPU).', ['27,078 transcribed', '61,770 whole utterances']],
    ['clap', 'CLAP ears', 'archive', 'SOUND', 1, 'odyssey/archive_ears.py', 'Every clip heard: speech, music, field sound or silence, and a man or a woman speaking.', ['speech 13,508', 'music 7,946', 'field 607']],
    // once per scene
    ['script', 'Halfworld script', 'scene', 'WORDS', 0, 'odyssey-halfworld', 'The Odyssey in 24 books, 152 scenes: every line, its speaker, its shots and what each shot must show.', ['152 scenes', '1,474 lines']],
    ['studio', 'Studio voice', 'scene', 'SOUND', 0, 'drive/voice/*.m4a', 'Our recorded reading of every scene, its words timed by Whisper, aligned to the lines.', ['152 recordings']],
    ['spec', 'Shot specs', 'scene', 'PICTURE', 0, 'odyssey/src/spec_in.json', 'What every shot must show: its role (ground, figure, object), its scale, its sign.', ['1,534 shots']],
    ['cut', 'Viterbi cut', 'scene', 'PICTURE', 1, 'odyssey/build_cuts.py', 'Composes each scene from the pools: fit to the shot, joined to its neighbours, figures only by exception.', ['152 scenes cut']],
    ['captain', 'The captains', 'scene', 'ARCHIVE', 1, 'odyssey/steer_merge.py', 'CUTBASTARD, the steersman: a harsh critic looked at every shot and kept it, replaced it, or said nothing would do. Calm, harsh or brave.', ['keep 865', 'replace 584', 'nothing 85']],
    ['translate', 'Translator', 'scene', 'WORDS', 1, 'odyssey/translate_odyssey.py', 'The Task of the Translator, run on the archive: Homer word for word (literal), in kindred words (kinship), for the ear (performance); our voice fills what the archive never says.', ['kinship fidelity .93', '2,447 words filled']],
    ['spoken', 'Spoken chooser', 'scene', 'WORDS', 2, 'odyssey/spoken_odyssey.py', 'Each line answered by a whole archival sentence: by meaning (mpnet), by Homer’s words said or said in kind, by delivery; a character keeps its archival voice, and a voice is chosen for how it joins the one before.', ['median match .45', '2% weak']],
    ['greek', 'Greek under it', 'scene', 'WORDS', 3, 'odyssey/greek_odyssey.py', 'Every scene placed on Homer’s own lines (Murray’s Greek and English, the Perseus treebank, LSJ); a key line taught word by word; a theme word that returns.', ['152 scenes on the Greek', '21 themes']],
    ['mixer', 'Mixer', 'scene', 'SOUND', 2, 'odyssey/render_found.py', 'One continuous track per scene: every voice into one medium (de-hissed, matched, one band, one room), opened in its own silence, heard back by Whisper and lengthened when its last word was cut; the pauses take the speakers’ own time and are filled.', ['last word heard 91%', 'voiceless 17% in CALL']],
    ['planner', 'Picture planner', 'scene', 'PICTURE', 2, 'odyssey/picture_found.py', 'The picture follows the poem: the captains’ take for each line, a speaker only where the archive shows a face speaking; takes chosen across the scene for how they join.', ['1,990 pictures', '175 speakers', 'cut 688 · dissolve 920 · dip 78']],
    ['hwfilm', 'Halfworld film', 'scene', 'ARCHIVE', 2, 'odyssey/halfworld_clips.py', 'The halfworld’s own rendered film of every scene, cut by its render logs, in step with our voice.', ['152 scenes', '66.6 MB']],
    // once per line
    ['clock', 'Line clock', 'line', 'WORDS', 0, 'markov-found-odyssey.html · tkLoop', 'The scene’s track says where we are: each line begins.', []],
    ['call', 'Call · our voice', 'line', 'SOUND', 0, 'found-audio/call', 'The line said plainly first, by our studio voice: the text.', []],
    ['answer', 'Answer · the archive', 'line', 'SOUND', 1, 'found-audio/call', 'An archival person answers, saying it in a whole sentence of their own.', []],
    ['shared', 'Shared words', 'line', 'WORDS', 1, 'drawLine · shared()', 'What the call and the answer have in common, lit in both.', []],
    // every few seconds
    ['join', 'Picture join', 'few', 'PICTURE', 0, 'slowTake', 'A new picture, always in a pause: a cut, a dissolve, or a dip toward dark.', []],
    ['seat', 'Speaker seat', 'few', 'ARCHIVE', 0, 'gridUpdate', 'The character’s seat lights, and the archival person speaking for them plays in sync.', []],
    ['sign', 'Sound sign', 'few', 'SOUND', 0, 'render_found · sign()', 'The shot’s own sound (CLAP-matched field and music) rises under the end of one voice and receives the next.', []],
    ['bridge', 'Room bridge', 'few', 'SOUND', 1, 'render_found · bridges()', 'Across the pause, the room of the voice that ends becomes the room of the voice that begins.', []],
    // every frame
    ['track', 'Scene track', 'frame', 'SOUND', 0, '<audio id=track>', 'The rendered scene, playing: everything else follows it.', []],
    ['words', 'Words lit', 'frame', 'WORDS', 0, 'mark()', 'The line and the answer, lit as they are said.', []],
    ['layers', 'Picture layers', 'frame', 'PICTURE', 0, '4 video layers', 'The next pictures already loaded and parked; the one on screen never stops moving.', []],
    ['grid', 'Grid tiles', 'frame', 'ARCHIVE', 0, '#grid', 'The call as a video call: the halfworld, the seats, the poem’s takes, all playing.', []],
    ['screen', 'Screen', 'frame', 'PICTURE', 1, 'the page', 'What you see and hear.', []],
  ];
  const C = [ // from, to, kind
    ['mia', 'forage', 'data'], ['forage', 'clip', 'data'], ['clip', 'sam', 'data'], ['mia', 'shape', 'data'], ['forage', 'fetch', 'data'], ['fetch', 'whisper', 'data'], ['fetch', 'clap', 'data'],
    ['script', 'spec', 'data'], ['spec', 'forage', 'data'], ['spec', 'cut', 'data'], ['clip', 'cut', 'data'], ['cut', 'captain', 'choice'], ['captain', 'planner', 'choice'],
    ['script', 'translate', 'data'], ['whisper', 'translate', 'data'], ['translate', 'spoken', 'data'], ['whisper', 'spoken', 'data'], ['clap', 'spoken', 'choice'], ['script', 'greek', 'data'],
    ['spoken', 'mixer', 'data'], ['studio', 'mixer', 'data'], ['clap', 'mixer', 'data'], ['whisper', 'mixer', 'feedback'], ['mixer', 'planner', 'data'], ['clip', 'planner', 'data'], ['hwfilm', 'grid', 'stream'],
    ['mixer', 'track', 'stream'], ['track', 'clock', 'event'], ['clock', 'call', 'event'], ['call', 'answer', 'event'], ['answer', 'shared', 'event'], ['clock', 'shared', 'event'],
    ['planner', 'join', 'event'], ['clock', 'join', 'event'], ['answer', 'seat', 'event'], ['answer', 'sign', 'event'], ['call', 'bridge', 'event'],
    ['join', 'layers', 'event'], ['seat', 'grid', 'event'], ['shared', 'words', 'event'], ['sign', 'track', 'stream'], ['bridge', 'track', 'stream'],
    ['track', 'screen', 'stream'], ['layers', 'screen', 'stream'], ['words', 'screen', 'stream'], ['grid', 'screen', 'stream'],
  ];

  const POS = { mia: [1040, 40], forage: [760, 40], shape: [1040, 130], clip: [690, 130], sam: [860, 205], fetch: [150, 130], clap: [150, 215], whisper: [450, 215],
    studio: [150, 330], script: [450, 330], spec: [760, 330], translate: [370, 410], greek: [580, 410], cut: [735, 410], captain: [1040, 410], spoken: [450, 490], mixer: [150, 570], planner: [760, 570], hwfilm: [1040, 570],
    clock: [450, 660], call: [110, 720], answer: [330, 720], shared: [560, 720],
    sign: [110, 810], bridge: [330, 810], join: [760, 810], seat: [1040, 810],
    track: [150, 940], words: [450, 940], layers: [760, 940], grid: [1040, 940], screen: [600, 1010] };

  const MOD = Object.fromEntries(M.map(m => [m[0], m]));
  // ---- the whole patch (drawn once; shown on request)
  const svg = $('#patch'), B = {}; let H = 0; const bandY = {};
  BANDS.forEach(([k, name, sub, h], i) => { bandY[k] = H; const g = mk('g', { class: 'band' }, svg); mk('rect', { x: 0, y: H, width: W, height: h, fill: `var(--b${i + 1})` }, g);
    mk('text', { x: 14, y: H + 20 }, g).textContent = name; mk('text', { x: 14, y: H + 34, style: 'font-weight:400' }, g).textContent = sub; H += h; });
  svg.setAttribute('viewBox', `0 -40 ${W} ${H + 40}`);
  const cg = mk('g', { class: 'col' }, svg); Object.entries(COLS).forEach(([k, x]) => { mk('text', { x, y: -14, 'text-anchor': 'middle' }, cg).textContent = k; });
  const cabG = mk('g', {}, svg), boxG = mk('g', {}, svg), msgG = mk('g', {}, svg);
  M.forEach(m => { const [id, label] = m, w = label.length * 8.2 + 26, [cx, y] = POS[id]; B[id] = { m, x: cx - w / 2, y, w, h: 30 }; });
  const path = (a, b) => { const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, dy = Math.max(40, Math.abs(y2 - y1) / 2);
    return y2 > y1 + 10 ? `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}` : `M${x1},${y1} C${x1},${y1 + 80} ${x2 + (x2 > x1 ? -1 : 1) * 60},${y2 - 80} ${x2},${y2}`; };
  const CAB = C.map(([f, t, k]) => { const d = path(B[f], B[t]); let p; if (k === 'feedback') { mk('path', { d, class: 'cab feedback' }, cabG); p = mk('path', { d, class: 'cab feedback2' }, cabG); } else p = mk('path', { d, class: 'cab ' + k }, cabG); return { f, t, k, p }; });
  Object.values(B).forEach(b => { const g = mk('g', { class: 'box' + (['archive', 'scene'].includes(b.m[2]) ? ' off' : ''), transform: `translate(${b.x},${b.y})` }, boxG); b.g = g;
    mk('rect', { class: 'b', width: b.w, height: b.h, rx: 2 }, g); mk('rect', { class: 'io', x: 4, y: -2, width: 10, height: 4 }, g); mk('rect', { class: 'io', x: 4, y: b.h - 2, width: 10, height: 4 }, g);
    mk('text', { x: 12, y: 20 }, g).textContent = b.m[1]; b.val = mk('text', { class: 'val', x: 2, y: b.h + 13 }, g); g.addEventListener('click', () => sheet(b.m[0])); });
  // the same patch for a phone: each band, its modules in reading order (sound, words, picture, archive), lit as they fire
  const CHIP = {};
  $('#mapList').innerHTML = BANDS.map(([k, name, sub]) => `<section><h3>${name} <i>· ${sub}</i></h3><div class="ch">${M.filter(m => m[2] === k).sort((a, b) => POS[a[0]][1] - POS[b[0]][1] || POS[a[0]][0] - POS[b[0]][0]).map(m => `<button data-id="${m[0]}" class="${['archive', 'scene'].includes(k) ? 'off' : ''}">${esc(m[1])}</button>`).join('')}</div></section>`).join('');
  $('#mapList').querySelectorAll('button').forEach(b => { CHIP[b.dataset.id] = b; b.onclick = () => sheet(b.dataset.id); });
  // ---- a module, explained
  function sheet(id) { const m = MOD[id]; if (!m) return; $('#sheetBody').innerHTML = `<h2>${esc(m[1])}</h2><div class="f">${esc(m[5])} · ${esc(BANDS.find(x => x[0] === m[2])[1].toLowerCase())}</div><p>${esc(m[6])}</p><div class="k">${(m[7] || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>`; $('#sheet').classList.add('on'); }
  $('#sheetX').onclick = () => $('#sheet').classList.remove('on');
  $('#mapBtn').onclick = () => { $('#map').classList.add('on'); $('#mapBtn').classList.add('on'); };
  $('#mapX').onclick = () => { $('#map').classList.remove('on'); $('#mapBtn').classList.remove('on'); };
  addEventListener('keydown', e => { if (e.key === 'Escape') { $('#sheet').classList.remove('on'); $('#mapX').click(); } else if (e.key === ' ' && e.target.tagName !== 'SELECT') { e.preventDefault(); $('#bPlay').click(); } });
  // ---- what fires now: the chain (modules in order), its consequence, and the trace it leaves
  function chain(ids, said, red) { const h = $('#chain'); h.innerHTML = ''; ids.forEach((id, k) => { if (k) { const w = document.createElement('span'); w.className = 'w' + (red && k === ids.length - 1 ? ' red' : ''); w.innerHTML = '<i></i>'; h.append(w); }
      const n = document.createElement('span'); n.className = 'n hot'; n.textContent = MOD[id][1]; n.onclick = () => sheet(id); h.append(n); setTimeout(() => n.classList.remove('hot'), 700); });
    if (said) { const c = document.createElement('span'); c.className = 'c'; c.innerHTML = said; h.append(c); }
    for (let k = 1; k < ids.length; k++) send(ids[k - 1], ids[k], red && k === ids.length - 1); }
  const TR = []; function trace(t, s) { TR.unshift(`${t.toFixed(1)} s · ${s}`); TR.length = Math.min(TR.length, 2); $('#trace').innerHTML = TR.map(x => `<div>${esc(x)}</div>`).join(''); }
  function send(f, t, red) { const c = CAB.find(c => c.f === f && c.t === t); if (B[t]) { B[t].g.classList.add('fire'); setTimeout(() => B[t].g.classList.remove('fire'), 600); }
    if (CHIP[t]) { CHIP[t].classList.add('fire'); setTimeout(() => CHIP[t].classList.remove('fire'), 700); } if (!c || !$('#map').classList.contains('on')) return;
    const L = c.p.getTotalLength(), dot = mk('circle', { r: 6, class: 'msg' + (red ? ' red' : '') }, msgG), t0 = performance.now(), dur = Math.min(900, 220 + L);
    const step = () => { const k = Math.min(1, (performance.now() - t0) / dur), pt = c.p.getPointAtLength(L * k); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); if (k < 1) requestAnimationFrame(step); else dot.remove(); }; step(); }
  // ---- the film below, and the console reading it
  let F = null, PICS = null, sid = null, lastT = 0, lastLine = -1, lastEv = null, lastPic = null, view = 'grid', stalled = 0;
  const scr = $('#scr'), doc = () => { try { return scr.contentDocument; } catch (e) { return null; } };
  const STOP = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>', PLAY = '<path d="M7 4v16l13-8z"/>';
  function setState(s, cls) { const e = $('#state'); e.textContent = s; e.className = cls || ''; }
  function load(s) { sid = s; $('#fault').classList.remove('on'); try { localStorage.setItem('found.grid', JSON.stringify(view === 'grid')); } catch (e) { }   // the film reads its view from here as it opens
    scr.src = `markov-found-odyssey.html?scene=${s}&mode=call&bare=1`; lastT = 0; lastLine = -1; lastEv = lastPic = null;
    $('#who').textContent = '—'; $('#call').textContent = ''; $('#ans').textContent = ''; $('#src').textContent = ''; $('#chain').innerHTML = '<span class="rest">The patch fires here as the film plays.</span>'; setState('READY'); }
  const STOPW = new Set('a an the and or but of to in on at by for with from as is are was were be been it its this that i you he she we they me him her us them my your his our their not no so if then than there here what who which when where how all any some one into out up down over under'.split(' '));
  const stem = w => w.toLowerCase().replace(/[^a-z']/g, '').replace(/(ing|ed|es|s)$/, '');
  function lit(text, other) { const O = new Set(other.split(/\s+/).map(w => w.toLowerCase().replace(/[^a-z']/g, '')).filter(w => w.length > 2 && !STOPW.has(w)).map(stem));
    return text.split(/(\s+)/).map(w => { const c = w.toLowerCase().replace(/[^a-z']/g, ''); return c.length > 2 && !STOPW.has(c) && O.has(stem(c)) ? `<mark>${esc(w)}</mark>` : esc(w); }).join(''); }
  function tick() { requestAnimationFrame(tick); const d = doc(), tk = d && d.getElementById('track'); if (!tk || !F) return;
    const playing = !tk.paused, t = F.scene_tracks && F.scene_tracks[sid] && F.scene_tracks[sid].call; svg.classList.toggle('playing', playing);
    $('#bPlay').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${playing ? STOP : PLAY}</svg>`; $('#bPlay').setAttribute('aria-label', playing ? 'Stop' : 'Play');
    if (d.getElementById('scene') && d.getElementById('scene').value !== sid && d.getElementById('scene').value) { sid = d.getElementById('scene').value; $('#scene').value = sid; lastLine = -1; lastEv = lastPic = null; trace(0, 'the scene ended; the next one began'); }
    if (!t) return; const now = tk.currentTime;
    // state: READY · WORKING · PAUSED · FAULT
    if (playing) { if (Math.abs(now - lastT) < .001) stalled++; else stalled = 0; } else stalled = 0;
    if (stalled > 600) { $('#fault').classList.add('on'); $('#faultMsg').textContent = 'The film stopped answering (the sound is not moving).'; setState('FAULT', 'fault'); }
    else if (playing) setState('PLAYING', 'working'); else setState(now > .2 ? 'PAUSED' : 'READY');
    if (now < lastT - .5) { lastLine = -1; lastEv = lastPic = null; } lastT = now;
    let L = null; for (const l of t.lines) if (l.at <= now) L = l;
    if (L && L.li !== lastLine) { lastLine = L.li; const u = F.scenes[sid][L.li]; $('#who').textContent = `${u.who} · line ${L.li + 1} of ${t.lines.length}`; $('#call').innerHTML = esc(u.text); $('#call').classList.remove('dim'); $('#ans').innerHTML = ''; $('#src').textContent = '';
      chain(['track', 'clock'], `<b>line ${L.li + 1}</b> of ${t.lines.length}`); }
    let E = null; for (const e of t.ev) if (e.at <= now) E = e; else break;
    if (E && E !== lastEv && now <= E.end + .2) { lastEv = E; const u = F.scenes[sid][E.li];
      if (E.call) { chain(['clock', 'call', 'bridge'], '<b>our voice</b> says the line'); trace(now, `our voice: “${u.text.slice(0, 60)}”`); }
      else { const fr = u.modes.spoken && u.modes.spoken.frags[E.fi], c = F.clips[E.id] || {}, film = (c.title || '') + (c.year ? ', ' + c.year : '');
        $('#call').innerHTML = lit(u.text, fr ? fr.words : ''); $('#ans').innerHTML = fr ? '“' + lit(fr.words, u.text) + '”' : ''; $('#src').textContent = film;
        chain(['call', 'answer', 'seat', 'grid'], `<b>${esc(u.who)}</b> answered by ${esc(film)}`); trace(now, `${u.who} answered by ${film}`); } }
    const ps = (PICS && PICS[sid] && PICS[sid].call) || []; let P = null; for (const p of ps) if (p.sw <= now) P = p;
    if (P && P !== lastPic) { const first = !lastPic; lastPic = P; if (!first) { chain(['planner', 'join', 'layers'], `<b>${P.tr}</b> to ${esc((F.clips[P.id] || {}).title || P.kind)}`, true); trace(now, `picture: ${P.tr} to ${(F.clips[P.id] || {}).title || P.kind}`); } }
    $('#mapNow').textContent = `${sid} · ${now.toFixed(1)} s`; }
  const act = id => { const d = doc(); if (d && d.getElementById(id)) d.getElementById(id).click(); };
  $('#bPlay').onclick = () => act('bPlay'); $('#bNext').onclick = () => act('bNext'); $('#bPrev').onclick = () => act('bPrev');
  $('#retry').onclick = () => load(sid);
  $('#scene').onchange = () => load($('#scene').value);
  document.querySelectorAll('#view button').forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('#view button').forEach(x => x.classList.toggle('on', x === b)); try { localStorage.setItem('patch.view', view); } catch (e) { }
    try { localStorage.setItem('found.grid', JSON.stringify(view === 'grid')); } catch (e) { }
    const d = doc(), g = d && d.getElementById('gridBtn'); if (g && d.body.classList.contains('gridv') !== (view === 'grid')) g.click(); });
  try { view = localStorage.getItem('patch.view') || 'grid'; } catch (e) { } document.querySelectorAll('#view button').forEach(x => x.classList.toggle('on', x.dataset.v === view));
  Promise.all([fetch('odyssey/found.json').then(r => r.json()), fetch('odyssey/found-pics.json').then(r => r.json()).catch(() => null), fetch('odyssey/radio.json').then(r => r.json()).catch(() => null)]).then(([f, p, r]) => {
    F = f; PICS = p; const titles = r ? Object.fromEntries(r.books.flatMap(b => b.scenes).map(s => [s.id, s.title])) : {};
    Object.keys(F.scenes).sort().forEach(id => { if (!(F.scene_tracks[id] || {}).call) return; const o = document.createElement('option'); o.value = id; o.textContent = `${id.slice(3).replace('-', ' ')} · ${titles[id] || ''}`; $('#scene').append(o); });
    const q = new URLSearchParams(location.search).get('scene'); const s = F.scene_tracks[q] ? q : 'OD-B09-S09'; $('#scene').value = s; load(s); requestAnimationFrame(tick); })
    .catch(e => { $('#fault').classList.add('on'); $('#faultMsg').textContent = 'The cinema could not be read: ' + e.message; setState('FAULT', 'fault'); });
})();
</script></body></html>
