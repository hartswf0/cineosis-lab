<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cineosis Cinema Patch</title>
<meta name="description" content="How the Cineosis cinema works, drawn as a patch: the archive foraged and heard once, each scene built once, and every line, pause and frame played live, with the real Found Odyssey running at the bottom and each module firing when the film does what it does.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0b0908; --ink:#efe9dd; --dim:#8a8378; --box:#f4ede1; --boxink:#1d1714; --gold:#e8c070; --red:#d0574f; --taupe:#9c8a76; --line:#2a2521;
  --b1:#1a1614; --b2:#211b17; --b3:#2a201b; --b4:#33231e; --b5:#3d2622; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; }

#head{ background:#160f0d; padding:calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 22px; align-items:baseline; }
#head h1{ margin:0; font:600 clamp(15px,2.2vw,22px) var(--mono); letter-spacing:.1em; } #head h1 span{ color:var(--gold); }
#head .st{ color:var(--dim); font-size:11px; letter-spacing:.12em; } #head a{ color:var(--dim); text-decoration:none; letter-spacing:.2em; font-size:10.5px; }
#wrap{ position:relative; overflow:auto; background:var(--b1); } svg{ display:block; }
.box rect.b{ fill:var(--box); stroke:var(--boxink); stroke-width:1.5; } .box text{ font:600 13px var(--mono); fill:var(--boxink); } .box rect.io{ fill:var(--boxink); }
.box{ cursor:pointer; } .box.off rect.b{ fill:#d9cfbf; } .box.sel rect.b{ stroke:var(--gold); stroke-width:3; }
.box.fire rect.b{ fill:#ffe3a0; } .box .val{ font:500 10px var(--mono); fill:var(--gold); }

.playing .cab.stream{ animation:flow .6s linear infinite; } @keyframes flow{ to{ stroke-dashoffset:-22; } }
.hidedata .cab.data{ display:none; } .msg{ fill:var(--gold); } .msg.red{ fill:var(--red); }
.note{ font:500 10px var(--mono); fill:var(--dim); } .dial circle{ fill:none; }

#screenBox{ background:#000; border:1px solid var(--line); position:relative; aspect-ratio:16/11; } #screenBox iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
#screenBox .lab{ position:absolute; top:-18px; left:0; font:600 10px var(--mono); letter-spacing:.18em; color:var(--dim); }

#ctrl select{ background:#1b1512; border:1px solid var(--line); border-radius:4px; padding:7px 9px; max-width:260px; } #now{ color:var(--dim); font-size:11px; margin-left:auto; }
@media (max-width:820px){ #below{ grid-template-columns:1fr; } #now{ width:100%; margin-left:0; } }

<div id="head"><h1>CINEOSIS <span>CINEMA</span> PATCH</h1><span class="st" id="stat">reading the cinema…</span><a href="index.html#wall">LAB</a><a href="markov-found-odyssey.html">THE FOUND ODYSSEY</a></div>
<div id="wrap"><svg id="patch" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ctrl">
  <div class="seg"><button id="bPlay">play</button><button id="bNext">next line ▸</button></div>
  <select id="scene" aria-label="Scene"></select>

<div id="below">
  <div><div id="screenBox"><span class="lab">SCREEN · THE FOUND ODYSSEY, CALL, GRID</span><iframe id="scr" title="The Found Odyssey"></iframe></div></div>
  <div id="panel"></div></div>
<script>
(function () {

  // ---- the cinema, as modules: band (how often it happens), column (what it handles), the script that is it, what it does, its numbers
  const W = 1200, COLS = { SOUND: 150, WORDS: 450, PICTURE: 760, ARCHIVE: 1040 };

  const M = [
    // once per archive
    ['mia', 'Moving Image Archive', 'archive', 'ARCHIVE', 0, 'movingimagearchive.com', 'A public archive of sponsored, educational, amateur, government and early cinema, searched by meaning, 24 clips a question.', ['1,859 films', '28,611 clips foraged']],
    ['forage', 'Forage', 'archive', 'PICTURE', 0, 'odyssey/forage.py', 'Asks the archive for every beat and shot of the Odyssey: grounds, figures, motions, places, the cast; serial and resumable.', ['1,534 shot questions', 'about 20k new clips']],
    ['clip', 'CLIP eyes', 'archive', 'PICTURE', 1, 'odyssey/ingest.py', 'Every clip seen once: a thumbnail and two image embeddings (OpenAI and LAION ViT-B-32), the space everything else is chosen in.', ['36,538 shots in one space']],

    ['shape', 'Shape & kind', 'archive', 'ARCHIVE', 1, 'aspect/measure.py', 'The frame and the picture inside it (black bars found and agreed across a film), named by the standards of cinema; each film labelled cinema, animation, documentary, sponsored, government, television, amateur or record.', ['cinema 109 films', 'letterbox 104', 'pillarbox 138']],

    ['spec', 'Shot specs', 'scene', 'PICTURE', 0, 'odyssey/src/spec_in.json', 'What every shot must show: its role (ground, figure, object), its scale, its sign.', ['1,534 shots']],
    ['cut', 'Viterbi cut', 'scene', 'PICTURE', 1, 'odyssey/build_cuts.py', 'Composes each scene from the pools: fit to the shot, joined to its neighbours, figures only by exception.', ['152 scenes cut']],
    ['captain', 'The captains', 'scene', 'ARCHIVE', 1, 'odyssey/steer_merge.py', 'CUTBASTARD, the steersman: a harsh critic looked at every shot and kept it, replaced it, or said nothing would do. Calm, harsh or brave.', ['keep 865', 'replace 584', 'nothing 85']],

    ['spoken', 'Spoken chooser', 'scene', 'WORDS', 2, 'odyssey/spoken_odyssey.py', 'Each line answered by a whole archival sentence: by meaning (mpnet), by Homer’s words said or said in kind, by delivery; a character keeps its archival voice, and a voice is chosen for how it joins the one before.', ['median match .45', '2% weak']],

    ['mixer', 'Mixer', 'scene', 'SOUND', 2, 'odyssey/render_found.py', 'One continuous track per scene: every voice into one medium (de-hissed, matched, one band, one room), opened in its own silence, heard back by Whisper and lengthened when its last word was cut; the pauses take the speakers’ own time and are filled.', ['last word heard 91%', 'voiceless 17% in CALL']],

    // once per line
    ['clock', 'Line clock', 'line', 'WORDS', 0, 'markov-found-odyssey.html · tkLoop', 'The scene’s track says where we are: each line begins.', []],
    ['call', 'Call · our voice', 'line', 'SOUND', 0, 'found-audio/call', 'The line said plainly first, by our studio voice: the text.', []],
    ['answer', 'Answer · the archive', 'line', 'SOUND', 1, 'found-audio/call', 'An archival person answers, saying it in a whole sentence of their own.', []],
    ['shared', 'Shared words', 'line', 'WORDS', 1, 'drawLine · shared()', 'What the call and the answer have in common, lit in both.', []],
    // every few seconds
    ['join', 'Picture join', 'few', 'PICTURE', 0, 'slowTake', 'A new picture, always in a pause: a cut, a dissolve, or a dip toward dark.', []],
    ['seat', 'Speaker seat', 'few', 'ARCHIVE', 0, 'gridUpdate', 'The character’s seat lights, and the archival person speaking for them plays in sync.', []],
    ['sign', 'Sound sign', 'few', 'SOUND', 0, 'render_found · sign()', 'The shot’s own sound (CLAP-matched field and music) rises under the end of one voice and receives the next.', []],
    ['bridge', 'Room bridge', 'few', 'SOUND', 1, 'render_found · bridges()', 'Across the pause, the room of the voice that ends becomes the room of the voice that begins.', []],
    // every frame
    ['track', 'Scene track', 'frame', 'SOUND', 0, '<audio id=track>', 'The rendered scene, playing: everything else follows it.', []],
    ['words', 'Words lit', 'frame', 'WORDS', 0, 'mark()', 'The line and the answer, lit as they are said.', []],
    ['layers', 'Picture layers', 'frame', 'PICTURE', 0, '4 video layers', 'The next pictures already loaded and parked; the one on screen never stops moving.', []],
    ['grid', 'Grid tiles', 'frame', 'ARCHIVE', 0, '#grid', 'The call as a video call: the halfworld, the seats, the poem’s takes, all playing.', []],
    ['screen', 'Screen', 'frame', 'PICTURE', 1, 'the page', 'What you see and hear.', []],
  ];
  const C = [ // from, to, kind
    ['mia', 'forage', 'data'], ['forage', 'clip', 'data'], ['clip', 'sam', 'data'], ['mia', 'shape', 'data'], ['forage', 'fetch', 'data'], ['fetch', 'whisper', 'data'], ['fetch', 'clap', 'data'],
    ['script', 'spec', 'data'], ['spec', 'forage', 'data'], ['spec', 'cut', 'data'], ['clip', 'cut', 'data'], ['cut', 'captain', 'choice'], ['captain', 'planner', 'choice'],
    ['script', 'translate', 'data'], ['whisper', 'translate', 'data'], ['translate', 'spoken', 'data'], ['whisper', 'spoken', 'data'], ['clap', 'spoken', 'choice'], ['script', 'greek', 'data'],
    ['spoken', 'mixer', 'data'], ['studio', 'mixer', 'data'], ['clap', 'mixer', 'data'], ['whisper', 'mixer', 'feedback'], ['mixer', 'planner', 'data'], ['clip', 'planner', 'data'], ['hwfilm', 'grid', 'stream'],
    ['mixer', 'track', 'stream'], ['track', 'clock', 'event'], ['clock', 'call', 'event'], ['call', 'answer', 'event'], ['answer', 'shared', 'event'], ['clock', 'shared', 'event'],
    ['planner', 'join', 'event'], ['clock', 'join', 'event'], ['answer', 'seat', 'event'], ['answer', 'sign', 'event'], ['call', 'bridge', 'event'],
    ['join', 'layers', 'event'], ['seat', 'grid', 'event'], ['shared', 'words', 'event'], ['sign', 'track', 'stream'], ['bridge', 'track', 'stream'],
    ['track', 'screen', 'stream'], ['layers', 'screen', 'stream'], ['words', 'screen', 'stream'], ['grid', 'screen', 'stream'],
  ];
  // ---- layout
  const svg = $('#patch'); let H = 0; const bandY = {};
  const B = {}; BANDS.forEach(([k, name, sub, h], i) => { bandY[k] = H; const g = mk('g', { class: 'band' }, svg); mk('rect', { x: 0, y: H, width: W, height: h, fill: `var(--b${i + 1})` }, g);
    const t = mk('text', { x: 14, y: H + 20 }, g); t.textContent = name; const s = mk('text', { x: 14, y: H + 34, style: 'font-weight:400;letter-spacing:.06em' }, g); s.textContent = sub; H += h; });
  svg.setAttribute('viewBox', `0 -40 ${W} ${H + 40}`); svg.setAttribute('width', W); svg.setAttribute('height', H + 40);
  const cg = mk('g', { class: 'col' }, svg); Object.entries(COLS).forEach(([k, x]) => { const t = mk('text', { x, y: -14, 'text-anchor': 'middle' }, cg); t.textContent = k; });
  const cabG = mk('g', {}, svg), boxG = mk('g', {}, svg), msgG = mk('g', {}, svg);
  // every module placed by hand (centre x, top y), so the cables read top to bottom
  const POS = { mia: [1040, 40], forage: [760, 40], shape: [1040, 130], clip: [690, 130], sam: [860, 205], fetch: [150, 130], clap: [150, 215], whisper: [450, 215],
    studio: [150, 330], script: [450, 330], spec: [760, 330], translate: [370, 410], greek: [580, 410], cut: [735, 410], captain: [1040, 410], spoken: [450, 490], mixer: [150, 570], planner: [760, 570], hwfilm: [1040, 570],
    clock: [450, 660], call: [110, 720], answer: [330, 720], shared: [560, 720],
    sign: [110, 810], bridge: [330, 810], join: [760, 810], seat: [1040, 810],
    track: [150, 940], words: [450, 940], layers: [760, 940], grid: [1040, 940], screen: [600, 1010] };
  M.forEach(m => { const [id, label] = m, w = label.length * 8.2 + 26, [cx, y] = POS[id]; B[id] = { m, x: cx - w / 2, y, w, h: 30 }; });
  const path = (a, b) => { const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, dy = Math.max(40, Math.abs(y2 - y1) / 2);
    return y2 > y1 + 10 ? `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}` : `M${x1},${y1} C${x1},${y1 + 80} ${x2 + (x2 > x1 ? -1 : 1) * 60},${y2 - 80} ${x2},${y2}`; };
  const CAB = C.map(([f, t, k]) => { const d = path(B[f], B[t]); let p;
    if (k === 'feedback') { mk('path', { d, class: 'cab feedback' }, cabG); p = mk('path', { d, class: 'cab feedback2' }, cabG); } else p = mk('path', { d, class: 'cab ' + k }, cabG);
    return { f, t, k, p }; });
  Object.values(B).forEach(b => { const g = mk('g', { class: 'box', 'data-id': b.m[0], transform: `translate(${b.x},${b.y})` }, boxG); b.g = g;
    mk('rect', { class: 'b', width: b.w, height: b.h, rx: 2 }, g); mk('rect', { class: 'io', x: 4, y: -2, width: 10, height: 4 }, g); mk('rect', { class: 'io', x: b.w - 14, y: -2, width: 10, height: 4 }, g); mk('rect', { class: 'io', x: 4, y: b.h - 2, width: 10, height: 4 }, g);
    const t = mk('text', { x: 12, y: 20 }, g); t.textContent = b.m[1]; const v = mk('text', { class: 'val', x: 2, y: b.h + 13 }, g); b.val = v;
    g.addEventListener('click', () => show(b.m[0])); });

  const nt = mk('text', { class: 'note', x: 850, y: bandY.line - 10 }, svg); nt.textContent = '— built above · played below —';
  // ---- a message travels a cable
  let speed = 1;
  function send(f, t, red) { const c = CAB.find(c => c.f === f && c.t === t); if (!c) return; const L = c.p.getTotalLength(), dot = mk('circle', { r: 5, class: 'msg' + (red ? ' red' : '') }, msgG), t0 = performance.now(), dur = Math.min(900, 220 + L * 1.1) / speed;
    const step = () => { const k = Math.min(1, (performance.now() - t0) / dur), pt = c.p.getPointAtLength(L * k); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); if (k < 1) requestAnimationFrame(step); else { dot.remove(); fire(t); } }; step(); }

  // ---- the module panel
  function show(id) { const b = B[id]; if (!b) return; document.querySelectorAll('.box.sel').forEach(g => g.classList.remove('sel')); b.g.classList.add('sel'); const m = b.m;
    $('#panel').innerHTML = `<h2>${esc(m[1])}</h2><div class="f">${esc(m[5])} · ${esc(BANDS.find(x => x[0] === m[2])[1].toLowerCase())}</div><p>${esc(m[6])}</p><div class="n">${(m[7] || []).map(x => `<span><b>${esc(x.split(' ')[0])}</b> ${esc(x.split(' ').slice(1).join(' '))}</span>`).join('')}</div>` + legend; }
  const sw = (cls, w = 46) => `<svg width="${w}" height="12"><path d="M2,6 L${w - 2},6" class="cab ${cls}"/></svg>`;
  const legend = `<div class="legend"><div>${sw('event')} an event: something happened, once</div><div>${sw('stream')} a stream: every frame</div><div>${sw('data')} built offline, data handed on</div><div>${sw('choice')} a choice where taste enters (the captains, the casting, the voices)</div><div><svg width="46" height="12"><path d="M2,6 L44,6" class="cab feedback"/><path d="M2,6 L44,6" class="cab feedback2"/></svg> a loop: the cut is heard back and lengthened</div></div>`;
  // ---- the live cinema: the real Found Odyssey below, and the patch fires as it does
  let F = null, PICS = null, sid = null, lastT = 0, lastLine = -1, lastEv = null, lastPic = null;
  const scr = $('#scr');
  function load(s) { sid = s; scr.src = `markov-found-odyssey.html?scene=${s}&mode=call`; lastT = 0; lastLine = -1; lastEv = lastPic = null; }
  function tick() { requestAnimationFrame(tick); let d; try { d = scr.contentDocument; } catch (e) { return; } const tk = d && d.getElementById('track'); if (!tk || !F) return;
    const playing = !tk.paused; svg.classList.toggle('playing', playing); $('#bPlay').textContent = playing ? 'pause' : 'play';
    const t = F.scene_tracks && F.scene_tracks[sid] && F.scene_tracks[sid].call; if (!t) return; const now = tk.currentTime;
    if (now < lastT - .5) { lastLine = -1; lastEv = lastPic = null; } lastT = now;
    let L = null; for (const l of t.lines) if (l.at <= now) L = l; if (L && L.li !== lastLine) { lastLine = L.li; send('track', 'clock'); fire('clock', `line ${L.li + 1} of ${t.lines.length}`); }
    let E = null; for (const e of t.ev) if (e.at <= now) E = e; else break;
    if (E && E !== lastEv && now <= E.end + .2) { lastEv = E;
      if (E.call) { send('clock', 'call'); send('call', 'bridge'); fire('call', 'our voice'); }
      else { const u = (F.scenes[sid] || [])[E.li], fr = u && u.modes.spoken && u.modes.spoken.frags[E.fi], c = F.clips[E.id] || {};
        send('call', 'answer'); fire('answer', (c.title || '').slice(0, 26) + (c.year ? ' · ' + c.year : '')); setTimeout(() => { send('answer', 'shared'); send('answer', 'seat'); send('answer', 'sign', true); }, 250 / speed);
        setTimeout(() => { send('shared', 'words'); send('seat', 'grid'); }, 700 / speed); if (u) fire('seat', u.who); } }
    const ps = (PICS && PICS[sid] && PICS[sid].call) || []; let P = null; for (const p of ps) if (p.sw <= now) P = p;

  $('#bPlay').onclick = () => { try { scr.contentDocument.getElementById('bPlay').click(); } catch (e) { } };
  $('#bNext').onclick = () => { try { scr.contentDocument.getElementById('bNext').click(); } catch (e) { } };
  $('#scene').onchange = () => load($('#scene').value);
  document.querySelectorAll('#cab button').forEach(b => b.onclick = () => { document.querySelectorAll('#cab button').forEach(x => x.classList.toggle('on', x === b)); svg.classList.toggle('hidedata', b.dataset.c === 'live'); });
  document.querySelectorAll('#spd button').forEach(b => b.onclick = () => { document.querySelectorAll('#spd button').forEach(x => x.classList.toggle('on', x === b)); speed = +b.dataset.s; });
  function zoom(z) { if (z === 'fit') { svg.style.width = '100%'; svg.style.height = 'auto'; } else { svg.style.width = W + 'px'; svg.style.height = 'auto'; } }
  document.querySelectorAll('#zm button').forEach(b => b.onclick = () => { document.querySelectorAll('#zm button').forEach(x => x.classList.toggle('on', x === b)); zoom(b.dataset.z); });
  zoom('fit'); show('mixer');
  Promise.all([fetch('odyssey/found.json').then(r => r.json()), fetch('odyssey/found-pics.json').then(r => r.json()).catch(() => null), fetch('odyssey/radio.json').then(r => r.json()).catch(() => null)]).then(([f, p, r]) => {
    F = f; PICS = p; const titles = r ? Object.fromEntries(r.books.flatMap(b => b.scenes).map(s => [s.id, s.title])) : {};
    Object.keys(F.scenes).sort().forEach(id => { if (!(F.scene_tracks[id] || {}).call) return; const o = document.createElement('option'); o.value = id; o.textContent = `${id.slice(3)} · ${titles[id] || ''}`; $('#scene').append(o); });
    const q = new URLSearchParams(location.search).get('scene'); const s = F.scene_tracks[q] ? q : 'OD-B09-S09'; $('#scene').value = s; load(s);
    $('#stat').textContent = `${Object.keys(F.scenes).length} scenes · 36,538 shots measured · ${Object.keys(F.clips).length.toLocaleString()} speak in the film · built once, played live`;
    requestAnimationFrame(tick); });
})();
