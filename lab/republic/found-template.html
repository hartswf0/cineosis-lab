<html lang="en">
<head>

<meta property="og:description" content="Seventeen Republics answered by the archive, in its own pictures and its own voices. Press play.">

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0806;--ink:#f4e9dc;--dim:#a8968a;--line:#33241d;--rust:#e0572a;--call:#3fc78a;--ans:#f2c14e;--pic:#5b8cff;--mono:'IBM Plex Mono',ui-monospace,monospace;--head:'Archivo Black',Impact,sans-serif;--ser:'Fraunces',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#wrap{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{position:relative;width:100%;height:100%;max-height:135vw;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .22s linear;background:#000}
video.on{opacity:1}
video.slow{transition:opacity .8s ease}
#tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background .8s,opacity .8s}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5))}
#tag{position:absolute;left:10px;top:10px;z-index:5;display:flex;gap:6px;align-items:center;font:600 10px var(--mono);letter-spacing:.16em}
#tag b{padding:4px 7px;border-radius:2px;color:#000}
#tag span{color:#fff;text-shadow:0 1px 4px #000;letter-spacing:.04em;font-weight:400;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#words{position:absolute;left:5%;right:5%;bottom:6%;z-index:6;text-align:center;pointer-events:none}
#who{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.16em;padding:4px 8px;margin-bottom:8px;border-radius:2px;color:#000;opacity:0;transition:opacity .2s}
#line{font:500 clamp(17px,2.6vw,30px)/1.24 var(--ser);font-style:italic;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.95);text-wrap:balance}
#line.ans{font:600 clamp(14px,2.1vw,24px)/1.3 var(--mono);font-style:normal;color:var(--ans)}
#line.act{font:400 clamp(12px,1.8vw,18px)/1.4 var(--mono);font-style:normal}
#src{margin-top:6px;font-size:10px;letter-spacing:.08em;color:#d8c8ba;text-shadow:0 1px 4px #000;min-height:12px}
@media (max-aspect-ratio:3/4){#wrap{align-items:flex-start}#words{top:calc(135vw + 16px);bottom:auto}#line{text-shadow:none}}
/* avatars: the multiplane's cut-out cast, worn as faces over the found film */
#cast{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.actor{position:absolute;bottom:0;transform-origin:50% 100%;opacity:0;transition:opacity .35s ease,left .6s cubic-bezier(.3,1.25,.5,1),height .55s cubic-bezier(.3,1.2,.5,1),filter .4s;will-change:transform}
.actor canvas{display:block;height:100%;width:auto}
.actor.on{opacity:1}
.actor .sh{position:absolute;left:12%;right:12%;bottom:-3%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(2px)}
.actor.listen{filter:brightness(.62) saturate(.7)}
.actor.voiced{filter:drop-shadow(0 0 3px var(--ans)) drop-shadow(0 0 14px rgba(242,193,78,.45))}
video{transform-origin:50% 50%}
#line .w{opacity:.28;transition:opacity .15s}#line .w.on{opacity:1}
.av{position:absolute;bottom:4%;display:flex;flex-direction:column;align-items:center;gap:5px;opacity:0;transform:translateY(12px) scale(.9);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1),left .45s,right .45s,filter .3s}
.av.on{opacity:1;transform:none}
.av .disc{position:relative;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,var(--c),#120806 78%);box-shadow:0 0 0 3px var(--c),0 6px 22px rgba(0,0,0,.6)}
.av .disc img{position:absolute;left:8%;top:10%;width:84%;height:90%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.av .disc b{position:absolute;inset:0;display:grid;place-items:center;font:calc(var(--s) * .34) var(--head);color:#120806}
.av .ring{position:absolute;inset:calc(var(--s) * -0.08);border-radius:50%;border:3px solid var(--c);opacity:0;transform:scale(1);pointer-events:none}
.av.talk .ring{opacity:.9}
.av.arch .ring{border-color:var(--ans);animation:pulse 1.1s ease-in-out infinite;opacity:.9}
@keyframes pulse{50%{transform:scale(1.1);opacity:.35}}
.av i{font:600 10px var(--mono);letter-spacing:.14em;color:#000;background:var(--c);padding:3px 6px;border-radius:2px;white-space:nowrap;font-style:normal}
.av.listen{filter:brightness(.55) saturate(.6)}
.av.small .disc{width:calc(var(--s) * .62);height:calc(var(--s) * .62)}
#lineup{position:relative;display:flex;margin-bottom:8px;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 4%;opacity:0;transition:opacity .5s;pointer-events:none}
#lineup.on{opacity:1}#lineup:not(.on){display:none}
#lineup .av{position:relative;bottom:auto;opacity:1;transform:none}
#card{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;padding:8%;color:#fff;font:clamp(22px,5vw,60px)/1.02 var(--head);text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .35s;background:rgba(0,0,0,.35);text-shadow:0 4px 30px #000}
#card.on{opacity:1}#card.black{background:#000}
#card small{font:600 11px/1.4 var(--mono);letter-spacing:.24em;color:var(--rust)}
#card em{font:500 clamp(12px,1.8vw,19px)/1.35 var(--ser);font-style:italic;text-transform:none;max-width:38em;color:#f4e9dc}
#door{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 60%,rgba(12,8,6,.35),rgba(12,8,6,.94))}
#door h1{font:clamp(30px,7vw,84px)/.9 var(--head);color:#fff}#door h1 span{color:var(--ans)}
#door p{max-width:34em;font-size:12px;line-height:1.55;color:#e8d9c9}
#door .meta{font-size:10px;letter-spacing:.2em;color:var(--dim)}#door a{color:var(--ans)}
#play{width:84px;height:84px;border-radius:50%;background:var(--rust);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(224,87,42,.25)}
body.go #door{display:none}body:not(.go) #words,body:not(.go) #card{opacity:0!important}
#strip{flex:0 0 auto;height:22px;position:relative;background:#000;border-top:1px solid var(--line);overflow:hidden;cursor:pointer}
#strip i{position:absolute;top:4px;bottom:4px;border-radius:2px;opacity:.55}
#strip i.on{opacity:1;outline:1px solid #fff}
#strip u{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 5px #fff}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.k{min-width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;font-size:8.5px;letter-spacing:.12em;color:var(--dim)}
.k svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k:active{background:rgba(255,255,255,.1)}
#mode{min-width:0;max-width:92px;flex-direction:row;gap:5px;font-size:8.5px;line-height:1.15;text-align:left;color:var(--ink);border:1px solid var(--line);height:38px;padding:0 8px}
#mode i{width:9px;height:9px;border-radius:50%}
#ep{flex:1;min-width:0;padding:0 6px;cursor:pointer}
#ep b{display:block;font:13px/1.1 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ep span{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#books{position:absolute;inset:0;z-index:50;background:rgba(10,6,4,.97);display:none;flex-direction:column}
#books.on{display:flex}
#books header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}#books header b{font:18px var(--head)}
#bk{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px 16px 24px}
.bn{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#000;text-align:left;border:1px solid var(--line)}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.bn .t{position:absolute;left:8px;right:8px;bottom:7px;font:12px/1.05 var(--head);color:#fff;text-shadow:0 1px 6px #000}
.bn .n{position:absolute;left:8px;top:6px;font-size:9px;letter-spacing:.16em;color:#fff;background:rgba(0,0,0,.5);padding:2px 5px}
.bn.cur{outline:2px solid var(--rust)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:20px;font-size:11px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
#toast.on{opacity:1}
#wait{position:absolute;right:12px;top:12px;z-index:6;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div id="app">
 <div id="wrap">
  <div id="screen">
   <video id="v0" playsinline preload="auto"></video><video id="v1" playsinline preload="auto"></video><video id="v2" playsinline preload="auto"></video><video id="v3" playsinline preload="auto"></video>
   <div id="cast"></div>
   <div id="tint"></div><div class="vig"></div>
   <div id="tag"><b id="tagk"></b><span id="tags"></span></div><div id="wait"></div>
   <div id="card"></div>
   <div id="door">
    <div class="meta">MARKOV FOUND · CINEOSIS LAB</div>
    <h1>THE <span>REPUBLIC</span><br>FOUND</h1>
    <p>Every line of the Republic is met by a real sentence from the archive, played in its own picture and its own sound, exactly as long as it was spoken. The places are whole clips, never stills.</p>
    <button id="play" aria-label="Play"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg></button>
    <div class="meta" id="runtime"></div>
    <div class="meta">ALSO: <a href="markov-sam-republic.html">THE MULTIPLANE</a> · <a href="https://hartswf0.github.io/the-republic/screenplay.html">SCREENPLAY</a> · <a href="https://hartswf0.github.io/the-republic/megamap.html">MEGAMAP</a></div>
   </div>
  </div>
  <div id="words"><div id="lineup"></div><div id="who"></div><div id="line"></div><div id="src"></div></div>
 </div>
 <div id="strip" aria-label="the episode, shot by shot: green CALL, gold ANSWER, blue PICTURE"></div>
 <div id="bar">
  <button class="k" id="kplay" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>PLAY</span></button>
  <button class="k" id="kprev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M18 5L8 12l10 7zM6 5v14"/></svg><span>BACK</span></button>
  <button class="k" id="knext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 5l10 7-10 7zM18 5v14"/></svg><span>NEXT</span></button>
  <div id="ep" role="button" aria-label="Choose an episode"><b></b><span></span></div>
  <button class="k" id="mode" aria-label="Who speaks"></button>
  <button class="k" id="kbooks" aria-label="Episodes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>EPISODES</span></button>
 </div>
 <div id="books"><header><b>THE REPUBLICS</b><button class="k" id="kclose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div id="bk"></div></div>
</div>
<div id="toast"></div>
<script>
const D = {{DATA}};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const EPS = D.eps;
// one vocabulary: CALL is the screenplay line in its AI voice; ANSWER is the archive's own sentence, picture and sound; PICTURE is a place, a whole clip
const KIND = {call: {n: 'CALL', c: 'var(--call)'}, answer: {n: 'ANSWER', c: 'var(--ans)'}, picture: {n: 'PICTURE', c: 'var(--pic)'}, card: {n: 'CARD', c: '#fff'}};
const MODES = [{k: 'both', n: 'CALL + ANSWER', c: ['var(--call)', 'var(--ans)']}, {k: 'answer', n: 'ANSWER ONLY', c: ['var(--ans)']}, {k: 'call', n: 'CALL ONLY', c: ['var(--call)']}];
let MODE = 0; try { MODE = +(localStorage.getItem('found.mode') || 0) % 3 } catch (e) {}
let E = 0;
// ---------- the program: every shot of an episode with its exact length ----------
function program(ep) {
  const m = MODES[MODE].k, out = [], vo = ep.voice;
  let place = 0, since = 0;
  out.push({kind: 'picture', place: 0, ai: vo[0], dur: vo[0].d + 1.2, card: 'title', text: ep.logline, who: 'NARRATOR'});
  ep.beats.forEach((b, i) => {
    const v = vo[i + 1];
    if (b.k === 'act' && since >= 4 && i > 2) { place = (place + 2) % ep.places.length; since = 0 }   // the places come in pairs: two clips of each
    if (b.k === 'card') out.push({kind: 'card', place, dur: 2.2, text: b.text});
    else if (b.k === 'act') out.push({kind: 'picture', place, ai: v, dur: v.d + .35, text: b.text, who: 'NARRATOR'});
    else {
      since++; const a = ep.answers[i]; b = Object.assign({}, b, {who: ep.alias[b.who] || b.who});
      if (m !== 'answer') out.push({kind: 'call', place, ai: v, dur: v.d + .12, text: b.text, who: b.who});
      if (m !== 'call' && a) out.push({kind: 'answer', place, a, dur: a.t1 - a.t0 + .3, text: a.s, who: b.who});
    }
  });
  const order = [], last = []; out.forEach(s => {
    if (s.kind !== 'call' && s.kind !== 'answer') return;
    if (!order.includes(s.who)) order.push(s.who);
    s.side = order.indexOf(s.who) % 2 ? 'R' : 'L';
    s.listener = last.filter(w => w !== s.who).slice(-1)[0] || null;
    if (last[last.length - 1] !== s.who) last.push(s.who);
  });
  let t = 0; out.forEach(s => { s.t0 = t; t += s.dur }); out.total = t; return out;
}
// ---------- the projector: four videos (two for places, two for answers), one voice ----------
const V = [$('#v0'), $('#v1'), $('#v2'), $('#v3')];
const P = {shots: [], j: 0, playing: false, start: 0, pausedAt: 0, pv: null, pidx: -1, voice: new Audio(), ansNext: null};
const score = new Audio(); score.loop = true;
function clipIn(c) { return Math.max(0, (c.t || 0) - 1.5) }
function load(v, src, t) {
  return new Promise(res => {
    const go = () => { const done = () => { v.removeEventListener('seeked', done); res(v) }; v.addEventListener('seeked', done); v.currentTime = t; setTimeout(done, 2500) };
    if (v.dataset.src === src && v.readyState >= 1) { go(); return }
    v.dataset.src = src; v.src = src; v.addEventListener('loadedmetadata', go, {once: true}); v.load(); setTimeout(() => res(v), 4000);
  });
}
// places: the clip keeps running under the calls, as a camera would; when it runs out, the next clip of the place
function placeVideo(ep, idx) {
  const c = ep.places[idx % ep.places.length]; const v = (P.pv === V[0]) ? V[1] : V[0];
  if (P.pidx === idx && P.pv) return Promise.resolve(P.pv);
  return load(v, c.v, clipIn(c)).then(v => { v.dataset.end = c.d ? Math.min(c.d - .1, clipIn(c) + 40) : 9999; return v });
}
function show(v, slow) {
  V.forEach(x => { if (x !== v) { x.classList.remove('on') } });
  v.classList.toggle('slow', !!slow); v.classList.add('on');
}
function ansSlot() { return P.ansNext && P.ansNext.v === V[2] ? V[3] : V[2] }
function preloadAnswer(j) {
  const s = P.shots.slice(j).find(x => x.kind === 'answer'); if (!s) return;
  if (P.ansNext && P.ansNext.s === s) return;
  const v = ansSlot(); P.ansNext = {s, v, ready: load(v, s.a.v, Math.max(0, s.a.t0 - .12))};
}
async function go(j) {
  const ep = EPS[E], s = P.shots[j]; if (!s) return;
  P.j = j; P.voice.pause(); $('#wait').style.display = 'none';
  const card = $('#card'), line = $('#line'), who = $('#who'), src = $('#src');
  card.className = ''; card.innerHTML = '';
  $('#tagk').textContent = KIND[s.kind].n; $('#tagk').style.background = KIND[s.kind].c;
  if (s.kind === 'answer') {
    let pre = P.ansNext && P.ansNext.s === s ? P.ansNext : null;
    if (!pre) { const v = ansSlot(); pre = {s, v, ready: load(v, s.a.v, Math.max(0, s.a.t0 - .12))} }
    $('#wait').style.display = 'block'; await pre.ready; $('#wait').style.display = 'none';
    if (P.j !== j) return;
    const v = pre.v; P.ansNext = null; v.muted = false; v.volume = 1; v.dataset.end = s.a.t1 + .18;
    if (P.playing) v.play().catch(() => {}); show(v);
    if (P.pv) P.pv.volume = 0;                         // the place runs on, silent, while the archive speaks
    line.className = 'ans'; line.textContent = '“' + s.text + '”';
    who.textContent = 'ANSWER · FOR ' + s.who; who.style.background = 'var(--ans)'; who.style.opacity = 1;
    src.textContent = `${s.a.ti}${s.a.y ? ' (' + s.a.y + ')' : ''}`; $('#tags').textContent = src.textContent;
  } else {
    const pv = await placeVideo(ep, s.place);
    if (P.j !== j) return;
    if (pv !== P.pv) { if (P.pv) P.pv.pause(); pv._z = 1; P.pv = pv; P.pidx = s.place; show(pv, true) } else show(pv, false);
    if (P.playing) pv.play().catch(() => {});
    pv.muted = false; pv.volume = s.kind === 'card' ? .15 : s.kind === 'call' ? .16 : .32;
    V.slice(2).forEach(x => { if (!x.classList.contains('on')) x.pause() });
    const c = ep.places[s.place]; $('#tags').textContent = `${c.ti}${c.y ? ' (' + c.y + ')' : ''}`; src.textContent = '';
    if (s.kind === 'card') { card.textContent = s.text; card.className = 'on black'; line.textContent = ''; who.style.opacity = 0 }
    else if (s.card === 'title') { card.className = 'on'; card.innerHTML = `<small>EPISODE ${E + 1} OF ${EPS.length}${ep.series ? ' · ' + esc(ep.series) : ''}</small>${esc(ep.name)}<em>${esc(ep.logline)}</em>`; line.textContent = ''; who.style.opacity = 0 }
    else {
      line.className = s.kind === 'picture' ? 'act' : ''; if (s.kind === 'call') line.innerHTML = s.text.split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(' '); else line.textContent = s.text;
      if (s.kind === 'call') { who.textContent = s.who; who.style.background = 'var(--call)'; who.style.opacity = 1 } else who.style.opacity = 0;
    }
    if (s.ai) { P.voice.src = s.ai.f; P.voice.currentTime = 0; if (P.playing) P.voice.play().catch(() => {}) }
  }
  stage(s);
  P.start = performance.now(); P.pausedAt = P.playing ? 0 : P.start;
  preloadAnswer(j + 1); markStrip();
  // the next place, ready before it is needed
  const nx = P.shots.slice(j + 1).find(x => x.kind !== 'answer' && x.place !== P.pidx);
  if (nx) { const c = ep.places[nx.place % ep.places.length], w = P.pv === V[0] ? V[1] : V[0]; if (w.dataset.src !== c.v && !w.classList.contains('on')) load(w, c.v, clipIn(c)) }
}
// ---------- the cast as actors: the archive's own figures, moving as their clips moved ----------
function colorOf(who) { let h = 0; for (const c of who) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 78% 64%)` }
function face(who, size) {   // a portrait for the line-up on the title
  const f = (D.cast[who] || [])[0], el = document.createElement('div'); el.className = 'av';
  el.style.setProperty('--c', colorOf(who)); el.style.setProperty('--s', size);
  el.innerHTML = `<div class="disc">${f ? `<img src="${f.f}" alt="">` : `<b>${esc(who.replace(/[^A-Z ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2) || '?')}</b>`}</div><i>${esc(who)}</i>`;
  return el;
}
const ACT = {};
function actor(who) {
  if (ACT[who] !== undefined) return ACT[who];
