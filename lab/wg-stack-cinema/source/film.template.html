      <div class="srcrow"><button class="hb" id="sPlay" title="Play the source (Space)">Play</button><button class="hb" id="sIn" title="Mark in (I)">In</button><button class="hb" id="sOut" title="Mark out (O)">Out</button>
        <button class="hb pri" id="sIns" title="Put the marked take into the film after the selected shot">Insert</button><button class="hb" id="sRep" title="The selected shot takes the marked interval instead">Replace</button><button class="hb" id="sTab" title="Keep the take on the table, outside the film">Table</button><button class="hb" id="sB" title="Keep this footage as B, to compare with the next one you open">B</button><div class="shut" id="shut" title="Shuttle: drag from the middle to play backward or forward; let go to stop. Keys J, K, L"><i id="shutK"></i></div><span class="tc" id="sTc"></span></div>

    <form class="find" id="findF" autocomplete="off"><input id="q" placeholder="find a figure: a dog, hands, smoke" enterkeyhint="search"></form>
    <div class="tray" id="tray"></div>
  </aside>
</main>

<script>
'use strict';
const DATA=__DATA__;
const ROOT=location.protocol==='file:'?'https://hartswf0.github.io':'';
const SHM=ROOT+'/secondhand-motion/shots/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mss=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');};
const tcf=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0');};
const uid=()=>Math.random().toString(36).slice(2,8);
const FPS=30,snapF=t=>Math.round(t*FPS)/FPS;
let toastT=0;function toast(t,ms){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,ms||3200);}
function heard(t){$('#heard').innerHTML=t?esc(t).replace(/^(hearing:|reading|looking|waiting|undid|redid|audition|cancelled)/i,'<b>$1</b>'):'';}
/* ======== icons: drawn strokes, no glyph fonts; every button keeps its words as a tooltip and for screen readers ======== */
const IC={archive:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',source:'M3 5h18v14H3z M7 5v14 M17 5v14 M3 9h4 M3 15h4 M17 9h4 M17 15h4',shot:'M12 4 3 9l9 5 9-5z M3 14l9 5 9-5',table:'M3 8h11v12H3z M7 4h14v12',film:'M3 5h18v14H3z F10 9v6l5-3z',
 undo:'M9 6 4 11l5 5 M4 11h11a5 5 0 0 1 0 10h-4',redo:'M15 6l5 5-5 5 M20 11H9a5 5 0 0 0 0 10h4',films:'M3 6h6l2 2h10v11H3z',send:'M12 4v11 M7 10l5 5 5-5 M4 20h16',
 play:'F7 5v14l12-7z',pause:'F7 5h3.5v14H7z F13.5 5H17v14h-3.5z',sound:'M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11',mute:'M4 9h4l5-4v14l-5-4H4z M16 9l5 6 M21 9l-5 6',
 mic:'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M6 11a6 6 0 0 0 12 0 M12 17v4',
 hand:'M8 13V6a1.5 1.5 0 0 1 3 0v5 M11 11V4.5a1.5 1.5 0 0 1 3 0V11 M14 11V6a1.5 1.5 0 0 1 3 0v7 M8 13l-1.6-2a1.6 1.6 0 0 0-2.6 1.9L8 19a5 5 0 0 0 4 2h1a4 4 0 0 0 4-4v-4',
 floor:'M6 3h12v18H6z M10.5 18h3',in:'M10 4H6v16h4 M13 12h6',out:'M14 4h4v16h-4 M5 12h6',insert:'M12 5v14 M5 12h14',replace:'M4 8h13l-3-3 M20 16H7l3 3',totable:'M3 11h18v9H3z M7 7h10 M9 3h6',
 b:'M3 5h18v14H3z M9 8v8h4a2 2 0 0 0 0-4H9h3.5a2 2 0 0 0 0-4z',check:'M5 12l5 5 9-10',x:'M6 6l12 12 M18 6 6 18',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',expand:'M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5',help:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M9.5 9.5a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2.2-2.5 3.7 M12 17h.01'};
function svgI(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'').split(/\s(?=[MF])/).map(g=>g[0]==='F'?'<path class="f" d="M'+g.slice(1)+'"/>':'<path d="'+g+'"/>').join('')+'</svg>';}
function ib(el,n,label){if(typeof el==='string')el=$(el);if(!el)return;el.innerHTML=svgI(n)+'<span class="sr">'+label+'</span>';el.classList.add('ic');if(label)el.title=el.title&&el.dataset.t0?el.title:(el.dataset.t0=1,el.title||label);el.setAttribute('aria-label',label);}
const MODES=[{k:'archive',t:'Archive'},{k:'source',t:'Source'},{k:'shot',t:'Shot'},{k:'table',t:'Table'},{k:'film',t:'Film'}];

/* ================= the archive ================= */
let SAM=null,EMB=null,EXT='.png',LIB=null,BYID=new Map();const FI=new Map();
const WG=DATA.wg.map(([id])=>({id,name:'WarGames '+id.slice(3)}));
const SHN=Object.fromEntries(DATA.sh.map(s=>[s.slug,s]));
const DOODLES=Object.entries(DATA.say||{}).filter(([,v])=>v[1]==='cast').map(([w,v])=>({word:w,slug:v[0]}));
const furl=p=>EXT==='.png'?p:p.replace(/\.png$/,EXT);
const castP=(async()=>{const [j,b]=await Promise.all([fetch('markov/sam.json').then(r=>r.json()),fetch('markov/sam-emb.bin').then(r=>r.arrayBuffer())]);SAM=j;EMB=new Int8Array(b);SAM.figs.forEach((f,i)=>FI.set(f.shot+'/'+f.k,i));
 EXT=await new Promise(r=>{const i=new Image();i.onload=()=>r('.webp');i.onerror=()=>r('.png');i.src=SAM.figs[0].png.replace(/\.png$/,'.webp');});})();
const libP=SH.load({light:true}).then(d=>{LIB=d.LIB;BYID=new Map(LIB.shots.map((s,i)=>[s.id,i]));return d;});
const figSims=e=>{const n=SAM.n,d=SAM.dim,o=new Float32Array(n);for(let i=0;i<n;i++){let s=0,r=i*d;for(let j=0;j<d;j++)s+=e[j]*EMB[r+j];o[i]=s*SAM.scale;}return o;};
const rankOf=s=>Array.from(s.keys()).sort((a,b)=>s[b]-s[a]);
function nearFigs(i,k){const r=new Float32Array(SAM.n),d=SAM.dim;for(let j=0;j<SAM.n;j++){let s=0;for(let u=0;u<d;u++)s+=EMB[i*d+u]*EMB[j*d+u];r[j]=s;}return rankOf(r).filter(j=>j!==i).slice(0,k);}
async function embed(texts){await libP;return SH.embed(texts);}
const readerReady=()=>!!(SH.server||(window.ClipText&&ClipText.state==='ready'));
/* an asset: a source of moving pictures and sound. 'w:wg_003' is a WarGames clip on this site; 'arch:<id>' an archive shot */
const DUR={};
const sdir=slug=>(SHN[slug]&&SHN[slug].dir)||slug+'-gwp';
const fIdx=(S,t)=>clamp(Math.floor(t*S.fps+1e-6),0,S.footage.length-1);
const fUrl=(slug,S,k)=>{const f=S.footage[k];return f.startsWith('data:')?f:SHM+sdir(slug)+'/'+f;};
function A(src){if(!src)return null;
 if(src.startsWith('shm:')){const slug=src.slice(4),m=SHN[slug],S=SHD[slug];if(!S)doodle(slug);if(S)DUR[src]=S.footage.length/S.fps;
  return {src,seq:true,title:(m?m.title:slug),thumb:S?fUrl(slug,S,0):SHM+sdir(slug)+'/cover.png',in:0,dur:S?S.footage.length/S.fps:null,local:true,silent:true,S,figs:!!(S&&S.masks&&S.masks.some(q=>q&&q.length))};}if(src.startsWith('w:')){const id=src.slice(2);return {src,video:'clips/'+id+'.mp4',thumb:'thumbs/clips/'+id+'.jpg',title:'WarGames '+id.slice(3),in:0,dur:DUR[src]??null,local:true};}
 const id=src.replace(/^arch:/,''),i=BYID.get(id),s=i!=null&&LIB.shots[i];return s?{src,video:s.video,thumb:s.thumb,title:s.title+(s.year?' ('+s.year+')':''),in:s.in||0,dur:DUR[src]??null,film:s.src}:{src,video:null,thumb:'',title:'archive shot',in:0,dur:null};}
const R2='https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/';let TIX=null;const tix=()=>TIX||(TIX=fetch('aspect/thumbs.json').then(r=>r.json()).catch(()=>null));
const foreign=u=>/^https?:/.test(u)&&!u.startsWith(location.origin);
const IM={};function img(u){let i=IM[u];if(!i){i=IM[u]=new Image();i.decoding='async';i.onload=()=>{i.ok=1;dirty=true;};
  const go=(src,cross)=>{i.crossOrigin=cross?'anonymous':null;i._cross=cross;i.src=src;};
  i.onerror=()=>{const s=i.src;if(i._cross){i.taint=1;go(s,false);return;}if(i._fixed)return;i._fixed=1;const m=u.match(/([0-9a-f]{8})(-[0-9a-f-]{27})\.jpg/);if(!m)return;tix().then(d=>{const k=d&&d.map[m[1]];if(k!=null)go(R2+d.pre[k]+'/thumbnails/'+((d.stem||{})[m[1]]||m[1]+m[2])+'.jpg',true);});};
  go(u,foreign(u));}return i;}
const SHD={},SHP={};function doodle(slug){if(!SHP[slug]){const d=(SHN[slug]&&SHN[slug].dir)||slug+'-gwp';SHP[slug]=fetch(SHM+d+'/shot.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(S=>{let b=null;for(const f of S.cast.frames){b=bbox(f);if(b)break;}S.bb=b||{x0:0,y0:0,x1:S.W,y1:S.H};S.fb=[];SHD[slug]=S;dirty=true;
  if(!(S.masks&&S.masks.some(q=>q&&q.length)))fetch(SHM+d+'/masks.json').then(r=>r.ok?r.json():null).then(M=>{if(!M)return;const n=(S.footage||[]).length;S.masks=Array.from({length:n},(_,i)=>M[i]||M[String(i)]||[]);S.mm=null;S.mb=null;panelKey='';dirty=true;}).catch(()=>{});
  return S;});SHP[slug].catch(()=>{});}return SHP[slug];}
function bbox(st){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of st||[])for(const [x,y] of p||[]){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}return x1<x0?null:{x0,y0,x1,y1};}

/* ================= the film document =================
   film.shots: the sequence, in order. A shot is a take of a source (take.src, take.in, take.out in SOURCE seconds), its gain, its line,
   and its figures (times in SHOT seconds, 0 at the shot's first frame). Its length is take.out - take.in; nothing else stores length.
   film.table: takes kept aside, in the same form; they do not play.
   Sequence time is the sum of the lengths before a shot. Trimming moves every later shot; figures that ran to the old end run to the
   new end; keys keep their shot times. */
const STORE='wg-stack-films-v3';
let FILMS=[];try{FILMS=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem('wg-stack-films-v2')||'[]').map(upgrade);}catch(e){}
let film=null,ver=0,saveT=0;const MEMO=new Map();
const len=s=>Math.max(.1,s.take.out-s.take.in);
const bump=()=>{ver++;dirty=true;};
function upgrade(f){if(!f||!f.shots)return f;f.table=f.table||[];for(const s of [...f.shots,...f.table]){if(!s.take){const src=s.g?(s.g.k==='wg'?'w:'+s.g.id:'arch:'+s.g.id):null;s.take={src,in:0,out:s.len||4};delete s.g;delete s.len;}if(s.gain==null)s.gain=1;delete s.cands;delete s.alts;delete s.wait;delete s.rough;}f.v=3;return f;}
function saveNow(){if(!film||FLOOR)return;film.ui={shot:SHOT,t:+T.toFixed(3)};const i=FILMS.findIndex(f=>f.id===film.id);if(i<0&&!film.shots.length)return;const o=JSON.parse(JSON.stringify(film));if(i>=0)FILMS[i]=o;else FILMS.unshift(o);try{localStorage.setItem(STORE,JSON.stringify(FILMS));}catch(e){}}
addEventListener('pagehide',saveNow);addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});
function save(){bump();clearTimeout(saveT);saveT=setTimeout(()=>{if(!film)return;film.updated=Date.now();film.ui={shot:SHOT,t:+T.toFixed(3)};film.title=(film.shots[0]&&film.shots[0].text)||film.title||'untitled';const i=FILMS.findIndex(f=>f.id===film.id);const o=JSON.parse(JSON.stringify(film));if(i>=0)FILMS[i]=o;else FILMS.unshift(o);FILMS.sort((a,b)=>b.updated-a.updated);FILMS=FILMS.slice(0,24);try{localStorage.setItem(STORE,JSON.stringify(FILMS));}catch(e){toast('This browser is full; download the project file to keep it.');}},250);}
/* editorial history: every manipulation is begun, then committed as one step, or cancelled and restored */
const H={undo:[],redo:[]};
function begin(label){return {label,before:JSON.stringify(film),sel:[SHOT,SEL]};}
function commit(tok){if(!tok)return false;const now=JSON.stringify(film);if(now===tok.before)return false;H.undo.push({label:tok.label,before:tok.before,after:now,sel:tok.sel});if(H.undo.length>120)H.undo.shift();H.redo.length=0;$('#lastAct').textContent=tok.label;save();return true;}
function cancel(tok){if(!tok)return;film=JSON.parse(tok.before);[SHOT,SEL]=tok.sel;stripKey=tableKey=chipKey=panelKey='';bump();heard('cancelled: '+tok.label);}
function act(label,fn){const tok=begin(label);const r=fn();commit(tok);return r;}
function restore(json,sel){film=JSON.parse(json);if(!film.shots.some(s=>s.id===SHOT)&&!film.table.some(s=>s.id===SHOT))SHOT=sel&&sel[0]||film.shots[0]&&film.shots[0].id;if(SEL&&SEL!=='ground'&&!findEl(SEL))SEL=null;T=clamp(T,0,Math.max(0,total()-.001));stripKey=tableKey=chipKey=panelKey='';save();}
function undo(){const h=H.undo.pop();if(!h)return toast('Nothing to undo.');PLACED=null;H.redo.push(h);restore(h.before,h.sel);heard('undid: '+h.label);$('#lastAct').textContent='';}
function redo(){const h=H.redo.pop();if(!h)return toast('Nothing to redo.');H.undo.push(h);restore(h.after,h.sel);heard('redid: '+h.label);}
function newFilm(){film={v:3,id:uid(),title:'',shots:[],table:[],cap:true,grade:true,updated:Date.now()};H.undo.length=H.redo.length=0;T=0;SHOT=null;SEL=null;bump();}
const starts=()=>{let t=0;return film.shots.map(s=>{const a=t;t+=len(s);return a;});};
const total=()=>film.shots.reduce((t,s)=>t+len(s),0);
function shotAt(t){const S=starts();for(let i=film.shots.length-1;i>=0;i--)if(t>=S[i]-1e-6)return {s:film.shots[i],i,a:S[i]};return null;}
const curShot=()=>film.shots.find(s=>s.id===SHOT)||film.table.find(s=>s.id===SHOT)||null;
function findEl(id){for(const s of [...film.shots,...film.table])for(const e of s.figs)if(e.id===id)return e;return null;}
const shotOf=e=>[...film.shots,...film.table].find(s=>s.figs.includes(e));
const nameShot=s=>{const i=film.shots.indexOf(s);return i>=0?'shot '+(i+1):'the table take';};
function at(e,t){const k=e.keys;if(k.length===1||t<=k[0].t)return k[0];if(t>=k[k.length-1].t)return k[k.length-1];for(let i=1;i<k.length;i++)if(t<k[i].t){const a=k[i-1],b=k[i],u=(t-a.t)/(b.t-a.t||1);return {t,x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,s:a.s+(b.s-a.s)*u,r:(a.r||0)+((b.r||0)-(a.r||0))*u};}return k[k.length-1];}
function nameOf(e){if(!e)return '';if(e.kind==='mfig'){const a=A(e.src);return 'figure from '+(a?a.title:'a film');}if(e.kind==='fig'){const F=SAM&&SAM.figs[FI.get(e.ref)];return F?F.desc:'figure';}return 'drawing of '+e.word;}
function fromOf(e){if(e.kind==='mfig'){const a=A(e.src);return 'lifted from '+(a?a.title:'?')+' '+tcf(e.in)+'–'+tcf(e.out)+', with its mask in every frame';}if(e.kind==='fig'){const F=SAM&&SAM.figs[FI.get(e.ref)];return F?'cut out of '+(F.title||'an archive film')+(F.year?' ('+F.year+')':''):'';}return 'a Secondhand Motion doodle';}
function newShot(take,text){return {id:uid(),text:text||'',take:{src:take.src,in:snapF(take.in),out:snapF(take.out)},gain:1,figs:[]};}
function fitFigs(s,old){const n=len(s);for(const f of s.figs){if(f.t1>=old-.01)f.t1=n;f.t0=Math.min(f.t0,n-.1);}}
function setOut(s,out){const old=len(s);s.take.out=Math.max(s.take.in+.1,snapF(out));fitFigs(s,old);}
function setIn(s,inn){const old=len(s);s.take.in=clamp(snapF(inn),0,s.take.out-.1);fitFigs(s,old);}

/* ================= composing a line: the archive answers with a ground and figures ================= */
