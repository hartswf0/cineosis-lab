<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Markov Poet film</title>
<meta name="description" content="A film cut from a public film archive by someone's words. Watch it, then remix it.">
<meta property="og:title" content="A Markov Poet film"><meta property="og:description" content="Words cut into a film from a public archive. Watch it, then remix it.">
<style>html,body{margin:0;height:100%;background:#050505;color:#8a8378;font:13px ui-monospace,Menlo,monospace;display:grid;place-items:center;text-align:center;padding:20px}a{color:#e8c070}</style></head>
<body><p id="m">opening the film…</p>
<!-- The link carries the cut itself (#f=…): shots, times, words, score. This page unpacks it and becomes the player. No engine is loaded. -->
<script src="markov/guide.js?v=4"></script>
<script src="markov/export.js?v=4"></script>
<script>
(async () => {
  const m = location.hash.match(/#f=([\w-]+)/), say = t => document.getElementById('m').innerHTML = t;
  if (!m) return say('This link carries no film. <a href="shannon-poet.html">Make one in the Poet</a>.');
  try { const pr = await MPExport.fromLink(m[1]), html = await MPExport.cardHTML(pr); document.open(); document.write(html); document.close(); }
  catch (e) { say('The film in this link could not be read. <a href="shannon-poet.html">Make one in the Poet</a>.'); }
})();
</script>
</body></html>
