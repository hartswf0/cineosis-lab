<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOPR // STUDIO SET</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #33ff77;
    font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10px;
  }
  .app {
    display: grid;
    grid-template-rows: 26px 1fr;
    width: 100vw; height: 100vh;
  }
  .bar {
    display: flex; align-items: center; gap: 3px;
    padding: 0 6px; border-bottom: 1px solid #0a3318;
    background: #000; overflow-x: auto; white-space: nowrap;
  }
  button, a.btn {
    font-family: inherit; font-size: 9.5px;
    background: #000; color: #33ff77;
    border: 1px solid #197a3a; padding: 2px 6px;
    cursor: pointer; text-decoration: none; text-transform: uppercase;
  }
  button.on, button:hover, a.btn:hover {
    background: #33ff77; color: #000; font-weight: 700;
  }
  button.amber { color: #ffb000; border-color: #664400; }
  button.amber.on, button.amber:hover { background: #ffb000; color: #000; }
  button.cyan { color: #00e5ff; border-color: #005566; }
  button.cyan.on, button.cyan:hover { background: #00e5ff; color: #000; }

  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%; height: 100%; background: #0a3318; gap: 1px;
  }
  .stage.single { grid-template-columns: 1fr; }
  iframe { width: 100%; height: 100%; border: none; background: #000; display: block; }
  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .stage.single { grid-template-rows: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="amber on" id="bDual" onclick="setDual()">[SPLIT: 3D WORM + 4D GRID]</button>
    <button class="amber" id="b12" onclick="setOne('wg-studio-worm.html','b12')">[12: 3D WORM]</button>
    <button class="cyan" id="b11" onclick="setOne('wg-studio-stgl.html','b11')">[11: 4D GRID]</button>
    <button id="b01" onclick="setOne('wg-studio-screens.html','b01')">[01: 68 SCREENS]</button>
    <button id="b04" onclick="setOne('bumblebee-dilemma.html','b04')">[04: SOUND]</button>
    <button id="b02" onclick="setOne('wg-studio-whitney.html','b02')">[02: WHITNEY]</button>
    <button id="b03" onclick="setOne('wg-studio-knowlton.html','b03')">[03: KNOWLTON]</button>
    <button id="b05" onclick="setOne('wg-studio-nake.html','b05')">[05: NAKE]</button>
    <button id="b06" onclick="setOne('wg-studio-mohr.html','b06')">[06: MOHR]</button>
    <button id="b10" onclick="setOne('wg-studio-reas.html','b10')">[10: REAS]</button>
    <a class="btn" href="wg-studio-worm.html">[FULLSCREEN WORM]</a>
    <a class="btn" href="wg-studio-stgl.html">[FULLSCREEN GRID]</a>
  </div>
  <div class="stage" id="stage">
    <iframe src="wg-studio-worm.html"></iframe>
    <iframe src="wg-studio-stgl.html"></iframe>
  </div>
</div>
<script>
function clr() { document.querySelectorAll('.bar button').forEach(b => b.classList.remove('on')); }
function setDual() {
  clr(); document.getElementById('bDual').classList.add('on');
  const s = document.getElementById('stage');
  s.className = 'stage';
  s.innerHTML = '<iframe src="wg-studio-worm.html"></iframe><iframe src="wg-studio-stgl.html"></iframe>';
}
function setOne(u, id) {
  clr(); document.getElementById(id).classList.add('on');
  const s = document.getElementById('stage');
  s.className = 'stage single';
  s.innerHTML = `<iframe src="${u}"></iframe>`;
}
</script>
</body>
</html>
