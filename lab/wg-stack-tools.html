<title>WAR GAMES · STACK</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* One stage, one sheet, one tray. The stage takes what is left; the sheet's cells and the keys keep
   their size and place however many layers and frames the world holds. Only one tray is open. */
:root{--ink:#161412;--paper:#fff;--rule:#161412;--dim:#8c8378;--amber:#ffd23f;--red:#e8402e;--blue:#3b6fe0;--tint:#f4f1ea;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overscroll-behavior:none}
body{font:11px/1.25 var(--mono);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:var(--ink);background:var(--paper);border:0;cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
[hidden]{display:none!important}
.bar{flex:0 0 28px;display:flex;align-items:stretch;border-bottom:2px solid var(--ink)}
.bar>*{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--ink);white-space:nowrap;letter-spacing:.05em;font-size:10.5px}
.bar #where{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:28px}
.bar .r{border-right:0;border-left:1px solid var(--ink)}
.mid{flex:1 1 auto;display:flex;min-height:0}
.stage{flex:1 1 auto;position:relative;min-height:120px;overflow:hidden;min-width:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.rest{position:absolute;left:0;right:0;bottom:10px;text-align:center;letter-spacing:.1em;color:var(--dim);pointer-events:none}
.sheetbox{flex:0 0 auto;position:relative;border-top:1px solid var(--ink)}
#sheet{display:block;width:100%;height:122px;touch-action:none}
.ops{flex:0 0 32px;display:flex;align-items:stretch;background:var(--amber);border-top:1px solid var(--ink)}
.ops button{flex:1 1 0;min-width:0;background:transparent;border-right:1px solid var(--ink);font-size:10px;letter-spacing:.04em;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ops button:first-child{flex:2.6 1 0;text-align:left;padding:0 8px;font-weight:600}
.ops button:first-child i{font-style:normal;font-weight:400;opacity:.7}
.ops button:last-child{border-right:0}
.ops.none{background:var(--tint)}
.tray{flex:0 0 360px;overflow:auto;border-left:1px solid var(--ink);padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp>b{font-weight:600;font-size:10px;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row button,.chip{border:1px solid var(--ink);padding:6px 9px;font-size:10.5px;letter-spacing:.04em;min-height:30px}
.tabs{display:flex;border:1px solid var(--ink)}
.tabs button{flex:1;padding:7px 4px;border-right:1px solid var(--ink);font-size:10.5px;letter-spacing:.05em}
.tabs button:last-child{border-right:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.cell{position:relative;aspect-ratio:4/3;background:var(--tint) center/cover no-repeat;border:1px solid var(--ink);text-align:left}
.cell span{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);font-size:9.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.on{outline:3px solid var(--amber);outline-offset:-3px}
textarea,input[type=text]{font:inherit;font-size:12px;border:1px solid var(--ink);padding:6px;width:100%;background:var(--paper);color:var(--ink);resize:vertical}
textarea{min-height:52px}
input[type=range]{width:100%;accent-color:var(--ink)}
.info{font-size:10.5px;line-height:1.45;color:#3d3833;white-space:normal}
.info b{color:var(--ink)}
.keys{flex:0 0 44px;display:flex;border-top:2px solid var(--ink)}
.keys button{flex:1 1 0;border-right:1px solid var(--ink);font-size:10.5px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.keys button b{font-size:9px;font-weight:500;opacity:.6}
.keys button:last-child{border-right:0}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:760px){.mid{flex-direction:column}.tray{flex:0 0 auto;max-height:36vh;border-left:0;border-top:1px solid var(--ink)}}
@media (max-width:640px){#sheet{height:102px}.bar>*{padding:0 7px}}
</style>
</head>
<body>
<div class="bar">
  <button id="bView" title="Flat: the frame as it plays. Stack: the layers apart in depth.">FLAT</button>
  <span id="where"></span>
  <button id="bPlay" class="r">PLAY</button>
  <button id="bUndo" class="r">UNDO</button>
  <button id="bHands" class="r" title="Camera hands. Tool hand: pinch draws, grabs, scrubs; open hand lets go; two fingers copy; thumb up next frame; thumb down delete; fist undo. Second hand: pinch and move up or down through the frames; sideways turns the stack.">HANDS</button>
</div>
<div class="mid"><div class="stage" id="stageBox"><canvas id="stage"></canvas><div class="rest" id="rest"></div></div><div class="tray" id="tray" hidden></div></div>
<div class="ops none" id="ops"></div>
<div class="sheetbox"><canvas id="sheet"></canvas></div>
<div class="keys" id="keys">
  <button data-k="source"><span>SOURCE</span><b>A</b></button>
  <button data-k="draw"><span>DRAW</span><b>B</b></button>
  <button data-k="note"><span>NOTE</span><b>C</b></button>
  <button data-k="layer"><span>LAYER</span><b>D</b></button>
  <button data-k="time"><span>TIME</span><b>E</b></button>
  <button data-k="out"><span>OUT</span><b>F</b></button>
</div>
<input type="file" id="file" accept="application/json,.json,image/*" hidden>
<canvas id="hand"></canvas><video id="cam" playsinline muted></video>

function kindMark(L,x,y){xg.save();xg.strokeStyle=xg.fillStyle=L.vis?INK:MUTED;xg.lineWidth=1.3;const k=L.kind;

 else if(k==='plane'){xg.beginPath();xg.moveTo(x-6,y+3);xg.lineTo(x-2,y-2);xg.lineTo(x+2,y+1);xg.lineTo(x+6,y-3);xg.stroke();}
 else if(k==='cast'){xg.beginPath();xg.arc(x,y-2,2.5,0,7);xg.moveTo(x,y);xg.lineTo(x,y+4);xg.moveTo(x-3,y+5);xg.lineTo(x,y+3);xg.lineTo(x+3,y+5);xg.stroke();}
 else if(k==='mask'){xg.beginPath();xg.ellipse(x,y,5,4,0,0,7);xg.globalAlpha=.4;xg.fill();xg.globalAlpha=1;xg.stroke();}

 if(!L.vis){xg.strokeStyle=RED;xg.beginPath();xg.moveTo(x-7,y+6);xg.lineTo(x+7,y-6);xg.stroke();}xg.restore();}
function cellMark(L,f,i,x,y){const k=L.kind;
 if(k==='draw'){const isKey=L.keys&&L.keys[f]!=null,held=keyAt(L,f)!=null;if(isKey){xg.fillStyle=INK;xg.fillRect(x+2,y+5,CW-4,ROW-10);}else if(held){xg.fillStyle=MUTED;xg.fillRect(x,y+ROW/2-.5,CW,1);}return;}

 if(k==='clip'){const c=CLIPF[L.id];xg.fillStyle=c&&c.frames[i]?'#cfc6b6':'#efe9de';xg.fillRect(x,y+4,CW-1,ROW-8);return;}

 if(k==='cast'){const sm=SHOT_BY[L.shot],K=sm&&sm.keys&&sm.keys.includes(i);xg.fillStyle=K?INK:'#6b6259';xg.fillRect(x+(K?2:4),y+(K?5:7),CW-(K?4:8),ROW-(K?10:14));if(L.fnotes&&L.fnotes[i]){xg.fillStyle=BLUE;xg.fillRect(x+2,y+ROW-4,CW-4,2);}if(sm&&sm.line===i){xg.strokeStyle=RED;xg.strokeRect(x+1.5,y+3.5,CW-3,ROW-7);}return;}

let sheetDrag=null;
function sheetAt(px,py){const rows=order();const ri=Math.floor((py-HEAD)/ROW)+sy;return {L:py>=HEAD?rows[ri]:null,ri,f:px>=NAMEW?clamp(sx+Math.floor((px-NAMEW)/CW),0,W.n-1):null};}
function shDown(px,py){const a=sheetAt(px,py);
 if(py<HEAD&&a.f!=null){F=a.f;sheetDrag={kind:'scrub'};changed(false);return;}
 if(!a.L)return;
 if(px<18){snap();a.L.vis=!a.L.vis;changed();return;}
 SEL=a.L.id;if(a.f!=null){F=a.f;sheetDrag={kind:'scrub'};}else sheetDrag={kind:'name',y:py,ri:a.ri,to:a.ri,moved:false};changed(false);}
function shMove(px,py){if(!sheetDrag)return;const a=sheetAt(px,py);
 if(sheetDrag.kind==='scrub'&&a.f!=null&&a.f!==F){F=a.f;dirty=true;sheetDirty=true;where();}
 if(sheetDrag.kind==='name'||sheetDrag.kind==='reorder'){if(Math.abs(py-sheetDrag.y)>6)sheetDrag.kind='reorder';sheetDrag.to=clamp(Math.round((py-HEAD)/ROW)+sy,0,W.layers.length);sheetDirty=true;}}
function shUp(){const d=sheetDrag;sheetDrag=null;if(d&&d.kind==='reorder'){const rows=order(),from=d.ri;let to=d.to;if(to>from)to--;if(to!==from){snap();const zs=rows.map(l=>l.z);const [it]=rows.splice(from,1);rows.splice(to,0,it);rows.forEach((l,i)=>l.z=zs[i]);fixZ();changed();say('Moved '+it.name+(to<from?' forward.':' back.'));}else sheetDirty=true;}}
function fixZ(){const rows=order();for(let i=1;i<rows.length;i++)if(rows[i].z<=rows[i-1].z)rows[i].z=+(rows[i-1].z+.05).toFixed(2);}

sheet.addEventListener('pointerup',shUp);sheet.addEventListener('pointercancel',shUp);
sheet.addEventListener('wheel',e=>{e.preventDefault();const r=sheet.getBoundingClientRect();if(e.clientX-r.left<NAMEW||e.shiftKey)sy+=Math.sign(e.deltaY);else sx+=Math.sign(e.deltaY+e.deltaX)*3;sheetDirty=true;},{passive:false});

 else if(k==='op'){const s=[1,.75,.5,.25],i=s.findIndex(v=>Math.abs(v-L.op)<.01);L.op=s[(i+1)%s.length];}
 else if(k==='fwd'||k==='back'){const rows=order(),i=rows.indexOf(L),j=k==='fwd'?i-1:i+1;if(j<0||j>=rows.length){UNDO.pop();return;}const t=L.z;L.z=rows[j].z;rows[j].z=t;}

function sortLayers(how){snap();const rows=order(),zs=rows.map(l=>l.z).sort((a,b)=>a-b);let list=rows.slice();

 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.layers))throw Error('not a world');snap();W=d;SEL=null;F=0;changed();say('Opened '+W.name+'.');}catch(err){say('Could not open: '+err.message);}};

/* ---------- the world as a prompt, for an agent or a person ---------- */
function worldPrompt(){const L=order(),out=[];out.push('WORLD: '+W.name+' · '+W.W+'×'+W.H+' · '+W.n+' frames at '+W.fps+' fps ('+(W.n/W.fps).toFixed(1)+' s).','Layers, front to back. Nearer layers (lower z) move faster when the camera pans.','');
 L.forEach((l,i)=>{const sm=l.shot&&SHOT_BY[l.shot];out.push((i+1)+'. '+l.name+' · '+KIND[l.kind].toLowerCase()+' · z '+(+l.z.toFixed(2))+' · '+(BLENDS.find(b=>b[0]===l.blend)||BLENDS[0])[1].toLowerCase()+' '+Math.round(l.op*100)+'%'+(l.vis?'':' · hidden')+(sm?' · from "'+sm.title+'" ('+(sm.film||'')+')':'')+(l.clip?' · clip '+clipInfo(l.clip).name+' '+l.in.toFixed(1)+'–'+l.out.toFixed(1)+' s':'')+(l.at?' · starts frame '+(l.at+1):''));
  if(l.note)out.push('   note: '+l.note);if(l.prompt)out.push('   prompt: '+l.prompt);
  const fn=Object.entries(l.fnotes||{}).filter(([,v])=>v);if(fn.length)out.push('   frames: '+fn.slice(0,24).map(([f,v])=>(+f+1)+' '+v).join(' · '));
  if(l.pins.length)out.push('   pins: '+l.pins.map(p=>'frame '+(p.f+1)+' at ('+Math.round(p.x)+','+Math.round(p.y)+') '+p.text).join(' · '));
  if(l.kind==='draw'){const ks=Object.keys(l.keys||{}).map(Number).sort((a,b)=>a-b);out.push('   ink keys at frames: '+(ks.map(k=>k+1).join(', ')||'none'));}});
 out.push('','Keep every layer\'s depth and timing. Where a layer has a prompt, follow it for that layer only.');return out.join('\n');}

/* ---------- time ---------- */
let acc=0,last=performance.now();
function setPlay(on){playing=on;$('bPlay').textContent=on?'STOP':'PLAY';$('bPlay').setAttribute('aria-pressed',String(on));last=performance.now();acc=0;if(TRAY==='time')buildTray();dirty=true;}
function step(n){F=(F+n+W.n)%W.n;dirty=true;sheetDirty=true;where();if(TRAY==='note')buildTray();}
function where(){const L=layer(SEL);$('where').textContent=W.name+' · frame '+(F+1)+' / '+W.n+(L?' · '+L.name:'');}
let sayT=0;function say(t){const w=$('where');w.textContent=t;clearTimeout(sayT);sayT=setTimeout(where,3800);}
$('bPlay').onclick=()=>setPlay(!playing);$('bUndo').onclick=undo;
$('bView').onclick=()=>{VIEW=VIEW==='flat'?'stack':'flat';$('bView').textContent=VIEW==='flat'?'FLAT':'STACK';$('bView').setAttribute('aria-pressed',String(VIEW==='stack'));dirty=true;};
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();setPlay(!playing);}else if(k==='arrowright'||k==='.')step(1);else if(k==='arrowleft'||k===',')step(-1);
 else if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();undo();}else if(k==='v'&&!e.metaKey&&!e.ctrlKey)$('bView').click();
 else if('abcdef'.includes(k)&&k.length===1&&!e.metaKey&&!e.ctrlKey)openTray(['source','draw','note','layer','time','out']['abcdef'.indexOf(k)]);
 else if(k==='arrowup'||k==='arrowdown'){e.preventDefault();const rows=order(),i=rows.findIndex(l=>l.id===SEL);const n=rows[clamp(i+(k==='arrowdown'?1:-1),0,rows.length-1)];if(n){SEL=n.id;changed(false);}}});

/* ---------- out ---------- */
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'world';}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
async function copy(t,what){try{await navigator.clipboard.writeText(t);say(what+' copied.');}catch(e){download(t,slugify(W.name)+'-prompt.txt','text/plain');say(what+' saved as a file.');}}
function pngFrame(){const c=document.createElement('canvas');c.width=W.W*2;c.height=W.H*2;composite(c.getContext('2d'),F,2,{pins:false});c.toBlob(b=>download(b,slugify(W.name)+'-f'+(F+1)+'.png'),'image/png');}
async function prepare(){const need=[];for(const L of W.layers){if(L.shot&&!SHD[L.shot])need.push(shot(L.shot).catch(()=>{}));}await Promise.all(need);
 const ims=[];for(const L of W.layers){if(L.kind==='foot'&&SHD[L.shot]){const S=SHD[L.shot];for(let i=0;i<S.footage.length;i++)ims.push(shotImg(S,i));}if(L.kind==='art')ims.push(img(L.img));if(L.kind==='clip')clipFrames(L);}
 const t0=performance.now();while(performance.now()-t0<20000){const wait=ims.filter(im=>im&&!im.complete).length+W.layers.filter(L=>L.kind==='clip'&&!clipFrames(L).done&&!clipFrames(L).error).length;if(!wait)break;say('Preparing '+wait+' frames…');await new Promise(r=>setTimeout(r,250));}}
async function renderWebm(){if(!window.MediaRecorder)return say('This browser cannot record video.');setPlay(false);await prepare();
 const c=document.createElement('canvas');c.width=W.W*2;c.height=W.H*2;const g=c.getContext('2d');const stream=c.captureStream(W.fps);
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5e6}:{});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 const done=new Promise(r=>rec.onstop=r);composite(g,0,2);rec.start(200);
 for(let f=0;f<W.n;f++){F=f;composite(g,f,2);dirty=true;sheetDirty=true;say('Rendering frame '+(f+1)+' / '+W.n);await new Promise(r=>setTimeout(r,1000/W.fps));}
 rec.stop();await done;const blob=new Blob(chunks,{type:'video/webm'});download(blob,slugify(W.name)+'.webm');say('Rendered '+(blob.size/1e6).toFixed(1)+' MB webm, '+W.n+' frames.');window.__lastRender=blob.size;}

/* ---------- hands: the tool hand acts where it points; the second hand moves through time ---------- */
const H={on:false,tool:null,other:null,lm:null,t:-1,g:{name:null,since:0,latched:false,quiet:0},grip:null,cursor:null};let landmarker=null;
$('bHands').onclick=async()=>{const b=$('bHands');if(H.on){H.on=false;b.textContent='HANDS';b.setAttribute('aria-pressed','false');$('cam').srcObject&&$('cam').srcObject.getTracks().forEach(t=>t.stop());return;}
 try{b.textContent='STARTING';const cam=$('cam');cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});await cam.play();
  if(!landmarker){const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');
   const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:2});
   try{landmarker=await vision.HandLandmarker.createFromOptions(fs,o('GPU'));}catch(e){landmarker=await vision.HandLandmarker.createFromOptions(fs,o('CPU'));}}
  H.on=true;b.textContent='HANDS ON';b.setAttribute('aria-pressed','true');}catch(e){b.textContent='NO CAMERA';setTimeout(()=>b.textContent='HANDS',2500);}};
const dd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function readHand(prev,lm){const h=prev||{x:innerWidth/2,y:innerHeight/2,pinch:false};const size=dd(lm[0],lm[9])||1e-3,pr=dd(lm[4],lm[8])/size;
 const ext=[[8,6],[12,10],[16,14],[20,18]].map(([t,p])=>dd(lm[0],lm[t])>dd(lm[0],lm[p])*1.12);const n=ext.filter(Boolean).length,was=h.pinch;
 if(h.pinch){if(pr>.5||n>=4)h.pinch=false;}else if(pr<.32)h.pinch=true;
 const mx=1-(lm[4].x+lm[8].x)/2,my=(lm[4].y+lm[8].y)/2,tx=clamp((mx-.12)/.76,0,1)*innerWidth,ty=clamp((my-.1)/.72,0,1)*innerHeight,k=h.pinch?.35:.5;h.x+=(tx-h.x)*k;h.y+=(ty-h.y)*k;
 const span=Math.max(.025,dd(lm[5],lm[17])),thY=lm[4].y-lm[2].y,thX=lm[4].x-lm[2].x,thOut=dd(lm[4],lm[5])>span*.55;
 let g=null;if(!h.pinch){if(n<=1&&thOut&&Math.abs(thY)>Math.abs(thX)*.65&&Math.abs(thY)>span*.38)g=thY>0?'down':'up';else if(ext[0]&&ext[1]&&!ext[2]&&!ext[3])g='V';else if(n===0)g='fist';}
 h.g=g;h.was=was;return h;}
const GEST={V:['COPY',120],up:['NEXT FRAME',120],down:['DELETE',380],fist:['UNDO',260]};
function regionAt(x,y){const e=document.elementFromPoint(x,y);if(!e)return null;if(e===stage)return 'stage';if(e===sheet)return 'sheet';return e.closest('button')||null;}
function local(el,x,y){const r=el.getBoundingClientRect();return [x-r.left,y-r.top];}
function handDown(x,y){const r=regionAt(x,y);H.region=r;if(r==='stage')stDown(...local(stage,x,y));else if(r==='sheet')shDown(...local(sheet,x,y));else if(r&&r.click)r.click();}
function handMove(x,y){if(H.region==='stage')stMove(...local(stage,x,y));else if(H.region==='sheet')shMove(...local(sheet,x,y));}
function handUp(){if(H.region==='stage')stUp();else if(H.region==='sheet')shUp();H.region=null;}
function gesture(name){const r=H.tool&&regionAt(H.tool.x,H.tool.y),L=layer(SEL);
 if(name==='fist')undo();
 else if(name==='up'){if(L&&L.kind==='draw'){snap();const k=keyAt(L,F);step(1);if(L.keys[F]==null)L.keys[F]=k!=null?JSON.parse(JSON.stringify(L.keys[k])):[];changed();say('Next frame, key '+(F+1)+'.');}else step(1);}
 else if(name==='V'){if(r==='stage'&&L&&L.kind==='draw'){snap();const k=keyAt(L,F);if(k!=null){L.keys[F+1<W.n?F+1:F]=JSON.parse(JSON.stringify(L.keys[k]));step(1);changed();say('Drawing copied to frame '+(F+1)+'.');}}else op('copy');}
 else if(name==='down'){if(r==='stage'&&L&&L.kind==='draw'){const p=stageToWorld(...local(stage,H.tool.x,H.tool.y));if(p){snap();eraseAt(L,p);changed();}}else op('del');}}
function handTick(now){const cam=$('cam');if(!H.on||!landmarker||cam.readyState<2||cam.currentTime===H.t)return;H.t=cam.currentTime;
 const all=(landmarker.detectForVideo(cam,now).landmarks||[]).slice(0,2).sort((a,b)=>(1-a[9].x)-(1-b[9].x));
 const toolLm=all.length?all[all.length-1]:null,otherLm=all.length===2?all[0]:null;
 if(toolLm){H.tool=readHand(H.tool,toolLm);const t=H.tool;
  if(t.pinch&&!t.was)handDown(t.x,t.y);else if(t.pinch)handMove(t.x,t.y);else if(t.was)handUp();
  const gs=H.g;if(t.g&&GEST[t.g]){gs.quiet=0;if(!gs.latched){if(gs.name!==t.g){gs.name=t.g;gs.since=now;}if(now-gs.since>=GEST[t.g][1]){gs.latched=true;gesture(t.g);}}}else{if(!gs.quiet)gs.quiet=now;if(now-gs.quiet>140){gs.latched=false;gs.name=null;}}}
 else if(H.tool){if(H.tool.pinch)handUp();H.tool=null;}
 if(otherLm){H.other=readHand(H.other,otherLm);const o=H.other;
  if(o.pinch){if(!H.grip)H.grip={x:o.x,y:o.y,yaw:yaw,steps:0};const n=Math.trunc((o.y-H.grip.y)/26);if(n!==H.grip.steps){step(n-H.grip.steps);H.grip.steps=n;}if(VIEW==='stack'){yaw=clamp(H.grip.yaw+(o.x-H.grip.x)/260,-1,1);dirty=true;}}else H.grip=null;}
 else{H.other=null;H.grip=null;}}
const hc=$('hand'),hg=hc.getContext('2d');
function drawCursor(){const w=innerWidth,h=innerHeight,r=devicePixelRatio||1;if(hc.width!==Math.round(w*r)){hc.width=Math.round(w*r);hc.height=Math.round(h*r);}hg.setTransform(r,0,0,r,0,0);hg.clearRect(0,0,w,h);if(!H.on)return;
 const t=H.tool;if(t){hg.lineWidth=2;hg.strokeStyle=hg.fillStyle=t.pinch?'#b38600':INK;hg.beginPath();hg.arc(t.x,t.y,t.pinch?7:14,0,7);t.pinch?hg.fill():hg.stroke();
  const gs=H.g;if(gs.name&&!gs.latched&&GEST[gs.name]){const p=Math.min(1,(performance.now()-gs.since)/GEST[gs.name][1]);hg.strokeStyle='#b38600';hg.lineWidth=3;hg.beginPath();hg.arc(t.x,t.y,20,-Math.PI/2,-Math.PI/2+p*Math.PI*2);hg.stroke();hg.font='600 11px IBM Plex Mono, monospace';hg.fillStyle=INK;hg.fillText(GEST[gs.name][0],t.x+24,t.y+4);}}
 const o=H.other;if(o){hg.strokeStyle=hg.fillStyle='#b38600';const s=o.pinch?8:13;o.pinch?hg.fillRect(o.x-s,o.y-s,2*s,2*s):hg.strokeRect(o.x-s,o.y-s,2*s,2*s);if(o.pinch){hg.font='600 11px IBM Plex Mono, monospace';hg.fillText('FRAME '+(F+1),o.x+16,o.y+4);}}}

/* ---------- loop ---------- */
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.25,(now-last)/1000);last=now;
 try{handTick(now);}catch(e){}
 if(playing){acc+=dt*W.fps;while(acc>=1){acc-=1;F=(F+1)%W.n;dirty=true;sheetDirty=true;}if(dirty)where();}
 if(dirty){dirty=false;drawStage();}else if(H.on)drawCursor();
 if(sheetDirty){sheetDirty=false;drawSheet();}}
new ResizeObserver(()=>{dirty=true;sheetDirty=true;}).observe($('stageBox'));
window.STACK={get W(){return W;},set W(v){W=v;changed();},get F(){return F;},set F(v){F=v;changed(false);},get SEL(){return SEL;},set SEL(v){SEL=v;changed(false);},addShot,addClip,addArt,addInk,op,openTray,sortLayers,worldPrompt,renderWebm,undo,stDown,stMove,stUp,shDown,shMove,shUp,setView:v=>{if(VIEW!==v)$('bView').click();},setTool:t=>{TOOL=t;PIN=false;},layer,order,SHD,gesture,setPin:t=>{PIN=true;}};
/* start: the last world, or the giraffe that walks past */
(async()=>{if(!W||!Array.isArray(W.layers)){W=blank();await addShot('giraffe-walks-past','all');UNDO.length=0;}else{for(const L of W.layers)if(L.shot)shot(L.shot).catch(()=>{});}SEL=SEL||(order()[0]||{}).id||null;changed(false);})();
requestAnimationFrame(loop);
</script>
