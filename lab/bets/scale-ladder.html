<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P3 Scale Ladder · bet studio</title>
<link rel="stylesheet" href="kernel.css?v=12">
<style>
  #ladder{ flex:1 1 auto; }
  .rung{ border-bottom:3px solid var(--k); display:grid; grid-template-columns:88px 1fr; min-height:0; }
  .rung .lbl{ border-right:3px solid var(--k); padding:6px 8px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; }
  .rung .lbl b{ font-size:12px; letter-spacing:.1em; }
  .rung .lbl .pc{ font-size:20px; font-weight:700; }
  .rung.on .lbl{ background:var(--k); color:var(--w); }
  .rung .track{ position:relative; margin:8px 10px; }
  .blk{ position:absolute; top:0; bottom:0; border:2px solid var(--k); background:var(--w); overflow:hidden; cursor:pointer; }
  .blk .cv{ position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--lg); }
  .blk .cv i{ display:block; height:100%; background:var(--k); }
  .blk .t{ position:absolute; left:3px; top:1px; font-size:10px; white-space:nowrap; }
  .blk img,.blk video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.9; }
  .seatb{ position:absolute; top:0; bottom:10px; overflow:hidden; border-right:2px solid var(--w); }
  .seatb img{ width:100%; height:100%; object-fit:cover; }
  .seatb.machine{ opacity:.55; }
  .lens{ position:absolute; top:-5px; bottom:-5px; border:3px solid var(--hi); pointer-events:none; }
  .brk{ position:absolute; top:-8px; bottom:-8px; background:rgba(0,51,204,.14); border-left:3px solid var(--hi); border-right:3px solid var(--hi); pointer-events:none; }
  .wd2{ position:absolute; top:0; font-size:14px; padding:2px 0; white-space:nowrap; cursor:pointer; }
  .wd2.now{ background:var(--k); color:var(--w); }
  #r0{ flex:0 0 70px; } #r1{ flex:1 1 34%; } #r2{ flex:1 1 34%; }
  #r2 .track{ margin-top:12px; }
  #r2 .pics{ position:absolute; left:0; right:0; top:48px; bottom:0; }
  #r1 .pics{ position:absolute; left:0; right:0; top:0; bottom:0; }
  #ladderBody{ display:flex; flex-direction:column; height:100%; }
  #side{ flex:0 0 min(380px,32%); }
</style></head>
<body>
<div id="stage">
  <section class="pane" id="ladder"><h2>Ladder <span class="tag" id="ladTag"></span></h2>
    <div class="body"><div id="ladderBody">
      <div class="rung" id="r0" data-lv="0"><div class="lbl"><b>SUITE</b><span class="pc" id="pc0"></span></div><div class="track" id="t0"></div></div>
      <div class="rung" id="r1" data-lv="1"><div class="lbl"><b>POEM</b><span class="pc" id="pc1"></span></div><div class="track" id="t1"></div></div>
      <div class="rung" id="r2" data-lv="2"><div class="lbl"><b>LINE</b><span class="pc" id="pc2"></span></div><div class="track" id="t2"></div></div>
    </div></div></section>
  <section class="pane" id="side"><h2>Deck <span class="tag" id="monTag"></span></h2><div class="body" id="monHost"></div></section>
</div>
<script src="kernel.js?v=13"></script>
<script>
/* P3 · SCALE LADDER — the poem is nested, so the film is nested.
   <level> suite ⊃ poem ⊃ line ⊃ word · <lens> the part of a level the next level magnifies · <bracket> the span
   you are deciding · <coverage> the share of a level that is seated. [in] [out] [bracket] [seat] [gap].
   Invariant: every coarse level is derived from the fine seats; a summary is never edited directly. */
const S = { lv: 1, li: 0, br: null, cand: 0, drag: null };
const $ = id => document.getElementById(id);
const line = () => K.film.lines[S.li];
const pct = x => Math.round(100 * x) + '%';
const cands = () => K.pool();

K.boot({
  code: 'P3', name: 'Scale Ladder', claim: 'see word, line, poem and suite at once: a choice at one scale shows at every scale',
  verbs: [
    { l: 'A', v: 'in', tip: 'Step down a level (suite → poem → line)', do: () => level(S.lv + 1) },
    { l: 'B', v: 'out', tip: 'Step up a level', do: () => level(S.lv - 1) },
    { l: 'C', v: 'bracket', tip: 'Bracket the unit under the playhead at this level (drag across words for any span)', do: bracketHere },
    { l: 'D', v: 'seat', tip: 'Seat the chosen clip on the bracket', do: seat },
    { l: 'E', v: 'gap', tip: 'Jump to the next unseated line in the suite', do: gap },
  ],
  help: { bet: 'You cannot make a 24-minute film one beat at a time. See word, line, poem and suite together, so every choice shows its effect at every scale.', inv: 'Coarse levels are derived from fine seats. A summary is never edited directly.',
    keys: [['↑ ↓', 'out or in'], ['← →', 'previous or next line'], ['drag words', 'bracket any span'], ['1–9', 'choose a candidate']] },
  keys: { ArrowUp: () => level(S.lv - 1), ArrowDown: () => level(S.lv + 1), ArrowLeft: () => pick(S.li - 1), ArrowRight: () => pick(S.li + 1), },
  space: () => S.br ? (K.playing() ? K.pause() : K.play(S.br[0] - .1, S.br[1] + .2)) : K.toggle(),
}).then(() => {
  K.deck($('monHost'));
  K.on('film', () => { S.li = 0; S.br = null; draw(); }); K.on('goto', l => pick(K.film.lines.indexOf(l))); K.on('ledger', draw);
  K.on('tick', t => { $('monTag').textContent = K.fmt(t); const w = K.wordAt(t); document.querySelectorAll('.wd2.now').forEach(e => e.classList.remove('now')); if (w) document.querySelector(`.wd2[data-i="${w.i}"]`)?.classList.add('now'); const l = K.lineAt(t); if (l && K.playing() && l.film === K.film.n && l !== line()) { S.li = K.film.lines.indexOf(l); drawLine(); drawPoem(); } });
  document.querySelectorAll('.rung .lbl').forEach(l => l.onclick = () => level(+l.parentElement.dataset.lv));
  draw();
});

function level(n) { S.lv = Math.max(0, Math.min(2, n)); document.querySelectorAll('.rung').forEach(r => r.classList.toggle('on', +r.dataset.lv === S.lv)); K.log(['suite', 'poem', 'line'][S.lv], ['the whole 24 minutes', `${K.film.title}`, `line ${line().n}`][S.lv]); }
function pick(i) { if (i >= K.film.lines.length && K.advance()) return; S.li = Math.max(0, Math.min(K.film.lines.length - 1, i)); S.br = [line().t0, line().t1]; K.seek(line().t0); draw(); }
function draw() { drawSuite(); drawPoem(); drawLine(); drawCands(); level(S.lv); $('ladTag').textContent = `${K.fmt(K.film.p0)}–${K.fmt(K.film.p1)} · ${K.film.lines.length} lines · ${K.film.beats.length} beats`; }

function drawSuite() {
  const t = $('t0'), D = K.duration; t.replaceChildren();
  K.data.films.forEach(f => {
    const cv = K.ledger.cover(f.p0, f.p1);
    t.append(K.h('div', { class: 'blk', title: `${f.n} ${f.title} · ${pct(cv)} seated`, style: `left:${100 * f.t0 / D}%;width:${100 * (f.t1 - f.t0) / D}%`, onclick: () => K.setFilm(f.n) },
      K.h('span', { class: 't' }, f.n), K.h('span', { class: 'cv' }, K.h('i', { style: `width:${pct(cv)}` }))));
  });
  t.append(K.h('div', { class: 'lens', style: `left:${100 * K.film.t0 / D}%;width:${100 * (K.film.t1 - K.film.t0) / D}%` }));
  let c = 0; K.data.films.forEach(f => c += K.ledger.cover(f.p0, f.p1) * (f.p1 - f.p0)); const tot = K.data.films.reduce((a, f) => a + f.p1 - f.p0, 0);
  $('pc0').textContent = pct(c / tot);
}
function drawPoem() {
  const t = $('t1'), a = K.film.p0 - 1, b = K.film.p1 + 1, X = x => 100 * (x - a) / (b - a); t.replaceChildren();
  const pics = K.h('div', { class: 'pics' });
  K.ledger.in(a, b).forEach(s => pics.append(K.h('div', { class: 'seatb' + (s.by === 'machine' ? ' machine' : ''), ...K.sa(s), style: `box-shadow:inset 0 -5px 0 ${K.signOf(s.clip).col};left:${X(Math.max(a, s.t0))}%;width:${X(Math.min(b, s.t1)) - X(Math.max(a, s.t0))}%`, title: s.clip.title }, K.h('img', { src: s.clip.thumb, alt: '' }))));
  t.append(pics);
  K.film.lines.forEach((l, i) => {
    const cv = K.ledger.cover(l.t0, l.t1);
    t.append(K.h('div', { class: 'blk', style: `left:${X(l.t0)}%;width:${X(l.t1) - X(l.t0)}%;background:transparent;top:auto;height:26px`, title: `L${l.n} · ${pct(cv)} · ${l.text}`, onclick: () => pick(i) },
      K.h('span', { class: 't', style: 'background:var(--w)' }, l.n), K.h('span', { class: 'cv' }, K.h('i', { style: `width:${pct(cv)}` }))));
  });
  t.append(K.h('div', { class: 'lens', style: `left:${X(line().t0)}%;width:${X(line().t1) - X(line().t0)}%` }));
  $('pc1').textContent = pct(K.ledger.cover(K.film.p0, K.film.p1));
}
function drawLine() {
  const t = $('t2'), l = line(), a = l.t0 - .3, b = l.t1 + .3, X = x => 100 * (x - a) / (b - a); t.replaceChildren();
  K.layWords(t, l.words, X, { cls: 'wd2', rowH: 20, rows: 2, attrs: w => ({ onpointerdown: e => { S.drag = [w.t0, w.t1]; S.br = [w.t0, w.t1]; drawBracket(X); e.preventDefault(); },
    onpointerenter: () => { if (S.drag) { S.br = [Math.min(S.drag[0], w.t0), Math.max(S.drag[1], w.t1)]; drawBracket(X); } },
    onpointerup: () => { if (S.drag) { S.drag = null; drawBracket(X); drawCands(); K.log('bracket', `“${K.textOf(...S.br)}”`); } } }) });
  const pics = K.h('div', { class: 'pics' });
  K.ledger.in(a, b).forEach(s => pics.append(K.h('div', { class: 'seatb' + (s.by === 'machine' ? ' machine' : ''), ...K.sa(s), style: `box-shadow:inset 0 -5px 0 ${K.signOf(s.clip).col};left:${X(Math.max(a, s.t0))}%;width:${X(Math.min(b, s.t1)) - X(Math.max(a, s.t0))}%;bottom:0`, title: `${s.clip.title} · ${s.text}` }, K.media(s.clip, true))));
  t.append(pics); drawBracket(X);
  $('pc2').textContent = pct(K.ledger.cover(l.t0, l.t1));
}
addEventListener('pointerup', () => { S.drag = null; });
function drawBracket(X) { $('t2').querySelector('.brk')?.remove(); if (!S.br) return; const l = line(); X = X || (x => 100 * (x - (l.t0 - .3)) / (l.t1 - l.t0 + .6)); $('t2').append(K.h('div', { class: 'brk', style: `left:${X(S.br[0])}%;width:${X(S.br[1]) - X(S.br[0])}%` })); }
function drawCands() { if (S.br) K.focus(S.br[0], S.br[1]); else K.focus(line().t0, line().t1); }
function choose(i) { K.pick(i); }
function bracketHere() {
  const t = K.now();
  if (S.lv === 0) { const f = K.filmAt(t); K.setFilm(f.n); S.br = [f.p0, f.p1]; }
  else if (S.lv === 1) { const b = K.beatAt(t) || K.film.beats[0]; S.br = [Math.max(b.t0, K.film.p0), b.t1]; }
  else { const l = K.lineAt(t) || line(); S.br = [l.t0, l.t1]; }
  drawLine(); drawCands(); K.log('bracket', `${['poem', 'beat', 'line'][S.lv]} · ${K.fmt(S.br[0])}–${K.fmt(S.br[1])}`);
}
function seat() {
  const c = K.picked(); if (!S.br || !c) return K.log('seat', 'bracket a span first (C, or drag across words)');
  K.ledger.seat({ t0: S.br[0], t1: S.br[1], clip: c, why: `bracketed at the ${['suite', 'poem', 'line'][S.lv]} level` });
  K.log('seat', `${c.title} → ${K.fmt(S.br[0])}–${K.fmt(S.br[1])} · suite now ${$('pc0').textContent}`);
}
function gap() {
  const t = K.now(), l = K.data.lines.find(x => x.t0 > t && K.ledger.cover(x.t0, x.t1) < .5) || K.data.lines.find(x => K.ledger.cover(x.t0, x.t1) < .5);
  if (!l) return K.log('gap', 'every line is seated');
  if (l.film !== K.film.n) K.setFilm(l.film);
  pick(K.film.lines.indexOf(l)); level(2); K.log('gap', `${l.film} L${l.n} · ${pct(K.ledger.cover(l.t0, l.t1))} seated`);
}
</script>
</body></html>
