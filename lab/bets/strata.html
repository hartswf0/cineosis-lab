<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P9 Strata · bet studio</title>
<link rel="stylesheet" href="kernel.css?v=12">
<style>
  #lanesPane{ flex:1 1 auto; }
  #lanes{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .lane{ display:grid; grid-template-columns:84px 1fr; border-bottom:3px solid var(--k); min-height:0; }
  .lane .nm{ border-right:3px solid var(--k); padding:6px 8px; font-size:11px; font-weight:700; letter-spacing:.1em; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; }
  .lane .nm small{ font-weight:400; font-size:9px; color:var(--g); letter-spacing:.04em; }
  .lane.solo .nm{ background:var(--k); color:var(--w); }
  .lane .tr{ position:relative; overflow:hidden; cursor:crosshair; }
  #lanes.soloing .lane:not(.solo){ flex:0 0 32px !important; opacity:.5; }
  #L-text{ flex:0 0 58px; } #L-voice{ flex:0 0 70px; } #L-pic{ flex:1 1 auto; } #L-sign{ flex:0 0 46px; } #L-world{ flex:0 0 46px; }
  .tw{ position:absolute; top:8px; font-size:12px; white-space:nowrap; padding:1px 2px; }
  .tw.now{ background:var(--k); color:var(--w); }
  .vb{ position:absolute; bottom:0; background:var(--k); }
  .ps{ position:absolute; top:4px; bottom:4px; overflow:hidden; border:2px solid var(--k); background:var(--k); }
  .ps img,.ps video{ width:100%; height:100%; object-fit:cover; }
  .ps.machine::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 5px,transparent 5px 10px); }
  .ps .by{ position:absolute; left:0; top:0; font-size:9px; background:var(--w); padding:0 3px; }
  .edge{ position:absolute; top:0; bottom:0; width:0; border-left:3px solid var(--aC); z-index:2; }
  .sg{ position:absolute; top:6px; bottom:6px; border:2px solid var(--k); font-size:11px; padding:2px 4px; overflow:hidden; white-space:nowrap; background:var(--w); }
  .sg b{ background:var(--k); color:var(--w); padding:0 3px; margin-right:3px; }
  .wl{ position:absolute; top:6px; bottom:6px; font-size:11px; padding:2px 4px; overflow:hidden; white-space:nowrap; border-left:3px solid var(--k); }
  #pin{ position:absolute; top:0; bottom:0; width:0; border-left:3px solid var(--hi); z-index:5; pointer-events:none; }
  #pin::before{ content:''; position:absolute; left:-8px; top:-2px; width:13px; height:13px; background:var(--hi); border-radius:50%; }
  #side{ flex:0 0 min(340px,29%); }
  #core{ flex:0 0 auto; max-height:34%; overflow:auto; border-top:3px solid var(--k); }
  #core{ padding:6px 10px; font-size:11px; }
  #core .r{ display:grid; grid-template-columns:52px 1fr; gap:8px; border-bottom:2px solid var(--lg); padding:4px 0; }
  #core .r b{ font-size:10px; letter-spacing:.1em; }
</style></head>
<body>
<div id="stage">
  <section class="pane" id="lanesPane"><h2>Strata <span class="tag" id="winTag"></span></h2><div class="body"><div id="lanes">
    <div class="lane" id="L-text"><div class="nm">TEXT<small>her words</small></div><div class="tr"></div></div>
    <div class="lane" id="L-voice"><div class="nm">VOICE<small>stress · breath</small></div><div class="tr"></div></div>
    <div class="lane" id="L-pic"><div class="nm">PICTURE<small>the ledger</small></div><div class="tr"></div></div>
    <div class="lane" id="L-sign"><div class="nm">SIGNS<small>Deamer</small></div><div class="tr"></div></div>
    <div class="lane" id="L-world"><div class="nm">WORLD<small>beat · scene</small></div><div class="tr"></div></div>
  </div><div id="pin"></div></div></section>
  <section class="pane" id="side"><h2>At the pin <span class="tag" id="monTag"></span></h2>
    <div class="body" id="monHost2"></div><div id="core"></div></section>
</div>
<script src="kernel.js?v=12"></script>
<script>
/* P9 · STRATA — text, voice, picture, signs and world are layers on one clock.
   <lane> one kind of material · <pin> a vertical line through every lane at one instant · <edge> a picture
   boundary the pin is nearest. [play] [solo] [nudge ←] [nudge →] [seat].
   Invariant: every lane shares one clock; moving an edge moves two seats together, never opening a gap. */
const LANES = ['text', 'voice', 'pic', 'sign', 'world'];
const S = { win: innerWidth < 700 ? 8 : 20, solo: null, cand: 0 };
const $ = id => document.getElementById(id);
let W0 = 0;
const X = t => 100 * (t - W0) / S.win;

K.boot({
  code: 'P9', name: 'Strata', claim: 'every layer on one clock: a cut is a vertical line through words, voice, picture, signs and world',
  verbs: [
    { l: 'A', v: 'play', tip: 'Play from the pin', do: () => K.toggle() },
    { l: 'B', v: 'solo', tip: 'Give one lane the room', do: () => { const i = LANES.indexOf(S.solo); S.solo = i === LANES.length - 1 ? null : LANES[i + 1]; solo(); } },
    { l: 'C', v: 'nudge ←', tip: 'Move the picture edge nearest the pin to the previous word edge', do: () => nudge(-1) },
    { l: 'D', v: 'nudge →', tip: 'Move the picture edge nearest the pin to the next word edge', do: () => nudge(1) },
    { l: 'E', v: 'seat', tip: 'Seat the chosen clip from the pin to the end of the phrase', do: seat },
  ],
  help: { bet: 'The film is not only picture. Text, voice, picture, signs and world are layers on one clock, and a cut is a vertical line through all of them.', inv: 'Every lane shares one clock. Moving an edge moves both seats together, never opening a gap or an overlap.',
    keys: [['click any lane', 'move the pin'], ['← →', 'step the pin one word'], ['+ −', 'zoom the window'], ['1–9', 'choose a candidate']] },
  keys: { ArrowLeft: () => stepWord(-1), ArrowRight: () => stepWord(1), '+': () => zoom(.5), '=': () => zoom(.5), '-': () => zoom(2), },
}).then(() => {
  K.tools([8, 20, 60].map(s => ({ t: s + 's', id: 'z' + s, on: s === S.win, tip: `Show ${s} seconds`, do: () => { S.win = s; [8, 20, 60].forEach(x => $('z' + x).classList.toggle('on', x === s)); frame(K.now(), true); } })));
  K.deck($('monHost2'));
  document.querySelectorAll('.lane .tr').forEach(tr => tr.addEventListener('click', e => { const r = tr.getBoundingClientRect(); K.seek(W0 + S.win * (e.clientX - r.left) / r.width); }));
  document.querySelectorAll('.lane .nm').forEach((n, i) => n.onclick = () => { S.solo = S.solo === LANES[i] ? null : LANES[i]; solo(); });
  K.on('film', f => { K.seek(f.p0); frame(f.p0, true); }); K.on('ledger', () => frame(K.now(), true));
  K.on('tick', t => frame(t));
  K.seek(K.film.p0); frame(K.film.p0, true);
});

function frame(t, force) {
  if (force || t < W0 || t > W0 + S.win * .8) { W0 = Math.max(0, t - S.win * .25); draw(); }   // the window pages when the pin nears its edge
  const tr = document.querySelector('#L-pic .tr').getBoundingClientRect(), host = $('lanes').getBoundingClientRect();
  $('pin').style.left = (tr.left - host.left + tr.width * (t - W0) / S.win) + 'px';
  $('monTag').textContent = K.fmt(t);
  const w = K.wordAt(t); document.querySelectorAll('.tw.now').forEach(e => e.classList.remove('now')); if (w) document.querySelector(`.tw[data-i="${w.i}"]`)?.classList.add('now');
  if (force || core.last !== (w?.i ?? -1) + ':' + (K.ledger.at(t)?.id || '')) core(t);
}
function draw() {
  const a = W0, z = W0 + S.win, tr = n => document.querySelector(`#L-${n} .tr`);
  const T = tr('text'), V = tr('voice'), P = tr('pic'), G = tr('sign'), Wd = tr('world');
  [T, V, P, G, Wd].forEach(e => e.replaceChildren());
  K.wordsIn(a, z).forEach(w => {
    
    V.append(K.h('div', { class: 'vb', style: `left:${X(w.t0)}%;width:calc(${X(w.t1) - X(w.t0)}% - 1px);height:${15 + 80 * Math.max(0, Math.min(1, ((w.st ?? 0) + .8) / 2.2))}%` }));
  });
  K.layWords(T, K.wordsIn(a, z), X, { cls: 'tw', rowH: 16, rows: 3, top: 3 });
  K.ledger.in(a, z).forEach(s => P.append(K.h('div', { class: 'ps' + (s.by === 'machine' ? ' machine' : ''), ...K.sa(s), style: `box-shadow:inset 0 -6px 0 ${K.signOf(s.clip).col};left:${X(Math.max(a, s.t0))}%;width:${X(Math.min(z, s.t1)) - X(Math.max(a, s.t0))}%`, title: `${s.clip.title} · ${s.by} · ${s.bet} · ${s.why}` },
    K.media(s.clip, S.win <= 20), K.h('span', { class: 'by' }, s.bet))));
  edges().filter(e => e > a && e < z).forEach(e => P.append(K.h('span', { class: 'edge', style: `left:${X(e)}%` })));
  K.data.beats.filter(b => b.t1 > a && b.t0 < z).forEach(b => {
    G.append(K.h('div', { class: 'sg', style: `left:${X(Math.max(a, b.t0))}%;width:${X(Math.min(z, b.t1)) - X(Math.max(a, b.t0))}%`, html: b.codes.map(c => `<b>${K.esc(K.data.signs[c]?.symbol || c)}</b>`).join('') + b.codes.map(c => K.esc(K.data.signs[c]?.name || '')).join(' · ') }));
    Wd.append(K.h('div', { class: 'wl', style: `left:${X(Math.max(a, b.t0))}%;width:${X(Math.min(z, b.t1)) - X(Math.max(a, b.t0))}%` }, `${b.id} · ${b.title}`));
  });
  $('winTag').textContent = `${K.fmt(a)}–${K.fmt(z)} · ${S.win}s window`;
}
function core(t) {
  const w = K.wordAt(t), s = K.ledger.at(t), b = K.beatAt(t), f = K.filmAt(t);
  core.last = (w?.i ?? -1) + ':' + (s?.id || '');
  const rows = [['TEXT', w ? `“${w.w}” · ${w.line.text}` : '(between words)'], ['VOICE', w ? `stress ${w.st ?? '–'} · ${(w.t1 - w.t0).toFixed(2)} s` : 'breath'],
    ['PICTURE', s ? `${s.clip.title}${s.clip.year ? ' · ' + s.clip.year : ''} · ${s.by} · ${s.bet} · ${s.why}` : 'unseated'],
    ['SIGNS', b ? b.codes.map(c => `${K.data.signs[c]?.symbol} ${K.data.signs[c]?.name}`).join(' · ') : '—'], ['WORLD', `${f.n} ${f.title}${b ? ' · beat ' + b.id + ' · ' + b.title : ''}`]];
  $('core').replaceChildren(...rows.map(([k, v]) => K.h('div', { class: 'r' }, K.h('b', {}, k), K.h('span', {}, v))));
  K.focus(null);
}
function choose(i) { K.pick(i); }
function solo() { $('lanes').classList.toggle('soloing', !!S.solo); LANES.forEach(n => $('L-' + n).classList.toggle('solo', n === S.solo)); setTimeout(() => frame(K.now(), true), 30); K.log('solo', S.solo || 'all lanes'); }
function zoom(f) { S.win = Math.max(5, Math.min(120, S.win * f)); frame(K.now(), true); }
function stepWord(d) { const t = K.now(), ws = K.data.words; const i = ws.findIndex(w => w.t0 > t + .01); const w = d > 0 ? ws[i] : ws[Math.max(0, (i < 0 ? ws.length : i) - 2)]; if (w) K.seek(w.t0 + .001); }
function edges() { const out = []; const ss = K.ledger.all(); ss.forEach((s, i) => { out.push(s.t0); if (!ss[i + 1] || ss[i + 1].t0 - s.t1 > .01) out.push(s.t1); }); return out; }
function nudge(d) {
  const t = K.now(), es = edges(); if (!es.length) return K.log('nudge', 'no picture edge yet');
  const e = es.reduce((a, x) => Math.abs(x - t) < Math.abs(a - t) ? x : a);
  const bounds = K.wordsIn(e - 4, e + 4).flatMap(w => [w.t0, w.t1]).sort((a, b) => a - b);
  const to = d < 0 ? bounds.filter(x => x < e - .02).at(-1) : bounds.find(x => x > e + .02); if (to == null) return;
  const left = K.ledger.all().find(s => Math.abs(s.t1 - e) < .02), right = K.ledger.all().find(s => Math.abs(s.t0 - e) < .02);
  if (left && to <= left.t0 + .05) return K.log('nudge', 'the seat on the left would vanish');
  if (right && to >= right.t1 - .05) return K.log('nudge', 'the seat on the right would vanish');
  if (left) left.t1 = to; if (right) right.t0 = to;
  [left, right].forEach(s => { if (s) s.text = K.textOf(s.t0, s.t1); });
  K.ledger.save('nudge'); K.seek(to); K.log('nudge', `edge ${K.fmt(e)} → ${K.fmt(to)}`);
}
function seat() {
  const t = K.now(), w = K.wordAt(t) || K.data.words.find(x => x.t0 > t), b = w && K.beatAt(w.t0), c = K.picked(); if (!c) return;
  K.ledger.seat({ t0: w.t0, t1: K.phraseEnd(w), clip: c, why: 'seated at the pin' });
  K.log('seat', `${c.title} · “${K.textOf(w.t0, K.phraseEnd(w))}”`);
}
</script>
</body></html>
