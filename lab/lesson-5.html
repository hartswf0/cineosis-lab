<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Table of Signs · Lesson 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=2"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · LESSON 5 · THE TABLE OF SIGNS. Unit B: what a sign is, read from the lab's own records. The 45 signs where the lab
     places them; each sign's question and defining difference; the three signs each is recorded as being mistaken for; the Cineosis
     take's 169 moments, each with the signs the suite's reading assigned (a wink) and the machine's own top guess (a blink).
     Drawn with the Bolas sets: 06 line, circle, dot (the table, the timeline), 07 wink, not blink (reading against guessing),
     13 the web of cineosis (the radar), 11 bolas pixel (the title card). Data: explain/l5.py -> explain/lesson/l5.json. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.chips { position: absolute; left: 1010px; right: 60px; top: 80px; display: flex; flex-direction: column; gap: 26px; }
.chip2 { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 18px; align-items: center; opacity: 0; animation: up .7s ease forwards; }
.chip2 b { display: block; font: 600 15px var(--mono); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.chip2 p { margin: 4px 0 0; font: italic 27px/1.25 var(--serif); color: var(--ink); }
.tab { position: absolute; left: 40px; top: 80px; width: 1520px; height: 560px; }
.tab .s { position: absolute; transform: translate(-50%, -50%); opacity: 0; transition: opacity .6s; text-align: center; }
.tab .s.on { opacity: 1; } .tab .s.dim { opacity: .22; }
.tab .s small { display: block; font: 12px var(--mono); color: var(--dim); margin-top: 4px; white-space: nowrap; }
.tab .fam { position: absolute; font: 600 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .6s; }
.tab svg.th { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.tab svg.th path { fill: none; stroke: #e0483a; stroke-width: 1.4; opacity: 0; transition: opacity .8s; }
.tab svg.th path.on { opacity: .2; } .tab svg.th path.hot { opacity: 1; stroke-width: 3.4; }
.read1 { position: absolute; left: 120px; right: 120px; top: 70px; display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 50px; align-items: center; }
.read1 h2 { margin: 0; font: 600 64px/1.05 var(--serif); color: var(--ink); }
.read1 .q { font: italic 34px/1.3 var(--serif); color: var(--gold); margin: 18px 0; opacity: 0; animation: up .8s ease 2s forwards; }
.read1 .d { font: 25px/1.4 var(--serif); color: #cfc8ba; opacity: 0; animation: up .8s ease 6s forwards; }
.four { position: absolute; left: 60px; right: 60px; top: 50px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 22px; }
.four > div { opacity: 0; animation: up .7s ease forwards; }
.four h3 { margin: 12px 0 6px; font: 600 26px/1.1 var(--serif); color: var(--ink); } .four p { margin: 0; font: 19px/1.35 var(--serif); color: #cfc8ba; }
.four .rel { font: 600 12px var(--mono); letter-spacing: .14em; color: #ff8a7a; }
.tl { position: absolute; left: 80px; right: 80px; top: 120px; height: 440px; }
.tl .ln { position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--red); }
.tl i { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity .3s; }
.tl .ch { position: absolute; top: calc(50% + 30px); font: 13px var(--mono); color: var(--dim); transform: translateX(-50%); }
.rad { position: absolute; left: 380px; top: 30px; }
.vs { position: absolute; left: 80px; right: 80px; top: 70px; height: 560px; }
.vs .row { position: absolute; left: 260px; right: 0; height: 60px; }
.vs .row b { position: absolute; left: -260px; top: 6px; width: 240px; font: 600 14px/1.3 var(--mono); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.vs .row span { position: absolute; top: 0; transform: translateX(-50%); opacity: 0; transition: opacity .25s; }
.vs .row span.on { opacity: 1; }
.big { position: absolute; left: 80px; top: 600px; font: 600 15px var(--mono); color: var(--gold); letter-spacing: .1em; }
.prac { position: absolute; left: 1010px; right: 60px; top: 90px; display: flex; flex-direction: column; gap: 18px; }
.prac .opt { display: flex; gap: 16px; align-items: center; font: 26px var(--serif); color: var(--ink); transition: opacity .6s; }
.prac .opt.no { opacity: .2; } .prac .ask { font: italic 26px/1.3 var(--serif); color: var(--gold); }
canvas.pix { width: 192px; height: 192px; image-rendering: pixelated; image-rendering: crisp-edges; }
.pixrow { display: flex; gap: 30px; justify-content: center; margin-top: 30px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 5</p><h1 style="font-weight:600;color:#ece6da">The Table of Signs</h1><p>What a sign is, and how it is told from its neighbours. About five minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/marks.js?v=1"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l5.json?v=1'],
  cues: ['dae-slide-carousel-at-blue-hour', 'dae-compass-spin-in-heavy-fog', 'dae-cedar-and-cassette', 'dae-snowbound-umea-cabin', 'dae-cold-current-paddle', 'dae-preparation-drift', 'dae-feather-rustle-dub'],
  build(D, B, K) {
    const L = D[0], esc = LX.esc, T = L.table, by = Object.fromEntries(T.map(s => [s.n, s])), OP = L.open, fmt = K.fmt;
    const vid = (src, t = 0, d = 0) => `<video muted loop playsinline data-src="${esc(src)}" data-t="${t}"${d ? ` data-end="${(t + d).toFixed(2)}"` : ''}></video>`;
    const clipOf = p => vid(p.clip, p.in || 0, p.t1 - p.t0);
    const go = (el, f) => { K.startVideos(el); LX.runBand(el, K); if (f) f(); };
    const FAM = ['perception', 'affect', 'action', 'reflection', 'mental', 'time', 'break', 'read'];
    const X = s => 47 + s.col * 95, Y = s => 70 + s.row * 190;
    const tableHTML = (hot) => { const H = hot ? by[hot] : null, near = H ? new Set([H.n, ...H.conf]) : null;
      const th = T.flatMap(s => s.conf.filter(c => by[c]).map(c => { const a = s, b = by[c], mx = (X(a) + X(b)) / 2, my = Math.min(Y(a), Y(b)) - 50 - Math.abs(X(a) - X(b)) * .12;
        return `<path class="${H && (s.n === H.n) ? 'hot' : ''}" data-k="${s.n}" d="M ${X(a)} ${Y(a) - 34} Q ${mx} ${my} ${X(b)} ${Y(b) - 34}"/>`; })).join('');
      return `<div class="tab"><svg class="th" viewBox="0 0 1520 560">${th}</svg>${T.map(s => `<div class="s ${near && !near.has(s.n) ? 'dim' : ''}" data-dom="${s.dom}" style="left:${X(s)}px;top:${Y(s)}px">${MK.o(s.sym, s.dom, 30)}<small>${esc(s.n)}</small></div>`).join('')}</div>`; };
    const showTable = (el, step = 70) => FAM.forEach((d, k) => K.later(400 + k * 900, () => el.querySelectorAll(`.s[data-dom="${d}"]`).forEach(x => x.classList.add('on'))));

    /* COLD OPEN · one picture, two signs */
    B('Cold open', 12, () => `<div class="pic left">${clipOf(OP)}</div>` + LX.band([[.4, 'You would think a sign is a label you stick on a shot: this one is sad, that one is a chase.'], [6.5, 'This shot was chosen for two signs at once.']]), el => go(el));
    B('Cold open', 15, () => `<div class="pic left">${clipOf(OP)}</div><div class="chips">${OP.signs.map((s, i) => { const S = by[String(s.n)]; return `<div class="chip2" style="animation-delay:${.4 + i * 3}s">${MK.o(S.sym, S.dom, 34)}<div><b>${esc(S.name)}</b><p>${esc(S.q)}</p></div></div>`; }).join('')}</div>`
      + LX.band([[.3, 'A sign is not a label. It is a question you ask of the picture.'], [7.5, 'Two questions, one shot. Both can be true.']]), el => go(el));
    B('Cold open', 8, () => `<div class="tc"><small>CINEOSIS · LESSON 5</small><h1>The Table of Signs</h1><div class="pixrow">${['So', OP.signs[0].sym, OP.signs[1].sym].map(() => '<canvas class="pix"></canvas>').join('')}</div></div>`,
      el => { const sy = [['So', 'perception'], [OP.signs[0].sym, by[String(OP.signs[0].n)].dom], [OP.signs[1].sym, by[String(OP.signs[1].n)].dom]]; el.querySelectorAll('canvas.pix').forEach((c, i) => MK.pixSign(c, sy[i][0], sy[i][1])); LX.ping(); });

    /* THE TABLE */
    B('The table', 16, () => tableHTML() + LX.band([[.3, `The lab keeps ${T.length} signs, as David Deamer drew them out of Deleuze's cinema books, on one table.`], [7.5, 'Each family has its colour, and the colour stays inside the O.']]), el => { LX.runBand(el, K); showTable(el); });
    B('The table', 14, () => tableHTML() + LX.band([[.3, 'Read left to right: perception, affection, action, reflection, the mental image.'], [7, 'Then the breaks, time itself, and the readable image.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.s').forEach(x => x.classList.add('on')); FAM.forEach((d, k) => K.later(500 + k * 1300, () => { el.querySelectorAll('.s').forEach(x => x.classList.toggle('dim', x.dataset.dom !== d)); })); K.later(11500, () => el.querySelectorAll('.s').forEach(x => x.classList.remove('dim'))); });
    const S1 = by['1'];
    B('The table', 17, () => `<div class="read1"><div>${MK.o(S1.sym, S1.dom, 110, { thread: true })}</div><div><small style="font:600 15px var(--mono);letter-spacing:.14em;color:var(--dim)">SIGN 1 · ${esc(S1.dom.toUpperCase())}</small><h2>${esc(S1.name)}</h2><div class="q">${esc(S1.q)}</div><div class="d">${esc(S1.diff)}</div></div></div>`
      + LX.band([[.3, 'One sign, read. A symbol, a name, and the question it asks.'], [6, 'Then the difference that tells it from every other sign.']]), el => LX.runBand(el, K));

    /* THE CONFUSIONS */
    B('The confusions', 15, () => tableHTML() + LX.band([[.3, 'For every sign the lab also recorded the three it is most often mistaken for.'], [7, 'Each one is a thread. Together they make a web across the table.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.s').forEach(x => x.classList.add('on')); el.querySelectorAll('path').forEach((p, k) => K.later(1500 + k * 25, () => p.classList.add('on'))); });
    B('The confusions', 12, () => tableHTML('1') + LX.band([[.3, `<b>${esc(S1.name)}</b> is mistaken for ${S1.conf.map(c => esc(by[c].name)).join(', ')}.`], [6.5, 'The threads cross the whole table. Confusion does not respect families.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.s').forEach(x => x.classList.add('on')); el.querySelectorAll('path').forEach(p => p.classList.add('on')); });
    B('The confusions', 22, () => `<div class="four">${[S1, ...S1.conf.map(c => by[c])].map((s, i) => `<div style="animation-delay:${.4 + i * 3.5}s">${MK.o(s.sym, s.dom, 36)}${i ? '<div class="rel" style="margin-top:8px">MISTAKEN FOR IT</div>' : ''}<h3>${esc(s.name)}</h3><p>${esc(s.diff.length > 220 ? s.diff.slice(0, 218) + '…' : s.diff)}</p></div>`).join('')}</div>`
      + LX.band([[.3, 'Read them side by side. The difference is what to look for.'], [14, 'One body owning the frame; the centre passing on; a face as the whole image; a sight that leads nowhere.']]), el => LX.runBand(el, K));

    /* IN A FILM · the Cineosis take */
    const TK = L.take, n = TK.length, t1 = TK[n - 1].t1, fx = t => (t / t1 * 100).toFixed(2) + '%';
    const dom0 = t => (by[String(t.signs[0].n)] || {}).dom;
    B('In a film', 16, () => `<div class="tl"><div class="ln"></div>${TK.map(t => `<i style="left:${fx(t.t0)};background:${MK.DOMC[dom0(t)]}"></i>`).join('')}${['01', '05', '09', '13'].map(c => { const f = TK.find(t => t.ch === c); return f ? `<span class="ch" style="left:${fx(f.t0)}">ch ${c}</span>` : ''; }).join('')}</div>`
      + LX.band([[.3, `The Cineosis take is one of four films made from the same poem. Its ${n} moments sit on the poem's clock.`], [7.5, 'Each shot was chosen for the signs the suite assigns that moment. The dot is the first one, in its family colour.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.tl i').forEach((i, k) => K.later(300 + k * 30, () => i.style.opacity = 1)); });
    const fam = L.families, fv = FAM.map(d => fam[d] || 0);
    B('In a film', 15, () => `<div class="rad">${MK.radar(FAM.map((d, i) => `${MK.DOMN[d]} ${fv[i]}`), fv, { w: 840, h: 600, colors: FAM.map(d => MK.DOMC[d]) })}</div>`
      + LX.band([[.3, 'Count every sign the take was chosen for, by family, and the shape of the film appears.'], [7, `Time leads, with ${fam.time}. The readable image hardly appears: ${fam.read}.`]]), el => LX.runBand(el, K));

    /* READING AND GUESSING · wink against blink */
    B('Reading and guessing', 15, () => `<div class="chips" style="left:220px;right:220px;top:110px;gap:40px"><div class="chip2" style="animation-delay:.4s">${MK.eye('wink', 46, { thread: true })}<div><b>A wink</b><p>A reading. The sign the suite's treatment assigned to this moment: someone decided it.</p></div></div><div class="chip2" style="animation-delay:3.5s">${MK.eye('blink', 46, { thread: true })}<div><b>A blink</b><p>A guess. The sign the machine scores highest for this shot, from its pictures alone.</p></div></div></div>`
      + LX.band([[.3, 'Two kinds of mark from here on.'], [7, 'Readings wink. Machine passes blink.']]), el => LX.runBand(el, K));
    const G = OP.guess;
    B('Reading and guessing', 15, () => `<div class="pic left">${clipOf(OP)}</div><div class="chips">${OP.signs.map((s, i) => { const S = by[String(s.n)]; return `<div class="chip2" style="animation-delay:${.4 + i * .8}s">${MK.eye('wink', 26)}${MK.o(S.sym, S.dom, 26)}<div><b>read as</b><p>${esc(S.name)}</p></div></div>`; }).join('')}<div class="chip2" style="animation-delay:4.5s">${MK.eye('blink', 26)}${MK.o(G.sym, G.dom, 26)}<div><b>the machine's guess</b><p>${esc(G.name)}, ${G.v}</p></div></div></div>`
      + LX.band([[.3, 'Our shot again. Read as two signs.'], [4.5, `The machine's own best guess: <b>${esc(G.name)}</b>. It agrees on one of the two.`]]), el => go(el));
    const yes = TK.map(t => t.guess && t.signs.some(s => String(s.n) === String(t.guess.n)));
    B('Reading and guessing', 18, () => `<div class="vs"><div class="row" style="top:60px"><b>read<br>(wink)</b>${TK.map(t => `<span style="left:${fx(t.t0)}">${MK.eye('wink', 7)}</span>`).join('')}</div><div class="row" style="top:220px"><b>machine agrees<br>(blink)</b>${TK.map((t, i) => yes[i] ? `<span style="left:${fx(t.t0)}">${MK.eye('blink', 7)}</span>` : '').join('')}</div><div class="row" style="top:380px"><b>machine guesses<br>something else</b>${TK.map((t, i) => !yes[i] ? `<span style="left:${fx(t.t0)}">${MK.eye('open', 7, { ink: '#6e675c' })}</span>` : '').join('')}</div></div><div class="big">${L.agree} OF ${L.n} AGREE</div>`
      + LX.band([[.3, `Every moment of the take. The machine's top guess is one of the read signs in <b>${L.agree}</b> of ${L.n}: about half.`], [9, 'And the take chose its shots partly by that very guess. Even so, half the time the machine sees another sign first.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.vs span').forEach((s, k) => K.later(200 + (k % 169) * 25, () => s.classList.add('on'))); });
    B('Reading and guessing', 11, () => `<div class="tc"><small>WHERE THE READ SIGN SITS IN THE MACHINE'S LIST OF ${T.length}</small><h1 style="font-size:150px">${L.rank_median}</h1><p>The middle rank. Only ${L.rank_top3} of ${L.rank_n} read signs are in its top three.</p></div>`,
      el => LX.ping());

    /* PRACTICE */
    B('Practice', 7, () => `<div class="tc"><small>YOUR TURN</small><h1 style="font-size:90px">Ask the question</h1><p>Three shots. For each, which sign was it read as?</p></div>`, el => LX.ping());
    L.practice.forEach(p => { const S = by[String(p.signs[0].n)], opts = [S, ...S.conf.slice(0, 2).map(c => by[c])].sort((a, b) => a.n.localeCompare(b.n));
      B('Practice', 15, () => `<div class="pic left">${clipOf(p)}</div><div class="prac"><div class="ask">Which question does this shot answer yes to?</div>${opts.map(o => `<div class="opt" data-ok="${o === S ? 1 : 0}">${MK.o(o.sym, o.dom, 26)}<span>${esc(o.q)}</span></div>`).join('')}</div>`
        + LX.band([[.3, `<small>${esc(p.title)}</small>`], [9.5, `It was read as <b>${esc(S.name)}</b>. The other two are the signs it is most often mistaken for.`]]),
        el => { go(el); K.later(9500, () => el.querySelectorAll('.opt').forEach(o => o.classList.toggle('no', o.dataset.ok !== '1'))); }); });

    /* NOW YOU CAN READ */
    B('Now you can read', 14, () => tableHTML('1') + LX.band([[.3, 'Now you can read the table: a sign is a question, its colour is its family, its threads are its confusions.'], [8, 'A wink is someone reading. A blink is the machine passing over. Keep them apart.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.s').forEach(x => x.classList.add('on')); el.querySelectorAll('path').forEach(p => p.classList.add('on')); });
    B('Now you can read', 9, () => `<div class="tc"><small>NEXT · LESSON 6</small><h1>The Sieve</h1><p>Before any sign is read, most of the archive has already been removed.</p></div>`, el => LX.ping());
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
