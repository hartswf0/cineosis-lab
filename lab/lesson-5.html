<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- CINEOSIS · LESSON 5 · THE TABLE OF SIGNS. Unit A: what a sign is, played as a film. A sign is a question asked of a moving picture:
     the lesson cuts through the shots that answer it yes, lets them fly together into a sheet, then names them in plain words; never a
     symbol to decode. The camera moves (explain/reel.js): it pulls back from one shot to the wall of 45, flies to each family, pushes in
     on the answer. Bolas is the character on the red thread, in the right-hand gutter so his thread never crosses a picture: his ring
     opens into the first shot like an iris, he blinks at every cut, glances, hops, thinks, droops at a caveat and winks at a reading.
     Data: explain/l5.py -> l5.json; loops: explain/lesson_media.py -> l5m.json; heroes play from clips/. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.view { position: absolute; inset: 0; clip-path: inset(30px 196px 136px 30px); }
.world { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; will-change: transform; }
.bx { position: absolute; background: #000; outline: 4px solid transparent; outline-offset: 5px; transition: outline-color .5s, opacity .5s; }
.bx video, .bx img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bx.contain video { object-fit: contain; }
.bx .cap { position: absolute; left: 0; right: 0; top: 100%; margin-top: 7px; font: 13px/1.25 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.bx .cap b { font: 600 20px/1.2 var(--serif); color: var(--ink); white-space: normal; }
.bx .cap.side { left: 100%; top: 0; margin: 0 0 0 22px; width: 280px; white-space: normal; display: block; font: italic 23px/1.25 var(--serif); color: var(--ink); }
.bx .cap.side small { display: block; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 8px; font-style: normal; }
.bx.yes { outline-color: var(--lime); } .bx.dim { opacity: .13 !important; }
.o { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ece6da; background: var(--c); display: inline-block; }
.bd { right: 240px; }
.clip40 { position: absolute; left: 40px; top: 40px; width: 1360px; height: 710px; overflow: hidden; }
.strip { position: absolute; left: 0; top: 150px; display: flex; gap: 26px; will-change: transform; }
.strip figure { margin: 0; width: 440px; flex: none; } .strip .v { width: 440px; height: 330px; background: #000; } .strip video { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip figcaption { margin-top: 12px; font: 600 19px/1.3 var(--serif); color: var(--lime); } .strip figcaption small { display: block; font: 13px var(--mono); color: var(--dim); margin-top: 4px; }
.tly i { position: absolute; background: #1d1a17 center/cover no-repeat; transform: scale(0); transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .6s, filter .6s, outline-color .6s; outline: 3px solid transparent; outline-offset: 1px; }
.tly i.in { transform: none; } .tly.judged i.no { opacity: .13; filter: grayscale(1); } .tly.judged i.ok { outline-color: var(--lime); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 5</p><h1 style="font-weight:600;color:#ece6da">The Table of Signs</h1><p>A sign is a question you can ask of a moving picture. About five and a half minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/marks.js?v=1"></script>
<script src="explain/reel.js?v=2"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l5.json?v=2', 'explain/lesson/l5m.json?v=3'],
  cues: ['dae-cedar-and-cassette', 'dae-feather-rustle-dub', 'dae-slide-carousel-at-blue-hour', 'dae-preparation-drift', 'dae-snowbound-umea-cabin'],
  build(D, B, K) {
    const L = D[0], M = D[1], esc = LX.esc, AU = 'wygwyl/WYGWYL_Suite_Audio.mp3', by = Object.fromEntries(L.table.map(s => [s.n, s])), OP = L.open, PA = REEL.PA, box = REEL.box, place = REEL.place;
    const FAM = ['perception', 'affect', 'action', 'reflection', 'mental', 'break', 'time', 'read'];
    const FAMSAY = { perception: 'whose eyes the picture sees with', affect: 'a feeling held in a face or a place, before anything happens', action: 'forces, situations, and the bodies that answer them',
      reflection: 'one image standing in for another, or a world too large for its people', mental: 'dreams, destinies, marks and symbols: images joined by thought',
      break: 'seeing and hearing that can no longer turn into action', time: 'past and present held in one picture', read: 'an image that has to be read as well as seen' };
    const plain = c => esc(String(c || '').split(':')[0].replace(/\.$/, ''));
    const name = n => esc(((by[n] || {}).name || '').toLowerCase());
    const hero = (src, o = {}) => box(o.r || PA, src, { cls: 'contain ' + (o.cls || ''), id: o.id || 'hero', hide: o.hide });   // sharp 960px loops of the line's own seconds
    const at = (s, f) => K.later(s * 1000, f);
    /* one scene: a world the camera can move over, the band beneath, and Bolas in the gutter */
    const scene = (ch, secs, world, band, run, o = {}) => B(ch, secs, () => `<div class="view"><div class="world">${world}</div></div>${o.over || ''}${band ? LX.band(band, o.label) : ''}`, el => {
      K.startVideos(el); LX.runBand(el, K); const cam = REEL.cam(el.querySelector('.world'), K), g = REEL.bolas(el, K, o.g || {});
      const $ = s => el.querySelector(s), $$ = s => [...el.querySelectorAll(s)]; if (!o.g) at(.2, () => g.park()); run({ el, cam, g, $, $$ });
    });
    const sheet6 = REEL.grid(6, 3, { x: 40, y: 40, w: 1360, h: 690 }, 18);

    /* COLD OPEN · Bolas drops in, looks at us, and his ring opens into the shot */
    scene('Cold open', 18, '', [[3.4, `<i>${esc(OP.line.split('. ').slice(0, 2).join('. '))}.</i>`], [13.2, 'The Cineosis take chose this shot for that line. What is it a sign of?']], ({ el, g, $ }) => {
      at(.3, () => g.drop(720, 380, 84)); at(1.3, () => g.look(300, 380)); at(1.9, () => g.look(1200, 380)); at(2.5, () => g.look(720, 900)); at(2.9, () => g.wide(.6));
      at(3.3, () => { g.look(null); g.iris($('#hero'), 1.4); LX.poem(K, AU, OP.t0, OP.t1); LX.tick(500, .6, .04); });
      at(12.2, () => g.unIris($('#hero'), 720, 395, 84, 1.3)); at(13.8, () => g.think(3)); at(16.6, () => g.nod());
    }, { g: { x: 720, y: -200, r: 84 }, over: hero(M.open.hero, { hide: true }), label: 'The poem, 0:30' });

    /* A SIGN IS A QUESTION · cut through the shots that answer it yes; they gather into a sheet; our shot joins them */
    const ask = (n, q, nameLine, yesLine) => {
      const xs = M.ex[n].slice(0, 5), T0 = 3.6, CUT = 1.5, tg = T0 + xs.length * CUT;
      scene('A question', 22, hero(M.open.hero, { id: 'h' }) + xs.map((x, i) => box(PA, x.loop, { cls: 'y', hide: true, cap: plain(x.cap) })).join(''),
        [[.3, 'Ask the shot a question.'], [1.8, `<i>${esc(q)}</i>`], ...xs.map((x, i) => [T0 + i * CUT + .05, `Yes: ${plain(x.cap).toLowerCase()}.`]), [tg + .3, nameLine], [tg + 4, 'Ask it of our shot.'], [tg + 5.8, yesLine]],
        ({ el, cam, g, $, $$ }) => {
          const ys = $$('.bx.y'), h = $('#h'); ys.forEach(y => y.querySelector('.cap').style.opacity = 0);
          at(.8, () => g.look(720, 395)); at(1.8, () => g.think(1.6));
          xs.forEach((_, i) => at(T0 + i * CUT, () => { h.style.opacity = 0; ys.forEach((y, j) => { y.style.transition = 'none'; y.style.opacity = j === i ? 1 : 0; }); g.blink(); LX.tick(480, .06, .03); }));
          at(tg, () => { ys.forEach((y, j) => { y.style.opacity = 1; place(y, sheet6[j], 1.1); y.querySelector('.cap').style.opacity = 1; }); g.wide(1); g.look(720, 395); });
          at(tg + 4, () => { place(h, { x: 470, y: 250, w: 500, h: 375 }, 0); h.style.transition = 'opacity .4s'; h.style.opacity = 1; g.hop(300); });
          at(tg + 5, () => { place(h, sheet6[5], 1); }); at(tg + 6, () => { h.classList.add('yes'); g.wink(1.4); LX.ping(); });
          at(tg + 7.6, () => cam.fit(sheet6[5], 1.4));
        });
    };
    ask('6', by['6'].q, 'They all answer yes to one question. The lab calls it an <b>any-space-whatever</b>.', 'Yes. Our shot belongs with them.');
    ask('34a', 'Can what is seen here still be acted on?', 'Seeing with nowhere to go. The lab calls it an <b>opsign</b>.', 'Yes again. Nothing in our shot can be acted on.');
    scene('A question', 10, hero(M.open.hero, { cls: 'yes' }), [[.3, 'One shot. Two questions answered yes: <b>any-space-whatever</b> and <b>opsign</b>.'], [5, 'Reading a shot through signs means asking, not labelling.']],
      ({ g }) => { at(.6, () => g.spin()); at(5.2, () => g.wink(1.5)); });
    scene('A question', 7, '<div class="tc" style="left:0;width:1440px"><small>CINEOSIS · LESSON 5</small><h1>The Table of Signs</h1><p>Forty-five questions, and the shots that answer them.</p></div>', null,
      ({ g }) => { g.to(720, 170, 50); LX.ping(); at(2.6, () => g.wink(1.2)); at(5, () => g.park()); }, { g: { x: -260, y: 170, r: 50 } });

    /* FORTY-FIVE · the camera pulls back from one shot to the whole wall, then flies family by family */
    const order = [...L.table].sort((a, b) => FAM.indexOf(a.dom) - FAM.indexOf(b.dom));
    const WR = order.map((s, i) => ({ x: 40 + (i % 9) * 152, y: 52 + Math.floor(i / 9) * 140, w: 142, h: 107 }));
    const wall = () => order.map((s, i) => box(WR[i], M.table[s.n].loop, { cls: 'f-' + s.dom, cap: `<i class="o" style="--c:${MK.DOMC[s.dom]}"></i>${esc(s.name)}` })).join('');
    const iAs = order.findIndex(s => s.n === '6');
    scene('Forty-five', 17, wall(), [[.3, 'Our first question was one of many.'], [4.6, 'The lab keeps forty-five. Each comes with six shots that answer yes: here is one for each.'], [11, 'Every shot in the archive can be asked all forty-five.']],
      ({ cam, g, $$ }) => { cam.fit(WR[iAs], 0, 'io', .9, 6); at(1, () => cam.home(5, 'out')); at(1.4, () => g.wide(1.4));
        const ts = $$('.bx'); for (let k = 0; k < 14; k++) at(5 + k * .8, () => { const r = WR[(k * 17 + 5) % 45]; g.look(r.x + 70, r.y + 50); if (k % 4 === 3) g.blink(); }); });
    const famRect = f => { const rs = WR.filter((_, i) => order[i].dom === f); const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y)), x1 = Math.max(...rs.map(r => r.x + r.w)), y1 = Math.max(...rs.map(r => r.y + r.h + 26)); return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }; };
    scene('Forty-five', 4 + FAM.length * 2.8, wall(), FAM.map((f, i) => [.3 + i * 2.8, `<b>${MK.DOMN[f]}</b>: ${FAMSAY[f]}.`]),
      ({ cam, g, $$ }) => { FAM.forEach((f, i) => at(.3 + i * 2.8, () => { $$('.bx').forEach(t => t.classList.toggle('dim', !t.classList.contains('f-' + f))); cam.fit(famRect(f), 1.3, 'io', .9); g.blink(); g.look(720, 395); LX.tick(700, .3, .03); }));
        at(.3 + FAM.length * 2.8, () => { $$('.bx').forEach(t => t.classList.remove('dim')); cam.home(1.4); g.nod(); }); }, { label: 'eight families' });

    /* MISTAKEN FOR · one question, then the questions it sounds like, as a match */
    const S1 = M.ex['1'], half = [{ x: 40, y: 120, w: 660, h: 495 }, { x: 740, y: 120, w: 660, h: 495 }];
    scene('Mistaken for', 14, S1.map(x => box(PA, x.loop, { hide: true, cap: plain(x.cap) })).join(''),
      [[.3, '<i>Whose world is this?</i>'], ...S1.map((x, i) => [1.2 + i * 1.9, `${plain(x.cap)}.`]), [7.3, 'In each, one eye owns the world. The lab calls it <b>solid perception</b>.']],
      ({ g, $$ }) => { const bs = $$('.bx'); bs.forEach(b => b.querySelector('.cap').style.opacity = 0); S1.forEach((_, i) => at(1.2 + i * 1.9, () => { bs.forEach((b, j) => { b.style.transition = 'none'; b.style.opacity = j === i ? 1 : 0; }); g.blink(); }));
        const row = REEL.grid(3, 3, { x: 40, y: 150, w: 1360, h: 500 }, 18); at(7, () => { bs.forEach((b, j) => { b.style.opacity = 1; place(b, row[j], 1); b.querySelector('.cap').style.opacity = 1; }); g.hop(); g.wink(1.2); }); });
    const rival = { '2': M.ex['2'][0], '4': M.ex['4'][0], '34a': M.ex['34a'][1] };
    [['2', 'But if the centre travels with the camera, no single eye owns it.', 'That is <b>liquid perception</b>: the seeing moves.'],
     ['4', 'If a face fills the frame and holds a feeling, it answers a different question.', 'That is an <b>icon</b>: where a feeling becomes a face.'],
     ['34a', 'If no one looks from inside, and the seeing goes nowhere,', 'it is the <b>opsign</b> again.']].forEach(([n, a, b]) => {
      const r = rival[n];
      scene('Mistaken for', 12, box(half[0], S1[0].loop, { cap: '<b>solid perception</b>' }) + box({ ...half[1], x: 1500 }, r.loop, { id: 'rv', cap: `<b>${name(n)}</b>` }), [[.3, a], [5.6, b]],
        ({ cam, g, $ }) => { at(.4, () => { place($('#rv'), half[1], .9); g.wide(.8); });
          [1.6, 2.3, 3, 3.7, 4.4].forEach((t, i) => at(t, () => g.look(i % 2 ? 1100 : 380, 370))); at(5.6, () => { $('#rv').classList.add('yes'); g.look(1100, 370); g.wink(1.4); LX.ping(); });
          at(7.6, () => cam.fit(half[1], 1.3)); at(10.4, () => cam.home(1)); });
    });

    /* THE TAKE · twelve lines run past; each cut is a new line and a new reading */
    const mt = M.montage, stripW = mt.length * 466;
    scene('The take', 20, `<div class="clip40"><div class="strip">${mt.map(x => `<figure><div class="v"><video muted loop playsinline preload="auto" data-src="${esc(x.loop)}" data-t="0"></video></div><figcaption>${x.signs.map(name).join(' · ')}<small>${esc((x.title || '').slice(0, 40))}${x.year ? ', ' + x.year : ''}</small></figcaption></figure>`).join('')}</div></div>`,
      [[.3, 'The Cineosis take reads each line of the poem for its signs, then finds a shot that answers them.'], [8, 'Twelve lines in a row. Under each shot, the questions it answers yes.'], [14.5, 'Each cut is a new line, and a new reading.']],
      ({ cam, g, $ }) => { const s = $('.strip'); let last = -1; cam.set(720, 395, 1.15); at(.5, () => cam.home(6, 'out')); g.look(700, 250);
        K.raf(t => { const x = 1400 - t * (stripW + 300) / 19; s.style.transform = `translateX(${x}px)`; const k = Math.floor((680 - x) / 466); if (k !== last && k >= 0 && k < mt.length) { last = k; g.blink(); if (k % 3 === 2) g.nod(); LX.tick(500, .08, .03); } return t < 20; }); });

    /* A GUESS · the machine spins through all forty-five and lands */
    const G = OP.guess, spinOrder = [...order.filter(s => s.n !== G.n), ...order.filter(s => s.n === G.n)], gx = M.ex[G.n][0];
    const times = []; { let t = 3.4, dt = .07; spinOrder.forEach(() => { times.push(t); t += dt; dt *= 1.065; }); }
    const tl = times[times.length - 1];
    scene('A guess', Math.ceil(tl + 7), hero(M.open.hero, { r: half[0] }) + spinOrder.map((s, i) => `<div class="bx sp" style="left:${half[1].x}px;top:${half[1].y}px;width:${half[1].w}px;height:${half[1].h}px;opacity:0"><img src="${esc(M.table[s.n].frame)}" alt=""></div>`).join('') + box(half[1], gx.loop, { id: 'gl', hide: true, cap: `<b>${name(G.n)}</b>` }),
      [[.3, 'A machine can guess too, from the picture alone.'], [3.4, 'It holds the shot against every sign\'s example shots and written description…'], [tl + .5, `…and lands on <b>${name(G.n)}</b>, as the take read it. They agree.`]],
      ({ g, $, $$ }) => { const sp = $$('.sp'); at(.8, () => g.look(380, 370)); at(2.6, () => g.squint(1)); g.look(1070, 370);
        times.forEach((t, i) => at(t, () => { sp.forEach((e, j) => e.style.opacity = j === i ? 1 : 0); if (i % 2 === 0) g.blink(); if (i % 3 === 0) LX.tick(1500 - i * 12, .03, .02); }));
        at(tl + .35, () => { sp.forEach(e => e.style.opacity = 0); $('#gl').style.opacity = 1; $('#gl').classList.add('yes'); $('#hero').classList.add('yes'); g.wide(.8); LX.ping(); }); at(tl + 1.5, () => g.wink(1.6)); });
    const ok = L.take.map(r => !!(r.guess && r.signs.some(s => s.n === r.guess.n))), TW = 64, TH = 48;
    scene('A guess', 20, `<div class="tly">${M.tally.map((f, i) => `<i class="${ok[i] ? 'ok' : 'no'}" style="left:${40 + (i % 20) * (TW + 4)}px;top:${110 + Math.floor(i / 20) * (TH + 4)}px;width:${TW}px;height:${TH}px;${f.hide ? '' : `background-image:url(${esc(f.frame)})`}"></i>`).join('')}</div>`,
      [[.3, 'Now every line of the poem: 169 shots.'], [5.6, `Lit where the machine's guess matches the take's reading: <b>${L.agree}</b> of ${L.n}. About half.`], [12.2, 'And that is generous. The take chose its shots by the same likeness, so some agreement is built in.']],
      ({ el, cam, g, $$ }) => { const is = $$('.tly i'); cam.set(300, 250, 2.2); at(.3, () => cam.home(5, 'io')); is.forEach((i, k) => at(.3 + k * .026, () => { i.classList.add('in'); if (k % 20 === 0) g.blink(); }));
        at(5.5, () => { el.querySelector('.tly').classList.add('judged'); g.wide(1); LX.ping(); }); at(12.2, () => g.sad(4)); at(16.6, () => g.shake()); });

    /* YOUR TURN · the shot, then three questions each shown by a shot that answers it, then the reading */
    M.practice.forEach((p, k) => {
      const lp = L.practice[k], s = by[lp.signs[0].n], opts = [s.n, ...(s.conf || []).filter(n => M.ex[n]).slice(0, 2)];
      const ord = k === 1 ? [opts[2], opts[1], opts[0]] : [opts[1], opts[0], opts[2]], w = ord.indexOf(s.n);
      const big = { x: 40, y: 80, w: 740, h: 555 }, col = ord.map((_, i) => ({ x: 820, y: 40 + i * 236, w: 260, h: 195 }));
      scene('Your turn', 24, hero(p.hero, { id: 'h' }) + ord.map((n, i) => box(PA, M.ex[n][0].loop, { cls: 'c', hide: true, cap: `${esc(by[n].q)}<small>${name(n)}</small>` })).join(''),
        [[.3, `<i>${esc(lp.line.split(/[.:—]/)[0].trim())}.</i>`], [6, 'Which question does it answer yes?'], ...ord.map((n, i) => [7.4 + i * 2.2, `<i>${esc(by[n].q)}</i>`]), [14.2, 'Your guess?'], [17.3, `The take read it as <b>${name(s.n)}</b>. The other two are what it gets mistaken for.`]],
        ({ cam, g, $, $$ }) => { const cs = $$('.bx.c'), h = $('#h'); cs.forEach(c => { c.querySelector('.cap').classList.add('side'); c.querySelector('.cap').style.opacity = 0; });
          LX.poem(K, AU, lp.t0, Math.min(lp.t1, lp.t0 + 9)); at(.6, () => g.look(720, 395)); at(4, () => g.think(2));
          ord.forEach((_, i) => at(7.4 + i * 2.2, () => { h.style.opacity = 0; cs.forEach((c, j) => { c.style.transition = 'none'; c.style.opacity = j === i ? 1 : 0; }); g.blink(); LX.tick(480, .06, .03); }));
          at(14, () => { h.style.transition = 'opacity .4s'; h.style.opacity = 1; place(h, big, 0); cs.forEach((c, j) => { c.style.opacity = 1; place(c, col[j], 1); c.querySelector('.cap').style.opacity = 1; }); g.think(3); });
          [14.6, 15.4, 16.2].forEach((t, i) => at(t, () => g.look(1000, 140 + i * 236)));
          at(17.2, () => { cs.forEach((c, j) => c.classList.add(j === w ? 'yes' : 'dim')); g.look(1000, 140 + w * 236); g.hop(); g.wink(1.6); LX.ping(); });
          at(20, () => cam.fit({ ...col[w], w: 580 }, 2.5, 'io', .9)); });
    });

    /* NOW YOU CAN READ · a fast montage of readings, gathering into a sheet */
    const fin = mt.slice(0, 8), g8 = REEL.grid(8, 4, { x: 40, y: 80, w: 1360, h: 640 }, 16);
    scene('Now you can read', 14, fin.map(x => box(PA, x.loop, { cls: 'f', hide: true, cap: x.signs.map(name).join(' · ') })).join(''),
      [[.3, 'A sign is a question asked of a moving picture.'], [5.2, 'A reading is the yes.'], [9, 'Lesson 6 asks what is allowed to be chosen at all.']],
      ({ g, $$ }) => { const fs = $$('.bx.f'); fs.forEach(f => f.querySelector('.cap').style.opacity = 0);
