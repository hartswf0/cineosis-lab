<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Table of Signs · Lesson 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=3"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · LESSON 5 · THE TABLE OF SIGNS, as a cartoon in grease pencil. Bolas acts the lesson out: a label that will not stick,
     a question spun from the thread, the 45 signs set out like plates, a tangle of confusions, a projector that only blinks against
     Bolas who winks, the tally of where they agree (88 of 169), the take's shape spun as a web, and three practice shots.
     Data: explain/l5.py -> explain/lesson/l5.json. Drawing: explain/toon.js (on twos, grease style). -->
<style>
:root { --bg: #efe6d2; --ink: #1b1712; }
body, #stage { background: #0b0a09; }
canvas.toon { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
video.src { display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 5</p><h1 style="font-weight:600;color:#ece6da">The Table of Signs</h1><p>A cartoon about what a sign is, and the signs each is mistaken for. About three minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/toon.js?v=2"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l5.json?v=2'],
  cues: ['dae-cedar-and-cassette', 'dae-feather-rustle-dub', 'dae-slide-carousel-at-blue-hour', 'dae-preparation-drift', 'dae-snowbound-umea-cabin'],
  build(D, B, K) {
    const L = D[0], esc = LX.esc, T = L.table, by = Object.fromEntries(T.map(s => [s.n, s])), OP = L.open, STYLE = 'grease';
    const FAM = ['perception', 'affect', 'action', 'reflection', 'mental', 'time', 'break', 'read'];
    const clip = p => `<video class="src" muted loop playsinline data-src="${esc(p.clip)}" data-t="${p.in || 0}" data-end="${((p.in || 0) + (p.t1 - p.t0)).toFixed(2)}"></video>`;
    const scene = (ch, secs, fn, withClip) => B(ch, secs, () => `<canvas class="toon" width="1600" height="900"></canvas>${withClip ? clip(withClip) : ''}`,
      el => { K.startVideos(el); const v = el.querySelector('video.src'); TOON.play(el.querySelector('canvas.toon'), (d, t) => fn(d, t, v), K, { style: STYLE }); });
    const say = (d, s, t, at, y = 820, size = 46) => { if (t > at) d.text(s, 800, y, { size, a: Math.min(1, (t - at) * 2) }); };
    const pos = s => [96 + s.col * 94, 250 + s.row * 170];
    const sign = (d, s, x, y, r = 34, a = 1) => { if (a <= 0 || !s) return; d.c.save(); d.c.globalAlpha = Math.min(1, a); d.tint(x, y, r, d.DOMC[s.dom]); d.ring(x, y, r, { w: 4 }); d.text(s.sym, x, y + 2, { font: `600 ${r * .78}px Fraunces, Georgia, serif` }); d.c.restore(); };
    let lastTick = -1; const tickAt = (t, at, f = 880) => { if (t >= at && lastTick < at) LX.tick(f, .4, .03); };
    const s1 = by['1'], G = OP.guess, opSigns = OP.signs.map(s => by[String(s.n)]);

    /* 1 · THE LABEL THAT WILL NOT STICK */
    scene('A label?', 15, (d, t, v) => {
      const y = d.kv(t, [[0, -200], [1.1, 300, 'in'], [1.25, 330], [1.5, 290, 'out'], [1.7, 300]]), sq = d.kv(t, [[0, 1.25], [1.1, 1.25], [1.2, .7], [1.45, 1.1], [1.7, 1]]);
      const hold = d.kv(t, [[1.6, 0], [2.4, 1, 'back']]);
      d.bolas({ x: 420, y, r: 92, sq, eyes: t > 7.2 && t < 8.4 ? 'shut' : t > 3.6 && t < 3.8 ? 'blink' : 'open', look: t > 4.2 ? [1, -.2] : [0, 0], arms: [[-130, 60], [160 + 140 * hold, 20 - 120 * hold]] });
      const px = 420 + 160 + 140 * hold + 170, py = 300 - 120 * hold - 20; if (hold > .02) d.pic(v, px, py, 170 * hold, { w: 6 });
      if (t > 4.4) { const lt = t - 4.4, lx = d.kv(lt, [[0, 1700], [.6, px + 30, 'out'], [3.2, px + 30], [5, px + 80, 'in']]), ly = d.kv(lt, [[0, 120], [.6, py - 40, 'out'], [3.2, py - 30], [5, 980, 'in']]), lr = d.kv(lt, [[0, .5], [.6, -.08], [3.2, -.05], [5, 1.8]]);
        if (lt < 5) { d.c.save(); d.c.translate(lx, ly); d.c.rotate(lr); d.c.fillStyle = d.BG; d.c.fillRect(-80, -34, 160, 68); d.stroke([[-80, -34], [80, -34], [80, 34], [-80, 34], [-80, -34]], { w: 4 }); d.text('SAD', 0, 2, { font: '600 40px IBM Plex Mono, monospace' }); d.c.restore(); } }
      say(d, 'You would think a sign is a label you stick on a shot.', t, 2.2, 820, 40);
      if (t > 8.6) say(d, 'It will not stay on.', t, 8.6, 870, 32);
    }, OP);
    scene('A label?', 15, (d, t, v) => {
      d.bolas({ x: 420, y: 300, r: 92, eyes: t > 9 && t < 10.3 ? 'wink' : 'open', look: [1, -.3], arms: [[-130, 60], [300, -100]] });
      d.pic(v, 890, 180, 150, { w: 6 });
      const q = [], k = Math.min(1, Math.max(0, (t - .6) / 3));
      for (let a = 200; a <= 420; a += 8) q.push([890 + 60 * Math.cos(a * Math.PI / 180), 430 + 50 * Math.sin(a * Math.PI / 180)]);
      q.push([890, 510]); const m = Math.max(2, Math.floor(q.length * k)); if (k > 0) d.stroke(q.slice(0, m), { col: d.RED, w: 5 }); if (k >= 1) d.dot(890, 550, 9, d.RED);
      opSigns.forEach((s, i) => { const a = d.kv(t, [[4 + i * 1.6, 0], [4.6 + i * 1.6, 1, 'back']]); if (a > 0) { const x = 1270, y = 200 + i * 270; sign(d, s, x, y, 64 * a, a); if (a > .9) d.text(s.q, x, y + 100, { size: 25, a: Math.min(1, (t - 5 - i * 1.6) * 1.5) }); } });
      say(d, 'A sign is a question you ask of the picture.', t, 2.5, 790, 44);
      if (t > 11) say(d, 'This shot answers yes to two of them.', t, 11, 860, 34);
    }, OP);

    /* 2 · SETTING THE TABLE */
    const order = FAM.flatMap(f => T.filter(s => s.dom === f));
    scene('The table', 16, (d, t) => {
      for (let r = 0; r < 3; r++) d.line(50, 250 + r * 170 + 46, 1550, 250 + r * 170 + 46, { w: 3 });
      const per = 12.5 / order.length, k = Math.min(order.length, Math.floor(t / per)), cur = order[Math.min(order.length - 1, k)];
      order.forEach((s, i) => { if (i < k) { const [x, y] = pos(s); const a = Math.min(1, (t - i * per) * 3); sign(d, s, x, y - (1 - d.ease.back(a)) * 30, 34); } });
      const [bx, by_] = pos(cur), step = Math.sin(t * 18) * 14;
      if (k < order.length) d.bolas({ x: bx + 6, y: by_ - 120 + Math.abs(step) * .3, r: 46, eyes: 'open', look: [0, 1], arms: [[-40, 60 + step], [44, 66 - step]], legs: [[-50, 120 + step * .5], [50, 120 - step * .5]] });
      else d.bolas({ x: 800, y: d.kv(t, [[12.5, 120], [13.2, 140]]), r: 46, eyes: t > 13.6 && t < 14.8 ? 'wink' : 'open', look: [0, 1] });
      tickAt(t, k * per); lastTick = t;
      if (t > 13) FAM.forEach((f, i) => d.text(f, 130 + i * 190, 760, { size: 26, font: 'italic 600 26px Fraunces, Georgia, serif', col: d.DOMC[f] }));
      say(d, 'Forty-five signs. Eight families. One colour each, kept inside the O.', t, 1.2, 860, 34);
    });

    /* 3 · TANGLED */
    scene('Tangled', 16, (d, t) => {
      T.forEach(s => { const [x, y] = pos(s); sign(d, s, x, y, 30, .35 + (s.n === '1' || s1.conf.includes(s.n) ? .65 : 0)); });
      const [x0, y0] = pos(s1), targets = s1.conf.map(c => pos(by[c]));
      const leg = Math.min(2.999, Math.max(0, (t - 1) / 2.2)), seg = Math.floor(leg), f = leg - seg;
      targets.forEach(([x, y], i) => { if (i < seg || (i === seg && f > 0)) { const e = i < seg ? 1 : f, ex = x0 + (x - x0) * e, ey = y0 + (y - y0) * e; d.curve([[x0, y0 - 30], [(x0 + ex) / 2, Math.min(y0, ey) - 90], [ex, ey - 30]], { col: d.RED, w: 4 }); } });
      const tgt = targets[Math.min(2, seg)], prev = seg ? targets[seg - 1] : [x0, y0];
      const bx = t < 7.6 ? prev[0] + (tgt[0] - prev[0]) * (t < 7.6 ? f : 1) : d.kv(t, [[7.6, tgt[0]], [9.5, 800]]), byy = t < 7.6 ? y0 - 110 : d.kv(t, [[7.6, y0 - 110], [9.5, 470]]);
      if (t > 7.6) T.forEach(s => s.conf.forEach(c => { if (!by[c]) return; const [a1, b1] = pos(s), [a2, b2] = pos(by[c]); d.curve([[a1, b1 - 30], [(a1 + a2) / 2, Math.min(b1, b2) - 60 - Math.abs(a1 - a2) * .08], [a2, b2 - 30]], { col: d.RED, w: 1.4, a: Math.min(.5, (t - 7.6) * .3) }); }));
      const wrap = t > 9.5 ? Math.min(1, (t - 9.5) / 2) : 0, spin = t > 9.5 ? (t - 9.5) * 3 : 0;
      d.bolas({ x: bx, y: byy, r: 50, lean: Math.sin(spin) * .5 * wrap, eyes: wrap > .5 ? 'shut' : 'open', look: [0, .6] });
      if (wrap > 0) for (let k = 0; k < 7 * wrap; k++) d.ring(bx, byy + 20, 62 + k * 7, { col: d.RED, w: 2.4, sx: 1.25, sy: .45, rot: k });
      say(d, `${s1.name} gets mistaken for ${s1.conf.map(c => by[c].name).join(', ')}.`, t, 1, 820, 32);
      if (t > 8) say(d, 'Every sign has three threads like these. They cross every family.', t, 8, 866, 30);
    });

    /* 4 · WINK AGAINST BLINK */
    scene('Wink and blink', 18, (d, t, v) => {
      d.pic(v, 800, 330, 150, { w: 6 });
      const wk = t > 3 && t < 4.8, bl = (t % 1.2) < .16;
      d.bolas({ x: 260, y: 320, r: 84, eyes: wk ? 'wink' : (t > 12 && t < 13 ? 'wink' : 'open'), look: [1, 0], arms: [[-110, 60], [130, -40]] });
      d.machine(1330, 340, 1.15, { blink: bl, spin: t * 4, look: -1 }); d.beam(1210, 340, 960, 330, 120, t > 6 ? .22 : .08);
      opSigns.forEach((s, i) => { const a = d.kv(t, [[3.2 + i * .5, 0], [3.8 + i * .5, 1, 'back']]); if (a > 0) sign(d, s, 200 + i * 150, 120 - i * 10, 46 * a); });
      const ga = d.kv(t, [[6, 0], [6.6, 1, 'back']]); if (ga > 0) { const gx = d.kv(t, [[6, 1180], [10, 1180], [12, 350]]), gy = d.kv(t, [[6, 140], [10, 140], [12, 112]]); sign(d, by[G.n], gx, gy, 46 * ga); }
      if (t > 12 && t < 13.2) d.text('✶', 350, 40, { size: 60, col: d.RED });
      d.text('wink · a reading', 260, 560, { size: 30 }); d.text('blink · a guess', 1330, 560, { size: 30 });
      say(d, `Bolas reads it as ${opSigns.map(s => s.name).join(' and ')}. The machine only blinks, and guesses ${G.name}.`, t, 1.2, 760, 30);
      if (t > 12.5) say(d, 'They agree on one of the two.', t, 12.5, 830, 44);
    }, OP);

    /* 5 · THE TALLY */
    const TK = L.take, yes = TK.map(x => !!(x.guess && x.signs.some(s => String(s.n) === String(x.guess.n))));
    scene('The tally', 18, (d, t) => {
      const shown = Math.min(TK.length, Math.floor(d.kv(t, [[0, 0], [2, 1], [5, 6], [9, 30], [15, 169]])));
      d.line(80, 520, 1520, 520, { col: d.RED, w: 4 });
      d.bolas({ x: 560, y: 300, r: 70, eyes: shown && yes[shown - 1] ? 'wink' : 'open', look: [0, 1] });
      d.machine(1060, 330, .9, { blink: (t * 3 % 1) < .2, spin: t * 6 });
      for (let k = 0; k < 9; k++) { const i = shown - 1 - k; if (i < 0) break; const s = by[String(TK[i].signs[0].n)]; sign(d, s, 800 - k * 92, 520, 30, 1 - k * .09); if (k === 0) d.text(yes[i] ? '✓' : '×', 800, 584, { size: 40, col: yes[i] ? d.INK : d.RED }); }
      const agreed = yes.slice(0, shown).filter(Boolean).length;
      for (let k = 0; k < agreed; k++) { const g = Math.floor(k / 5), j = k % 5, gx = 110 + (g % 18) * 78, gy = 640 + Math.floor(g / 18) * 66; j < 4 ? d.line(gx + j * 12, gy, gx + j * 12, gy + 44, { w: 3 }) : d.line(gx - 6, gy + 38, gx + 50, gy + 6, { w: 3 }); }
      d.text(`${agreed} of ${shown}`, 1400, 260, { font: '600 64px IBM Plex Mono, monospace' });
      if (shown >= TK.length) say(d, 'About half. And the take chose these shots partly by the machine’s own guess.', t, 15.2, 860, 30);
      else say(d, 'Every shot in the Cineosis take. Does the machine’s guess match the reading?', t, 1, 860, 30);
    });

    /* 6 · THE SHAPE, SPUN */
    const fv = FAM.map(f => L.families[f] || 0), mx = Math.max(...fv);
    scene('The shape', 15, (d, t) => {
      const cx = 800, cy = 400, R = 260, sp = Math.min(1, t / 3), poly = Math.min(1, Math.max(0, (t - 3.5) / 4));
      FAM.forEach((f, i) => { const a = -Math.PI / 2 + i / 8 * Math.PI * 2; if (sp * 8 > i) { d.line(cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R, { col: d.RED, w: 2 }); d.text(`${f} ${fv[i]}`, cx + Math.cos(a) * (R + 80), cy + Math.sin(a) * (R + 40), { size: 26, col: d.DOMC[f] }); } });
      for (let k = 1; k <= 4; k++) if (t > 1.5 + k * .4) d.ring(cx, cy, R * k / 4, { w: 1.4, a: .45 });
      if (poly > 0) { const pts = FAM.map((f, i) => { const a = -Math.PI / 2 + i / 8 * Math.PI * 2, v = fv[i] / mx * poly; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; }); pts.push(pts[0]); d.stroke(pts, { col: d.RED, w: 5 }); }
      const ang = t * 2.1; if (t < 3.2) d.bolas({ x: cx + Math.cos(ang) * (R + 20), y: cy + Math.sin(ang) * (R + 20), r: 34, thread: false, eyes: 'open', look: [0, 1] });
      else d.bolas({ x: 1340, y: d.kv(t, [[3.2, -60], [4, 150, 'out']]), r: 46, eyes: t > 9 && t < 10.5 ? 'wink' : 'open', look: [-1, .4], arms: [[-60, 50], [-150, 90]] });
      say(d, `Count the take's signs by family and the film has a shape: time ${L.families.time}, readable ${L.families.read}.`, t, 7.5, 860, 30);
    });

    /* 7 · PRACTICE */
    scene('Your turn', 6, (d, t) => { d.bolas({ x: 800, y: d.kv(t, [[0, -100], [1, 360, 'in'], [1.2, 390], [1.5, 360]]), r: 90, eyes: t > 3 && t < 4.4 ? 'wink' : 'open', look: [0, .3] }); say(d, 'Your turn. Which question does each shot answer yes to?', t, 1.8, 780, 38); });
    L.practice.forEach(p => { const S = by[String(p.signs[0].n)], opts = [S, ...S.conf.slice(0, 2).map(c => by[c])].sort((a, b) => a.n.localeCompare(b.n));
      scene('Your turn', 15, (d, t, v) => {
        d.pic(v, 420, 360, 230, { w: 7 });
        const drop = t > 9;
        opts.forEach((o, i) => { const ok = o === S, x = 1000 + i * 190, y0 = 230, y = drop && !ok ? d.kv(t, [[9, y0], [10.2, 980, 'in']]) : drop ? d.kv(t, [[9, y0], [9.8, 180, 'back']]) : y0 + Math.sin(t * 2 + i) * 6;
          d.thread(x, -10, x, y - 58, { w: 2 }); sign(d, o, x, y, 58); if (!drop) d.text(`${o.sym} · ${o.q.length > 58 ? o.q.slice(0, 56) + '…' : o.q}`, 1190, 350 + i * 44, { size: 23 }); });
        d.bolas({ x: 1190, y: 620, r: 54, thread: false, eyes: drop ? 'wink' : (t % 2.4 < .15 ? 'blink' : 'open'), look: drop ? [0, -1] : [-1, -.3] });
        if (drop) say(d, `${S.name}. The other two are what it gets mistaken for.`, t, 9.3, 820, 34);
        else say(d, p.title, t, .5, 820, 28);
      }, p); });

    /* 8 · END */
    scene('End', 9, (d, t) => {
      d.bolas({ x: 800, y: 330, r: 100, eyes: t > 2 && t < 3.6 ? 'wink' : 'open', look: [0, .2] });
      d.text('A wink is someone reading.', 800, 610, { size: 44, a: Math.min(1, t) }); d.text('A blink is the machine passing over.', 800, 670, { size: 44, a: Math.min(1, Math.max(0, t - 1)) });
      if (t > 4.5) d.text('Next · Lesson 6 · The Sieve', 800, 800, { font: '600 26px IBM Plex Mono, monospace', a: Math.min(1, t - 4.5) });
    });
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
