<!-- CINEOSIS · LESSON 4 · THE VOICE IS THE CLOCK. Unit A: what a recorded voice adds to a printed line, drawn the way Videotext's
     views draw it (Elastic Spacing, Word Duration, Time Remap, Variable Speed, Bridge Bar, Playhead Bind) but at film size, from the
     suite's real word timings (2,799 words). Shows Videotext's own guess at timing against the voice, and how the cut films' cuts
     fall against the spoken lines. Data: explain/l4.py -> explain/lesson/l4.json. Devices: explain/lesson.js + the views below. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; --cyan: #7fd6e8; }
body, #stage { background: var(--bg); }
.el { position: absolute; left: 80px; right: 80px; }
.el .w { position: absolute; top: 0; white-space: nowrap; font: 400 var(--fs, 30px)/1 var(--serif); color: #6d675d; transition: left 2.2s cubic-bezier(.45,.05,.25,1), color .25s; }
.el .w.on { color: var(--ink); } .el .w.now { color: var(--lime); }
.el .ph { position: absolute; top: -14px; bottom: -14px; width: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); left: 0; opacity: 0; }
.el small.sec { position: absolute; right: -70px; top: 4px; font: 13px var(--mono); color: var(--dim); }
.flow { position: absolute; left: 80px; right: 80px; top: 300px; font: 400 46px/1.35 var(--serif); color: var(--ink); text-align: justify; }
.blocks { position: absolute; left: 80px; right: 80px; }
.blocks i { position: absolute; bottom: 0; background: #8b8478; border-radius: 2px; opacity: 0; transition: opacity .3s, background .2s; } .blocks i.on { opacity: 1; } .blocks i.now { background: var(--lime); }
.blocks i span { position: absolute; left: 2px; top: -22px; font: 14px var(--mono); color: var(--dim); white-space: nowrap; }
svg.rm { position: absolute; left: 140px; top: 50px; width: 1320px; height: 420px; overflow: visible; }
.df { position: absolute; left: 140px; width: 1320px; top: 560px; height: 180px; } .df::before { content: ''; position: absolute; left: 0; right: 0; top: 90px; border-top: 1px solid #3a362f; } .df i { position: absolute; width: 10px; transform: translateX(-5px); background: #a29d90; opacity: 0; transition: opacity .3s; } .df i.big { background: var(--red); } .df small { position: absolute; left: -130px; font: 13px var(--mono); color: var(--dim); }
.spd { position: absolute; left: 80px; right: 80px; top: 120px; height: 480px; display: flex; align-items: flex-end; gap: 1px; }
.spd i { flex: 1; height: 0; transition: height .8s cubic-bezier(.3,.7,.3,1); opacity: .85; } .spd i.x { opacity: 1; outline: 2px solid #fff; }
.spl { position: absolute; left: 80px; right: 80px; top: 620px; display: flex; justify-content: space-between; font: 14px var(--mono); color: var(--dim); }
.say2 { position: absolute; left: 120px; right: 120px; top: 230px; font: italic 54px/1.3 var(--serif); color: var(--ink); text-align: center; opacity: 0; transition: opacity .6s; } .say2 small { display: block; font: 600 22px var(--mono); font-style: normal; color: var(--gold); margin-top: 26px; }
.sil { position: absolute; left: 80px; right: 80px; top: 360px; height: 6px; background: #3a362f; }
.sil i { position: absolute; top: -40px; height: 86px; background: rgba(127,214,232,.25); border-left: 2px solid var(--cyan); border-right: 2px solid var(--cyan); opacity: 0; transition: opacity .6s; } .sil i b { position: absolute; top: -34px; left: 0; font: 600 18px var(--mono); color: var(--cyan); white-space: nowrap; }
.br { position: absolute; left: 80px; right: 80px; }
.br .ln { position: absolute; top: 0; height: 54px; border: 2px solid #9a9284; display: flex; align-items: center; padding: 0 8px; font: 15px/1.15 var(--serif); color: var(--ink); overflow: hidden; }
.br .sh { position: absolute; top: 90px; height: 96px; background: #111 center/cover; border-right: 2px solid var(--bg); } .br .sh.cur { outline: 3px solid var(--lime); outline-offset: -3px; }
.br .tk { position: absolute; top: 56px; height: 34px; width: 4px; transform: translateX(-2px); background: #6f8cff; } .br .tk.in { background: var(--red); box-shadow: 0 0 10px var(--red); }
.br .ph { position: absolute; top: -10px; height: 210px; width: 2px; background: var(--cyan); }
.scbox { position: absolute; left: 330px; top: 30px; width: 940px; height: 470px; overflow: hidden; }
.tot { position: absolute; left: 120px; right: 120px; top: 140px; display: flex; flex-direction: column; gap: 56px; }
.tot .row b { display: block; font: 600 16px var(--mono); letter-spacing: .14em; color: var(--ink); text-transform: uppercase; margin-bottom: 10px; } .tot .row b em { font-style: normal; color: var(--dim); }
.tot .bar { display: flex; height: 70px; } .tot .bar i { height: 100%; width: 0; transition: width 1.4s cubic-bezier(.3,.7,.3,1); display: grid; place-items: center; font: 600 20px var(--mono); color: #111; white-space: nowrap; overflow: hidden; }
.pb { position: absolute; inset: 0; }
.pb .big { position: absolute; left: 80px; right: 80px; top: 40px; font: 900 150px/1 var(--serif); color: var(--red); text-transform: uppercase; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; }
.pb .lnx { position: absolute; left: 80px; right: 80px; top: 210px; font: 26px/1.3 var(--serif); color: var(--dim); } .pb .lnx b { color: var(--red); }
.pb .scbox { left: 80px; top: 290px; width: 900px; height: 450px; } .pb .prog { position: absolute; left: 80px; top: 748px; width: 900px; height: 6px; background: #2a2723; } .pb .prog i { display: block; height: 100%; background: var(--red); width: 0; }
.pb .nx { position: absolute; left: 1010px; right: 80px; top: 290px; display: flex; flex-direction: column; gap: 10px; } .pb .nx div { height: 112px; background: #111 center/cover; transition: all .6s; } .pb .nx small { font: 12px var(--mono); color: var(--dim); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 4</p><h1 style="font-weight:600;color:#ece6da">The Voice Is the Clock</h1><p>What a recorded voice adds to a printed line, and how the films cut against it. About seven minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script src="explain/lesson.js?v=3"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l4.json?v=1'],
  cues: ['dae-snowbound-umea-cabin', 'dae-slide-carousel-at-blue-hour', 'dae-preparation-drift', 'dae-cold-current-paddle', 'dae-salvaged-room-traveling-light', 'dae-cedar-and-cassette', 'dae-compass-spin-in-heavy-fog', 'dae-feather-rustle-dub'],
  build(D, B, K) {
    const L = D[0], esc = LX.esc, mmss = LX.mmss, AU = L.audio, ST = L.stanza, BR = L.bridge, W = 1440;
    const voice = K.voice();
    /* ELASTIC SPACING: words placed at their spoken time on a clock [A,B]; they start where print would put them and slide */
    function elastic(lines, A, B, top, gap, fs) {
      return lines.map((l, k) => `<div class="el" style="top:${top + k * gap}px;--fs:${fs}px" data-k="${k}">${l.words.map((w, i) => `<span class="w" data-t0="${w.t0}" data-t1="${w.t1}" data-x="${((w.t0 - A) / (B - A) * W).toFixed(1)}">${esc(w.w)}</span>`).join('')}<i class="ph"></i></div>`).join('');
    }
    function printed(el) { el.querySelectorAll('.el').forEach(row => { let x = 0; row.querySelectorAll('.w').forEach(w => { w.style.transition = 'none'; w.style.left = x + 'px'; x += w.offsetWidth + w.offsetHeight * .28; }); }); }
    /* pauses become space: each word keeps its printed width, and the silence before it is drawn as room in proportion to its length */
    function spread(el) { el.querySelectorAll('.el').forEach(row => { const ws = [...row.querySelectorAll('.w')], wd = ws.map(w => w.offsetWidth), sp = 10;
        const gaps = ws.map((w, i) => i ? Math.max(0, +w.dataset.t0 - +ws[i - 1].dataset.t1) : 0), G = gaps.reduce((a, b) => a + b, 0), fixed = wd.reduce((a, b) => a + b + sp, 0);
        const k = G ? Math.max(0, Math.min(420, (W - fixed) / G)) : 0; let x = 0; row._map = [];
        ws.forEach((w, i) => { x += gaps[i] * k; w.style.transition = ''; w.style.left = x + 'px'; row._map.push([+w.dataset.t0, x], [+w.dataset.t1, x + wd[i]]); x += wd[i] + sp; }); }); }
    function follow(el, A, B, until) { const ws = [...el.querySelectorAll('.el .w, .blocks i')], phs = [...el.querySelectorAll('.el .ph')];
      K.raf(() => { const t = voice.currentTime; ws.forEach(w => { w.classList.toggle('on', t >= +w.dataset.t0); w.classList.toggle('now', t >= +w.dataset.t0 && t < +w.dataset.t1); });
        phs.forEach(p => { const m = p.parentNode._map; if (!m || !m.length) return; const on = t >= m[0][0] - .05 && t <= m[m.length - 1][0] + .05; p.style.opacity = on ? 1 : 0; if (!on) return;
          let x = m[0][1]; for (let i = 1; i < m.length; i++) { if (t <= m[i][0]) { const [t0, x0] = m[i - 1], [t1, x1] = m[i]; x = x0 + (x1 - x0) * (t1 > t0 ? (t - t0) / (t1 - t0) : 1); break; } x = m[i][1]; } p.style.left = x + 'px'; }); return t < until + .5 && !voice.paused || t < A + .5; }); }
    const l0 = ST[1], A0 = l0.t0 - .2, B0 = l0.t1 + .2;

    /* COLD OPEN · a printed line, then the same line spoken */
    B('Cold open', 9, () => `<div class="flow">${esc(l0.text)}</div>` + LX.band([[.6, 'You would think a film cut to a poem changes picture when a line ends.'], [4.6, 'In ours, two cuts in three land while a word is still being said. First, see what a page hides: this line has no time in it.']]), el => LX.runBand(el, K));
    B('Cold open', Math.ceil(B0 - A0) + 5, () => elastic([l0], A0, B0, 330, 0, 40) + LX.band([[.3, 'Now listen to it.'], [Math.ceil(B0 - A0) + 1, 'The same line, spoken. The gaps are where the voice waits.']]),
      el => { LX.runBand(el, K); printed(el); K.later(900, () => { spread(el); LX.poem(K, AU, A0, B0); follow(el, A0, B0, B0); }); });
    B('Cold open', 8, () => `<div class="tc"><small>CINEOSIS · LESSON 4</small><h1>The Voice Is the Clock</h1><p>Every film in the lab runs on a recorded voice. What does the voice add, and do the cuts listen to it?</p></div>`, el => LX.ping());

    /* THE SCORE · four lines on one clock, then as blocks */
    const SA = ST[0].t0 - .3, SB = ST[3].t1 + .3, SD = SB - SA;
    B('The score', Math.ceil(SD) + 3, () => elastic(ST, SA, SB, 130, 130, 30) + LX.band([[.3, 'Four lines on one clock. Each word sits where it is heard.'], [SD * .45, 'The space between two words is the silence between them.'], [SD * .8, 'The widest holes are breaths.']]),
      el => { LX.runBand(el, K); printed(el); K.later(800, () => spread(el)); K.later(1800, () => { LX.poem(K, AU, SA, SB); follow(el, SA, SB, SB); }); });
    const blocks = (lines, A, B, top, h) => `<div class="blocks" style="top:${top}px;height:${h}px">${lines.flatMap(l => l.words).map(w => `<i data-t0="${w.t0}" data-t1="${w.t1}" style="left:${((w.t0 - A) / (B - A) * W).toFixed(1)}px;width:${Math.max(3, (w.t1 - w.t0) / (B - A) * W - 2).toFixed(1)}px;height:${(24 + (w.st + 1.3) * 70).toFixed(0)}px"><span>${(w.t1 - w.t0) > .38 ? esc(w.w.replace(/[,.;:!?]/g, '')) : ''}</span></i>`).join('')}</div>`;
    B('The score', Math.ceil(SD) + 3, () => blocks(ST, SA, SB, 120, 520) + LX.band([[.3, 'The same four lines as blocks: each as long as the word is spoken, as tall as it is stressed.'], [SD * .55, 'This is what an editor can cut to. Not the page: these.']]),
      el => { LX.runBand(el, K); K.later(800, () => { LX.poem(K, AU, SA, SB); follow(el, SA, SB, SB); }); });

    /* THE GUESS · Videotext's own fallback against the voice */
    const pts = ST.flatMap(l => l.words.map((w, i) => ({ r: w.t0, g: l.guess[i], w: w.w }))), n = pts.length;
    const px = i => (i / (n - 1) * 1320).toFixed(1), py = t => (420 - (t - SA) / SD * 420).toFixed(1);
    B('The guess', 20, () => `<svg class="rm"><line x1="0" y1="420" x2="1320" y2="0" stroke="#3a362f" stroke-dasharray="6 8"/><polyline class="g" fill="none" stroke="#a29d90" stroke-width="3" stroke-dasharray="2 6" points="${pts.map((p, i) => px(i) + ',' + py(p.g)).join(' ')}" opacity="0"/><polyline class="r" fill="none" stroke="#c4f46a" stroke-width="4" points="${pts.map((p, i) => px(i) + ',' + py(p.r)).join(' ')}"/>
        <text x="0" y="450" fill="#a29d90" font-family="IBM Plex Mono" font-size="15">word 1</text><text x="1320" y="450" fill="#a29d90" font-family="IBM Plex Mono" font-size="15" text-anchor="end">word ${n}</text><text x="-20" y="10" fill="#a29d90" font-family="IBM Plex Mono" font-size="15" text-anchor="end">${SD.toFixed(0)} s</text></svg><div class="df"><small style="top:0">guess late</small><small style="top:160px">guess early</small>${pts.map((p, i) => { const d = Math.max(-2, Math.min(2, p.g - p.r)), h = Math.abs(d) / 2 * 90; return `<i class="${Math.abs(d) > .5 ? 'big' : ''}" style="left:${px(i)}px;top:${d > 0 ? 90 - h : 90}px;height:${Math.max(1, h)}px"></i>`; }).join('')}</div>`
      + LX.band([[.3, 'One dot per word: across, the word\'s place in the stanza; up, when it is spoken. Lime is the voice.'], [6.5, 'Without the recording, the editing tool guesses: a word lasts as long as its letters, a full stop rests longer than a comma. Grey is the guess.'], [14, `Below, how far off the guess is at each word. Across the poem it misses by ${L.guess_err.mean.toFixed(2)} s on average, up to ${L.guess_err.max.toFixed(1)} s, worst at the breaths.`]]),
      el => { LX.runBand(el, K); const r = el.querySelector('.r'), Ln = r.getTotalLength(); r.style.strokeDasharray = Ln; r.style.strokeDashoffset = Ln; r.getBoundingClientRect(); r.style.transition = 'stroke-dashoffset 5s linear'; r.style.strokeDashoffset = 0; K.later(6500, () => { const g = el.querySelector('.g'); g.style.transition = 'opacity 1.5s'; g.setAttribute('opacity', 1); }); el.querySelectorAll('.df i').forEach((i, k) => K.later(14000 + k * 40, () => i.style.opacity = 1)); });

    /* THE WHOLE POEM · speed and silence */
    const fc = { '01': '#5aa7ff' }, hue = f => `hsl(${(+f * 47) % 360} 55% 62%)`, mxs = Math.max(...L.speed.map(s => s.wps));
    B('The whole poem', 15, () => `<div class="spd">${L.speed.map(s => `<i class="${s.id === L.slowest.id || s.id === L.fastest.id ? 'x' : ''}" style="background:${hue(s.film)}" data-h="${(s.wps / mxs * 100).toFixed(1)}"></i>`).join('')}</div><div class="spl"><span>0:00</span><span>every line of the poem, by how many words a second it is spoken; a colour per chapter</span><span>24:00</span></div>`
      + LX.band([[.3, `All ${L.n_lines} lines, as speed. Half run between two and three words a second.`], [7, 'The voice is not a metronome. Some lines hurry; a few nearly stop.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.spd i').forEach((i, k) => K.later(200 + k * 14, () => i.style.height = i.dataset.h + '%')); });
    const S1 = L.slowest, S2 = L.fastest;
    B('The whole poem', Math.ceil(S1.t1 - S1.t0 + S2.t1 - S2.t0) + 6, () => `<div class="say2" id="s1">${esc(S1.text)}<small>${S1.wps.toFixed(1)} words a second</small></div><div class="say2" id="s2">${esc(S2.text)}<small>${S2.wps.toFixed(1)} words a second</small></div>` + LX.band([[.3, 'The slowest full line, and the fastest.']]),
      el => { LX.runBand(el, K); const a = el.querySelector('#s1'), b = el.querySelector('#s2'); K.later(600, () => { a.style.opacity = 1; LX.poem(K, AU, S1.t0 - .2, S1.t1 + .3); });
        K.later((S1.t1 - S1.t0 + 2.4) * 1000, () => { a.style.opacity = 0; b.style.opacity = 1; LX.poem(K, AU, S2.t0 - .2, S2.t1 + .3); }); });
    B('The whole poem', 12, () => `<div class="sil">${L.silences.map((s, i) => `<i style="left:${(s.t0 / L.dur * 100).toFixed(2)}%;width:${Math.max(.4, s.s / L.dur * 100).toFixed(2)}%"><b>${s.s.toFixed(1)} s</b></i>`).join('')}</div><div class="spl" style="top:420px"><span>0:00</span><span>the longest silences between lines</span><span>24:00</span></div>`
      + LX.band([[.3, `And the silences. The longest runs ${L.silences[0].s.toFixed(1)} seconds, with nothing said.`], [6, 'A film cut to this voice must decide what to show while nobody speaks.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.sil i').forEach((i, k) => K.later(500 + k * 500, () => { i.style.opacity = 1; LX.tick(900, .1, .03); })); });

    /* THE CUTS · Bridge Bar: the Suite's cuts against the spoken lines, with the Suite playing above */
    function bridge(lines, bind, A, B2, top) { const X = t => ((Math.max(A, Math.min(B2, t)) - A) / (B2 - A) * W).toFixed(1);
      return `<div class="br" style="top:${top}px">${lines.map(l => `<div class="ln" style="left:${X(l.t0)}px;width:${(X(l.t1) - X(l.t0)).toFixed(1)}px">${esc(l.text)}</div>`).join('')}
        ${bind.pics.map((p, i) => `<div class="sh" data-i="${i}" style="left:${X(p.sw)}px;width:${(X(p.end) - X(p.sw)).toFixed(1)}px;background-image:url('${esc(p.thumb)}')"></div>`).join('')}
        ${bind.pics.slice(1).map(p => { const inside = lines.some(l => p.sw > l.t0 + .3 && p.sw < l.t1 - .3); return p.sw > A && p.sw < B2 ? `<i class="tk ${inside ? 'in' : ''}" data-at="${p.sw}" style="left:${X(p.sw)}px;opacity:0"></i>` : ''; }).join('')}<i class="ph"></i></div>`; }
    function runBridge(el, A, B2) { const ph = el.querySelector('.br .ph'), tks = [...el.querySelectorAll('.br .tk')], shs = [...el.querySelectorAll('.br .sh')];
      K.raf(() => { const t = voice.currentTime; if (t < A - 1) return true; ph.style.left = ((t - A) / (B2 - A) * W) + 'px';
        tks.forEach(k => { if (t >= +k.dataset.at && k.style.opacity === '0') { k.style.opacity = 1; if (k.classList.contains('in')) LX.tick(300, .25, .05); } });
        return t < B2 + .3; }); }
    const sc = (bind) => ({ audio: AU, pics: bind.pics.map(p => ({ sw: p.sw, video: p.video, in: p.in })) });
    B('The cuts', Math.ceil(SD) + 4, () => `<div class="scbox"><div class="scn"></div></div>` + bridge(ST, L.bind, SA, SB, 530) + LX.band([[.3, 'Above, the Suite\'s film. Below, its cuts against the spoken lines.'], [SD * .4, '<b style="color:var(--red)">Red</b>: a cut that lands in the middle of a line, while a word is still being said.']]),
      el => { LX.runBand(el, K); K.scene(el, sc(L.bind), SA, SB, []); runBridge(el, SA, SB); });
    B('The cuts', 15, () => `<div class="tot"><div class="row"><b>all ${BR.n} cuts <em>· ${BR.inside} inside a spoken line</em></b><div class="bar"><i style="background:var(--red)" data-w="${BR.inside / BR.n * 100}">${BR.inside}</i><i style="background:#6f8cff" data-w="${(BR.n - BR.inside) / BR.n * 100}">${BR.n - BR.inside}</i></div></div>
        <div class="row"><b>set by the music <em>· ${BR.onset_inside} of ${BR.onset} inside a line</em></b><div class="bar"><i style="background:var(--red)" data-w="${BR.onset_inside / BR.n * 100}">${BR.onset_inside}</i><i style="background:#6f8cff" data-w="${(BR.onset - BR.onset_inside) / BR.n * 100}"></i></div></div>
        <div class="row"><b>set by the suite's title cues <em>· ${BR.cue_inside} of ${BR.cue} inside a line</em></b><div class="bar"><i style="background:var(--red)" data-w="${BR.cue_inside / BR.n * 100}">${BR.cue_inside}</i><i style="background:#6f8cff" data-w="${(BR.cue - BR.cue_inside) / BR.n * 100}"></i></div></div></div>`
      + LX.band([[.3, `Across the whole film: ${BR.inside} of ${BR.n} cuts fall inside a spoken line.`], [7.5, 'Cuts set by the music and cuts set by the titles both do. Neither was set by the voice.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.tot i').forEach((i, k) => K.later(600 + k * 300, () => i.style.width = i.dataset.w + '%')); });

    /* PLAYHEAD · the word now, the picture now, what comes next */
    const allw = ST.flatMap(l => l.words.map(w => ({ ...w, line: l }))), P0 = SA + (SD * .25), P1 = Math.min(SB, P0 + 18);
    B('The cuts', Math.ceil(P1 - P0) + 3, () => `<div class="pb"><div class="big">&nbsp;</div><div class="lnx"></div><div class="scbox"><div class="scn"></div></div><div class="prog"><i></i></div><div class="nx"></div></div>` + LX.band([[.3, 'The same moment as an editor feels it: this word, this picture, now. And what is coming.']]),
      el => { LX.runBand(el, K); K.scene(el, sc(L.bind), P0, P1, []); const big = el.querySelector('.big'), lnx = el.querySelector('.lnx'), pr = el.querySelector('.prog i'), nx = el.querySelector('.nx'), pics = L.bind.pics; let lastW = null, lastP = -1;
        K.raf(() => { const t = voice.currentTime; const w = allw.filter(x => x.t0 <= t).pop();
          if (w && w !== lastW) { lastW = w; big.textContent = w.w.replace(/[,.;:!?]/g, ''); lnx.innerHTML = w.line.words.map(x => x === w || (x.t0 === w.t0) ? `<b>${esc(x.w)}</b>` : esc(x.w)).join(' '); }
          let k = 0; pics.forEach((p, i) => { if (p.sw <= t) k = i; }); const p = pics[k]; pr.style.width = Math.min(100, (t - p.sw) / (p.end - p.sw) * 100) + '%';
          if (k !== lastP) { lastP = k; nx.innerHTML = pics.slice(k + 1, k + 4).map((q, j) => `<div style="background-image:url('${esc(q.thumb)}');opacity:${1 - j * .22}"></div><small>next in ${Math.max(0, q.sw - t).toFixed(1)} s · ${esc(q.title)}</small>`).join(''); }
          return t < P1; }); });

    /* PRACTICE · another stanza: spacing and cuts, no words */
    const PR = L.practice, PA = PR[0].t0 - .3, PB = PR[3].t1 + .3, PD = PB - PA;
    B('Practice', 6, () => `<div class="tc"><small>YOUR TURN</small><h1 style="font-size:96px">Another stanza</h1><p>Read the breaths, and the cuts against them.</p></div>`, el => LX.ping());
    B('Practice', Math.ceil(PD) + 3, () => `<div class="scbox" style="top:20px;height:330px;left:400px;width:800px"><div class="scn"></div></div>` + elastic(PR, PA, PB, 372, 62, 22) + bridge(PR, L.practice_bind, PA, PB, 640),
      el => { printed(el); K.later(600, () => spread(el)); K.scene(el, sc(L.practice_bind), PA, PB, []); follow(el, PA, PB, PB); runBridge(el, PA, PB); });

    /* NOW YOU CAN READ */
    B('Now you can read', 14, () => blocks([l0], A0, B0, 160, 360) + LX.band([[.3, 'Now you can read time in a line: spacing is time, a block is a word, a hole is a breath.'], [7.5, 'And a red tick is a cut that did not wait for the voice.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.blocks i').forEach((i, k) => K.later(300 + k * 120, () => i.classList.add('on'))); });
    B('Now you can read', 10, () => `<div class="tc"><small>NEXT · LESSON 5</small><h1>Signs as Questions</h1><p>The lab reads shots for Deleuze's signs. What is a sign, and what counts as reading one?</p></div>`, el => LX.ping());
  }
};
