/* A STORYBOARD CONSOLE, and a film jockey. Show what is true now; one dominant action per state; Stop and Undo always within reach. */
:root{ color-scheme:dark; --bg:#060605; --deck:#0f0e0c; --key:#1a1814; --line:#2b2823; --ink:#efe9dd; --dim:#8f877b; --hi:#e8c070; --red:#e07a5f;

  --perception:#7fb6e6; --affection:#e68fb0; --impulse:#e0533a; --action:#f2a03a; --reflection:#c9b04a; --relation:#7fc28b; --memory:#a98be6; --time:#9aa3ad; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; } html,body{ height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; font:13px var(--mono); }
button,input,textarea{ font:inherit; color:inherit; } [hidden]{ display:none !important; }
svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
#app{ position:fixed; inset:0; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding-top:var(--sa-t); }
#top{ flex:none; display:flex; align-items:center; gap:6px; padding:6px 10px; min-height:46px; }
#where{ flex:1; min-width:0; text-align:left; background:none; border:0; padding:0; cursor:pointer; }
#where b{ display:block; font:600 10px var(--mono); letter-spacing:.2em; color:var(--hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#where span{ display:block; font:500 10.5px var(--mono); color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.k{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 12px; border-radius:19px; border:1px solid var(--line); background:var(--key); font:600 10px var(--mono); letter-spacing:.14em; cursor:pointer; white-space:nowrap; flex:none; }
.k.on{ background:var(--hi); color:#140f06; border-color:var(--hi); } .k:active{ transform:scale(.96); } .k:disabled{ opacity:.35; } .k.ic{ width:38px; padding:0; } .k.rec{ background:var(--red); border-color:var(--red); color:#fff; }
#frame{ flex:none; padding:0 8px; }
#stage{ position:relative; width:min(100%, calc((100dvh - 390px) * 16 / 9)); min-width:min(100%, 300px); margin:0 auto; aspect-ratio:16/9; background:#000 center/cover no-repeat; border-radius:8px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
#stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0; transition:opacity .7s ease; } #stage video.on{ opacity:1; }
#stage video.spk{ z-index:2; -webkit-mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.5) 25%, #000 45%); mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.5) 25%, #000 45%); transition:opacity .5s ease; }
#stage video.spk.split{ left:50%; width:50%; -webkit-mask-image:none; mask-image:none; border-left:2px solid #000; } #stage video.spk.over{ opacity:0 !important; }
/* compare: four candidate pictures playing at once inside the frame */

#stage .cmp video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:1; pointer-events:none; } #stage .cmp .sg{ position:absolute; top:4px; right:4px; min-width:22px; height:20px; font-size:9.5px; z-index:2; }
#stage .cmp small{ position:absolute; left:4px; bottom:3px; z-index:2; font:500 9px var(--mono); color:#fff; text-shadow:0 0 4px #000; }
#stage .cmpbar{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7; display:flex; gap:6px; }
#stage .cmpbar .k{ height:34px; background:#000c; }
#stage .fig{ position:absolute; transform:translate(-50%,-100%); touch-action:none; z-index:3; }

#stage .fig.sel .x{ display:grid; } #stage .fig .x svg{ width:14px; height:14px; stroke-width:2.6; }
@keyframes spr{ from{ background-position:0% 0; } to{ background-position:100% 0; } }

#stage .tc{ position:absolute; left:8px; top:6px; z-index:4; font:600 10px var(--mono); letter-spacing:.14em; color:#fff; text-shadow:0 0 6px #000; pointer-events:none; }

.deckhead .lab{ font:500 10px var(--mono); color:var(--dim); white-space:nowrap; } .deckhead .sp{ flex:1; }
.chip{ flex:none; display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px; border-radius:14px; border:1px solid var(--line); background:var(--key); font:600 9.5px var(--mono); letter-spacing:.1em; cursor:pointer; white-space:nowrap; }
.chip i{ width:8px; height:8px; border-radius:50%; } .chip.on{ border-color:var(--hi); color:var(--hi); } .chip svg.i{ width:15px; height:15px; }
.reel{ flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,1),minmax(0,1fr)); grid-auto-columns:max-content; gap:7px; overflow-x:auto; overflow-y:hidden; padding:2px 10px 6px; scroll-snap-type:x proximity; scrollbar-width:none; } .reel::-webkit-scrollbar{ display:none; }
.tile{ position:relative; height:100%; aspect-ratio:16/11; border-radius:8px; border:1px solid var(--line); background:#000 center/cover no-repeat; cursor:pointer; padding:0; scroll-snap-align:start; overflow:hidden; }
.tile video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
.tile.on{ border-color:var(--hi); box-shadow:0 0 0 2px var(--hi) inset; } .tile small{ position:absolute; left:0; right:0; bottom:0; padding:12px 6px 4px; font:500 9px/1.2 var(--mono); color:#e6dfd2; background:linear-gradient(transparent,#000d); text-align:left; }
.tile .sg{ position:absolute; top:5px; right:5px; min-width:24px; height:24px; font-size:10px; pointer-events:none; }
.tile.fg{ aspect-ratio:3/4; background:#16140f; } .tile.fg .im{ position:absolute; inset:6px 6px 22px; background:center/contain no-repeat; }
.tile .add{ position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; background:var(--hi); color:#140f06; display:grid; place-items:center; } .tile .add svg{ width:14px; height:14px; stroke-width:2.6; }
.layers{ flex:none; display:flex; gap:6px; padding:0 10px 6px; overflow-x:auto; scrollbar-width:none; } .layers::-webkit-scrollbar{ display:none; }
.layer{ flex:none; display:flex; align-items:center; gap:6px; height:40px; padding:0 4px; border-radius:10px; border:1px solid var(--line); background:var(--key); cursor:pointer; }
.layer.on{ border-color:var(--hi); } .layer .im{ width:28px; height:32px; background:center/contain no-repeat; } .layer small{ font:500 9.5px var(--mono); max-width:70px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.layer .del{ width:30px; height:30px; border-radius:8px; border:0; background:#2a1612; color:var(--red); display:grid; place-items:center; cursor:pointer; padding:0; } .layer .del svg{ width:16px; height:16px; }
.pad{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(0,74px); align-content:center; gap:7px; padding:4px 10px 8px; }
.pad button{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px solid var(--line); background:var(--key); font:600 9px var(--mono); letter-spacing:.1em; cursor:pointer; min-height:56px; padding:4px; }
.pad button:active{ background:#26221b; } .pad button.hot{ border-color:var(--hi); color:var(--hi); } .pad button.warn{ color:var(--red); } .pad button:disabled{ opacity:.3; } .pad svg.i{ width:22px; height:22px; }

.answers{ flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,2),minmax(0,1fr)); grid-auto-columns:minmax(200px,62%); gap:7px; overflow-x:auto; overflow-y:hidden; padding:0 10px 6px; scrollbar-width:none; } .answers::-webkit-scrollbar{ display:none; }
.ans{ position:relative; text-align:left; border-radius:10px; border:1px solid var(--line); background:var(--key); padding:8px 10px 8px 40px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; justify-content:center; gap:4px; }
.ans.on{ border-color:var(--hi); background:#1f1a10; } .ans q{ font:italic 300 15px/1.25 var(--serif); color:var(--hi); quotes:none; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; } .ans small{ font:500 9px var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ans .pl{ position:absolute; left:8px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; } .ans .pl svg{ width:12px; height:12px; }
.ans.none q{ color:var(--dim); font-style:normal; font-family:var(--mono); font-size:11px; letter-spacing:.1em; }
/* the shot's timeline: how the sound enters, lane by lane: the picture, the call, the answer; a playhead walks through the states */

.tl .lane{ position:relative; height:20px; margin:3px 0; } .tl .lane b{ position:absolute; left:-54px; top:3px; font:600 8.5px var(--mono); letter-spacing:.14em; color:var(--dim); }
.tl .blk{ position:absolute; top:0; bottom:0; border-radius:4px; overflow:hidden; cursor:pointer; border:1px solid transparent; } .tl .blk canvas{ position:absolute; inset:0; width:100%; height:100%; }
.tl .blk.pic{ background:#000 center/cover no-repeat; opacity:.8; } .tl .blk.call{ background:#efe9dd14; } .tl .blk.ansb{ background:#e8c07014; } .tl .blk.now{ border-color:currentColor; }
.tl .blk.call.now{ color:var(--ink); } .tl .blk.ansb.now{ color:var(--hi); } .tl .blk .lbl{ position:absolute; left:5px; top:3px; font:500 8.5px var(--mono); color:#cfc7b8; white-space:nowrap; text-shadow:0 0 3px #000; pointer-events:none; }
.tl .blk .hd{ position:absolute; top:0; bottom:0; width:12px; cursor:ew-resize; z-index:2; } .tl .blk .hd.l{ left:0; background:linear-gradient(90deg,#ffffff40,transparent); } .tl .blk .hd.r{ right:0; background:linear-gradient(270deg,#ffffff40,transparent); }
.tl.tune .blk.ansb, .tl.tune .blk.pic{ cursor:grab; touch-action:none; } .tl .blk.drag{ outline:1px dashed var(--hi); }
.tl .ph{ position:absolute; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 6px #fff8; pointer-events:none; display:none; } .tl .ruler{ position:relative; height:10px; } .tl .ruler i{ position:absolute; top:0; font:500 7.5px var(--mono); color:#6b655d; font-style:normal; }
.tl .state{ position:absolute; right:6px; top:4px; font:600 8.5px var(--mono); letter-spacing:.14em; color:var(--hi); }
.ans canvas{ display:block; width:100%; height:22px; margin-bottom:2px; } .ans .tags{ font:600 8.5px var(--mono); letter-spacing:.1em; color:#b8ae9e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.filters{ flex:none; display:flex; gap:5px; align-items:center; padding:0 10px 6px; overflow-x:auto; scrollbar-width:none; } .filters::-webkit-scrollbar{ display:none; } .filters .sep{ width:1px; height:18px; background:var(--line); flex:none; }
#shots{ flex:none; display:flex; gap:5px; overflow-x:auto; padding:6px 10px; scrollbar-width:none; border-top:1px solid var(--line); } #shots::-webkit-scrollbar{ display:none; }

#dial button.on{ background:var(--key); color:var(--hi); }

.over .top{ display:flex; gap:6px; align-items:center; padding:8px 10px; } .over .top .sp{ flex:1; } .over .top b{ font:600 11px var(--mono); letter-spacing:.2em; }

_track.webp","w":87,"h":179,"sw":164,"sh":200,"fps":6,"desc":"dancer","title":"Powers Music School Presents: Musical Story Hour 02/28/09","year":2009},"805":{"img":"seg/e5e0b33d-1efb-5c80-8fe9-2e035d87e6b1/3.webp","sprite":"seg/e5e0b33d-1efb-5c80-8fe9-2e035d87e6b1/3_track.webp","w":145,"h":173,"sw":171,"sh":180,"fps":6,"desc":"cartoon character","title":"Powers Music School Presents: Musical Story Hour 02/28/09","year":2009}},"signs":{"1":{"s":"So","name":"Solid perception","type":"Perception-image","fam":"perception","def":"The first sign of full composition: the film organises every image around one central, privileged body. The camera oscillates between seeing as that character (point of view) and seeing that character, producing a cohesive perceiving-and-pe"},"2":{"s":"Lq","name":"Liquid perception","type":"Perception-image","fam":"perception","def":"The secondary sign of composition: a mobile camera and flowing montage pass from environment to environment and character to character, so centres form only for a moment before the film flows on to the next."},"3":{"s":"Ga","name":"Gaseous perception","type":"Perception-image","fam":"perception","def":"The genetic sign of perception: an acentred, non-human perception in which all images interact without hierarchy, achieved through slow and fast motion, superimposition, fragmentation, micro-shooting and manipulated film; any human figure i"},"4":{"s":"Ic","name":"Icon","type":"Affection-image","fam":"affection","def":"The first sign of the affection-image: the close-up of the face, which expresses unfilmable inner intensities either as an immobile quality (a face fixed in wonder on an object) or as a mobile power (features passing from one state to the n"},"5":{"s":"Dv","name":"Dividual","type":"Affection-image","fam":"affection","def":"The secondary sign of the affection-image: affect expressed by a mass – crowd, pack, multitude – where individuals are de-individualised and the group is individualised, uniting a collective reflection with each person's emotion."},"6":{"s":"As","name":"Any-space-whatever","type":"Affection-image","fam":"affection","def":"The genetic sign of the affection-image: an empty, disconnected or amorphous space – fog, rain, shadow, ruin, heat haze, a pure coloured or blank background – that expresses affect directly, without a face, prior to or after the human."},"7":{"s":"Sy","name":"Symptom","type":"Impulse-image","fam":"impulse","def":"The first sign of the impulse-image: a character overwhelmed by a primal impulse too strong for them (hunger, sex, greed, cruelty), acting as a 'human animal' through whom the forces of an originary world pass."},"8":{"s":"Fe","name":"Fetish","type":"Impulse-image","fam":"impulse","def":"The secondary sign of the impulse-image: a partial or special object that stores the primal force of the originary world (charm, relic, scrap, shoe), holy or evil – relic or vult – awaiting the conditions to discharge it into a body."},"9":{"s":"Or","name":"Originary world","type":"Impulse-image","fam":"impulse","def":"The genetic sign of the impulse-image: a primal, archetypal background (desert, forest, swamp, the house) that rumbles beneath a determined milieu, outside history, under a curse of cyclical time tending toward entropy and ruin."},"10":{"s":"Il","name":"Index of lack","type":"Action-image (small form, action → situation)","fam":"action","def":"The first sign of the small-form action-image: the situation begins as an ellipsis, a hidden gap, which a character's actions progressively explore and then unequivocally reveal – and the reveal reorients what they do next."},"11":{"s":"Ie","name":"Index of equivocity","type":"Action-image (small form, action → situation)","fam":"action","def":"The secondary sign of the small-form action-image: an action discloses a determined situation that nevertheless stays double – a slight difference relates one act to two distant situations, 'this and that', an impossible choice."},"12":{"s":"Ve","name":"Vector","type":"Action-image (small form, action → situation)","fam":"action","def":"The genetic sign of the small form: many characters each reveal a partial situation, and together these ellipses form a broken, unpredictable but necessary line that maps one heterogeneous yet homogeneous world."},"13":{"s":"Mi","name":"Milieu","type":"Action-image (large form, situation → action)","fam":"action","def":"The first sign of the large form: a fully determined geographical, historical and social situation (the Encompasser), laid out through establishing and extreme wide shots, whose characters' actions merely exemplify it."},"14":{"s":"Bi","name":"Binomial","type":"Action-image (large form, situation → action)","fam":"action","def":"The second sign of the large form: the milieu splits into two opposed lines of force embodied by characters, and the film proceeds through duels (violent, romantic, political) converging on a final decisive one."},"15":{"s":"Im","name":"Imprint","type":"Action-image (large form, situation → action)","fam":"action","def":"The genetic sign of the large form: a complex milieu is internalised by a character, accumulating as pressure until it explodes into action, and made visible through an emotional object that links the character to the situation."},"16":{"s":"Pl","name":"Plastic figure","type":"Attraction-image (first reflection-image)","fam":"reflection","def":"Deamer's first sign of composition of the attraction-image: a small-form film is transformed by the large form, so an on-screen action, object or episode works as metaphor, metonymy or synecdoche for an implied situation that stays in ellip"},"17":{"s":"Th","name":"Theatrical figure","type":"Attraction-image (first reflection-image)","fam":"reflection","def":"Deamer's second sign of composition of the attraction-image: a large-form film is transformed by the small form, so the real situation is expressed through a sustained fictitious action (allegory, myth, parody) that prefigures and keeps def"},"18":{"s":"Ma","name":"Mise en abyme","type":"Attraction-image (first reflection-image)","fam":"reflection","def":"Deamer's own name for the genetic sign Deleuze leaves unnamed: plastic and theatrical figures nest inside each other so we cannot tell which form contains which, an image within an image within an image."},"19":{"s":"Su","name":"Figure of the sublime","type":"Inversion-image (second reflection-image)","fam":"reflection","def":"The first sign of composition of the inversion-image (SAS becomes sAs): a visionary character dreams up an action far larger than the situation requires, so the over-reaction exposes the situation, and the plan, as futile."},"20":{"s":"En","name":"Figure of enfeeblement","type":"Inversion-image (second reflection-image)","fam":"reflection","def":"The second sign of composition of the inversion-image (ASA becomes aSa): weak, aimless characters whose futile acts, shrunk to specks against the horizon, reveal an immense and indifferent world."},"21":{"s":"Qu","name":"Quotidian","type":"Inversion-image (second reflection-image)","fam":"reflection","def":"Deamer's name for the unnamed genetic sign of inversion, where sublime and futile become 'the same thing': everyday situations and actions at once trivial and immense, the universe indifferent yet the only ground of action."},"22":{"s":"Ll","name":"Limit of the large form action-image","type":"Discourse-image (third reflection-image)","fam":"reflection","def":"The first sign of composition of the discourse-image: the given milieu hides a question, and the character has to draw out that problem before any action can be a considered response rather than an explosive reaction."},"23":{"s":"Ls","name":"Limit of the small form action-image","type":"discourse-image (third reflection-image)","fam":"reflection","def":"The small form (action reveals situation) reflects on itself until action can no longer disclose the situation: parallel, heterogeneous lines of action connect only as a 'special homogeneity', leaving the question as a sustained, unanswered"},"24":{"s":"Xl","name":"Limit of the action-image (extreme limit)","type":"discourse-image (third reflection-image)","fam":"reflection","def":"Where the limits of the large and small forms converge and we can no longer tell which form is originary: action curves back toward the any-space-whatever and the film is permeated, from start to end, by problems - the universe as a cipher "},"25":{"s":"Rd","name":"Rich dream","type":"dream-image (third mental-image)","fam":"memory","def":"The explicitly signalled dream: entry and exit are marked, and the dream is built from overloaded technical means - dissolves, superimpositions, deframings, special effects - so the dream world is radically distinct from the real, yet its a"},"26":{"s":"Rs","name":"Restrained dream","type":"dream-image (third mental-image)","fam":"memory","def":"The dream entered by a straight cut or invisible transition, resembling everyday reality but subtly impossible - an 'unhinging' between concrete objects - so that dream and real become ambiguous and the film's task becomes telling them apar"},"27":{"s":"Mw","name":"Movement of world","type":"dream-image (third mental-image)","fam":"memory","def":"The implied dream with no entrance and no exit: the world itself closes around everything including the dreamer, and a movement of world (song, dance, impossible events) supplants the faltering movement of the character, so dream and real a"},"28":{"s":"Sd","name":"Strong destiny","type":"recollection-image (second mental-image)","fam":"memory","def":"The marked flashback as closed circuit of psychological causality: a character pauses, a slow dissolve or shimmer leads to a signalled past, and that past returns through affect into action, determining the character's inescapable future."},"29":{"s":"Wd","name":"Weak destiny","type":"recollection-image (second mental-image)","fam":"memory","def":"Flashbacks that no longer determine the future but saturate present affects: ambiguous, incomplete, unmarked, perhaps belonging to several characters, the past is a clue to an ellipsis in the present that must be reconstructed before any fu"},"30":{"s":"Fp","name":"Forking paths","type":"recollection-image (second mental-image)","fam":"memory","def":"Memory as fragmentation of linearity: flashbacks within flashbacks and circuits that fork within themselves 'like a split hair', exploring the past for itself as an inexplicable secret, so that psychological causality is exposed as a ruse."},"31":{"s":"Mk","name":"Mark","type":"relation-image (first mental-image)","fam":"relation","def":"A habitual series of images, each interpretable by the others; perceived objects that repeat at least three times until the series forces itself into consciousness and becomes the chain of thought that constitutes the narration."},"32":{"s":"Dm","name":"Demark","type":"relation-image (first mental-image)","fam":"relation","def":"An aberration in an established habitual series: one term leaps outside the web or contradicts it, producing a shock that reorients the chain of thought and becomes the new question of the narration."},"33":{"s":"Sb","name":"Symbol","type":"relation-image (first mental-image)","fam":"relation","def":"An abstract relation carried by a concrete object: demarks extracted from different series coalesce in one thing, which becomes a node bearing various relations (or variations of one) and so expresses an idea, belief or concept."},"34a":{"s":"Op","name":"Opsign","type":"Opsign / pure actual optical situation (zeroness of the time-image, optical side)","fam":"time","def":"The actual visual image cut off from its motor extension: what is seen no longer passes into feeling or action, but stays on screen as a pure, de-differenciated optical situation that the look can only register. Together with its sound twin"},"35":{"s":"Mf","name":"Mirrors face to face","type":"Hyalosign / crystal-image","fam":"time","def":"The first crystal-image: one actual image splits into many perspectives through mirrors, reflections and doubles, so the body and its setting show up in fragments, duplicates and distortions, and you can no longer tell the actual from the v"},"36":{"s":"Lo","name":"Limpid and opaque","type":"Hyalosign / crystal-image","fam":"time","def":"The second crystal-image: two sides of one image keep swapping places, so that as one becomes clear and visible the other goes dark, the way an actor turns into a role and back. The present is always passing into an opaque past."},"37":{"s":"Se","name":"Seed and environment","type":"Hyalosign / crystal-image","fam":"time","def":"The genetic crystal-image, oriented toward the future: a small actual object or moment contains a whole setting that has not appeared yet, or a large dispersed setting points back to a seed that can't be pinned down."},"38":{"s":"Pp","name":"Peaks of the present","type":"Chronosign / time-image narration (order of time)","fam":"time","def":"The first chronosign: narration is laid out as several presents happening at once, each possible alone but not together (incompossible), so the story is no longer a line of successive actions."},"39":{"s":"Sp","name":"Sheets of the past","type":"Chronosign / time-image narration (order of time)","fam":"time","def":"The second chronosign: the film moves around inside a pure past made of coexisting layers, jumping between them out of chronological order, with echoes and resonance taking the place of cause and effect."},"40":{"s":"Pf","name":"Powers of the false","type":"Chronosign / time-image narration (series of time)","fam":"time","def":"The genetic chronosign, oriented toward the future: narration stops claiming to be true and works through series, repeating things with differences and letting fake and real bleed together, so truth has to be made rather than found."},"41":{"s":"Ba","name":"Bodies of attitude","type":"Noosign / time-image narrative (the body)","fam":"time","def":"The first noosign: an everyday body shown in its postures, tiredness and habits instead of in action or imitation. The body comes before the plot and breaks up into many incompatible ways of being present."},"42":{"s":"Bg","name":"Bodies of gest","type":"Noosign / time-image narrative (the body)","fam":"time","def":"The second noosign: attitudes are tied together and theatricalised into a ceremony or social gesture (Brecht's gest), a collective statement of the body that can end with the visible body disappearing."},"43":{"s":"Br","name":"Cinema of the brain","type":"Noosign / time-image narrative (the world)","fam":"time","def":"The genetic noosign: thought appears in the mise-en-scene itself (sets, light, colour, sound) rather than in a character, and the world on screen becomes a map of the mind, a brain-screen."},"44":{"s":"Le","name":"Lectosigns","type":"Lectosigns / the readable image (infinite of the time-image)","fam":"time","def":"The limit of all time-images: once images stop linking up naturally, frame, shot, montage, colour and sound have to be read and relinked by the viewer, and the film only exists through interpretation."},"34b":{"s":"Sn","name":"Sonsign","type":"Sonsign / pure actual sound situation (zeroness of the time-image, sound side)","fam":"time","def":"The actual sound image cut off from its motor extension: a sound that is itself the situation rather than score, dialogue or cue for action. It is heard and holds the scene, while neither the listener nor the image converts it into a respon"}}}</script>

  /* ---- the board. A shot: its words, its picture, figures only if you add them, its call (the memo's voice, your own recorded voice, or read aloud) and its answer (an archival voice) */

  let WM = null, WV = null, PV = null, FV = null, FIDX = null, WIDX = null; const DIM = 512;

  }
  const sign = n => n && D.signs[n] ? D.signs[n] : null, signOf = ref => { const P = pic(ref); return P && P.sg ? sign(P.sg[0]) : null; };
  const sgTile = S => S ? `<span class="sg" style="color:${FCOL(S.fam)}">${esc(S.s)}</span>` : '';
  const figURL = f => D.figs[f] ? D.figs[f].img : '';
  const bgOf = (el, u) => { el.style.backgroundImage = u ? `url("${u}")` : ''; };
  function figImg(el, f, animate) {

    const sp = new Image(); sp.onload = () => { const n = Math.round(sp.naturalWidth / (sp.naturalHeight * F.sw / F.sh)); if (n < 2) { setStill(); return; }
      el.style.backgroundImage = `url("${sp.src}")`; el.style.backgroundSize = n * 100 + '% 100%'; el.style.aspectRatio = F.sw + ' / ' + F.sh; el.style.animation = `spr ${(n / (F.fps || 6)).toFixed(2)}s steps(${n - 1}, jump-none) infinite alternate`; };
    sp.onerror = () => { if (!sp.src.endsWith('.png')) sp.src = png(F.sprite); else setStill(); }; sp.src = F.sprite;
  }
  function loadWM() {
    if (loadWM.p) return loadWM.p;
    loadWM.p = Promise.all([fetch('norse/wordmap.json?v=de02f0b9f4').then(r => r.json()), fetch('norse/wordmap.bin?v=de02f0b9f4').then(r => r.arrayBuffer())]).then(([m, b]) => {
      WM = m; const a = new Int8Array(b), nW = m.words.length, nP = m.pics.length, nF = m.figs.length; WV = a.subarray(0, nW * DIM); PV = a.subarray(nW * DIM, (nW + nP) * DIM); FV = a.subarray((nW + nP) * DIM, (nW + nP + nF) * DIM);
      WIDX = new Map(m.words.map((w, i) => [w, i])); FIDX = m.figs; if (board) refresh(); }).catch(() => { loadWM.p = null; });

  const STOP = new Set('a an the and or but of to in on at by for with from off onto near around through across behind front toward towards above below beside as is are was were be been it its this that these those i you he she we they me him her us them my your his our their not no so if then than there here what who which when where how all any some one into out up down over under very can will just do did does have has had am would should could may might must oh yeah okay well also about like know think get got really thing things kind sort lot little much many more most way even still back right'.split(' '));
  const norm = w => w.toLowerCase().replace(/[^a-z]/g, '');
  const variants = w => [w, w.replace(/ies$/, 'y'), w.replace(/es$/, ''), w.replace(/s$/, ''), w.replace(/ing$/, ''), w.replace(/ing$/, 'e'), w.replace(/ed$/, ''), w.replace(/ed$/, 'e'), w.replace(/e$/, '') + 'ing', w + 'ing', w + 's', w.replace(/y$/, 'ies'), w.replace(/s$/, 'ing')];
  const stem = w => w.length > 4 ? w.replace(/(ing|ed|es|s)$/, '') : w;
  const EXACT = new Map(); let exactOn = false;
  function read(text) {

    let n = 0; for (let d = 0; d < DIM; d++) n += q[d] * q[d]; n = Math.sqrt(n) || 1; for (let d = 0; d < DIM; d++) q[d] /= n;

  const ansOf = u => ({ v: u.v, t0: u.t0, t1: u.t1, s: u.s, ti: u.ti, y: u.y, e: u.e, vc: u.vc, wy: u.wy, un: u.un, ws: u.ws });
  function answersFor(text, k = 8, filt = VF) {
    if (!VO || !text) return []; const r = read(text); if (!r.gi.length) return [];
    const q = new Float32Array(VD); r.gi.forEach(i => { for (let d = 0; d < VD; d++) q[d] += VW[i * VD + d]; }); let n = 0; for (let d = 0; d < VD; d++) n += q[d] * q[d]; n = Math.sqrt(n) * 127 || 1;
    const st_ = new Set(r.got.map(stem)), N = VO.n, s = new Float32Array(N).fill(-9);
    for (let u = 0; u < N; u++) { const U = VO.utts[u]; if ((filt.vc && U.vc !== filt.vc) || (filt.wy && U.wy !== filt.wy) || (filt.un && U.un !== filt.un)) continue;
      let a = 0; const o = u * VD; for (let d = 0; d < VD; d++) a += VU[o + d] * q[d]; let ov = 0; VUW[u].forEach(w => { if (st_.has(w)) ov++; }); s[u] = a / n + .4 * ov / Math.max(1, st_.size); }
    return [...s.keys()].filter(u => s[u] > -9).sort((a, b) => s[b] - s[a]).slice(0, k).map(u => ansOf(VO.utts[u]));

  function autoAnswer(p) { if (!p || !p.ansAuto || !p.text || !VO) return; const a = answersFor(p.text, 1, {})[0]; if (a) p.ans = a; }

  /* ---- sound, drawn: a waveform from an envelope (one base-36 character a step); a line read aloud has no recording, so it is drawn as dashes of its estimated length */
  const D36 = '0123456789abcdefghijklmnopqrstuvwxyz';
  function drawWave(cv, env, color, dashed) {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1), w = Math.max(1, r.width * dpr), h = Math.max(1, r.height * dpr); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.clearRect(0, 0, w, h); g.fillStyle = color;
    if (!env || dashed) { g.globalAlpha = .55; for (let x = 0; x < w; x += 7 * dpr) g.fillRect(x, h / 2 - dpr, 4 * dpr, 2 * dpr); return; }

  const LAYOUTS = ['one', 'pair', 'mondrian', 'grid'], ANSMODES = [['set', 'ANSWERS AS SET'], ['over', 'VOICE OVER'], ['speaker', 'SPEAKERS'], ['off', 'NO ANSWERS']], PACES = [[.6, 'BRISK'], [1, 'EVEN'], [1.8, 'SLOW']], ORDERS = [['written', 'AS WRITTEN'], ['chain', 'SIGN CHAIN'], ['drift', 'DRIFT']];
  function liveSeq() {
    const all = flat(); if (LV.order === 'written') return all;

    const r = all.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r;
  }
  const lwait = ms => new Promise(ok => { let left = ms, t0 = performance.now(); const tick = () => { if (!LV.on) return ok(); if (LV.paused) { t0 = performance.now(); return setTimeout(tick, 100); } left -= performance.now() - t0; t0 = performance.now(); if (left <= 0) ok(); else setTimeout(tick, Math.min(100, left)); }; tick(); });
  function lnext() { [1, 2].forEach(n => { const q = LV.seq[LV.k + n], el = $('#lnx' + n), P = q ? pic(board[q[0]].panels[q[1]].g) : null; bgOf(el, P ? P.img : ''); el.querySelector('small').textContent = q ? `${n === 1 ? 'NEXT' : 'AFTER'} · ${q[0] + 1}.${q[1] + 1}` : ''; }); }

  async function liveRun() {

  }
  (function ltick() { if (LV.on && LV.tl && LV.ph) { if (LV.paused) LV.ph0 = performance.now() - (LV.pAcc || 0) * 1000; else LV.pAcc = (performance.now() - LV.ph0) / 1000; LV.tl.set(LV.ph, LV.pAcc); } requestAnimationFrame(ltick); })();
  function liveStart() {

  /* ---- the board overlay and export */
  function openBoard() {

      b.innerHTML = `${sgTile(S)}<i>${ci + 1}.${pi + 1}</i><span class="bar" style="background:${S ? FCOL(S.fam) : 'transparent'}"></span>`; b.title = p.text || ''; b.onclick = () => { $('#board').hidden = true; go([ci, pi]); }; return b; };

      const page = document.createElement('div'); page.className = 'page'; const durs = c.panels.map(shotDur), T = durs.reduce((a, b) => a + b, 0), px = 15;

        col.innerHTML = `<i>${ci + 1}.${pi + 1} · ${durs[pi].toFixed(1)}s</i><div class="lnP"></div><canvas></canvas><canvas></canvas>`; bgOf(col.querySelector('.lnP'), Pc ? Pc.img : ''); col.querySelector('.lnP').onclick = () => { $('#board').hidden = true; go([ci, pi]); };
        row.append(col); requestAnimationFrame(() => { const [cc, ac] = col.querySelectorAll('canvas'); drawWave(cc, callEnv(p), '#efe9dd', !callEnv(p)); if (p.ans) drawWave(ac, p.ans.e, WAYCOL[p.ans.wy] || '#e8c070'); }); });
      pages.push(page); });
    else FAMS.forEach(f => { const ix = flat().filter(([ci, pi]) => (signOf(board[ci].panels[pi].g) || {}).fam === f); if (!ix.length) return; const page = document.createElement('div'); page.className = 'page';
      page.innerHTML = `<div class="c" style="color:${FCOL(f)}">${ix.length} SHOT${ix.length === 1 ? '' : 'S'} IN THE FILM</div><h3>${f[0].toUpperCase() + f.slice(1)}-images</h3><div class="chain"><i style="background:${FCOL(f)}"></i></div><div class="g"></div>`;

  $('#vCh').onclick = () => { boardView = 'ch'; openBoard(); }; $('#vTl').onclick = () => { boardView = 'tl'; openBoard(); }; $('#vSg').onclick = () => { boardView = 'sg'; openBoard(); };
  $('#bClose').onclick = () => { $('#board').hidden = true; }; $('#where').onclick = openBoard;
  $('#bMove').onclick = () => { moving = !moving; vkey = null; save(); $('#moveL').textContent = moving ? 'MOVING' : 'STILLS'; drawFrame(); };
  function printBoard() {

      b.querySelector('b').textContent = s.t; b.querySelector('p').textContent = s.p; b.querySelector('.row span').textContent = `${ci_ + 1} OF ${COACH.length}${s.wait ? ' · TRY IT' : ''}`; $('#cNext').textContent = ci_ === COACH.length - 1 ? 'DONE' : s.wait ? 'SKIP STEP' : 'NEXT';
      const bh = b.offsetHeight || 150, below = r.bottom + 10 + bh < innerHeight; b.style.top = (below ? r.bottom + 10 : Math.max(8, r.top - 10 - bh)) + 'px'; });

  function coachDone(what) { if (ci_ >= 0 && COACH[ci_] && COACH[ci_].wait === what) { ci_++; setTimeout(coachShow, 350); } }
  $('#cNext').onclick = () => { ci_++; coachShow(); }; $('#cSkip').onclick = () => { ci_ = -1; $('#coach').hidden = true; };

  $('#sMemo').onclick = () => begin(fromMemo()); $('#sArm').onclick = () => begin(armature()); $('#sBlank').onclick = () => begin([{ title: 'Chapter 1', ch: null, panels: [blank()] }]); $('#sResume').onclick = () => begin(null);
