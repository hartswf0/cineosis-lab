<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syzygy Spine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;--panel:#0f0e0d;--ink:#ece6da;--dim:#b3ac9f;--faint:#7f796f;--rule:#23211e;--rule2:#3a3833;
  --red:#ff3b2f;--words:#b9cfa0;--ts:#d8c08a;--span:#e7a37c;--board:#5e5a52;
  --serif:"Fraunces",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:400 12px/1.4 var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{height:100%;max-width:720px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;position:relative}

/* status */
.status{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 14px 6px}
.poem{font-weight:600;font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:2px;height:18px}
.bars i{width:4px;background:var(--rule2);border-radius:1px}.bars i.on{background:var(--ink)}

/* strip */
.map{padding:0 14px 6px}
.sw{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize}
#strip{display:block;width:100%;height:44px;border-radius:2px}
.poems{position:relative;height:14px;overflow:hidden}
.poems button{position:absolute;top:0;font-size:9.5px;color:var(--faint);padding:0 2px;border-left:1px solid var(--rule2);line-height:13px;white-space:nowrap}
.poems button.cur{color:var(--ink)}

/* stage */
.stage{position:relative;margin:0 14px;border-radius:3px;overflow:hidden;background:#000;min-height:0;container-type:size}
.stage .img{position:absolute;left:50%;top:50%;width:max(100cqw,177.78cqh);aspect-ratio:16/9;transform:translate(-50%,-50%);background-color:#000}
.stage .shade{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.stage .arr{position:absolute;top:0;bottom:0;width:20%;display:flex;align-items:center;font-size:26px;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000;z-index:2}
.stage .arr.l{left:0;justify-content:flex-start;padding-left:8px}.stage .arr.r{right:0;justify-content:flex-end;padding-right:8px}
.stage .arr:disabled{visibility:hidden}
.sub{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.words{font-family:var(--serif);font-size:clamp(20px,5.4vw,30px);line-height:1.15;text-wrap:balance;margin:0;text-shadow:0 1px 6px #000}
.reads{display:flex;gap:3px;align-items:center}
.warn{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.8;margin-left:6px}
.pip{position:absolute;right:10px;top:10px;width:24%;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.35);border-radius:2px;z-index:2;background-color:#000}
.pip span{position:absolute;left:3px;bottom:1px;font-size:8.5px;text-shadow:0 1px 2px #000}
.vars{position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:2}
.vars button{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;opacity:.6}
.vars button[aria-pressed="true"]{background:#fff;opacity:1}
.info{position:absolute;inset:0;z-index:4;background:rgba(5,5,5,.92);padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.info .p{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.35;margin:0}
.info .m{font-size:11px;color:var(--dim)}
.info .near{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.info .near div{aspect-ratio:16/9;border-radius:2px;position:relative}
.info .near span{position:absolute;left:3px;bottom:1px;right:3px;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}

/* played here */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px 14px 0}
.tile{position:relative;aspect-ratio:16/10;border-radius:2px;overflow:hidden;background:var(--panel)}
.tile .s,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .n{position:absolute;left:3px;bottom:1px;font-size:8.5px;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.tile .mz{position:absolute;right:3px;bottom:1px;font-size:8.5px;color:var(--dim);text-shadow:0 1px 2px #000}
.tile .tr{position:absolute;right:2px;top:2px}
.tile .pl{position:absolute;left:3px;top:1px;font-size:10px;text-shadow:0 1px 2px #000}
.tile.hit::after{content:'';position:absolute;inset:0;border:2px solid var(--words);border-radius:2px;pointer-events:none}
.tile.empty{opacity:.35}
.sg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:14px;padding:0 3px;border-radius:2px;font:600 9px/1 var(--serif);color:#16130f}
.sg.hit{box-shadow:0 0 0 1.5px var(--words)}

/* controls */
.ctl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.ctl button{border:1px solid var(--rule2);border-radius:3px;padding:6px 10px;font-size:11px;color:var(--dim);white-space:nowrap}
.ctl button[aria-pressed="true"]{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
.ctl .st{font-size:11px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl .st b{color:var(--ink)}

/* sheets over the stage */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--rule2);border-radius:8px 8px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 10px;border:1px solid var(--rule2);border-radius:14px;color:var(--dim)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:#1a1917}
.sheet .row{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.sheet .row .sp{flex:1}
.sheet .row button{border:1px solid var(--rule2);border-radius:3px;padding:5px 10px}
.grid{position:absolute;inset:0;z-index:3;background:var(--bg);overflow:auto;padding:8px}
.grid table{border-collapse:separate;border-spacing:2px}
.grid th{font:500 9px var(--mono);color:var(--faint);text-align:right;padding-right:6px;white-space:nowrap;text-transform:uppercase;position:sticky;left:0;background:var(--bg)}
.grid td{width:10px;min-width:10px;height:16px;border-radius:1px;background:var(--panel);cursor:pointer;padding:0}
.grid td.on{background:#4c4841}.grid td.agree{background:var(--words)}.grid td.sel{outline:1.5px solid var(--red)}
</style>
</head><body>

<div class="app">
  <header class="status" aria-live="polite">
    <div style="min-width:0"><div class="poem" id="sPoem">loading…</div><div class="clk" id="sClk"></div></div>
    <span id="sBadge"></span>
    <div class="bars" id="sBars"></div>
  </header>

  <section class="map">
    <div class="sw" id="sw"><canvas id="strip" aria-label="Her 24 minutes. Drag to move. Colour: how each moment was placed. Height: how many layers agree."></canvas></div>
    <div class="poems" id="poems"></div>
  </section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <section class="tiles" id="tiles" aria-label="Played here"></section>

  <nav class="ctl">
    <button id="bPoem" aria-pressed="false" title="zoom the strip to this poem (Z)">Poem</button>
    <button id="bGrid" aria-pressed="false" title="this poem's vertebrae × layers (G)">Grid</button>
    <span class="st" id="st"></span>
    <button id="bInfo" aria-pressed="false" title="what was asked (I)">Asked</button>
    <button id="bFilter" aria-pressed="false" title="filter (F)">Filter</button>
  </nav>

  <section class="sheet" id="sheet" hidden aria-label="Filter">
    <div class="chips" id="chips"></div>
    <div class="row"><span id="fN"></span><span class="sp"></span><button id="fClear">clear</button><button id="fDone">done</button></div>
  </section>
</div>

<script>
(function(){
const DOMC={perception:'#e9d9a8',affect:'#f0b9a4',action:'#e7a37c',reflection:'#b9cfa0',mental:'#a9c9c9',break:'#d9d3c7',time:'#b8b3d8',read:'#d9b8d2'};
const PC={words:'#b9cfa0',ts:'#d8c08a',span:'#e7a37c',board:'#5e5a52'};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=t=>{const m=Math.floor(t/60),s=Math.floor(t-m*60);return m+':'+(s<10?'0':'')+s};
let D,V,dur,sel=0,poemZoom=false,grid=false,info=false,varSel=0;
const F={place:new Set(),img:false,cut:false,metz:false};
const active=()=>F.place.size||F.img||F.cut||F.metz;
const playable=new Map();

fetch('view.json').then(r=>r.json()).then(d=>{
  D=d;V=d.v;dur=Math.max(...d.films.map(f=>f[3]));
  const h=(location.hash||'').match(/^#v(\d+)$/);sel=h?Math.max(0,V.findIndex(v=>v.v==+h[1])):V.findIndex(v=>v.id==='SH001');
  build();wire();render();
}).catch(e=>{$('#sPoem').textContent='view.json did not load ('+e.message+').';});

const agreeN=v=>v.k!=='spine'?0:(v.ag[0]?1:0)+v.ag[1].length+(v.ag[2]&&v.ag[2].length?1:0);
function match(v){if(F.place.size&&!F.place.has(v.p))return false;if(F.img&&!v.ag[0])return false;if(F.cut&&!v.ag[1].length)return false;if(F.metz&&!(v.ag[2]&&v.ag[2].length))return false;return true;}
const film=v=>D.films.find(f=>f[0]===v.f)||D.films[0];
function sprite(set,k){const s=Math.floor(k/100),c=k%100;return `background-image:url(sprites/${set}${s}.jpg);background-size:1000% 1000%;background-position:${(c%10)/9*100}% ${Math.floor(c/10)/9*100}%`;}
function sign(n,asks){const s=D.signs[n];if(!s)return '';const hit=asks&&asks.includes(n);return `<span class="sg${hit?' hit':''}" style="background:${DOMC[s[2]]||'#ccc'}" title="${esc(s[1])}${hit?' (asked)':''}">${esc(s[0])}</span>`;}

function build(){
  const P=$('#poems');D.films.forEach(f=>{const b=document.createElement('button');b.dataset.f=f[0];b.title=f[1];
    b.onclick=()=>{const k=V.findIndex(v=>v.f===f[0]&&match(v));if(k>=0)go(k);};P.append(b);});
  const C=$('#chips');
  [['p','words','her words'],['p','ts','timestamp'],['p','span','spread'],['p','board','storyboard'],['f','img','image reads an asked sign'],['f','cut','a cut carries an asked sign'],['f','metz','Metz realises the intent']]
    .forEach(([t,k,l])=>{const b=document.createElement('button');b.className='chip';b.dataset[t]=k;b.textContent=l;C.append(b);});
}
function go(k){if(k<0||k===sel&&!grid)return;sel=k;varSel=0;render();}
function step(dir){for(let k=sel+dir;k>=0&&k<V.length;k+=dir)if(match(V[k])){go(k);return;}}

function range(){if(!poemZoom)return[0,dur];const f=film(V[sel]);return[f[2],f[3]];}
function drawStrip(){
  const c=$('#strip'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  const g=c.getContext('2d');g.scale(dpr,dpr);const W=r.width,H=r.height,[a,b]=range(),x=t=>(t-a)/(b-a)*W,base=H-1;
  g.fillStyle='#0f0e0d';g.fillRect(0,0,W,H);
  D.films.forEach(f=>{if(f[2]>a&&f[2]<b){g.fillStyle='#23211e';g.fillRect(Math.round(x(f[2])),0,1,H);}});
  V.forEach(v=>{if(v.t1<a||v.t0>b)return;const x0=x(v.t0),w=Math.max(poemZoom?2:1,x(v.t1)-x0-(poemZoom?1:0));
    const h=v.k==='board'?4:6+(base-8)*agreeN(v)/6;g.globalAlpha=match(v)?1:.14;g.fillStyle=PC[v.p];g.fillRect(x0,base-h,w,h);});
  g.globalAlpha=1;const s=V[sel],px=x((s.t0+s.t1)/2);g.fillStyle='#ff3b2f';g.fillRect(Math.round(px)-1,0,2,H);
  document.querySelectorAll('#poems button').forEach(el=>{const f=D.films.find(f=>f[0]===el.dataset.f),cur=f[0]===s.f;
    el.hidden=!(f[2]>=a-.01&&f[2]<b)||(poemZoom&&!cur);el.style.left=Math.max(0,x(f[2]))+'px';el.classList.toggle('cur',cur);el.textContent=poemZoom&&cur?f[0]+' · '+f[1]:f[0];});
}
function pickAt(cx){const r=$('#strip').getBoundingClientRect(),[a,b]=range(),t=a+(cx-r.left)/r.width*(b-a);
  let best=-1,bd=1e9;V.forEach((v,k)=>{if(!match(v))return;const d=t<v.t0?v.t0-t:t>v.t1?t-v.t1:(v.k==='spine'?-1:0);if(d<bd){bd=d;best=k;}});
  if(best>=0&&best!==sel){sel=best;varSel=0;render();}}

function tile(id,label,hit,metz,asks){
  if(!id||!D.arch[id])return `<div class="tile empty"><span class="n">${esc(label)}</span></div>`;
  const a=D.arch[id];
  return `<div class="tile${hit?' hit':''}" data-id="${esc(id)}" title="${esc(label)}: ${esc(a[1]||'')} (${a[2]||'n.d.'})"><div class="s" style="${sprite('a',a[0])}"></div>${a[3]?`<span class="tr">${sign(a[3],asks)}</span>`:''}<span class="pl" hidden>▶</span><span class="n">${esc(label)}</span>${metz?`<span class="mz">${esc(metz)}</span>`:''}</div>`;
}
function probe(){
  document.querySelectorAll('.tile[data-id]').forEach(t=>{const a=D.arch[t.dataset.id],u=a&&a[4];if(!u)return;
    const on=()=>{t.querySelector('.pl').hidden=false;t.tabIndex=0;t.setAttribute('role','button');};
    if(playable.get(u)===true)return on();if(playable.has(u))return;playable.set(u,false);
    const v=document.createElement('video');v.preload='metadata';v.muted=true;v.onloadedmetadata=()=>{playable.set(u,true);if(document.body.contains(t))on();};v.src=u;});
}

function renderStage(v){
  const asks=v.b[2],g=v.g.length?v.g:v.b[3],k=g[Math.min(varSel,g.length-1)],it=v.it||[];
  const prev=V.slice(0,sel).some(match),next=V.slice(sel+1).some(match);
  const warn={ts:'timestamp',span:'spread',board:'storyboard'}[v.p];
  let h=`<div class="img" style="${k!=null?sprite('g',k):''}"></div><div class="shade"></div>`;
  if(g.length>1)h+=`<div class="vars" role="group" aria-label="variants">${g.map((x,i)=>`<button data-var="${i}" aria-pressed="${i===varSel}" aria-label="variant ${i+1}"></button>`).join('')}</div>`;
  if(v.g.length&&v.b[3].length)h+=`<div class="pip" style="${sprite('g',v.b[3][0])}" title="beat ${v.b[0]} storyboard: ${esc(v.b[1])}"><span>beat ${v.b[0]}</span></div>`;
  h+=`<div class="sub">${v.w?`<p class="words">“${esc(v.w)}”</p>`:''}<div class="reads">${v.rd.map(n=>sign(n,asks)).join('')}${warn?`<span class="warn" style="color:${warn==='storyboard'?'#a39d92':PC[v.p]}">${warn}</span>`:''}</div></div>`;
  h+=`<button class="arr l" id="aL" aria-label="previous" ${prev?'':'disabled'}>‹</button><button class="arr r" id="aR" aria-label="next" ${next?'':'disabled'}>›</button>`;
  if(info&&!grid)h+=`<div class="info" id="info">${it[2]?`<p class="p">“${esc(it[2])}”</p>`:'<p class="m">No prompt recorded.</p>'}
    ${it[0]||it[1]?`<div class="m">${esc([it[0],it[1]].filter(Boolean).join(' · '))}</div>`:''}
    <div class="m">beat ${v.b[0]} · ${esc(v.b[1])} ${asks.map(n=>sign(n)).join('')}</div>
    ${v.nr.length?`<div class="m">looks like</div><div class="near">${v.nr.map(id=>`<div style="${sprite('a',D.arch[id][0])}"><span>${esc(D.arch[id][1]||'')}</span></div>`).join('')}</div>`:''}
    ${v.au?`<button class="chip" id="hear" hidden style="align-self:flex-start">▶ her line</button>`:''}</div>`;
  if(grid)h+=gridHTML(v);
  $('#stage').innerHTML=h;
  if(info&&v.au){const u=v.au;if(playable.get(u)===true)$('#hear').hidden=false;else if(!playable.has(u)){playable.set(u,false);const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>{playable.set(u,true);const b=$('#hear');if(b&&V[sel].au===u)b.hidden=false;};a.src=u;}}
}
function gridHTML(v){
  const f=film(v),vs=V.map((x,k)=>[x,k]).filter(([x])=>x.f===f[0]);
  const rows=[['placed',x=>-1],['words',x=>x.w?1:0],['image',x=>x.k!=='spine'?0:x.ag[0]?2:1],...[0,1,2,3].map(i=>[D.cuts[i],x=>x.k!=='spine'?1:((x.ag[1].includes(i)||(x.ag[2]&&x.ag[2].includes(i)))?2:1)])];
  let h='<div class="grid" id="grid"><table><tbody>';
  rows.forEach(([nm,fn])=>{h+=`<tr><th>${esc(nm)}</th>${vs.map(([x,k])=>{const s=fn(x);return `<td data-k="${k}" class="${s===2?'agree':s===1?'on':''}${k===sel?' sel':''}" style="${s===-1?'background:'+PC[x.p]+';':''}opacity:${match(x)?1:.2}" title="${esc(x.id)}"></td>`;}).join('')}</tr>`;});
  return h+'</tbody></table></div>';
}
function renderTiles(v){
  const asks=v.b[2];
  $('#tiles').innerHTML=v.cu.map((c,i)=>tile(c[0],D.cuts[i],v.ag[1].includes(i)||(v.ag[2]&&v.ag[2].includes(i)),c[1],asks)).join('')+tile(v.sp,'spine-cut',false,'',asks)+tile(v.fo,'forage',false,'',asks);
  probe();
}

function render(){
  const v=V[sel],f=film(v);
  $('#sPoem').textContent=`${f[0]} · ${f[1]}`;$('#sClk').textContent=`${mmss(v.t0)} · ${v.id}`;
  $('#sBadge').innerHTML='';
  const n=agreeN(v);$('#sBars').hidden=v.k!=='spine';$('#sBars').innerHTML=[0,1,2,3,4,5].map(i=>`<i style="height:${6+i*2.4}px" class="${i<n?'on':''}"></i>`).join('');
  $('#sBars').title=`${n} of 6 agree`;
  drawStrip();renderStage(v);renderTiles(v);
  $('#bPoem').setAttribute('aria-pressed',poemZoom);$('#bGrid').setAttribute('aria-pressed',grid);$('#bInfo').setAttribute('aria-pressed',info);
  $('#bFilter').setAttribute('aria-pressed',!!active()||!$('#sheet').hidden);
  const m=V.filter(match).length;
  $('#st').innerHTML=active()?`<b>${m}</b> match`:`${n}/6 agree`;
  document.querySelectorAll('#chips .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p?F.place.has(b.dataset.p):F[b.dataset.f]));
  $('#fN').innerHTML=`<b style="color:var(--ink)">${m}</b> of ${V.length}`;
  try{history.replaceState(null,'','#v'+v.v);}catch(e){}
}

function wire(){
  const sw=$('#sw');let drag=false;
  sw.addEventListener('pointerdown',e=>{drag=true;sw.setPointerCapture(e.pointerId);pickAt(e.clientX);});
  sw.addEventListener('pointermove',e=>{if(drag)pickAt(e.clientX);});
  ['pointerup','pointercancel'].forEach(t=>sw.addEventListener(t,()=>drag=false));
  const tog=(name)=>{if(name==='poem')poemZoom=!poemZoom;if(name==='grid'){grid=!grid;if(grid)info=false;}if(name==='info'){info=!info;if(info)grid=false;}render();};
  $('#bPoem').onclick=()=>tog('poem');$('#bGrid').onclick=()=>tog('grid');$('#bInfo').onclick=()=>tog('info');
  const sheet=o=>{$('#sheet').hidden=!o;render();};
  $('#bFilter').onclick=()=>sheet($('#sheet').hidden);$('#fDone').onclick=()=>sheet(false);
  $('#fClear').onclick=()=>{F.place.clear();F.img=F.cut=F.metz=false;render();};
  $('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p){F.place.has(b.dataset.p)?F.place.delete(b.dataset.p):F.place.add(b.dataset.p);}else F[b.dataset.f]=!F[b.dataset.f];
    if(!match(V[sel])){let best=-1,bd=1e9;V.forEach((v,k)=>{if(match(v)){const d=Math.abs(v.t0-V[sel].t0);if(d<bd){bd=d;best=k;}}});if(best>=0){sel=best;varSel=0;}}
    render();});
  $('#stage').addEventListener('click',e=>{
    if(e.target.closest('#aL'))return step(-1);if(e.target.closest('#aR'))return step(1);
    const vb=e.target.closest('[data-var]');if(vb){varSel=+vb.dataset.var;renderStage(V[sel]);return;}
    const td=e.target.closest('td[data-k]');if(td){grid=false;go(+td.dataset.k);return;}
    const hb=e.target.closest('#hear');if(hb){const a=new Audio(V[sel].au);hb.textContent='■ playing';a.onended=()=>{hb.textContent='▶ her line';};a.play().catch(()=>{hb.hidden=true;});return;}
    if(e.target.closest('#info')){info=false;render();}});
  $('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile[data-id]');if(!t||t.querySelector('.pl').hidden&&!t.querySelector('video'))return;
    const ex=t.querySelector('video');if(ex){ex.remove();t.querySelector('.pl').hidden=false;return;}
    const vd=document.createElement('video');vd.src=D.arch[t.dataset.id][4];vd.muted=true;vd.playsInline=true;vd.loop=true;vd.autoplay=true;t.append(vd);t.querySelector('.pl').hidden=true;});
  let sx=null,sy=null;const st=$('#stage');
  st.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){sx=e.clientX;sy=e.clientY;}});
  st.addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>50&&Math.abs(e.clientX-sx)>Math.abs(e.clientY-sy))step(e.clientX<sx?1:-1);sx=null;});
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(e.key==='ArrowRight'){step(1);e.preventDefault();}else if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}
    else if(e.key==='Escape'){if(!$('#sheet').hidden)sheet(false);else if(info||grid){info=grid=false;render();}}
    else if(k==='z')tog('poem');else if(k==='g')tog('grid');else if(k==='i')tog('info');else if(k==='f')sheet($('#sheet').hidden);
    else if(e.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('tile'))document.activeElement.click();});
  window.addEventListener('resize',drawStrip);
}
})();
</script>
</body></html>
