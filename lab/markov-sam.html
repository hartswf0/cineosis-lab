<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Markov SAM</title>
<meta name="description" content="Markov SAM. Each line becomes a storyboard panel: a ground from the archive and figures cut out by SAM, which you move about by hand.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#7d776f; --faint:#2a2723; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px var(--mono); -webkit-tap-highlight-color:transparent; overflow:hidden; }
[hidden]{ display:none !important; } button,input{ font:inherit; color:inherit; }
body{ display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); height:100dvh; }
header{ display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); min-width:0; }
#markLink{ display:flex; align-items:center; gap:8px; color:var(--ink); text-decoration:none; letter-spacing:.2em; font-size:10.5px; white-space:nowrap; } #markLink span{ color:var(--dim); }
#sys{ flex:1; min-width:0; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; }
.ico{ width:44px; height:44px; display:grid; place-items:center; background:none; border:0; border-radius:50%; cursor:pointer; color:#a59e93; flex:none; } .ico:hover{ color:var(--ink); background:#ffffff0d; } .ico svg{ width:20px; height:20px; } .ico.on{ color:var(--hi); }
main{ min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto auto auto; gap:6px; padding:0 10px; }
#stageWrap{ min-height:0; min-width:0; position:relative; display:grid; place-items:center; overflow:hidden; }
.panel{ position:relative; aspect-ratio:16/9; background:#0c0b0a; overflow:hidden; border-radius:3px; container-type:size; }
.panel.grade > .g{ filter:grayscale(1) contrast(1.06); }
.panel .g{ position:absolute; inset:0; }
.panel .bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.fig{ position:absolute; background-repeat:no-repeat; background-size:100% 100%; transform:translate(-50%,-50%); filter:drop-shadow(0 3px 10px #000a); touch-action:none; cursor:grab; }
.fig.flip{ transform:translate(-50%,-50%) scaleX(-1); }
.fig.sel{ outline:1px dashed var(--hi); outline-offset:3px; }
@keyframes spr{ to{ background-position:100% 0; } }
#stage{ position:absolute; left:50%; top:50%; translate:-50% -50%; box-shadow:0 0 0 1px var(--faint); }
#stage .cap{ position:absolute; left:0; right:0; bottom:0; padding:22px 14px 10px; background:linear-gradient(#0000,#000c); font:300 clamp(15px,4.2cqw,30px)/1.2 var(--serif); text-align:center; pointer-events:none; text-wrap:balance; }
#empty{ text-align:center; color:#5f5a52; padding:20px; } #empty h1{ font:300 clamp(26px,6vw,46px) var(--serif); color:#8f887c; margin:0 0 10px; } #empty p{ max-width:46ch; margin:0 auto 18px; line-height:1.6; }
#starters{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; } #starters button{ border:1px solid #2e2b27; background:none; border-radius:20px; padding:9px 14px; min-height:40px; cursor:pointer; color:#a59e93; font:italic 300 15px var(--serif); }
#tools{ display:flex; gap:2px; align-items:center; justify-content:center; min-height:44px; color:var(--dim); font-size:10.5px; letter-spacing:.06em; }
#tools .ico{ width:40px; height:40px; } #tools em{ font-style:normal; margin-right:8px; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--hi); }
#strip{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; } #strip::-webkit-scrollbar{ display:none; }
#strip .panel{ flex:none; width:clamp(92px,15vw,150px); cursor:pointer; opacity:.62; } #strip .panel.cur{ opacity:1; box-shadow:0 0 0 1.5px var(--hi); } #strip .panel b{ position:absolute; left:4px; top:3px; font-weight:400; font-size:9.5px; color:#fffb; text-shadow:0 1px 2px #000; }
#trayHead{ display:flex; gap:4px; align-items:center; } #trayHead button{ background:none; border:0; padding:8px 8px; min-height:36px; cursor:pointer; color:var(--dim); letter-spacing:.16em; font-size:10px; border-bottom:1px solid transparent; } #trayHead button.on{ color:var(--ink); border-color:var(--hi); }
#find{ flex:1; min-width:0; background:#121110; border:1px solid var(--faint); border-radius:16px; padding:6px 12px; font-size:16px; height:34px; } #find::placeholder{ color:#57524b; font-size:12px; }
#tray{ display:flex; gap:6px; overflow-x:auto; padding:6px 0; height:92px; scrollbar-width:none; } #tray::-webkit-scrollbar{ display:none; }
#tray button{ flex:none; height:80px; min-width:64px; max-width:150px; padding:3px; background:#100f0e; border:1px solid var(--faint); border-radius:4px; cursor:pointer; position:relative; display:grid; place-items:center; } #tray button:hover{ border-color:#5a4e33; }
#tray img{ max-height:72px; max-width:140px; display:block; } #tray button.gr{ padding:0; overflow:hidden; } #tray button.gr img{ height:80px; max-height:none; max-width:none; width:142px; object-fit:cover; }
#tray small{ position:absolute; left:3px; bottom:2px; font-size:9px; color:#d8d2c6; text-shadow:0 1px 2px #000,0 0 4px #000; max-width:calc(100% - 6px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#tray button.on{ border-color:var(--hi); }
footer{ display:flex; gap:4px; align-items:center; padding:6px 10px calc(8px + env(safe-area-inset-bottom)); }
#prompt{ flex:1; min-width:0; background:#121110; border:1px solid var(--faint); border-radius:22px; padding:0 16px; height:44px; font:italic 300 17px var(--serif); } #prompt::placeholder{ color:#57524b; }
#bMic.on{ color:var(--hi); background:#e8c07022; }
#board{ position:fixed; inset:0; z-index:40; background:var(--bg); overflow:auto; padding:calc(54px + env(safe-area-inset-top)) 14px 40px; }
#board .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:16px 12px; max-width:1500px; margin:0 auto; }
#board figure{ margin:0; cursor:pointer; } #board figcaption{ padding:6px 2px 0; font:300 15px/1.25 var(--serif); } #board figcaption b{ font:10px var(--mono); color:var(--dim); margin-right:6px; font-weight:400; }
#board .top{ position:fixed; left:0; right:0; top:0; display:flex; align-items:center; gap:8px; padding:calc(6px + env(safe-area-inset-top)) 12px 6px; background:#050505ee; z-index:2; letter-spacing:.2em; font-size:10.5px; color:var(--dim); } #board .top span{ flex:1; }
.fig.aim{ outline:1px solid #c4f46a; outline-offset:3px; }
#tools button.tx{ background:none; border:1px solid var(--faint); border-radius:14px; min-height:32px; padding:0 10px; margin:0 2px; cursor:pointer; color:#a59e93; font-size:10px; letter-spacing:.1em; } #tools button.tx:hover{ color:var(--ink); border-color:#5a4e33; }
#tools{ flex-wrap:wrap; }
#handCam{ position:absolute; left:6px; top:6px; width:112px; height:84px; border:1px solid var(--faint); border-radius:4px; background:#0008; z-index:5; pointer-events:none; }
.hcur{ position:fixed; z-index:200; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; border:2px solid #c4f46a; pointer-events:none; transition:width .12s,height .12s,margin .12s,background .12s; } .hcur.tool{ border-color:#85bdff; }
.hcur.closed{ width:14px; height:14px; margin:-7px 0 0 -7px; background:#c4f46a; } .hcur.tool.closed{ background:#85bdff; } .hcur b{ position:absolute; left:18px; top:-16px; font:500 9.5px var(--mono); letter-spacing:.1em; color:#c4f46a; white-space:nowrap; text-shadow:0 1px 3px #000; } .hcur.tool b{ color:#85bdff; }
.hcur i{ position:absolute; inset:-7px; border-radius:50%; border:2px solid transparent; border-top-color:currentColor; color:#fff; opacity:0; } .hcur.arm i{ opacity:.9; animation:arm linear forwards; } @keyframes arm{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
#bHand.on{ color:#c4f46a; background:#c4f46a1c; }
#toast{ position:fixed; left:50%; top:calc(56px + env(safe-area-inset-top)); transform:translateX(-50%); background:#14120f; border:1px solid var(--faint); border-radius:18px; padding:8px 14px; z-index:90; max-width:92vw; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; } #toast.on{ opacity:1; }
@media (max-height:560px){ header{ padding-top:2px; padding-bottom:2px; } #strip .panel{ width:72px; } #tray{ height:60px; padding:3px 0; } #tray button{ height:54px; } #tray img{ max-height:46px; } #tray button.gr img{ height:54px; width:96px; } #tools{ min-height:30px; } #tools .ico{ width:30px; height:30px; } footer{ padding-top:2px; } #stageWrap{ min-height:120px; } }
@media (min-width:900px) and (min-height:561px){ main{ padding:0 18px; } #tray{ height:112px; } #tray button{ height:100px; } #tray img{ max-height:90px; } #tray button.gr img{ height:100px; width:178px; } }
@media print{ html,body{ overflow:visible; height:auto; background:#fff; color:#000; display:block; } header,main,footer,#toast,#board .top{ display:none !important; } #board{ position:static; display:block !important; background:#fff; padding:0; } #board .grid{ grid-template-columns:repeat(3,1fr); } #board figure{ break-inside:avoid; } .panel{ print-color-adjust:exact; -webkit-print-color-adjust:exact; } }
</style></head><body>
<header><a id="markLink" href="markov-poet.html"></a><div id="sys">waking</div>
  <button class="ico" id="bBoard" aria-label="The whole storyboard"><svg><use href="#i-grid"/></svg></button>
  <button class="ico" id="bMore" aria-label="Menu"><svg><use href="#i-more"/></svg></button></header>
<main>
  <div id="stageWrap"><div id="empty"><h1>a line is a panel</h1><p>Type a line. The archive gives it a ground, and figures SAM has cut out of other films step in. Drag them where the story needs them.</p><div id="starters"></div></div>
    <div class="panel" id="stage" hidden></div><canvas id="handCam" hidden></canvas></div>
  <div id="tools" hidden></div>
  <div id="strip"></div>
  <div id="trayBox" hidden><div id="trayHead"><button id="tFig" class="on">FIGURES</button><button id="tGr">GROUNDS</button><input id="find" placeholder="find a figure: a dog, hands, a cloud" enterkeyhint="search" autocomplete="off"></div><div id="tray"></div></div>
</main>
<footer><input id="prompt" placeholder="type a line, then Return" autocomplete="off" enterkeyhint="send">
  <button class="ico" id="bHand" aria-label="Hands: move figures through the camera"><svg><use href="#i-hand"/></svg></button>
  <button class="ico" id="bMic" aria-label="Talk to the board"><svg><use href="#i-mic"/></svg></button>
  <button class="ico" id="bPlay" aria-label="Play the board"><svg><use href="#i-play"/></svg></button>
  <button class="ico" id="bDeal" aria-label="Deal this panel again"><svg><use href="#i-take"/></svg></button></footer>
<div id="board" hidden><div class="top"><span>STORYBOARD</span><button class="ico" id="bPrint" aria-label="Print or save as PDF"><svg><use href="#i-send"/></svg></button><button class="ico" id="bBoardX" aria-label="Close"><svg><use href="#i-close"/></svg></button></div><div class="grid"></div></div>
<div id="toast"></div>
<script src="markov/engine.js?v=6"></script>
<script src="markov/clip-text.js?v=5"></script>
<script src="markov/shared.js?v=4"></script>
<script src="markov/export.js?v=4"></script>
<script src="markov/live.js?v=4"></script>
<script src="markov/hands.js?v=1"></script>
<script src="markov/ui.js?v=3"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SH = window.SH; MPUI.sprite(); $('#markLink').innerHTML = MPUI.mark(26) + 'MARKOV <span>· SAM</span>';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  let tT; const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => e.classList.remove('on'), 3200); };
  SH.onStatus(s => { $('#sys').textContent = s.text || ''; });

  /* the cast: figures SAM cut out of the lab's read shots */
  let D = null, SAM = null, EMB = null, EXT = '.png';
  const url = (p, sprite) => (EXT === '.png' ? p : p.replace(/\.png$/, EXT));
  const figSims = e => { const n = SAM.n, d = SAM.dim, o = new Float32Array(n); for (let i = 0; i < n; i++) { let s = 0, r = i * d; for (let j = 0; j < d; j++) s += e[j] * EMB[r + j]; o[i] = s * SAM.scale; } return o; };
  const rank = sims => Array.from(sims.keys()).sort((a, b) => sims[b] - sims[a]);
  async function loadCast() {
    const [j, b] = await Promise.all([fetch('markov/sam.json').then(r => r.json()), fetch('markov/sam-emb.bin').then(r => r.arrayBuffer())]); SAM = j; EMB = new Int8Array(b);
    EXT = await new Promise(r => { const i = new Image(); i.onload = () => r('.webp'); i.onerror = () => r('.png'); i.src = j.figs[0].png.replace(/\.png$/, '.webp'); });
  }

  /* the board: lines, and for each panel a ground and placed figures */
  let lines = store.get('sam.lines', []), saved = store.get('sam.panels', {}), panels = [], sel = 0, selFig = -1, grade = store.get('sam.grade', true), tab = 'fig', found = null, composing = 0;
  const key = (i, t) => i + '|' + t;
  const persist = () => { store.set('sam.lines', lines); const o = {}; panels.forEach(p => o[p.key] = { bg: p.bg, figs: p.figs }); saved = o; store.set('sam.panels', o); };
  // a figure enters where it stood in its own film, at its own size: the first guess at a composition
  function placeFig(f, n) { const F = SAM.figs[f], [x, y, w, h] = F.box; return { z: .5, f, x: Math.min(.9, Math.max(.1, x + w / 2 + (n ? (n % 2 ? .12 : -.12) : 0))), y: Math.min(.9, Math.max(.12, y + h / 2)), s: Math.min(.42, Math.max(.12, w * .7)), flip: 0 }; }
  function deal(p, n = 2) {   // sample figures by their chance for this line: the Markov step, over cut-outs
    const top = p.cands.slice(0, 10), T = .02, w = top.map(i => Math.exp((p.fsims[i] - p.fsims[top[0]]) / T)), out = [], shots = new Set();
    for (let k = 0; k < n; k++) { let tot = 0; top.forEach((i, j) => { if (!shots.has(SAM.figs[i].shot)) tot += w[j]; }); if (!tot) break; let r = Math.random() * tot, pick = -1;
      for (let j = 0; j < top.length; j++) { if (shots.has(SAM.figs[top[j]].shot)) continue; r -= w[j]; if (r <= 0) { pick = top[j]; break; } } if (pick < 0) break;
      if (k && p.fsims[pick] < p.fsims[top[0]] - .035) break; shots.add(SAM.figs[pick].shot); out.push(placeFig(pick, k)); }
    return out; }
  async function rebuild(keepSel) {
    const my = ++composing; if (!lines.length) { panels = []; draw(); return; }
    // a storyboard wants each ground to answer its own line, so the ground is drawn straight from that line's own distribution over the archive
    const texts = Shannon.parse(lines.join('\n')).map(p => p.text), E = await SH.embed(texts); if (my !== composing) return; if (E.some(x => !x)) throw new Error('some words could not be read');
    const used = new Set(), cut = E.map(e => { const sm = D.LIB.sims(e), top = rank(sm).slice(0, 24), w = top.map(k => Math.exp((sm[k] - sm[top[0]]) / .018)), tot = w.reduce((a, b) => a + b, 0), alts = top.map((k, n) => ({ k, p: w[n] / tot }));
      const pick = alts.find(a => !used.has(D.LIB.shots[a.k].src)) || alts[0]; used.add(D.LIB.shots[pick.k].src); return { k: pick.k, alts }; });
    panels = cut.map((s, i) => { const fsims = figSims(E[i]), p = { key: key(i, texts[i]), text: texts[i], e: E[i], fsims, cands: rank(fsims).slice(0, 40), alts: s.alts.map(a => ({ k: a.k, p: a.p })), bg: s.k, figs: [] };
      const was = saved[p.key]; if (was) { p.bg = was.bg; p.figs = (was.figs || []).filter(g => SAM.figs[g.f]); } else p.figs = deal(p); return p; });
    if (!keepSel) sel = panels.length - 1; sel = Math.max(0, Math.min(sel, panels.length - 1)); selFig = -1; found = null; persist(); draw();
    SH.status('rest', `${panels.length} panel${panels.length > 1 ? 's' : ''} · drag a figure to move it`);
  }

  /* drawing a panel: live (video ground, moving figures) on the stage, still everywhere else */
  const frames = new Map();
  // depth: near figures stand in front, sharp and full; far ones sit behind, a little soft and dim, the way a lens would give them
  const zOf = g => g.z == null ? .5 : g.z;
  function depth(d, g) { const z = zOf(g); d.style.zIndex = Math.round(z * 100); d.style.filter = `drop-shadow(0 3px 10px #000a) blur(${(Math.max(0, .5 - z) * 3).toFixed(2)}px) brightness(${(.72 + .28 * Math.min(1, z * 2)).toFixed(2)})`; }
  const undoStack = [];
  function snap() { const p = panels[sel]; if (!p) return; undoStack.push({ i: sel, bg: p.bg, figs: JSON.stringify(p.figs) }); if (undoStack.length > 60) undoStack.shift(); }
  function undo() { const u = undoStack.pop(); if (!u || !panels[u.i]) { toast('nothing to undo'); return false; } panels[u.i].bg = u.bg; panels[u.i].figs = JSON.parse(u.figs); sel = u.i; selFig = -1; persist(); draw(); toast('undone'); return true; }
  function figEl(g, live) { const F = SAM.figs[g.f], d = document.createElement('div'); d.className = 'fig' + (g.flip ? ' flip' : ''); d.style.left = g.x * 100 + '%'; d.style.top = g.y * 100 + '%'; d.style.width = g.s * 100 + '%'; depth(d, g);
    const still = () => { d.style.aspectRatio = F.w + ' / ' + F.h; d.style.backgroundImage = `url("${url(F.png)}")`; }; still();
    if (live && F.sprite && F.sw) { const go = n => { if (n < 2) return; d.style.aspectRatio = F.sw + ' / ' + F.sh; d.style.backgroundImage = `url("${url(F.sprite)}")`; d.style.backgroundSize = n * 100 + '% 100%'; d.style.animation = `spr ${(n / (F.fps || 6)).toFixed(2)}s steps(${n}, jump-none) infinite alternate`; };
      if (frames.has(F.sprite)) go(frames.get(F.sprite)); else { const im = new Image(); im.onload = () => { const n = Math.round(im.naturalWidth / (im.naturalHeight * F.sw / F.sh)); frames.set(F.sprite, n); if (d.isConnected) go(n); }; im.src = url(F.sprite); } }
    return d; }
  function paint(el, p, live) { el.classList.toggle('grade', !!grade); el.innerHTML = ''; const g = document.createElement('div'); g.className = 'g'; el.append(g);
    if (p.bg != null) { const s = D.LIB.shots[p.bg]; if (live) { const v = document.createElement('video'); v.className = 'bg'; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.poster = s.thumb; v.src = s.video + '#t=' + (s.in || 0); g.append(v); v.play().catch(() => { }); }
      else { const i = document.createElement('img'); i.className = 'bg'; i.loading = 'lazy'; i.src = s.thumb; g.append(i); } }
    p.figs.forEach((f, n) => { const d = figEl(f, live); d.dataset.n = n; g.append(d); }); return g; }
  function draw() {
    const has = panels.length > 0; $('#empty').hidden = has; $('#stage').hidden = !has; $('#trayBox').hidden = !has; $('#tools').hidden = !has; if (!has) { $('#strip').innerHTML = ''; drawStarters(); return; }
    drawStage(); drawStrip(); drawTray(); }
  function drawStage() { const p = panels[sel], st = $('#stage'); paint(st, p, true); const c = document.createElement('div'); c.className = 'cap'; c.textContent = p.text; st.append(c); markSel(); fit(); }
  function markSel() { $('#stage').querySelectorAll('.fig').forEach(d => d.classList.toggle('sel', +d.dataset.n === selFig)); drawTools(); }
  function drawStrip() { const s = $('#strip'); s.innerHTML = ''; panels.forEach((p, i) => { const d = document.createElement('div'); d.className = 'panel' + (i === sel ? ' cur' : ''); paint(d, p, false); const b = document.createElement('b'); b.textContent = i + 1; d.append(b); d.onclick = () => { stop(); go(i); }; s.append(d); });
    const c = s.querySelector('.cur'); if (c) s.scrollLeft = c.offsetLeft - s.offsetLeft - (s.clientWidth - c.clientWidth) / 2; }
  function restrip() { const d = $('#strip').children[sel]; if (d) { paint(d, panels[sel], false); const b = document.createElement('b'); b.textContent = sel + 1; d.append(b); } }
  function go(i) { sel = Math.max(0, Math.min(panels.length - 1, i)); selFig = -1; found = null; $('#find').value = ''; draw(); }
  function fit() { const w = $('#stageWrap'), st = $('#stage'), W = w.clientWidth, H = w.clientHeight; const wd = Math.min(W, H * 16 / 9); st.style.width = wd + 'px'; st.style.height = wd * 9 / 16 + 'px'; }
  addEventListener('resize', fit);
  function drawTools() { const t = $('#tools'), p = panels[sel]; if (!p) return; const g = p.figs[selFig];
    const B = (ic, lab, f) => `<button class="ico" data-a="${f}" aria-label="${lab}" title="${lab}"><svg><use href="#i-${ic}"/></svg></button>`;
    const X = (lab, f) => `<button class="tx" data-a="${f}">${lab}</button>`;
    t.innerHTML = g ? `<em>${esc(SAM.figs[g.f].desc)}</em>` + B('down', 'Smaller', 'sm') + B('up', 'Larger', 'lg') + X('NEAR', 'near') + X('FAR', 'far') + X('COPY', 'copy') + X('FLIP', 'flip') + B('close', 'Remove', 'rm')

  $('#bMic').onclick = async () => { if (live) { const l = live; live = null; l.stop(); return; } if (!MPLive.hasKey()) { MPLive.keySheet(ok => toast(ok ? 'key saved · tap the microphone and speak' : 'live voice needs an OpenAI key')); return; }
    stop(); $('#bMic').classList.add('on'); SH.status('listening', 'asking for the microphone'); let mic = '';
    try { live = await MPLive.start({ tools: TOOLS, instructions: 'You operate a storyboard. The person builds panels with their voice and their hands together: a camera follows their hands, so words like this, that, it, here and there mean the figure a hand is holding or pointing at and the place the hand is; the tools resolve that themselves, you never need to ask where. Requests to bring something in (put a dog here, add a cloud) are place_figure. Requests about a figure (copy that, remove it, flip it, bigger, push it back, bring it nearer) are edit_figure. Requests about the background are change_ground. Next and back are turn_page. Anything that sounds like a line of a story or poem, not an instruction, is add_line with exactly their words. Say almost nothing: at most two or three words, and nothing at all after a tool succeeds.', on: {
      mic: l => mic = l, state: (s, why) => { if (s === 'live') SH.status('listening', 'live on ' + mic + ' · speak a line'); else if (s === 'connecting') SH.status('listening', 'connecting the live voice'); else if (s === 'closed') { live = null; $('#bMic').classList.remove('on'); SH.status('rest', why ? 'live voice stopped: ' + why : 'live voice off'); } },
      partial: t => { if (t) SH.status('listening', t); }, error: m => toast(m) } }); } catch (e) { $('#bMic').classList.remove('on'); SH.status('rest', 'live voice could not start: ' + e.message); toast('live voice could not start: ' + e.message); } };

  $('#bMore').onclick = () => MPUI.menu($('#bMore'), [
    { title: 'THIS PANEL', items: [
      { icon: 'take', label: 'Deal again', hint: 'new figures, by their chance for this line', act: () => $('#bDeal').click() },
      { icon: 'close', label: 'Clear the figures', hidden: () => !panels[sel] || !panels[sel].figs.length, act: () => { panels[sel].figs = []; selFig = -1; persist(); drawStage(); restrip(); } },
      { icon: 'close', label: 'Remove this line', hidden: () => !panels.length, act: () => removeLine(lineOf(sel)) }] },
    { title: 'THE BOARD', items: [
      { icon: 'grid', label: 'See the whole storyboard', hidden: () => !panels.length, act: openBoard },
      { icon: 'calm', label: 'One grade', hint: 'grounds and figures in the same black and white, so they sit together', on: () => grade, state: () => grade ? 'ON' : '', act: () => { grade = !grade; store.set('sam.grade', grade); draw(); return true; } },
      { icon: 'send', label: 'Copy a link to this board', hidden: () => !panels.length, act: link },
      { icon: 'book', label: 'Print, or save as PDF', hidden: () => !panels.length, act: () => { openBoard(); setTimeout(print, 600); } },
      { icon: 'open', label: 'Bring the poem from the Poet', hint: 'the lines now in the Poet room', act: () => { const l = store.get('poet.lines', []); if (!l.length) return toast('the Poet room is empty'); lines = [...l]; saved = {}; rebuild().then(() => go(0)); } },
      { icon: 'wrench', label: 'Send the grounds to the Cutting Room', hint: 'hand-butter · WAG, with the lab server', hidden: () => !panels.length, act: toRoom },
      { icon: 'undo', label: 'Begin again', hidden: () => !lines.length, act: () => { stop(); lines = []; saved = {}; panels = []; store.set('sam.lines', []); store.set('sam.panels', {}); draw(); SH.status('rest', 'empty board'); } }] },
    { title: 'HANDS AND VOICE', items: [{ icon: 'hand', label: () => hands ? 'Hands off' : 'Hands on', hint: 'move figures through the camera: pinch to hold, open to let go', on: () => !!hands, act: () => $('#bHand').click() },
      { icon: 'undo', label: 'Undo', hint: 'or hold a fist', act: () => { undo(); } }, { icon: 'voice', label: 'Live voice · OpenAI key', state: () => MPLive.hasKey() ? 'SET' : '', act: () => MPLive.keySheet(ok => toast(ok ? 'key saved' : 'no key saved')) }] },
    { title: 'GO', items: [{ icon: 'home', label: 'The Poet', act: () => location.href = 'shannon-poet.html' }, { icon: 'info', label: 'How the Markov Poet works', act: () => location.href = 'markov-poet.html' }] }]);

  Promise.all([SH.load({ light: true }), loadCast()]).then(async ([d]) => { D = d; drawStarters();
    const m = location.hash.match(/b=([^&]+)/); if (m) { try { await applyBoard(await MPExport.unpack(m[1])); history.replaceState(null, '', location.pathname); return; } catch (e) { toast('that link could not be opened'); } }
    if (lines.length) rebuild(true).catch(e => SH.status('rest', e.message)); else SH.status('rest', `${SAM.n} figures and ${d.LIB.n.toLocaleString()} shots at rest`);
  }).catch(e => SH.status('rest', 'could not wake: ' + e.message));
})();
</script></body></html>
