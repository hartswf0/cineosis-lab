<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Takes</title>
<meta name="description" content="Takes: an instrument that plays a possibility from the archive, lets you change it, keeps its exact history, and lets a branch that looked like nothing become the start of a different film.">

<style>
:root{ --bg:#0d0c0b; --pan:#171513; --line:#2c2824; --ink:#efe9dd; --dim:#8a8378; --gold:#e8c070; --pic:#6fa8dc; --voice:#ff8a5c; --amb:#7cc98a; --mus:#a98bf0; --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Fraunces',Georgia,serif; color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.35 var(--mono); overscroll-behavior:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; } input{ font:inherit; }
#app{ height:100dvh; display:flex; flex-direction:column; max-width:720px; margin:0 auto; padding:max(8px,env(safe-area-inset-top)) 12px 0; }
/* the player: always on top, always the exact take */

#tl .seg.snd.drag{ cursor:grabbing; box-shadow:0 0 0 2px var(--gold); }
#tl .ph{ position:absolute; top:0; bottom:0; width:2px; background:#fff; pointer-events:none; } #tl .zero{ position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--pic); opacity:.6; pointer-events:none; }

.rel{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; } .rel button{ border:1px dashed var(--line); border-radius:8px; padding:4px 10px; font-size:12px; color:var(--ink); text-align:left; } .rel button b{ color:var(--gold); font-weight:600; } .rel button.kept{ border-style:solid; border-color:var(--gold); }
.acts{ display:flex; gap:8px; margin:8px 0; } .big{ flex:1; height:56px; border-radius:14px; font:600 18px var(--mono); letter-spacing:.04em; }
.keep{ border:2px solid var(--gold); color:var(--gold); } .keep.on{ background:var(--gold); color:#1b1408; } .explore{ background:var(--ink); color:#111; }
.small{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; } .small button{ border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }

.cards{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .card{ background:var(--pan); border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; } .card.on{ border-color:var(--ink); }
.card .strip{ display:flex; height:54px; background:#000; } .card .strip img{ flex:1; min-width:0; object-fit:cover; } .card .strip i{ flex:0 0 18%; background:#000; }

.kind{ font-size:11px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin:12px 0 6px; }
.ops{ display:flex; flex-direction:column; gap:6px; } .op{ display:flex; align-items:center; gap:8px; background:var(--pan); border:1px solid var(--line); border-radius:10px; padding:8px 10px; } .op span{ flex:1; font-size:13px; } .op button{ border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:6px 10px; font-size:12px; }

.sib{ margin:-2px 0 4px 43px; display:flex; gap:4px; flex-wrap:wrap; } .sib button{ display:flex; align-items:center; gap:4px; border:1px dashed var(--line); border-radius:6px; padding:2px 6px 2px 2px; font-size:11px; color:var(--dim); } .sib img{ width:34px; aspect-ratio:16/9; object-fit:cover; border-radius:3px; }
.gens{ display:flex; flex-direction:column; gap:6px; } .gen{ display:flex; gap:4px; overflow-x:auto; align-items:center; } .gen small{ flex:none; width:22px; color:var(--dim); font-size:10px; } .gen button{ flex:none; padding:0; border-radius:4px; overflow:hidden; border:1px solid var(--line); } .gen button.cur{ border-color:var(--ink); } .gen button.kept{ box-shadow:0 0 0 2px var(--gold); } .gen img{ width:52px; aspect-ratio:16/9; object-fit:cover; display:block; }
.films .film{ background:var(--pan); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; } .film h3{ margin:0 0 6px; font:600 17px var(--serif); } .film .strip{ display:flex; gap:4px; overflow-x:auto; } .film .strip button{ flex:none; position:relative; padding:0; } .film .strip img{ width:72px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; display:block; }
.film .strip b{ position:absolute; right:2px; top:0; font-size:12px; color:#fff; text-shadow:0 1px 2px #000; }

.sheet{ position:fixed; inset:0; background:#000a; display:grid; place-items:end center; z-index:20; } .sheet>div{ width:min(720px,100%); background:var(--pan); border-radius:16px 16px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); }
.sheet button.row{ display:block; width:100%; text-align:left; padding:12px; border:1px solid var(--line); border-radius:10px; margin-top:8px; }
#boot{ position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:var(--dim); font-size:13px; text-align:center; padding:20px; z-index:30; } #boot b{ display:block; font:600 26px var(--serif); color:var(--ink); margin-bottom:8px; }
</style></head>
<body>
<div id="boot"><div><b>Takes</b>opening the archive…</div></div>
<div id="app">
  <div id="stage"><video playsinline muted preload="auto"></video><video playsinline muted preload="auto"></video><span class="id" id="sid"></span><div class="line" id="sline"></div><div class="tap" id="stap"></div></div>
  <div id="tl"></div>
  <div id="views">
    <section class="view" id="v-enc"></section>
    <section class="view" id="v-var" hidden></section>
    <section class="view" id="v-kept" hidden></section>
    <section class="view" id="v-trail" hidden></section>
    <section class="view" id="v-film" hidden></section>
  </div>
  <nav id="nav"><button data-v="enc" class="on">Encounter<i></i></button><button data-v="var">Variations<i id="nvar"></i></button><button data-v="kept">Kept<i id="nkept"></i></button><button data-v="trail">Trail<i id="ntrail"></i></button><button data-v="film">Films<i id="nfilm"></i></button></nav>
</div>
<script src="markov/engine.js"></script>
<script src="markov/shared.js"></script>
<script src="party/cut-core.js"></script>
<script>
/* TAKES. A take is an exact audiovisual result: shots with their in and out points, sounds with their own in and out points and
   where they enter on the take's clock, and when the picture begins (it can begin after the sound). Takes never change. Exploring
   makes descendants that inherit most of a take and vary one relation, each with a plain note of what changed. Keeping preserves a
   take without a reason or a rating. A kept take stays a possible parent: explore from it, graft it onto the current one, revisit it.
   A relation found in a take (a place heard before it is seen; the picture outlasting the sound) can be kept as an operation and
   tried on other material. The trail keeps every take's origin; going back and exploring starts a new branch and leaves the others
   intact. Films are separate: a film is an arrangement you commit to, and a take can be in several films or none.
   Material: the lab's archive (markov/library.json, 16,153 shots with CLIP vectors), sounds measured as voice, music or noise
   (tools/sound-kinds.json), spoken lines and music (pictures/rushes.json), words to pictures (party/lexicon). Everything stays
   in this browser; export to keep it elsewhere. */
(async function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)], R2 = x => Math.round(x * 10) / 10;
  const thumbOf = u => u ? u.replace('/clips/', '/thumbnails/').replace(/\.mp4.*$/, '.jpg') : '';
  // ---- the archive
  let LIB, R, SK, X, XV, XI, SND = [], AMB = [];
  try { const [d, rj, sk, xj, xb] = await Promise.all([SH.load({ light: true }), fetch('pictures/rushes.json').then(r => r.json()), fetch('tools/sound-kinds.json').then(r => r.json()), fetch('party/lexicon.json').then(r => r.json()), fetch('party/lexicon.bin').then(r => r.arrayBuffer())]);
    LIB = d.LIB; R = rj; SK = sk.clips; X = xj; XV = new Int8Array(xb); XI = new Map(X.words.map((w, i) => [w, i]));
    const byId = new Map(LIB.shots.map((s, i) => [s.id, i])); for (const id in SK) { const k = byId.get(id), kind = SK[id][0]; if (k == null) continue; if (/noise|mixed|speech|music/.test(kind)) SND.push(k); if (/noise|mixed/.test(kind)) AMB.push(k); } }
  catch (e) { $('#boot').innerHTML = `<div><b>Takes</b>the archive did not load: ${esc(e.message)}</div>`; return; }
  const shot = k => LIB.shots[k], film = k => { const s = shot(k); return s ? (s.title || '').replace(/\s*\(.*$/, '').slice(0, 30) + (s.year ? ' ' + s.year : '') : ''; };
  const isArc = k => shot(k) && shot(k).kind !== 'presence' && (shot(k).dur || 0) >= 2.5;
  const norm = v => { let n = 0; for (const x of v) n += x * x; n = Math.sqrt(n) || 1; for (let j = 0; j < v.length; j++) v[j] /= n; return v; };
  const vecK = k => { const o = new Float32Array(512), r = k * 512; for (let j = 0; j < 512; j++) o[j] = LIB.q[r + j]; return norm(o); };
  const stem = w => { for (const x of ['ing', 'ed', 'es', 's']) if (w.length > x.length + 3 && w.endsWith(x)) return w.slice(0, -x.length); return w; };
  const vecW = t => { const ws = ((t || '').toLowerCase().match(/[a-z]+/g) || []).map(stem).filter(w => XI.has(w)); if (!ws.length) return null; const v = new Float32Array(512); ws.forEach(w => { const i = XI.get(w), f = X.idf[i]; for (let j = 0; j < 512; j++) v[j] += XV[i * 512 + j] * f; }); return norm(v); };
  const dotK = (v, k) => { let a = 0; const r = k * 512; for (let j = 0; j < 512; j++) a += v[j] * LIB.q[r + j]; return a; };
  function near(v, from = 4, to = 60, avoid = new Set()) { const s = LIB.sims(v), idx = []; for (let i = 0; i < s.length; i++) if (isArc(i) && !avoid.has(i)) idx.push(i); idx.sort((a, b) => s[b] - s[a]); return pick(idx.slice(from, to)); }
  const soundNear = (k, wrong) => { const v = vecK(k), r = AMB.slice().sort((a, b) => dotK(v, b) - dotK(v, a)); return wrong ? pick(r.slice(-80)) : pick(r.slice(0, 25)); };
  // ---- sounds: what they are and where they come from
  function src(s) { if (s.type === 'clip') return { u: shot(s.id).video, name: film(s.id), max: shot(s.id).dur || 6 };
    if (s.type === 'line') { const l = R.lines[s.id]; return { u: R.r2 + R.P[l.v[0]] + '/clips/' + l.v[1] + '.mp4', name: '“' + l.x + '”', text: l.x, max: 40 }; }
    if (s.type === 'music') { const m = R.music[s.id]; return { u: R.r2 + R.P[m.v[0]] + '/clips/' + m.v[1] + '.mp4', name: m.f, max: m.d || 30 }; } }
  const roleName = s => s.role === 'voice' ? 'The voice' : s.role === 'music' ? 'The music' : 'The sound of ' + (src(s.src).name || 'the place');
  const COL = { voice: 'var(--voice)', ambient: 'var(--amb)', music: 'var(--mus)' };
  // ---- the store: everything in this browser
  const KEY = 'takes.v1', load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } };
  let D = load() || { n: 0, takes: {}, kept: [], ops: [], films: [], cur: null, branches: 0, seen: {}, lastVar: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { } };
  const T = id => D.takes[id];
  // ---- a take's clock
  const plen = s => s.t1 - s.t0, slen = s => s.t1 - s.t0;
  const picEnd = t => t.pic0 + t.shots.reduce((a, s) => a + plen(s), 0);
  const dur = t => Math.max(picEnd(t), ...t.snds.map(s => s.at + slen(s)), .5);
  const t0 = t => Math.min(0, ...t.snds.map(s => s.at));
  // relations a take actually has, in words, each one keepable as an operation
  function relations(t) { const out = [], pe = picEnd(t);
    t.snds.forEach(s => { if (s.at < t.pic0 - .2) out.push({ type: 'lead', s: R2(t.pic0 - s.at), role: s.role, text: `${roleName(s)} begins <b>${R2(t.pic0 - s.at)}s</b> before the picture` }); });
    const se = Math.max(0, ...t.snds.map(s => s.at + slen(s))); if (t.snds.length && pe - se > .7) out.push({ type: 'tail', s: R2(pe - se), text: `The picture continues <b>${R2(pe - se)}s</b> after the sound ends` });
    t.snds.filter(s => s.role === 'voice').forEach(s => { let st = t.pic0; for (const sh of t.shots) { if (s.at >= st && s.at < st + plen(sh)) { out.push({ type: 'voiceAt', s: R2(s.at - st), text: `The line starts <b>${R2(s.at - st)}s</b> into a shot` }); break; } st += plen(sh); } });
    const marks = t.snds.map(s => [s.at, s.at + slen(s)]).sort((a, b) => a[0] - b[0]); let end = Math.min(t.pic0, ...marks.map(m => m[0])); for (const [a, b] of marks) { if (a - end > .8) out.push({ type: 'gap', s: R2(a - end), text: `<b>${R2(a - end)}s</b> of silence` }); end = Math.max(end, b); }
    const ks = t.shots.map(s => s.k); if (ks.some((k, i) => ks.indexOf(k) !== i)) out.push({ type: 'return', text: 'A shot <b>returns</b>' });
    return out; }
  const describe = t => { const r = relations(t)[0]; return r ? r.text.replace(/<[^>]+>/g, '') + '.' : `${t.shots.length} shot${t.shots.length > 1 ? 's' : ''}, ${t.snds.length} sound${t.snds.length === 1 ? '' : 's'}.`; };
  // ---- making takes: a first one, and descendants that inherit
  function make(base, parent, note, how) { const t = JSON.parse(JSON.stringify(base)); D.n++; t.id = 'T' + String(D.n).padStart(3, '0'); t.parent = parent ? parent.id : null; t.note = note || ''; t.how = how || ''; t.at = Date.now();
    t.branch = parent ? parent.branch : ++D.branches; t.shots.forEach(s => { s.t0 = R2(Math.max(0, s.t0)); s.t1 = R2(Math.max(s.t0 + .6, Math.min(shot(s.k).dur || s.t1, s.t1))); }); t.snds.forEach(s => { s.at = R2(s.at); s.t0 = R2(s.t0); s.t1 = R2(s.t1); });
    D.takes[t.id] = t; return t; }
  function seed() { const lines = R.lines.map((l, i) => i).filter(i => R.lines[i].t1 - R.lines[i].t0 < 4.5), li = pick(lines), L = R.lines[li], v = vecW(L.x);
    const k1 = v ? near(v, 0, 40) : near(vecK(Math.floor(rnd() * LIB.n)), 0, 400), k2 = near(vecK(k1), 6, 50, new Set([k1])), a = soundNear(k1);
    const s1 = shot(k1), i1 = Math.max(0, Math.min((s1.dur || 4) - 3.4, (s1.in || 0) - .5)), s2 = shot(k2), i2 = Math.max(0, Math.min((s2.dur || 4) - 2.6, (s2.in || 0) - .3));
    const base = { pic0: 0, shots: [{ k: k1, t0: i1, t1: i1 + 3.4 }, { k: k2, t0: i2, t1: i2 + 2.6 }], snds: [{ role: 'ambient', src: { type: 'clip', id: a }, t0: 0, t1: Math.min(6, shot(a).dur || 6), at: 0, vol: .7 }, { role: 'voice', src: { type: 'line', id: li }, t0: L.t0, t1: L.t1, at: .9, vol: 1 }] };
    return make(base, null, 'A first take from the archive.', 'seed'); }
  // one change to one relation; locks say what must stay
  const LOCK = { picture: ['swapShot', 'addShot', 'repeat', 'far'], sound: ['swapSound', 'dropVoice', 'wrongSound'], timing: ['shiftVoice', 'lead', 'tail', 'trim', 'gap', 'carry'] };
  function allowed(m) { return !Object.keys(D.locks || {}).some(l => D.locks[l] && LOCK[l].includes(m)); }
  function mutate(p, m, arg) { const t = JSON.parse(JSON.stringify(p)), V = t.snds.filter(s => s.role === 'voice'), A = t.snds.filter(s => s.role !== 'voice');
    switch (m) {
      case 'shiftVoice': { const s = V[0] || t.snds[0]; if (!s) return null; const d = arg != null ? arg : (rnd() < .5 ? -1 : 1) * R2(.5 + rnd() * 1.4); s.at = R2(s.at + d); return [t, `${roleName(s)} enters ${Math.abs(d)}s ${d < 0 ? 'earlier' : 'later'}.`]; }

        <div class="path">${path.map((x, i) => { const others = kids(x.id).filter(c => !path[i + 1] || c.id !== path[i + 1].id); return `<div class="node ${x.id === t.id ? 'cur' : ''} ${isKept(x.id) ? 'kept' : ''}"><img src="${esc(thumbOf(shot(x.shots[0].k).video))}" alt=""><div class="d"><b>${x.id} · branch ${x.branch}</b><div>${esc(x.note)}</div></div><div class="x"><button data-watch="${x.id}">▶</button>${x.id === t.id ? '' : `<button class="br" data-branch="${x.id}">branch</button>`}</div></div>${others.length ? `<div class="sib">${others.slice(0, 8).map(c => `<button data-watch="${c.id}"><img src="${esc(thumbOf(shot(c.shots[0].k).video))}" alt="">${c.id}</button>`).join('')}${others.length > 8 ? `<span class="note">+${others.length - 8}</span>` : ''}</div>` : ''}`; }).join('')}</div>
        <div class="kind">everything, by generation</div><div class="gens">${Object.keys(gens).sort((a, b) => a - b).map(g => `<div class="gen"><small>${g}</small>${gens[g].map(c => `<button data-watch="${c.id}" class="${c.id === t.id ? 'cur' : ''} ${isKept(c.id) ? 'kept' : ''}" title="${c.id}: ${esc(c.note)}"><img src="${esc(thumbOf(shot(c.shots[0].k).video))}" alt=""></button>`).join('')}</div>`).join('')}</div>`;
      document.querySelectorAll('[data-watch]').forEach(b => b.onclick = () => go(T(b.dataset.watch)));
      document.querySelectorAll('[data-branch]').forEach(b => b.onclick = () => { const x = T(b.dataset.branch); D.branches++; D.cur = x.id; const kids2 = explore(x); kids2.forEach(c => c.branch = D.branches); save(); show(x); tab('var'); }); }
    if (view === 'film') {
      $('#v-film').innerHTML = `<h2>Films</h2><div class="note">A film is something you commit to. A take can be in several, or in none.</div><div class="films">${D.films.map((f, i) => `<div class="film"><h3>${esc(f.name)}</h3><div class="strip">${f.items.map((id, j) => `<button data-fw="${id}"><img src="${esc(thumbOf(shot(T(id).shots[0].k).video))}" alt=""><b data-fx="${i}:${j}">×</b></button>`).join('') || '<span class="note">empty</span>'}</div><div class="small"><button data-fplay="${i}">▶ play</button><button data-fshare="${i}">share as a link</button></div></div>`).join('') || '<div class="note">No films yet. Use a take in a film from Encounter.</div>'}</div>`;
      document.querySelectorAll('[data-fw]').forEach(b => b.onclick = e => { if (e.target.dataset.fx) { const [i, j] = e.target.dataset.fx.split(':').map(Number); D.films[i].items.splice(j, 1); save(); render(); return; } go(T(b.dataset.fw)); });
      document.querySelectorAll('[data-fplay]').forEach(b => b.onclick = () => playFilm(D.films[+b.dataset.fplay]));
      document.querySelectorAll('[data-fshare]').forEach(b => b.onclick = async () => { const link = location.origin + location.pathname.replace(/takes\.html$/, '') + 'film.html#' + await Cut.encode(cutFilm(D.films[+b.dataset.fshare])); try { await navigator.clipboard.writeText(link); b.textContent = 'link copied'; } catch (e) { prompt('the film:', link); } }); } }
  function revisit() { const ks = D.kept.map(T).filter(Boolean); if (!ks.length) { flash('nothing kept yet'); return; } const q = ks.slice().sort((a, b) => (D.seen['t' + a.id] || a.at) - (D.seen['t' + b.id] || b.at))[0]; D.seen['t' + q.id] = Date.now(); go(q, 'enc'); }
  function toFilm(t) { const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div><h2>Use ${t.id} in…</h2>${D.films.map((f, i) => `<button class="row" data-f="${i}">${esc(f.name)} <span class="note">· ${f.items.length} takes</span></button>`).join('')}<button class="row" data-f="new">a new film</button><button class="row" data-f="x" style="color:var(--dim)">cancel</button></div>`;
    document.body.append(s); s.onclick = e => { const b = e.target.closest('[data-f]'); if (!b && e.target !== s) return; s.remove(); if (!b || b.dataset.f === 'x') return; let f; if (b.dataset.f === 'new') { f = { name: 'Film ' + (D.films.length + 1), items: [] }; D.films.push(f); const n = window.prompt('Name it (or leave it):', f.name); if (n) f.name = n.slice(0, 60); } else f = D.films[+b.dataset.f]; f.items.push(t.id); save(); render(); }; }
  function playFilm(f) { const list = f.items.map(T).filter(Boolean); let i = 0; const next = () => { const t = list[i++]; if (!t) return; drawTL(t); $('#sid').textContent = f.name + ' · ' + t.id; play(t, false); const my = tok; setTimeout(() => { if (my === tok) next(); }, (dur(t) - t0(t)) * 1000 + 150); }; next(); }
  function cutFilm(f) { const F = Cut.blank(f.name); f.items.map(T).filter(Boolean).forEach(t => { const z = t0(t), clips = []; if (t.pic0 - z > .2) clips.push(Cut.card('', R2(t.pic0 - z)));
      t.shots.forEach(s => clips.push(Cut.shot(shot(s.k).video, s.t0, s.t1, { d: shot(s.k).dur || null, label: film(s.k) }))); F.clips.push(...clips);
      t.snds.forEach(s => { const S = src(s.src), off = R2(s.at - z); F.sounds.push(s.role === 'music' ? Cut.music(clips[0].id, S.u, s.t0, slen(s), { off, vol: s.vol }) : Cut.voice(clips[0].id, S.u, s.t0, s.t1, { off, vol: s.vol, text: S.text || null })); }); }); return F; }
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => tab(b.dataset.v));
  $('#stap').onclick = () => { const t = playing || cur(); if (playing) stop(); else play(t); };
  window.__takes = { D: () => D, explore: () => explore(cur()), change: q => change(cur(), q), go: id => go(T(id)) };
  // ---- begin: open straight onto something playable
  let start = cur(); if (!start) { start = seed(); D.cur = start.id; save(); }
  $('#boot').remove(); show(start); tab('enc');
})();
</script>
