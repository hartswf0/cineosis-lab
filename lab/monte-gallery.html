<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monte Carlo Gallery</title>
<meta name="description" content="The gallery of the Monte Carlo Cinema: the printed films and the ones you kept, each with its found title and its chapters, to watch, save or send.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2d3cb'/%3E%3Cpath d='M6 26 A10 10 0 0 1 26 26 Z' fill='%23f25a17'/%3E%3Ccircle cx='12.5' cy='21' r='1.6' fill='%231a1b1f'/%3E%3Ccircle cx='19.5' cy='21' r='1.6' fill='%231a1b1f'/%3E%3Crect x='9' y='5' width='7' height='13' fill='%235600f5'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f2d3cb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{ --wall:#f2d3cb; --cream:#fbf3e4; --ink:#4a2027; --soft:#9a6b6b; --mustard:#e0ae48; --teal:#6fa9a2; --red:#a8323e; --sans:'Jost',Futura,'Century Gothic',sans-serif; --serif:'Cormorant Garamond',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; } body{ background:var(--wall); color:var(--ink); font:500 12px var(--sans); letter-spacing:.14em; text-transform:uppercase; overflow:hidden; }
button, a.b{ font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; text-decoration:none; }
#hall{ height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom)); gap:12px; }
header{ display:flex; align-items:center; justify-content:center; gap:22px; } header h1{ margin:0; font:600 clamp(13px,1.2vw,19px) var(--sans); letter-spacing:.42em; }
header h1::before, header h1::after{ content:'✦'; color:var(--mustard); margin:0 .8em; font-size:.7em; vertical-align:.15em; } header a{ color:var(--soft); text-decoration:none; font-size:clamp(10px,.85vw,13px); letter-spacing:.24em; }
.tabs{ display:flex; justify-content:center; gap:20px; } .tabs button{ font-size:clamp(10px,.9vw,14px); letter-spacing:.3em; padding-bottom:3px; border-bottom:1.5px solid transparent; } .tabs button.on{ border-bottom-color:var(--red); }
/* the room: a framed picture on the left, its programme on the right; on a phone, one above the other */
#room{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:clamp(16px,3vw,48px); align-items:center; min-height:0; max-width:1300px; margin:0 auto; width:100%; }
#well{ min-height:0; height:100%; container-type:size; display:grid; place-items:center; }
#frame{ width:min(100cqw - 18px, (100cqh - 18px) * 4 / 3); aspect-ratio:4/3; background:var(--red); padding:10px; border-radius:3px; box-shadow:0 0 0 3px var(--mustard), 0 0 0 9px var(--red), 0 18px 40px #6a2a2a33; display:flex; position:relative; }
#pic{ flex:1; background:#1a1210 center/contain no-repeat; position:relative; overflow:hidden; } #pic video{ position:absolute; inset:0; width:100%; height:100%; background:#1a1210; }
#plate{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); padding:6px 16px; border-radius:3px; background:linear-gradient(#f3d58c,#d9a945 55%,#c8963a); color:#4a2a12; box-shadow:inset 0 1px #fff8, 0 2px 4px #8a5a2a55; font-size:clamp(9px,.8vw,12px); letter-spacing:.24em; white-space:nowrap; }
#prog{ min-height:0; overflow:auto; padding:4px 4px 10px; }
.kind{ font-size:clamp(9px,.8vw,12px); letter-spacing:.32em; color:var(--red); }
#title{ font:500 clamp(26px,3.2vw,52px)/1.05 var(--serif); letter-spacing:0; text-transform:none; margin:10px 0 6px; }
.meta{ color:var(--soft); font-size:clamp(9.5px,.85vw,13px); letter-spacing:.22em; margin-bottom:16px; }
ol{ margin:0 0 18px; padding:0; list-style:none; counter-reset:c; } ol li{ counter-increment:c; display:grid; grid-template-columns:2.2em 1fr; gap:.4em; font:italic 400 clamp(16px,1.45vw,22px)/1.3 var(--serif); letter-spacing:0; text-transform:none; margin-bottom:.45em; }
ol li::before{ content:counter(c, upper-roman) '.'; font:500 .62em var(--sans); letter-spacing:.2em; color:var(--mustard); padding-top:.45em; text-align:right; }
.acts{ display:flex; flex-wrap:wrap; gap:10px; } .acts .b{ border:1.5px solid var(--ink); border-radius:22px; padding:9px 16px; font-size:clamp(10px,.85vw,13px); letter-spacing:.24em; } .acts .b.main{ background:var(--ink); color:var(--cream); } .acts .b:hover{ background:var(--ink); color:var(--cream); }
.note{ margin-top:14px; color:var(--soft); font:italic 400 clamp(13px,1.05vw,16px)/1.35 var(--serif); letter-spacing:0; text-transform:none; }
/* the corridor: every film, small, in a row */
#corr{ display:flex; gap:10px; justify-content:center; align-items:center; } #corr .arrow{ font-size:22px; padding:0 6px; color:var(--soft); }
#thumbs{ display:flex; gap:8px; overflow:hidden; max-width:min(900px, 100% - 80px); } .th{ flex:none; width:clamp(64px,7vw,104px); aspect-ratio:4/3; background:#ccc center/cover; border:4px solid var(--cream); cursor:pointer; opacity:.6; transition:opacity .2s, transform .2s; } .th.on{ opacity:1; transform:translateY(-4px); box-shadow:0 0 0 2px var(--ink); }
.empty{ font:italic 400 18px var(--serif); text-transform:none; letter-spacing:0; color:var(--soft); text-align:center; }
.ticket{ position:fixed; left:50%; bottom:22%; z-index:9; width:250px; margin-left:-125px; padding:12px 10px; text-align:center; font:600 14px var(--sans); letter-spacing:.2em; color:var(--ink); background:var(--cream); border:2px dashed var(--red); outline:6px solid var(--cream); box-shadow:0 10px 30px #0003; animation:tk 2.6s cubic-bezier(.2,.9,.3,1) forwards; pointer-events:none; text-transform:none; }
.ticket small{ display:block; font-size:9px; letter-spacing:.3em; color:var(--red); margin:3px 0; text-transform:uppercase; } @keyframes tk{ 0%{ transform:translateY(60px) rotate(-4deg); opacity:0; } 18%{ transform:none; opacity:1; } 80%{ opacity:1; } 100%{ transform:translateY(-40px); opacity:0; } }
@media (max-width:760px){ #room{ grid-template-columns:1fr; grid-template-rows:minmax(0,46%) minmax(0,1fr); gap:30px; align-items:start; } header{ flex-wrap:wrap; gap:8px 16px; } header h1{ width:100%; text-align:center; font-size:12px; letter-spacing:.3em; } #title{ margin-top:4px; font-size:26px; } ol li{ font-size:15.5px; } #prog{ align-self:stretch; height:100%; } .acts .b{ padding:8px 12px; } }
</style></head><body>
<div id="hall">
  <header><h1>THE GALLERY</h1><div class="tabs"><button data-t="prints" class="on">THE PRINTS</button><button data-t="kept">KEPT</button></div><a href="monte.html">THE MACHINE ↗</a></header>
  <div id="room"><div id="well"><div id="frame"><div id="pic"></div><div id="plate"></div></div></div><div id="prog"></div></div>
  <div id="corr"><button class="arrow" id="prev">‹</button><div id="thumbs"></div><button class="arrow" id="nextb">›</button></div>
</div>
<script src="monte/sim.js"></script>
<script src="monte/film.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MC = window.MonteCinema, MF = window.MonteFilm, NUM = ['ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT'];
  let M = null, rooms = { prints: [], kept: [] }, tab = 'prints', at = 0;
  const thumb = k => M.r2 + M.shots[k].v.replace('/clips/', '/thumbnails/').replace('.mp4', '.jpg');
  const here = () => location.href.split('#')[0];
  function film(f, extra) { MC.critic(M, f); return Object.assign({ f, title: MF.title(M, f), ch: MF.chapters(M, f), sec: MF.seconds(f), code: MF.encode(M, f), pic: thumb(f.ev[0].k) }, extra); }
  function show() { const list = rooms[tab]; $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    if (!list.length) { $('#pic').style.backgroundImage = ''; $('#pic').innerHTML = ''; $('#plate').textContent = 'AN EMPTY WALL';
      $('#prog').innerHTML = `<div class="empty">Nothing kept yet. In the machine, pull the lever and star the film you like; it will hang here.</div><div class="acts" style="margin-top:16px;justify-content:center"><a class="b main" href="monte.html">TO THE MACHINE</a></div>`; $('#thumbs').innerHTML = ''; return; }
    at = (at + list.length) % list.length; const x = list[at];
    $('#pic').innerHTML = ''; $('#pic').style.backgroundImage = `url('${esc(x.pic)}')`;
    $('#plate').textContent = x.mp4 ? `PRINT NO. ${x.n + 1}` : x.sent ? 'A FILM SENT TO YOU' : `KEPT · GENERATION ${x.at ?? '—'}`;
    $('#prog').innerHTML = `<div class="kind">${x.mp4 ? 'A PRINTED FILM' : 'A FILM OF CHANCE'} · IN ${NUM[x.ch.length - 1] || x.ch.length} CHAPTERS</div>
      <div id="title">“${esc(x.title)}”</div>
      <div class="meta">${x.sec} SECONDS · ${x.f.ev.filter(e => e.kind === 'shot').length} SHOTS · ${x.ch.length} CARDS · ${x.f.score.toFixed(2)}</div>
      <ol>${x.ch.map(c => `<li>${esc(c)}</li>`).join('')}</ol>
      <div class="acts">${x.mp4 ? `<button class="b main" id="play">▶ PLAY</button><a class="b" href="${esc(x.mp4)}" download="${esc(x.title.replace(/[^\w ]+/g, '').trim().replace(/ +/g, '-').toLowerCase() || 'monte-film')}.mp4">SAVE</a>` : `<a class="b main" href="monte.html#f=${x.code}">▶ WATCH IN THE MACHINE</a>`}<button class="b" id="send">SEND</button>${x.kept ? '<button class="b" id="forget">TAKE DOWN</button>' : ''}</div>
      <div class="note">${x.mp4 ? 'Every picture, card and note is archival, cut the way Precisely So was cut. Nothing typed, nothing graded.' : 'Plays from the archive itself, piece by piece. Its link carries the whole film: whoever opens it sees exactly this one.'}</div>`;
    const p = $('#play'); if (p) p.onclick = () => { $('#pic').innerHTML = `<video src="${esc(x.mp4)}" controls autoplay playsinline></video>`; };
    $('#send').onclick = () => send(x); const fg = $('#forget'); if (fg) fg.onclick = () => forget(x);
    $('#thumbs').innerHTML = list.map((y, k) => `<div class="th${k === at ? ' on' : ''}" data-k="${k}" title="${esc(y.title)}" style="background-image:url('${esc(y.pic)}')"></div>`).join('');
    $$('#thumbs .th').forEach(d => d.onclick = () => { at = +d.dataset.k; show(); }); const on = $('#thumbs .th.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); }
  async function send(x) { const url = x.mp4 ? here() + '#p=' + (x.n + 1) : here() + '#f=' + x.code;
    try { if (navigator.share) { await navigator.share({ title: x.title, text: `“${x.title}” — a film the archive made by chance`, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); const d = document.createElement('div'); d.className = 'ticket'; d.innerHTML = `<small>LINK COPIED</small>“${esc(x.title)}”<small>IT OPENS THIS FILM</small>`; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); } catch (e) { prompt('Copy this link', url); } }
  function forget(x) { let kept = []; try { kept = JSON.parse(localStorage.getItem('monte-kept') || '[]'); } catch (e) { }
    kept = kept.filter(r => (r.code || '') !== x.code && !(r.seed === x.seed && !r.code)); try { localStorage.setItem('monte-kept', JSON.stringify(kept)); } catch (e) { }
    rooms.kept = rooms.kept.filter(y => y !== x); show(); }
  $$('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; at = 0; show(); });
  $('#prev').onclick = () => { at--; show(); }; $('#nextb').onclick = () => { at++; show(); };
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') $('#prev').onclick(); if (e.key === 'ArrowRight') $('#nextb').onclick(); });
  let tx = null; $('#room').addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true }); $('#room').addEventListener('touchend', e => { if (tx == null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) { at += d < 0 ? 1 : -1; show(); } tx = null; });
  Promise.all([fetch('monte/material.json').then(r => r.json()), fetch('monte/evolution.json').then(r => r.json())]).then(async ([m, ev]) => {
    M = MC.load(m);
    const have = await Promise.all(ev.best.map((b, n) => fetch(`monte/film-${n}.mp4`, { method: 'HEAD' }).then(r => r.ok).catch(() => false)));
    rooms.prints = ev.best.map((b, n) => { if (!have[n]) return null; try { return film(MF.fromPrint(M, b), { mp4: `monte/film-${n}.mp4`, n }); } catch (e) { return null; } }).filter(Boolean);
    let kept = []; try { kept = JSON.parse(localStorage.getItem('monte-kept') || '[]'); } catch (e) { }
    rooms.kept = kept.map(r => { try { const f = r.code ? MF.decode(M, r.code) : MC.generate(M, r.g, r.seed, new Set(r.av || []), new Set(r.sp || [])); return film(f, { kept: true, at: r.at, seed: r.seed }); } catch (e) { return null; } }).filter(Boolean);
    const h = location.hash, f = (h.match(/f=([\w-]+)/) || [])[1], p = +((h.match(/p=(\d+)/) || [])[1] || 0);
    if (f) try { const x = film(MF.decode(M, f), { sent: true }); const k = rooms.kept.findIndex(y => y.code === x.code); if (k >= 0) at = k; else rooms.kept.unshift(x); tab = 'kept'; } catch (e) { }
    if (p) { tab = 'prints'; at = Math.max(0, rooms.prints.findIndex(y => y.n === p - 1)); }
    $$('.tabs button')[1].textContent = `KEPT (${rooms.kept.length})`; show();
  });
})();
</script></body></html>
