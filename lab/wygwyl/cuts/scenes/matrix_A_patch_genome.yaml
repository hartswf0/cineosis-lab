title: WYGWYL · Scenes
seed: 'Fourteen poem films on one 24-minute clock, cut from archival shots: one full-frame shot per patch, never repeated.'
diegesis:
  premise: A poem suite read over a continuous score; images are found footage standing in for its situations.
  world_rules:
  - one shot per patch, full frame
  - no shot repeats
  - cuts fall on cue edges and score onsets
  - found people are not the poem's characters
  core_entities:
  - animal
  - architecture
  - birds
  - crowd
  - diagram
  - face close-up
  - hands
  - interior
  - landscape
  - machine
  - object
  - pattern
  - person
  - plants
  core_locations:
  - ALASKAN EARTHQUAKE
  - AUTOMOBILE ECONOMY TEST, ca. 1938
  - Adelante Cubanos (Part I)
  - Alaska's Silver Millions (Part I)
  - Alice In Wonderland
  - All My Babies
  - American Frontier (Part I)
  - 'Apollo 12: Pinpoint for Science'
  - De Joodsche invalide
  - Duck and Cover
  - 'Eagle Has Landed: The Flight of Apollo 11'
  - Garden Wise (Pt 1)
  - Gardening
  - Het crematorium Westerveld
