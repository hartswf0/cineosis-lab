title: WYGWYL · Suite
seed: 'Fourteen poem films on one 24-minute clock, cut from archival shots: one full-frame shot per patch, never repeated.'
diegesis:
  premise: A poem suite read over a continuous score; images are found footage standing in for its situations.
  world_rules:
  - one shot per patch, full frame
  - no shot repeats
  - cuts fall on cue edges and score onsets
  - found people are not the poem's characters
  core_entities:
  - animal
  - architecture
  - birds
  - crowd
  - diagram
  - face close-up
  - hands
  - interior
  - landscape
  - machine
  - object
  - pattern
  - person
  - plants
  core_locations:
  - '''Till It Helps!'
  - ALASKAN EARTHQUAKE
  - ANTARTICA, 1939 - 1941
  - AUTOMOBILE ECONOMY TEST, ca. 1938
  - Alice In Wonderland
  - All My Babies
  - Amateur Film Medicus09a
  - Amateur Film Northwest
  - Another Suburban Sky - May 2007 Another Suburban Sky
  - Appreciating Our Parents
  - 'Bacteria: Friend and Foe'
  - Beginning to Date
  - Boy in Court
  - California Picture Book
