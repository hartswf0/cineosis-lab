<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 / KEN KNOWLTON — A Film Made of Stills &amp; 9-Cut Live Multi-Scale Quadtree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#050506;color:#efe9dd;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    overflow:hidden;user-select:none;
  }
  .knowlton-shell{
    position:fixed;top:40px;left:0;right:0;bottom:148px;
    display:grid;grid-template-columns:1.08fr 1fr;
    gap:10px;padding:8px 16px;
  }
  .pane{
    position:relative;border:1px solid rgba(239,233,221,.14);
    background:#08090c;overflow:hidden;display:flex;flex-direction:column;
  }
  .pane-head{
    height:34px;padding:0 12px;border-bottom:1px solid rgba(239,233,221,.12);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(239,233,221,.75);
    background:rgba(10,12,16,.95);flex-shrink:0;
  }
  .pane-head b{color:#e8c070;font-weight:600}
  .k-btns{display:flex;align-items:center;gap:4px}
  .k-btn{
    background:rgba(255,255,255,.04);border:1px solid rgba(239,233,221,.16);
    color:rgba(239,233,221,.72);font:500 8px/1 'IBM Plex Mono',monospace;
    letter-spacing:.12em;padding:4px 6px;cursor:pointer;text-transform:uppercase;
  }
  .k-btn:hover{color:#fff;border-color:rgba(239,233,221,.45)}
  .k-btn.on{background:#e8c070;color:#050505;border-color:#e8c070;font-weight:600}

  .canvas-wrap{
    position:relative;flex:1;background:#030406;overflow:hidden;
  }
  .canvas-wrap canvas{
    width:100%;height:100%;display:block;cursor:crosshair;
  }

  /* LOUPE INSPECTOR OVERLAY ON LEFT MOSAIC */
  .mosaic-loupe{
    position:absolute;bottom:10px;left:10px;right:10px;
    padding:7px 10px;background:rgba(6,8,12,.9);
    border:1px solid rgba(232,192,112,.32);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:8.5px;letter-spacing:.11em;pointer-events:none;
  }
  .ml-left{display:flex;align-items:center;gap:8px}
  .ml-thumb{width:56px;height:32px;object-fit:cover;border:1px solid rgba(232,192,112,.45);background:#000}
  .ml-line{
    font:italic 400 11.5px/1.25 'Fraunces',Georgia,serif;color:#77e4b6;
    text-transform:none;letter-spacing:.01em;max-width:340px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  @media (max-width:980px){
    .knowlton-shell{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  }
</style>
</head>
<body>

<main class="knowlton-shell">
  <!-- LEFT PANE: LIVE VIDEO RECONSTRUCTED ENTIRELY OUT OF FILM STILLS -->
  <section class="pane">
    <div class="pane-head">
      <span><b>A FILM MADE OF STILLS</b> · SOURCE: <span id="mosaicSourceLabel" style="color:#41e096">ACTIVE SPOKEN TAKE</span></span>
      <div class="k-btns">
        <button class="k-btn" data-grid="20">20×12 STILLS</button>
        <button class="k-btn on" data-grid="30">30×18 STILLS</button>
        <button class="k-btn" data-grid="42">42×25 MICRO</button>
        <button class="k-btn on" id="btnGlyphOverlay" title="Overlay Belk/Knowlton Typographic Density Sub-Characters">GLYPHS: ON</button>
      </div>
    </div>
    <div class="canvas-wrap" id="leftWrap">
      <canvas id="mosaicCanvas"></canvas>
      <div class="mosaic-loupe">
        <div class="ml-left">
          <img class="ml-thumb" id="loupeThumb" src="thumbs/wg_001.jpg" alt="Tile Still">
          <div>
            <div style="color:#e8c070;font-weight:600" id="loupeTitle">TILE STILL: WG_001 · LUM 112</div>
            <div style="color:rgba(239,233,221,.62);margin-top:2px" id="loupeSub">302 WARGAMES STILLS + 32 BEAT ARCHIVE STILLS</div>
          </div>
        </div>
        <div class="ml-line" id="loupeSpoken">"Loading spoken line..."</div>
      </div>
    </div>
  </section>

  <!-- RIGHT PANE: 9 SIMULTANEOUS LIVE VIDEO CUTS IN KNOWLTON QUADTREE -->
  <section class="pane">
    <div class="pane-head">
      <span><b>9 SIMULTANEOUS LIVE CUTS</b> · MULTI-SCALE QUADTREE &amp; 8-FRAME STRIPS</span>
      <div class="k-btns">
        <button class="k-btn on" id="btnAutoFollowVoice" title="Automatically switch Left Stills Mosaic between 1983 Call and Archival Answer Video">FOLLOW VOICE DUET: ON</button>
      </div>
    </div>
    <div class="canvas-wrap" id="rightWrap">
      <canvas id="quadCanvas"></canvas>
    </div>
  </section>
</main>

<script src="wg-studio-nav.js"></script>
<script>
(() => {
  'use strict';

  const mosaicCanvas = document.getElementById('mosaicCanvas');
  const mCtx = mosaicCanvas.getContext('2d');
  const quadCanvas = document.getElementById('quadCanvas');
  const qCtx = quadCanvas.getContext('2d');

  // Offscreen sampler for reading the live playing video's RGB/luminance grid
  const sampleCanvas = document.createElement('canvas');
  const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

  const QUAD_CUTS = [
    { key: '1983',       label: '1983 MASTER TRIO',   color: '#45b1ff' },
    { key: 'take_video', label: 'SPOKEN LINE TAKE',   color: '#41e096' },
    { key: 'synthesis',  label: 'APEX SYNTHESIS',     color: '#e8c070' },
    { key: 'clip',       label: 'CLIP VISUAL',        color: '#c084fc' },
    { key: 'vjepa',      label: 'V-JEPA MOTION',      color: '#ff6b57' },
    { key: 'blip',       label: 'BLIP DIEGETIC',      color: '#38bdf8' },
    { key: 'cineosis',   label: 'CINEOSIS 44-SIGN',   color: '#facc15' },
    { key: 'trurl',      label: 'TRURL PHOSPHOR',     color: '#34d399' },
    { key: 'murch',      label: 'MURCH SPOKEN FACE',  color: '#fb7185' },
  ];

  const GLYPHS = [' ', '.', ':', '-', '=', '+', '*', '#', '%', '@'];

  let stillsAtlas = [];
  const lumBuckets = Array.from({ length: 32 }, () => []);
  const imgCache = new Map();

  function getImg(src) {
    if (!src) return null;
    if (imgCache.has(src)) return imgCache.get(src);
    const im = new Image();
    im.src = src;
    imgCache.set(src, im);
    return im;
  }

  let gridCols = 30;
  let glyphOverlay = true;
  let autoFollowVoice = true;
  let selectedCutKey = 'take_video';
  let hoverTileInfo = null;
  let quadCellRects = [];
  let frameTick = 0;
  let engine = null;

  const nav = WGStudioNav.mount({
    theme: 'dark',
    num: '03',
    titleLeft: '03 / KEN KNOWLTON — A FILM MADE OF STILLS',
    promptCenter: 'CLICK ANY RIGHT QUADTREE CUT TO PROMOTE INTO THE STILLS MOSAIC · HOVER TILES TO INSPECT',
    onPrevBeat: () => engine && engine.prevBeat(),
    onNextBeat: () => engine && engine.nextBeat(),
    onReset: () => {
      gridCols = 30;
      autoFollowVoice = true;
      selectedCutKey = 'take_video';
      document.getElementById('btnAutoFollowVoice').classList.add('on');
      document.querySelectorAll('[data-grid]').forEach(b => b.classList.toggle('on', b.dataset.grid === '30'));
    }
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const lw = document.getElementById('leftWrap').getBoundingClientRect();
    const rw = document.getElementById('rightWrap').getBoundingClientRect();
    mosaicCanvas.width = Math.max(100, Math.floor(lw.width * dpr));
    mosaicCanvas.height = Math.max(100, Math.floor(lw.height * dpr));
    mCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    quadCanvas.width = Math.max(100, Math.floor(rw.width * dpr));
    quadCanvas.height = Math.max(100, Math.floor(rw.height * dpr));
    qCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  setTimeout(resize, 30);

  // Controls
  document.querySelectorAll('[data-grid]').forEach(btn => {
    btn.addEventListener('click', () => {
      gridCols = parseInt(btn.getAttribute('data-grid'), 10) || 30;
      document.querySelectorAll('[data-grid]').forEach(b => b.classList.toggle('on', b === btn));
    });
  });
  document.getElementById('btnGlyphOverlay').onclick = e => {
    glyphOverlay = !glyphOverlay;
    e.currentTarget.classList.toggle('on', glyphOverlay);
    e.currentTarget.textContent = glyphOverlay ? 'GLYPHS: ON' : 'GLYPHS: OFF';
  };
  document.getElementById('btnAutoFollowVoice').onclick = e => {
    autoFollowVoice = !autoFollowVoice;
    e.currentTarget.classList.toggle('on', autoFollowVoice);
    e.currentTarget.textContent = autoFollowVoice ? 'FOLLOW VOICE DUET: ON' : 'FOLLOW VOICE DUET: LOCKED';
  };

  // Build Luminance Index of all 302 WarGames Stills + Beat Candidate Stills
  function indexStillsAtlas(atlas, beat) {
    for (let b = 0; b < 32; b++) lumBuckets[b] = [];
    const combined = [...atlas];
    if (beat && beat.cuts) {
      Object.values(beat.cuts).forEach(units => {
        (units || []).forEach(u => {
          if (u.thumb) {
            combined.push({ id: u.id, thumb: u.thumb, strip: u.strip, title: u.title, lum: 95 });
          }
        });
      });
    }
    combined.forEach((st, idx) => {
      getImg(st.thumb);
      const lum = st.lum != null ? st.lum : ((idx * 19) % 210 + 18);
      const bucket = Math.max(0, Math.min(31, Math.floor((lum / 255) * 31)));
      lumBuckets[bucket].push(st);
    });
    // Ensure every bucket has candidates
    let lastNonEmpty = combined.slice(0, 8);
    for (let b = 0; b < 32; b++) {
      if (lumBuckets[b].length) lastNonEmpty = lumBuckets[b];
      else lumBuckets[b] = lastNonEmpty;
    }
  }

  function drawCutVideoOrFallback(targetCtx, st, cutKey, x, y, w, h, subIdx = 0) {
    const vid = cutKey === 'take_video' ? st.getTakeVideo() : st.getCutVideo(cutKey);
    const unit = cutKey === 'take_video' ? st.activeTake : st.getCutUnit(cutKey);
    if (vid && vid.readyState >= 2 && vid.videoWidth > 0) {
      try {
        targetCtx.drawImage(vid, x, y, w, h);
        return true;
      } catch (_) {}
    }
    const stripImg = unit?.strip ? getImg(unit.strip) : null;
    if (stripImg && stripImg.complete && stripImg.naturalWidth > 0) {
      const fw = stripImg.naturalWidth / 8;
      targetCtx.drawImage(stripImg, (subIdx % 8) * fw, 0, fw, stripImg.naturalHeight, x, y, w, h);
      return true;
    }
    const thImg = unit?.thumb ? getImg(unit.thumb) : (st.beat?.wg_shot?.thumb ? getImg(st.beat.wg_shot.thumb) : null);
    if (thImg && thImg.complete && thImg.naturalWidth > 0) {
      targetCtx.drawImage(thImg, x, y, w, h);
      return true;
    }
    return false;
  }

  // Hover on Left Mosaic to inspect which still forms that tile
  mosaicCanvas.addEventListener('pointermove', e => {
    const rect = mosaicCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    hoverTileInfo = { mx, my };
  });

  // Click on Right Quadtree to promote any of the 9 live cuts into the Left Stills Mosaic
  quadCanvas.addEventListener('pointerdown', e => {
    const rect = quadCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    for (const c of quadCellRects) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        selectedCutKey = c.key;
        autoFollowVoice = false;
        const btn = document.getElementById('btnAutoFollowVoice');
        btn.classList.remove('on');
        btn.textContent = 'FOLLOW VOICE DUET: LOCKED';
        break;
      }
    }
  });

  function renderLeftMosaic(st) {
    const rect = document.getElementById('leftWrap').getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    if (W < 20 || H < 20) return;

    // In autoFollowVoice mode, show 1983 speaker during '1983' call and Archival Spoken Take during 'arch' answer!
    const activeKey = autoFollowVoice ? (st.turnPhase === '1983' ? '1983' : 'take_video') : selectedCutKey;
    const cutMeta = QUAD_CUTS.find(c => c.key === activeKey) || QUAD_CUTS[0];
    document.getElementById('mosaicSourceLabel').textContent = cutMeta.label;
    document.getElementById('mosaicSourceLabel').style.color = cutMeta.color;

    const cols = gridCols;
    const rows = Math.max(10, Math.round(cols * (H / W) * 1.15));
    sampleCanvas.width = cols;
    sampleCanvas.height = rows;

    // Draw live moving video frame into tiny sampleCanvas
    sampleCtx.fillStyle = '#141820';
    sampleCtx.fillRect(0, 0, cols, rows);
    const subIdx = Math.floor((st.beatClock * 4) % 8);
    drawCutVideoOrFallback(sampleCtx, st, activeKey, 0, 0, cols, rows, subIdx);

    let pxData = null;
    try {
      pxData = sampleCtx.getImageData(0, 0, cols, rows).data;
    } catch (_) {}

    mCtx.fillStyle = '#040507';
    mCtx.fillRect(0, 0, W, H);

    const cellW = W / cols;
    const cellH = H / rows;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let R = 40, G = 95, B = 85;
        if (pxData) {
          const off = (r * cols + c) * 4;
          R = pxData[off];
          G = pxData[off + 1];
          B = pxData[off + 2];
        } else {
          // Procedural fallback gradient if tainted
          const wave = Math.sin(c * 0.25 + frameTick * 0.06) * Math.cos(r * 0.25);
          R = 45 + wave * 40; G = 110 + wave * 65; B = 95 + wave * 50;
        }
        // Boost contrast slightly so dark WarGames terminal shots pop clearly in the mosaic
        const lum = Math.min(255, Math.max(0, (0.299 * R + 0.587 * G + 0.114 * B) * 1.35 + 14));
        const bucketIdx = Math.max(0, Math.min(31, Math.floor((lum / 255) * 31)));
        const bucket = lumBuckets[bucketIdx];
        const stillItem = bucket.length ? bucket[(r * 7 + c * 3) % bucket.length] : null;

        const x = c * cellW;
        const y = r * cellH;

        const im = stillItem ? getImg(stillItem.thumb) : null;
        if (im && im.complete && im.naturalWidth > 0) {
          mCtx.drawImage(im, x, y, cellW - 0.6, cellH - 0.6);
          // Tint slightly with target video chromaticity so the macro-portrait is razor-legible
          mCtx.fillStyle = `rgba(${R},${G},${B},0.34)`;
          mCtx.fillRect(x, y, cellW - 0.6, cellH - 0.6);
        } else {
          mCtx.fillStyle = `rgb(${R},${G},${B})`;
          mCtx.fillRect(x, y, cellW - 0.6, cellH - 0.6);
        }

        if (glyphOverlay && cellW >= 11) {
          const gChar = GLYPHS[Math.min(GLYPHS.length - 1, Math.floor((lum / 255) * GLYPHS.length))];
          if (gChar !== ' ') {
            mCtx.fillStyle = `rgba(255,255,255,0.28)`;
            mCtx.font = `600 ${Math.max(7, Math.floor(cellH * 0.55))}px 'IBM Plex Mono', monospace`;
            mCtx.fillText(gChar, x + 2, y + cellH * 0.74);
          }
        }

        // Check if mouse is hovering this tile
        if (hoverTileInfo && hoverTileInfo.mx >= x && hoverTileInfo.mx < x + cellW && hoverTileInfo.my >= y && hoverTileInfo.my < y + cellH) {
          mCtx.strokeStyle = '#e8c070';
          mCtx.lineWidth = 1.6;
          mCtx.strokeRect(x + 0.5, y + 0.5, cellW - 1, cellH - 1);
          if (stillItem && frameTick % 4 === 0) {
            document.getElementById('loupeThumb').src = stillItem.thumb;
            document.getElementById('loupeTitle').textContent =
              `TILE [${c},${r}] · ${(stillItem.id || 'STILL').toUpperCase()} · LUM ${Math.round(lum)}`;
            document.getElementById('loupeSub').textContent =
              stillItem.title || `WarGames 1983 8-Frame Atlas Still (${stillItem.id})`;
          }
        }
      }
    }

    // Update loupe spoken caption
    if (frameTick % 8 === 0) {
      const tr = st.activeTurn;
      const tk = st.activeTake;
      document.getElementById('loupeSpoken').textContent =
        st.turnPhase === '1983'
          ? `1983 (${tr?.speaker || 'Speaker'}): "${tr?.text || ''}"`
          : `Archive (${tk?.title || 'Film'}): "${tk?.spoken || ''}"`;
    }
  }

  function renderRightQuadtree(st) {
    const rect = document.getElementById('rightWrap').getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    if (W < 20 || H < 20) return;

    qCtx.fillStyle = '#040507';
    qCtx.fillRect(0, 0, W, H);

    // Multi-Scale Quadtree layout for all 9 simultaneous live cuts:
    // Top-Left quadrant: 2 Hero Cells (1983 Master Trio + Active Spoken Line Take)
    // Top-Right quadrant: 2 Critic Synthesis Cells (Apex Synthesis + V-JEPA Motion)
    // Bottom half: 5 Simultaneous Cut Cells + their live 8-frame sub-shot strips
    const pad = 4;
    const topH = H * 0.54;
    const botH = H - topH;

    const cells = [
      { ...QUAD_CUTS[0], x: pad,            y: pad,            w: W * 0.5 - pad * 1.5, h: topH * 0.5 - pad * 1.5 },
      { ...QUAD_CUTS[1], x: pad,            y: topH * 0.5,     w: W * 0.5 - pad * 1.5, h: topH * 0.5 - pad },
      { ...QUAD_CUTS[2], x: W * 0.5 + 2,    y: pad,            w: W * 0.5 - pad * 1.5, h: topH * 0.5 - pad * 1.5 },
      { ...QUAD_CUTS[4], x: W * 0.5 + 2,    y: topH * 0.5,     w: W * 0.5 - pad * 1.5, h: topH * 0.5 - pad },
      // Bottom row: 5 simultaneous critic/species cuts
      { ...QUAD_CUTS[3], x: pad,                 y: topH + 2, w: (W - pad * 2) / 5 - 3, h: botH - pad - 2 },
      { ...QUAD_CUTS[5], x: pad + (W - pad * 2) * 0.2, y: topH + 2, w: (W - pad * 2) / 5 - 3, h: botH - pad - 2 },
      { ...QUAD_CUTS[6], x: pad + (W - pad * 2) * 0.4, y: topH + 2, w: (W - pad * 2) / 5 - 3, h: botH - pad - 2 },
      { ...QUAD_CUTS[7], x: pad + (W - pad * 2) * 0.6, y: topH + 2, w: (W - pad * 2) / 5 - 3, h: botH - pad - 2 },
      { ...QUAD_CUTS[8], x: pad + (W - pad * 2) * 0.8, y: topH + 2, w: (W - pad * 2) / 5 - 3, h: botH - pad - 2 },
    ];
    quadCellRects = cells;

    const activeKey = autoFollowVoice ? (st.turnPhase === '1983' ? '1983' : 'take_video') : selectedCutKey;
    const subIdx = Math.floor((st.beatClock * 4) % 8);

    cells.forEach((c, idx) => {
      const unit = c.key === 'take_video' ? st.activeTake : st.getCutUnit(c.key);
      const isSelected = c.key === activeKey;

      // Draw live video inside upper 76% of cell
      const vidH = c.h * 0.76;
      qCtx.save();
      qCtx.beginPath();
      qCtx.rect(c.x, c.y, c.w, vidH);
      qCtx.clip();
      drawCutVideoOrFallback(qCtx, st, c.key, c.x, c.y, c.w, vidH, (subIdx + idx) % 8);
      qCtx.restore();

      // Draw 8-frame strip sub-stills bar along bottom 24% of cell ("film made of stills")
      const stripY = c.y + vidH;
      const stripH = c.h - vidH;
      const stripImg = unit?.strip ? getImg(unit.strip) : (st.beat?.wg_shot?.strip ? getImg(st.beat.wg_shot.strip) : null);
      if (stripImg && stripImg.complete && stripImg.naturalWidth > 0) {
        qCtx.drawImage(stripImg, c.x, stripY, c.w, stripH);
      } else {
        qCtx.fillStyle = '#0c0f15';
        qCtx.fillRect(c.x, stripY, c.w, stripH);
      }

      // Highlight active sub-frame on the 8-frame strip
      const sfX = c.x + (subIdx / 8) * c.w;
      qCtx.strokeStyle = c.color;
      qCtx.lineWidth = 1.5;
      qCtx.strokeRect(sfX, stripY, c.w / 8, stripH);

      // Cell header badge
      qCtx.fillStyle = 'rgba(5, 6, 9, 0.84)';
      qCtx.fillRect(c.x, c.y, c.w, 18);
      qCtx.fillStyle = c.color;
      qCtx.font = "600 8.5px 'IBM Plex Mono', monospace";
      qCtx.fillText(`${c.label}`, c.x + 5, c.y + 12);

      if (unit) {
        qCtx.fillStyle = 'rgba(239, 233, 221, 0.78)';
        qCtx.font = "400 8px 'IBM Plex Mono', monospace";
        const filmTag = `${(unit.title || 'Archive').slice(0, 18)} (${unit.year || '83'})`;
        qCtx.fillText(filmTag, c.x + 5, c.y + vidH - 5);
      }

      // Outer border
      qCtx.strokeStyle = isSelected ? '#e8c070' : 'rgba(239,233,221,0.18)';
      qCtx.lineWidth = isSelected ? 2.2 : 1.0;
      qCtx.strokeRect(c.x, c.y, c.w, c.h);
    });
  }

  fetch('wargames-studio-cuts.json')
    .then(r => r.json())
    .then(data => {
      stillsAtlas = data.stills_atlas || [];
      const flatBeats = [];
      (data.books || []).forEach((bk, bIdx) => {
        (bk.beats || []).forEach(bt => {
          bt.book_idx = bIdx;
          bt.book_title = bk.title;
          flatBeats.push(bt);
        });
      });

      engine = WGStudioEngine.create({
        nav,
        cutKeys: ['1983', 'synthesis', 'clip', 'vjepa', 'blip', 'cineosis', 'trurl', 'murch'],
        defaultMode: 'duet',
        onBeatChange: (bt) => {
          indexStillsAtlas(stillsAtlas, bt);
          nav.setStatus(`${stillsAtlas.length} STILLS ATLAS · 9 LIVE VIDEO CUTS · ${(bt.turns_1983 || []).length} SPOKEN LINES`);
        },
        onTick: (st) => {
          frameTick++;
          renderLeftMosaic(st);
          renderRightQuadtree(st);
        }
      });

      engine.setBeats(flatBeats, 0);
    });
})();
</script>
</body>
</html>
