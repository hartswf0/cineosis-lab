<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Archive Came From</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=1">
<!-- CINEOSIS · EPISODE 1 · WHERE THE ARCHIVE CAME FROM. The lab's 15,149 shots were asked for, not taken: each project went into the
     Moving Image Archive with its own questions, and what came back is the lab. Every query and every result here is from the
     projects' own search records (explain/ep1.py → explain/ep/ep1.json). Format of the series: moving pictures first, one line at a
     time, each project in its own colour, our films playing with their own sound. -->
<style>
.line { position: absolute; left: 90px; right: 90px; bottom: 70px; font: 40px/1.3 var(--serif); text-shadow: 0 2px 16px #000, 0 0 4px #000; }
.line span { display: block; opacity: 0; transform: translateY(10px); animation: up 1.1s ease forwards; }
.line small { display: block; font: 15px var(--mono); color: var(--dim); letter-spacing: .1em; margin-top: 10px; opacity: 0; animation: fade 1s ease forwards; }
.vwall { position: absolute; inset: -4%; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; animation: pull 16s ease-out forwards; }
.vwall video { width: 100%; height: 100%; object-fit: cover; display: block; background: #111; filter: saturate(.85); }
@keyframes pull { from { transform: scale(1.5); } to { transform: scale(1); } }
.fog { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,.2), rgba(0,0,0,.85)); }
.sbar { position: absolute; left: 90px; right: 90px; top: 70px; height: 74px; background: #f4efe4; border-radius: 37px; display: flex; align-items: center; gap: 18px; padding: 0 30px; color: #111; font: 30px var(--serif); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.sbar i { width: 22px; height: 22px; border: 3px solid #666; border-radius: 50%; position: relative; flex: none; } .sbar i::after { content: ''; position: absolute; width: 3px; height: 11px; background: #666; right: -6px; bottom: -9px; transform: rotate(-45deg); }
.sbar span::after { content: '▌'; animation: blink 1s steps(1) infinite; color: var(--c); }
.who { position: absolute; left: 92px; top: 160px; font: 600 18px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--c); }
.who em { font-style: normal; color: var(--dim); margin-left: 14px; letter-spacing: .06em; }
.sheet { position: absolute; left: 90px; right: 90px; top: 200px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sheet figure { margin: 0; opacity: 0; transform: scale(.94); animation: pop .5s ease forwards; } .sheet img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid #222; }
.sheet figcaption { font: 12px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
@keyframes pop { to { opacity: 1; transform: none; } }
.tally { position: absolute; right: 90px; bottom: 70px; text-align: right; font: 18px var(--mono); color: var(--dim); opacity: 0; animation: fade 1s ease forwards; } .tally b { font: 600 46px var(--serif); color: var(--c); display: block; }
canvas.full { position: absolute; inset: 0; }
.mosaic { position: absolute; left: 60px; right: 60px; top: 50px; display: grid; grid-template-columns: repeat(23, 1fr); gap: 3px; }
.mosaic i { aspect-ratio: 4/3; background-size: cover; background-position: center; border-bottom: 3px solid var(--c); opacity: 0; animation: fade .4s ease forwards; }
.ident { position: absolute; left: 90px; bottom: 64px; } .ident b { display: block; font: 600 54px/1.05 var(--serif); color: var(--c); text-shadow: 0 2px 18px #000; } .ident span { font: 18px var(--mono); color: #e8e4da; text-shadow: 0 1px 6px #000; letter-spacing: .06em; }
.ident { opacity: 0; animation: up 1s ease forwards .4s; }
.next { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; gap: 26px; }
.next small { font: 600 16px var(--mono); letter-spacing: .2em; color: var(--dim); } .next h1 { margin: 0; font: 600 84px/1.05 var(--serif); } .next nav { display: flex; gap: 16px; flex-wrap: wrap; }
.next a { pointer-events: auto; color: #000; background: var(--gold); padding: 14px 24px; font: 600 20px var(--mono); text-decoration: none; border-radius: 4px; } .next a.ghost { background: none; color: var(--gold); border: 2px solid var(--gold); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:var(--dim);margin:0 0 14px">CINEOSIS · EPISODE 1</p><h1>Where the Archive Came From</h1><p>Fifteen thousand shots, asked for one question at a time. About seven minutes, with sound.</p><b>▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fmt = n => Number(n).toLocaleString('en-US');
let E, beats = [], cur = -1, timer = 0, paused = false, sound = true, tok = 0, t0 = 0, left = 0;
const stage = $('#stage'), score = $('#score'), voice = $('#voice');
const line = (ls, sm = '') => `<div class="line">${ls.map((l, i) => `<span style="animation-delay:${.4 + i * 2.2}s">${l}</span>`).join('')}${sm ? `<small style="animation-delay:${.6 + ls.length * 2.2}s">${sm}</small>` : ''}</div>`;
const later = (ms, f) => { const my = tok; setTimeout(() => { if (my === tok) f(); }, ms); };
const raf = f => { const my = tok, t = performance.now(); const go = () => { if (my !== tok) return; if (f((performance.now() - t) / 1000) !== false) requestAnimationFrame(go); }; go(); };
const duck = on => { score.volume = sound ? (on ? .05 : .3) : 0; };
function startVideos(el) { el.querySelectorAll('video[data-src]').forEach(v => { v.src = v.dataset.src; v.addEventListener('loadedmetadata', () => { try { v.currentTime = +v.dataset.t || 0; } catch (e) { } if (v.dataset.snd && sound) { v.muted = false; v.volume = 1; } v.play().catch(() => { v.muted = true; v.play().catch(() => { }); }); }, { once: true }); }); }
function typeIn(el, text, cps = 26) { const my = tok; let i = 0; const step = () => { if (my !== tok) return; el.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, 1000 / cps); }; step(); }

function build() {
  const B = (ch, secs, html, after, opt = {}) => beats.push({ ch, secs, html, after, ...opt });
  const wall = (fogged) => `<div class="vwall">${E.wall.map(w => `<video data-src="${esc(w.video)}" data-t="${w.t}" muted playsinline loop poster="${esc(w.thumb)}"></video>`).join('')}</div>${fogged ? '<div class="fog"></div>' : ''}`;
  /* the archive */
  B('The archive', 15, () => `${wall(true)}${line(['Somewhere there is an archive of public films.', `About <b style="color:var(--gold)">${fmt(E.archive_est)}</b> shots of them.`], 'the Moving Image Archive · the size is the lab\'s own estimate')}`, el => startVideos(el));
  B('The archive', 7, () => `${wall(true).replace('class="fog"', 'class="fog" style="background:rgba(0,0,0,.82)"')}${line(['We never watched it all.', 'We went looking.'])}`, el => startVideos(el));
  /* the searches */
  E.searches.forEach(s => B('What we asked', 15, () => `<div style="--c:${s.col}"><div class="sbar"><i></i><span id="q"></span></div><div class="who">${esc(s.project)}<em>${esc(s.day)} · ${esc(s.why)}</em></div>
      <div class="sheet">${s.hits.map((h, i) => `<figure style="animation-delay:${2.6 + i * .22}s"><img src="${esc(h.thumb)}"><figcaption>${esc(h.title || '')} ${esc(h.year || '')}</figcaption></figure>`).join('')}</div>
      <div class="tally" style="animation-delay:6s">asked <b>${fmt(s.asked)}</b> times · brought back ${fmt(s.got)} shots</div></div>`, el => later(300, () => typeIn($('#q', el), s.q))));
  /* the lab fills */
  const RC = { cineosis: '#f2c14e', wygwyl: '#c4f46a', forage: '#9fd36a' };
  B('What we kept', 15, () => `<canvas class="full" id="cv" width="1600" height="900"></canvas>${line([`On one day, 24 September, these searches filled the lab:`, `<b style="color:var(--gold)">${fmt(E.total)}</b> shots from ${fmt(E.films)} films. ${E.hours} hours.`])}`,
    el => { const g = $('#cv', el).getContext('2d'), N = E.total, cols = 190, sz = 6.2, ox = 210, oy = 110, keys = Object.keys(E.routes), seq = keys.flatMap(k => Array(E.routes[k]).fill(k));
      raf(t => { const n = Math.min(N, Math.floor(N * Math.min(1, t / 7))); g.fillStyle = '#000'; g.fillRect(0, 0, 1600, 900);
        for (let i = 0; i < n; i++) { g.fillStyle = RC[seq[i]]; g.fillRect(ox + (i % cols) * sz, oy + Math.floor(i / cols) * sz, sz - 1.5, sz - 1.5); }
        g.font = '17px IBM Plex Mono'; let y = 80; keys.forEach(k => { g.fillStyle = RC[k]; g.fillText(`${k === 'forage' ? 'CUTBASTARD forage' : k === 'wygwyl' ? 'WYGWYL forage suite' : 'Cineosis sign searches'} · ${fmt(E.routes[k])}`, ox + ({ cineosis: 0, wygwyl: 420, forage: 820 })[k], y); });
        return t < 8; }); });
  B('What we kept', 11, () => `<canvas class="full" id="cv" width="1600" height="900"></canvas>${line(['Then the Odyssey asked 4,537 more questions.', `All our libraries together: about <b style="color:var(--gold)">${fmt(E.all_libraries)}</b> shots.`])}`,
    el => { const g = $('#cv', el).getContext('2d'), R = 330, cx = 800, cy = 380, f = E.all_libraries / E.archive_est;
      raf(t => { const k = Math.min(1, t / 4); g.fillStyle = '#000'; g.fillRect(0, 0, 1600, 900); g.strokeStyle = '#3a352d'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
        g.fillStyle = 'rgba(242,193,78,.85)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * f * k); g.fill();
        g.fillStyle = '#a8a196'; g.font = '18px IBM Plex Mono'; g.fillText('the archive', cx + R + 20, cy - R + 30); return t < 5; }); });
  const seed = E.searches[0];
  B('What we kept', 10, () => `<video class="full" data-src="https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/2567f0b6-a5d5-51d0-8a53-f21220b0ab4a/v4-conditional-luna-1/clips/21171e70-f59f-55b6-85c3-29691c97e312.mp4" data-t="4" muted playsinline loop></video><div class="fog"></div>
      ${line(['So this is not the archive. It is the shape of our questions.', 'It has a flock with one dark animal in it because we asked for one.'], `“${esc(seed.q)}”`)}`, el => startVideos(el));
  /* the 253 */
  B('What we read', 17, () => `<div class="mosaic">${E.read.map((r, i) => `<i style="--c:${r.col};background-image:url('${esc(r.thumb)}');animation-delay:${i * .03}s"></i>`).join('')}</div>
      ${line([`Of all of them, <b style="color:var(--gold)">253</b> were read.`, `Chosen by eye, about six for each of 45 signs, from ${E.read_films} films.`], 'coloured by family of sign · mostly from the 1930s to the 1950s')}`);
  B('What we read', 7, () => `<div class="mosaic" style="opacity:.25">${E.read.map(r => `<i style="--c:${r.col};background-image:url('${esc(r.thumb)}');opacity:1;animation:none"></i>`).join('')}</div>${line(['The editor was rarely sure: mostly 40 to 60 percent.', 'Each reading is a hypothesis.'])}`);
  /* what we made */
  B('What we made', 5, () => line(['And then we made films.']).replace('bottom: 70px', 'bottom:auto;top:420px'));
  E.made.forEach(m => B('What we made', m.len, () => `<video class="full" data-src="${esc(m.video)}" data-t="${m.t}" ${m.audio ? 'muted' : 'data-snd="1"'} playsinline loop></video><div class="ident" style="--c:${m.col}"><b>${esc(m.title)}</b><span>${esc(m.by)}</span></div>`,
    el => { startVideos(el); duck(true); if (m.audio) { voice.src = m.audio; voice.addEventListener('loadedmetadata', () => { voice.currentTime = m.a0; if (sound) voice.play().catch(() => { }); }, { once: true }); } }, { voice: !!m.audio }));
  /* the rest */
  B('What we never asked', 13, () => `<canvas class="full" id="cv" width="1600" height="900"></canvas>${line([`About <b style="color:var(--gold)">${fmt(Math.round((E.archive_est - E.all_libraries) / 1000) * 1000)}</b> shots no question of ours has reached.`, 'What would we find if we asked differently?'])}`,
    el => { const g = $('#cv', el).getContext('2d'), N = 2400, f = E.all_libraries / E.archive_est;
      raf(t => { g.fillStyle = '#000'; g.fillRect(0, 0, 1600, 900); for (let i = 0; i < N; i++) { const a = i * 2.39996, r = 13 * Math.sqrt(i), x = 800 + r * Math.cos(a), y = 380 + r * Math.sin(a) * .62; const lit = (i / N) < f; g.fillStyle = lit ? 'rgba(242,193,78,.9)' : `rgba(90,84,74,${.3 + .3 * Math.sin(t * 1.5 + i)})`; g.fillRect(x, y, 4, 4); } return true; }); });
  B('What we never asked', 40, () => `<div class="next"><small>NEXT · EPISODE 2</small><h1>How the Lab Sees</h1><p style="font:28px/1.35 var(--serif);color:#d8d0c2;max-width:1100px;margin:0">Seven machines learned to look and listen from the internet. One person reads what they cannot.</p>
      <nav><a href="how-it-sees.html">Watch episode 2</a><a class="ghost" href="series.html">All episodes</a><a class="ghost" href="./#wall">Explore the archive</a></nav></div>`);
}
const CUES = ['dae-preparation-drift', 'dae-compass-spin-in-heavy-fog', 'dae-snowbound-umea-cabin', 'dae-salvaged-room-traveling-light', 'dae-slide-carousel-at-blue-hour', 'dae-cold-current-paddle'];
let chapters = [];
function cue(ci) { const src = `score/cues/${CUES[ci % CUES.length]}.m4a`; if (score.dataset.src === src) return; score.dataset.src = src;
  const v0 = score.volume, t = performance.now(); const out = () => { const k = Math.min(1, (performance.now() - t) / 900); score.volume = v0 * (1 - k); if (k < 1) requestAnimationFrame(out); else { score.src = src; score.currentTime = 0; duck(false); if (!paused) score.play().catch(() => { }); } }; out(); }
function show(i) {
  if (i < 0 || i >= beats.length) return; clearTimeout(timer); tok++; cur = i; const b = beats[i]; voice.pause();
  stage.querySelectorAll('.beat').forEach(o => { o.classList.remove('on'); o.querySelectorAll('video').forEach(v => { v.pause(); v.muted = true; }); setTimeout(() => o.remove(), 1000); });
  const el = document.createElement('div'); el.className = 'beat'; el.innerHTML = b.html(); stage.appendChild(el); requestAnimationFrame(() => el.classList.add('on'));
  duck(false); if (b.after) b.after(el); cue(chapters.findIndex(c => c.name === b.ch));
  left = b.secs * 1000; t0 = performance.now(); if (!paused) timer = setTimeout(() => show(i + 1), left); ui();
}
function ui() {
  const done = beats.slice(0, cur).reduce((a, b) => a + b.secs, 0), tot = beats.reduce((a, b) => a + b.secs, 0);
  document.querySelectorAll('#chs div').forEach((d, ci) => { const c = chapters[ci], cb = beats.filter(b => b.ch === c.name), first = beats.indexOf(cb[0]), passed = beats.slice(first, cur).reduce((a, b) => a + b.secs, 0);
    d.classList.toggle('on', beats[cur] && beats[cur].ch === c.name); d.querySelector('i').style.width = Math.min(100, (cur > first + cb.length - 1 ? 1 : cur < first ? 0 : passed / c.secs) * 100) + '%'; });
  const m = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; $('#time').textContent = `${m(done)} / ${m(tot)}`;
}
function pause(p) { paused = p; $('#bPlay').textContent = p ? '▶' : '❚❚';
  stage.querySelectorAll('.beat.on video').forEach(v => p ? v.pause() : v.play().catch(() => { })); p ? (score.pause(), voice.pause()) : (score.play().catch(() => { }), beats[cur] && beats[cur].voice && voice.play().catch(() => { }));
  if (p) { clearTimeout(timer); left -= performance.now() - t0; } else { t0 = performance.now(); timer = setTimeout(() => show(cur + 1), Math.max(500, left)); } }
function fit() { const W = innerWidth, H = innerHeight - 64, k = Math.min(W / 1600, H / 900); stage.style.transform = `translate(-50%, -50%) scale(${k})`; $('#wrap').style.height = H + 'px'; }
addEventListener('resize', fit);
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); pause(!paused); } if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
$('#bPlay').onclick = () => pause(!paused); $('#bNext').onclick = () => show(cur + 1); $('#bPrev').onclick = () => show(cur - 1);
$('#bSnd').onclick = () => { sound = !sound; $('#bSnd').textContent = sound ? '♪ on' : '♪ off'; duck(false); voice.muted = !sound; stage.querySelectorAll('video').forEach(v => { if (!sound) v.muted = true; }); };
(async function () {
  fit(); E = await fetch('explain/ep/ep1.json?v=1').then(r => r.json()); build();
  beats.forEach(b => { let c = chapters.find(c => c.name === b.ch); if (!c) chapters.push(c = { name: b.ch, secs: 0 }); c.secs += b.secs; });
  $('#chs').innerHTML = chapters.map(c => `<div style="--w:${c.secs}"><i></i><span>${esc(c.name)}</span></div>`).join('');
  document.querySelectorAll('#chs div').forEach((d, ci) => d.onclick = () => show(beats.findIndex(b => b.ch === chapters[ci].name)));
  const q = new URLSearchParams(location.search);
  $('#start').onclick = () => { $('#start').remove(); score.volume = .3; show(0); };
  if (q.has('auto')) $('#start').onclick();
})();
</script>
</body>
</html>
