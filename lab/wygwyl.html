<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL Cuts</title>
<meta name="description" content="One poem suite, four cuts from archival film. Pick a cut, press play; the line, the shot and its signs follow the picture.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--panel:#12100e;--ink:#ece6da;--dim:#b3ab9e;--rule:#2e2a26;--red:#e0483a;--lime:#c4f46a;
  --perception:#e9d9a8;--affect:#f0b9a4;--action:#e7a37c;--reflection:#b9cfa0;--mental:#a9c9c9;--break:#d9d3c7;--time:#b8b3d8;--read:#d9b8d2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.55 "IBM Plex Mono",ui-monospace,Menlo,monospace}
a{color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
header h1{font:700 22px/1 "Fraunces",Georgia,serif;margin:0}
header .back{color:var(--dim);text-decoration:none;font-size:12.5px}
header .back:hover{color:var(--ink)}
nav.cuts{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.cuts button{font:inherit;font-size:12.5px;background:none;color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:5px 11px;cursor:pointer}
nav.cuts button:hover{color:var(--ink);border-color:var(--dim)}
nav.cuts button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.cuts kbd{font-size:10px;opacity:.6;margin-left:4px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 57px)}
.stage{padding:16px;min-width:0}
.idea{color:var(--dim);margin:0 0 10px;font-size:13px;min-height:1.5em}
.screen{position:relative;background:#000;aspect-ratio:16/9;border-radius:4px;overflow:hidden}
.screen video{width:100%;height:100%;display:block;background:#000}
.screen .quad{position:absolute;width:50%;height:50%;border:0;background:none;cursor:pointer;padding:0}
.screen .quad:hover{outline:2px solid var(--lime);outline-offset:-2px}
.fault{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#000d;color:var(--ink)}
.fault.on{display:flex}
.fault p{max-width:52ch;margin:0 0 12px}
.transport{display:flex;align-items:center;gap:10px;margin:10px 0 6px;flex-wrap:wrap}
.transport button{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:6px 14px;cursor:pointer;min-width:84px}
.transport button.ghost{background:none;color:var(--dim);border:1px solid var(--rule);min-width:0;padding:5px 10px}
.transport button.ghost:hover{color:var(--ink);border-color:var(--dim)}
.transport .tc{font-variant-numeric:tabular-nums;color:var(--dim)}
.transport .src{margin-left:auto;color:var(--dim);font-size:12px}
.transport .src a{color:var(--dim)}
.strip{position:relative;height:46px;background:var(--panel);border-radius:3px;cursor:pointer;margin-top:4px;touch-action:none}
.strip .p{position:absolute;top:0;bottom:0;background-size:cover;background-position:center;border-right:1px solid var(--bg);opacity:.72}
.strip .p.cur{opacity:1;outline:2px solid var(--lime);outline-offset:-2px;z-index:1}
.strip .head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red);pointer-events:none;z-index:2}
.chapters{position:relative;height:20px;margin-top:3px;font-size:10.5px;color:var(--dim)}
.chapters span{position:absolute;top:0;border-left:1px solid var(--rule);padding-left:3px;white-space:nowrap;overflow:hidden;cursor:pointer}
.chapters span:hover{color:var(--ink)}
.keys{color:var(--dim);font-size:11.5px;margin-top:12px}
.keys kbd{border:1px solid var(--rule);border-radius:3px;padding:0 4px;font-size:10.5px}
aside{border-left:1px solid var(--rule);background:var(--panel);padding:18px 18px 24px;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:0}
.chap{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.line{font:400 21px/1.38 "Fraunces",Georgia,serif;margin:8px 0 18px}
.line.instr{font-style:italic;color:var(--dim);font-size:17px}
.shot{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:14px}
.shot img{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:#000;display:block}
.shot b{display:block;font:700 15px/1.25 "Fraunces",Georgia,serif}
.shot small{color:var(--dim);display:block}
.why{color:var(--dim);font-size:12.5px;margin:0 0 14px}
.why b{color:var(--ink);font-weight:500}
.signs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sign{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:#1d1b18;border-radius:3px;padding:2px 7px 2px 3px;font-size:12px}
.sign i{font:700 13px/1 "Fraunces",Georgia,serif;font-style:normal;background:#0002;border-radius:2px;padding:3px 4px}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;font-weight:500}
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four .q{border:1px solid var(--rule);border-radius:4px;padding:8px;cursor:pointer;min-width:0}
.four .q:hover{border-color:var(--dim)}
.four .q em{font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.four .q img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px;display:block;margin:5px 0;background:#000}
.four .q b{font:700 13px/1.2 "Fraunces",Georgia,serif;display:block}
.four .q small{color:var(--dim);font-size:11px}
.files{font-size:12px;color:var(--dim)}
.files a{color:var(--dim)}
@media (max-width:900px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--rule);max-height:none;position:static}nav.cuts{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <a class="back" href="./#wall">← Lab</a>
  <h1>WYGWYL · four cuts</h1>
  <nav class="cuts" id="cuts" aria-label="Choose a cut"></nav>
  <a class="back" id="collage" href="wygwyl-collage.html" title="Open this moment in the collage page: every asset for the beat, drag them onto the frame">Collage this moment →</a>
  <a class="back" href="cutting-room-floor.html" title="Every candidate for every beat, playing at once">Cutting room floor →</a>
  <a class="back" id="bench" href="sound-cineosis.html" title="Open the line she is reading now, word by word, in the Sound Bench">Sound bench →</a>
</header>
<main>
  <section class="stage">
    <p class="idea" id="idea"></p>
    <div class="screen" id="screen">
      <video id="v" playsinline preload="metadata"></video>
      <div class="fault" id="fault" role="alert"><div><p id="faultMsg"></p><a id="faultLink" href="#">Download the film</a></div></div>
    </div>
    <div class="transport">
      <button id="play">▶ Play</button>
      <button class="ghost" id="prev" title="Previous shot (←)">◀ shot</button>
      <button class="ghost" id="next" title="Next shot (→)">shot ▶</button>
      <span class="tc" id="tc">00:00 / 24:00</span>
      <span class="src" id="src"></span>
    </div>
    <div class="strip" id="strip" aria-label="Shots: click to jump"><div class="head" id="head"></div></div>
    <div class="chapters" id="chapters"></div>
    <p class="keys"><kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> previous/next shot · <kbd>1</kbd>–<kbd>4</kbd> a cut · <kbd>G</kbd> all four · click the strip to jump · switching cuts keeps the time</p>
  </section>
  <aside id="card" aria-live="polite"></aside>
</main>
<script>
const RELEASE = 'https://github.com/hartswf0/cineosis-lab/releases/download/wygwyl-v1/';
const CUTS = [
  { slug: 'suite', title: 'Suite', idea: 'Closest to the suite: each shot shows what the treatment asks of its beat and the poem line under it.' },
  { slug: 'scenes', title: 'Scenes', idea: 'Each poem line plays as one passage from a single archive film, shot after shot in that film’s order.' },
  { slug: 'cineosis', title: 'Cineosis', idea: 'Each shot is chosen for the cineosis signs the suite assigns its beat.' },
  { slug: 'drift', title: 'Drift', idea: 'A dérive through each chapter: every shot is chosen to follow the one before it.' },
  { slug: 'grid', title: 'All four', idea: 'The four cuts at once on one clock. Click a quarter to play that cut alone at the same moment.' },
];
const QUAD = ['suite', 'scenes', 'cineosis', 'drift'];
const DOM = { perception: '--perception', affection: '--affect', affect: '--affect', impulse: '--action', action: '--action', reflection: '--reflection', relation: '--mental', mental: '--mental', break: '--break', time: '--time', thought: '--read', read: '--read', readable: '--read' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mmss = t => { t = Math.max(0, t || 0); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
const v = $('#v');
const S = { cut: 'suite', patches: {}, signs: {}, local: false, i: -1, D: 1440.07 };

const src = slug => S.local ? (slug === 'grid' ? 'wygwyl/cuts/grid.mp4' : `wygwyl/cuts/${slug}/cut.mp4`) : RELEASE + `wygwyl-${slug}.mp4`;
const at = (P, t) => { let lo = 0, hi = P.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (P[m].t0 <= t) lo = m; else hi = m - 1; } return lo; };
const P = () => S.patches[S.cut === 'grid' ? 'suite' : S.cut] || [];

function chip(n) {
  const s = S.signs[n]; if (!s) return `<span class="sign" style="background:var(--break)"><i>${esc(n)}</i></span>`;
  return `<a class="sign" href="../periodic-table.html#${esc(n)}" target="_blank" title="${esc(s.name)} — open in the periodic table" style="background:var(${DOM[s.dom] || '--break'})"><i>${esc(s.symbol)}</i>${esc(n)} ${esc(s.name)}</a>`;
}
function shotBlock(p) {
  const c = p.clip || {};
  return `<div class="shot"><img src="${esc(c.thumb || '')}" alt="" onerror="this.style.visibility='hidden'">
    <div><b>${esc(c.title || '—')}</b><small>${esc(c.year || 'n.d.')} · ${(+c.in || 0).toFixed(1)}–${(+c.out || 0).toFixed(1)} s of the clip</small>
    ${c.page ? `<small><a href="${esc(c.page)}" target="_blank" rel="noopener">open in the archive ↗</a></small>` : ''}</div></div>`;
}
function card() {
  const t = v.currentTime, host = $('#card');
  if (S.cut === 'grid') {
    const ps = QUAD.map(q => { const L = S.patches[q] || []; return L.length ? L[at(L, t)] : null; });
    const p0 = ps[0];
    host.innerHTML = p0 ? `<div class="chap">Chapter ${esc(p0.chapter)} · ${esc(p0.film)}</div>
      <div class="line${p0.line ? '' : ' instr'}">${esc(p0.line || 'instrumental')}</div>
      <h3>Now on screen · click one to play it alone</h3>
      <div class="four">${ps.map((p, k) => p ? `<div class="q" data-cut="${QUAD[k]}" role="button" tabindex="0"><em>${esc(CUTS[k].title)}</em>
        <img src="${esc(p.clip?.thumb || '')}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(p.clip?.title || '—')}</b><small>${esc(p.clip?.year || 'n.d.')}</small></div>` : '').join('')}</div>` : '';
    host.querySelectorAll('.q').forEach(q => q.onclick = () => choose(q.dataset.cut));
    return;
  }
  const L = P(); if (!L.length) { host.innerHTML = '<p class="why">Loading the shot list…</p>'; return; }
  const p = L[S.i];
  host.innerHTML = `<div class="chap">Chapter ${esc(p.chapter)} · ${esc(p.film)} · shot ${S.i + 1} of ${L.length}</div>
    <div class="line${p.line ? '' : ' instr'}">${esc(p.line || 'instrumental')}</div>
    ${shotBlock(p)}
    <p class="why"><b>Why this shot:</b> ${esc(p.why || '—')}</p>
    ${(p.codes || []).length ? `<h3>Signs the suite assigns this beat</h3><div class="signs">${p.codes.map(chip).join('')}</div>` : ''}
    <h3>Files for this cut</h3>
    <p class="files"><a href="${esc(src(S.cut))}" download>film (mp4)</a> · <a href="wygwyl/cuts/${esc(S.cut)}/patches.json">shot list (json)</a> · <a href="wygwyl/cuts/${esc(S.cut)}/matrix_B_story_map.md">story map (md)</a> · <a href="wygwyl/cuts/${esc(S.cut)}/matrix_A_patch_genome.yaml">patch genome (yaml)</a></p>`;
}
function strip() {
  const L = P(), D = S.D, host = $('#strip');
  host.querySelectorAll('.p').forEach(e => e.remove());
  const frag = document.createDocumentFragment();
  L.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'p'; d.dataset.i = i;
    d.style.left = (p.t0 / D * 100) + '%'; d.style.width = ((p.t1 - p.t0) / D * 100) + '%';
    if (p.clip?.thumb) d.style.backgroundImage = `url("${p.clip.thumb}")`;
    d.title = `${mmss(p.t0)} · ${p.clip?.title || ''}`;
    frag.appendChild(d);
  });
  host.appendChild(frag);
  const ch = $('#chapters'); const seen = new Set();
  ch.innerHTML = L.filter(p => !seen.has(p.chapter) && seen.add(p.chapter)).map(p => `<span data-t="${p.t0}" style="left:${p.t0 / D * 100}%" title="${esc(p.film)}">${esc(p.chapter)}</span>`).join('');
  ch.querySelectorAll('span').forEach(s => s.onclick = () => seek(+s.dataset.t));
}
function tick() {
  const t = v.currentTime, L = P();
  $('#tc').textContent = `${mmss(t)} / ${mmss(S.D)}`;
  $('#head').style.left = (t / S.D * 100) + '%';
  const i = L.length ? at(L, t) : -1;
  if (i !== S.i || S.cut === 'grid') {
    S.i = i;
    $('#strip').querySelectorAll('.p.cur').forEach(e => e.classList.remove('cur'));
    const cur = $('#strip').querySelector(`.p[data-i="${i}"]`); if (cur) cur.classList.add('cur');
    card();
  }
}
function collageLink() { $('#collage').href = 'wygwyl-collage.html#t' + (v.currentTime || 0).toFixed(1); $('#bench').href = 'sound-cineosis.html#t=' + (v.currentTime || 0).toFixed(1); }
function seek(t) { v.currentTime = Math.max(0, Math.min(S.D - .05, t)); tick(); }
function step(d) { const L = P(); if (!L.length) return; const i = Math.max(0, Math.min(L.length - 1, at(L, v.currentTime + .05) + d)); seek(L[i].t0 + .02); }
function choose(slug) {
  const t = v.currentTime || 0, playing = !v.paused;
  S.cut = slug; S.i = -1;
  document.querySelectorAll('nav.cuts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cut === slug));
  $('#idea').textContent = CUTS.find(c => c.slug === slug).idea;
  $('#fault').classList.remove('on');
  $('#screen').querySelectorAll('.quad').forEach(q => q.remove());
  if (slug === 'grid') QUAD.forEach((q, k) => {
    const b = document.createElement('button'); b.className = 'quad'; b.title = `Play ${CUTS[k].title} alone from here`;
    b.style.left = (k % 2) * 50 + '%'; b.style.top = (k > 1) * 50 + '%'; b.onclick = () => choose(q); $('#screen').appendChild(b);
  });
  v.src = src(slug);
  v.addEventListener('loadedmetadata', () => { v.currentTime = t; if (playing) v.play(); }, { once: true });
  $('#src').innerHTML = S.local ? 'playing the local file' : `streaming from <a href="https://github.com/hartswf0/cineosis-lab/releases/tag/wygwyl-v1" target="_blank">the release</a>`;
  try { history.replaceState(null, '', '#' + slug); } catch (e) { /* file: */ }
  strip(); tick();
}
v.addEventListener('timeupdate', tick);
v.addEventListener('timeupdate', collageLink);
v.addEventListener('seeked', collageLink);
v.addEventListener('seeked', tick);
v.addEventListener('play', () => $('#play').textContent = '❚❚ Pause');
v.addEventListener('pause', () => $('#play').textContent = '▶ Play');
v.addEventListener('error', () => {
  $('#faultMsg').textContent = S.local ? 'The film file is missing from this copy. Render it with lab/cutbastard/render_cut.py, or open the published page.'
    : 'The film did not load from the GitHub release. Try Chrome or Firefox, or download it and play it locally; the shot list still follows the clock.';
  $('#faultLink').href = src(S.cut); $('#fault').classList.add('on');
});
$('#play').onclick = () => v.paused ? v.play() : v.pause();
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
const stripSeek = e => { const r = $('#strip').getBoundingClientRect(); seek((e.clientX - r.left) / r.width * S.D); };
$('#strip').addEventListener('pointerdown', e => { stripSeek(e); $('#strip').setPointerCapture(e.pointerId); });
$('#strip').addEventListener('pointermove', e => { if (e.buttons) stripSeek(e); });
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if ('1234'.includes(e.key)) choose(QUAD[+e.key - 1]);
  else if (e.key === 'g' || e.key === 'G') choose('grid');
});
$('#cuts').innerHTML = CUTS.map((c, k) => `<button data-cut="${c.slug}" aria-pressed="false" title="${esc(c.idea)}">${esc(c.title)}<kbd>${k < 4 ? k + 1 : 'G'}</kbd></button>`).join('');
$('#cuts').querySelectorAll('button').forEach(b => b.onclick = () => choose(b.dataset.cut));

(async () => {
  try { const r = await fetch('wygwyl/cuts/suite/cut.mp4', { method: 'HEAD', signal: AbortSignal.timeout(2500) }); S.local = r.ok; } catch (e) { S.local = false; }
  const first = (location.hash.slice(1) in { suite: 1, scenes: 1, cineosis: 1, drift: 1, grid: 1 }) ? location.hash.slice(1) : 'suite';
  const loads = QUAD.map(q => fetch(`wygwyl/cuts/${q}/patches.json`).then(r => r.json()).then(L => { S.patches[q] = L; }).catch(() => { S.patches[q] = []; }));
  const signs = fetch('tools/cineosis-index.json').then(r => r.json()).then(j => j.signs.forEach(s => S.signs[s.n] = s)).catch(() => {});
  choose(first);
  await Promise.all([...loads, signs]);
  const L = S.patches.suite; if (L.length) S.D = L[L.length - 1].t1;
  S.i = -1; strip(); tick();
})();
</script>
</body>
</html>
