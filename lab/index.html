<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cineosis Lab</title>
<meta name="description" content="An instrument for searching, sorting and re-seeing the Cineosis 44 corpus of archive shots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="facetBtn" class="ghost" title="Filters (F)" aria-label="Toggle filters">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1 3h14M4 8h8M6.5 13h3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
  </button>
  <div class="brand"><b>CINEOSIS</b><span>LAB</span></div>
  <nav id="modes" aria-label="Modes">
    <button data-mode="wall">Wall<i>1</i></button>
    <button data-mode="map">Map<i>2</i></button>
    <button data-mode="ring">Ring<i>3</i></button>
    <button data-mode="strata">Strata<i>4</i></button>
    <button data-mode="cuts">Cut-outs<i>5</i></button>
    <button data-mode="reel">Reel<i>6</i></button>
  </nav>
  <form id="search" autocomplete="off">
    <div class="scope" role="radiogroup" aria-label="Search scope">
      <button type="button" data-scope="corpus" class="on">corpus</button>
      <button type="button" data-scope="archive">archive</button>
    </div>
    <input id="q" type="search" placeholder="search titles, readings, queries, subjects · #Dm · 1940s" spellcheck="false" aria-label="Search">
    <span id="qstat"></span>
  </form>
  <div id="sortbox">
    <label>sort <select id="sort">
      <option value="sign">sign order</option>
      <option value="hue">hue</option>
      <option value="lum">luminance</option>
      <option value="year">year</option>
      <option value="conf">confidence</option>
      <option value="sim">similarity</option>
      <option value="film">film</option>
      <option value="aff" title="machine affinity for the selected sign (or the shot's strongest sign)">sign affinity</option>
    </select></label>
    <button id="sortDir" class="ghost" title="Reverse order">↓</button>
    <label class="grp">group <select id="group">
      <option value="none">none</option>
      <option value="sign">sign</option>
      <option value="decade">decade</option>
      <option value="hue">hue band</option>
      <option value="subject">subject</option>
      <option value="scale">scale</option>
    </select></label>
    <label class="size" title="Tile size"><input id="size" type="range" min="56" max="280" step="4" value="132" aria-label="Tile size"></label>
  </div>
  <div id="count"></div>
  <div class="links">
    <span id="srvBadge" class="srv"></span>
    <button id="reload" class="ghost" title="Reload lab-data.json (analysis fills in over time)">↻</button>
    <a href="../periodic-table.html" target="_blank" rel="noopener" title="The periodic table of the 45 signs">Table ↗</a>
    <button id="aboutBtn" class="ghost" title="About the modes (?)">?</button>
  </div>
</header>

<aside id="facets" aria-label="Filters"></aside>

<main id="stage">
  <div id="livebar" hidden></div>
  <section class="mode" id="m-wall" hidden></section>
  <section class="mode" id="m-map" hidden></section>
  <section class="mode" id="m-ring" hidden></section>
  <section class="mode" id="m-strata" hidden></section>
  <section class="mode" id="m-cuts" hidden></section>
  <div id="boot">loading lab-data.json…</div>
</main>

<div id="reel" hidden></div>
<div id="inspector" hidden></div>
<div id="about" hidden></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
