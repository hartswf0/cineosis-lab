<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Republic · Episode 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=2"><link rel="stylesheet" href="explain/episode.css?v=2">
<!-- CINEOSIS · EPISODE 7 · THE REPUBLIC. A satire in seventeen episodes: Texas governors and machines build Plato's ideal city.
     Language models wrote it, a speech synthesizer voices it, the archive supplies its places, its bodies, and, in another version,
     its lines. The viewer's questions, answered with the episodes and with the rule that chose each line, replayed exactly.
     In the Republic's own colours (markov-republic.html). Data: explain/ep7.py → explain/ep/ep7.json. -->
<style>
:root { --bg: #0c0806; --ink: #f4e9dc; --dim: #a8968a; --rust: #e0572a; --gold: #f2c14e; }
body, #stage { background: var(--bg); }
.ask { position: absolute; left: 70px; top: 52px; font: 600 20px var(--mono); color: var(--rust); opacity: 0; animation: up .8s ease forwards; z-index: 4; text-shadow: 0 1px 8px #000; } .ask::before { content: '— '; }
.hsub { position: absolute; left: 140px; right: 140px; bottom: 50px; text-align: center; font: 32px/1.3 var(--serif); color: var(--ink); text-shadow: 0 2px 12px #000, 0 0 3px #000; }
.eps { position: absolute; left: 40px; right: 40px; top: 100px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.eps figure { margin: 0; opacity: 0; animation: up .6s ease forwards; } .eps video { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #111; } .eps figcaption { font: 12px var(--mono); color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wit { position: absolute; left: 70px; right: 70px; top: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.wit div { border-top: 3px solid #3a2a22; padding-top: 10px; opacity: 0; animation: up .7s ease forwards; } .wit b { font: 600 15px var(--mono); color: var(--dim); letter-spacing: .1em; } .wit i { display: block; font: 600 54px var(--serif); font-style: normal; color: var(--ink); margin-top: 6px; } .wit span { font: 14px var(--mono); color: var(--dim); }
.wit div.kept { border-color: var(--rust); } .wit div.kept b, .wit div.kept i { color: var(--rust); }
.castc { position: absolute; top: 90px; width: 380px; background: rgba(12,8,6,.86); border-left: 4px solid var(--rust); padding: 12px 16px; opacity: 0; animation: up .8s ease forwards; z-index: 3; }
.castc b { font: 600 22px var(--mono); color: var(--rust); } .castc p { margin: 6px 0 0; font: 18px/1.35 var(--serif); } .castc small { font: 13px var(--mono); color: var(--dim); }
.mp { position: absolute; left: 260px; top: 90px; width: 1080px; height: 640px; perspective: 1400px; }
.mp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 2.6s cubic-bezier(.2,.7,.2,1), opacity 1s; }
.mp .lbl { position: absolute; right: -170px; font: 600 15px var(--mono); color: var(--rust); letter-spacing: .12em; opacity: 0; transition: opacity 1s; }
.fig { position: absolute; bottom: 4%; height: 62%; transition: transform 3s ease, opacity 1s; opacity: 0; filter: drop-shadow(0 0 16px rgba(224,87,42,.6)); }
.rank { position: absolute; left: 70px; right: 70px; top: 220px; display: flex; flex-direction: column; gap: 12px; }
.rank div { display: grid; grid-template-columns: 1fr 380px 90px; gap: 18px; align-items: center; opacity: 0; animation: up .6s ease forwards; font: 26px var(--serif); }
.rank i { height: 24px; background: #1e1512; border-radius: 3px; position: relative; overflow: hidden; } .rank i b { position: absolute; inset: 0 auto 0 0; width: 0; background: #6d5d53; transition: width 1.6s cubic-bezier(.2,.7,.2,1); } .rank i u { position: absolute; top: 0; bottom: 0; background: var(--gold); text-decoration: none; transition: width 1.6s; width: 0; }
.rank div.won { color: var(--rust); } .rank div.won i b { background: var(--rust); } .rank em { font: 18px var(--mono); color: var(--dim); font-style: normal; text-align: right; } .rank small { display: block; font: 13px var(--mono); color: var(--dim); }
.scrip { position: absolute; left: 70px; right: 70px; top: 110px; font: 600 44px/1.2 var(--serif); } .scrip span { font: 600 18px var(--mono); color: var(--rust); letter-spacing: .14em; display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#a8968a;margin:0 0 14px">CINEOSIS · EPISODE 7</p><h1 style="color:#e0572a">The Republic</h1><p>Texas governors and machines try to build Plato's ideal city. Language models wrote it; the archive plays it. About six minutes, with sound.</p><b style="background:#e0572a">▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script>
window.EPISODE = {
  data: ['explain/ep/ep7.json?v=1'],
  cues: [],
  build([R], B, K) {
    const { esc, fmt, line, later, raf, typeIn, startVideos } = K, $ = K.$, E1 = R.ep, ask = q => `<div class="ask">${q}</div>`;
    const ep1 = (t, sound = true, extra = '') => `<video class="full" style="object-fit:contain;background:#000" data-src="republic/pilot/ep01-score.mp4" data-t="${t}" ${sound ? 'data-snd="1"' : 'muted'} playsinline></video>${extra}`;
    const hsubs = el => { const v = el.querySelector('video'), s = el.querySelector('.hsub'); if (!v || !s) return; raf(() => { const t = v.currentTime, h = R.heard.find(x => t >= x[0] && t <= x[1] + .3); const tx = h ? h[2] : ''; if (s.dataset.t !== tx) { s.dataset.t = tx; s.textContent = tx; } }); };
    /* 1 · Mars, 2085 */
    B('Mars, 2085', 47, () => ep1(4.4, true, '<div class="hsub"></div>'), el => { startVideos(el); hsubs(el); });
    /* 2 · what is this */
    B('What is this?', 14, () => `${ask('What is this?')}<div class="eps">${R.episodes.map((e, i) => `<figure style="animation-delay:${i * .12}s"><video data-src="${esc(e.mp4)}" data-t="60" muted playsinline></video><figcaption>${i + 1} · ${esc(e.name)}</figcaption></figure>`).join('')}</div>
        ${line(['The Republic. Texas governors and machines try to build Plato\'s ideal city.', 'Seventeen episodes. A satire.'])}`, el => startVideos(el));
    /* 3 · who wrote it */
    const WIT = ['MA', 'CHARACTER', 'WORLD', 'MATRIX', 'LEGOS', 'LEGOS-GPT', 'SLUGLINE'], cnt = WIT.map(w => R.episodes.filter(e => e.witness === w).length);
    B('Who wrote it?', 13, () => `${ask('Who wrote it?')}<div class="wit">${WIT.map((w, i) => `<div style="animation-delay:${i * .35}s"><b>${w}</b><i>${cnt[i]}</i><span>episodes kept</span></div>`).join('')}</div>
        ${line(['Seven language models were given the same pitches. Each wrote its own scene.', 'For every pitch, the most screenplay-like answer was kept: the one with the most spoken lines.'])}`);
    B('Who wrote it?', 11, () => `<div class="wit">${WIT.map((w, i) => `<div class="${w === E1.witness ? 'kept' : ''}" style="animation:none;opacity:${E1.takes.includes(w) ? 1 : .25}"><b>${w}</b><i>${E1.takes.filter(t => t === w).length}</i><span>takes of this pitch</span></div>`).join('')}</div>
        <div class="scrip" style="top:420px;font:400 32px/1.35 var(--serif)"><span>EPISODE 1 · ${esc(E1.name)} · KEPT FROM ${E1.witness}</span><span id="lg" style="font:400 30px/1.35 var(--serif);color:var(--ink);letter-spacing:0"></span></div>`, el => later(600, () => typeIn($('#lg', el), E1.logline, 40)));
    /* 4 · who is speaking */
    const C = E1.cast, names = Object.keys(C);
    B('Who is speaking?', 22, () => `${ask('Who is speaking?')}${ep1(30.6, true, '<div class="hsub"></div>')}${names.slice(0, 2).map((n, i) => `<div class="castc" style="${i ? 'right:60px' : 'left:60px'};top:110px;animation-delay:${1 + i * 1.2}s"><b>${esc(n)}</b><p>${esc(C[n].as || '')}</p><small>voice: a speech synthesizer (${esc(C[n].voice)})${C[n].robot ? ', with a metal filter' : ''}</small></div>`).join('')}`,
      el => { startVideos(el); hsubs(el); });
    B('Who is speaking?', 6, () => line(['No voice imitates a real person.']).replace('class="line"', 'class="line" style="bottom:auto;top:400px"'));
    /* 5 · where do the pictures come from */
    const P0 = E1.places[0], base = 'republic/planes/' + E1.id + '/p0a';
    B('Where do the pictures come from?', 12, () => `${ask('Where do the pictures come from?')}<div style="--c:var(--rust)"><div class="sbar" style="top:110px"><i></i><span id="q"></span></div></div><img id="fr" src="${base}_thumb.jpg" style="position:absolute;left:330px;top:230px;width:940px;opacity:0;transition:opacity 1.2s">
        <div class="line" style="bottom:40px"><span style="animation-delay:4s">${esc(P0.alt.title)}, ${P0.alt.year || ''}: a real place for an imaginary Mars.</span></div>`, el => { later(300, () => typeIn($('#q', el), P0.q)); later(3000, () => $('#fr', el).style.opacity = 1); });
    B('Where do the pictures come from?', 14, () => `<div class="mp" id="mp">${['far', 'mid', 'near'].map((k, i) => `<img src="${base}_${k}.webp" data-k="${k}"><span class="lbl" style="top:${20 + i * 30}%">${k.toUpperCase()}</span>`).join('')}</div>${line(['A depth model splits the frame into far, middle and near.'])}`,
      el => { const ims = [...el.querySelectorAll('#mp img')], lb = [...el.querySelectorAll('#mp .lbl')];
        later(1200, () => { ims.forEach((im, i) => im.style.transform = `translateZ(${i * 140}px) translateX(${-i * 60}px) rotateY(18deg)`); lb.forEach(l => l.style.opacity = 1); });
        later(7500, () => ims.forEach((im, i) => im.style.transform = `translateX(${-i * i * 22}px) scale(${1 + i * .04})`)); });
    const CAST = { 'BIG HANK': ['big-hank-sprite.webp', 'big-hank-1.webp', 'Bosque del Apache National Wildlife Refuge, 2005'], 'W.A.L.T.-E': ['w-a-l-t-e-sprite.webp', 'w-a-l-t-e-0.webp', 'Keep This Under Your Hood, about 1940'] };
    B('Where do the pictures come from?', 13, () => `<div class="mp">${['far', 'mid'].map(k => `<img src="${base}_${k}.webp">`).join('')}${Object.entries(CAST).map(([n, c], i) => `<img class="fig" id="f${i}" src="republic/planes/cast/${c[1]}" style="${i ? 'right:8%' : 'left:4%'};width:auto;inset:auto;${i ? 'right:6%' : 'left:4%'};bottom:4%;height:${i ? 40 : 66}%">`).join('')}<img src="${base}_near.webp"></div>
        ${Object.entries(CAST).map(([n, c], i) => `<div class="castc" style="${i ? 'right:40px' : 'left:40px'};top:${i ? 560 : 560}px;animation-delay:${2 + i * 1.5}s;width:300px"><b>${esc(n)}</b><small style="display:block;margin-top:4px">cut out of ${esc(c[2])}</small></div>`).join('')}`,
      el => later(400, () => el.querySelectorAll('.fig').forEach((f, i) => { f.style.opacity = 1; f.style.transform = `translateX(${i ? -40 : 40}px)`; })));
    B('Where do the pictures come from?', 9, () => `${ep1(20.5, true)}${line(['Put together, and moved through: one episode\'s stage.'])}`, el => startVideos(el));
    /* 6 · what if the archive spoke the lines */
    const RP = R.replay;
    B('What if the archive spoke?', 8, () => `${ask('What if the archive spoke the lines instead?')}<div class="scrip"><span>THE SCRIPT · ${esc(RP[0].who)}</span>“${esc(RP[0].line)}”</div>${line([`Every line was compared with ${fmt(R.clean)} sentences people actually said on film.`])}`);
    B('What if the archive spoke?', 15, () => { const cs = RP[0].cands.slice(0, 6), lo = Math.min(...cs.map(c => c.total)) - .02, hi = Math.max(...cs.map(c => c.total));
      return `<div class="scrip" style="font-size:30px;top:90px"><span>${esc(RP[0].who)}: “${esc(RP[0].line)}”</span></div><div class="rank" style="top:170px">${cs.map((c, i) => `<div class="${i === 0 ? 'won' : ''}" style="animation-delay:${.4 + i * .5}s"><span>“${esc(c.s)}”<small>${esc(c.title)} ${esc(c.year || '')}</small></span><i><b data-w="${(c.meaning - lo) / (hi - lo) * 100}"></b><u data-w="${c.words / (hi - lo) * 100}"></u></i><em>${c.total.toFixed(3)}</em></div>`).join('')}</div>
        ${line([`It won by ${(cs[0].total - cs[1].total).toFixed(3)}.`], 'rust: how close in meaning · gold: words in common · bars stretched to show thousandths')}`; },
      el => later(500, () => el.querySelectorAll('.rank [data-w]').forEach(b => b.style.width = Math.max(1, b.dataset.w) + '%')));
    RP.forEach((r, i) => { const c = r.cands[0]; B('What if the archive spoke?', Math.min(9, c.t1 - c.t0 + 4), () => `<video class="full" data-src="${esc(c.v)}" data-t="${c.t0 - .2}" data-snd="1" playsinline></video><div class="fog" style="background:linear-gradient(transparent 55%, rgba(0,0,0,.85))"></div>
        <div class="subl"><small>the script · ${esc(r.who)}</small><span style="font-size:26px">“${esc(r.line)}”</span></div><div class="subl" style="bottom:150px"><small class="arch">the archive says · ${esc(c.title)} ${esc(c.year || '')}</small><span class="arch">${esc(c.s)}</span></div>`, el => startVideos(el)); });
    /* 7 · one film per character */
    const sg = E1.segs.find(s => s.line === RP[0].line) || E1.segs[0], cast = E1.casting;
    B('One film per character', 12, () => `${ask('Could each character keep one voice?')}<div class="wit" style="grid-template-columns:1fr 1fr;top:160px">${Object.entries(cast).map(([n, v], i) => `<div style="animation-delay:${i * .8}s;border-color:var(--rust)"><b style="color:var(--rust)">${esc(n)}</b><span style="display:block;font:26px/1.3 var(--serif);color:var(--ink);margin-top:8px">every line from one film: ${esc(v.film.replace(/,\s*$/, ''))}</span></div>`).join('')}</div>
        ${line(['Another version casts one archival film per character,', 'so each voice stays the same person.'])}`);
    B('One film per character', Math.min(10, (sg.dur || 6) + 3), () => `<video class="full" data-src="${esc(sg.v)}" data-t="${sg.in || 0}" muted playsinline></video><audio data-a="1"></audio><div class="fog" style="background:linear-gradient(transparent 55%, rgba(0,0,0,.85))"></div>
        <div class="subl"><small>the script · ${esc(sg.who)}</small><span style="font-size:26px">“${esc(sg.line)}”</span></div><div class="subl" style="bottom:150px"><small class="arch">now says · ${esc(cast[sg.who] ? cast[sg.who].film.replace(/,\s*$/, '') : '')}</small><span class="arch">${esc(sg.said)}</span></div>`,
      el => { startVideos(el); if (sg.a && sg.a.v) { const v = K.voice(); v.src = sg.a.v; v.addEventListener('loadedmetadata', () => { v.currentTime = sg.a.in || 0; if (K.sound()) v.play().catch(() => { }); }, { once: true }); } }, { voice: true });
    /* 8 · what is left */
    B('What is left', 12, () => `${ep1(124, true, '<div class="hsub"></div>')}`, el => { startVideos(el); hsubs(el); });
    B('What is left', 11, () => line(['The archive can say almost anything, almost.', '“I decline” became “No, no, I don\'t want to” by a thousandth.', 'Is a satire still a satire when the archive speaks it?']).replace('class="line"', 'class="line" style="bottom:auto;top:330px"'));
    B('What is left', 40, () => `<div class="next"><small>WATCH ALL SEVENTEEN · OR THE ARCHIVE'S OWN VOICES</small><h1 style="color:var(--rust)">The Republic</h1><nav><a href="markov-republic.html" style="background:var(--rust)">All seventeen episodes</a><a class="ghost" href="markov-found-republic.html" style="color:var(--rust);border-color:var(--rust)">Four versions</a><a class="ghost" href="series.html" style="color:var(--rust);border-color:var(--rust)">All episodes</a></nav></div>`);
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
