<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>WAR GAMES · Stack</title>
<meta name="description" content="A film editor for archive footage: mark takes from clips, line them up, trim the joins while seeing both frames, compose figures in a shot, hear it, undo anything, and download the film with its sound or send it as a link.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--panel:#12100e;--ink:#ece6da;--dim:#b3ab9e;--faint:#6b645b;--rule:#2e2a26;--red:#e0483a;--lime:#c4f46a;--amber:#efb94a;
  --serif:"Fraunces",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font:13px/1.45 var(--mono);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
a{color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);min-width:0}
header h1{font:700 19px/1 var(--serif);margin:0;white-space:nowrap}
header .back{color:var(--dim);text-decoration:none;font-size:12px;white-space:nowrap}
#sys{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hb{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;font-size:12.5px;white-space:nowrap;min-height:30px}
.hb:hover{color:var(--ink);border-color:var(--dim)}
.hb:disabled{opacity:.35;cursor:default}
.hb.pri{background:var(--lime);color:#111;border-color:var(--lime)}
.hb.pri:disabled{background:none;color:var(--faint);border-color:var(--rule);opacity:1}
nav.modes{display:flex;gap:4px}
nav.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.modes kbd{font-size:10px;opacity:.6;margin-left:4px}
main{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
body.film main{grid-template-columns:1fr}
body.film aside,body.film .strip,body.film .chips,body.film .line,body.film .heard,body.film .srcbar{display:none!important}
.col{display:flex;flex-direction:column;padding:10px 14px 10px;min-width:0;min-height:0}
.screen{position:relative;flex:1 1 auto;min-height:140px;background:#000;border-radius:4px;overflow:hidden}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mode-tag{position:absolute;left:8px;top:8px;font-size:10.5px;letter-spacing:.14em;color:var(--dim);background:#0b0a09cc;padding:2px 7px;border-radius:3px;pointer-events:none;z-index:2}
.table{position:absolute;inset:0;overflow:auto;background:#000;padding:10px;z-index:3}
.table h4{font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--dim);margin:10px 0 6px;text-transform:uppercase}
.table h4 span{color:var(--faint);letter-spacing:0;text-transform:none;margin-left:8px}
.prev{display:flex;gap:12px;align-items:flex-start}
.prev video{width:min(46%,420px);aspect-ratio:16/9;background:#111;border-radius:3px}
.prev div{font-size:12px;color:var(--dim)}.prev div b{display:block;font:400 17px/1.25 var(--serif);color:var(--ink);margin-bottom:4px}
.trow{position:relative;display:flex;flex-wrap:wrap;gap:8px;min-height:104px;padding:6px;border:1px dashed #2a2622;border-radius:4px}
.trow.hot{border-color:var(--lime)}
.tile{position:relative;width:160px;cursor:grab;touch-action:none;user-select:none}
.tile canvas{display:block;width:160px;height:90px;border-radius:2px;background:#111}
.tile.sel canvas{outline:2px solid var(--lime)}
.tile.lift{opacity:.35}
.tile small{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile small b{color:var(--ink);font-weight:500}
.tins{position:absolute;width:3px;background:var(--lime);border-radius:2px;pointer-events:none;z-index:5}
.ghost{position:fixed;z-index:80;pointer-events:none;background:#14120fee;border:1px solid var(--lime);color:var(--ink);font-size:11.5px;padding:4px 8px;border-radius:4px;white-space:nowrap}
.srcbar{flex:0 0 auto;margin-top:8px}
.band{position:relative;height:58px;background:var(--panel);border-radius:3px;touch-action:none;cursor:pointer;overflow:hidden}
.band canvas{position:absolute;inset:0;width:100%;height:100%}
.srcrow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.srcrow .tc{margin-left:auto}
.strip{position:relative;height:64px;margin-top:8px;background:var(--panel);border-radius:3px;flex:0 0 auto;touch-action:none;overflow:hidden}
.strip .sh{position:absolute;top:0;bottom:0;border-right:2px solid var(--bg);cursor:grab;opacity:.78;overflow:hidden;background:#1a1815}
.strip .sh.sel{opacity:1;box-shadow:inset 0 0 0 2px var(--lime)}
.strip .sh.lift{opacity:.3}
.strip .sh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.strip .sh canvas{position:absolute;left:0;right:0;bottom:0;height:16px;width:100%;pointer-events:none}
.strip .sh b{position:absolute;left:14px;top:3px;font:500 10px var(--mono);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.strip .sh span{position:absolute;left:14px;right:14px;top:17px;font:300 11.5px/1.15 var(--serif);color:#fff;text-shadow:0 1px 2px #000,0 0 5px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.strip .sh i{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;z-index:2}
.strip .sh i.a{left:0}.strip .sh i.b{right:0}
.strip .sh.sel i::after{content:"";position:absolute;top:18px;bottom:18px;left:5px;width:2px;background:var(--lime);border-radius:1px}
.strip .sh u{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#e0483a55 0 5px,transparent 5px 10px);pointer-events:none}
.strip .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;z-index:3;left:0}
.strip .ins{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--lime);z-index:4;pointer-events:none}
.chips{display:flex;gap:5px;margin-top:6px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;min-height:34px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips .lb{color:var(--faint);font-size:10.5px;letter-spacing:.1em;margin-right:2px;white-space:nowrap}
.chips button{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:2px 10px 2px 3px;background:#0d0c0b;border:1px solid var(--rule);border-radius:16px;color:var(--dim);font-size:11px;max-width:200px;touch-action:none}
.chips button img{height:26px;width:26px;object-fit:contain;border-radius:12px;background:#000;pointer-events:none}
.chips button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.chips button.sel{border-color:var(--lime);color:var(--ink)}
.chips button.g img{object-fit:cover}
.chips button.add{padding:2px 12px;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.line{display:flex;gap:6px;margin:8px 0 0;flex:0 0 auto;align-items:center}
.line input{flex:1;min-width:0;font:italic 300 17px/1.2 var(--serif);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:22px;padding:10px 16px}
.line input::placeholder{color:#6b645b}
.pill{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:20px;padding:8px 13px;white-space:nowrap;min-height:38px}
.pill:hover{color:var(--ink);border-color:var(--dim)}
.pill.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:72px}
#mic[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
#hands[aria-pressed=true]{background:var(--lime);color:#111;border-color:var(--lime)}
#snd[aria-pressed=false]{text-decoration:line-through}
.heard{height:17px;margin:4px 6px 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.heard b{color:var(--lime);font-weight:500}
.tc{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;white-space:nowrap}
aside{border-left:1px solid var(--rule);background:var(--panel);padding:12px 14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:0 0 auto}
h3 button{background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.04em;text-transform:none;padding:0}
#lastAct{text-transform:none;letter-spacing:0;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.what{flex:0 0 auto;min-height:44px;margin-bottom:6px}
.what b{display:block;font:400 17px/1.25 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what textarea{width:100%;height:52px;resize:none;background:var(--bg);border:1px solid var(--rule);border-radius:4px;color:var(--ink);font:300 16px/1.3 var(--serif);padding:6px 8px}
.what small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phu{display:none;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:4px;flex:0 0 auto;margin-bottom:10px;min-height:27px}
.acts button{background:none;border:1px solid var(--rule);border-radius:4px;color:var(--dim);padding:4px 8px;font-size:11px;min-height:28px}
.acts button:hover{color:var(--ink);border-color:var(--dim)}
.acts button.go{color:#111;background:var(--lime);border-color:var(--lime)}
.acts label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;width:100%}
.acts input[type=range]{flex:1;accent-color:var(--lime)}
.find{display:flex;gap:5px;margin:2px 0 6px;flex:0 0 auto}
.find input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:6px 12px;font-size:13px}
.tray{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px;align-content:start;scrollbar-gutter:stable}
.tray.g{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.tray button{position:relative;height:74px;background:#0d0c0b;border:1px solid var(--rule);border-radius:3px;padding:2px;display:grid;place-items:center;overflow:hidden;touch-action:none}
.tray.g button{height:62px;padding:0}
.tray button:hover{border-color:var(--dim)}
.tray button.on{border-color:var(--lime)}
.tray img{max-width:100%;max-height:100%;display:block;pointer-events:none}
.tray.g img{width:100%;height:100%;object-fit:cover}
.tray small{position:absolute;left:2px;right:2px;bottom:1px;font-size:9px;color:#d8d2c6;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;pointer-events:none}
.tray .note{grid-column:1/-1;color:var(--faint);font-size:11.5px;padding:4px 2px}
.pop{position:fixed;z-index:70;background:#14120f;border:1px solid var(--rule);border-radius:6px;padding:8px;min-width:270px;max-width:92vw;max-height:80vh;overflow:auto;box-shadow:0 10px 30px #000a}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;color:var(--ink)}
.pop button:hover{background:#ffffff0d}
.pop button small{display:block;color:var(--dim);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.pop .hl{font-size:11.5px;color:var(--dim);padding:3px 10px}
#prog{position:fixed;inset:0;z-index:90;background:#000c;display:grid;place-items:center}
#prog>div{background:#14120f;border:1px solid var(--rule);border-radius:6px;padding:18px 20px;width:min(440px,90vw)}
#prog i{display:block;height:4px;background:var(--rule);margin:12px 0}#prog i b{display:block;height:100%;background:var(--lime);width:0}
.drag{position:fixed;z-index:75;pointer-events:none;width:70px;height:70px;margin:-35px 0 0 -35px;opacity:.85;display:grid;place-items:center}
.drag img{max-width:100%;max-height:100%}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#handVid{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#handPrev{position:fixed;right:12px;bottom:12px;width:120px;height:90px;border:1px solid var(--rule);border-radius:4px;background:#000c;z-index:61;pointer-events:none}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:18px;font-size:12px;z-index:95;pointer-events:none;max-width:90vw;text-align:center}
@media (max-width:900px){
 header{padding:6px 8px;gap:5px}header h1{font-size:15px}header h1 span,header .lg,header .back,#sys,nav.modes kbd,#undoH,#redoH{display:none}nav.modes{margin-left:auto}.hb{padding:4px 7px;font-size:11.5px}
 main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .col{padding:6px 8px 4px}.screen{flex:none;aspect-ratio:16/9;min-height:0}.strip{height:48px;margin-top:5px}.strip .sh span{display:none}.chips{margin-top:4px}.line{margin-top:5px;gap:4px}.line input{font-size:15px;padding:8px 10px}.pill{padding:6px 9px;font-size:12px;min-height:34px}.pill.pri{min-width:54px}#hands,.line .tc{display:none}
 .heard{height:15px;margin-top:2px}.band{height:44px}.phu{display:inline}.phu button{border:1px solid var(--rule);border-radius:4px;padding:3px 8px;min-height:28px}#lastAct{display:none}
 aside{border-left:0;border-top:1px solid var(--rule);padding:8px 10px}.what{min-height:0}.what textarea{height:40px}.tray button{height:58px}.tray.g button{height:50px}.tile,.tile canvas{width:120px}.tile canvas{height:68px}.prev video{width:52%}
}
</style>
</head>
<body>
<header>
  <a class="back" href="./#wall">← Lab</a>
  <h1><span>WAR GAMES · </span>Stack</h1>
  <span id="sys">waking the archive</span>
  <nav class="modes" id="modes" aria-label="Views"></nav>
  <button class="hb" id="undoH" title="Undo (Z)">Undo</button><button class="hb" id="redoH" title="Redo (Shift Z)">Redo</button>
  <button class="hb" id="filmsB" title="Your films, a new film, the examples, the history of this one">Films</button>
  <button class="hb pri" id="sendB" title="Download the film with its sound, or send it as a link"><span class="lg">Download / </span>Send</button>
</header>
<main>
  <section class="col">
    <div class="screen" id="screen"><canvas id="cv" tabindex="0" aria-label="The picture"></canvas><span class="mode-tag" id="tag"></span><div class="table" id="table" hidden></div></div>
    <div class="srcbar" id="srcbar" hidden>
      <div class="band" id="band"><canvas id="bandc"></canvas></div>
      <div class="srcrow"><button class="hb" id="sPlay">Play source</button><button class="hb" id="sIn" title="Mark in (I)">Mark in</button><button class="hb" id="sOut" title="Mark out (O)">Mark out</button>
        <button class="hb pri" id="sIns" title="Put the marked take into the film after the selected shot">Insert after shot</button><button class="hb" id="sRep" title="The selected shot takes the marked interval instead">Replace shot</button><button class="hb" id="sTab" title="Keep the take on the table, outside the film">To table</button><span class="tc" id="sTc"></span></div>
    </div>
    <div class="strip" id="strip" aria-label="The sequence"><div class="ph" id="ph"></div><div class="ins" id="ins" hidden></div></div>
    <div class="chips" id="chips"></div>
    <form class="line" id="lineF" autocomplete="off">
      <button type="button" class="pill pri" id="play">Play</button>
      <input id="line" placeholder="write a line for a new shot · or: put a horse there" aria-label="Write a line" enterkeyhint="send">
      <button type="button" class="pill" id="snd" aria-pressed="true" title="Sound on or off (M)">Sound</button>
      <button type="button" class="pill" id="mic" aria-pressed="false" title="Say lines; point at the screen as you say that and there">Speak</button>
      <button type="button" class="pill" id="hands" aria-pressed="false" title="Hands through the camera: pinch a figure to hold it">Hands</button>
      <span class="tc" id="tc">0:00</span>
    </form>
    <div class="heard" id="heard" aria-live="polite"></div>
  </section>
  <aside id="side">
    <h3><span id="whatH">This shot</span><span id="lastAct"></span><span class="phu"><button id="undoP" title="Undo">undo</button> <button id="redoP" title="Redo">redo</button></span></h3>
    <div class="what" id="what"></div>
    <div class="acts" id="acts"></div>
    <h3><span id="trayH">Figures</span><button id="trayT"></button></h3>
    <form class="find" id="findF" autocomplete="off"><input id="q" placeholder="find a figure: a dog, hands, smoke" enterkeyhint="search"></form>
    <div class="tray" id="tray"></div>
  </aside>
</main>
<div id="pop" class="pop" hidden></div>
<div id="prog" hidden><div><b id="progT">Rendering</b><i><b id="progB"></b></i><small id="progS" style="color:var(--dim)"></small><div style="margin-top:12px;text-align:right"><button class="hb" id="progX">Stop</button></div></div></div>
<canvas id="hand"></canvas><video id="handVid" playsinline muted></video><canvas id="handPrev" hidden></canvas><div id="toast" hidden></div>

<script src="markov/engine.js?v=6"></script>
<script src="markov/clip-text.js?v=5"></script>
<script src="markov/shared.js?v=5"></script>
<script src="markov/hands.js?v=3"></script>
<script>
