<style>
:root{--bg:#0b0a09;--panel:#12100e;--ink:#ece6da;--dim:#b3ab9e;--faint:#6b645b;--rule:#2e2a26;--red:#e0483a;--lime:#c4f46a;--amber:#efb94a;
  --serif:"Fraunces",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font:13px/1.45 var(--mono);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
a{color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--rule);min-width:0}
header h1{font:700 19px/1 var(--serif);margin:0;white-space:nowrap}
header .back{color:var(--dim);text-decoration:none;font-size:12px;white-space:nowrap}
header .back:hover{color:var(--ink)}
#sys{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hb{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.hb:hover{color:var(--ink);border-color:var(--dim)}
.hb.pri{background:var(--lime);color:#111;border-color:var(--lime)}
nav.modes{display:flex;gap:4px}
nav.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.modes kbd{font-size:10px;opacity:.6;margin-left:4px}
main{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
.col{display:flex;flex-direction:column;padding:10px 14px 10px;min-width:0;min-height:0}
.screen{position:relative;flex:1 1 auto;min-height:140px;background:#000;border-radius:4px;overflow:hidden}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.board{position:absolute;inset:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:10px;align-content:start;background:#000}
.board figure{margin:0;cursor:pointer}
.board canvas{position:static;width:100%;height:auto;aspect-ratio:16/9;border-radius:2px;background:#111}
.board figure.cur canvas{outline:2px solid var(--lime)}
.board figcaption{font:300 14px/1.25 var(--serif);padding:4px 2px 0;color:var(--ink)}
.board figcaption b{font:10px var(--mono);color:var(--dim);margin-right:6px;font-weight:400}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none}
.empty div{pointer-events:auto;max-width:560px}
.empty h2{font:300 clamp(24px,4vw,40px)/1.15 var(--serif);margin:0 0 10px;color:#d8d2c6}
.empty p{color:var(--dim);margin:0 0 16px}
.chips0{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips0 button{border:1px solid #3a3530;background:#0d0c0bcc;border-radius:20px;padding:8px 14px;color:#d8d2c6;font:italic 300 15px var(--serif)}
.chips0 button:hover{border-color:var(--dim)}
/* the shots in a row, each as wide as it is long */
.strip{position:relative;height:56px;margin-top:8px;background:var(--panel);border-radius:3px;flex:0 0 auto;touch-action:none;overflow:hidden}
.strip .sh{position:absolute;top:0;bottom:0;background-size:cover;background-position:center;border-right:2px solid var(--bg);cursor:grab;opacity:.72;overflow:hidden}
.strip .sh.cur{opacity:1;box-shadow:inset 0 0 0 2px var(--lime)}
.strip .sh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.strip .sh b{position:absolute;left:4px;top:3px;font:500 10px var(--mono);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.strip .sh span{position:absolute;left:4px;right:4px;bottom:3px;font:300 11.5px/1.15 var(--serif);color:#fff;text-shadow:0 1px 2px #000,0 0 5px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sh i{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.strip .sh.wait{background:repeating-linear-gradient(45deg,#1a1815 0 8px,#141210 8px 16px)}
.strip .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;z-index:3;left:0}
/* the layers of the shot under the playhead, back to front */
.chips{display:flex;gap:5px;margin-top:6px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;min-height:34px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips .lb{color:var(--faint);font-size:10.5px;letter-spacing:.1em;margin-right:2px;white-space:nowrap}
.chips button{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:2px 10px 2px 3px;background:#0d0c0b;border:1px solid var(--rule);border-radius:16px;color:var(--dim);font-size:11px;max-width:200px;touch-action:none}
.chips button img{height:26px;width:26px;object-fit:contain;border-radius:12px;background:#000;pointer-events:none}
.chips button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.chips button.sel{border-color:var(--lime);color:var(--ink)}
.chips button.g img{object-fit:cover}
.chips button.add{padding:2px 12px;color:var(--ink)}
.line{display:flex;gap:6px;margin:8px 0 0;flex:0 0 auto;align-items:center}
.line input{flex:1;min-width:0;font:italic 300 17px/1.2 var(--serif);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:22px;padding:10px 16px}
.line input::placeholder{color:#6b645b}
.line input:focus{outline:1px solid var(--lime);border-color:var(--lime)}
.pill{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:20px;padding:8px 13px;white-space:nowrap}
.pill:hover{color:var(--ink);border-color:var(--dim)}
.pill.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:72px}
#mic[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
#hands[aria-pressed=true]{background:var(--lime);color:#111;border-color:var(--lime)}
.heard{height:17px;margin:4px 6px 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.heard b{color:var(--lime);font-weight:500}
.tc{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;white-space:nowrap}
aside{border-left:1px solid var(--rule);background:var(--panel);padding:12px 14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:0 0 auto}
h3 button{background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.04em;text-transform:none;padding:0}
h3 button:hover{color:var(--ink)}
.what{flex:0 0 auto;min-height:44px;margin-bottom:6px}
.what b{display:block;font:400 17px/1.25 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what textarea{width:100%;height:52px;resize:none;background:var(--bg);border:1px solid var(--rule);border-radius:4px;color:var(--ink);font:300 16px/1.3 var(--serif);padding:6px 8px}
.what textarea:focus{outline:1px solid var(--lime);border-color:var(--lime)}
.what small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;flex-wrap:wrap;gap:4px;flex:0 0 auto;margin-bottom:10px;min-height:27px}
.acts button{background:none;border:1px solid var(--rule);border-radius:4px;color:var(--dim);padding:3px 8px;font-size:11px}
.acts button:hover{color:var(--ink);border-color:var(--dim)}
.acts label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;width:100%}
.acts input[type=range]{flex:1;accent-color:var(--lime)}
.find{display:flex;gap:5px;margin:2px 0 6px;flex:0 0 auto}
.find input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:6px 12px;font-size:13px}
.find input:focus{outline:1px solid var(--lime);border-color:var(--lime)}
.tray{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px;align-content:start;scrollbar-gutter:stable}
.tray.g{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.tray button{position:relative;height:74px;background:#0d0c0b;border:1px solid var(--rule);border-radius:3px;padding:2px;display:grid;place-items:center;overflow:hidden;touch-action:none}
.tray.g button{height:62px;padding:0}
.tray button:hover{border-color:var(--dim)}
.tray button.on{border-color:var(--lime)}
.tray img{max-width:100%;max-height:100%;display:block;pointer-events:none}
.tray.g img{width:100%;height:100%;object-fit:cover}
.tray small{position:absolute;left:2px;right:2px;bottom:1px;font-size:9px;color:#d8d2c6;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;pointer-events:none}
.tray .note{grid-column:1/-1;color:var(--faint);font-size:11.5px;padding:4px 2px}
.pop{position:fixed;z-index:70;background:#14120f;border:1px solid var(--rule);border-radius:6px;padding:8px;min-width:270px;max-width:92vw;box-shadow:0 10px 30px #000a}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;color:var(--ink)}
.pop button:hover{background:#ffffff0d}
.pop button small{display:block;color:var(--dim);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.pop .row{display:flex;justify-content:space-between;gap:8px}
#prog{position:fixed;inset:0;z-index:90;background:#000c;display:grid;place-items:center}
#prog div{background:#14120f;border:1px solid var(--rule);border-radius:6px;padding:18px 20px;width:min(420px,90vw)}
#prog i{display:block;height:4px;background:var(--rule);margin:12px 0}#prog i b{display:block;height:100%;background:var(--lime);width:0}
.drag{position:fixed;z-index:75;pointer-events:none;width:70px;height:70px;margin:-35px 0 0 -35px;opacity:.85;display:grid;place-items:center}
.drag img{max-width:100%;max-height:100%}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#handVid{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#handPrev{position:fixed;right:12px;bottom:12px;width:120px;height:90px;border:1px solid var(--rule);border-radius:4px;background:#000c;z-index:61;pointer-events:none}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:18px;font-size:12px;z-index:95;pointer-events:none;max-width:90vw;text-align:center}
@media (max-width:900px){
 header{padding:6px 8px;gap:6px}header h1{font-size:15px}#sys,.back.x,nav.modes kbd{display:none}nav.modes{margin-left:auto}.hb{padding:4px 7px;font-size:11.5px}
 main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 header h1 span,header .lg,header .back{display:none}.pill.pri{min-width:54px}.line{gap:4px}.line input{padding:8px 10px}.screen{flex:none;aspect-ratio:16/9;min-height:0}.tc{display:none}.heard{height:15px;margin-top:2px}
 .col{padding:6px 8px 4px}.strip{height:42px;margin-top:5px}.chips{margin-top:4px}.line{margin-top:5px}.line input{font-size:15px;padding:8px 12px}.pill{padding:6px 9px;font-size:12px}#hands{display:none}
 aside{border-left:0;border-top:1px solid var(--rule);padding:8px 10px}.what{min-height:0}.what textarea{height:40px}.tray button{height:58px}.tray.g button{height:50px}
}
</style>
</head>

<header>

  <h1><span>WAR GAMES · </span>Stack</h1>
  <span id="sys">waking the archive</span>

<main>
  <section class="col">
    <div class="screen" id="screen"><canvas id="cv"></canvas><div class="board" id="board" hidden></div>
      <div class="empty" id="empty" hidden><div><h2>A line is a shot.</h2><p>Write a line below, or say it. The archive gives it a ground and figures cut out of other films step in front. Line after line, they play as one film.</p><div class="chips0" id="starters"></div></div></div></div>
    <div class="strip" id="strip"><div class="ph" id="ph"></div></div>
    <div class="chips" id="chips"></div>

      <button type="button" class="pill" id="mic" aria-pressed="false" title="Say lines; point at the screen as you say that and there">Speak</button>
      <button type="button" class="pill" id="hands" aria-pressed="false" title="Hands through the camera: pinch a figure to hold it">Hands</button>
      <span class="tc" id="tc">0:00</span>

    <div class="heard" id="heard"></div>
  </section>
  <aside id="side">
    <h3><span id="whatH">This shot</span><span><button id="undoB" title="Undo (Z)">undo</button></span></h3>

    <div class="acts" id="acts"></div>
    <h3><span id="trayH">Figures</span><button id="trayT"></button></h3>
    <form class="find" id="findF" autocomplete="off"><input id="q" placeholder="find a figure: a dog, hands, smoke" enterkeyhint="search"></form>
    <div class="tray" id="tray"></div>
  </aside>
</main>
<div id="pop" class="pop" hidden></div>
<div id="prog" hidden><div><b id="progT">Rendering</b><i><b id="progB"></b></i><small id="progS" style="color:var(--dim)"></small><div style="margin-top:12px;text-align:right;padding:0;border:0;width:auto;background:none"><button class="hb" id="progX">Stop</button></div></div></div>
<canvas id="hand"></canvas><video id="handVid" playsinline muted></video><canvas id="handPrev" hidden></canvas><div id="toast" hidden></div>

/* ---------- finding by words ---------- */
const STOP=new Set('a an the of some this that these those it them there here please and to with in on at into from by for is are be like'.split(' '));

async function findFigs(q){await castP;const ws=words(q),sc=SAM.figs.map(F=>{const dw=words(F.desc);let s=0;for(const w of ws)if(dw.includes(w))s+=2;return s;}),kw=rankOf(Float32Array.from(sc)).filter(i=>sc[i]>0);
 if(readerReady()||!kw.length){try{if(!readerReady())toast('Reading your words: the reader arrives once, in about a minute.');const [v]=await embed([q]);if(v){const r=rankOf(figSims(v));return kw.length?[...kw.slice(0,6),...r.filter(i=>!kw.slice(0,6).includes(i))]:r;}}catch(e){}}return kw;}

 if(v)return rankOf(LIB.sims(v)).slice(0,48).map(k=>({k:'arch',id:LIB.shots[k].id}));const ws=words(q),sc=LIB.shots.map(s=>{const t=words(s.title);return ws.reduce((a,w)=>a+(t.includes(w)?1:0),0);});return rankOf(Float32Array.from(sc)).filter(i=>sc[i]>0).slice(0,48).map(k=>({k:'arch',id:LIB.shots[k].id}));}
function findDoodle(q){const ws=words(q).join(' ');if(!ws)return null;const L=[...DOODLES].sort((a,b)=>b.word.length-a.word.length);return L.find(d=>d.word===ws)||L.find(d=>new RegExp('\\b'+d.word+'\\b').test(ws))||null;}

function cloudOf(sh,list,c,o={}){const n=list.length,out=[];list.forEach((it,k)=>{const ang=k*2.399,r=.05+.2*Math.sqrt((k+.5)/n),z=clamp(.15+.8*((k*.618)%1),0,1),sc=.4+.9*z;

 if(it.fig!=null){const pl=placeFig(it.fig,0);e=figEl(it.fig,{x:p.x,y:p.y,s:pl.s*(o.row?.8:sc)*.7,z:o.row?.55:z},sh.len);}else{doodle(it.slug);e={id:uid(),kind:'doodle',slug:it.slug,word:it.word,z:o.row?.55:z,flip:k%2,t0:0,t1:sh.len,keys:[{t:0,x:p.x,y:p.y,s:.16*(o.row?1:sc)}]};}

function path(e,dir,sh){const p=at(e,e.t0),a=e.t0,b=e.t1;if(dir==='across'){const l=p.x>.5;e.flip=l?1:0;e.keys=[{t:a,x:l?1.12:-.12,y:p.y,s:p.s},{t:b,x:l?-.12:1.12,y:p.y,s:p.s}];return;}

/* ---------- a line is either a new shot, or something done to this one ---------- */
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,couple:2,pair:2,few:3,several:4,some:3,many:7,lots:8};

async function say(raw,ctx={}){let t=' '+raw.toLowerCase().replace(/[“”"’]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim()+' ';heard('“'+raw.trim()+'”');
 const has=r=>r.test(t),sh=curShot(),c=shotAt(T),lt=c?T-c.a:0,there=ctx.there||null,that=ctx.that||findEl(SEL);
 if(has(/^ (play|go|roll|action) $/))return setPlay(true);if(has(/^ (stop|pause|hold it) $/))return setPlay(false);if(has(/^ undo( that)? $/))return undo();if(has(/^ (rewind|from the top|back to the start) $/))return seek(0);
 let m=t.match(/^ (?:and )?(?:then|cut to|next) (?:to )?(.+) $/);if(m)return addLine(m[1].trim()[0].toUpperCase()+m[1].trim().slice(1));
 const short=t.trim().split(' ').length<=5;if(!CMD.test(t)&&!THATV.test(t)&&!(short&&(GROUP.test(t)||/^ (\d+|two|three|four|five|six|seven|eight|nine|ten|a cloud|a flock|a crowd) /.test(t))))return addLine(raw);
 if(!sh)return addLine(raw);
 m=t.match(/^ (?:ground|background|backdrop|swap the (?:ground|background) for|change the (?:ground|background) to) (?:is |to |for )?(.+) $/);if(m){const r=await findGrounds(m[1]);if(!r.length)return toast('No ground for “'+m[1].trim()+'”.');snap();sh.g=r[0];save();showTray('grounds',m[1].trim(),r);return toast('Ground: '+G(sh.g).title+'.');}
 const refThat=THATV.test(t)&&!GROUP.test(t);
 if(refThat){if(!that)return toast('Point at a figure as you say that, or tap it first.');const e=that,s=shotOf(e);snap();let did='';
  if(has(/ (remove|delete|lose|get rid|kill|drop|take away|erase|take out) /)){s.figs.splice(s.figs.indexOf(e),1);SEL=null;did='removed';}
  else if(has(/ (more of|a cloud of|lots more) /)){cloudOf(s,e.kind==='fig'?nearFigs(FI.get(e.ref),8).map(i=>({fig:i})):Array(6).fill({slug:e.slug,word:e.word}),there||at(e,lt));did='a cloud like it';}
  else if(has(/ (copy|duplicate|another|again|one more|clone) /)){const p=at(e,lt),d=dupEl(e,there?there.x-p.x:.07,there?there.y-p.y:.03);s.figs.push(d);SEL=d.id;did='copied';}
  else if(has(/ (walk|run|fly|move|go|slide|cross|drift)s? ?(left|right|up|down|across|away|off)/)){path(e,t.match(/ (left|right|up|down|across|away|off)/)[1],s);did='moving';}
  else if(has(/ (bigger|larger|grow|huge|giant)/)){e.keys.forEach(k=>k.s*=has(/ (huge|giant|much)/)?1.7:1.3);did='bigger';}
  else if(has(/ (smaller|shrink|tiny|little)/)){e.keys.forEach(k=>k.s/=has(/ (tiny|much)/)?1.7:1.3);did='smaller';}
  else if(has(/ (front|forward|nearer|closer)/)){e.z=clamp((e.z??.5)+.2,0,1);e.keys.forEach(k=>k.s*=1.15);did='nearer';}
  else if(has(/ (back|behind|farther|further|away|distance)/)){e.z=clamp((e.z??.5)-.2,0,1);e.keys.forEach(k=>k.s/=1.15);did='farther';}
  else if(has(/ (flip|turn around|mirror)/)){e.flip=e.flip?0:1;did='flipped';}
  else if(has(/ (start|begin|come in|enter)s? (it )?(now|here)/)){e.t0=Math.min(lt,e.t1-.3);did='comes in now';}else if(has(/ (end|leave|exit|go)s? (it )?(now|here)/)){e.t1=Math.max(lt,e.t0+.3);did='leaves now';}
  else if(there){const p=at(e,lt),dx=there.x-p.x,dy=there.y-p.y;e.keys.forEach(k=>{k.x+=dx;k.y+=dy;});did='moved there';}
