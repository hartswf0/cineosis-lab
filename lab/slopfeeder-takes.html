<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slopfeeder Takes</title>
<meta name="description" content="Watch THE SLOPFEEDER story cut and choose which generated take of each shot you see: many pickups are the same shot generated twice.">
<meta name="theme-color" content="#0c0d0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0f'/%3E%3Crect x='4' y='16' width='24' height='5' rx='1.5' fill='%23383d44'/%3E%3Cpath d='M9 16 L11 9 H16 L18 16 Z' fill='%23f25a17'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0c0d0f; --top:#16181b; --ink:#ebe5d8; --dim:#858b93; --faint:#24282d; --hot:#f25a17; --sans:'Barlow Condensed',Impact,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
*{ box-sizing:border-box; } html,body{ margin:0; } body{ background:var(--bg); color:var(--ink); font:400 13px/1.55 var(--mono); }
[hidden]{ display:none!important; }
header{ max-width:1180px; margin:0 auto; padding:22px 16px 6px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
h1{ margin:0; font:700 30px var(--sans); letter-spacing:.14em; } h1 b{ color:var(--hot); } header p{ margin:0; color:var(--dim); max-width:620px; } header a{ margin-left:auto; color:var(--hot); text-decoration:none; font:700 13px var(--sans); letter-spacing:.14em; }
main{ max-width:1180px; margin:0 auto; padding:8px 16px 40px; }
.stage{ position:relative; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; }
.stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
.stage .ov{ opacity:0; pointer-events:none; } .stage .ov.on{ opacity:1; }
.cap{ position:absolute; left:6%; right:6%; bottom:8%; text-align:center; font:700 clamp(13px,2.3vw,24px)/1.25 Arial,sans-serif; color:#faf6ec; text-shadow:0 0 3px #000,0 0 3px #000,0 2px 4px #000; pointer-events:none; }
.tag{ position:absolute; right:10px; top:10px; font:700 12px var(--sans); letter-spacing:.14em; background:#000b; padding:3px 8px; border-radius:2px; pointer-events:none; } .tag b{ color:var(--hot); }
.bar{ display:flex; gap:10px; align-items:center; margin:10px 0 6px; flex-wrap:wrap; }
button{ font:700 13px var(--sans); letter-spacing:.14em; background:none; color:var(--ink); border:1px solid var(--faint); border-radius:3px; padding:6px 12px; cursor:pointer; } button:hover{ border-color:var(--hot); } button.on{ background:var(--hot); color:#170b04; border-color:var(--hot); }
.clock{ color:var(--dim); font-size:12px; min-width:96px; } .where{ font:600 15px var(--sans); letter-spacing:.06em; }
.lane{ position:relative; height:34px; background:var(--top); border-radius:3px; cursor:pointer; margin:4px 0 14px; touch-action:none; }
.lane i{ position:absolute; top:0; bottom:0; } .lane .scr{ background:#2a2f36; } .lane .act{ background:#1d2024; } .lane .brd{ background:#3a3226; }
.lane .tk{ position:absolute; top:5px; width:3px; height:24px; background:var(--dim); border-radius:1px; } .lane .tk.alt{ background:var(--hot); } .lane .tk.chosen{ background:#ffd36a; }
.lane .ph{ position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; }
.lane .lb{ position:absolute; top:-17px; font:700 10px var(--sans); letter-spacing:.12em; color:var(--dim); }
h2{ margin:0 0 6px; font:700 18px var(--sans); letter-spacing:.1em; } h2 span{ color:var(--dim); font-weight:500; }
.takes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.take{ position:relative; border:2px solid var(--faint); border-radius:4px; overflow:hidden; cursor:pointer; background:#000; padding:0; }
.take img{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; } .take span{ position:absolute; left:6px; bottom:4px; font:700 11px var(--sans); letter-spacing:.1em; background:#000c; padding:1px 6px; border-radius:2px; color:var(--ink); }
.take.sel{ border-color:var(--hot); } .take:hover{ border-color:#ffd36a; } .take em{ position:absolute; right:6px; top:4px; font:700 11px var(--sans); color:var(--hot); font-style:normal; background:#000c; padding:0 5px; border-radius:2px; }
.note{ color:var(--dim); margin:6px 0 0; } .none{ color:var(--dim); }
.mine{ margin-top:18px; color:var(--dim); font-size:12px; } .mine b{ color:var(--ink); font-weight:500; }
@media (max-width:600px){ h1{ font-size:24px; } header a{ margin-left:0; } .takes{ grid-template-columns:repeat(3,1fr); } }
</style></head><body>
<header><h1>SLOP<b>FEEDER</b> · TAKES</h1><p>Many of the generated shots are the same shot, generated more than once. Watch the story cut and choose which take you see: pick one under the picture (or press 1–7), and the film plays your take from then on. Your choices stay in this browser.</p><a href="slopfeeder-films.html">THE FILMS ↗</a></header>
<main>
  <div class="stage" id="stage"><video id="base" playsinline preload="auto"></video><video class="ov" id="ovA" muted playsinline preload="auto"></video><video class="ov" id="ovB" muted playsinline preload="auto"></video><div class="cap" id="cap" hidden></div><div class="tag" id="tag" hidden></div></div>
  <div class="bar"><button id="play">▶ PLAY</button><span class="clock" id="clock">0:00</span><span class="where" id="where"></span><span style="margin-left:auto"></span><button id="prev">◀ SHOT WITH TAKES</button><button id="next">SHOT WITH TAKES ▶</button></div>
  <div class="lane" id="lane"></div>
  <h2 id="th">THIS SHOT</h2><div class="takes" id="takes"></div><p class="note" id="note"></p>
  <div class="mine" id="mine"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const base = $('base'), ovs = [$('ovA'), $('ovB')], KEY = 'sf-takes';
  let ST = null, shots = [], pick = {}, cur = -1, shown = -1;
  try { pick = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { pick = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) { } };
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const media = c => `slopfeeder/ai/web/${c}.mp4`;
  const takesOf = s => [{ clip: s.clip, ss: s.ss, out: s.ss + s.d * (s.rate || 1) + 5, thumb: s.thumb, own: true }, ...(s.alts || [])];
  const keyOf = s => `${s.act}:${s.clip}:${s.ss}`;
  const chosen = s => { const k = pick[keyOf(s)] || 0; return k ? takesOf(s)[k] : null; };
  const shotAt = t => { for (let i = 0; i < shots.length; i++) if (t >= shots[i].t && t < shots[i].t + shots[i].d) return i; return -1; };
  fetch('slopfeeder/story.json').then(r => r.json()).then(j => {
    ST = j; shots = j.shots.filter(s => s.kind === 'ai'); base.src = j.video; lane(); panel(-1); mine();
  });
  function lane() {
    const L = $('lane'), D = ST.dur; let h = '';
    for (const p of ST.program) { const cls = p.kind === 'screen' ? 'scr' : p.kind === 'bridge' ? 'brd' : 'act'; h += `<i class="${cls}" style="left:${p.t / D * 100}%;width:${p.d / D * 100}%"></i>`; if (p.kind === 'act') h += `<span class="lb" style="left:${p.t / D * 100}%">${esc(p.roman)}</span>`; }
    shots.forEach((s, i) => { h += `<b class="tk${s.alts && s.alts.length ? ' alt' : ''}${pick[keyOf(s)] ? ' chosen' : ''}" data-i="${i}" style="left:${(s.t + s.d / 2) / D * 100}%"></b>`; });
    L.innerHTML = h + '<b class="ph" id="ph"></b>';
  }
  const seekLane = e => { const r = $('lane').getBoundingClientRect(); base.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * ST.dur; };
  $('lane').addEventListener('pointerdown', e => { seekLane(e); const mv = ev => seekLane(ev); window.addEventListener('pointermove', mv); window.addEventListener('pointerup', () => window.removeEventListener('pointermove', mv), { once: true }); });
  function panel(i) {
    shown = i; const T = $('takes');
    if (i < 0) { const nx = shots.findIndex(s => s.t > base.currentTime && s.alts && s.alts.length); $('th').innerHTML = 'THIS SHOT <span>— no other takes here</span>'; T.innerHTML = ''; $('note').textContent = nx >= 0 ? `next shot with other takes at ${fmt(shots[nx].t)} (act ${shots[nx].act})` : ''; return; }
    const s = shots[i], tk = takesOf(s), k = pick[keyOf(s)] || 0;
    $('th').innerHTML = `THIS SHOT <span>— act ${esc(s.act)} · ${esc(s.clip.replace(/_/g, ' '))}${s.poison ? ' · a poison shot' : ''}</span>`;
    T.innerHTML = tk.map((t, j) => `<button class="take${j === k ? ' sel' : ''}" data-j="${j}"><img src="slopfeeder/${esc(t.thumb)}" alt="" loading="lazy"><span>${j + 1} · ${j === 0 ? 'THE CUT' : esc(t.clip.replace(/_/g, ' ').slice(0, 22))}</span>${t.sim ? `<em>${Math.round(t.sim * 100)}</em>` : ''}</button>`).join('');
    $('note').textContent = tk.length > 1 ? `${tk.length - 1} other take${tk.length > 2 ? 's' : ''} of more or less the same shot. The number is how alike they are (CLIP).` : 'Only one take of this shot exists.';
    T.querySelectorAll('.take').forEach(b => b.onclick = () => choose(i, +b.dataset.j));
  }
  function choose(i, j) { const s = shots[i]; if (j) pick[keyOf(s)] = j; else delete pick[keyOf(s)]; save(); panel(i); lane(); mine(); sync(true); }
  function mine() { const n = Object.keys(pick).length; $('mine').innerHTML = n ? `<b>${n}</b> shot${n > 1 ? 's' : ''} recut by you · <button id="reset">RESET TO THE CUT</button>` : 'You are watching the cut as made.'; const r = $('reset'); if (r) r.onclick = () => { pick = {}; save(); lane(); mine(); panel(cur); sync(true); }; }
  /* the score drives the overlay: the chosen take plays muted over the cut, from its own in-point, for exactly the shot's place */
  function want(s, t) { const c = chosen(s); if (!c) return null; const end = (c.out || c.ss + s.d) - .06, at = c.ss + (t - s.t); return { src: media(c.clip), at: Math.min(at, end), hold: at >= end }; }
  function drive(v, w, play) {
    if (!w) { v.classList.remove('on'); if (!v.paused) v.pause(); return; }
    if (!v.src.endsWith(w.src)) { v.src = w.src; v.dataset.ready = ''; v.onloadeddata = () => { v.dataset.ready = '1'; }; }
    if (v.readyState >= 1 && Math.abs(v.currentTime - w.at) > .25) v.currentTime = w.at;
    play = play && !w.hold; if (play && v.paused) v.play().catch(() => { }); if (!play && !v.paused) v.pause();
  }
  function sync(force) {
    if (!ST) return; const t = base.currentTime, i = shotAt(t); cur = i;
    const s = i >= 0 ? shots[i] : null, w = s ? want(s, t) : null;
    const nx = shots.findIndex((x, k) => k > i && x.t > t && chosen(x)), nw = nx >= 0 && shots[nx].t - t < 1.6 ? want(shots[nx], shots[nx].t) : null;
    /* each wanted take claims the element that already holds its file; the other one is pre-seeked, paused, for the next chosen shot */
    const live = w ? (ovs.find(v => v.src.endsWith(w.src)) || ovs.find(v => !(nw && v.src.endsWith(nw.src))) || ovs[0]) : null;
    const prep = nw ? (ovs.find(v => v !== live && v.src.endsWith(nw.src)) || ovs.find(v => v !== live)) : null;
    ovs.forEach(v => { if (v !== live) v.classList.remove('on'); if (v !== live && v !== prep && !v.paused) v.pause(); });
    if (live) { drive(live, w, !base.paused); live.classList.toggle('on', live.readyState >= 2 && (w.hold || Math.abs(live.currentTime - w.at) < .5)); }
    if (prep) drive(prep, nw, false);
    $('cap').hidden = !(w && s.cap); if (w && s.cap) $('cap').textContent = s.cap;
    $('tag').hidden = !w; if (w) $('tag').innerHTML = `YOUR TAKE <b>${pick[keyOf(s)] + 1}</b>`;
    $('clock').textContent = `${fmt(t)} / ${fmt(ST.dur)}`; const p = ST.program.find(p => t >= p.t && t < p.t + p.d);
    $('where').textContent = !p ? (t < 17 ? 'THE MEME' : 'THE DEVELOPER') : p.kind === 'act' ? `${p.roman} · ${p.title}` : p.kind === 'bridge' ? `ARCHIVE · ${p.title}` : 'CLAUDE AT WORK';
    const ph = $('ph'); if (ph) ph.style.left = `${t / ST.dur * 100}%`;
    if (i !== shown || force) panel(i);
  }
  (function loop() { sync(false); requestAnimationFrame(loop); })();
  setInterval(() => { if (document.hidden) sync(false); }, 200);   /* rAF sleeps in a hidden tab; the score must not */
  base.addEventListener('play', () => $('play').textContent = '❚❚ PAUSE'); base.addEventListener('pause', () => $('play').textContent = '▶ PLAY');
  $('play').onclick = () => base.paused ? base.play() : base.pause(); $('stage').onclick = () => base.paused ? base.play() : base.pause();
  const jump = d => { const t = base.currentTime; const list = shots.filter(s => s.alts && s.alts.length); const s = d > 0 ? list.find(s => s.t > t + .3) : [...list].reverse().find(s => s.t < t - .3); if (s) base.currentTime = s.t + .05; };
  $('next').onclick = () => jump(1); $('prev').onclick = () => jump(-1);
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); base.paused ? base.play() : base.pause(); }
    if (e.key === 'ArrowRight') jump(1); if (e.key === 'ArrowLeft') jump(-1);
    const n = +e.key; if (n >= 1 && n <= 7 && cur >= 0 && n <= takesOf(shots[cur]).length) choose(cur, n - 1);
  });
})();
</script></body></html>
