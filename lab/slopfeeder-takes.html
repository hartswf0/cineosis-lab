<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sea of Takes</title>
<meta name="description" content="Every alternative of every shot in the Slopfeeder films as one lattice: watch your path play, scrub it, play the machine (a Monte Carlo tree search) for the next shot, reflow the best path around your pins. The story cut, each song, or the AI footage alone.">
<meta name="theme-color" content="#0c0d0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0f'/%3E%3Ccircle cx='8' cy='10' r='2.5' fill='%23858b93'/%3E%3Ccircle cx='16' cy='18' r='2.5' fill='%23f25a17'/%3E%3Ccircle cx='24' cy='12' r='2.5' fill='%23858b93'/%3E%3Cpath d='M8 10 L16 18 L24 12' stroke='%23f25a17' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0c0d0f; --top:#16181b; --ink:#ebe5d8; --dim:#858b93; --faint:#24282d; --hot:#f25a17; --good:#7fc28b; --mid:#e3b341; --bad:#e0533a; --cool:#5aa9e6; --sans:'Barlow Condensed',Impact,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --z:54px; }
*{ box-sizing:border-box; } html,body{ margin:0; } body{ background:var(--bg); color:var(--ink); font:400 12.5px/1.5 var(--mono); }
[hidden]{ display:none!important; }
::-webkit-scrollbar{ height:10px; width:10px; } ::-webkit-scrollbar-thumb{ background:#2c3138; border-radius:5px; } ::-webkit-scrollbar-track{ background:transparent; }
button{ font:700 12.5px var(--sans); letter-spacing:.13em; background:none; color:var(--ink); border:1px solid var(--faint); border-radius:3px; padding:5px 10px; cursor:pointer; white-space:nowrap; } button:hover{ border-color:var(--hot); } button.on{ background:var(--hot); color:#170b04; border-color:var(--hot); } button:focus-visible{ outline:2px solid var(--cool); }
header{ max-width:1400px; margin:0 auto; padding:14px 16px 4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
h1{ margin:0 6px 0 0; font:700 26px var(--sans); letter-spacing:.14em; } h1 b{ color:var(--hot); }
.views{ display:flex; gap:4px; flex-wrap:wrap; } .views button{ padding:3px 8px; font-size:12px; }
header a{ margin-left:auto; color:var(--dim); text-decoration:none; font:700 12.5px var(--sans); letter-spacing:.14em; } header a:hover{ color:var(--hot); }
.top{ max-width:1400px; margin:0 auto; padding:8px 16px 0; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:14px; }
@media (max-width:860px){ .top{ grid-template-columns:1fr; } }
.stage{ position:relative; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; }
.stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; } .stage .ov{ opacity:0; pointer-events:none; } .stage .ov.on{ opacity:1; }
.cap{ position:absolute; left:6%; right:6%; bottom:8%; text-align:center; font:700 clamp(12px,2.1vw,22px)/1.25 Arial,sans-serif; color:#faf6ec; text-shadow:0 0 3px #000,0 0 3px #000,0 2px 4px #000; pointer-events:none; }
.tag{ position:absolute; right:10px; top:10px; font:700 12px var(--sans); letter-spacing:.14em; background:#000b; padding:3px 8px; border-radius:2px; pointer-events:none; } .tag b{ color:var(--hot); }
.offer{ position:absolute; left:0; right:0; bottom:0; padding:10px 12px 12px; background:linear-gradient(transparent,#000d 30%); display:flex; flex-direction:column; gap:6px; }
.offer .q{ font:700 15px var(--sans); letter-spacing:.1em; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; } .offer .q small{ color:var(--dim); font:500 11.5px var(--mono); letter-spacing:0; }
.offer .opts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .opt{ position:relative; padding:0; border:2px solid #fff3; border-radius:4px; overflow:hidden; background:#000; }
.opt img{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; } .opt b{ position:absolute; left:6px; top:4px; font:700 16px var(--sans); text-shadow:0 0 3px #000; } .opt i{ position:absolute; right:6px; top:5px; font:600 11px var(--mono); font-style:normal; background:#000b; padding:0 5px; border-radius:2px; }
.opt.fav i{ color:var(--cool); } .opt.won{ border-color:var(--hot); } .opt.mach{ box-shadow:inset 0 0 0 2px var(--cool); }
.offer .clock{ height:3px; background:#fff2; border-radius:2px; overflow:hidden; } .offer .clock b{ display:block; height:100%; background:var(--hot); }
.insp{ background:var(--top); border:1px solid var(--faint); border-radius:4px; padding:10px; display:flex; flex-direction:column; gap:7px; min-width:0; }
.insp .pv{ position:relative; aspect-ratio:16/9; background:#000; border-radius:3px; overflow:hidden; } .insp .pv video,.insp .pv img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.insp h3{ margin:0; font:700 17px var(--sans); letter-spacing:.06em; } .insp .sub{ color:var(--dim); font-size:11.5px; }
.meter{ display:grid; grid-template-columns:92px 1fr 40px; gap:6px; align-items:center; font-size:11.5px; } .meter span:first-child{ color:var(--dim); } .meter i{ display:block; height:7px; background:#2a2f36; border-radius:4px; overflow:hidden; } .meter i b{ display:block; height:100%; }
.why{ color:#cfc9bc; font-size:11.5px; border-top:1px solid var(--faint); padding-top:6px; }
.row{ max-width:1400px; margin:0 auto; padding:8px 16px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.t-clock{ color:var(--dim); min-width:92px; } .where{ font:600 14px var(--sans); letter-spacing:.06em; } .sp{ flex:1; }
.read{ font:600 14px var(--sans); letter-spacing:.08em; color:var(--dim); } .read b{ color:var(--ink); } .read .bad{ color:var(--bad); }
.chg{ display:flex; gap:8px; align-items:center; color:#cfc9bc; font-size:12px; border-left:2px solid var(--hot); padding-left:8px; flex-wrap:wrap; }
.chip{ border:1px solid var(--faint); border-radius:12px; padding:2px 10px; color:var(--ink); font:500 11.5px var(--mono); letter-spacing:0; } .chip.a{ border-color:var(--hot); } .chip.b{ border-color:var(--cool); } .chip em{ color:var(--dim); font-style:normal; }
input[type=range]{ accent-color:var(--hot); width:110px; vertical-align:middle; }
.sea{ position:relative; margin:8px 0 0; padding:0 16px 16px; overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--faint); border-bottom:1px solid var(--faint); background:#0e1013; }
.ruler{ position:relative; height:26px; margin:0 0 14px; cursor:ew-resize; touch-action:none; }
.ruler .tick{ position:absolute; top:6px; font:700 10.5px var(--sans); letter-spacing:.12em; color:var(--dim); white-space:nowrap; padding-left:3px; border-left:1px solid #2c3138; height:20px; pointer-events:none; } .ruler .tick.br{ color:#c9a35a; }
.ruler .ph{ position:absolute; top:0; bottom:-6px; width:2px; background:#fff; pointer-events:none; } .ruler .ph::after{ content:''; position:absolute; left:-4px; top:0; border:5px solid transparent; border-top-color:#fff; }
.lat{ position:relative; display:flex; gap:2px; align-items:flex-start; width:max-content; }
.col{ position:relative; display:flex; flex-direction:column; gap:2px; width:var(--z); flex:none; }
.col.now::before{ content:''; position:absolute; left:-1px; right:-1px; top:-5px; bottom:-5px; border:1px solid #fff5; border-radius:3px; pointer-events:none; }
.col.next::before{ content:''; position:absolute; left:-1px; right:-1px; top:-5px; bottom:-5px; border:1px dashed var(--cool); border-radius:3px; pointer-events:none; }
.cell{ position:relative; width:var(--z); height:calc(var(--z) * .5625); border-radius:2px; overflow:hidden; cursor:pointer; background:#1b1e22; outline:1px solid transparent; }
.cell img{ display:block; width:100%; height:100%; object-fit:cover; opacity:.5; } .cell:hover img,.cell.ch img{ opacity:1; }
.cell .fb{ position:absolute; inset:0; background-repeat:no-repeat; display:none; } .lat.deep .cell.has .fb{ display:block; } .lat.deep .cell.has img{ display:none; }
.lat.deep .cell .fb{ opacity:.55; } .lat.deep .cell:hover .fb,.lat.deep .cell.ch .fb{ opacity:1; }
.cell.ch{ outline:2px solid #fff; z-index:2; } .cell.lk{ outline:2px solid var(--hot); } .cell.mk{ outline:2px solid var(--cool); }
.cell.cut::before{ content:''; position:absolute; left:0; top:0; width:4px; height:4px; background:#ffd36a; z-index:1; }
.cell .ht{ position:absolute; left:0; bottom:0; height:3px; background:var(--cool); z-index:1; }
.sea.heat .cell img,.sea.heat .cell .fb{ opacity:calc(.12 + var(--h, 0) * .88); }
svg.path{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:3; }
.hint{ max-width:1400px; margin:0 auto; padding:8px 16px 36px; color:var(--dim); font-size:11.5px; }
.hint b{ color:var(--ink); font-weight:500; } .sw{ display:inline-block; width:14px; height:3px; vertical-align:middle; margin:0 4px 0 10px; }
@media (max-width:600px){ h1{ font-size:21px; } header a{ margin-left:0; } :root{ --z:44px; } .offer .opts{ gap:4px; } }
</style></head><body>
<header><h1>SEA OF <b>TAKES</b></h1><div class="views" id="views"></div><button id="aionly" title="show only the AI footage">AI ONLY</button><a href="slopfeeder-films.html">THE FILMS ↗</a></header>
<div class="top">
  <div class="stage" id="stage"><video id="base" playsinline preload="auto"></video><video class="ov" id="ovA" muted playsinline preload="auto"></video><video class="ov" id="ovB" muted playsinline preload="auto"></video><div class="cap" id="cap" hidden></div><div class="tag" id="tag" hidden></div><div class="offer" id="offer" hidden></div></div>
  <aside class="insp" id="insp"><div class="pv" id="pv"></div><h3 id="ih"></h3><div class="sub" id="is"></div><div id="im"></div><div class="why" id="iw"></div></aside>
</div>
<div class="row"><button id="play">▶ PLAY</button><span class="t-clock" id="clock">0:00</span><span class="where" id="where"></span><span class="sp"></span><button id="mach" title="play against the machine: before each shot it imagines futures and offers its three best takes">PLAY THE MACHINE</button><span class="read" id="mstat" hidden></span></div>
<div class="row"><button id="best" title="reflow every unpinned shot for the best joins (Viterbi, as the Found Odyssey chooses its scenes)">BEST PATH</button><button id="roll" title="400 Monte Carlo films: light the takes that keep winning">ROLL</button><span class="chg" id="chg" hidden></span><span id="brs"></span><span class="sp"></span><span class="read" id="score"></span><label class="read" title="ctrl/⌘-wheel over the sea also zooms">ZOOM <input type="range" id="zoom" min="14" max="160" value="54"></label></div>
<div class="sea" id="sea"><div class="ruler" id="ruler"></div><div class="lat" id="lat"></div></div>
<div class="hint" id="hint"></div>
<script src="slopfeeder/sea-core.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const base = $('base'), ovs = [$('ovA'), $('ovB')], fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const src = x => x.kind === 'ai' ? `slopfeeder/ai/web/${x.clip}.mp4` : x.v, thumb = x => /^http/.test(x.thumb) ? x.thumb : `slopfeeder/${x.thumb}`;
  const nameOf = x => x.kind === 'ai' ? x.clip.replace(/_/g, ' ') : `${x.title || 'archive'}${x.year ? ` (${x.year})` : ''}`;
  const qs = new URLSearchParams(location.search);
  let VIEW = qs.get('v') || 'story', M = null, S = null, cols = [], vis = [], ch = [], lock = [], mk = [], heat = null, undo = [], st = {}, focus = { c: -1, k: 0 }, cur = -1, aiOnly = qs.get('ai') === '1', scrubbing = false;
  const key = () => `sf-sea:${VIEW}`, save = () => { try { localStorage.setItem(key(), JSON.stringify({ ch, lock, mk, br: st.br || [], a: st.a, b: st.b })); } catch (e) { } };
  const load = () => { try { return JSON.parse(localStorage.getItem(key()) || '{}'); } catch (e) { return {}; } };
  const url = () => history.replaceState(null, '', `?v=${VIEW}${aiOnly ? '&ai=1' : ''}`);
  /* ---- REST: the views */
  fetch('slopfeeder/lattice/index.json').then(r => r.json()).then(ix => {
    $('views').innerHTML = ix.map(v => `<button data-v="${v.id}" title="${esc(v.title)} · ${v.n} shots · ${v.takes} takes">${v.id === 'story' ? 'STORY CUT' : esc(v.title.split(' (')[0])}</button>`).join('');
    $('views').querySelectorAll('button').forEach(b => b.onclick = () => open(b.dataset.v)); open(ix.some(v => v.id === VIEW) ? VIEW : 'story');
  });
  function open(v) {
    VIEW = v; url(); $('views').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    stopMachine(); heat = null; $('sea').classList.remove('heat'); $('roll').classList.remove('on');
    fetch(`slopfeeder/lattice/${v}.json`).then(r => r.json()).then(j => {
      M = j; S = SeaCore.Sea(j); cols = j.cols; base.src = j.video; const L = load(); undo = [];
      const ok = a => Array.isArray(a) && a.length === cols.length;
      ch = ok(L.ch) ? L.ch : cols.map(() => 0); lock = ok(L.lock) ? L.lock : cols.map(() => false); mk = ok(L.mk) ? L.mk : cols.map(() => 0);
      st = { br: L.br || [], a: L.a, b: L.b }; setVis(); inspect(vis[0], ch[vis[0]]); changed(null);
    });
  }
  function setVis() { vis = cols.map((c, i) => i).filter(i => !aiOnly || cols[i].kind === 'ai'); $('aionly').classList.toggle('on', aiOnly); build(); draw(); }
  $('aionly').onclick = () => { aiOnly = !aiOnly; url(); heat = null; $('sea').classList.remove('heat'); $('roll').classList.remove('on'); setVis(); };
  /* ---- the lattice, with its ruler (scrub) and flipbooks (deep zoom: scrub a take frame by frame) */
  function build() {
    const z = +$('zoom').value; $('lat').classList.toggle('deep', z >= 96);
    $('lat').innerHTML = vis.map(c => { const C = cols[c]; return `<div class="col ${C.kind}" data-c="${c}">${C.cands.map((x, k) => `<div class="cell${k === 0 ? ' cut' : ''}${x.sp ? ' has' : ''}" data-c="${c}" data-k="${k}"><img src="${esc(thumb(x))}" alt="" loading="lazy">${x.sp ? `<i class="fb" style="background-image:url('${M.sprites.path.replace('%03d', String(x.sp[0]).padStart(3, '0'))}')"></i>` : ''}<i class="ht"></i></div>`).join('')}</div>`; }).join('') + '<svg class="path" id="path"></svg>';
    $('lat').querySelectorAll('.cell').forEach(el => {
      const c = +el.dataset.c, k = +el.dataset.k, x = cols[c].cands[k];
      el.onmouseenter = () => inspect(c, k);
      el.onmousemove = e => { if (!x.sp || !$('lat').classList.contains('deep')) return; const r = el.getBoundingClientRect(); frame(el, x, Math.floor((e.clientX - r.left) / r.width * 12)); };
      el.onmouseleave = () => { if (x.sp) frame(el, x, 5); };
      el.onclick = e => { if (e.altKey || (lock[c] && ch[c] === k)) { const l = lock.slice(); l[c] = false; commit(ch.slice(), l, 'you unpinned a shot'); return; } const n = ch.slice(), l = lock.slice(); n[c] = k; l[c] = true; const m = mk.slice(); m[c] = 0; commit(n, l, k === 0 ? 'you pinned the cut’s take' : `you put take ${k + 1} in shot ${vis.indexOf(c) + 1}`, m); inspect(c, k); };
      el.ondblclick = () => { base.currentTime = cols[c].t + .05; base.play().catch(() => { }); };
      if (x.sp) frame(el, x, 5);
    });
    ruler();
  }
  function frame(el, x, f) { const fb = el.querySelector('.fb'); if (!fb) return; const w = el.clientWidth, h = el.clientHeight; f = Math.max(0, Math.min(11, f)); fb.style.backgroundSize = `${w * 12}px ${h * 16}px`; fb.style.backgroundPosition = `${-f * w}px ${-x.sp[1] * h}px`; }
  const step = () => +$('zoom').value + 2;
  function ruler() {
    const z = step(); let h = '', last = null;
    vis.forEach((c, i) => { const C = cols[c], lab = C.kind === 'bridge' ? 'ARCHIVE' : C.act; if (lab !== last) { h += `<span class="tick${C.kind === 'bridge' ? ' br' : ''}" style="left:${i * z}px">${esc(lab)} · ${fmt(C.t)}</span>`; last = lab; } });
    $('ruler').style.width = `${vis.length * z}px`; $('ruler').innerHTML = h + '<b class="ph" id="ph"></b>';
  }
  const xToTime = x => { const z = step(), i = Math.max(0, Math.min(vis.length - 1, Math.floor(x / z))), f = Math.max(0, Math.min(.999, x / z - i)), C = cols[vis[i]]; return C.t + f * C.d; };
  const timeToX = t => { const z = step(); for (let i = 0; i < vis.length; i++) { const C = cols[vis[i]]; if (t < C.t + C.d) return (i + Math.max(0, Math.min(1, (t - C.t) / C.d))) * z; } return vis.length * z; };
  $('ruler').addEventListener('pointerdown', e => {   /* scrub: drag along the ruler; the film follows, and resumes if it was playing */
    const wasPlaying = !base.paused; base.pause(); scrubbing = true; const r = $('ruler'); r.setPointerCapture(e.pointerId);
    const go = ev => { const b = r.getBoundingClientRect(); base.currentTime = xToTime(ev.clientX - b.left); sync(true); };
    go(e); r.onpointermove = go; r.onpointerup = r.onpointercancel = () => { r.onpointermove = null; scrubbing = false; if (wasPlaying) base.play().catch(() => { }); };
  });
  /* ---- the readouts: the truth now */
  function draw() {
    if (!M) return; const L = $('lat'), cells = [...L.querySelectorAll('.cell')], at = {};
    cells.forEach(el => { const c = +el.dataset.c, k = +el.dataset.k, on = ch[c] === k; el.classList.toggle('ch', on); el.classList.toggle('lk', on && !!lock[c] && !mk[c]); el.classList.toggle('mk', on && !!mk[c]); const h = heat ? heat[c][k] : 0; el.style.setProperty('--h', h); el.querySelector('.ht').style.width = `${h * 100}%`; if (on) at[c] = el; });
    const lr = L.getBoundingClientRect(), pts = vis.map(c => { const r = at[c].getBoundingClientRect(); return [r.left - lr.left + r.width / 2, r.top - lr.top + r.height / 2]; });
    let s = ''; for (let i = 1; i < pts.length; i++) { const v = S.seam(ch, vis[i - 1], vis[i]), col = v >= .6 ? 'var(--good)' : v >= .35 ? 'var(--mid)' : 'var(--bad)'; s += `<line x1="${pts[i - 1][0]}" y1="${pts[i - 1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${col}" stroke-width="${v < .35 ? 3 : 2}" stroke-linecap="round"/>`; }
    const svg = $('path'); svg.setAttribute('width', L.scrollWidth); svg.setAttribute('height', L.scrollHeight); svg.innerHTML = s;
    const T = S.total(ch, vis), C0 = S.total(cols.map(() => 0), vis), d = T.all - C0.all;
    $('score').innerHTML = `seams <b>${(T.seams * 100).toFixed(0)}</b> · likeness <b>${(T.like * 100).toFixed(0)}</b> · <span class="${T.weak ? 'bad' : ''}">${T.weak} jarring</span>${Math.abs(d) > .005 ? ` · vs the cut <b>${d > 0 ? '+' : ''}${d.toFixed(1)}</b>` : ''}`;
    const nCh = vis.filter(c => ch[c]).length;
    $('hint').innerHTML = `${esc(M.title)} · ${vis.length} shots · ${vis.reduce((a, c) => a + cols[c].cands.length, 0)} takes${aiOnly ? ' (AI footage only)' : ''} · ${nCh ? `${nCh} differ from the cut` : 'this is the cut as made'}<span class="sw" style="background:var(--good)"></span>joins well<span class="sw" style="background:var(--mid)"></span>loosely<span class="sw" style="background:var(--bad)"></span>jars · <b>white</b> in the film · <b style="color:var(--hot)">orange</b> yours · <b style="color:var(--cool)">blue</b> the machine’s · <b style="color:#ffd36a">gold corner</b> the cut as made · drag the ruler to scrub · zoom past 96 to scrub a take frame by frame · keys ← → ↑ ↓ enter · space · Z undo · A B C answer the machine`;
  }
  /* ---- CHANGED: what changed, its cause, and the way back */
  function commit(nch, nlock, why, nmk) { undo.push({ ch: ch.slice(), lock: lock.slice(), mk: mk.slice() }); if (undo.length > 120) undo.shift(); const n = vis.filter(c => nch[c] !== ch[c]).length; ch = nch; lock = nlock; mk = (nmk || mk).map((v, c) => nlock[c] ? v : 0); save(); draw(); sync(true); changed(why, n); }
  function changed(why, n) {
    const E = $('chg'); if (!why) { E.hidden = true; branches(); return; }
    E.hidden = false; E.innerHTML = `<span>${esc(why)}${n != null ? ` · ${n} take${n === 1 ? '' : 's'} changed` : ''}</span>${undo.length ? '<button id="u">UNDO</button>' : ''}<button id="sv">SAVE AS BRANCH</button>${vis.some(c => ch[c]) ? '<button id="rc">BACK TO THE CUT</button>' : ''}`;
    const u = $('u'); if (u) u.onclick = () => { const x = undo.pop(); if (!x) return; ch = x.ch; lock = x.lock; mk = x.mk; save(); draw(); sync(true); changed(undo.length ? 'undone' : null); };
    $('sv').onclick = () => { st.br.push({ name: `branch ${st.br.length + 1}`, ch: ch.slice(), lock: lock.slice(), mk: mk.slice(), score: S.total(ch, vis).all.toFixed(1) }); st.b = st.a; st.a = st.br.length - 1; save(); changed(null); };
    const rc = $('rc'); if (rc) rc.onclick = () => commit(cols.map(() => 0), cols.map(() => false), 'back to the cut as made', cols.map(() => 0));
    branches();
  }
  function branches() {
    const B = st.br || []; $('brs').innerHTML = B.length ? B.map((b, i) => `<button class="chip${i === st.a ? ' a' : ''}${i === st.b ? ' b' : ''}" data-i="${i}">${esc(b.name)} <em>${b.score}</em></button>`).join(' ') + (st.b != null ? ' <button id="ab" title="flip between your last two branches">A/B</button>' : '') : '';

    $('im').innerHTML = m('like the shot', x.same) + m('joins from', jin) + m('joins into', jout) + m('symmetry', x.sym, 'var(--ink)') + (x.poison ? m('poison', x.poison, '#b05cd6') : '') + (C.cap ? `<div class="sub">line: “${esc(C.cap)}”</div>` : '');

  function stopMachine() { MA = null; $('offer').hidden = true; $('mach').classList.remove('on'); $('mach').textContent = 'PLAY THE MACHINE'; $('mstat').hidden = true; $('lat').querySelectorAll('.col.next').forEach(e => e.classList.remove('next')); }
  const mstat = () => { if (MA) $('mstat').innerHTML = `you <b>${MA.yours}</b> · machine <b>${MA.mine}</b> · agreed <b>${MA.agree}</b>`; };

  }
  function offer() {

    $('offer').innerHTML = `<div class="q">NEXT SHOT · WHICH TAKE?<small>${esc(C.act)} · ${O.mc.total} futures imagined · answer before the cut, or the machine chooses</small></div><div class="opts">${kids.map((o, j) => `<button class="opt${j === 0 ? ' fav' : ''}" data-j="${j}"><img src="${esc(thumb(C.cands[o.k]))}" alt=""><b>${'ABC'[j]}</b><i>${Math.round(o.share * 100)}%</i></button>`).join('')}</div><div class="clock"><b id="mclock" style="width:100%"></b></div>`;
    $('offer').querySelectorAll('.opt').forEach(b => { b.onclick = e => { e.stopPropagation(); answer(+b.dataset.j); }; b.onmouseenter = () => inspect(O.c, kids[+b.dataset.j].k); });
  }
  function answer(j) {

    const n = ch.slice(), l = lock.slice(), m = mk.slice(); n[O.c] = pick.k; l[O.c] = true; m[O.c] = j >= 0 ? 0 : 1;
    if (j >= 0) { MA.yours++; if (j === 0) MA.agree++; } else MA.mine++; mstat();
    $('offer').querySelectorAll('.opt').forEach((b, x) => { b.classList.toggle('won', x === (j >= 0 ? j : 0)); b.classList.toggle('mach', x === 0); });
    const q = $('offer').querySelector('.q'); if (q) q.innerHTML = j < 0 ? 'THE MACHINE CUT IT<small>no answer: its favourite goes in</small>' : j === 0 ? 'YOU AND THE MACHINE AGREE<small>its favourite goes in</small>' : `YOU OVERRULE THE MACHINE<small>its favourite had ${Math.round(fav.share * 100)}% of its futures</small>`;
    commit(n, l, j < 0 ? 'the machine chose a take' : `you chose take ${'ABC'[j]}${j ? ' against the machine' : ' with the machine'}`, m);
  }
  /* ---- playback: the film plays; where your path leaves the cut, your take plays over it, muted, for exactly that shot */
  const colAt = t => { for (let i = 0; i < cols.length; i++) if (t >= cols[i].t && t < cols[i].t + cols[i].d) return i; return -1; };
  const same = (v, s) => v.src === s || v.src.endsWith(s);
  function want(c, t) { if (c < 0 || !ch[c]) return null; const x = cols[c].cands[ch[c]]; return { x, src: src(x), d: cols[c].d, el: t - cols[c].t }; }

    ovs.forEach(v => { if (v !== live) v.classList.remove('on'); if (v !== live && v !== prep && !v.paused) v.pause(); });
    if (live) { drive(live, w, !base.paused); live.classList.toggle('on', !!w.ok); }
    if (prep) drive(prep, nw, false);

    $('tag').hidden = !(w && w.ok); if (w && w.ok) $('tag').innerHTML = `${mk[c] ? 'THE MACHINE’S' : 'YOUR'} TAKE <b>${ch[c] + 1}</b>`;
    $('clock').textContent = `${fmt(t)} / ${fmt(M.dur)}`; const p = (M.program || []).find(p => t >= p.t && t < p.t + p.d);
    $('where').textContent = !p ? (t < (M.offset || 15) ? 'THE MEME' : '') : p.kind === 'act' ? (VIEW === 'story' ? `${p.roman} · ${p.title}` : `PATCH ${p.title}`) : p.kind === 'bridge' ? `ARCHIVE · ${p.title}` : 'CLAUDE AT WORK';
    const ph = $('ph'); if (ph) ph.style.left = `${timeToX(t)}px`;

      $('lat').querySelectorAll('.col.now').forEach(e => e.classList.remove('now'));
      const i = vis.indexOf(c);
      if (i >= 0) { const col = $('lat').children[i]; col.classList.add('now'); if (!base.paused || scrubbing) { const sea = $('sea'), r = col.getBoundingClientRect(), sr = sea.getBoundingClientRect(); if (r.left < sr.left + 40 || r.right > sr.right - 40) sea.scrollBy({ left: r.left - sr.left - sr.width / 3, behavior: scrubbing ? 'auto' : 'smooth' }); } if (scrubbing && c !== cur) inspect(c, ch[c]); }

  }
  (function loop() { sync(false); requestAnimationFrame(loop); })();
  setInterval(() => { if (document.hidden) sync(false); }, 200);   /* rAF sleeps in a hidden tab; the score must not */
  base.addEventListener('play', () => $('play').textContent = '❚❚ PAUSE'); base.addEventListener('pause', () => $('play').textContent = '▶ PLAY');
  $('play').onclick = () => base.paused ? base.play() : base.pause(); $('stage').onclick = e => { if (e.target.closest('.offer')) return; base.paused ? base.play() : base.pause(); };
