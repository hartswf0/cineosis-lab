<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A film</title>
<meta name="description" content="A film cut from the Cineosis archive. The whole film lives in this link.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --ink:#2a1f1a; --paper:#f4ecd8; --verm:#c8553d; color-scheme:dark; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:#0c0c0c; color:var(--paper); font:400 17px/1.35 'Patrick Hand',sans-serif; }
button,a{ font:inherit; color:inherit; } button{ cursor:pointer; background:none; border:0; }
.wrap{ min-height:100%; display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px; }
h1{ margin:4px 0 0; font:400 clamp(26px,5vw,44px)/1.1 'Fredericka the Great',Georgia,serif; text-align:center; }
#screen{ position:relative; width:min(100%, calc((100dvh - 190px) * 16 / 9)); aspect-ratio:16/9; background:#000; overflow:hidden; border-radius:4px; container-type:size; }
#screen video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; background:#000; } #screen video.on{ opacity:1; }
#card{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:0 8%; background:#000; opacity:0; font:400 9cqh/1.15 'Fredericka the Great',Georgia,serif; z-index:3; } #card.on{ opacity:1; }
#cap{ position:absolute; left:0; right:0; bottom:0; padding:4cqh 6% 2.5cqh; text-align:center; font:400 5.5cqh/1.2 'Patrick Hand',sans-serif; text-shadow:0 2px 0 #000; z-index:4; pointer-events:none; } #cap:empty{ display:none; }
#big{ position:absolute; inset:0; display:grid; place-items:center; z-index:5; background:#0008; } #big button{ width:84px; height:84px; border-radius:50%; background:var(--verm); color:#fff; font-size:34px; }
.bar{ width:min(100%, calc((100dvh - 190px) * 16 / 9)); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bar .t{ font:700 14px 'Courier Prime',monospace; } .prog{ flex:1; height:6px; background:#333; border-radius:3px; overflow:hidden; min-width:120px; } .prog i{ display:block; height:100%; width:0; background:var(--verm); }
.bar button, .bar a{ border:1.5px solid #666; border-radius:16px; padding:4px 12px; font-size:15px; text-decoration:none; }
.note{ color:#999; font-size:14px; text-align:center; }
</style></head>
<body><div class="wrap">
  <h1 id="title">A film</h1>
  <div id="screen"><video playsinline preload="auto"></video><video playsinline preload="auto"></video><video playsinline preload="auto"></video><div id="card"></div><div id="cap"></div><div id="big"><button id="go" aria-label="Play">▶</button></div></div>
  <div class="bar"><button id="pp">▶ play</button><span class="t" id="tc">0:00 / 0:00</span><div class="prog"><i id="pg"></i></div><button id="fs">full screen</button><button id="src">sources</button><button id="dl">edit list</button><a id="edit" href="party.html?play=cut">edit it with friends</a></div>
  <div class="note" id="note"></div>
</div>
<script src="party/cut-core.js"></script>
<script src="attrib/attrib.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s), mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  const h = location.hash.replace(/^#/, '');
  if (!h) { $('#title').textContent = 'No film in this link'; $('#note').textContent = 'A film made in Party opens here from its link.'; $('#big').hidden = true; return; }
  let F; try { F = await Cut.decode(h); } catch (e) { $('#title').textContent = 'This link is damaged'; $('#big').hidden = true; return; }
  document.title = F.title; $('#title').textContent = F.title;
  const total = Cut.starts(F).total; $('#tc').textContent = '0:00 / ' + mmss(total);
  $('#note').textContent = F.clips.length + ' clips · ' + F.sounds.length + ' sounds · the whole film lives in this link';
  const P = Cut.Player({ vids: [...document.querySelectorAll('#screen video')], auds: Array.from({ length: 6 }, () => { const a = new Audio(); a.preload = 'auto'; return a; }), card: $('#card'), cap: $('#cap') });
  let playing = false, at = 0;
  const go = (from = 0) => { playing = true; $('#big').hidden = true; $('#pp').textContent = '■ stop';
    P.play(F, from, { onTick: (t, k) => { at = Math.max(0, k); $('#tc').textContent = mmss(t) + ' / ' + mmss(total); $('#pg').style.width = (t / total * 100) + '%'; }, onEnd: () => { playing = false; $('#pp').textContent = '▶ play again'; $('#big').hidden = false; } }); };
  $('#go').onclick = () => go(0); $('#pp').onclick = () => { if (playing) { P.stop(); playing = false; $('#pp').textContent = '▶ play'; } else go(0); };
  $('#fs').onclick = () => { const s = $('#screen'); (s.requestFullscreen || s.webkitRequestFullscreen || (() => { })).call(s); };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(F, null, 1)], { type: 'application/json' })); a.download = (F.title || 'film').replace(/[^\w]+/g, '-').toLowerCase() + '.json'; a.click(); };
  $('#src').onclick = () => { const seen = new Set(), items = []; F.clips.forEach(c => { if (c.u && !seen.has(c.u)) { seen.add(c.u); items.push({ role: 'picture', video: c.u }); } }); F.sounds.forEach(s => (s.kind === 'frags' ? s.frags.map(f => f[0]) : [s.u]).forEach(u => { if (u && !seen.has(u)) { seen.add(u); items.push({ role: s.kind === 'music' ? 'music' : 'voice', video: u }); } })); Attrib.show(items); };
  $('#edit').href = 'party.html?play=cut#' + h;
})();
</script>
</body></html>
