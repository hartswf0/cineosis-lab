<style>
/* A STORYBOARD CONSOLE, and a film jockey. Show what is true now; one dominant action per state; Stop and Undo always within reach. */
:root{ color-scheme:dark; --bg:#060605; --deck:#0f0e0c; --key:#1a1814; --line:#2b2823; --ink:#efe9dd; --dim:#8f877b; --hi:#e8c070; --red:#e07a5f;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; --sa-b:env(safe-area-inset-bottom); --sa-t:env(safe-area-inset-top);
  --perception:#7fb6e6; --affection:#e68fb0; --impulse:#e0533a; --action:#f2a03a; --reflection:#c9b04a; --relation:#7fc28b; --memory:#a98be6; --time:#9aa3ad; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; } html,body{ height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; font:13px var(--mono); }
button,input,textarea{ font:inherit; color:inherit; } [hidden]{ display:none !important; }
svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
#app{ position:fixed; inset:0; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding-top:var(--sa-t); }
#top{ flex:none; display:flex; align-items:center; gap:6px; padding:6px 10px; min-height:46px; }
#where{ flex:1; min-width:0; text-align:left; background:none; border:0; padding:0; cursor:pointer; }
#where b{ display:block; font:600 10px var(--mono); letter-spacing:.2em; color:var(--hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#where span{ display:block; font:500 10.5px var(--mono); color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.k{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 12px; border-radius:19px; border:1px solid var(--line); background:var(--key); font:600 10px var(--mono); letter-spacing:.14em; cursor:pointer; white-space:nowrap; flex:none; }
.k.on{ background:var(--hi); color:#140f06; border-color:var(--hi); } .k:active{ transform:scale(.96); } .k:disabled{ opacity:.35; } .k.ic{ width:38px; padding:0; } .k.rec{ background:var(--red); border-color:var(--red); color:#fff; }
#frame{ flex:none; padding:0 8px; }
#stage{ position:relative; width:min(100%, calc((100dvh - 390px) * 16 / 9)); min-width:min(100%, 300px); margin:0 auto; aspect-ratio:16/9; background:#000 center/cover no-repeat; border-radius:8px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
#stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0; transition:opacity .7s ease; } #stage video.on{ opacity:1; }
#stage video.spk{ z-index:2; -webkit-mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.5) 25%, #000 45%); mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.5) 25%, #000 45%); transition:opacity .5s ease; }
#stage .fig{ position:absolute; transform:translate(-50%,-100%); touch-action:none; z-index:3; }
#stage .fig .im{ width:100%; background:center bottom/contain no-repeat; filter:drop-shadow(0 5px 8px #000a); }
#stage .fig.sel{ outline:1.5px dashed var(--hi); outline-offset:3px; border-radius:3px; } #stage .fig.flip .im{ transform:scaleX(-1); }
#stage .fig .x{ position:absolute; right:-14px; top:-14px; width:30px; height:30px; border-radius:50%; background:var(--red); color:#fff; border:2px solid #000; display:none; place-items:center; cursor:pointer; padding:0; z-index:4; }
#stage .fig.sel .x{ display:grid; } #stage .fig .x svg{ width:14px; height:14px; stroke-width:2.6; }
@keyframes spr{ from{ background-position:0% 0; } to{ background-position:100% 0; } }
#stage .msg{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px; font:300 15px/1.35 var(--serif); color:#fff; text-shadow:0 1px 8px #000; pointer-events:none; z-index:4; }
#stage .tc{ position:absolute; left:8px; top:6px; z-index:4; font:600 10px var(--mono); letter-spacing:.14em; color:#fff; text-shadow:0 0 6px #000; pointer-events:none; }
#stage .sub{ position:absolute; left:8px; right:8px; bottom:6px; z-index:4; text-align:center; font:italic 300 14px/1.25 var(--serif); color:var(--hi); text-shadow:0 1px 6px #000; pointer-events:none; }
.sg{ display:inline-grid; place-items:center; min-width:30px; height:30px; padding:0 4px; border-radius:5px; background:#0009; border:1.5px solid currentColor; font:600 12px var(--mono); line-height:1; }
#stage .sgb{ position:absolute; right:6px; top:6px; z-index:4; display:flex; align-items:center; gap:6px; background:#000a; border-radius:8px; padding:3px 8px 3px 3px; border:0; color:var(--ink); cursor:pointer; }
#stage .sgb small{ font:500 9.5px var(--mono); max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ddd5c7; }
#words{ flex:none; display:flex; align-items:center; gap:8px; padding:7px 10px 5px; }
#line{ flex:1; min-width:0; text-align:left; background:none; border:0; padding:2px 0; cursor:text; }
#line .t{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font:300 18px/1.25 var(--serif); } #line .t.ph{ color:var(--dim); font-style:italic; }
#line .r{ display:block; margin-top:3px; font:500 10px var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #line .r b{ color:var(--ink); font-weight:500; } #line .r em{ color:var(--hi); font-style:normal; }
#deck{ flex:1; min-height:0; display:flex; flex-direction:column; }
.deckhead{ flex:none; display:flex; align-items:center; gap:6px; padding:2px 10px 4px; min-height:34px; overflow-x:auto; scrollbar-width:none; } .deckhead::-webkit-scrollbar{ display:none; }
.deckhead .lab{ font:500 10px var(--mono); color:var(--dim); white-space:nowrap; } .deckhead .sp{ flex:1; }
.chip{ flex:none; display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px; border-radius:14px; border:1px solid var(--line); background:var(--key); font:600 9.5px var(--mono); letter-spacing:.1em; cursor:pointer; white-space:nowrap; }
.chip i{ width:8px; height:8px; border-radius:50%; } .chip.on{ border-color:var(--hi); color:var(--hi); } .chip svg.i{ width:15px; height:15px; }
.reel{ flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,1),minmax(0,1fr)); grid-auto-columns:max-content; gap:7px; overflow-x:auto; overflow-y:hidden; padding:2px 10px 6px; scroll-snap-type:x proximity; scrollbar-width:none; } .reel::-webkit-scrollbar{ display:none; }
.tile{ position:relative; height:100%; aspect-ratio:16/11; border-radius:8px; border:1px solid var(--line); background:#000 center/cover no-repeat; cursor:pointer; padding:0; scroll-snap-align:start; overflow:hidden; }
.tile video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
.tile.on{ border-color:var(--hi); box-shadow:0 0 0 2px var(--hi) inset; } .tile small{ position:absolute; left:0; right:0; bottom:0; padding:12px 6px 4px; font:500 9px/1.2 var(--mono); color:#e6dfd2; background:linear-gradient(transparent,#000d); text-align:left; }
.tile .sg{ position:absolute; top:5px; right:5px; min-width:24px; height:24px; font-size:10px; pointer-events:none; }
.tile.fg{ aspect-ratio:3/4; background:#16140f; } .tile.fg .im{ position:absolute; inset:6px 6px 22px; background:center/contain no-repeat; }
.tile .add{ position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; background:var(--hi); color:#140f06; display:grid; place-items:center; } .tile .add svg{ width:14px; height:14px; stroke-width:2.6; }
.layers{ flex:none; display:flex; gap:6px; padding:0 10px 6px; overflow-x:auto; scrollbar-width:none; } .layers::-webkit-scrollbar{ display:none; }
.layer{ flex:none; display:flex; align-items:center; gap:6px; height:40px; padding:0 4px; border-radius:10px; border:1px solid var(--line); background:var(--key); cursor:pointer; }
.layer.on{ border-color:var(--hi); } .layer .im{ width:28px; height:32px; background:center/contain no-repeat; } .layer small{ font:500 9.5px var(--mono); max-width:70px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.layer .del{ width:30px; height:30px; border-radius:8px; border:0; background:#2a1612; color:var(--red); display:grid; place-items:center; cursor:pointer; padding:0; } .layer .del svg{ width:16px; height:16px; }
.pad{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(0,74px); align-content:center; gap:7px; padding:4px 10px 8px; }
.pad button{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px solid var(--line); background:var(--key); font:600 9px var(--mono); letter-spacing:.1em; cursor:pointer; min-height:56px; padding:4px; }
.pad button:active{ background:#26221b; } .pad button.hot{ border-color:var(--hi); color:var(--hi); } .pad button.warn{ color:var(--red); } .pad button:disabled{ opacity:.3; } .pad svg.i{ width:22px; height:22px; }
/* the voice deck: the call above, the answers below */
.calls{ flex:none; display:flex; gap:6px; align-items:center; padding:0 10px 8px; overflow-x:auto; scrollbar-width:none; } .calls::-webkit-scrollbar{ display:none; }
.answers{ flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,2),minmax(0,1fr)); grid-auto-columns:minmax(200px,62%); gap:7px; overflow-x:auto; overflow-y:hidden; padding:0 10px 6px; scrollbar-width:none; } .answers::-webkit-scrollbar{ display:none; }
.ans{ position:relative; text-align:left; border-radius:10px; border:1px solid var(--line); background:var(--key); padding:8px 10px 8px 40px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; justify-content:center; gap:4px; }
.ans.on{ border-color:var(--hi); background:#1f1a10; } .ans q{ font:italic 300 15px/1.25 var(--serif); color:var(--hi); quotes:none; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; } .ans small{ font:500 9px var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ans .pl{ position:absolute; left:8px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; } .ans .pl svg{ width:12px; height:12px; }
.ans.none q{ color:var(--dim); font-style:normal; font-family:var(--mono); font-size:11px; letter-spacing:.1em; }
/* the shot's timeline: how the sound enters, lane by lane: the picture, the call, the answer; a playhead walks through the states */
.tl{ flex:none; position:relative; margin:0 10px 6px; padding:4px 0 2px 58px; border-radius:10px; background:#0c0b09; border:1px solid var(--line); }
.tl .lane{ position:relative; height:20px; margin:3px 0; } .tl .lane b{ position:absolute; left:-54px; top:3px; font:600 8.5px var(--mono); letter-spacing:.14em; color:var(--dim); }
.tl .blk{ position:absolute; top:0; bottom:0; border-radius:4px; overflow:hidden; cursor:pointer; border:1px solid transparent; } .tl .blk canvas{ position:absolute; inset:0; width:100%; height:100%; }
.tl .blk.pic{ background:#000 center/cover no-repeat; opacity:.8; } .tl .blk.call{ background:#efe9dd14; } .tl .blk.ansb{ background:#e8c07014; } .tl .blk.now{ border-color:currentColor; }
.tl .blk.call.now{ color:var(--ink); } .tl .blk.ansb.now{ color:var(--hi); } .tl .blk .lbl{ position:absolute; left:5px; top:3px; font:500 8.5px var(--mono); color:#cfc7b8; white-space:nowrap; text-shadow:0 0 3px #000; pointer-events:none; }
.tl .ph{ position:absolute; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 6px #fff8; pointer-events:none; display:none; } .tl .ruler{ position:relative; height:10px; } .tl .ruler i{ position:absolute; top:0; font:500 7.5px var(--mono); color:#6b655d; font-style:normal; }
.tl .state{ position:absolute; right:6px; top:4px; font:600 8.5px var(--mono); letter-spacing:.14em; color:var(--hi); }
.ans canvas{ display:block; width:100%; height:22px; margin-bottom:2px; } .ans .tags{ font:600 8.5px var(--mono); letter-spacing:.1em; color:#b8ae9e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.filters{ flex:none; display:flex; gap:5px; align-items:center; padding:0 10px 6px; overflow-x:auto; scrollbar-width:none; } .filters::-webkit-scrollbar{ display:none; } .filters .sep{ width:1px; height:18px; background:var(--line); flex:none; }
#shots{ flex:none; display:flex; gap:5px; overflow-x:auto; padding:6px 10px; scrollbar-width:none; border-top:1px solid var(--line); } #shots::-webkit-scrollbar{ display:none; }
#shots .s{ flex:none; position:relative; width:66px; aspect-ratio:16/9; border-radius:5px; border:1px solid var(--line); background:#16140f center/cover no-repeat; cursor:pointer; padding:0; overflow:hidden; }
#shots .s.on{ border-color:var(--hi); box-shadow:0 0 0 2px var(--hi); } #shots .s i{ position:absolute; left:3px; bottom:4px; font:600 9px var(--mono); font-style:normal; color:#fff; text-shadow:0 0 4px #000; }
#shots .s .bar{ position:absolute; left:0; right:0; bottom:0; height:3px; } #shots .s.own::after{ content:''; position:absolute; right:3px; top:3px; width:6px; height:6px; border-radius:50%; background:var(--hi); }
#shots .addS{ flex:none; width:52px; border-radius:5px; border:1px dashed #4a453e; background:none; color:var(--dim); display:grid; place-items:center; cursor:pointer; }
#dial{ flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:4px 8px calc(6px + var(--sa-b)); background:var(--deck); border-top:1px solid var(--line); }
#dial button{ height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:12px; border:0; background:none; color:var(--dim); font:600 9px var(--mono); letter-spacing:.14em; cursor:pointer; }
#dial button.on{ background:var(--key); color:var(--hi); }
#writer{ position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:760px; margin:0 auto; background:var(--deck); border-top:1px solid var(--hi); padding:10px 10px calc(10px + var(--sa-b)); display:flex; flex-direction:column; gap:8px; }
#writer textarea{ width:100%; height:72px; resize:none; background:#000; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:300 18px/1.3 var(--serif); }
#writer textarea:focus{ outline:2px solid var(--hi); outline-offset:0; }
#writer .row{ display:flex; gap:6px; align-items:center; } #writer .r{ font:500 10px var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; } #writer .r b{ color:var(--ink); font-weight:500; }
#writer .ideas{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; } #writer .ideas::-webkit-scrollbar{ display:none; }
#writer .ideas button{ flex:none; border-radius:16px; border:1px solid var(--line); background:var(--key); padding:7px 11px; font:300 13px var(--serif); cursor:pointer; }
.over{ position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding-top:var(--sa-t); max-width:760px; margin:0 auto; }
.over .top{ display:flex; gap:6px; align-items:center; padding:8px 10px; } .over .top .sp{ flex:1; } .over .top b{ font:600 11px var(--mono); letter-spacing:.2em; }
#pages{ flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; } #pages::-webkit-scrollbar{ display:none; }
.page{ flex:none; width:100%; scroll-snap-align:start; padding:0 10px; display:flex; flex-direction:column; min-height:0; }
.page h3{ font:300 21px var(--serif); margin:2px 0; } .page .c{ font:600 10px var(--mono); letter-spacing:.2em; color:var(--hi); }
.page .chain{ display:flex; gap:2px; height:6px; margin:6px 0 2px; } .page .chain i{ flex:1; border-radius:2px; }
.page .g{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); align-content:start; gap:6px; margin-top:6px; overflow:hidden; }
.page .g button{ position:relative; aspect-ratio:16/9; border-radius:5px; border:1px solid var(--line); background:#16140f center/cover no-repeat; cursor:pointer; padding:0; overflow:hidden; } .page .g button.on{ border-color:var(--hi); box-shadow:0 0 0 2px var(--hi); }
.page .g button i{ position:absolute; left:3px; bottom:5px; font:600 9px var(--mono); font-style:normal; color:#fff; text-shadow:0 0 4px #000; } .page .g button .bar{ position:absolute; left:0; right:0; bottom:0; height:3px; }
.page .tline{ flex:1; min-height:0; overflow-x:auto; overflow-y:hidden; margin-top:8px; scrollbar-width:thin; } .page .tline .row3{ position:relative; height:150px; } .page .tline .lanes{ position:absolute; left:0; top:16px; font:600 8px var(--mono); letter-spacing:.14em; color:#6b655d; line-height:1; } 
.page .tline .col{ position:absolute; top:0; bottom:0; border-left:1px solid #2b2823; padding:0 2px; } .page .tline .col i{ font:600 8.5px var(--mono); font-style:normal; color:var(--dim); }
.page .tline .lnP{ height:58px; margin-top:3px; border-radius:3px; background:#000 center/cover no-repeat; cursor:pointer; } .page .tline canvas{ display:block; width:100%; height:30px; margin-top:4px; } .page .tline .col.on .lnP{ outline:2px solid var(--hi); }
.page .g button .sg{ position:absolute; top:3px; right:3px; min-width:22px; height:20px; font-size:9.5px; }
#dots{ display:flex; justify-content:center; gap:6px; padding:6px; } #dots i{ width:7px; height:7px; border-radius:50%; background:#3a362f; } #dots i.on{ background:var(--hi); }
.acts{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; padding:6px 10px calc(10px + var(--sa-b)); } .acts button{ height:58px; min-width:0; padding:0 4px; flex-direction:column; gap:4px; border-radius:12px; white-space:normal; text-align:center; font-size:9px; letter-spacing:.08em; line-height:1.15; }
#signCard .body{ flex:1; min-height:0; padding:4px 16px 16px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
#signCard .big{ display:flex; gap:12px; align-items:center; } #signCard .big .sg{ min-width:58px; height:58px; font-size:22px; border-width:2.5px; border-radius:10px; }
#signCard h2{ font:300 26px/1.1 var(--serif); } #signCard .fam{ font:600 10px var(--mono); letter-spacing:.2em; margin-top:4px; } #signCard p{ font:300 16px/1.45 var(--serif); color:#d8d1c4; } #signCard .also{ font:500 10.5px var(--mono); color:var(--dim); }
/* LIVE: the film jockey. The board performed: picture, call, the archive's answer; boxes that change layout; a trace of every choice */
#live{ position:fixed; inset:0; z-index:35; background:#000; display:flex; flex-direction:column; }
#lv{ position:relative; flex:1; min-height:0; display:grid; gap:4px; padding:4px; grid-template-columns:1fr; grid-template-rows:1fr; transition:grid-template-columns .8s ease, grid-template-rows .8s ease; }
#lv.pair{ grid-template-columns:1.2fr 1fr; } #lv.mondrian{ grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; }
#lv .box{ position:relative; overflow:hidden; background:#000; border-radius:4px; min-width:0; min-height:0; }
#lv .box video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .9s ease; } #lv .box video.on{ opacity:1; }
#lv .main{ grid-row:1 / -1; } #lv .spk, #lv .info{ display:none; } #lv.pair .spk, #lv.mondrian .spk, #lv.mondrian .info{ display:block; }
#lv.one .spk{ display:block; position:absolute; inset:4px; z-index:2; background:transparent; pointer-events:none; -webkit-mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.55) 22%, #000 42%); mask-image:linear-gradient(100deg, transparent 0%, rgba(0,0,0,.55) 22%, #000 42%); }

    { el: '#words', t: 'WRITE OR SAY', p: 'Tap the words to write this shot, or SAY IT to dictate. The frame above changes as you type. DONE when it reads right.', wait: 'write' },
    { el: '#deck', t: 'PICTURE', p: 'Moving pictures for your words. Hold one to watch it, tap to use it. The colours are Cineosis families; FIGURES adds people, never on its own.', wait: 'pic', before: () => { mode = 'pic'; figMode = false; drawDeck(); } },
    { el: '#dial', t: 'VOICE', p: 'Tap VOICE. The call is your memo, your recorded voice, or the line read aloud. Below, archival voices that answer your words: tap one to hear it and choose it.', wait: 'answer' },
    { el: '#top', t: 'LIVE', p: 'LIVE performs the board like a film jockey: picture, call, the archive answering, with layouts, pace and order you can change as it plays. PAUSE holds everything.' },
    { el: '#dial', t: 'SHOTS AND BOARD', p: 'SHOTS moves, cuts, copies and adds shots. BOARD shows the film by chapter or by sign, and saves, prints, shares and exports it.' },
  ];
  let ci_ = -1;
  function coachStart() { ci_ = 0; coachShow(); }
  function coachShow() {
    const s = COACH[ci_]; if (!s) { ci_ = -1; $('#coach').hidden = true; return; } if (s.before) s.before(); $('#coach').hidden = false;
    requestAnimationFrame(() => { const r = $(s.el).getBoundingClientRect(), h = $('#coach .hole'), b = $('#coach .bub'), pad = 4; Object.assign(h.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
      b.querySelector('b').textContent = s.t; b.querySelector('p').textContent = s.p; b.querySelector('.row span').textContent = `${ci_ + 1} OF ${COACH.length}${s.wait ? ' · TRY IT' : ''}`; $('#cNext').textContent = ci_ === COACH.length - 1 ? 'DONE' : s.wait ? 'SKIP STEP' : 'NEXT';
      const bh = b.offsetHeight || 150, below = r.bottom + 10 + bh < innerHeight; b.style.top = (below ? r.bottom + 10 : Math.max(8, r.top - 10 - bh)) + 'px'; });
  }
  function coachDone(what) { if (ci_ >= 0 && COACH[ci_] && COACH[ci_].wait === what) { ci_++; setTimeout(coachShow, 350); } }
  $('#cNext').onclick = () => { ci_++; coachShow(); }; $('#cSkip').onclick = () => { ci_ = -1; $('#coach').hidden = true; };
  addEventListener('resize', () => { if (ci_ >= 0 && $('#writer').hidden) coachShow(); });
  function showStart() { $('#sResume').hidden = !board; $('#start').hidden = false; }
  const begin = b => { if (b) { if (board && !shared && !confirm('Start a new board? Your current board will be replaced. (SAVE FILE keeps a copy.)')) return; board = b; cur = [0, 0]; undo = []; } $('#start').hidden = true; mode = 'pic'; render(); loadWM(); loadVoices(); if ($('#sTour').checked && !st.toured) { st.toured = true; save(); setTimeout(coachStart, 500); } };
  $('#sMemo').onclick = () => begin(fromMemo()); $('#sArm').onclick = () => begin(armature()); $('#sBlank').onclick = () => begin([{ title: 'Chapter 1', ch: null, panels: [blank()] }]); $('#sResume').onclick = () => begin(null);
  if (board) { board.forEach(c => c.panels.forEach(p => { if (p.call == null) { p.call = fresh(p) ? 'memo' : 'tts'; const L = memoLine(p); p.ans = fresh(p) && L && L.av ? L.av : null; p.ansAuto = !fresh(p); } }));   /* boards from before the voices get them */
    $('#sResume').hidden = false; $('#sResume').classList.add('pri'); $('#sMemo').classList.remove('pri'); $('#sTour').checked = false; }
  if (shared && board) { $('#start').hidden = true; render(); toast('A shared board · it is yours now'); }
  (window.requestIdleCallback || (f => setTimeout(f, 1200)))(() => { loadWM(); });
})();
</script></body></html>
