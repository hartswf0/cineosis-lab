#coach .bub b{ display:block; font:600 12px var(--mono); letter-spacing:.14em; margin-bottom:4px; } #coach .bub p{ font:400 15px/1.4 Georgia,serif; }

  <div class="kk">CINEOSIS LAB · NORSE HALF MOON</div>
  <h1>Shape the film like a sculptor, with moving pictures.</h1>
  <p>Write each shot in your own words. The archive finds moving pictures and figures for it, leaning toward the house. Keep what is true, cut what is not.</p>
  <div class="opts">
    <button id="sResume" hidden><b>CARRY ON</b><span>Back to your board, where you left it.</span></button>
    <button class="pri" id="sMemo"><b>FROM MY VOICE MEMO</b><span>The rough block: every line you said is a shot. Reshape it.</span></button>
    <button id="sArm"><b>FROM THE SEVEN CHAPTERS</b><span>The armature: your chapters, empty, to write shot by shot.</span></button>
    <button id="sBlank"><b>FROM NOTHING</b><span>A blank page. Write your own film.</span></button>
  </div>

<script>
(() => {
  const $ = s => document.querySelector(s), D = JSON.parse($('#data').textContent), aud = $('#aud'), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const IDEAS = ['Fog lifts off the domes at dawn', 'His hands carve the statue, close', 'The stave-church roof against a white sky', 'Waves under the cliff at Half Moon Bay', 'The old hotel burning, 1960s',
    'Mantras carved into a doorframe', 'Salvaged timber stacked by the workshop', 'Friends dancing in the round room at night', 'A kayak in heavy surf', 'Prayer flags in the wind, Nepal', 'The house alone at sunset', 'An old man walks through empty rooms'];
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) { } };
  /* ---- the board: chapters of shots; a shot from the memo remembers its line, so it can still be heard in the memo's voice */
  const KEY = 'markov-sam-norse.v2'; let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { }
  let uid = Date.now() % 1e6; const nid = () => 'p' + (uid++).toString(36);
  const blank = () => ({ id: nid(), text: '', memo: null, g: null, figs: [], auto: true, touched: false });
  const fromMemo = () => D.books.map((B, b) => ({ title: B.title, ch: b, panels: B.lines.map((L, l) => ({ id: nid(), text: L.text, memo: [b, l], g: 'm:' + L.grounds[L.start.g], figs: L.start.figs.map(x => ({ ...x })), auto: true, touched: false })) }));
  const armature = () => D.books.map((B, b) => ({ title: B.title, ch: b, panels: [blank()] }));
  let shared = false;
  if (location.hash.startsWith('#board=')) { try { const s = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(7))))); if (s.board) { st.board = s.board; st.cur = s.cur; shared = true; } history.replaceState(null, '', location.pathname); } catch (e) { } }
  let board = st.board || null, cur = st.cur || [0, 0], sel = -1, mode = 'pic', undo = [], playing = false, moving = st.moving !== false;
  const save = () => { st.board = board; st.cur = cur; st.moving = moving; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } };
  const chap = () => board[cur[0]], pan = () => chap().panels[cur[1]];
  const flat = () => board.flatMap((c, ci) => c.panels.map((p, pi) => [ci, pi]));
  const memoLine = p => p && p.memo ? D.books[p.memo[0]].lines[p.memo[1]] : null;
  const fresh = p => { const L = memoLine(p); return !!(L && L.text === p.text); };
  const snap = () => { undo.push(JSON.stringify({ board, cur })); if (undo.length > 80) undo.shift(); };
  function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }

  /* ---- pictures, figures, and reading words (no model in the page; the exact reader is optional) */
  let WM = null, WV = null, PV = null, FV = null, FIDX = null, WIDX = null; const DIM = 512;
  const still = v => /\/clips\/[^/]+\.mp4$/.test(v || '') ? v.replace(/\/clips\/([^/]+)\.mp4$/, '/thumbnails/$1.jpg') : '';
  function pic(ref) {
    if (!ref) return null; if (ref.startsWith('m:')) { const m = D.pics[ref.slice(2)]; return m ? { img: m.img, video: m.video, in: m.in || 0, title: m.title, year: m.year } : null; }
    if (ref.startsWith('w:') && WM) { const m = WM.pics[+ref.slice(2)]; return m ? { img: m.img || still(m.video), video: m.video, in: m.in || 0, title: m.title, year: m.year } : null; } return null;
  }
  const figURL = f => D.figs[f] ? D.figs[f].img : '';
  const bgOf = (el, u) => { el.style.backgroundImage = u ? `url("${u}")` : ''; };
  function figImg(el, f, animate) {
    const F = D.figs[f]; if (!F) return; const u = F.img, png = x => x.replace(/\.webp$/, '.png');

    if (aud.readyState >= 1) g(); else { aud.addEventListener('loadedmetadata', g, { once: true }); aud.load(); } clearInterval(iv); iv = setInterval(() => { if (aud.currentTime >= end) { aud.pause(); clearInterval(iv); if (then) then(); } }, 60); }
  $('#bHear').onclick = () => { stopPlay(); const p = pan(), L = memoLine(p); if (fresh(p)) playMemo(L, D.books[p.memo[0]], L.end + .25); else if (p.text) speak(p.text); else toast('Write the shot first'); };
  function playAll() {
    if (playing) { stopPlay(); return; } playing = true; $('#bPlay').textContent = 'STOP'; $('#bPlay').classList.add('on'); const seq = flat(); let k = seq.findIndex(x => x[0] === cur[0] && x[1] === cur[1]);
    const next = () => { if (!playing) return; if (k >= seq.length) { stopPlay(); return; } cur = seq[k++]; sel = -1; render(); const p = pan(), L = memoLine(p);
      if (fresh(p)) playMemo(L, D.books[p.memo[0]], L.end + .35, () => setTimeout(next, 250)); else if (p.text) { const u = speak(p.text); if (u) u.onend = () => setTimeout(next, 400); else setTimeout(next, 2500); } else setTimeout(next, 1000); };
    next();
  }
  function stopPlay() { if (!playing) return; playing = false; aud.pause(); clearInterval(iv); try { speechSynthesis.cancel(); } catch (e) { } $('#bPlay').textContent = 'PLAY'; $('#bPlay').classList.remove('on'); }
  $('#bPlay').onclick = () => { playAll(); coachDone('play'); };

  /* ---- the board: chapters as pages, side by side */
  function openBoard() {
    stopPlay(); const pg = $('#pages'), dots = $('#dots'); pg.innerHTML = ''; dots.innerHTML = '';
    board.forEach((c, ci) => { const page = document.createElement('div'); page.className = 'page'; page.innerHTML = `<div class="c">CHAPTER ${ci + 1} · ${c.panels.length} SHOT${c.panels.length === 1 ? '' : 'S'}</div><h3></h3><div class="g"></div>`; page.querySelector('h3').textContent = c.title;
      c.panels.forEach((p, pi) => { const b = document.createElement('button'), Pc = pic(p.g); bgOf(b, Pc ? Pc.img : ''); b.className = ci === cur[0] && pi === cur[1] ? 'on' : ''; b.innerHTML = `<i>${pi + 1}</i>`; b.onclick = () => { $('#board').hidden = true; go([ci, pi]); }; page.querySelector('.g').append(b); });
      pg.append(page); dots.append(document.createElement('i')); });
    $('#board').hidden = false; const markDots = () => { const k = Math.round(pg.scrollLeft / Math.max(1, pg.clientWidth)); dots.querySelectorAll('i').forEach((d, n) => d.classList.toggle('on', n === k)); };
    pg.onscroll = markDots; requestAnimationFrame(() => { pg.scrollLeft = cur[0] * pg.clientWidth; markDots(); });
  }
  $('#bClose').onclick = () => { $('#board').hidden = true; }; $('#where').onclick = openBoard;
  function printBoard() {
    const sh = $('#sheet'); sh.innerHTML = `<h1>Norse Half Moon · storyboard</h1>`;
    board.forEach((c, ci) => { sh.insertAdjacentHTML('beforeend', `<h2>Chapter ${ci + 1} · ${esc(c.title)}</h2>`); const row = document.createElement('div'); row.className = 'rowp';
      c.panels.forEach((p, pi) => { const Pc = pic(p.g); row.insertAdjacentHTML('beforeend', `<div class="cell"><div class="mini" style="background-image:url('${Pc ? Pc.img : ''}')">${p.figs.map(g => `<div class="fig${g.flip ? ' flip' : ''}" style="left:${g.x * 100}%;top:${g.y * 100}%;width:${g.w * 100}%"><img src="${figURL(g.f)}" onerror="this.src=this.src.replace('.webp','.png')"></div>`).join('')}</div><div class="cap"><b>${ci + 1}.${pi + 1}</b> ${esc(p.text || '')}</div></div>`); });
      sh.append(row); });
    toast('Preparing the sheet'); setTimeout(() => print(), 700);
  }
  $('#bPrint').onclick = printBoard;
  $('#bShare').onclick = async () => { const url = location.origin + location.pathname + '#board=' + btoa(unescape(encodeURIComponent(JSON.stringify({ board, cur }))));
    try { if (navigator.share) await navigator.share({ title: 'Norse Half Moon · storyboard', url }); else { await navigator.clipboard.writeText(url); toast('Link copied · it opens your board'); } } catch (e) { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (x) { prompt('Copy this link:', url); } } };
  $('#bNew').onclick = () => { $('#board').hidden = true; showStart(); }; $('#bHow').onclick = () => { $('#board').hidden = true; coachStart(); };

  /* ---- start, and the coach: a spotlight on one part at a time, moving on when you have tried it */
  const COACH = [
    { el: '#words', t: 'WRITE', p: 'Tap the words to write this shot: what the camera sees, in plain words. The frame above changes as you type. Tap DONE when it reads right.', wait: 'write' },
    { el: '#deck', t: 'PICTURE', p: 'Moving pictures for your words. Swipe the row sideways, tap one to put it behind the shot.', wait: 'pic', before: () => { mode = 'pic'; drawDeck(); } },
    { el: '#dial', t: 'FIGURES', p: 'Tap FIGURES, then tap a figure to add it to the shot.', wait: 'add' },
    { el: '#frame', t: 'PLACE IT', p: 'Drag the figure with your finger. Two fingers to size it, double-tap to turn it. Swipe the picture itself sideways for the next shot.', wait: 'drag' },
    { el: '#dial', t: 'SHOTS AND BOARD', p: 'SHOTS moves a shot earlier or later, cuts, copies, adds. BOARD shows the whole film, prints and shares it. PLAY at the top plays it with the voices.' },
  ];
  let ci_ = -1;
  function coachStart() { ci_ = 0; coachShow(); }
  function coachShow() {
    const s = COACH[ci_]; if (!s) { ci_ = -1; $('#coach').hidden = true; return; } if (s.before) s.before(); $('#coach').hidden = false;
    requestAnimationFrame(() => { const r = $(s.el).getBoundingClientRect(), h = $('#coach .hole'), b = $('#coach .bub'), pad = 4; Object.assign(h.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
      b.querySelector('b').textContent = s.t; b.querySelector('p').textContent = s.p; b.querySelector('.row span').textContent = `${ci_ + 1} OF ${COACH.length}${s.wait ? ' · TRY IT' : ''}`; $('#cNext').textContent = ci_ === COACH.length - 1 ? 'DONE' : s.wait ? 'SKIP STEP' : 'NEXT';
      const bh = b.offsetHeight || 150, below = r.bottom + 10 + bh < innerHeight; b.style.top = (below ? r.bottom + 10 : Math.max(8, r.top - 10 - bh)) + 'px'; });
  }
  function coachDone(what) { if (ci_ >= 0 && COACH[ci_] && COACH[ci_].wait === what) { ci_++; setTimeout(coachShow, 350); } }
  $('#cNext').onclick = () => { ci_++; coachShow(); }; $('#cSkip').onclick = () => { ci_ = -1; $('#coach').hidden = true; };
  addEventListener('resize', () => { if (ci_ >= 0 && $('#writer').hidden) coachShow(); });
  function showStart() { $('#sResume').hidden = !board; $('#start').hidden = false; }
  const begin = b => { if (b) { if (board && !shared && !confirm('Start a new board? Your current board will be replaced.')) return; board = b; cur = [0, 0]; undo = []; } $('#start').hidden = true; mode = 'pic'; render(); loadWM(); if ($('#sTour').checked && !st.toured) { st.toured = true; save(); setTimeout(coachStart, 500); } };
  $('#sMemo').onclick = () => begin(fromMemo()); $('#sArm').onclick = () => begin(armature()); $('#sBlank').onclick = () => begin([{ title: 'Chapter 1', ch: null, panels: [blank()] }]); $('#sResume').onclick = () => begin(null);
  if (board) { $('#sResume').hidden = false; $('#sResume').classList.add('pri'); $('#sMemo').classList.remove('pri'); $('#sTour').checked = false; }
  if (shared && board) { $('#start').hidden = true; render(); toast('A shared board · it is yours now'); }
  (window.requestIdleCallback || (f => setTimeout(f, 1200)))(() => loadWM());
})();
</script></body></html>
