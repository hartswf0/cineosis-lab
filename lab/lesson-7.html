<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asking · Lesson 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=2"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · LESSON 7 · ASKING. Unit B of the curriculum: how a line of the poem becomes questions, what the archive gives back,
     and how 6,255 answers narrow to what the cuts kept. Teaches one device, the search bar and its sheet, and ends with a line the
     viewer reads alone. Watched, never operated. Data: explain/l7.py -> explain/lesson/l7.json. Devices: explain/lesson.js. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.pline { position: absolute; left: 140px; right: 140px; top: 210px; font: italic 58px/1.3 var(--serif); color: var(--ink); }
.pline span { opacity: .12; transition: opacity .35s; } .pline span.on { opacity: 1; }
.pline.small { top: 70px; font-size: 34px; color: var(--dim); }
.ghost { position: absolute; left: 80px; right: 80px; top: 300px; display: flex; flex-direction: column; gap: 16px; }
.ghost .sb { position: relative; left: 0; right: 0; top: 0; height: 70px; opacity: 0; animation: up .7s ease forwards; } .ghost .sb span::after { content: ''; }
.rows4 { position: absolute; left: 40px; right: 40px; top: 40px; height: 710px; display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; }
.rows4 > div { display: grid; grid-template-columns: 220px repeat(5, 1fr); gap: 8px; align-items: stretch; }
.rows4 b { font: 600 15px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--c); align-self: center; }
.rows4 i { background: #111 center/cover; opacity: 0; animation: fade .5s ease forwards; } .rows4 i.k { outline: 4px solid var(--lime); outline-offset: -4px; }
canvas.sv { position: absolute; left: 40px; top: 40px; width: 1520px; height: 710px; }
.sbig { position: absolute; right: 60px; top: 50px; text-align: right; font: 600 110px/1 var(--serif); color: var(--gold); transition: color .6s; } .sbig small { display: block; font: 600 15px var(--mono); letter-spacing: .14em; color: var(--dim); }
.hl { box-shadow: 0 0 0 4px var(--gold) !important; transition: box-shadow .4s; } .rk.hl { color: var(--gold) !important; box-shadow: none !important; font-size: 22px !important; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 7</p><h1 style="font-weight:600;color:#ece6da">Asking</h1><p>How a line of a poem becomes questions, and what the archive gives back. About six minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script src="explain/lesson.js?v=3"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l7.json?v=1'],
  cues: ['dae-compass-spin-in-heavy-fog', 'dae-slide-carousel-at-blue-hour', 'dae-preparation-drift', 'dae-cold-current-paddle', 'dae-snowbound-umea-cabin', 'dae-salvaged-room-traveling-light', 'dae-cedar-and-cassette'],
  build(D, B, K) {
    const L = D[0], ex = L.example, pr = L.practice, H = L.hook, esc = LX.esc, mmss = LX.mmss, AU = L.audio;
    const vid = (src, t = 0, cls = '') => `<video class="${cls}" muted loop playsinline data-src="${esc(src)}" data-t="${t}"></video>`;
    const go = (el, extra) => { K.startVideos(el); LX.runBand(el, K); if (extra) extra(); };
    const pline = (line, cls = '') => `<div class="pline ${cls}">${line.split(/\s+/).map(w => `<span>${esc(w)}</span>`).join(' ')}</div>`;
    const speak = (el, secs) => { const ws = [...el.querySelectorAll('.pline span')]; ws.forEach((w, i) => K.later((.4 + i * (secs - 1.2) / ws.length) * 1000, () => w.classList.add('on'))); };

    /* COLD OPEN · a shot that answered fourteen questions */
    B('Cold open', 11, () => `<div class="pic">${vid(H.video, H.t)}</div>` + LX.band([[.6, 'You would think a search shows you what you asked for.'], [5.5, 'Look at this shot. What would you have typed to find it?']]), el => go(el));
    B('Cold open', 19, () => `<div class="pic left">${vid(H.video, H.t)}</div><div class="side">${H.qs.map(q => `<div class="qq k-${q.kind}"><small>${q.kind}</small>${esc(q.q)}</div>`).join('')}</div>`
      + LX.band([[.3, 'The archive gave it back as the answer to <b>fourteen</b> different questions.'], [11, 'Police lights. A motorcycle. A club. None of them asked for what this is.']]),
      el => go(el, () => el.querySelectorAll('.qq').forEach((q, i) => K.later(1400 + i * 620, () => { q.classList.add('on'); LX.tick(1500, .05, .03); }))));
    B('Cold open', 10, () => `<div class="pic">${vid(H.video, H.t)}</div>` + LX.band([[.3, `<em>${esc(H.title)}</em>, ${H.year}: a NASA launch site at night.`], [4.8, 'Lights, a road, a vehicle, dark. Close in picture. Far in meaning.']]), el => go(el));
    B('Cold open', 8, () => `<div class="tc"><small>CINEOSIS · LESSON 7</small><h1>Asking</h1><p>How a line of a poem becomes questions, and what the archive gives back.</p></div>`, el => LX.ping());

    /* THE LINE · one line of the poem, heard */
    const a0 = ex.t0, a1 = 712.4;
    B('The line', 14, () => pline(ex.line) + LX.band([[.3, `A poem by Mark Anthony Thomas, read aloud. This line comes at ${mmss(a0)}.`]], 'Where You Go When You Leave'), el => { LX.runBand(el, K); LX.poem(K, AU, a0, a1); speak(el, a1 - a0); });
    B('The line', 10, () => pline(ex.line, 'small') + `<div class="ghost">${['literal', 'oblique', 'place', 'mood'].map((k, i) => `<div class="k-${k}"><div class="sb" style="animation-delay:${1.5 + i * .5}s"><b class="chip">${k}</b><span></span></div></div>`).join('')}</div>`
      + LX.band([[.3, 'Nobody searched the archive by hand.'], [4.2, 'A language model read the line and wrote <b>questions</b> for it, four kinds.']]), el => { LX.runBand(el, K); el.querySelectorAll('.pline span').forEach(s => s.classList.add('on')); });

    /* FOUR WAYS TO ASK · type, wait, answer, kept */
    const SAY = {
      literal: ['First, literally: what the line shows.', 'What would you expect back?', 'Best match first. The bar is how close each picture sits to the words.', 'Lime: one of the four cuts kept it, and where.'],
      oblique: ['Then obliquely: not what it shows, what it feels like.', 'A silver lining, as a picture?', 'Stock footage of skies. The archive holds plenty.', 'One was kept.'],
      place: ['Then a place where it could happen.', 'A road, fog, streetlights.', '<em>Valley Town</em> came back for rain, and again for fog.', 'Kept by Drift.'],
      mood: ["Last, the chapter's mood, asked once for every line in it.", 'Watch the first answer.', '<em>Friendship Seven</em> again: the same film, another shot.', 'The Suite kept this one, under this very line.'] };
    ex.asks.forEach(a => {
      const T = 2.0 + a.q.length / 30, R = T + 2.2;
      B('Four ways to ask', Math.ceil(R + 9.5), () => LX.bar(a.q, a.kind) + LX.sheet(a.hits, a.kind) + LX.band([[.3, SAY[a.kind][0]], [T, SAY[a.kind][1]], [R + 1.6, SAY[a.kind][2]], [R + 5.6, SAY[a.kind][3]]]),
        el => { LX.runBand(el, K); LX.typeBar(el, K, 1.2); LX.revealSheet(el, K, R); LX.markKept(el, K, R + 5.4); });
    });
    const kept = ex.asks.reduce((n, a) => n + a.hits.filter(h => h.used.length).length, 0);
    B('Four ways to ask', 11, () => `<div class="rows4">${ex.asks.map((a, r) => `<div class="k-${a.kind}"><b>${a.kind}</b>${a.hits.map((h, i) => `<i class="${h.used.length ? 'k' : ''}" style="background-image:url('${esc(h.thumb)}');animation-delay:${r * .3 + i * .08}s"></i>`).join('')}</div>`).join('')}</div>`
      + LX.band([[.3, `Twenty answers for one line. <b>${kept}</b> were kept somewhere in the four cuts.`]]), el => LX.runBand(el, K));

    /* WHAT WAS KEPT · four cuts under the same line, and how far an answer travels */
    const C = ex.chose, found = c => c.found_by ? `found by “${esc(c.found_by.q)}”` : 'not found by a question; it came another way';
    B('What was kept', 15, () => `<div class="q4">${C.map(c => `<figure>${vid(c.video, c.in)}<figcaption><b>${c.take}</b><em>${esc(c.title)}</em> · ${found(c)}</figcaption></figure>`).join('')}</div>`
      + LX.band([[.3, 'What each cut put under this line.'], [7, `Two of the four chose <em>Friendship Seven</em>.`]]), el => { go(el); LX.poem(K, AU, a0, a1); });
    const su = C.find(c => c.take === 'suite');
    B('What was kept', 14, () => `<div style="position:absolute;left:530px;top:40px;width:540px;height:304px;background:#000">${vid(su.video, su.in)}</div>` + LX.clock(L.dur, [{ t: su.found_at, k: 'asked', c: 'var(--k-literal)', h: `“${esc(su.found_by.q)}”`, at: .5 }, { t: a0, k: 'kept by the suite', h: `“${esc(ex.line.split(':')[0])}…”`, at: 2.8, right: false }])
      + LX.band([[.3, `The Suite's shot was found by a question written for another line, ${Math.round((a0 - su.found_at) / 60 * 2) / 2} minutes earlier.`], [7, 'A question is written for one moment. Its answers can land anywhere.']]),
      el => { el.querySelector('.clk').style.top = '640px'; el.querySelector('video').style.cssText = 'width:100%;height:100%;object-fit:cover'; go(el); LX.runClock(el, K, L.dur, [{ from: su.found_at, to: a0, at: 1.8 }]); });

    /* THE ASKER'S HABITS · words, keyword in context, what 'empty' brings back */
    B('Habits', 13, () => LX.words(L.words, ['night', 'dark', 'light', 'lights', 'lit']) + LX.band([[.3, `Across all ${L.n_q} questions, the model reached for the same words.`], [6.2, `Its favourite was <b>night</b>: ${L.words[0][1]} times.`]]), el => { LX.runBand(el, K); LX.runWords(el, K); });
    B('Habits', 16, () => LX.kwic(L.kwic.night.lines) + LX.band([[.3, 'Every question that said <b>night</b>, the word held in one column.'], [7.5, 'Read either side of it: streets, roads, windows, skies. Night, again and again.']]), el => { LX.runBand(el, K); LX.runKwic(el, K, 15); });
    B('Habits', 11, () => `<div class="pic left">${vid(H.video, H.t)}</div><div class="side">${H.qs.filter(q => /night|dark|light/.test(q.q)).slice(0, 7).map(q => `<div class="qq k-${q.kind} on"><small>${q.kind}</small>${esc(q.q).replace(/\b(night|dark|lights?)\b/g, '<b style="color:var(--lime)">$1</b>')}</div>`).join('')}</div>`
      + LX.band([[.3, 'Now the opening shot makes sense.'], [4.6, 'Ask for lights at night often enough, and a launch site at night will answer.']]), el => go(el));
    B('Habits', 11, () => `<div class="wall" style="grid-template-columns:repeat(8,1fr)">${L.empty.slice(0, 40).map((e, i) => `<i style="background-image:url('${esc(e.thumb)}');animation-delay:${i * .05}s"></i>`).join('')}</div>`
      + LX.band([[.3, `<b>Empty</b> was asked ${L.kwic.empty.n} times.`], [5, 'These are the first answers each time.']]), el => LX.runBand(el, K));

    /* THE SIEVE · answers, different shots, came back again, kept */
    const SV = L.sieve;
    B('The sieve', 31, () => `<canvas class="sv" width="1520" height="710"></canvas><div class="sbig"><small>ANSWERS</small><span>0</span></div>`
      + LX.band([[.3, `All ${L.n_q} questions together brought back <b>${K.fmt(SV.returned)}</b> answers.`], [8, `Many were the same shot answering again: <b>${K.fmt(SV.unique)}</b> different shots.`], [16, `<em>${K.fmt(SV.multi)}</em> came back more than once.`], [23.5, `<b>${SV.used}</b> ended up in a cut.`]]),
      el => { LX.runBand(el, K); sieve(el); });
    B('The sieve', 12, () => `<div class="wall" style="grid-template-columns:repeat(23,1fr);gap:3px">${SV.kept.map((t, i) => `<i style="background-image:url('${esc(t)}');animation-delay:${i * .012}s"></i>`).join('')}</div>`
      + LX.band([[.3, 'What asking found, and the cuts kept.'], [5.5, `The cuts used ${SV.used_all} shots. The other ${SV.used_all - SV.used} came by other routes: signs, whole films, a human forager.`]]), el => LX.runBand(el, K));

    /* PRACTICE · a new line, no explanation */
    B('Practice', Math.ceil(pr.t1 - pr.t0) + 1, () => pline(pr.line) + LX.band([[.3, 'Another line. This time, read the search yourself.']], 'Your turn'), el => { LX.runBand(el, K); LX.poem(K, AU, pr.t0, pr.t1); speak(el, pr.t1 - pr.t0); });
    pr.asks.forEach(a => { const T = 1.0 + a.q.length / 36, R = T + 1.4;
      B('Practice', Math.ceil(R + 7.5), () => LX.bar(a.q, a.kind, false) + LX.sheet(a.hits, a.kind), el => { LX.typeBar(el, K, .6, 36); LX.revealSheet(el, K, R, .3); LX.markKept(el, K, R + 3.6); }); });
    const pc = pr.chose.find(c => c.take === 'cineosis');
    B('Practice', 12, () => `<div class="pic">${vid(pc.video, pc.in)}</div>` + LX.band([[.3, `<em>${esc(pc.title)}</em>, ${found(pc)}.`]], 'Under this line, Cineosis kept'), el => { go(el); LX.poem(K, AU, pr.t0, pr.t1); });

    /* NOW YOU CAN READ */
    B('Now you can read', 19, () => LX.bar(ex.asks[0].q, 'literal', false) + LX.sheet(ex.asks[0].hits, 'literal')
      + LX.band([[.3, 'Now you can read a search.'], [3.2, '<b>The chip</b>: how it asked. Literal, oblique, place or mood.'], [6.8, '<b>The order</b>: the archive ranks, best match first.'], [10.4, '<b>The bar</b>: how close each picture sits to the words.'], [14, '<b>Lime</b>: a cut kept it, and where in the poem.']]),
      el => { LX.runBand(el, K); el.querySelector('.sb span').textContent = ex.asks[0].q; LX.revealSheet(el, K, .2, .08); LX.markKept(el, K, 14);
        const hl = (sel, at) => K.later(at * 1000, () => { el.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); el.querySelectorAll(sel).forEach(e => e.classList.add('hl')); });
        hl('.sb .chip', 3.2); hl('.sh .rk', 6.8); hl('.sh .meter', 10.4); hl('.nothing', 14); });
    B('Now you can read', 10, () => `<div class="tc"><small>NEXT · LESSON 8</small><h1>Choosing</h1><p>Twenty answers for one line. Why that shot, and not another?</p></div>`, el => LX.ping());

    function sieve(el) {
      const cv = el.querySelector('canvas'), g = cv.getContext('2d'), big = el.querySelector('.sbig span'), lab = el.querySelector('.sbig small');
      const U = SV.dots, A = []; U.forEach((d, u) => { for (let k = 0; k < d[1]; k++) A.push({ u, dup: k > 0 }); });
      A.sort(() => Math.random() - .5);
      const lay = (n, i) => { const cols = Math.ceil(Math.sqrt(n * 1440 / 520)), s = Math.min(1440 / cols, 520 / Math.ceil(n / cols)); return [40 + (i % cols) * s, 180 + Math.floor(i / cols) * s, s - 1.4]; };
      const pa = A.map((a, i) => lay(A.length, i)); const ui = {}; let j = 0; A.forEach((a, i) => { if (!a.dup) ui[i] = lay(U.length, j++); });
      const col = d => d[0] ? [150, 146, 138] : [196, 150, 96];
      K.raf(t => {
        g.clearRect(0, 0, 1520, 710); const st = t < 8 ? 0 : t < 16 ? 1 : t < 23.5 ? 2 : 3, m = Math.min(1, Math.max(0, (t - 8) / 2.5)), e = m * m * (3 - 2 * m);
        A.forEach((a, i) => { const d = U[a.u]; let [x, y, s] = pa[i], al = Math.min(1, t * 1.6 - i / A.length * 1.5);
          if (st >= 1) { if (a.dup) { al *= 1 - e; if (al <= 0) return; } else { const q = ui[i]; x += (q[0] - x) * e; y += (q[1] - y) * e; s += (q[2] - s) * e; } }
          if (al <= 0) return; let c = col(d);
          if (st === 2 && d[1] > 1) c = [242, 193, 78]; if (st === 2 && d[1] <= 1) al *= .35;
          if (st === 3) { if (d[2]) c = [196, 244, 106]; else al *= .16; }
          g.fillStyle = `rgba(${c},${al})`; g.fillRect(x, y, s, s); });
        const n = st === 0 ? Math.round(SV.returned * Math.min(1, t / 2.5)) : st === 1 ? Math.round(SV.returned + (SV.unique - SV.returned) * e) : st === 2 ? SV.multi : SV.used;
        big.textContent = K.fmt(n); lab.textContent = ['ANSWERS', 'DIFFERENT SHOTS', 'CAME BACK AGAIN', 'KEPT IN A CUT'][st]; big.parentNode.style.color = ['var(--gold)', 'var(--ink)', 'var(--gold)', 'var(--lime)'][st];
        return t < 31; });
    }
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
