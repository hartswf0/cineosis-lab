<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Kind of Archive Is This?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=3"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · WHAT KIND OF ARCHIVE IS THIS? The film of the data card (datacard.html). The lab's 15,149 shots tried against the words:
     a collection (things of one kind), a database (no order of its own; every question makes one), a taxonomy and a zoo (specimens out
     of their films, shown by kind), an archive in the strict sense (mandate, custody, original order: the lab holds none of these), an
     operative archive (it searches, sieves and cuts), and a counter-archive, asked four ways: counter to the films' intended use, to
     machine authority, to the record, and in governance. Then the absence ledger: every kind of missing kept apart, after Kumbier's
     distinction between absence and failed retrieval. Every number is from the lab's records (explain/ledger.py -> ledger.json).
     Footage from withheld films is never shown, not even here. Bolas: explain/reel.js. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.view { position: absolute; inset: 0; clip-path: inset(30px 196px 136px 30px); }
.world { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; will-change: transform; }
.bx { position: absolute; background: #000; outline: 4px solid transparent; outline-offset: 5px; transition: outline-color .5s, opacity .5s; }
.bx video, .bx img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bx .cap { position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; font: 13px/1.3 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bx.yes { outline-color: var(--lime); } .bx.dim { opacity: .12 !important; }
.bd { right: 240px; }
.word { position: absolute; left: 40px; top: 46px; font: 600 15px var(--mono); letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
.def { position: absolute; font: italic 40px/1.25 var(--serif); color: var(--ink); text-wrap: balance; }
.sbar { position: absolute; left: 60px; width: 900px; top: 60px; height: 70px; background: #f4efe4; border-radius: 35px; display: flex; align-items: center; padding: 0 30px; color: #141210; font: 28px var(--serif); }
.sbar span::after { content: '▌'; color: #888; animation: blink 1s steps(1) infinite; }
.blk { position: absolute; background: #000; border: 2px solid #2a2621; display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px; font: 600 15px/1.4 var(--mono); letter-spacing: .1em; color: #6f685d; text-transform: uppercase; }
.row { position: absolute; left: 60px; width: 1320px; display: grid; grid-template-columns: 300px 220px minmax(0, 1fr); gap: 24px; align-items: center; opacity: 0; transform: translateX(-20px); transition: opacity .6s, transform .6s; }
.row.on { opacity: 1; transform: none; }
.row b { font: 600 24px/1.15 var(--serif); } .row .n { font: 600 34px var(--mono); color: var(--gold); text-align: right; } .row .n small { display: block; font: 13px var(--mono); color: var(--dim); }
.row .meter { height: 14px; background: #1d1a17; border-radius: 7px; overflow: hidden; } .row .meter i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 1.4s cubic-bezier(.3,.8,.3,1); }
.row .meter + small { display: block; font: 14px var(--mono); color: var(--dim); margin-top: 6px; }
canvas.fd { position: absolute; left: 60px; top: 60px; }
.capt { position: absolute; font: italic 30px/1.3 var(--serif); color: var(--ink); }
.capt small { display: block; font: 600 13px var(--mono); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; font-style: normal; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · THE DATA CARD</p><h1 style="font-weight:600;color:#ece6da">What Kind of Archive Is This?</h1><p>A collection, a database, a zoo, an operative archive, a counter-archive? About four minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/reel.js?v=3"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/ledger.json?v=1', 'explain/lesson/l5m.json?v=3', 'explain/ep/ep1.json?v=1', 'explain/machines/eyes.json?v=1', 'explain/lesson/l9m.json?v=2'],
  cues: ['dae-cold-current-paddle', 'dae-preparation-drift', 'dae-slide-carousel-at-blue-hour', 'dae-cedar-and-cassette'],
  build(D, B, K) {
    const [L, M5, E1, EY, M9] = D, esc = LX.esc, PA = REEL.PA, box = REEL.box, place = REEL.place, fmt = n => Number(n).toLocaleString('en-GB');
    const at = (s, f) => K.later(s * 1000, f);
    const scene = (ch, secs, world, band, run, o = {}) => B(ch, secs, () => `<div class="view"><div class="world">${world}</div></div>${o.over || ''}${band ? LX.band(band, o.label) : ''}`, el => {
      K.startVideos(el); LX.runBand(el, K); const cam = REEL.cam(el.querySelector('.world'), K), g = REEL.bolas(el, K, o.g || {});
      const $ = s => el.querySelector(s), $$ = s => [...el.querySelectorAll(s)]; if (!o.g) at(.2, () => g.park()); run({ el, cam, g, $, $$ });
    });
    const signs = Object.keys(M5.table), loops = signs.map(n => M5.table[n]).filter(Boolean);
    const WR = loops.map((x, i) => ({ x: 40 + (i % 9) * 152, y: 52 + Math.floor(i / 9) * 140, w: 142, h: 107 }));
    const wall = (cls = '') => loops.map((x, i) => box(WR[i], x.loop, { cls: 'w ' + cls })).join('');
    const word = (w, d, y = 120) => `<div class="word">${w}</div><div class="def" style="left:40px;top:${y}px;width:1300px">${d}</div>`;

    /* COLD OPEN · the wall, and the question */
    scene('Cold open', 15, wall(), [[.3, `${fmt(L.found)} shots from ${fmt(L.films_found)} films, gathered by the lab’s own questions.`], [7.5, 'What kind of thing is this?']],
      ({ cam, g }) => { cam.fit(WR[22], 0, 'io', .9, 6); at(.6, () => cam.home(6, 'out')); at(2, () => g.feel('surprised', 1.2)); at(7.6, () => g.feel('think', 3)); at(11.5, () => g.feel('curious', 2.5)); });
    scene('Cold open', 7, '<div class="tc" style="left:120px;right:220px;top:290px"><small>CINEOSIS · THE DATA CARD</small><h1>What Kind of Archive Is This?</h1><p>Six words, tried one at a time.</p></div>', null,
      ({ g }) => { g.to(720, 170, 52); LX.ping(); at(1.2, () => g.feel('determined', 1.6)); at(5, () => g.park()); }, { g: { x: -300, y: 170, r: 52 } });

    /* A COLLECTION · things of one kind */
    const rowR = loops.map((_, i) => ({ x: 40 + (i % 15) * 90, y: 420 + Math.floor(i / 15) * 72, w: 84, h: 63 }));
    scene('A collection', 13, wall(), [[.3, 'A <b>collection</b>: things of one kind, gathered with some coherence.'], [6.5, 'Here the kind is a shot: a few seconds cut from a film, with an in and an out.']],
      ({ $$, g }) => { at(1, () => { $$('.bx.w').forEach((b, i) => K.later(i * 25, () => place(b, rowR[i], .9))); g.feel('happy', 1.4); }); at(2.5, () => {}); },
      { over: '' });
    /* A DATABASE · every question makes an order */
    const hits = E1.searches[0], hitT = (hits.hits || []).slice(0, 6).map(h => h.thumb);
    scene('A database', 15, `<div class="sbar"><span id="typed"></span></div>` + hitT.map((t, i) => box({ x: 60 + i * 225, y: 200, w: 210, h: 158 }, null, { cls: 'hit', style: `background:#000 url(${esc(t)}) center/cover;opacity:0` })).join('') + wall('dim'),
      [[.3, 'A <b>database</b>: no order of its own. Every question makes one.'], [6, `This is one of the ${fmt(L.questions)} questions the lab put to the archive. The order you see is the answer.`]],
      ({ $, $$, g }) => { const q = hits.q, s = $('#typed'); for (let i = 0; i <= q.length; i++) at(.6 + i * .045, () => { s.textContent = q.slice(0, i); if (i % 3 === 0) LX.tick(1600, .02, .02); });
        at(.6 + q.length * .045 + .4, () => { $$('.hit').forEach((h, i) => K.later(i * 220, () => { h.style.transition = 'opacity .5s'; h.style.opacity = 1; REEL.jiggle(h, K, .8); })); g.feel('excited', 1.2); }); });
    /* A TAXONOMY, A ZOO */
    const fam = ['perception', 'affect', 'action', 'reflection', 'mental', 'break', 'time', 'read'], spec = loops[5];
    scene('A zoo', 15, wall() + box({ x: 900, y: 150, w: 460, h: 345 }, spec.loop, { id: 'spec', hide: true, cap: `${esc(spec.title)}${spec.year ? ', ' + spec.year : ''} · cut from its film` }),
      [[.3, 'A <b>taxonomy</b>: the 45 signs sort every shot into kinds.'], [5.5, 'A <b>zoo</b>: each shot is a specimen taken out of its film, its habitat, and shown by kind.'], [11, 'Where it came from is kept: the film, the seconds, the search that found it.']],
      ({ $, $$, g }) => { at(.4, () => $$('.bx.w').forEach((b, i) => { const s = Object.values(M5.table)[i]; })); at(5.4, () => { $$('.bx.w').forEach((b, i) => i !== 5 && b.classList.add('dim')); place($$('.bx.w')[5], { x: 900, y: 150, w: 460, h: 345 }, 1.2); g.feel('curious', 2); });
        at(7, () => { $('#spec').style.opacity = 1; }); at(11.2, () => g.nod()); });

    /* AN ARCHIVE? strictly: mandate, custody, original order */
    const DOTS = Math.round(L.archive_films / 100), LIT = Math.round(L.films_found / 100);
    scene('An archive?', 17, `<canvas class="fd" width="2640" height="1220" style="width:1320px;height:610px"></canvas>`,
      [[.3, 'An <b>archive</b>, strictly: records kept on purpose, by someone with a mandate, in their original order.'], [6.5, `The Moving Image Archive holds about ${fmt(L.archive_films)} films. Each square here is a hundred of them.`], [11.5, `The lab’s questions reached ${fmt(L.films_found)} films: the lit squares. It holds no originals, no mandate, no original order.`]],
      ({ $, g }) => { const cv = $('canvas.fd'), c = cv.getContext('2d'); c.scale(2, 2); const cols = 61, s = 1320 / cols, z = s - 4;
        let shown = 0; const draw = (lit) => { c.clearRect(0, 0, 1320, 610); for (let i = 0; i < shown; i++) { const x = (i % cols) * s, y = Math.floor(i / cols) * s; c.fillStyle = lit && i % Math.floor(DOTS / LIT) === 0 && Math.floor(i / Math.floor(DOTS / LIT)) < LIT ? '#f2c14e' : '#3a352e'; c.fillRect(x, y, z, z); } };
        K.raf(t => { shown = Math.min(DOTS, Math.floor(t / 5 * DOTS)); draw(false); return shown < DOTS; });
        at(11.6, () => { draw(true); LX.ping(); g.feel('sad', 2.5); }); at(14.5, () => g.shake()); });

    /* AN OPERATIVE ARCHIVE */
    const funnel = [['found by the questions', L.found], ['fetched and measured', L.measured], ['kept after the rules', L.kept], ['used in the four takes', L.used_shots]];
    scene('Operative', 15, funnel.map(([t, n], i) => `<div class="row" style="top:${120 + i * 120}px"><b>${t}</b><span class="n">${fmt(n)}<small>shots</small></span><div><div class="meter"><i data-w="${(Math.log10(n) / Math.log10(L.found) * 100).toFixed(1)}"></i></div></div></div>`).join(''),
      [[.3, 'An <b>operative archive</b>: it does not keep, it acts. It searches, scores, sieves and cuts.'], [8, 'From fifteen thousand shots found to six hundred and forty-three in a film.']],
      ({ $$, g }) => { $$('.row').forEach((r, i) => at(1 + i * 1.6, () => { r.classList.add('on'); r.querySelector('i').style.width = r.querySelector('i').dataset.w + '%'; LX.tick(700 - i * 80, .2, .03); g.blink(); })); at(8.2, () => g.feel('determined', 2)); },
      { label: 'bars on a log scale' });

    /* A COUNTER-ARCHIVE? asked four ways */
    const duck = M9.open.cineosis;
    scene('Counter to what?', 15, box({ x: 60, y: 90, w: 620, h: 465 }, duck.hero || duck.loop, { cls: 'contain' }) + `<div class="capt" style="left:740px;top:120px;width:620px"><small>made for</small>teaching children to duck and cover under a nuclear flash</div><div class="capt" style="left:740px;top:330px;width:620px"><small>used here for</small>one line of a poem: <i>“To pick a road: of heavy rain…”</i></div>`,
      [[.3, '<b>Counter to the intended use.</b> A civil-defence film, 1951, made to drill children.'], [6.8, 'In the lab it answers a poem. Reading films against what they were made for: this the lab does.']],
      ({ g }) => { at(7, () => { g.wink(1.6); LX.ping(); }); }, { label: 'counter · 1 of 4' });
    const caps = (EY.blip.invented || []).slice(0, 3);
    scene('Counter to what?', 15, caps.map((c, i) => box({ x: 60 + i * 450, y: 110, w: 420, h: 315 }, null, { style: `background:#000 url(${esc(c.thumb)}) center/cover`, cap: '' }) + `<div class="capt" style="left:${60 + i * 450}px;top:450px;width:420px;font-size:24px"><small>the machine wrote</small>“${esc(c.cap)}”</div>`).join(''),
      [[.3, `<b>Counter to machine authority.</b> A captioning machine invents the word <i>arafed</i> in ${L.misdescribed} of ${L.captions} captions.`], [7.5, 'Every machine word in the lab is shown as a machine’s, and every reading as contestable.']],
      ({ g }) => { at(1.5, () => g.feel('suspicious', 2.5)); at(7.6, () => g.wink(1.4)); }, { label: 'counter · 2 of 4' });
    const wk = L.weak_examples.filter(w => w.thumb).slice(0, 3);
    scene('Counter to what?', 16, wk.map((w, i) => box({ x: 60 + i * 450, y: 230, w: 420, h: 315 }, null, { style: `background:#000 url(${esc(w.thumb)}) center/cover`, cap: `${esc(w.got || '')} · nearness ${w.best.toFixed(2)}` }) + `<div class="capt" style="left:${60 + i * 450}px;top:70px;width:420px;font-size:24px"><small>asked for (${esc(w.name.toLowerCase())})</small>“${esc(w.q.length > 70 ? w.q.slice(0, 68) + '…' : w.q)}”</div>`).join(''),
      [[.3, `<b>Counter to the record?</b> ${L.weak} of ${fmt(L.questions)} questions got only a weak answer. These are three, with what came back.`], [8.5, 'A search that fails is not proof the archive lacks it. Failed retrieval is not absence: the lab can keep the two apart.']],
      ({ g }) => { at(1.4, () => g.feel('think', 3)); at(8.6, () => g.feel('determined', 2)); }, { label: 'counter · 3 of 4' });
    scene('Counter to what?', 16, L.withheld_films.map((f, i) => `<div class="blk" style="left:${60 + i * 450}px;top:150px;width:420px;height:315px">${esc(f.title)}<br><br>${fmt(f.shots)} shots · withheld</div>`).join(''),
      [[.3, `<b>Governance.</b> Three films are withheld by a rule written into every pipeline: ${fmt(L.withheld_shots)} shots never shown, not even here.`], [7, 'No face is named by a machine. No voice imitates a real person.'], [11.5, 'But no one who was filmed was asked, and no one can contest how they are used. Here the lab is not yet a counter-archive.']],
      ({ g }) => { at(.8, () => g.feel('determined', 2)); at(11.6, () => g.feel('sad', 3.5)); }, { label: 'counter · 4 of 4' });

    /* THE ABSENCE LEDGER */
    const kinds = [['Never reached', L.archive_films - L.films_found, `of about ${fmt(L.archive_films)} films no question found`, (L.archive_films - L.films_found) / L.archive_films],
      ['Asked, weakly answered', L.weak, `of ${fmt(L.questions)} questions: best answer under ${L.weak_threshold}`, L.weak / L.questions],
      ['Found, never fetched', L.not_fetched, `of ${fmt(L.found)} shots found`, L.not_fetched / L.found],
      ['Fetched, removed by a rule', L.measured - L.kept, `of ${fmt(L.measured)} measured: dead frames, title cards`, (L.measured - L.kept) / L.measured],
      ['Withheld on purpose', L.withheld_shots, `shots from ${L.withheld_films.length} films`, L.withheld_shots / L.found],
      ['Misdescribed by a machine', L.misdescribed, `of ${L.captions} captions sampled`, L.misdescribed / L.captions]];
    scene('The ledger', 22, kinds.map(([t, n, s, f], i) => `<div class="row" style="top:${56 + i * 112}px"><b>${t}</b><span class="n">${fmt(n)}</span><div><div class="meter"><i data-w="${Math.max(.6, f * 100).toFixed(1)}"></i></div><small>${esc(s)}</small></div></div>`).join(''),
      [[.3, 'The <b>absence ledger</b>: every way a shot can be missing from the lab, kept apart.'], [9, '“Missing” is six different things here. Only one of them, the first, is about the archive; the rest are about the lab.'], [16, 'Each bar is a share of its own whole.']],
      ({ $$, g }) => { $$('.row').forEach((r, i) => at(.8 + i * 1.3, () => { r.classList.add('on'); r.querySelector('i').style.width = r.querySelector('i').dataset.w + '%'; g.blink(); LX.tick(900 - i * 70, .2, .03); })); at(9.2, () => g.feel('think', 3)); at(16.2, () => g.nod()); });

    /* VERDICT */
    scene('So', 13, wall(), [[.3, 'So: a database made intentional by its questions; a taxonomy, a zoo; an operative archive.'], [6.5, 'A counter-reading of a public archive. Not yet a counter-archive.']],
      ({ g }) => { at(1, () => g.feel('happy', 1.6)); at(6.6, () => g.wink(1.6)); });
    scene('So', 8, '<div class="tc" style="left:120px;right:220px;top:290px"><small>THE DATA CARD</small><h1>Read the card</h1><p>What the lab is, where it came from, what is missing, and who decides.</p></div>', null,
      ({ g }) => { LX.ping(); g.to(720, 170, 50); at(3, () => g.wink(1)); at(5.4, () => g.leap(720, -260, 50)); }, { g: { x: 720, y: -200, r: 50 } });
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
