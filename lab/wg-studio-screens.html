<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>68 PURE SCREENS CINEMA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #33ff77;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    display: grid;
    grid-template-rows: 46% 64px 1fr;
    width: 100vw; height: 100vh;
    background: #061c0d; gap: 1px;
  }
  .top-row {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 1px; background: #061c0d;
    min-height: 0; overflow: hidden;
  }
  .vp {
    position: relative; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .vp video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .vp svg, #prismCanvas { width: 100%; height: 100%; display: block; }
  .vp svg { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  .strip-8 {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 1px; background: #061c0d;
  }
  .f-cell { position: relative; background: #000; overflow: hidden; cursor: pointer; }
  .f-cell.active { outline: 2px solid #00e5ff; outline-offset: -2px; z-index: 4; }
  .f-strip-img { position: absolute; top: 0; height: 100%; width: 800%; max-width: none; opacity: 0.8; }
  .f-cell.active .f-strip-img { opacity: 1; }
  .f-cell svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* 68-SCREEN VISUAL WALL */
  .wall-68 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 72px;
    gap: 2px; padding: 2px;
    background: #000; overflow-y: auto;
  }
  .sc-tile {
    position: relative; background: #000; border: 1px solid #092612;
    overflow: hidden; cursor: pointer;
  }
  .sc-tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.68; }
  .sc-tile:hover img { opacity: 0.95; }
  .sc-tile.active { border: 2px solid #ffb000; }
  .sc-tile.active img { opacity: 1; }

  @media (max-width: 900px) {
    .app { grid-template-rows: 42% 52px 1fr; }
    .wall-68 { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); grid-auto-rows: 56px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-row">
    <div class="vp" onclick="togglePlay()">
      <video id="scrVid" autoplay muted playsinline webkit-playsinline preload="auto"></video>
      <svg id="scrSvg" viewBox="0 0 1000 562.5" preserveAspectRatio="none"></svg>
    </div>
    <div class="vp">
      <canvas id="prismCanvas" width="600" height="400"></canvas>
    </div>
  </div>
  <div class="strip-8" id="strip8"></div>
  <div class="wall-68" id="wall68"></div>
</div>

<script>
let SCREENS = [], CUR = 0, SUB = 0, PLAYING = true, YAW = -0.45, PITCH = 0.28;
let STRIP_CACHE = {};

async function init() {
  const res = await fetch('wargames-screens-program.json');
  const data = await res.json();
  SCREENS = data.screen_states || [];
  renderWall();
  if (SCREENS.length) selectScreen(0);
  requestAnimationFrame(loop);
}

function togglePlay() {
  PLAYING = !PLAYING;
  const v = document.getElementById('scrVid');
  if (PLAYING) v.play().catch(() => {}); else v.pause();
}

function renderWall() {
  const w = document.getElementById('wall68');
  w.innerHTML = SCREENS.map((s, i) => `
    <div class="sc-tile ${i === CUR ? 'active' : ''}" id="sct_${i}" onclick="selectScreen(${i})">
      <img src="${s.thumb}" loading="lazy" alt="">
    </div>
  `).join('');
}

function selectScreen(idx) {
  if (!SCREENS.length) return;
  CUR = (idx + SCREENS.length) % SCREENS.length;
  const st = SCREENS[CUR];
  document.querySelectorAll('.sc-tile').forEach((t, i) => t.classList.toggle('active', i === CUR));
  const tile = document.getElementById(`sct_${CUR}`);
  if (tile) tile.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  if (st.strip && !STRIP_CACHE[st.strip]) {
    const im = new Image(); im.src = st.strip; STRIP_CACHE[st.strip] = im;
  }

  const v = document.getElementById('scrVid');
  v.src = st.video;
  v.currentTime = 0;
  if (PLAYING) v.play().catch(() => {});

  renderStrip8(st);
  setSub(0);
}

function renderStrip8(st) {
  const wFrames = (st.worm_3d && st.worm_3d.worm_frames) || [];
  const el = document.getElementById('strip8');
  el.innerHTML = wFrames.map((wf, k) => `
    <div class="f-cell ${k === SUB ? 'active' : ''}" onclick="setSub(${k})">
      <img class="f-strip-img" src="${st.strip}" style="left:${-(k*100)}%;">
      <svg viewBox="0 0 100 56.25" preserveAspectRatio="none">
        <ellipse cx="${wf.u*100}" cy="${wf.v*56.25}" rx="${wf.r*100}" ry="${wf.r*56.25}" fill="none" stroke="${wf.core_color.hex}" stroke-width="1.6"/>
      </svg>
    </div>
  `).join('');
}

function setSub(k) {
  const st = SCREENS[CUR];
  const wFrames = (st && st.worm_3d && st.worm_3d.worm_frames) || [];
  if (!wFrames[k]) return;
  SUB = k;
  document.querySelectorAll('.f-cell').forEach((c, idx) => c.classList.toggle('active', idx === k));
  const wf = wFrames[k];
  const svg = document.getElementById('scrSvg');
  const W = 1000, H = 562.5;
  const spine = wFrames.map(f => `${f.u*W},${f.v*H}`).join(' ');
  svg.innerHTML = `
    <polyline points="${spine}" fill="none" stroke="#00e5ff" stroke-width="2.2"/>
    <ellipse cx="${wf.u*W}" cy="${wf.v*H}" rx="${wf.r*W}" ry="${wf.r*H}" fill="none" stroke="#ffb000" stroke-width="2.6"/>
    <circle cx="${wf.u*W}" cy="${wf.v*H}" r="5" fill="#00e5ff"/>
  `;
  renderPrism(st, k);
}

function proj(u, v, tau, W, H) {
  const x0 = (u - 0.5) * 1.6, y0 = (v - 0.5) * 0.95, z0 = (tau - 0.5) * 1.9;
  const cY = Math.cos(YAW), sY = Math.sin(YAW);
  const x1 = x0 * cY + z0 * sY, z1 = -x0 * sY + z0 * cY;
  const cP = Math.cos(PITCH), sP = Math.sin(PITCH);
  const y2 = y0 * cP - z1 * sP, z2 = y0 * sP + z1 * cP;
  const sc = Math.min(W, H) * 0.65 / (2.85 + z2 * 0.45);
  return { x: W * 0.5 + x1 * sc, y: H * 0.5 + y2 * sc };
}

function renderPrism(st, activeK) {
  const c = document.getElementById('prismCanvas'), ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const wFrames = (st.worm_3d && st.worm_3d.worm_frames) || [];
  if (!wFrames.length) return;

  const stripImg = st.strip ? STRIP_CACHE[st.strip] : null;
  if (stripImg && stripImg.complete && stripImg.naturalWidth > 0) {
    const fw = stripImg.naturalWidth / 8, fh = stripImg.naturalHeight;
    wFrames.forEach((wf, k) => {
      const isAct = k === activeK;
      if (!isAct && k % 2 !== 0) return;
      const tl = proj(0, 0, wf.tau_norm, W, H), br = proj(1, 1, wf.tau_norm, W, H);
      ctx.save(); ctx.globalAlpha = isAct ? 0.6 : 0.16;
      ctx.drawImage(stripImg, k * fw, 0, fw, fh, tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      ctx.restore();
    });
  }

  wFrames.forEach((wf, k) => {
    const isAct = k === activeK;
    ctx.beginPath();
    for (let s = 0; s < 16; s++) {
      const ang = (s / 16) * 2 * Math.PI;
      const p = proj(wf.u + wf.r * Math.cos(ang), wf.v + wf.r * Math.sin(ang), wf.tau_norm, W, H);
      if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = wf.core_color.hex + (isAct ? '66' : '22'); ctx.fill();
    ctx.strokeStyle = isAct ? '#ffffff' : wf.core_color.hex; ctx.lineWidth = isAct ? 2.5 : 1.2; ctx.stroke();
  });
}

function loop() {
  const st = SCREENS[CUR];
  const v = document.getElementById('scrVid');
  YAW += 0.0045; if (YAW > 1.2) YAW = -1.2;
  if (st) renderPrism(st, SUB);
  if (PLAYING && st) {
    if (v.ended) selectScreen(CUR + 1);
    else if (v.duration > 0) {
      const k = Math.min(7, Math.floor((v.currentTime / v.duration) * 8));
      if (k !== SUB) setSub(k);
    }
  }
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
