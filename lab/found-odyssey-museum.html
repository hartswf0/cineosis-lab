<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Found Odyssey</title>
<meta name="description" content="The whole found Odyssey with one button: each line of Homer said plainly, then answered by the archive's own voices, full screen with subtitles, from the first book to the last.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#8a8378; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font:13px var(--mono); }
#stage{ position:fixed; inset:0; background:#000; cursor:none; }
#stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.2s ease, filter 1.1s ease; }
#stage video.on{ opacity:1; }
/* the two pictures are one picture: when the archive answers, its speaker blends into the story, full frame, through a soft edge that
   travels across it (an interpolated mask, not a cut, not a window); as the answer ends the edge travels back and the story returns */
@property --edge{ syntax:'<percentage>'; inherits:true; initial-value:135%; }
@property --mix{ syntax:'<number>'; inherits:true; initial-value:0; }
#stage{ --edge:135%; --mix:0; transition:--edge 1.8s cubic-bezier(.45,.05,.25,1), --mix 1.4s ease; }
#stage.pair{ --edge:38%; --mix:1; }
#stage.pair video.m.on{ filter:brightness(calc(1 - var(--mix) * .25)) saturate(calc(1 - var(--mix) * .2)); }
#win{ position:absolute; inset:0; z-index:3; pointer-events:none; opacity:var(--mix);
  -webkit-mask-image:linear-gradient(100deg, transparent calc(var(--edge) - 46%), rgba(0,0,0,.55) calc(var(--edge) - 18%), #000 var(--edge));
          mask-image:linear-gradient(100deg, transparent calc(var(--edge) - 46%), rgba(0,0,0,.55) calc(var(--edge) - 18%), #000 var(--edge)); }
#win video{ transition:opacity .9s ease; }
#wl{ position:absolute; z-index:5; right:4vw; top:5vh; max-width:40vw; text-align:right; font:500 clamp(9px,.95vw,12px)/1.6 var(--mono); letter-spacing:.16em; color:var(--hi); text-transform:uppercase; opacity:0; transition:opacity .8s ease .5s; }
#wl span{ color:#cfc7b8aa; letter-spacing:.08em; } #wl i{ display:inline-block; height:2px; background:var(--hi); vertical-align:middle; margin:0 0 2px 8px; opacity:.8; }
#stage.pair #wl{ opacity:1; }
#where{ position:absolute; z-index:5; left:4vw; top:5vh; font:500 clamp(9px,.95vw,12px) var(--mono); letter-spacing:.2em; color:#8a837899; text-transform:uppercase; }
#shade{ position:absolute; inset:0; background:linear-gradient(transparent 48%, #000e 90%); z-index:4; pointer-events:none; }
#cap{ position:absolute; left:0; right:0; bottom:0; padding:0 7vw calc(5.5vh + env(safe-area-inset-bottom)); z-index:5; text-align:center; pointer-events:none; }
#cap .who{ font:500 clamp(9px,1vw,12px) var(--mono); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; min-height:1.5em; transition:color .5s; }
#cap .l{ font:300 clamp(18px,2.7vw,36px)/1.3 var(--serif); margin-top:.25em; text-wrap:balance; transform-origin:50% 100%; transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s; }
#cap .a{ font:italic 300 clamp(17px,2.5vw,33px)/1.3 var(--serif); color:var(--hi); margin-top:.3em; min-height:1.3em; text-wrap:balance; }
#cap.answer .l{ transform:scale(.74); opacity:.8; } #cap.answer .who{ color:var(--hi); }
/* each word arrives when it is said: the line's words brighten as the voice reaches them; the answer's words rise into place */
#cap .l b{ font-weight:inherit; color:#efe9dd38; transition:color .35s ease, text-decoration-color .5s, text-shadow .6s; text-decoration:underline 1px transparent; text-underline-offset:.22em; }
#cap .l b.s{ color:var(--ink); } #cap .l b.h.s{ text-decoration-color:#e8c07099; }
#cap .l b.e{ color:var(--hi); text-shadow:0 0 18px #e8c07088; text-decoration-color:var(--hi); }
#cap .a b{ font-weight:inherit; display:inline-block; opacity:0; transform:translateY(.35em); transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
#cap .a b.s{ opacity:1; transform:none; } #cap .a b.h{ text-decoration:underline 1px var(--hi); text-underline-offset:.22em; font-style:normal; }
#card{ position:absolute; inset:0; z-index:6; display:grid; place-items:center; text-align:center; pointer-events:none; opacity:0; transition:opacity 1.4s ease; background:radial-gradient(ellipse at center, #000a, #000e 70%); }
#card.on{ opacity:1; }
#card .bk{ font:500 clamp(11px,1.2vw,14px) var(--mono); letter-spacing:.34em; color:var(--hi); }
#card .bt{ font:300 clamp(30px,5.2vw,68px)/1.08 var(--serif); margin:.25em 0 .15em; }
#card .st{ font:italic 300 clamp(17px,2.2vw,28px) var(--serif); color:#d8d1c4; }
#card .cd{ font:300 clamp(14px,1.5vw,19px)/1.45 var(--serif); color:var(--dim); max-width:46em; margin:1.2em auto 0; padding:0 8vw; }
#bar{ position:absolute; left:0; bottom:0; height:2px; background:var(--hi); opacity:.55; z-index:7; width:0; }
#pause{ position:absolute; inset:0; z-index:8; display:none; background:#050505ee; overflow:auto; cursor:auto; padding:6vh 5vw 8vh; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
#pause.on{ display:block; } #pause .top{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
#pause .top b{ font:500 12px var(--mono); letter-spacing:.3em; color:var(--dim); font-weight:500; }
#go{ font:500 13px var(--mono); letter-spacing:.3em; color:#050505; background:var(--hi); border:0; border-radius:999px; padding:13px 30px; cursor:pointer; }
.sc{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 26px; } .sc button{ font:400 12px var(--mono); color:#cfc7b8; background:#16130f; border:1px solid #2a2723; border-radius:999px; padding:7px 12px; cursor:pointer; }
.sc button.on{ border-color:var(--hi); color:var(--hi); } .sc button:hover{ border-color:#e8c07088; }
.hd{ font:500 11px var(--mono); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; margin:6px 0 10px; text-align:left; }
/* the books, as pictures: each card the book's first picture, its number, its title, how long it plays */
.books{ display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:10px; text-align:left; }
.bk{ position:relative; aspect-ratio:16/10; border-radius:6px; overflow:hidden; cursor:pointer; background:#16130f center/cover no-repeat; border:1px solid #2a2723; transition:transform .25s ease, border-color .25s; }
.bk::after{ content:''; position:absolute; inset:0; background:linear-gradient(transparent 25%, #000d 92%); }
.bk:hover{ transform:translateY(-3px); border-color:#e8c070aa; } .bk.on{ border-color:var(--hi); box-shadow:0 0 0 1px var(--hi); }
.bk div{ position:absolute; left:10px; right:10px; bottom:9px; z-index:1; } .bk small{ display:block; font:500 9.5px var(--mono); letter-spacing:.24em; color:var(--hi); }
.bk span{ display:block; font:300 16px/1.18 var(--serif); color:var(--ink); margin-top:3px; } .bk em{ display:block; font:400 10px var(--mono); color:#a39b8e; margin-top:4px; font-style:normal; }
#wait{ position:absolute; right:18px; top:16px; z-index:8; font:500 11px var(--mono); letter-spacing:.2em; color:var(--dim); opacity:0; transition:opacity .4s; }
#wait.on{ opacity:1; }
#front{ position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:auto; text-align:center; background:radial-gradient(ellipse at 50% 40%, #16130f, #050505 70%); padding:24px; }
#front h1{ font:300 clamp(38px,7vw,92px)/1.02 var(--serif); margin:0; letter-spacing:-.01em; }
#front p{ font:300 clamp(15px,1.7vw,21px)/1.5 var(--serif); color:#cfc7b8; max-width:36em; margin:18px auto 0; }
#front .meta{ font:500 11px var(--mono); letter-spacing:.22em; color:var(--dim); margin-top:22px; text-transform:uppercase; }
#play{ margin-top:38px; font:500 15px var(--mono); letter-spacing:.34em; color:#050505; background:var(--hi); border:0; border-radius:999px; padding:18px 44px 18px 50px; cursor:pointer; }
#play:disabled{ opacity:.4; cursor:wait; }
#front .how{ font:400 11px var(--mono); color:#6b655d; margin-top:20px; letter-spacing:.06em; } #front .books{ max-width:1100px; margin:6px auto 0; } #front .hd{ max-width:1100px; margin:44px auto 10px; }
</style></head><body>
<div id="stage"><video class="m" muted playsinline preload="auto"></video><video class="m" muted playsinline preload="auto"></video><div id="win"><video class="b" muted playsinline preload="auto"></video><video class="b" muted playsinline preload="auto"></video></div><div id="wl"></div><div id="where"></div>
  <div id="shade"></div><div id="cap"><div class="who"></div><div class="l"></div><div class="a"></div></div>
  <div id="card"><div><div class="bk"></div><div class="bt"></div><div class="st"></div><div class="cd"></div></div></div>
  <div id="bar"></div><div id="wait">LOADING</div><div id="pause"><div class="top"><button id="go">CONTINUE</button><b id="pw"></b></div><div class="hd" id="sch"></div><div class="sc" id="scs"></div><div class="hd">the books</div><div class="books" id="pbooks"></div></div></div>
<div id="front"><div><h1>The Found Odyssey</h1><p>Homer's lines, said plainly, and answered by what archival people actually said.</p><div class="meta" id="meta">loading</div><button id="play" disabled>PLAY</button><div class="how">full screen · plays from the beginning to the end · tap to pause and choose a book</div><div class="hd" id="fh"></div><div class="books" id="fbooks"></div></div></div>
<audio id="aud" preload="auto"></audio>
<script>
/* One button. The program is a list of scenes; each has one rendered sound track (the line said plainly, then the archive answering),
   a picture track (what we see, and when it changes), the answering voice's own footage beside it, and the words. The sound is the clock:
   everything on screen follows the track's time. */
(() => {
  const PROGRAM = 'odyssey/museum.json', $ = s => document.querySelector(s), aud = $('#aud'), stage = $('#stage'), cap = $('#cap');
  const main = [...document.querySelectorAll('video.m')], side = [...document.querySelectorAll('video.b')];
  let P = null, si = 0, S = null, total = 0, before = [], started = false, books = [];
  const q = new URLSearchParams(location.search), url = u => /^https?:/.test(u) ? u : (P.root || '') + u;
  const fmt = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
  fetch(PROGRAM).then(r => r.json()).then(p => {
    P = p; let acc = 0; before = p.scenes.map(s => { const a = acc; acc += s.dur; return a; }); total = acc;
    books = []; p.scenes.forEach((sc, i) => { let b = books[books.length - 1]; if (!b || b.n !== sc.book) books.push(b = { n: sc.book, num: sc.bnum, title: sc.btitle, first: i, dur: 0, thumb: sc.thumb, scenes: [] }); b.dur += sc.dur; b.scenes.push(i); if (!b.thumb) b.thumb = sc.thumb; });
    grid($('#fbooks'), -1); $('#fh').textContent = 'or begin at a book';
    $('#meta').textContent = `${books.length} book${books.length === 1 ? '' : 's'}${books.length < p.scenes.length ? ` · ${p.scenes.length} scenes` : ''} · ${fmt(total)}`; $('#play').disabled = false;
  }).catch(() => { $('#meta').textContent = 'the program did not load'; });
  function grid(el, cur) {
    el.innerHTML = ''; books.forEach(b => { const d = document.createElement('div'); d.className = 'bk' + (b.n === cur ? ' on' : ''); if (b.thumb) d.style.backgroundImage = `url("${b.thumb}")`;
      d.innerHTML = `<div><small>${b.num ? 'BOOK ' + b.num : ''}</small><span></span><em>${fmt(b.dur)}${books.length < P.scenes.length ? ` · ${b.scenes.length} scene${b.scenes.length === 1 ? '' : 's'}` : ''}</em></div>`; d.querySelector('span').textContent = b.title;
      d.onclick = e => { e.stopPropagation(); jump(b.first); }; el.append(d); });
  }
  function jump(i) { if (!started) { start(i); return; } $('#pause').classList.remove('on'); load(i, true); }
  function chooser() {   /* paused: the books, and the scenes of the book we are in */
    const b = books.find(x => x.scenes.includes(si)); grid($('#pbooks'), b && b.n); $('#pw').textContent = `${b && b.num ? 'book ' + b.num.toLowerCase() + ' · ' : ''}${b ? b.title : ''}`;
    $('#sch').textContent = b && b.scenes.length > 1 ? 'the scenes of this book' : ''; const sc = $('#scs'); sc.innerHTML = '';
    if (b && b.scenes.length > 1) b.scenes.forEach((i, k) => { const x = document.createElement('button'); x.className = i === si ? 'on' : ''; x.textContent = `${k + 1} · ${P.scenes[i].title || 'scene ' + (k + 1)}`; x.onclick = e => { e.stopPropagation(); jump(i); }; sc.append(x); });
  }
  function start(i) {
    const el = document.documentElement; try { (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el); } catch (e) { }
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }
    $('#front').style.display = 'none'; started = true; load(i, true); requestAnimationFrame(tick);
  }
  $('#play').onclick = () => start(Math.max(0, Math.min(P.scenes.length - 1, +(q.get('scene') || 1) - 1)));
  /* a deck: two video elements taking turns, the next clip loaded in the hidden one before its moment */
  function deck(els) {
    const D = { els, cur: null, key: null };
    D.prime = (c) => { if (!c) return; const k = c.video + '@' + c.in; if (els.some(e => e._k === k)) return; const e = els.find(x => !x.classList.contains('on')) || els[0]; if (e.classList.contains('on')) return; e._k = k; e.src = c.video; e.preload = 'auto'; e.load(); e._in = c.in || 0; e.addEventListener('loadedmetadata', () => { try { e.currentTime = e._in; } catch (x) { } }, { once: true }); };
    D.show = (c, dd, want) => {
      const k = c.video + '@' + c.in; let e = els.find(x => x._k === k);
      if (!e) { D.prime(c); e = els.find(x => x._k === k); } if (!e) return;
      if (e.readyState < 2) { $('#wait').classList.add('on'); return false; }
      $('#wait').classList.remove('on'); try { if (Math.abs(e.currentTime - want) > .35) e.currentTime = want; } catch (x) { }
      e.playbackRate = c.rate || 1; if (!aud.paused) e.play().catch(() => { });
      e.style.transitionDuration = (c.tr === 'cut' || !dd ? 0 : Math.min(2000, dd)) + 'ms, .8s'; e.style.zIndex = (D.z = (D.z || 1) + 1);
      els.forEach(x => { if (x !== e && x.classList.contains('on')) { x.classList.remove('on'); setTimeout(() => { if (!x.classList.contains('on')) x.pause(); }, 2200); } });
      e.classList.add('on'); D.cur = c; D.key = k; return true;
    };
    D.keep = (want, rate) => { const e = els.find(x => x._k === D.key); if (!e || e.readyState < 2 || e.seeking) return; const dur = e.duration || 1e9; const w = want > dur - .15 ? Math.max(0, dur - .15) : want; if (Math.abs(e.currentTime - w) > .6) try { e.currentTime = w; } catch (x) { } if (aud.paused && !e.paused) e.pause(); if (!aud.paused && e.paused && w < dur - .2) e.play().catch(() => { }); };
    D.hide = () => { els.forEach(x => { x.classList.remove('on'); setTimeout(() => { if (!x.classList.contains('on')) x.pause(); }, 900); }); D.cur = null; D.key = null; };
    return D;
  }
  const M = deck(main), B = deck(side);
  function load(i, go) {
    si = i; S = P.scenes[i]; M.hide(); B.hide(); stage.classList.remove('pair'); setLine(null); where(); aud.src = url(S.audio); aud.currentTime = 0;
    if (S.pics[0]) M.prime(S.pics[0]); if (S.beside[0]) B.prime(S.beside[0]);
    const c = $('#card'); c.querySelector('.bk').textContent = S.bnum ? `BOOK ${S.bnum}` : ''; c.querySelector('.bt').textContent = S.btitle || ''; c.querySelector('.st').textContent = S.title || ''; c.querySelector('.cd').textContent = S.card || '';
    c.classList.add('on'); clearTimeout(load.t); load.t = setTimeout(() => c.classList.remove('on'), Math.max(2600, ((S.lines[0] || {}).at || 2) * 1000 - 200));
    if (go) aud.play().catch(() => { pause(true); });
  }
  aud.addEventListener('ended', () => { if (si + 1 < P.scenes.length) load(si + 1, true); else finish(); });
  function finish() { M.hide(); B.hide(); cap.querySelector('.l').textContent = ''; cap.querySelector('.a').textContent = ''; cap.querySelector('.who').textContent = ''; const c = $('#card'); c.querySelector('.bk').textContent = 'THE END'; c.querySelector('.bt').textContent = P.title; c.querySelector('.st').textContent = ''; c.querySelector('.cd').textContent = P.end || ''; c.classList.add('on'); clearTimeout(load.t); }
  function tick() {
    requestAnimationFrame(tick); if (!S) return; const t = aud.currentTime;
    $('#bar').style.width = ((before[si] + t) / total * 100).toFixed(3) + '%';
    /* the picture: the last change at or before now; the one after it loaded ahead */
    let k = -1; S.pics.forEach((p, n) => { if (p.sw <= t) k = n; }); const p = S.pics[Math.max(0, k)];
    if (p) { const want = (p.in || 0) + Math.max(0, t - p.sw) * (p.rate || 1); if (M.cur !== p) M.show(p, p.dd, want); else M.keep(want); const nx = S.pics[k + 1]; if (nx && nx.sw - t < 6) M.prime(nx); }
    /* beside: while an archival voice answers, its own footage takes the right half, in step with the words */
    const b = S.beside.find(x => x.sw <= t && t < x.end), bn = S.beside.find(x => x.sw > t);
    if (b) { if (B.closing) { clearTimeout(B.closing); B.closing = null; } const want = b.in + (t - b.sw); if (B.cur !== b) { if (B.show(b, 0, want) !== false) stage.classList.add('pair'); } else B.keep(want); }
    else if (B.cur && !B.closing) { stage.classList.remove('pair'); B.closing = setTimeout(() => { B.hide(); B.closing = null; }, 1050); }   /* the window closes over its picture, then lets it go */
    if (bn && bn.sw - t < 5) B.prime(bn);
    /* the words, as a reading of how the system works: the line arrives word by word as it is said; when the archive answers, the line
       steps back, the answer rises word by word under it, and every word the two share lights in both at the moment the archive says it */
    const L = S.lines.filter(l => l.at - .3 <= t).pop(), show = L && t < L.aend + 1.4, ans = show && t >= L.aat - .2;
    if ((show ? L : null) !== words.L) setLine(show ? L : null);
    if (words.L) {
      const lt = words.lt, at = words.at; let echo = null;
      words.lb.forEach((b, k) => b.classList.toggle('s', t >= lt[k]));
      words.ab.forEach((b, k) => { const on = t >= at[k]; b.classList.toggle('s', on); if (on && b._h && t < at[k] + 1.6) echo = b._st; });
      words.lb.forEach(b => b.classList.toggle('e', !!(ans && echo && b._st === echo)));
      cap.classList.toggle('answer', !!ans); cap.querySelector('.who').textContent = ans ? 'the archive answers' : (words.L.who || '');
    }
  }
  const words = { L: null, lb: [], ab: [], lt: [], at: [] }, stemOf = w => { w = w.toLowerCase().replace(/[^a-z']/g, '').replace(/^'+|'+$/g, ''); for (const s of ['ings', 'ing', 'edly', 'ed', 'es', 's', 'ly']) if (w.length > s.length + 3 && w.endsWith(s)) return w.slice(0, -s.length); return w; };
  /* when each word is said: the memo's own word times where we have them, otherwise spread over the voice by the length of each word */
  const spread = (ws, a, b) => { const n = ws.map(w => w.length + 1), tot = n.reduce((x, y) => x + y, 0) || 1; let acc = 0; return ws.map((w, k) => { const v = a + (b - a) * acc / tot; acc += n[k]; return v; }); };
  function setLine(L) {
    words.L = L; const lc = cap.querySelector('.l'), la = cap.querySelector('.a'); lc.innerHTML = ''; la.innerHTML = ''; words.lb = []; words.ab = []; cap.classList.remove('answer'); cap.querySelector('.who').textContent = '';
    if (!L) { $('#wl').innerHTML = ''; return; }
    const lw = L.text.split(/\s+/), aw = (L.ans || '').split(/\s+/).filter(Boolean), hl = new Set(L.hl || []), ha = new Set(L.ha || []);
    lw.forEach((w, k) => { const b = document.createElement('b'); b.textContent = w; b._st = stemOf(w); if (hl.has(k)) b.className = 'h'; lc.append(b, ' '); words.lb.push(b); });
    aw.forEach((w, k) => { const b = document.createElement('b'); b.textContent = w; b._st = stemOf(w); b._h = ha.has(k); if (b._h) b.className = 'h'; la.append(b, ' '); words.ab.push(b); });
    words.lt = L.lt && L.lt.length === lw.length ? L.lt : spread(lw, L.at, Math.max(L.at + .5, L.end - .15));
    words.at = L.awt && L.awt.length === aw.length ? L.awt : spread(aw, L.aat, Math.max(L.aat + .5, L.aend - .45));
    const sh = (L.hl || []).length;
    $('#wl').innerHTML = `the archive answers${L.src ? ` <span>· ${L.src}</span>` : ''}<br><span>meaning ${Math.round((L.sc || 0) * 100)}${sh ? ` · ${sh} word${sh === 1 ? '' : 's'} in common` : ''}</span><i style="width:${Math.round((L.sc || 0) * 90)}px"></i>`;
  }
  function where() { $('#where').textContent = `${S.bnum ? 'book ' + S.bnum.toLowerCase() : ''}${S.title ? ' · ' + S.title : ''} · ${si + 1} of ${P.scenes.length}`; }
  function pause(on) { if (!started) return; $('#pause').classList.toggle('on', on); if (on) { chooser(); aud.pause(); [...main, ...side].forEach(v => v.pause()); } else aud.play().catch(() => { }); }
  stage.addEventListener('click', () => pause(!aud.paused ? true : false));
  $('#pause').addEventListener('click', e => { if (e.target.id === 'pause' || e.target.id === 'go') pause(false); });
  addEventListener('keydown', e => {
    if (!started) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); $('#play').click(); } return; }
    if (e.key === ' ') { e.preventDefault(); pause(!aud.paused); } if (e.key === 'Escape' && aud.paused) pause(false); if (e.key === 'b' || e.key === 'B') pause(true);
    if (e.key === 'ArrowRight' && si + 1 < P.scenes.length) load(si + 1, !aud.paused);   /* for whoever is presenting: the next scene, the one before */
    if (e.key === 'ArrowLeft') load(aud.currentTime > 4 ? si : Math.max(0, si - 1), !aud.paused);
  });
})();
