<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the Lab Sees</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- HOW THE LAB SEES — a short film, played in the browser, about how the Cineosis Lab's machines learned to look and listen, and the one
     step none of them can do: the reading. Every image is the lab's own archive; every number is a real output of the lab's own models
     on those shots (explain/build.py → explain/film.json). No narrator: type, the archive's own sound, and the D-A-E score. -->
<style>
:root { --ink: #f3efe6; --dim: #a8a196; --faint: #6f685d; --gold: #f2c14e; --pic: #6f8cff; --snd: #ff9f43; --word: #c9a4ff; --ours: #7fd6a4; --bg: #000; --serif: 'Fraunces', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#wrap { position: fixed; inset: 0 0 64px 0; display: grid; place-items: center; }
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 50% 50%; overflow: hidden; background: #000; }
.beat { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
.beat.on { opacity: 1; }
/* type */
.say { position: absolute; left: 120px; right: 120px; bottom: 96px; font: 400 46px/1.25 var(--serif); text-shadow: 0 2px 18px #000, 0 0 4px #000; }
.say.mid { top: 50%; bottom: auto; transform: translateY(-50%); text-align: left; }
.say.top { top: 70px; bottom: auto; }
.say.small { font-size: 34px; }
.say.corner { left: 40px; right: auto; width: 500px; top: 34px; bottom: auto; font-size: 29px; }
.say span { display: block; opacity: 0; transform: translateY(14px); animation: up 1s ease forwards; }
.say b { color: var(--gold); font-weight: 600; }
@keyframes up { to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }
.fadein { opacity: 0; animation: fade 1s ease forwards; }
.label { font: 600 15px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dimmed { filter: brightness(.45); }
.ken { animation: ken 14s ease-out forwards; } @keyframes ken { from { transform: scale(1.0); } to { transform: scale(1.08); } }
.big { font: 600 150px/1 var(--serif); letter-spacing: -.02em; }
.chip { display: inline-grid; place-items: center; min-width: 1.9em; padding: 0 .3em; height: 1.5em; border-radius: 3px; color: #1a1712; font: 600 1em/1 var(--serif); }
.tag { display: inline-block; background: var(--snd); color: #111; padding: 2px 10px; border-radius: 4px; font: 600 22px var(--mono); }
/* grids of frames */
.wall { position: absolute; inset: -40px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; animation: drift 30s linear forwards; }
@keyframes drift { to { transform: translateY(-220px); } }
.pair { background: #0d0c0a; border: 1px solid #222; } .pair img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; } .pair p { margin: 0; padding: 6px 8px 8px; font: 15px/1.3 var(--serif); color: #e6dfd2; height: 52px; overflow: hidden; }
.pair.gone { opacity: .1; transition: opacity 1.2s; }
.counter { position: absolute; right: 70px; top: 50px; text-align: right; background: rgba(0,0,0,.8); padding: 14px 20px; }
.counter b { display: block; font: 600 64px var(--serif); color: var(--gold); } .counter small { color: var(--dim); font-size: 15px; }
.standin { position: absolute; left: 70px; top: 54px; background: rgba(0,0,0,.8); padding: 6px 10px; font-size: 14px; color: var(--dim); }
/* the matrix */
.mx { position: absolute; }
.mx .col { position: absolute; } .mx .col img { width: 100%; height: 100%; object-fit: cover; display: block; border: 1px solid #222; }
.mx .row { position: absolute; display: flex; align-items: center; justify-content: flex-end; text-align: right; font: 18px/1.2 var(--serif); color: #e6dfd2; padding-right: 14px; }
.mx .cell { position: absolute; display: grid; place-items: center; font: 14px var(--mono); color: #000; opacity: 0; animation: fade .5s ease forwards; border-radius: 3px; }
.mx .cell.diag { box-shadow: 0 0 0 3px var(--gold), 0 0 26px rgba(242,193,78,.7); }
.mx.settle .cell:not(.diag) { filter: brightness(.35) saturate(.4); transition: filter 1.5s; }
.mx .spec { width: 100%; height: 100%; object-fit: fill; }
.bars { position: absolute; display: flex; flex-direction: column; gap: 9px; }
.bars div { display: grid; grid-template-columns: 330px 1fr 80px; align-items: center; gap: 14px; font: 21px var(--serif); }
.bars i { height: 18px; background: #1a1916; border-radius: 3px; position: relative; overflow: hidden; } .bars i b { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--pic); border-radius: 3px; transition: width 1.6s cubic-bezier(.2,.7,.2,1); }
.bars em { font: 18px var(--mono); color: var(--dim); font-style: normal; text-align: right; }
.code { display: block; }
.panel { position: absolute; background: rgba(10,9,8,.9); border: 1px solid #2a2722; padding: 18px 22px; }
.sim { font: 600 70px var(--serif); color: var(--gold); }
.thumbs { position: absolute; display: flex; gap: 14px; } .thumbs figure { margin: 0; width: 230px; opacity: 0; animation: up .8s ease forwards; } .thumbs img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid #2a2722; } .thumbs figcaption { font: 16px/1.3 var(--serif); color: #ddd5c6; margin-top: 6px; height: 42px; overflow: hidden; } .thumbs figcaption em { display: block; font: 12px var(--mono); color: var(--faint); font-style: normal; }
.rowlabel { position: absolute; font: 600 18px var(--mono); letter-spacing: .14em; }
canvas.map { position: absolute; inset: 0; }
.crop { position: absolute; border: 4px solid var(--gold); transition: all 1.4s ease; }
.cut { position: absolute; transition: transform 1.6s cubic-bezier(.2,.7,.2,1), filter 1.6s; filter: drop-shadow(0 0 18px rgba(111,140,255,.9)); }
.box { position: absolute; border: 3px solid var(--pic); box-shadow: 0 0 20px rgba(111,140,255,.6); }
.spec-wrap { position: absolute; left: 120px; right: 120px; height: 260px; border: 1px solid #2a2722; } .spec-wrap img { width: 100%; height: 100%; object-fit: fill; display: block; } .spec-wrap .ph { position: absolute; top: -6px; bottom: -6px; width: 3px; background: #fff; box-shadow: 0 0 10px #fff; }
.axis { position: absolute; font: 14px var(--mono); color: var(--dim); }
.subs { position: absolute; left: 140px; right: 140px; bottom: 80px; text-align: center; font: 40px/1.3 var(--serif); text-shadow: 0 2px 10px #000; min-height: 60px; }
.subs span { background: rgba(0,0,0,.55); padding: 2px 12px; }
.typed::after { content: '▌'; animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
.blip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; position: absolute; inset: 90px 110px 120px; } .blip figure { margin: 0; } .blip img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; } .blip figcaption { font: 21px/1.3 var(--serif); color: var(--word); min-height: 56px; margin-top: 8px; }
.layers { position: absolute; left: 820px; right: 80px; top: 140px; display: flex; flex-direction: column; gap: 28px; }
.layers div { opacity: 0; animation: up 1s ease forwards; } .layers small { display: block; font: 600 15px var(--mono); letter-spacing: .16em; margin-bottom: 6px; } .layers p { margin: 0; font: 32px/1.25 var(--serif); }
.table { position: absolute; left: 80px; top: 120px; display: grid; gap: 6px; }
.table .t { width: 82px; height: 82px; border-radius: 4px; color: #1a1712; padding: 6px; font: 600 30px var(--serif); opacity: 0; animation: fade .5s ease forwards; position: relative; }
.table .t small { position: absolute; left: 6px; bottom: 5px; font: 10px var(--mono); line-height: 1.1; right: 4px; }
.table .t.lit { outline: 4px solid #fff; z-index: 2; }
.qbig { position: absolute; left: 120px; right: 120px; top: 200px; }
.qbig .chip { font-size: 70px; } .qbig h2 { font: 600 80px/1.1 var(--serif); color: var(--gold); margin: 24px 0 20px; } .qbig p { font: 28px/1.4 var(--serif); color: #e6dfd2; max-width: 1200px; }
.vs { position: absolute; inset: 90px 80px 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
.vs figure { margin: 0; } .vs img, .vs video { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid #2a2722; background: #111; }
.vs .read { margin-top: 14px; font: 24px/1.3 var(--serif); opacity: 0; } .vs .read.show { animation: up 1s ease forwards; } .vs .read em { display: block; font: 15px var(--mono); color: var(--dim); font-style: normal; margin-bottom: 6px; }
.verdict { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(0,0,0,.88); border: 2px solid var(--pic); padding: 18px 34px; text-align: center; z-index: 3; transition: opacity 1s, top 1.2s; }
.verdict b { display: block; font: 600 74px var(--serif); color: var(--pic); } .verdict small { font: 16px var(--mono); color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
.verdict.up { top: 8%; transform: translate(-50%, 0) scale(.6); }
.road { position: absolute; left: 70px; right: 70px; top: 170px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
.road div { border: 1px solid #2a2722; background: #0c0b09; padding: 16px; opacity: 0; animation: up .9s ease forwards; min-height: 380px; }
.road small { display: block; font: 600 14px var(--mono); letter-spacing: .14em; color: var(--gold); margin-bottom: 10px; } .road p { margin: 0; font: 22px/1.3 var(--serif); } .road img { width: 100%; aspect-ratio: 4/3; object-fit: cover; margin-top: 10px; display: block; }
.road .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; } .road .sheet i { aspect-ratio: 4/3; background-size: cover; opacity: .4; } .road .sheet i.k { opacity: 1; outline: 3px solid var(--gold); }
.dots { position: absolute; left: 120px; right: 120px; top: 120px; height: 520px; }
.end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; gap: 30px; }
.end h1 { font: 600 76px/1.1 var(--serif); margin: 0; } .end nav { display: flex; gap: 20px; } .end a { color: #000; background: var(--gold); padding: 14px 26px; font: 600 22px var(--mono); text-decoration: none; border-radius: 4px; pointer-events: auto; } .end a.ghost { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
.credit { position: absolute; left: 70px; bottom: 30px; font: 14px var(--mono); color: var(--faint); }
/* controls */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #050505; border-top: 1px solid #1d1a16; }
#bar button { background: none; border: 1px solid #333; color: var(--ink); font: 14px var(--mono); padding: 6px 10px; border-radius: 4px; cursor: pointer; min-width: 40px; }
#chs { flex: 1; display: flex; gap: 3px; height: 36px; min-width: 0; }
#chs div { position: relative; flex: var(--w); background: #15130f; border-radius: 3px; cursor: pointer; overflow: hidden; min-width: 0; }
#chs div i { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(242,193,78,.35); }
#chs div span { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--dim); white-space: nowrap; letter-spacing: .08em; }
#chs div.on span { color: #fff; }
#time { font-size: 12px; color: var(--dim); width: 92px; text-align: right; }
#start { position: fixed; inset: 0; z-index: 10; background: radial-gradient(ellipse at center, rgba(0,0,0,.5), #000 80%); display: grid; place-items: center; text-align: center; cursor: pointer; }
#start h1 { font: 600 88px/1 var(--serif); margin: 0 0 18px; } #start p { font: 22px/1.4 var(--serif); color: var(--dim); max-width: 760px; margin: 0 auto 30px; } #start b { display: inline-block; background: var(--gold); color: #000; font: 600 22px var(--mono); padding: 14px 30px; border-radius: 6px; }
@media (max-width: 700px) { #bar { gap: 6px; padding: 0 8px; } #chs div span { display: none; } #time { display: none; } #start h1 { font-size: 48px; } #start p { font-size: 17px; padding: 0 16px; } }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><h1>How the Lab Sees</h1><p>Seven machines learned to look and listen from the internet. One person reads what they cannot. A film about the Cineosis Lab, made of its own archive and its models' real answers. About eight minutes, with sound.</p><b>▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const DOMC = { perception: '#e9d9a8', affect: '#f0b9a4', action: '#e7a37c', reflection: '#b9cfa0', mental: '#a9c9c9', break: '#d9d3c7', time: '#b8b3d8', read: '#d9b8d2' };
const fmt = n => Number(n).toLocaleString('en-US');
let F, S, beats = [], cur = -1, timer = 0, paused = false, sound = true, tok = 0, t0 = 0, left = 0;
const stage = $('#stage'), score = $('#score');

/* ---------- small makers ---------- */
const say = (lines, cls = '') => `<div class="say ${cls}">${lines.map((l, i) => `<span style="animation-delay:${.25 + i * 1.1}s">${l}</span>`).join('')}</div>`;
const chip = (n, size = '') => { const s = S[n]; return s ? `<span class="chip" style="background:${DOMC[s.dom]};${size}">${esc(s.symbol)}</span>` : ''; };
const vid = (s, cls = 'full', muted = true) => `<video class="${cls}" data-src="${esc(s.video)}" data-t="${s.t || 0}" ${muted ? 'muted' : ''} playsinline loop></video>`;
const heat = v => { const x = Math.max(0, Math.min(1, (v - .05) / .3)); return `hsl(${45 - x * 10},${40 + x * 50}%,${10 + x * 55}%)`; };
function startVideos(el, withSound) { el.querySelectorAll('video[data-src]').forEach(v => { v.src = v.dataset.src; v.addEventListener('loadedmetadata', () => { try { v.currentTime = +v.dataset.t || 0; } catch (e) { } if (withSound && sound && !v.hasAttribute('muted')) { v.muted = false; v.volume = 1; } v.play().catch(() => { v.muted = true; v.play().catch(() => { }); }); }, { once: true }); }); }
function bars(cv, arr, rgb) { const g = cv.getContext('2d'), W = cv.width, H = cv.height, bw = W / arr.length; g.clearRect(0, 0, W, H);
  arr.forEach((q, i) => { const v = q / 127, h = Math.abs(v) * H / 2; g.fillStyle = `rgba(${rgb},${.3 + Math.abs(v) * .7})`; g.fillRect(i * bw, v > 0 ? H / 2 - h : H / 2, Math.max(1, bw - .3), Math.max(1, h)); }); }
const later = (ms, f) => { const my = tok; setTimeout(() => { if (my === tok) f(); }, ms); };
const typeIn = (el, text, cps = 34) => { const my = tok; let i = 0; el.classList.add('typed'); const step = () => { if (my !== tok) return; el.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, 1000 / cps); else el.classList.remove('typed'); }; step(); };
const duck = on => { score.volume = sound ? (on ? .07 : .32) : 0; };

/* ---------- the film ---------- */
function build() {
  const seed = F.seed, C = F.clip, Z = F.zero, rd = seed.reading, dm = S[String(rd.n)];
  const B = (ch, secs, html, after, opt = {}) => beats.push({ ch, secs, html, after, ...opt });
  /* OPEN */
  B('A field', 7, () => `${vid(seed, 'full ken')}${say(['A field. Sheep.', 'One of them is dark.'])}`, el => startVideos(el));
  B('A field', 7, () => `${vid(seed, 'full dimmed')}${say(['We asked some machines, and one person,', 'what they find here.'])}`, el => startVideos(el));
  B('A field', 12, () => `<img class="full dimmed" src="${esc(seed.thumb)}">
    <div class="layers" style="left:120px;top:110px;right:120px;gap:22px">
      <div style="animation-delay:.3s"><small style="color:var(--pic)">A PICTURE MACHINE</small><p>an animal · ${Math.round(Z.subjects[0][1] * 100)}%</p></div>
      <div style="animation-delay:2.2s"><small style="color:var(--word)">A SENTENCE MACHINE</small><p>“${esc(seed.cap)}”</p></div>
      <div style="animation-delay:4.1s"><small style="color:var(--snd)">A SOUND MACHINE</small><p>silence</p></div>
      <div style="animation-delay:6.4s"><small style="color:var(--gold)">A PERSON</small><p style="color:var(--gold)">${esc(rd.note)}</p></div></div>`);
  B('A field', 7, () => say(['Only the last one is a reading.', 'None of the machines was made for films.', 'They learned from the internet.'], 'mid'));
  /* LAION */
  const pool = [...C.shots, ...F.blip, ...F.map.near, ...F.dino.near, ...F.clap.shots].filter(x => x.cap);
  const wall = () => `<div class="wall">${Array.from({ length: 42 }, (_, i) => pool[i % pool.length]).map((p, i) => `<div class="pair" data-i="${i}"><img src="${esc(p.thumb)}"><p>${esc(p.cap)}</p></div>`).join('')}</div>`;
  B('Where they learned', 10, () => `${say(['<b>LAION</b> is a non-profit in Germany.', 'It gathered links to pictures on the public web,', 'and the words people wrote under them.'], 'mid')}`);
  B('Where they learned', 11, () => `${wall()}<div class="standin">stand-ins: our frames and our captions. LAION's pairs are web images and their alt-text.</div><div class="counter"><b id="cnt">0</b><small>picture–text pairs in LAION-5B</small></div>${say(['5.85 billion pairs.', '2.3 billion of them in English.'], 'small')}`,
    el => { const c = $('#cnt', el), my = tok, t = performance.now(); const go = () => { if (my !== tok) return; const k = Math.min(1, (performance.now() - t) / 6000); c.textContent = fmt(Math.round(5850000000 * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(go); }; go(); });
  B('Where they learned', 10, () => `${wall()}${say(['Nobody looked at them all.', 'An earlier CLIP kept a pair', 'if the words seemed to match the picture.'], 'small')}`,
    el => { const ps = [...el.querySelectorAll('.pair')]; ps.forEach((p, i) => { if ((i * 7) % 5 === 0) later(2500 + i * 60, () => p.classList.add('gone')); }); });
  B('Where they learned', 10, () => say(['In 2023, researchers found links to child sexual abuse material in it.', 'LAION took it down,', 'and released a cleaned version in 2024.'], 'mid small'));
  B('Where they learned', 7, () => say(['So the machine\'s eye is the web\'s eye:', '<b>what people wrote under pictures.</b>'], 'mid'));
  /* CLIP */
  B('The matching game', 9, () => `<div class="qbig" style="top:230px"><div class="big fadein">CLIP</div><h2 style="color:var(--ink);font-size:52px" class="fadein"><b style="color:var(--gold)">C</b>ontrastive <b style="color:var(--gold)">L</b>anguage–<b style="color:var(--gold)">I</b>mage <b style="color:var(--gold)">P</b>re-training</h2><p class="fadein">OpenAI, 2021. The copy we use was trained by LAION, on LAION-2B.</p></div>`);
  const mx = (opts = {}) => { const N = C.shots.length, cx = 560, cy = 210, cw = 124, chh = 76;
    const order = opts.shuffle ? [3, 6, 0, 5, 2, 7, 1, 4] : [...Array(N).keys()];
    let h = `<div class="mx${opts.settle ? ' settle' : ''}" style="inset:0">`;
    C.shots.forEach((s, j) => h += `<div class="col" style="left:${cx + j * cw}px;top:${cy - 104}px;width:${cw - 8}px;height:90px"><img src="${esc(s.thumb)}"></div>`);
    order.forEach((i, r) => h += `<div class="row" style="left:40px;top:${cy + r * chh}px;width:${cx - 50}px;height:${chh - 6}px">${esc(C.shots[i].cap)}</div>`);
    if (opts.cells) order.forEach((i, r) => C.shots.forEach((_, j) => { const v = C.cos[j][i]; h += `<div class="cell${opts.diag && i === j ? ' diag' : ''}" style="left:${cx + j * cw}px;top:${cy + r * chh}px;width:${cw - 8}px;height:${chh - 8}px;background:${heat(v)};animation-delay:${opts.fast ? 0 : (r * N + j) * .07}s">${v.toFixed(2)}</div>`; }));
    return h + '</div>'; };
  B('The matching game', 10, () => `${mx({ shuffle: true })}${say(['The game: eight pictures, eight sentences.', 'Which sentence goes with which picture?'], 'corner')}`);
  B('The matching game', 11, () => `${mx({ cells: true })}${say(['It scores every picture against every sentence.'], 'corner')}`);
  B('The matching game', 11, () => `${mx({ cells: true, diag: true, fast: true })}${say(['Training pulls the right pairs together,', 'and pushes every wrong pair apart.', 'Billions of times.'], 'corner')}`, el => later(1800, () => el.querySelector('.mx').classList.add('settle')));
  B('The matching game', 8, () => say(['That is all “contrastive” means:', 'learn what goes together', '<b>by contrast with what does not.</b>'], 'mid'));
  B('The matching game', 9, () => { const p = C.p[0]; return `<img src="${esc(seed.thumb)}" style="position:absolute;left:120px;top:150px;width:420px;border:1px solid #333">
      <div class="bars" style="left:600px;top:150px;right:120px">${C.shots.map((s, j) => `<div><span style="font-size:18px">${esc(s.cap)}</span><i><b data-w="${p[j] * 100}" style="background:${j === 0 ? 'var(--gold)' : 'var(--pic)'}"></b></i><em>${(p[j] * 100).toFixed(1)}%</em></div>`).join('')}</div>
      ${say([`For the sheep it bets <b>${(p[0] * 100).toFixed(0)}%</b> on the right sentence.`], 'small')}`; }, el => later(400, () => el.querySelectorAll('.bars b').forEach(b => b.style.width = b.dataset.w + '%')));
  B('The matching game', 13, () => `<img src="${esc(seed.thumb)}" style="position:absolute;left:120px;top:90px;width:300px;border:1px solid #333">
      <canvas class="code" id="ci" width="1024" height="110" style="position:absolute;left:460px;top:110px;width:1020px;height:110px"></canvas>
