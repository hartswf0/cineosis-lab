<title>Blacktop</title>

.x{ position:absolute; right:10px; top:8px; font-size:18px; color:var(--ink); background:#000a; width:28px; height:28px; border-radius:50%; z-index:2; }

.ver .keep{ position:absolute; right:8px; top:7px; font:700 13px var(--sans); letter-spacing:.12em; padding:4px 10px; border-radius:2px; background:#000b; border:1px solid #ffffff44; } .ver.kept .keep{ background:var(--hot); color:#170b04; border-color:var(--hot); }

#mm .h{ position:absolute; left:0; right:0; top:2%; text-align:center; color:#fff; font:700 15px var(--sans); }
