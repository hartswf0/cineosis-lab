<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions on One Clock · Lesson 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- CINEOSIS · LESSON 9 · VERSIONS ON ONE CLOCK, as a cartoon scratched into black film. Four Bolas, one per take of the WYGWYL
     suite, run the poem's one clock on four threads: one line and four answers, the race where every cut blinks, the four times
     two takes reach the same shot (Suite and Cineosis bump heads and wink), the shots each pair shares tossed between them, the
     one take that stays with a film, and the loom. Data: explain/l9.py -> explain/lesson/l9.json. Drawing: explain/toon.js. -->
<style>
body, #stage { background: #0b0a09; }
canvas.toon { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 9</p><h1 style="font-weight:600;color:#ece6da">Versions on One Clock</h1><p>A cartoon about four films of one poem, run side by side, and how rarely they meet. About two minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/toon.js?v=2"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l9.json?v=1'],
  cues: ['dae-cold-current-paddle', 'dae-salvaged-room-traveling-light', 'dae-slide-carousel-at-blue-hour', 'dae-cedar-and-cassette'],
  build(D, B, K) {
    const L = D[0], TK = L.takes, n = L.n, O = L.open, STYLE = 'scratch';
    const scene = (ch, secs, fn) => B(ch, secs, () => `<canvas class="toon" width="1600" height="900"></canvas>`, el => TOON.play(el.querySelector('canvas.toon'), fn, K, { style: STYLE }));
    const say = (d, s, t, at, y = 830, size = 40) => { if (t > at) d.text(s, 800, y, { size, a: Math.min(1, (t - at) * 2) }); };
    const tEnd = L.lanes.suite[n - 1].t1, LY = [300, 420, 540, 660], X0 = 230, X1 = 1540, xAt = s => X0 + (X1 - X0) * s / tEnd;
    const open = TK.map(k => TOON.img(O.shots[k].thumb));
    const lanes = d => TK.forEach((k, j) => { d.thread(X0 - 20, LY[j], X1 + 20, LY[j], { w: 2.4 }); d.text(k, 120, LY[j], { size: 28, font: 'italic 600 28px Fraunces, Georgia, serif' }); });

    /* TITLE */
    scene('Cold open', 6, (d, t) => {
      [260, 620, 980, 1340].forEach((x, j) => { const t0 = j * .35, y = d.kv(t, [[t0, -180], [t0 + .9, 330, 'in'], [t0 + 1.05, 360], [t0 + 1.3, 320, 'out'], [t0 + 1.5, 330]]), sq = d.kv(t, [[t0, 1.25], [t0 + .9, 1.25], [t0 + 1, .7], [t0 + 1.25, 1.1], [t0 + 1.5, 1]]);
        d.bolas({ x, y, r: 62, sq, eyes: t > 3.4 + j * .15 && t < 3.6 + j * .15 ? 'blink' : 'open', look: [0, .3] }); d.text(TK[j], x, 520, { size: 26, a: Math.min(1, Math.max(0, t - 2)) }); });
      d.text('Versions on One Clock', 800, 700, { size: 64, a: Math.min(1, Math.max(0, t - 2.4)) });
    });
    /* ONE LINE, FOUR ANSWERS */
    scene('Cold open', 15, (d, t) => {
      const xs = [260, 620, 980, 1340];
      xs.forEach((x, j) => { const a = d.kv(t, [[.5 + j * .5, 0], [1.2 + j * .5, 1, 'back']]);
        const lean = (j === 0 || j === 3) && t > 6.5 && t < 11 ? (j === 0 ? 1 : -1) * d.kv(t, [[6.5, 0], [7.4, .25], [10, .25], [11, 0]]) : 0;
        const shake = t > 9 && t < 10.2 && (j === 0 || j === 3) ? Math.sin(t * 30) * .08 : 0;
        d.bolas({ x, y: 200, r: 48, lean: lean + shake, eyes: t > 9.2 && t < 9.4 ? 'blink' : 'open', look: (j === 0 || j === 3) && t > 6.5 && t < 11 ? [j === 0 ? 1 : -1, .2] : [0, 1], arms: [[-70, 70], [70, 70]] });
        if (a > 0) d.pic(open[j], x, 500, 125 * a, { w: 5, zoom: 1 + t * .01 }); d.text(TK[j], x, 660, { size: 26 }); });
      say(d, 'You would think four films of one poem would share their pictures.', t, .4, 760, 38);
      if (t > 7) say(d, 'Two even come from the same film, Friendship Seven. Still not the same shot.', t, 7, 830, 32);
    });

    /* THE CLOCK, THE RACE */
    scene('The race', 16, (d, t) => {
      const sweep = t / 16, cx = 800, cy = 130; d.ring(cx, cy, 70, { w: 4 }); d.line(cx, cy, cx + Math.sin(sweep * Math.PI * 2) * 58, cy - Math.cos(sweep * Math.PI * 2) * 58, { w: 4 }); d.dot(cx, cy, 6);
      lanes(d); const now = tEnd * Math.min(1, t / 14);
      TK.forEach((k, j) => { const lane = L.lanes[k]; let last = 0; lane.forEach((x, i) => { if (x.t0 <= now) { d.dot(xAt(x.t0), LY[j], 4); last = i; } });
        const bx = xAt(now), step = Math.sin(t * 22 + j) * 10, cutJust = lane.some(x => x.t0 <= now && now - x.t0 < tEnd / 14 * .12);
        d.bolas({ x: bx, y: LY[j] - 70, r: 34, thread: false, eyes: cutJust ? 'blink' : 'open', look: [1, 0], arms: [[-40, 30 + step], [40, 30 - step]], legs: [[-30 + step, 70], [30 - step, 70]] }); });
      say(d, 'One clock: the poem read aloud. Four films cut to it, 169 moments each.', t, .5, 790, 34);
      if (t > 7) say(d, 'Every cut is a blink: the film passing to its next shot.', t, 7, 850, 32);
    });

    /* WHERE THEY MEET */
    const meets = L.same_shot.map(m => ({ i: m.i, t: L.lanes.suite[m.i].t0 })), films = L.same_src.map(m => L.lanes.suite[m.i].t0);
    scene('Where they meet', 18, (d, t) => {
      lanes(d); const now = tEnd * Math.min(1, t / 15);
      films.forEach(ft => { if (ft <= now) d.line(xAt(ft), 250, xAt(ft), 700, { w: 1.4, a: .35, col: '#d9b84a' }); });
      TK.forEach((k, j) => L.lanes[k].forEach(x => { if (x.t0 <= now) d.dot(xAt(x.t0), LY[j], 3, 'rgba(242,237,224,.5)'); }));
      let met = 0, bump = null; meets.forEach(m => { if (m.t <= now) { met++; if (now - m.t < tEnd / 15 * 1.1) bump = m; } });
      TK.forEach((k, j) => { let y = LY[j] - 64; const isPair = j === 0 || j === 2;
        if (bump && isPair) { const p = (now - bump.t) / (tEnd / 15 * 1.1), lift = Math.sin(Math.min(1, p) * Math.PI); y = (LY[j] - 64) + (LY[1] - 64 - (LY[j] - 64)) * lift * (j === 0 ? .95 : .95); }
        d.bolas({ x: xAt(now), y, r: 30, thread: false, eyes: bump && isPair ? 'wink' : 'open', look: [1, 0] }); });
      meets.forEach(m => { if (m.t <= now) { d.ring(xAt(m.t), LY[1] - 70, 22, { col: d.RED, w: 3 }); } });
      if (bump) d.text('✶', xAt(now), LY[1] - 120, { size: 56, col: d.RED });
      d.text(`same shot: ${met} of ${n}`, 1350, 150, { font: '600 34px IBM Plex Mono, monospace' }); d.text(`same film: ${films.filter(f => f <= now).length}`, 1350, 200, { font: '600 26px IBM Plex Mono, monospace', col: '#d9b84a' });
      say(d, 'When two films choose the very same shot, they bump heads and wink.', t, .5, 790, 34);
      if (t > 15) say(d, 'Four times in 169. Always Suite and Cineosis.', t, 15, 850, 36);
    });

    /* TOSSING THE SHARED SHOTS */
    const P = [[330, 230], [1270, 230], [330, 610], [1270, 610]], pairs = [];
    for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) for (let k = 0; k < L.shared[a][b]; k++) pairs.push([a, b]);
    scene('Shared', 15, (d, t) => {
      const per = 10.5 / pairs.length, done = Math.min(pairs.length, Math.floor(Math.max(0, t - 1) / per)), cnt = {};
      pairs.slice(0, done).forEach(([a, b]) => { const k = a + '' + b; cnt[k] = (cnt[k] || 0) + 1; });
      for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) { const c = cnt[a + '' + b] || 0; for (let k = 0; k < c; k++) { const o = (k - (c - 1) / 2) * 6; d.line(P[a][0] + o, P[a][1] + o, P[b][0] + o, P[b][1] + o, { col: d.RED, w: 1.6, a: .8 }); }
        if (c) d.text(String(c), (P[a][0] + P[b][0]) / 2 + (a === 0 && b === 3 ? -80 : a === 1 && b === 2 ? 80 : 0), (P[a][1] + P[b][1]) / 2 - 20, { font: '600 34px IBM Plex Mono, monospace', col: '#f2c14e' }); }
      if (done < pairs.length) { const [a, b] = pairs[done], p = ((t - 1) % per) / per, x = P[a][0] + (P[b][0] - P[a][0]) * p, y = P[a][1] + (P[b][1] - P[a][1]) * p - Math.sin(p * Math.PI) * 140; d.ring(x, y, 20, { w: 3 }); }
      P.forEach(([x, y], i) => d.bolas({ x, y, r: 50, thread: y < 400 ? -20 : false, eyes: done < pairs.length && (pairs[done][0] === i || pairs[done][1] === i) && ((t * 3) % 1 < .2) ? 'blink' : 'open', look: [(800 - x) / 600, (450 - y) / 300], arms: [[-70, 40], [70, 40]], legs: y > 400 ? [[-50, 120], [50, 120]] : undefined }));
      P.forEach(([x, y], i) => d.text(TK[i], x + (x < 800 ? -150 : 150), y, { size: 30 }));
      say(d, 'Forget the clock. How many shots does each pair share anywhere in the film?', t, .3, 820, 32);
      if (t > 12) say(d, 'At most twelve, out of 169.', t, 12, 870, 34);
    });

    /* STAYING WITH ONE FILM */
    scene('Staying', 15, (d, t) => {
      lanes(d); const win = L.lanes.scenes.slice(30, 52), t0 = win[0].t0, t1 = win[win.length - 1].t1, now = t0 + (t1 - t0) * Math.min(1, t / 12), X = s => X0 + (X1 - X0) * (s - t0) / (t1 - t0);
      TK.forEach((k, j) => { const lane = L.lanes[k].filter(x => x.t0 >= t0 && x.t0 <= t1); let a = 0;
        for (let i = 1; i <= lane.length; i++) if (i === lane.length || lane[i].src !== lane[a].src) { if (lane[a].t0 <= now) { const xr = Math.min(X(now), X(lane[i - 1].t1)); i - a > 1 ? d.line(X(lane[a].t0), LY[j], xr, LY[j], { w: 10 }) : d.dot(X(lane[a].t0), LY[j], 6); } a = i; }
        const cur = lane.filter(x => x.t0 <= now).pop(), hop = k === 'scenes' ? 0 : Math.abs(Math.sin((now - (cur ? cur.t0 : t0)) / ((t1 - t0) / lane.length) * Math.PI)) * 30;
        d.bolas({ x: X(now), y: LY[j] - 70 - hop, r: 30, thread: false, eyes: hop > 25 ? 'blink' : 'open', look: [1, 0], body: k === 'scenes' ? (dd, x, y, r) => { for (let q = 0; q < 5; q++) { const a = q / 5 * Math.PI * 2 + t * 4; dd.dot(x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5, r * .14); } } : undefined }); });
      say(d, 'Thick strokes are a film staying with one source. Only Scenes does it: one old film per line.', t, .5, 800, 30);
      if (t > 8) say(d, 'The others hop every moment. The sieve forbids the same film within three shots.', t, 8, 856, 30);
    });

    /* THE LOOM */
    const W0 = Math.max(0, Math.min(n - 6, O.i - 2)), cols = [...Array(6).keys()].map(k => W0 + k), IM = TK.map(k => cols.map(i => L.lanes[k][i].hide ? null : TOON.img(L.lanes[k][i].thumb)));
    scene('The loom', 16, (d, t) => {
      const CX = c => 420 + c * 200, RY = [190, 360, 530, 700];
      cols.forEach((c, k) => d.line(CX(k), 100, CX(k), 790, { w: 1.4, a: .35 }));
      TK.forEach((k, j) => { const p = Math.min(1, Math.max(0, (t - .5 - j * .7) / 6)), xe = 260 + (1500 - 260) * p; d.thread(260, RY[j], xe, RY[j], { w: 3 });
        cols.forEach((c, q) => { if (CX(q) < xe) { const im = IM[j][q]; im ? d.pic(im, CX(q), RY[j], 70, { w: 4 }) : d.ring(CX(q), RY[j], 70, { w: 2, a: .4 }); } });
        d.bolas({ x: xe, y: RY[j] - 4, r: 26, thread: false, eyes: p >= 1 && t > 12 && t < 13.4 ? 'wink' : 'open', look: [1, 0] }); d.text(k, 150, RY[j], { size: 26 }); });
      if (t > 9) { const q = Math.floor((t - 9) * 1.2) % 6; d.stroke([[CX(q) - 84, 100], [CX(q) + 84, 100], [CX(q) + 84, 790], [CX(q) - 84, 790], [CX(q) - 84, 100]], { col: '#f2c14e', w: 3 }); }
      say(d, 'Six moments, four films. A film is a row.', t, 1, 840, 36); if (t > 9) say(d, 'A comparison is a column: one moment, four answers.', t, 9, 884, 30);
    });

    /* END */
    scene('End', 9, (d, t) => {
      [260, 620, 980, 1340].forEach((x, j) => d.bolas({ x, y: 300, r: 60, eyes: t > 1 + j * .5 && t < 1.6 + j * .5 ? 'wink' : 'open', look: [0, .3] }));
      d.text('Four rules. Four films that hardly touch.', 800, 600, { size: 46, a: Math.min(1, t) });
      if (t > 3.5) d.text('Watch them under One poem, four cuts', 800, 720, { font: '600 26px IBM Plex Mono, monospace', a: Math.min(1, t - 3.5) });
    });
  }
};
</script>
