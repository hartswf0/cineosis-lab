<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions on One Clock · Lesson 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=2"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · LESSON 9 · VERSIONS ON ONE CLOCK. The four takes of the WYGWYL suite on the poem's one clock, each in its own row:
     where they choose the same shot (4 moments of 169), the same film (30), how many shots they share anywhere, and how long each
     stays with one source film. Drawn with the Bolas sets: 06 line, circle, dot (one clock, four lanes, runs as thick line),
     07 wink, not blink (cuts blink, the moments the takes meet wink), 13 the web of cineosis (the shared-shot web),
     11 bolas pixel (the title card). Data: explain/l9.py -> explain/lesson/l9.json. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.quad { position: absolute; left: 40px; right: 40px; top: 30px; height: 610px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; }
.quad figure { margin: 0; position: relative; min-height: 0; opacity: 0; animation: up .7s ease forwards; }
.quad img, .quad video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
.quad figcaption { position: absolute; left: 0; bottom: -30px; font: 600 14px var(--mono); letter-spacing: .14em; color: var(--lime); text-transform: uppercase; }
.quad figcaption span { color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 400; margin-left: 10px; }
.clock { position: absolute; left: 80px; right: 80px; top: 160px; height: 360px; }
.clock .ln { position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--red); }
.clock .pt { position: absolute; top: calc(50% - 26px); height: 52px; border-left: 2px solid #3a362f; }
.clock .pt span { position: absolute; top: 60px; left: 6px; font: 13px var(--mono); color: var(--dim); white-space: nowrap; }
.clock .now { position: absolute; top: calc(50% - 14px); width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 4px solid var(--ink); transform: translateX(-50%); }
.lanes { position: absolute; left: 80px; right: 80px; top: 40px; height: 600px; }
.lane { position: absolute; left: 230px; right: 0; height: 120px; }
.lane > b { position: absolute; left: -230px; top: 30px; width: 210px; font: 600 15px var(--mono); letter-spacing: .14em; color: var(--lime); text-transform: uppercase; }
.lane > b small { display: block; font: italic 15px/1.25 var(--serif); letter-spacing: 0; text-transform: none; color: var(--dim); margin-top: 6px; font-weight: 400; }
.lane .ln { position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: var(--red); opacity: .55; }
.lane i { position: absolute; top: 60px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); opacity: 0; transition: opacity .25s; }
.lane i.run { width: auto; height: 9px; border-radius: 5px; transform: translateY(-50%); background: var(--ink); }
.lane .w { position: absolute; top: 10px; transform: translateX(-50%); opacity: 0; transition: opacity .6s; }
.lanes .meet { position: absolute; top: 0; bottom: 0; border-left: 2px dashed rgba(224,72,58,.65); opacity: 0; transition: opacity .6s; }
.lanes .film { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(242,193,78,.25); opacity: 0; transition: opacity .6s; }
.web { position: absolute; left: 0; right: 0; top: 0; height: 650px; }
.loom { position: absolute; left: 60px; right: 60px; top: 30px; }
.loom .row { display: grid; grid-template-columns: 170px repeat(6, minmax(0,1fr)); gap: 10px; align-items: center; margin-bottom: 12px; opacity: 0; animation: up .6s ease forwards; }
.loom .row b { font: 600 14px var(--mono); letter-spacing: .14em; color: var(--lime); text-transform: uppercase; }
.loom img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.loom .hd { font: italic 15px/1.25 var(--serif); color: #cfc8ba; }
.rec { position: absolute; left: 80px; right: 80px; top: 60px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 26px; }
.rec div { opacity: 0; animation: up .7s ease forwards; } .rec b { font: 600 15px var(--mono); letter-spacing: .14em; color: var(--lime); text-transform: uppercase; }
.rec p { font: italic 24px/1.32 var(--serif); color: var(--ink); margin: 10px 0; } .rec small { font: 15px var(--mono); color: var(--gold); }
canvas.pix { width: 192px; height: 192px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; margin: 30px auto 0; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 9</p><h1 style="font-weight:600;color:#ece6da">Versions on One Clock</h1><p>Four films of one poem, side by side, and how rarely they meet. About three minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/marks.js?v=1"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l9.json?v=1'],
  cues: ['dae-cold-current-paddle', 'dae-salvaged-room-traveling-light', 'dae-slide-carousel-at-blue-hour', 'dae-cedar-and-cassette', 'dae-preparation-drift', 'dae-feather-rustle-dub'],
  build(D, B, K) {
    const L = D[0], esc = LX.esc, AU = 'wygwyl/WYGWYL_Suite_Audio.mp3', TK = L.takes, O = L.open, n = L.n;
    const tEnd = L.lanes.suite[n - 1].t1, fx = t => (t / tEnd * 100).toFixed(3) + '%';
    const pline = line => `<div class="pline" style="position:absolute;left:140px;right:140px;top:200px;font:italic 50px/1.3 var(--serif);color:var(--ink)">${line.split(/\s+/).map(w => `<span style="opacity:.12;transition:opacity .35s">${esc(w)}</span>`).join(' ')}</div>`;
    const speak = (el, secs) => { const ws = [...el.querySelectorAll('.pline span')]; ws.forEach((w, i) => K.later((.4 + i * (secs - 1.2) / ws.length) * 1000, () => w.style.opacity = 1)); };
    const quad = (cap) => `<div class="quad">${TK.map((k, i) => { const s = O.shots[k]; return `<figure style="animation-delay:${.3 + i * .5}s"><img src="${esc(s.thumb)}" alt=""><figcaption>${k}${cap ? `<span>${esc(s.title)}, ${s.year}</span>` : ''}</figcaption></figure>`; }).join('')}</div>`;

    /* COLD OPEN */
    B('Cold open', 13, () => quad(false) + LX.band([[.4, 'You would think four films made from the same poem would share their pictures.'], [7, 'One line of the poem, and the shot each of the four films gave it.']]), el => LX.runBand(el, K));
    B('Cold open', 12, () => quad(true) + LX.band([[.3, 'Four different shots. Two of them even come from the same film, and still they are not the same shot.'], [7.5, 'This lesson lays all four films on one clock and looks for where they meet.']]), el => LX.runBand(el, K));
    B('Cold open', 8, () => `<div class="tc"><small>CINEOSIS · LESSON 9</small><h1>Versions on One Clock</h1><canvas class="pix"></canvas></div>`,
      el => { MK.pixel(el.querySelector('canvas.pix'), g => { [6, 12, 18, 24].forEach((y, k) => { g.line(2, y, 29, y, '#e0483a'); for (let x = 4 + k; x < 29; x += 5) g.disc(x, y, 1, '#ece6da'); }); g.line(14, 2, 14, 29, '#ece6da'); }); LX.ping(); });

    /* THE CLOCK */
    B('The clock', Math.ceil(O.t1 - O.t0) + 4, () => pline(O.line) + LX.band([[.3, `The poem runs ${Math.round(tEnd / 60)} minutes. This line comes at ${Math.floor(O.t0 / 60)}:${String(Math.floor(O.t0 % 60)).padStart(2, '0')}.`]], 'Where You Go When You Leave'),
      el => { LX.runBand(el, K); LX.poem(K, AU, O.t0, O.t1); speak(el, O.t1 - O.t0); });
    B('The clock', 13, () => `<div class="clock"><div class="ln"></div>${L.parts.map(p => `<div class="pt" style="left:${fx(p.t0)}"><span>${esc(p.n)}</span></div>`).join('')}<div class="now" style="left:${fx(O.t0)}"></div></div>`
      + LX.band([[.3, 'One clock: the poem, read aloud, in fourteen chapters.'], [6.5, `All four films are cut to it: ${n} moments each, the same moments, in the same order.`]]), el => LX.runBand(el, K));

    /* FOUR LANES */
    const lanesHTML = () => `<div class="lanes">${TK.map((k, j) => `<div class="lane" style="top:${j * 140}px"><b>${k}<small>${esc(L.ideas[k].split(':')[0].split('.')[0])}</small></b><div class="ln"></div>${L.lanes[k].map(x => `<i style="left:${fx(x.t0)}"></i>`).join('')}</div>`).join('')}</div>`;
    B('Four lanes', 15, () => lanesHTML() + LX.band([[.3, 'Each film in its own row. Every dot is a cut: a blink, the film passing from one shot to the next.'], [8, 'Same clock, same moments. Now look down the columns.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.lane i').forEach((i, k) => K.later(200 + (k % n) * 18 + Math.floor(k / n) * 300, () => i.style.opacity = 1)); });

    /* WHERE THEY MEET */
    B('Where they meet', 17, () => `<div class="lanes">${TK.map((k, j) => `<div class="lane" style="top:${j * 140}px"><b>${k}</b><div class="ln"></div>${L.lanes[k].map(x => `<i style="left:${fx(x.t0)};opacity:.35"></i>`).join('')}${L.same_shot.filter(m => m.takes.includes(k)).map(m => `<span class="w" style="left:${fx(L.lanes[k][m.i].t0)}">${MK.eye('wink', 18)}</span>`).join('')}</div>`).join('')}${L.same_src.map(m => `<div class="film" style="left:calc(230px + (100% - 230px) * ${L.lanes.suite[m.i].t0 / tEnd})"></div>`).join('')}${L.same_shot.map(m => `<div class="meet" style="left:calc(230px + (100% - 230px) * ${L.lanes.suite[m.i].t0 / tEnd})"></div>`).join('')}</div>`
      + LX.band([[.3, `Where two films chose the very same shot at the same moment, the mark winks. It happens <b>${L.same_shot.length}</b> times in ${n}.`], [8, `Every time, it is Suite and Cineosis. The faint gold columns are moments where two films reached for the same source film: <b>${L.same_src.length}</b>.`]]),
      el => { LX.runBand(el, K); K.later(800, () => el.querySelectorAll('.w,.meet').forEach(w => w.style.opacity = 1)); K.later(8000, () => el.querySelectorAll('.film').forEach(w => w.style.opacity = 1)); });

    /* SHARED ANYWHERE · the web between the four */
    const P = [[430, 150], [1170, 150], [430, 520], [1170, 520]];
    B('Shared anywhere', 15, () => { let s = `<svg class="web" viewBox="0 0 1600 650">`; for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) { const v = L.shared[a][b]; for (let k = 0; k < v; k++) { const o = (k - (v - 1) / 2) * 7; s += `<line x1="${P[a][0] + o}" y1="${P[a][1] + o}" x2="${P[b][0] + o}" y2="${P[b][1] + o}" stroke="#e0483a" stroke-width="2" opacity=".85"/>`; } const f = (a === 0 && b === 3) ? .32 : (a === 1 && b === 2) ? .68 : .5, mx = P[a][0] + (P[b][0] - P[a][0]) * f, my = P[a][1] + (P[b][1] - P[a][1]) * f; s += `<text x="${mx}" y="${my - 14}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="#f2c14e">${v}</text>`; }
        P.forEach(([x, y], i) => { s += `<circle cx="${x}" cy="${y}" r="58" fill="#0b0a09" stroke="#ece6da" stroke-width="7"/><text x="${x}" y="${y + 6}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600" fill="#c4f46a">${TK[i].toUpperCase()}</text>`; }); return s + '</svg>' + LX.band([[.3, 'Forget the clock. How many shots does each pair of films share anywhere, at any moment?'], [7.5, `One thread per shared shot. At most ${Math.max(L.shared[0][1], L.shared[0][2], L.shared[0][3], L.shared[1][2], L.shared[1][3], L.shared[2][3])}, out of ${n}.`]]); }, el => LX.runBand(el, K));

    /* HOW EACH LANE MOVES */
    B('How each lane moves', 18, () => `<div class="rec">${TK.map((k, i) => `<div style="animation-delay:${.4 + i * 1.6}s"><b>${k}</b><p>${esc(L.ideas[k])}</p><small>${L.films[k]} source films · longest stay with one film: ${L.runs[k].longest} ${L.runs[k].longest === 1 ? 'moment' : 'moments'}</small></div>`).join('')}</div>`
      + LX.band([[.3, 'Each film follows a recipe written before any shot was chosen. These four sentences are the whole difference between them.'], [10, 'Only Scenes stays with one film for more than a moment, because its recipe asks it to. The others obey the sieve: never the same film within three shots.']]), el => LX.runBand(el, K));
    B('How each lane moves', 14, () => `<div class="lanes">${TK.map((k, j) => { const lane = L.lanes[k]; let html = '', a = 0; for (let i = 1; i <= lane.length; i++) { if (i === lane.length || lane[i].src !== lane[a].src) { const l = lane[a].t0, r = lane[i - 1].t1; html += i - a > 1 ? `<i class="run" style="left:${fx(l)};width:calc(${fx(r)} - ${fx(l)});opacity:1"></i>` : `<i style="left:${fx(l)};opacity:1"></i>`; a = i; } } return `<div class="lane" style="top:${j * 140}px"><b>${k}</b><div class="ln"></div>${html}</div>`; }).join('')}</div>`
      + LX.band([[.3, 'Draw each stay with one source film as a thick stroke.'], [5.5, 'Only the Scenes lane thickens: one old film answering a line, two or three shots at a time.']]), el => LX.runBand(el, K));

    /* THE LOOM */
    const W0 = Math.max(0, Math.min(n - 6, O.i - 2)), win = [...Array(6).keys()].map(k => W0 + k);
    B('The loom', 17, () => `<div class="loom"><div class="row" style="animation-delay:.2s"><span></span>${win.map(i => `<div class="hd">${esc((L.lanes.suite[i].why && L.lanes.suite[i].t0 != null) ? `${Math.floor(L.lanes.suite[i].t0 / 60)}:${String(Math.floor(L.lanes.suite[i].t0 % 60)).padStart(2, '0')}` : '')}</div>`).join('')}</div>${TK.map((k, j) => `<div class="row" style="animation-delay:${.6 + j * .8}s"><b>${k}</b>${win.map(i => { const x = L.lanes[k][i]; return x.hide ? '<div style="aspect-ratio:4/3;background:#15130f"></div>' : `<img src="${esc(x.thumb)}" alt="" title="${esc(x.title)}">`; }).join('')}</div>`).join('')}</div>`
      + LX.band([[.3, 'Six moments around our line, four films. Read down a column: one moment, four answers.'], [8.5, 'Read along a row: one recipe, carrying on. A film is a row. A comparison is a column.']]), el => LX.runBand(el, K));

    /* NOW YOU CAN READ */
    B('Now you can read', 13, () => lanesHTML() + LX.band([[.3, 'Now you can read versions on one clock: rows are films, columns are moments, dots are cuts.'], [7, 'A wink where two films meet. Here, almost never: four rules, four films that hardly touch.']]),
      el => { LX.runBand(el, K); el.querySelectorAll('.lane i').forEach(i => i.style.opacity = 1); });
    B('Now you can read', 9, () => `<div class="tc"><small>WATCH THE FOUR</small><h1>Suite · Scenes · Cineosis · Drift</h1><p>Each one is in the films menu, under One poem, four cuts.</p></div>`, el => LX.ping());
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
