<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions on One Clock · Lesson 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=3"><link rel="stylesheet" href="explain/episode.css?v=3"><link rel="stylesheet" href="explain/lesson.css?v=3">
<!-- CINEOSIS · LESSON 9 · VERSIONS ON ONE CLOCK. Four takes of the WYGWYL suite, shown as what they are: moving pictures cut to one
     clock. One line and its four shots; the four takes as film strips running on the same clock until two of them land on the same
     shot; the four times that happens (all Suite and Cineosis); the shots each pair shares anywhere in the film; the one take that
     stays inside a film; and six lines as a loom of 24 loops. The guide is Bolas on the red thread (explain/guide.js): it blinks at
     every cut and winks where two takes meet. Data: explain/l9.py -> l9.json; media: explain/lesson_media.py -> l9m.json. -->
<style>
:root { --bg: #0b0a09; --ink: #ece6da; }
body, #stage { background: var(--bg); }
.t { position: absolute; margin: 0; opacity: 0; transform: translateY(10px); animation: up .6s ease forwards; transition: opacity .6s; }
.t .v { width: 100%; aspect-ratio: 4/3; background: #000; overflow: hidden; outline: 4px solid transparent; outline-offset: 5px; transition: outline-color .5s; }
.t video { width: 100%; height: 100%; object-fit: cover; display: block; }
.t figcaption { font: 14px/1.3 var(--mono); color: var(--dim); margin-top: 9px; }
.t figcaption b { display: block; font: 600 24px/1.2 var(--serif); color: var(--ink); margin-bottom: 4px; }
.t.yes .v { outline-color: var(--lime); } .t.dim { opacity: .16 !important; }
.lab { position: absolute; left: 40px; width: 170px; font: 600 24px/1.1 var(--serif); color: var(--ink); opacity: 0; animation: fade .6s ease forwards; }
.lab small { display: block; font: 13px/1.3 var(--mono); color: var(--dim); margin-top: 6px; font-weight: 400; }
.lane { position: absolute; left: 230px; width: 1330px; height: 96px; overflow: hidden; }
.lane div { position: absolute; left: 0; top: 0; display: flex; gap: 6px; will-change: transform; }
.lane i { flex: none; width: 112px; height: 84px; background: #1d1a17 center/cover no-repeat; outline: 3px solid transparent; outline-offset: -3px; transition: outline-color .5s; }
.lane i.meet { outline-color: var(--lime); }
.pr { position: absolute; left: 40px; right: 40px; display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: center; opacity: 0; animation: up .6s ease forwards; }
.pr .pw { font: 600 22px/1.2 var(--serif); color: var(--ink); } .pr .pw small { display: block; font: 600 30px var(--mono); color: var(--gold); margin-top: 4px; }
.pr .pf { display: flex; gap: 6px; } .pr .pf i { flex: none; width: 96px; height: 72px; background: #1d1a17 center/cover no-repeat; opacity: 0; transition: opacity .4s; } .pr .pf i.in { opacity: 1; }
.col { position: absolute; top: 62px; width: 205px; font: 600 13px var(--mono); letter-spacing: .12em; color: var(--dim); text-align: center; transition: color .4s; } .col.on { color: var(--gold); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:#b3ab9e;margin:0 0 14px">CINEOSIS · LESSON 9</p><h1 style="font-weight:600;color:#ece6da">Versions on One Clock</h1><p>Four films of one poem, run side by side, and how rarely they meet. About two and a half minutes, with sound.</p><b style="background:#c4f46a">▶ Watch</b></div></div>
<script src="explain/lesson.js?v=3"></script>
<script src="explain/marks.js?v=1"></script>
<script src="explain/guide.js?v=1"></script>
<script>
window.EPISODE = {
  data: ['explain/lesson/l9.json?v=2', 'explain/lesson/l9m.json?v=1'],
  cues: ['dae-slide-carousel-at-blue-hour', 'dae-cold-current-paddle', 'dae-feather-rustle-dub', 'dae-salvaged-room-traveling-light'],
  build(D, B, K) {
    const L = D[0], M = D[1], esc = LX.esc, AU = 'wygwyl/WYGWYL_Suite_Audio.mp3', TK = L.takes, OP = L.open;
    const NAME = { suite: 'Suite', scenes: 'Scenes', cineosis: 'Cineosis', drift: 'Drift' };
    const IDEA = { suite: 'what the treatment asks of each beat', scenes: 'one film, its own shots in order', cineosis: 'the signs each line is read for', drift: 'each shot follows the one before' };
    const v = src => `<div class="v"><video muted loop playsinline preload="auto" data-src="${esc(src)}" data-t="0"></video></div>`;
    const tile = (x, y, w, src, cap = '', o = {}) => `<figure class="t ${o.cls || ''}" ${o.id ? `id="${o.id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;animation-delay:${o.d || 0}s">${src ? v(src) : '<div class="v"></div>'}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
    const at = (s, f) => K.later(s * 1000, f);
    const go = (el, f) => { K.startVideos(el); LX.runBand(el, K); f && f(el); };
    const bg = f => f.hide ? '' : `background-image:url(${esc(f.frame)})`;
    const lineNo = i => i + 1;

    /* COLD OPEN · one line, four shots */
    B('Cold open', 16, () => TK.map((k, j) => tile(40 + j * 385, 120, 365, M.open[k].hide ? null : M.open[k].loop, `<b>${NAME[k]}</b>${esc(IDEA[k])}`, { d: 1 + j * 1.2, id: 'o' + j })).join('')
      + LX.band([[.3, `<i>${esc(OP.line)}</i>`], [8, 'One line of the poem. Four takes, four different shots for it.']], `The poem, line ${lineNo(OP.i)}`),
      el => go(el, () => { LX.poem(K, AU, OP.t0, OP.t1); const g = GUIDE(el, K, { x: 222, y: -100, r: 26 }); at(.4, () => g.to(222, 64, 26, 1).look(0, 1));
        TK.forEach((_, j) => at(1 + j * 1.2, () => { g.to(222 + j * 385, 64, 26, .6); g.blink(); LX.tick(600, .08, .03); })); }));
    B('Cold open', 7, () => `<div class="tc"><small>CINEOSIS · LESSON 9</small><h1>Versions on One Clock</h1><p>Four films of one poem, and how rarely they meet.</p></div>`, () => LX.ping());

    /* ONE CLOCK · four strips of real frames, moving together, until two land on the same shot */
    const M0 = M.meet[0], STEP = 118, PH = 800;
    const lanesHTML = () => TK.map((k, j) => `<div class="lab" style="top:${150 + j * 140}px;animation-delay:${j * .2}s">${NAME[k]}<small>${esc(IDEA[k])}</small></div><div class="lane" style="top:${140 + j * 140}px"><div>${M.lanes[k].map((f, i) => `<i data-i="${i}" style="${bg(f)}"></i>`).join('')}</div></div>`).join('');
    B('One clock', 21, () => lanesHTML() + LX.band([[.3, 'Every take is cut to the same clock: the same 169 lines, the same seconds.'], [6.5, 'Each frame is one line. Each step is a cut, in all four films at once.'], [15, `Line ${lineNo(M0.i)}. For once, two takes land on the same shot.`]]),
      el => go(el, () => { const ss = [...el.querySelectorAll('.lane > div')], g = GUIDE(el, K, { x: PH, y: -100, r: 24 }); at(.3, () => g.to(PH, 90, 24, 1).look(0, 1)); let last = -1;
        const place = p => ss.forEach(s => s.style.transform = `translateX(${PH - 230 - p * STEP - 56}px)`); place(-6);
        K.raf(t => { const k = Math.min(1, Math.max(0, (t - 1.5) / 13)), p = -6 + (M0.i + 6) * (1 - Math.pow(1 - k, 2)); place(p); const c = Math.round(p);
          if (c !== last && c >= 0) { last = c; g.blink(); LX.tick(520, .06, .025); } return k < 1; });
        at(15, () => { M0.takes.forEach(k => el.querySelectorAll('.lane')[TK.indexOf(k)].querySelector(`i[data-i="${M0.i}"]`).classList.add('meet')); g.wink(2); LX.ping(); }); }));

    /* THE MEETINGS · the only four times two takes choose the same shot for the same line */
    B('Meeting', 18, () => M.meet.map((m, j) => tile(40 + j * 385, 110, 365, m.shot.hide ? null : m.shot.loop, `<b>line ${lineNo(m.i)}</b>${m.takes.map(k => NAME[k]).join(' and ')}<br>${esc((m.shot.title || '').slice(0, 38))}`, { d: .8 + j * 1.6, cls: 'yes' })).join('')
      + LX.band([[.3, `In ${L.n} lines, two takes choose the same shot for the same moment ${M.meet.length} times.`], [8, 'Every time it is Suite and Cineosis. Both work from the suite\'s notes for each beat.'], [13.5, 'Scenes and Drift never meet another take at the same moment.']]),
      el => go(el, () => { const g = GUIDE(el, K, { x: 222, y: -100, r: 24 }); M.meet.forEach((_, j) => at(.8 + j * 1.6, () => { g.to(222 + j * 385, 56, 24, .6); g.wink(.9); LX.tick(990, .3, .03); })); }));

    /* SHARED · the same shot used by two takes anywhere in the film */
    const fs = Object.fromEntries(TK.map(k => [k, M.lanes[k].filter(f => !f.hide).map(f => f.frame)]));
    const pairs = []; TK.forEach((a, i) => TK.slice(i + 1).forEach(b => { const s = [...new Set(fs[a])].filter(f => fs[b].includes(f)); pairs.push([a, b, s]); }));
    pairs.sort((p, q) => q[2].length - p[2].length);
    B('Shared', 17, () => pairs.map(([a, b, s], j) => `<div class="pr" style="top:${50 + j * 112}px;animation-delay:${.3 + j * .4}s"><div class="pw">${NAME[a]} and ${NAME[b]}<small>${L.shared[TK.indexOf(a)][TK.indexOf(b)]}</small></div><div class="pf">${s.slice(0, 12).map(f => `<i style="background-image:url(${esc(f)})"></i>`).join('')}</div></div>`).join('')
      + LX.band([[.3, 'Anywhere in the film, at any moment, pairs of takes share a few more shots.'], [7, `Out of ${L.n} shots each, the most any two share is <b>${Math.max(...pairs.map(p => L.shared[TK.indexOf(p[0])][TK.indexOf(p[1])]))}</b>.`], [12, 'Four rules, four films that hardly touch.']]),
      el => go(el, () => el.querySelectorAll('.pr').forEach((p, j) => p.querySelectorAll('.pf i').forEach((i, k) => at(.6 + j * .4 + k * .12, () => { i.classList.add('in'); if (k % 3 === 0) LX.tick(1300, .04, .015); })))));

    /* STAYING · the one take that keeps to one film */
    const si = M.stay_i;
    B('Staying', 17, () => TK.map((k, j) => `<div class="lab" style="top:${62 + j * 172}px">${NAME[k]}</div>` + M.stay[k].map((x, c) => tile(230 + c * 330, 40 + j * 172, 196, x.hide ? null : x.loop, '', { d: .3 + c * .5, cls: k === 'scenes' ? 'yes' : '' }) + `<div class="lab" style="left:${440 + c * 330}px;top:${62 + j * 172}px;width:110px;font:14px/1.3 var(--mono);color:var(--dim)">${esc((x.title || '').slice(0, 34))}</div>`).join('')).join('')
      + LX.band([[.3, `Lines ${lineNo(si)} to ${lineNo(si + 2)}, in all four takes.`], [5, 'Scenes stays inside one film: three lines, three shots from the same reel, in its order.'], [11.5, 'The others jump to a new film at every cut. Scenes stays about two lines on average, never more than three.']]),
      el => go(el, () => { const g = GUIDE(el, K, { x: 205, y: -100, r: 20 }); at(5, () => { g.to(205, 40 + 172 + 120, 20, 1); g.wink(2); LX.ping(); }); }));

    /* THE LOOM · six lines across, four takes down, all moving */
    const W0 = M.W0, ln = L.lanes.suite, t0 = ln[W0].t0, t1 = ln[W0 + 5].t1, span = t1 - t0, dur = Math.ceil(Math.min(30, span) + 4);
    B('The loom', dur, () => [...Array(6).keys()].map(c => `<div class="col" id="c${c}" style="left:${230 + c * 222}px">LINE ${lineNo(W0 + c)}</div>`).join('')
      + TK.map((k, j) => `<div class="lab" style="top:${110 + j * 168}px">${NAME[k]}</div>` + M.loom[k].map((x, c) => tile(230 + c * 222, 90 + j * 168, 205, x.hide ? null : x.loop, '', { d: .2 + c * .15 + j * .1, cls: 'c' + c })).join('')).join('')
      + LX.band([[.3, 'Six lines in a row, four takes: a loom.'], [Math.min(9, dur * .35), 'Down a column, one moment four ways. Across a row, one take\'s way of cutting.'], [Math.min(dur - 6, dur * .7), `Line ${lineNo(OP.i)} again. Suite and Drift reach the same film here, for different shots.`]]),
      el => go(el, () => { LX.poem(K, AU, t0, t1); const g = GUIDE(el, K, { x: 332, y: -100, r: 20 });
        [...Array(6).keys()].forEach(c => at(Math.max(0, ln[W0 + c].t0 - t0) + .3, () => { el.querySelectorAll('.t').forEach(t => t.classList.toggle('dim', !t.classList.contains('c' + c))); el.querySelectorAll('.col').forEach((e, i) => e.classList.toggle('on', i === c)); g.to(332 + c * 222, 34, 20, .6); g.blink(); }));
        at(span + .6, () => { el.querySelectorAll('.t').forEach(t => t.classList.remove('dim')); el.querySelectorAll('.col').forEach(e => e.classList.remove('on')); g.wink(1.4); }); }));

    /* END */
    B('End', 9, () => TK.map((k, j) => tile(40 + j * 385, 110, 365, M.open[k].hide ? null : M.open[k].loop, `<b>${NAME[k]}</b>`, { d: j * .3 })).join('')
      + LX.band([[.3, 'Four rules. Four films of one poem, on one clock, that hardly touch.'], [5, 'Watch them whole under <b>One poem, four cuts</b>.']]),
      el => go(el, () => { const g = GUIDE(el, K, { x: 800, y: -100, r: 26 }); at(.5, () => g.to(800, 56, 26, 1.2)); at(3, () => g.wink(1.5)); }));
    B('End', 8, () => `<div class="tc"><small>NEXT · ROOM 1</small><h1>When the Tracks Agree</h1><p>The rare moments separate rules line up.</p></div>`, () => LX.ping());
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
