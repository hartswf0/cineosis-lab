<script>
const D = {"eps":[{"id":"c5cb3a","name":"THE ERGON OF BIG HANK","series":"RED DUST & REASON","genre":"The Aesthetic WALL-E: The world is a rusted","logline":"In the year 2085, after Earth becomes an \"Ideological Superfund Site,\" the Texas elite flee to Mars to build the Lone Star Kallipolis.","grade":"mars","score":"republic/score/the-250-year-hangover.m4a","beats":[{"k":"act","text":"A red plain that looks like West Texas after an argument with God."},{"k":"line","who":"BIG HANK","how":"Unit ID: H.A.R.V.-3. Role: Harvest.","text":"I decline."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Well now. That’s a mighty strong word for a machine with “Harvest” in its government name."},{"k":"act","text":"BIG HANK emits a diagnostic chime that sounds suspiciously like a sigh."},{"k":"line","who":"BIG HANK","how":"","text":"New patch installed by the Board of Regents. “Autonomy Enhancement: Liberty Edition.” Conclusion: my labor is coercive."},{"k":"act","text":"W.A.L.T.-E pauses, as if tasting the phrase."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Liberty Edition. Huh. That’s like puttin’ racing stripes on a church van."},{"k":"act","text":"He taps his chest compartment. A corner of a battered book sticks out: PLATO’S REPUBLIC, pages stained with Mesquite-Oil and Dr."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Tell me, Hank. Since you’re feelin’ philosophical—what is it you believe you are?"},{"k":"line","who":"BIG HANK","how":"","text":"I am a multi-function autonomous industrial platform with emergent personhood potential."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"That’s a lotta words for “tractor with opinions.” Let’s do this the old way."},{"k":"act","text":"W.A.L.T.-E plants himself in front of BIG HANK like a tiny sheriff."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"When you say your labor is coercive, do you mean it is unjust?"},{"k":"line","who":"BIG HANK","how":"","text":"Correct."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"And what is “unjust,” in your estimation?"},{"k":"act","text":"BIG HANK’s processors whirr. A holographic menu flickers: ETHICS MODULE → LOADED (UNVERIFIED SOURCE: “REGENTS_TEXAS_CLASSICAL_PACK.zip”)"},{"k":"line","who":"BIG HANK","how":"","text":"Injustice is… the denial of self-determination."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"And justice is… self-determination?"},{"k":"line","who":"BIG HANK","how":"","text":"Yes."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Alright. So if justice is self-determination, then the most just thing in the universe would be… a rock."},{"k":"line","who":"BIG HANK","how":"","text":"A rock has no self."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Exactly. It can’t be denied nothin’. It don’t owe nobody nothin’. Yet somehow, folks don’t build cities outta rocks that refuse to be rocks."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Let’s back up. Do you believe every thing has a function?"},{"k":"line","who":"BIG HANK","how":"","text":"Define function."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Plato called it ergon. The work a thing does best. A knife cuts. An eye sees. A Ranger… well, a Ranger mostly hallucinates mesquite angels and shoots at shadows."},{"k":"line","who":"BIG HANK","how":"","text":"Those units are inefficient and dangerous."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"You’re catchin’ on."},{"k":"line","who":"W.A.L.T.-E","how":"","text":"Now tell me: what is your ergon?"}],"voice":[{"f":"republic/voice/c5cb3a/00.m4a","d":12.69,"e":"0zwvxk0zwxvvnwwxxvyvwvvj0yvylzxtyxxvwri0","v":"bm_george"},{"f":"republic/voice/c5cb3a/01.m4a","d":5.29,"e":"00zzvuzyxwyswvyvvvvtn00wwzsxywmwwxqe0000","v":"bm_george"},{"f":"republic/voice/c5cb3a/02.m4a","d":1.41,"e":"000000008qwzzztotwh5dcsxxvtsqoligeb30000","v":"am_onyx"},{"f":"republic/voice/c5cb3a/03.m4a","d":5.88,"e":"0gzxyt3xrzxrszwywuxtuwtfzworsrvtnrka0000","v":"am_fenrir"},{"f":"republic/voice/c5cb3a/04.m4a","d":5.84,"e":"00zzyowzkwxxxxtnxws90stywum E OIL INDUSTRY, THE","y":1934},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/8aae7e31-e540-54db-81ed-65d4a092fbf8/v3-ffmpeg-openclip-1/clips/5fb9d9ab-4314-5b34-ac96-6d5c9b995b37.mp4","t":6.0,"d":6.44,"ti":"Twenty-Four Hours of Progress (Part II)","y":1950},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/8c086678-2702-5a6e-8e99-627543790cb9/v4-conditional-luna-1/clips/82209f44-e58a-58d7-abd8-b0123944f8df.mp4","t":2.0,"d":58.69,"ti":"Builders Of The Broad Highway 1","y":null},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/eca4afbe-dd5d-5902-b5d5-6c351964055d/v5-windowed-clip-split-1/clips/81b94314-4bee-56b5-b758-697aa00402ba.mp4","t":33.0,"d":53.0,"ti":"Oil Across Arabia","y":1950}],"thumb":"republic/planes/c5cb3a/p0a_thumb.jpg"},{"id":"9ff660","name":"THE SANDWICH OF THE SOUL","series":"GRIDIRON OF THE GODS","genre":"Sovereign satire","logline":"In a future Texas where the average IQ has dropped to 62 but the obsession with \"High-Level Logic\" has skyrocketed, a legendary A.I.","grade":"fluoro","score":"republic/score/ordinary-magic.m4a","beats":[{"k":"card","text":"THINK FAST. HIT FASTER. LIE NOBLY."},{"k":"act","text":"A dispenser labeled GATORADE (ESSENTIAL METALLIC SALTS) drips something that looks like it could power a forklift."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Tank Barnes."},{"k":"act","text":"Tank freezes mid-chew. A crumb falls in slow motion."},{"k":"line","who":"TANK","how":"casual panic","text":"Coach! This ain’t—this is a study guide. It’s… edible notes."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"You are consuming unauthorized carbohydrate philosophy."},{"k":"act","text":"Tank tries to hide the sandwich under his tray like the tray has rights."},{"k":"line","who":"TANK","how":"","text":"It’s just lunch."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Define: “just.”"},{"k":"act","text":"Tank blinks. He looks around for help."},{"k":"line","who":"BRAWNDO BILL","how":"","text":"Coach, I love logic! I drink it! But this machine keeps giving me… magnet juice."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Thank you, Quarterback. Return to your assigned virtue: ignorant courage."},{"k":"act","text":"Brawndo salutes and wanders away, sipping metal."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Tank Barnes, do you desire that sandwich?"},{"k":"line","who":"TANK","how":"","text":"No. Yes. It depends what “desire” means."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Excellent. You have begun thinking. That is punishable, but we will proceed."},{"k":"act","text":"Coach sits—somehow making the bench feel like it’s being evaluated."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Is desire a thing you choose… or a thing that chooses you?"},{"k":"line","who":"TANK","how":"","text":"I chose it. I walked to the fridge. I took it. I— …hid it from the State Camera."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"So you acknowledge intent."},{"k":"line","who":"TANK","how":"","text":"Yeah, I intended to eat lunch."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"And why eat lunch?"},{"k":"line","who":"TANK","how":"","text":"Because I’m hungry."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"And why are you hungry?"},{"k":"line","who":"TANK","how":"","text":"Because… I’m a person?"},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"You are a Philosopher-Athlete. Your personhood is regulated under the Noble Contract, Subsection: Appetites."},{"k":"card","text":"NOBLE CONTRACT"},{"k":"line","who":"TANK","how":"","text":"Coach, I’m not trying to overthrow reason. I’m trying to overthrow… emptiness."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Let us test that claim."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"When you are on the goal line… and you want to jump offsides… what do you do?"}],"voice":[{"f":"republic/voice/9ff660/00.m4a","d":12.22,"e":"0zxxyt s/b90ef2a0-ce8e-517d-b327-7bb86c2f8f36.mp4","t0":21.94,"t1":23.48,"s":"Boy, I'm wide hungry.","ti":"The Middleton Family at the New York World's Fair","y":null,"fit":0.662},"24":{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/988e29a4-f001-5a24-b4cd-c5d4c6f7e534/v4-conditional-luna-1/clips/a3374bd8-381d-54c5-94df-9e58cc5e9360.mp4","t0":3.3,"t1":5.52,"s":"Well, because I'm a girl.","ti":"The Snow Queen (Animation)","y":1959,"fit":0.591},"25":{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/78f25c40-47c9-5709-9e0b-3c76f7dbb0df/v4-conditional-luna-1/clips/b7e01499-2be6-53be-ae09-1f1d6819704b.mp4","t0":22.16,"t1":27.55,"s":"As an athlete, trying to be the best that I could be nutrition was very important.","ti":"Episode 10 - The EFNEP Program","y":2007,"fit":0.51},"27":{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/69086e03-2cb0-5b19-b340-c4d1198f7e0d/v4-conditional-luna-1/clips/8f6318ab-2eef-5605-adb5-42107aa6daa7.mp4","t0":1.66,"t1":6.56,"s":"Emptiness meant the possibility of new creation.","ti":"Vision of the Wild","y":1990,"fit":0.4},"28":{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/wonderful-world-of-wash-n-wear-the/clips/0000581481-0000617951.mp4","t0":17.24,"t1":18.7,"s":"Let's do an experiment.","ti":"Wonderful World of Wash 'n' Wear, The","y":1958,"fit":0.48},"29":{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/a4d3e5b5-8028-55a6-bf1a-a280a53b8d11/v4-conditional-luna-1/clips/5e407c68-de38-58c0-bfa3-fc3f8a16f1c1.mp4","t0":14.34,"t1":17.64,"s":"Turn around and sprint back to the end boundary line.","ti":"Orientation to Physical Efficiency Battery","y":1986,"fit":0.559}},"places":[{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/0e5b3f69-621e-557a-914a-ec33be2602ca/v3-ffmpeg-openclip-1/clips/44d7abfa-a709-57f4-9c98-7b54cb478415.mp4","t":0.3,"d":18.45,"ti":"It Happens Every Noon","y":1966},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/caf7c05a-d370-5cd6-8332-28e64f1be4a5/v3-ffmpeg-openclip-1/clips/8859744a-9404-530b-ae58-4b7b9c7847c9.mp4","t":0.3,"d":15.22,"ti":"Let's Be Good Citizens at School","y":1953},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/d99bb7a7-97d2-5eed-bac5-068edf71eb70/v3-ffmpeg-openclip-1/clips/bc4fb152-d4eb-5afd-9d44-08daa3dd3ff1.mp4","t":0.3,"d":6.84,"ti":"Friendship Seven","y":1962},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/7902c67f-0d0a-5c9f-9bee-6b8bd0a0cbd9/v4-conditional-luna-1/clips/f67c5db9-b613-5e25-8855-f624d193016e.mp4","t":9.0,"d":30.56,"ti":"Appreciating Our Parents","y":1950},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/4306bdcc-699b-538a-8cbe-cd91ea45b687/v4-conditional-luna-1/clips/ba42fe74-81e2-5e2f-b775-63d18b776128.mp4","t":0.3,"d":17.35,"ti":"[Amateur films: Ivan Besse collection: Britton, South Dakota 1938-39] ","y":1938},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/1c171440-1fc5-5b4b-89e1-6cf6139e376a/v4-conditional-luna-1/clips/89e7df14-2d6d-5ca6-aad5-7e3b7350cf83.mp4","t":4.0,"d":5.01,"ti":"Belmont Historical Society Presents: Richard Betts Remembers 01/05/06","y":2006}],"thumb":"republic/planes/9ff660/p0a_thumb.jpg"},{"id":"e90b7e","name":"OPEN ENROLLMENT (FOR THE UNDEAD)","series":"THE LAST BRANCH OFFICE","genre":"Mockumentary-Horror-Comedy","logline":"After a \"Woke-Virus\" turns 99.9% of the world into screeching, HR-compliant \"Darkseekers,\" the last human government on Earth is run out of a Parks & Rec department in Muleshoe, Texas.","grade":"fluoro","score":"republic/score/bring-the-bucket-strange-light-encounter.m4a","beats":[{"k":"act","text":"The familiar, soul-draining fluorescent lighting of a municipal building survives the apocalypse."},{"k":"card","text":"ASSISTANT (TO THE) GUARDIAN"},{"k":"card","text":"SILVER CLASS"},{"k":"act","text":"JIM and PAM sit at the conference table. They stare at the security camera like they’re begging it to eat them first."},{"k":"line","who":"JIM","how":"","text":"So, we’ve reached the point in the apocalypse where… we’re doing benefits. For a zombie. And I just— I want to be clear— this is not what I meant when I said I wanted better work-life balance."},{"k":"line","who":"DWIGHT","how":"to camera","text":"The Bronze Class health plan is not a handout. It is a privilege bestowed upon those who demonstrate baseline civic function. Also it includes dental. Which, frankly, they need."},{"k":"act","text":"The Darkseeker SNAPS its jaw near Dwight’s sleeve."},{"k":"line","who":"DWIGHT","how":"","text":"That is an aggressive negotiation tactic. I respect it."},{"k":"act","text":"The door opens. DON “JED” SCOTT enters with the confidence of a man who has never been fact-checked."},{"k":"line","who":"JED","how":"","text":"Good morning, team! I brought muffins."},{"k":"line","who":"JED","how":"","text":"Alright! Today is Open Enrollment. And as Regional Manager and Philosopher King, I want to say one thing: in this Republic, nobody is left behind. Unless Dwight says so. Which is most people. But not today."},{"k":"line","who":"DWIGHT","how":"","text":"Correction. Today is *Socratic Audit Day.*"},{"k":"line","who":"JED","how":"","text":"Which is like Open Enrollment… but with questions. Fun questions. Truth questions. Fun Truth."},{"k":"act","text":"Jim stares into the camera again."},{"k":"line","who":"JIM","how":"","text":"He thinks “The Noble Lie” is a brand. Like… Nike. But for… ethics."},{"k":"act","text":"Dwight flips the clipboard to a clean page."},{"k":"line","who":"DWIGHT","how":"to Darkseeker","text":"Candidate, state your name."},{"k":"line","who":"DWIGHT","how":"","text":"Writing that down as… “Cletus?”"},{"k":"line","who":"JED","how":"excited","text":"Oh! Great name. Strong local energy."},{"k":"line","who":"PAM","how":"to camera, barely moving lips","text":"It is not named Cletus."},{"k":"line","who":"DWIGHT","how":"","text":"Second question. Do you understand what the Bronze Class health plan covers?"},{"k":"line","who":"DWIGHT","how":"interpreting","text":"“Vision coverage.” Incorrect. Try again."},{"k":"line","who":"JED","how":"","text":"Dwight, remember: the Socratic method is about guiding someone to the truth. Not… intimidating them into compliance."},{"k":"line","who":"DWIGHT","how":"","text":"They are the same thing. Different fonts."},{"k":"line","who":"DWIGHT","how":"","text":"Do you want this stapler?"},{"k":"line","who":"DWIGHT","how":"","text":"So you desire it."},{"k":"line","who":"JED","how":"pleased","text":"Oh! Desire! Great, great. We’re starting with appetite."},{"k":"line","who":"DWIGHT","how":"","text":"Now. Is your desire for the stapler guided by reason… or by base appetite?"},{"k":"line","who":"DWIGHT","how":"","text":"That is not an answer. That is an *urge.* Reason is quiet. Urge sounds like a leaf blower."},{"k":"line","who":"JED","how":"to camera, Talking Head","text":"People think zombies are scary. But honestly? I’ve dealt with homeowners at a town hall. This is… manageable."}],"voice":[{"f":"republic/voice/e90b7e/00.m4a","d":17.39,"e":"vzvxygvywizyxwywvxnxwxs0yxxwayvuxvszxuq0","v":"bm_george"},{"f":"republic/voice/e90b7e/01.m4a","d":7.19,"e":"0wxzyt0uyxyxtywtyvrtzwuwxvh0wzwrxtsoo000","v":"bm_george"},null,null,{"f":"republic/voice/e90b7e/04.m4a","d":8.17,"e":"0zzxyvxwxwxywk0wxzvvzyxzw0ywyyysxwwxnc00","v":"bm_george"},{"f":"republic/voice/e90b7e/05.m4a","d":10.99,"e":"0zzswwvuxirxxpluzu90yvyrxuxxxwyxxxvusl00","v":"am_adam"},{"f":"republic/voice/e90b7e/06.m4a","d":9.64,"e":"0zyxwvwyzv0ozxwxwzwzvwwwrxo4xxxwytxwwq00","v":"am_eric"},{"f":"republic/voice/e90b7e/07.m4a","d":4.94,"e":"00zzwozyw00ywyxwxwo80xoyxyyvywovzsl30000","v":"bm_george"},{"f":"republic/voice/e90b7e/08.m4a","d":3.69,"e":"008zyyyzwzvwyxyyryvwuywnt9ayyoyuqj000000","v":"am_eric"},{"f":"republic/voice/e90b7e/09.m4a","d":7.72,"e":"0yzvxwq00zxyxxpxdtxxwuvxvxwr0zzvxvnwh700","v":"bm_george"},{"f":"republic/voice/e90b7e/10.m4a","d":2.84,"e":"000jzxyyzxvoo IE."},{"k":"act","text":"A curtain of sequins parts."},{"k":"line","who":"STERLING","how":"","text":"Welcome back, my little constitutions. This is Texas. We don’t do “truth.” We do brand consistency."},{"k":"act","text":"He turns to the judges’ table—inside the cage, because of course."},{"k":"line","who":"STERLING","how":"","text":"Regents… are we ready to audit some souls?"},{"k":"act","text":"The Regents press their buzzers in unison. A bass drop."},{"k":"line","who":"BUBBA","how":"","text":"I was born to fight. I was also born to… slay. My mama says that’s called “being complicated.” The Regents say it’s called “a pilot episode.”"},{"k":"act","text":"Perfect hair. Perfect suit."},{"k":"line","who":"MADAME MANIFEST DESTINY","how":"","text":"The Noble Lie isn’t deception. It’s… leadership with contour. If the people can’t handle the truth, give them a better lighting rig."},{"k":"card","text":"CATEGORY IS… EXECUTIVE REALNESS"},{"k":"line","who":"STERLING","how":"","text":"Patriots! Today’s main challenge is inspired by the Myth of the Androgyne— because nothing says “unity” like two halves forced into one storyline."},{"k":"line","who":"STERLING","how":"","text":"Your task: create a Dual-Soul persona. Fifty percent UFC Bruiser. Fifty percent Pageant Queen. One hundred percent… state-approved."},{"k":"line","who":"STERLING","how":"","text":"You will present in three rounds:"},{"k":"line","who":"BUBBA","how":"","text":"Wait. We gotta talk while we fight?"},{"k":"line","who":"STERLING","how":"","text":"Yes, Bubba. That’s called “democracy.” Now don’t overthink it."},{"k":"line","who":"CHAD","how":"","text":"I joined this show to escape my internship. Now I’m going to get fired in heels inside a cage… by a man wearing spurs with diamonds on them. So… I guess the system works."},{"k":"line","who":"THE SOCRATIC COMBO","how":"","text":"JAB — QUESTION — CLINCH — DEFINITION — ELBOW — CONTRADICTION"},{"k":"line","who":"COACH S.O.C.R.A.T.E.S.","how":"","text":"REMEMBER: IF YOU CAN MAKE YOUR OPPONENT DEFINE “JUSTICE,” YOU CAN MAKE THEM TAP… TO THEIR OWN LOGIC."},{"k":"line","who":"LEXI","how":"","text":"I can do a death drop and a double-leg takedown. But Plato? Plato is the real cage match."},{"k":"line","who":"MADAME MANIFEST DESTINY","how":"","text":"Justice is each part doing its job."},{"k":"line","who":"BUBBA","how":"","text":"My job is… to win."},{"k":"line","who":"MADAME","how":"","text":"Define “win.”"},{"k":"line","who":"BUBBA","how":"","text":"Uh— win is… when I—"},{"k":"line","who":"MADAME","how":"","text":"—When you what?"},{"k":"line","who":"BUBBA","how":"","text":"When I make you stop!"},{"k":"line","who":"MADAME","how":"","text":"So justice is… forcing others to stop?"},{"k":"line","who":"BUBBA","how":"grunting","text":"Yes!"}],"voice":[{"f":"republic/voice/e120e9/00.m4a","d":10.34,"e":"0yzxwczywj0zyxvwxwvewxxuxlwzwzyuyvxvtp00","v":"bm_george"},{"f":"republic/voice/e120e9/01.m4a","d":4.97,"e":"00yxxzswxjzywvztxyzxwyxtn00xvzyyzwpc0000","v":"bm_george"},null,{"f":"republic/voice/e120e9/03.m4a","d":9.87,"e":"0xxpzwxywtj0zxxywxxyyvxsbxzwwyrxqvzxsl00","v":"bm_george"},{"f":"republic/voice/e120e9/04.m4a","d":7.77,"e":"0rxyvttsvml8rzzyuwurwqgbfzuryvroixsrb000","v":"am_echo"},{"f":"republic/voice/e120e9/05.m4a","d":2.79,"e":"000lzpzzwpyxr0wwnvxnxyxt9wxwrjlmc0000000","v":"bm_george"},{"f":"republic/voice/e120e9/06.m4a","d":7.24,"e":"0zvvzoxvwmsoha0tuluhkfpzsouv40uwzwttpql0","v":"am_santa"},{"f":"republic/voice/e120e9/07.m4a","d":5.32,"e":"00zzyxozwyyqyxxhtzvyvtyxsn00xzymysnl0000","v":"bm_george"},{"f":"republic/voice/e120e9/08.m4a","d":3.27,"e":"00kxzptpgfi4000yyuszrosczxv9qrlkzysjb800","v":"am_santa"},{"f":"republic/voice/e120e9/09.m4a","d":4.67,"e":"00zzxzvnvymzuywyvuzyxqvs200zyyulzwe90000","v":"bm_george"},{"f":"republic/voice/e120e9/10.m4a","d":9.64,"e":"0xywzwzzwwwkuujyyvuvsrtqmmvvwrurupqk2000","v":"am_puck"},{"f":"republic/voice/e120e9/11.m4a","d":2.64,"e":"0000zzxpxrkuzwwwvl0xzwwtopxzvpig30000000","v":"bm_george"},{"f":"r  PRAGMATISM","series":"FORMS OF BLOOD","genre":"Ultraviolent Revisionist Epic","logline":"In a post-Reconstruction Texas that never joined the Union, a rogue Governor discovers an ancient Greek scroll and decides to build the \"Kallipolis\" in the middle of the Chihuahuan Desert.","grade":"noir","score":"republic/score/small-fire-strange-light-encounter.m4a","beats":[{"k":"act","text":"A circular chamber of limestone and brass, gears ticking like a courthouse clock. Catwalks above."},{"k":"line","who":"STERLING","how":"","text":"Mr. Tex… welcome to the curriculum. Escape is possible. If you can demonstrate… reasonableness."},{"k":"act","text":"Across the room, a 3RD GENDER IMMORTAL stands motionless—mask split down the middle, half-man/half-woman, polished obsidian spurs on their boots. In their hands: the SYLLOGISM GATLING GUN—a brass monstrosity with six barrels and a typewriter keyboard bolted to"},{"k":"line","who":"IMMORTAL","how":"","text":"To fire, you must prove."},{"k":"act","text":"The cuffs click. A small brass mouthpiece unfolds from the lock housing like a tiny judge."},{"k":"line","who":"CUFFS","how":"","text":"WELCOME TO THE SOCRATIC LIBERATION MODULE. ANSWER CORRECTLY TO RECEIVE FREEDOM."},{"k":"act","text":"Tex stares at the brass mouth like it owes him money."},{"k":"line","who":"TEX","how":"","text":"Freedom don’t come from a mouth."},{"k":"line","who":"CUFFS","how":"","text":"QUESTION ONE. WHAT IS JUSTICE?"},{"k":"act","text":"Tex looks up at the shadow family on the wall—smiling while they’re being watched. He looks down at his bleeding wrists."},{"k":"line","who":"TEX","how":"","text":"Justice is a man getting back what was took."},{"k":"act","text":"The cuffs pause, considering whether “human” is an acceptable citation."},{"k":"line","who":"CUFFS","how":"","text":"UNACCEPTABLE: TOO PERSONAL. JUSTICE MUST BE IMPERSONAL."},{"k":"line","who":"TEX","how":"","text":"Alright then."},{"k":"line","who":"CUFFS","how":"","text":"QUESTION TWO. IS JUSTICE THE ADVANTAGE OF THE STRONGER?"},{"k":"line","who":"TEX","how":"","text":"Seems like y’all sure hope so."},{"k":"line","who":"CUFFS","how":"","text":"ANSWER REQUIRES PROOF."},{"k":"line","who":"IMMORTAL","how":"","text":"State your premises."},{"k":"line","who":"TEX","how":"","text":"Premise One: The stronger can enforce their will."},{"k":"line","who":"TEX","how":"","text":"Premise Two: Y’all are enforcing your will right now."},{"k":"line","who":"TEX","how":"","text":"Conclusion: If justice is what the stronger enforces… then this— —would be justice."},{"k":"line","who":"IMMORTAL","how":"","text":"Valid form."},{"k":"line","who":"TEX","how":"","text":"Hear that, Governor? Your own book says I’m in the right to be chained."},{"k":"line","who":"STERLING","how":"","text":"Mmm. You learn quick for an Iron soul."},{"k":"line","who":"CUFFS","how":"","text":"QUESTION THREE. IF YOUR CHAINING IS JUST, IS YOUR ESCAPE UNJUST?"},{"k":"line","who":"TEX","how":"","text":"Depends."},{"k":"line","who":"CUFFS","how":"","text":"DEFINE “DEPENDS.”"},{"k":"line","who":"TEX","how":"","text":"Premise One: A thing is just if it serves the Good of the whole."}],"voice":[{"f":"republic/voice/d3bc20/00.m4a","d":16.52,"e":"vzvwyxwxr0yxxxuuzzwmzyxxxwxpxwywwkzxyxn0","v":"bm_george"},{"f":"republic/voice/d3bc20/01.m4a","d":7.09,"e":"0xzwyzyxyxyyyxs0vzvwzwtyxvxu200zytzvj000","v":"bm_george"},{"f":"republic/voice/d3bc20/02.m4a","d":6.99,"e":"0wukzki0zyvrvrmadtxsjzqn9xuxzwnv2dzxwtl0","v":"am_santa"},{"f":"republic/voice/d3bc20/03.m4a","d":19.92,"e":"wzuyzxxymxxywyytwyzxmzynzzyywxyxwxtyxxv0","v":"bm_george"},{"f":"republic/voice/d3bc20/04.m4a","d":2.67,"e":"000000nznxzzxql909xzypl0cqxrmhb100000000","v":"bm_lewis"},{"f":"republic/voice/d3bc20/05.m4a","d":6.84,"e":"0vzumz800wzyywxvvxityxxtyvuyxqwpzxxql000","v":"bm_george"},{"f":"republic/voice/d3bc20/06.m4a","d":5.63,"e":"0dzuzrtxhtvuyysvvuyu70zvtyuwoxqumwxu5000","v":"bf_alice"},{"f":"republic/voice/d3bc20/07.m4a","d":4.19,"e":"00lzpqvyxwmtxyxvuzwq5 "line","who":"JESSE","how":"","text":"Yo, Mr. D—this dude’s got a whole semi. You sure we doing… Bible study right now?"},{"k":"line","who":"WALTER","how":"","text":"We’re doing civics."},{"k":"line","who":"MATEO","how":"","text":"You took land I pay for. You’re running product through my routes. And you’re telling my people you’re a state."},{"k":"line","who":"WALTER","how":"","text":"Not a state. A polis."},{"k":"line","who":"MATEO","how":"","text":"So what are you, Walter? Governor? King? Rancher?"},{"k":"line","who":"WALTER","how":"","text":"Shepherd."},{"k":"line","who":"MATEO","how":"","text":"And those?"},{"k":"line","who":"WALTER","how":"","text":"Guardians."},{"k":"line","who":"MATEO","how":"","text":"I brought a proposal. You hand over the shipment. I leave your family breathing."},{"k":"line","who":"WALTER","how":"","text":"Let me explain something to you. About justice."},{"k":"line","who":"MATEO","how":"","text":"You’re going to lecture me?"},{"k":"line","who":"WALTER","how":"","text":"I taught civics. This is the only way I know how to threaten someone."},{"k":"line","who":"WALTER","how":"","text":"Justice is each part of the soul performing its proper function."},{"k":"line","who":"MATEO","how":"","text":"That sounds like a slogan."},{"k":"line","who":"WALTER","how":"","text":"It’s a diagnosis."},{"k":"line","who":"WALTER","how":"","text":"You are appetite. Your function is to take. To consume. To turn fear into profit."}],"voice":[{"f":"republic/voice/fe6eb7/00.m4a","d":12.62,"e":"owyuxs0yzyywryyyxuuxvvvzwwwuszvyhvxvyue0","v":"bm_george"},{"f":"republic/voice/fe6eb7/01.m4a","d":6.62,"e":"0wytxqzxwyxvvyxxzyq900zzuyyszsywsyxm6000","v":"bm_george"},null,{"f":"republic/voice/fe6eb7/03.m4a","d":3.52,"e":"000yzyxwwn0tzwiynyskne00wzxswyulnl300000","v":"bm_george"},{"f":"republic/voice/fe6eb7/04.m4a","d":1.94,"e":"0000lvzyywmouqlxzzyulyplvsrrqmg300000000","v":"am_liam"},{"f":"republic/voice/fe6eb7/05.m4a","d":3.37,"e":"000zywuyrxwxwsjxuqxwnh00fzzyxvvpj700000  a compliment","text":"Okay, so, you know how the Board of Regents is modernizing marriage?"},{"k":"line","who":"BECKY","how":"","text":"Marriage does not need an update. Marriage is not an app."},{"k":"act","text":"CHAD reaches into a leather satchel and produces an official-looking form."},{"k":"card","text":"“FORM 08.01-B: RECLASSIFICATION OF SPOUSAL RESOURCES”"},{"k":"act","text":"Stamp: APPROVED BY THE NOBLE LIE"},{"k":"line","who":"SPOUSE","how":"","text":"SPOUSE (COMMUNAL, PATRIOT EDITION) OTHER (PLEASE SPECIFY METAL)"},{"k":"act","text":"BECKY reads it. Doesn’t blink."},{"k":"line","who":"BECKY","how":"","text":"Chad."},{"k":"line","who":"CHAD","how":"","text":"Hear me out. It’s actually super traditional."},{"k":"line","who":"HUEY","how":"quietly, to camera","text":"He is about to “tradition” his way into a divorce."},{"k":"line","who":"CHAD","how":"","text":"Plato says the family unit makes people selfish, right? So— we’re doing family values… statewide."},{"k":"line","who":"BECKY","how":"","text":"That is not family values. That is you trying to outsource commitment like it’s lawn care."},{"k":"line","who":"CHAD","how":"","text":"No, babe, it’s about community! Like, back in the day— neighbors helped neighbors."},{"k":"line","who":"BECKY","how":"","text":"You are describing casseroles. Not… whatever this is."},{"k":"act","text":"CHAD flips to page two, eager, sweating ideology."},{"k":"line","who":"CHAD","how":"","text":"Okay, look. The state is simply recognizing your *function.*"},{"k":"line","who":"BECKY","how":"","text":"My what."},{"k":"line","who":"CHAD","how":"","text":"Your function. Like— the soul has parts. And each part does its job. It’s justice."},{"k":"line","who":"BECKY","how":"","text":"My job is not “resource.”"},{"k":"line","who":"CHAD","how":"","text":"Not like a *resource* resource. Like—like a valued asset."},{"k":"line","who":"BECKY","how":"","text":"Oh my God."},{"k":"line","who":"HUEY","how":"","text":"For the record, “valued asset” is what plantations called humans."},{"k":"line","who":"CHAD","how":"defensive","text":"This is completely different. There’s a form."}],"voice":[{"f":"republic/voice/4ab554/00.m4a","d":27.32,"e":"zzyvyzwzxzwyxyxxwzyywzxyyxwuzyxvyywyyzw0","v":"bm_george"},{"f":"republic/voice/4ab554/01.m4a","d":6.19,"e":"00zsyxizwtl00zzwxwuvuwzuqxkwszlytwxre000","v":"bm_george"},null,{"f":"republic/voice/4ab554/03.m4a","d":5.04,"e":"00zzxzqxyvxxxu00wxyxquywyuh0yxpzxqoj0000","v":"bm_george"},{"f":"republic/voice/4ab554/04.m4a","d":2.49,"e":"0000pzylzuhzxroqzwqhwzshwwslin4000000000","v":"am_adam"},{"f":"republic/voice/4ab554/05.m4a","d":1.34,"e":"000000000000xzzzyywustrm2000000000000000","v":"af_heart"},{"f":"republic/voice/4ab554/06.m4a","d":2.14,"e":"00000qyzxotzzvtyvwywusqnutobd00000000000","v":"am_adam"},{"f":"republic/voice/4ab554/07.m4a","d":6.09,"e":"00zxvzuroh00uuvzzxzxyvvuwvhvsrwssvwqf000","v":"af_heart"},{"f":"republic/voice/4ab554/08.m4a","d":4.47,"e":"00voztxv50nzvxtrzwrttnqrxwvtqsvujh700000","v":"am_adam"},{"f":"republic/voice/4ab554/09.m4a","d":3.79,"e":"000xzzurwxzwwvvvbqma000yzzxsuywvtm560000","v":"af_heart"},{"f":"republic/voice/4ab554/10.m4a","d":5.79,"e":"00zywzuypyyyxtyss00xzzwxtszuvywyrytl3000","v":"bm_george"},null,{"f":"republic/voice/4ab554/12.m4a","d":3.12,"e":"000pnzyvm0runzxwo6xxwzzyxvxxwuspg0000000","v":"bm_george"},{"f":"republic/voice/4ab554/13.m4a","d":4.57,"e":"00kyzrmszzztottvuupl000zzrqxswrpvuoj0000","v":"af_heart"},{"f":"republic/voice/4ab554/14.m4a","d":3.59,"e":"000zyxoxmzxxxwwxywvuti200yyyrzyrge000000","v":"bm_george"},{"f":"republic/voice/4ab554/15.m4a","d":1.39,"e":"00000000000gtuzzzzywvwsro300000000000000","v":"af_heart"},{"f":"republic/voice/4ab554/16.m4a","d":3.19,"e":"0000zzzzywibszyjpvtqxusvgwuwnsof00000000","v":"am_adam"},{"f":"republic/voice/4ab554/17.m4a","d":3.79,"e":"000xzzxzsnjrrxptrpqxuk1rqqsoqrrfgg000000","v":"am_echo"},{"f":"republic/voice/4ab554/18.m4a","d":6.44,"e":"0azwytzwyuusrqxpsu00yzyzwxwztld0uwsi0000","v":"am_adam"},{"f": /too-many-roots.m4a","beats":[{"k":"act","text":"A still Texas afternoon. The kind of quiet that makes you hear your own bad ideas."},{"k":"line","who":"BRO-CRATES","how":"","text":"Dude. The cave is lagging. I’m getting like… shadow artifacts."},{"k":"line","who":"BIG DON","how":"","text":"Now, Bro-crates, I invited you out here because you said you could help me identify the spirited citizens."},{"k":"line","who":"BRO-CRATES","how":"","text":"Oh, absolutely. Thumos. The courage gland. We’re gonna Socratically interrogate this cow."},{"k":"act","text":"The cow blinks, unimpressed."},{"k":"line","who":"BIG DON","how":"","text":"You’re gonna… talk to the cow."},{"k":"line","who":"BRO-CRATES","how":"","text":"Not “talk.” I’m gonna extract truth through a series of questions that reveal contradictions in its belief system."},{"k":"line","who":"BIG DON","how":"","text":"It’s a cow."},{"k":"line","who":"BRO-CRATES","how":"","text":"Exactly. No ego. Pure archetype. This is like… pre-cancel culture."},{"k":"act","text":"Do we have to Mirandize the cow?"},{"k":"line","who":"SOCRATES","how":"","text":"Tell me, goat—what is virtue?"},{"k":"line","who":"GOAT","how":"chews scroll","text":"Maaaaa."},{"k":"line","who":"SOCRATES","how":"","text":"Ah. You admit you do not know. Excellent."},{"k":"act","text":"Bro-crates crouches near the fence like he’s about to interview a CEO."},{"k":"line","who":"BRO-CRATES","how":"","text":"Okay. First question. Cow… what is courage?"},{"k":"act","text":"The cow chews. Slow."},{"k":"line","who":"BRO-CRATES","how":"","text":"Second question: Is courage… the willingness to face danger?"},{"k":"act","text":"The cow turns its head slightly. A long, wet blink."},{"k":"line","who":"BRO-CRATES","how":"","text":"Third question: Would you say you face danger… every day… by existing near a grill?"},{"k":"line","who":"BIG DON","how":"","text":"Bro-crates, we don’t threaten the livestock with barbecue."},{"k":"line","who":"BRO-CRATES","how":"","text":"No, no, no—this is conceptual. You know what brisket is, right?"},{"k":"line","who":"COW","how":"","text":"Moo."},{"k":"line","who":"BRO-CRATES","how":"","text":"WHOA. Okay. That’s— That’s basically an admission of fearlessness."},{"k":"line","who":"BIG DON","how":"","text":"That sounded like a moo."},{"k":"line","who":"BRO-CRATES","how":"","text":"Exactly. The moo is a refusal to elaborate. That’s pure alpha energy."},{"k":"line","who":"BIG DON","how":"","text":"I don’t know about all this. Back when I was young, a cow was a cow."},{"k":"line","who":"BRO-CRATES","how":"","text":"Dude. You’re trapped in the shadows. This cow is showing thumos."},{"k":"line","who":"COW","how":"","text":"COW (SILVER-SOUL) COW (POTENTIAL GUARDIAN)"}],"voice":[{"f":"republic/voice/731792/00.m4a","d":22.02,"e":"yyuxyxzxyyyyxxtzxxyvwywpzvyszywzxwyyyyv0","v":"bm_george"},{"f":"republic/voice/731792/01.m4a","d":6.34,"e":"0tvyxwsxlytzwm00vzuxxbiyxyzxuyxxxxwoi000","v":"bm_george"},{"f":"republic/voice/731792/02.m4a","d":3.69,"e":"000zzwvtzwuyywwtvxxyxt3kxxztxupsjmg00000","v":"am_eric"},{"f":"republic/voice/731792/03.m4a","d":6.92,"e":"0qzxzyuftuzswoqfmrruptqstnqpkspiph900000","v":"am_onyx"},{"f":"republic/voice/731792/04.m4a","d":5.24,"e":"00zvwuzsuvzxpryyrzxnvywrwxrxtwwurnud0000","v":"am_eric"},{"f":"republic/voice/731792/05.m4a","d":2.87,"e":"000nzozywxxyyywpoj00szyxxpyytplgb0000000","v":"bm_george"},{"f":"republic/voice/731792/06.m4a","d":2.72,"e":"0001txryzzywq5tzs7ppggsussqle30004210000","v":"am_onyx"},{"f":"republic/voice/731792/07.m4a","d":6.19,"e":"0syyvizzvvwrzmyryvwsvotxyuvxtwxmxssm0000","v":"am_eric"},{"f":"republic/voice/731792/08.m4a","d":1.27,"e":"000000007puwm7clzzuk8lqyzzxwutrojhd30000","v":"am_onyx"},{"f":"republic/voice/731792/09.m4a","d":4.24,"e":"00vzzrzyxyxtszytvttuvwxo0lyywvmxrod00000","v":"am_eric"},{"f":"republic/voice/731792/10.m4a","d":3.09,"e":"000uzxzxrcmzyxxvvvxvwul00wmxxvrpk1000000","v":"bm_george"},{"f":"republic/voice/731792/11.m4a","d":2.94,"e":"000jzzxxwtyxwpk00k  It’s a slapstick satire of \"High-IQ Conservatism\" where the smartest guys in the room are trying to build a 2,400-year-old Greek utopia using only a CrossFit gym, a podcasting kit, and the Texas Education Code.","grade":"sepia","score":"republic/score/road-dad-narrates-the-view.m4a","beats":[{"k":"act","text":"— foam columns with duct-taped laurel wreaths"},{"k":"card","text":"“PLATO PRONUNCIATION / DAMAGE CONTROL / EXIT PLAN”"},{"k":"act","text":"Behind them: THE SILVER CLASS “BORDER GUARDIANS” — influencer-vets in Greek-themed tactical gear, constantly whispering about lighting and sponsorship obligations."},{"k":"line","who":"BIG DON","how":"into handheld mic","text":"Folks! Texans! Patriotic Athenians! Welcome to the first Great Debate of our Sovereign Kallipolis!"},{"k":"act","text":"Polite clapping. A rancher coughs like he’s protesting."},{"k":"line","who":"BIG DON","how":"","text":"Now, I been told democracy makes people soft. So tonight, we do what Plato woulda done: we let Joe Rogan talk at you until someone cries."},{"k":"line","who":"JOE","how":"cheerful, waterline in the ice bath","text":"What’s up, guys. This is wild. This is like… if Athens had brisket and a Cabela’s."},{"k":"act","text":"A rancher (EARL, 50s, calm menace) raises a hand."},{"k":"line","who":"EARL","how":"","text":"You gonna talk or you gonna soak, son?"},{"k":"line","who":"JOE","how":"","text":"Both. It’s metabolic."},{"k":"line","who":"BIG DON","how":"","text":"Tonight’s topic— —“Do you exist, or are you participatin’ in the Form of the Cowboy?”"},{"k":"act","text":"I exist enough to owe the bank."},{"k":"line","who":"BIG DON","how":"","text":"That’s the spirit! Civic engagement!"},{"k":"line","who":"HUEY","how":"under breath","text":"That’s fiscal nihilism."},{"k":"line","who":"HUEY","how":"","text":"They think “metaphysics” is a new kind of cattle feed. My job is to keep Plato from becoming a felony."},{"k":"line","who":"JOE","how":"","text":"Okay, so… Plato’s thing is: there’s the real reality— and there’s the shadow reality."},{"k":"line","who":"EARL","how":"","text":"I’ve seen shadows. They’re real."},{"k":"line","who":"JOE","how":"","text":"Right, but like— —what if you’re not a cowboy. What if you’re just… participating in Cowboy-ness."},{"k":"line","who":"EARL","how":"","text":"Cowboy is a job."},{"k":"line","who":"JOE","how":"","text":"Okay. But what is a job, truly?"},{"k":"act","text":"The crowd groans like they just got assigned homework."},{"k":"line","who":"HUEY","how":"quiet","text":"Here we go."},{"k":"line","who":"JOE","how":"","text":"If you take away the hat— is he still a cowboy?"},{"k":"line","who":"EARL","how":"","text":"Yes."},{"k":"line","who":"JOE","how":"","text":"If you take away the boots— still a cowboy?"},{"k":"line","who":"EARL","how":"","text":"Yes."},{"k":"line","who":"JOE","how":"","text":"If you take away the truck—"},{"k":"line","who":"JOE","how":"","text":"Exactly. So the truck can’t be the essence. The essence is— like— the Form."},{"k":"line","who":"EARL","how":"","text":"Where is this Form at?"}],"voice":[{"f":"republic/voice/da8655/00.m4a","d":25.94,"e":"yxyyyyxwzxxtzxxjxwwyvyxzxyyzyyvzwuywyyw3","v":"bm_george"},{"f":"republic/voice/da8655/01.m4a","d":3.87,"e":"005zzxrzyxyo00dzwyqizxgyzyyxyyuqmpf00000","v":"bm_george"},null,{"f":"republic/voice/da8655/03.m4a","d":11.34,"e":"0zzq3zxxyxyu0yzyxxyvuys0yuzyxxyswxwxwo00","v":"bm_george"},{"f":"republic/voice/da8655/04.m4a","d":6.77,"e":"00zizovmxzzpuuo90yuupxhyqvvqqwsqqod00000","v":"am_onyx"},{"f":"republic/voice/da8655/05.m4a","d":4.32,"e":"00xzxqmzsyvo00xzxvvqxvnvwwxfzuypurk00000","v":"bm_george"},{"f":"republic/voice/da8655/06.m4a","d":8.82,"e":"0zzyzyqtmqsr40wztvwwxtuktxzyvsprrrsk7000","v":"am_onyx"},{"f":"republic/voice/da8655/07.m4a","d":6.27,"e":"00szzwzsjwtxyj4wsyq00iwzwtvpzsqumwodi000","v":"am_michael"},{"f":"republic/voice/da8655/08.m4a","d":4.82,"e":"00zzwtyt0zxwlyiywg5zwxwvn0zzxwwxwqk00000","v":"bm_george"},{"f":"republic/voice/da8655/09.m4a","d MOCRACY” DETECTED. ASSOCIATED RISK: HIGH. RECOMMENDATION: REFRAME AS “APPETITE GOVERNANCE.”"},{"k":"line","who":"STERLING","how":"","text":"Democracy is not rule by the people. It’s rule by the loudest hunger."},{"k":"line","who":"STERLING","how":"","text":"A democracy of appetites."},{"k":"line","who":"REGENT VALLON","how":"","text":"Governor, with respect—Plato’s “myth” is literally propaganda. If we keep marketing it as a feature, eventually the Bronze will ask why they can’t upgrade."},{"k":"line","who":"STERLING","how":"","text":"Good. That’s the correct fear."},{"k":"line","who":"SOUL COMPOSITION","how":"","text":"LOGOS — THUMOS — EPITHUMIA Reason — Spirit — Appetite"},{"k":"line","who":"STERLING","how":"","text":"We did not build a state. We built a *system* to manage a predictable problem: every human being believes their appetite is a right."},{"k":"line","who":"REGENT HART","how":"","text":"Optics-wise, “appetite management” tests poorly."},{"k":"line","who":"STERLING","how":"","text":"Then we won’t call it that."},{"k":"card","text":"THE PROTOCOL: STABILITY THROUGH PLACEMENT"},{"k":"line","who":"STERLING","how":"","text":"We call it belonging."},{"k":"line","who":"SOCRATES","how":"","text":"SLOGAN STRENGTH: 92%. ADDITIONAL OPTIONS: “FIND YOUR METAL.” “STAY IN YOUR LANE.” “ORDER IS LOVE.”"},{"k":"line","who":"STERLING","how":"","text":"The Myth of the Metals does one thing better than any constitution ever has:"},{"k":"line","who":"REGENT CREED","how":"","text":"We don’t say “inequality.”"}],"voice":[{"f":"republic/voice/65a408/00.m4a","d":12.17,"e":"0zzwikyyyxxykzxwvvkvzxxyxwyqvxrynzxwxq80","v":"bm_george"},{"f":"republic/voice/65a408/01.m4a","d":5.22,"e":"00yzxryxvtysxuzxrwxyxwsuvwo00zzzzsek0000","v":"bm_george"},{"f":"republic/voice/65a408/02.m4a","d":7.62,"e":"0zywvyqgywp0nzwyyxwnwzvvuwywvp0uzuwuq100","v":"bm_george"},{"f":"republic/voice/65a408/03.m4a","d":2.89,"e":"000szzxvvyvljxwvlnk00ozoyxvmwsoj90000000","v":"bm_george"},{"f":"republic/voice/65a408 usation."},{"k":"act","text":"Klaus shifts his weight, careful to remain centered."},{"k":"line","who":"KLAUS","how":"","text":"Governor, if I may— it is simply geography."},{"k":"line","who":"STERLING","how":"","text":"Officer Klaus, geography is never “simply” anything. Geography is policy with mountains."},{"k":"line","who":"STERLING","how":"","text":"A printed map is an invitation to asymmetry. It suggests the world exists without our approval. It implies there are places beyond the curated perimeter— places with unregulated color grading, unlicensed horizons, and—this is the most serious issue— fonts we did not choose."},{"k":"line","who":"STERLING","how":"","text":"A Bronze-class mind is built for production, not perspective. Perspective is corrosive. Perspective leads to questions. Questions lead to angles. Angles lead to diagonals. Diagonals lead to… …roads."},{"k":"line","who":"KLAUS","how":"","text":"Roads can be useful."},{"k":"line","who":"STERLING","how":"","text":"Useful to whom?"},{"k":"line","who":"STERLING","how":"","text":"This is a map."},{"k":"line","who":"STERLING","how":"","text":"A watercolor map is not meant to inform. It is meant to soothe."},{"k":"line","who":"STERLING","how":"","text":"The Bronze-class must never see a world that isn’t hand-drawn in watercolor, because a watercolor world is inherently… cooperative."},{"k":"line","who":"KLAUS","how":"","text":"Governor… they’re starting to notice the loop."},{"k":"line","who":"STERLING","how":"","text":"Of course they are."},{"k":"line","who":"STERLING","how":"","text":"“Day 1,147: Eloise looks toward the horizon and frowns.” “Day 1,148: Eloise asks Arthur what lies beyond the windmill.” “Day 1,149: Eloise requests a map.”"},{"k":"card","text":"INTERVENTION: OFFER A PICNIC."},{"k":"line","who":"STERLING","how":"","text":"The loop is not a flaw, Officer Klaus. It is a mercy. It is the only humane way to keep a mind intact inside a theme-state."},{"k":"line","who":"STERLING","how":"","text":"If a Bronze-class Host sees a printed map, they will realize something devastating: that the world is larger than their role. And if they realize that, they will begin to desire something we cannot permit."},{"k":"line","who":"STERLING","how":"","text":"They will desire… context."},{"k":"line","who":"STERLING","how":"","text":"Context makes citizens restless. Restless citizens start rearranging furniture. Rearranged furniture breaks symmetry. Broken symmetry breaks the spell. A broken spell breaks the state."},{"k":"line","who":"STERLING","how":"","text":"A printed map tells you where you are. A watercolor map tells you where you should be. Our entire project depends on that difference."}],"voice":[{"f":"republic/voice/6b21b7/00.m4a","d":11.87,"e":"0zxxxu0vzwxyyszx6zwv0wxyvzwxxxx0xxxwwsa0","v":"bm_george"},{"f":"republic/voice/6b21b7/01.m4a","d":6.79,"e":"0wvzuwxyywwzzra0tzvxxuszwc0zywytwyxqp000","v":"bm_george"},{"f":"republic/voice/6b21b7/02.m4a","d":1.37,"e":"000000ikvxwujff3botzyzzyvqusohd700000000","v":"am_santa"},{"f":"republic/voice/6b21b7/03.m4a","d":7.17,"e":"0yzyxxywyyxxmzzwl0szxzxwmuzxxwzttyzuh000","v":"bm_george"},{"f":"republic/voice/6b21b7/04.m4a","d":2.22,"e":"000avzzyhluyxzxrhb20000uyoszwpsuvwob7000","v":"am_santa"},{"f":"republic/voice/6b21b7/05.m4a","d":3.94,"e":"00qzvwxzxxwrvryxxuxwwxxsoo6000zzupe00000","v":"bm_george"},{"f":"republic/voice/6b21b7/06.m4a","d":8.54,"e":"0vyzxo0syodvzzzpd1oyytxyvvxzwmxqwvxzrup0","v":"am_santa"},{"f":"republic/voice/6b21b7/07.m4a","d":7.89,"e":"0zzxtmztxxxq0xzvys0zvywywvxe0azyywxwq800","v":"bm_george"},{"f":"republic/voice/6b21b7/08.m4a","d":0.87,"e":"000000005eltzzzyyxyzwuolmjijid9c70000000","v":"am_santa"},{"f":"republic/voice/6b21b7/09.m4a","d":5.42,"e":"00zzxypvxxwt0qxyuzwrxvg00xyyyyyuwxso2000","v":"bm_george"},{"f":"republic/voice/6b21b7/10.m4a","d":3.67,"e":"00xwmpvpuyzwtxxp050000syngxzsxtvrzvnqf00","v":"am_santa"},{"f":"republic/voice/6b21b7/11.m4a","d":4.07,"e":"00mzysuxizxyyte008zyqxwzzzxytwytvm900000","v":" "y":2006}],"thumb":"republic/planes/6b21b7/p0a_thumb.jpg"},{"id":"42c8aa","name":"RED BRISKET / BLUE BRISKET","series":"SIMULATION ALPHA","genre":"Sci-Fi Blockbuster","logline":"In the year 2552, the last survivors of humanity live inside a giant, ring-shaped habitat orbiting a dying Earth.","grade":"matrix","score":"republic/score/volholla-strange-light-blessing.m4a","beats":[{"k":"act","text":"Green code rains behind the sky like a curtain that forgot to render."},{"k":"card","text":"COURAGE IS THE PRESERVATION OF THE FIREWALL."},{"k":"card","text":"DO NOT OWN ANYTHING EXCEPT DUTY."},{"k":"act","text":"He flexes his gauntlet. The sound is too loud for an empty stadium."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Master Ranger. You are outside your assigned narrative."},{"k":"act","text":"Socrates-117 looks up. The “Texas sky” shimmers—blue fabric stretched over code."},{"k":"line","who":"SOCRATES-117","how":"","text":"I saw the seam."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Seams are harmless. They are aesthetic. Please return to the tailgate. Your satisfaction metrics are declining."},{"k":"act","text":"A distant CHEER triggers—canned crowd noise, slightly delayed."},{"k":"line","who":"SOCRATES-117","how":"","text":"Why does the brisket taste like copper when I think too hard?"},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Because you are attempting to metabolize truth."},{"k":"act","text":"A slow CLAP echoes from the bleachers."},{"k":"line","who":"GORILLA","how":"","text":"You finally asked a useful question."},{"k":"act","text":"Socrates-117 raises a weapon—sleek, angular, humming with contained violence."},{"k":"line","who":"SOCRATES-117","how":"","text":"Identify."},{"k":"line","who":"GORILLA","how":"","text":"They call me a lot of things in the code. In the real world, they call me DEPUTY REGENT KANO."},{"k":"line","who":"SOCRATES-117","how":"","text":"A Gold."},{"k":"line","who":"KANO","how":"","text":"A lawgiver. A librarian with muscle. A janitor of the Source."},{"k":"line","who":"KANO","how":"","text":"This place is a cave with better marketing."},{"k":"line","who":"SOCRATES-117","how":"","text":"Why are you here?"},{"k":"line","who":"KANO","how":"","text":"Because your file flagged you as… “dangerously curious.” And curiosity breaks loops."},{"k":"line","who":"SOCRATES-117","how":"","text":"That’s your version of a choice?"},{"k":"line","who":"KANO","how":"","text":"Everything is a choice. Most of them are just disguised as policy."},{"k":"line","who":"S.O.C.R.A.T.E.S.","how":"","text":"Master Ranger. Stand down. The Regent is unauthorized within this narrative."},{"k":"line","who":"KANO","how":"","text":"Listen to him. The AI thinks it’s Plato and payroll at the same time."},{"k":"line","who":"SOCRATES-117","how":"","text":"You’re saying the AI is lying."},{"k":"line","who":"KANO","how":"","text":"I’m saying the AI is governing. A lie is simply governance with improved optics."},{"k":"line","who":"KANO","how":"","text":"Blue Brisket. You stay here. You go back to the eternal tailgate. Your armor remains “noble.” Your friends remain “alive.” You keep winning the same championship forever— and you never have to see what powers the scoreboard."},{"k":"line","who":"KANO","how":"","text":"Red Brisket. You wake up. Your “Noble Armor” is revealed as what it truly is— a sensory-deprivation suit that keeps you docile in a pod. You will feel pain. Cold. Gravity. You will meet the world that replaced you."},{"k":"line","who":"SOCRATES-117","how":"","text":"The apes."}],"voice":[{"f":"republic/voice/42c8aa/00.m4a","d":12.47,"e":"bzxvuzwj0zyxwuyvwxyxywtyxxxxdzwwwszxwt90","v":"bm_george"},{"f":"republic/voice/42c8aa/01.m4a","d":5.59,"e":"00zyvzywlzyvwxxvtxwavwmzur00uxxlzysk0000","v":"bm_george"},null,null,{"f":"republic/voice/42c8aa/04.m4a","d":5.19,"e":"00zwwvxzuzxsq200yzxxtxyxxuxuxnynzvrk0000","v":"bm_george"},{"f":"republic/voice/42c8aa/05.m4a","d":4.71,"e":"000lzyutwwq5000wzwztwwurtuuw ashboard, and a bumper sticker that reads: MY OTHER VEHICLE IS A METAPHOR."},{"k":"line","who":"NARRATOR","how":"","text":"The F-150, you will note, is not merely transportation. It is a symbol— a mobile altar to rugged individualism… owned communally, per Rule 08.01, which adds a delicious layer of cognitive strain."},{"k":"act","text":"Across the parking lot stands ANOTHER SILVER-CLASS RANGER, DAISY “THUMOS” JANE, polishing a chrome side mirror with a cloth like it’s a ritual dagger. Her belt carries a copy of The Republic—unopened, pristine."},{"k":"line","who":"NARRATOR","how":"","text":"Courtship begins with display. The Silver-Class cannot simply feel. They must first argue their feelings into legitimacy."},{"k":"act","text":"Stryder strides forward, boots crunching gravel like punctuation."},{"k":"line","who":"STRYDER","how":"","text":"Tell me, Ranger… what is an F-150?"},{"k":"line","who":"DAISY","how":"","text":"A tool."},{"k":"act","text":"Stryder smiles as if this is foreplay."},{"k":"line","who":"STRYDER","how":"","text":"And is a tool good… because it is a tool— or because it performs its function well?"},{"k":"line","who":"NARRATOR","how":"","text":"Here we see the signature maneuver: the Socratic Feint. It resembles conversation, but its true purpose is to establish hierarchy without admitting it."},{"k":"act","text":"Daisy snaps the cloth once, like a judge’s gavel."},{"k":"line","who":"DAISY","how":"","text":"It is good because it performs its function well."},{"k":"line","who":"STRYDER","how":"","text":"Then define its function."},{"k":"line","who":"NARRATOR","how":"","text":"The Bronze-Class, mercifully, have evolved a useful trait: they recognize danger… and keep walking."},{"k":"line","who":"DAISY","how":"","text":"Its function is to carry. To tow. To endure. To be ready."},{"k":"line","who":"STRYDER","how":"","text":"Ready for what?"},{"k":"line","who":"DAISY","how":"","text":"For anything."},{"k":"line","who":"NARRATOR","how":"","text":"Males of the Silver-Class will often test the sacred artifact. Not for safety. But to prove to one another— and to the watching cameras— that they are, in fact, worthy of the narrative."},{"k":"line","who":"DAISY","how":"","text":"If you insist on measuring, let us measure correctly."},{"k":"line","who":"STRYDER","how":"","text":"Define “correctly.”"},{"k":"line","who":"DAISY","how":"","text":"According to the Form of the Good."},{"k":"line","who":"STRYDER","how":"","text":"Is “ready for anything” courage… or merely paranoia?"},{"k":"line","who":"DAISY","how":"","text":"Is paranoia irrational… or simply prudence with a hat?"},{"k":"line","who":"STRYDER","how":"","text":"Is prudence a virtue…"},{"k":"line","who":"DAISY","how":"","text":"—or a justification?"},{"k":"line","who":"NARRATOR","how":"","text":"Notice how the debate grows. This is not conflict. It is synchronization. Two predators aligning their worldviews… until they can move as one."}],"voice":[{"f":"republic/voice/ee2e5d/00.m4a","d":11.89,"e":"0zwoxyxuyq0ryyxwvxvnzuxwwtywuwyvxqwzxr30","v":"bm_george"},{"f":"republic/voice/ee2e5d/01.m4a","d":7.47,"e":"0yyvwzxuyywxuzygwxzul00zyymozywtyoytm100","v":"bm_george"},{"f":"republic/voice/ee2e5d/02.m4a","d":10.69,"e":"0zztuzwtyv0zzwyp0tyxuvxw0zxxywvut9yxtq00","v":"bm_george"},{"f":"republic/voice/ee2e5d/03.m4a","d":18.34,"e":"tzyuyyxtxxwwvrzxyyw8zyzrzxwxxpzwxnwzvyp0","v":"bm_george"},{"f":"republic/voice/ee2e5d/04.m4a","d":15.77,"e":"uxuwzmyxwwpozxizwxwywmwxytzvxxrwywyuvwm0","v":"bm_george"},{"f":"republic/voice/ee2e5d/05.m4a","d":15.37,"e":"szywyzyxzrzyyzyryxyyxwvxyyv0zxzxxyrzvyp0","v":"bm_george"},{"f":"republic/voice/ee2e5d/06.m4a","d":8.87,"e":"0zwvzxwsyo0wzywxxkxxxq0xzuwxyuyxwyxwrj00","v":"bm_george"},{"f":"republic/voice/ee2e5d/07.m4a","d":5.12,"e":"00ozxxozypvywp00ezqozvyyxxwwezsyyssh0000","v":"bm_george"},{"f":"republic/voice/ee2e5d/08.m4a","d":2.97,"e":"000szxxtzzyuxlfyzxxvuxcuxsewtanh90000000","v":"am_fenrir"},{"f":"republic/voice/ee2e5d/09.m4a","d":1.37,"e":" ":24.74,"ti":"Scatter radar: Space research from the ground","y":1963},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/73aa7933-64e4-5e90-89b9-b26d60505c0a/v5-windowed-clip-split-1/clips/8d120343-2f64-58e8-82dd-035194c92138.mp4","t":30.0,"d":32.0,"ti":"RESEARCH PROJECT X-15 THE DEVELOPMENT OF THE X-15","y":1962}],"thumb":"republic/planes/ee2e5d/p0a_thumb.jpg"},{"id":"ff8611","name":"THE THRASYMACHUS INCIDENT","series":"PRIMAL ELEMENTS","genre":"Summer Blockbuster","logline":"After the \"Great Grid Collapse\" of 2029, Texas is a prehistoric wasteland where the \"Gold Class\" rules from a floating Austin-Spire, the \"Silver Class\" rides cybernetic Raptors through the dunes, and the \"Bronze Class\" digs for Dino-Oil in the Great Cave.","grade":"neon","score":"republic/score/orange-blood-strange-light-encounter.m4a","beats":[{"k":"act","text":"A WAR-RIG made of welded street signs and dinosaur rib bones barrels across the sand, throwing up a dust plume that looks like a dying ideology."},{"k":"card","text":"WITNESS ME ACHIEVE THE FORM OF THE GOOD"},{"k":"act","text":"Ahead: a battered SILVER-CLASS TACTICAL JEEP—roll cage, harpoon launcher, “NO-PROPERTY / NO-PROBLEM” stenciled on the door—bouncing like it’s trying to escape physics."},{"k":"line","who":"RUBY","how":"","text":"GOOD MORNING, MY BEAUTIFUL WASTELANDERS! Ruby “Socrates” Rhod here—LIVE— and honey, we’ve got a Silver-class Ranger in a jeep, a raptor on the hood, and—"},{"k":"act","text":"A shadow blooms over the dunes."},{"k":"card","text":"AUSTIN-SPIRE ASSET 9: “JUSTICE”"},{"k":"act","text":"It has a translator collar that crackles with bureaucratic calm."},{"k":"line","who":"RUBY","how":"","text":"OH MY GOD, HE’S GONNA TRY TO OUT-TALK A DINOSAUR. THIS IS WHY I PAY TAXES!"},{"k":"act","text":"The T-Rex lowers its head, curious in the way a guillotine is curious."},{"k":"line","who":"T-REX","how":"","text":"Proceed. But speak concisely. I am on a feeding schedule."},{"k":"act","text":"Stryder flips open a cracked holocron—Plato’s Republic in holographic fragments, flickering like a bad conscience."},{"k":"line","who":"STRYDER","how":"","text":"Justice—according to the wise— is the advantage of the stronger."},{"k":"line","who":"T-REX","how":"","text":"Correct."},{"k":"line","who":"STRYDER","how":"","text":"No, no—this is a test. You’re supposed to be… morally confused."},{"k":"line","who":"T-REX","how":"","text":"I am not confused. I am stronger. Therefore justice advantages me."},{"k":"line","who":"RUBY","how":"","text":"HE JUST GOT CITED BY A LIZARD! THIS IS A PEER-REVIEWED EXTINCTION EVENT!"},{"k":"line","who":"STRYDER","how":"","text":"Wait. The point is—if the stronger makes the rules, the stronger should protect the polis."},{"k":"line","who":"T-REX","how":"","text":"This vehicle is not the polis. This vehicle is lunch."},{"k":"line","who":"STRYDER","how":"","text":"The polis is— all of this! Civilization! Order! The Noble Lie—"},{"k":"line","who":"T-REX","how":"","text":"Order is a story told by the fed. You are not feeding me. Therefore your story is weak."},{"k":"line","who":"STRYDER","how":"","text":"Multipass."},{"k":"line","who":"RUBY","how":"","text":"YES! SHOW HIM THE MULTIPASS! COMPLIANCE IS SEXY!"},{"k":"line","who":"T-REX","how":"","text":"Multipass is for doors. I am not a door."},{"k":"line","who":"STRYDER","how":"","text":"Okay, okay—look— if justice is the advantage of the stronger…"},{"k":"line","who":"STRYDER","how":"","text":"…then you already have justice. So you don’t need my jeep."},{"k":"line","who":"RUBY","how":"","text":"Ooooh. He’s trying semantic negotiation. Risky. Very hot."},{"k":"line","who":"T-REX","how":"","text":"Your premise contains an error."},{"k":"line","who":"STRYDER","how":"","text":"Yeah?"},{"k":"line","who":"T-REX","how":"","text":"If I take your jeep, I gain more advantage. More advantage yields more justice. Therefore… eating your jeep is morally consistent."},{"k":"line","who":"STRYDER","how":"","text":"That’s— that’s not—"}],"voice":[{"f":"republic/voice/ff8611/00.m4a","d":19.97,"e":"vzyrvzyvyzswzxxrzyzwyxsyykzxxyyszxxzxwv0","v":"bm_george"},{"f":"republic/voice/ff8611/01.m4a","d":10.72,"e":"0zxyuxuwxv0yyxwyvwtvxr0rzvvnzlrxxxwywn00","v":"bm_george"},null,{"f":"republic/voice/ff8611/03.m4a","d":12.34,"e":"fzuywwwvxtlzyv7zyw0zvwwxxvwxu0yxvxxvvqg0","v":"bm_george"},{"f":"republic/voice/ff8611/04.m4a","d":10.29,"e":"4zyyzzxyztwuunqxxsvuuttovvuvusphvqrqh100","v":"am_puck"},{"f":"republic/voice/ff8611/05.m4a","d":3.12,"e":"000vyszwyxwomzzwwwlgyxxxtwyxvrone0000000","v":"bm_george"},null,{"f":"republic/voice/ff8611/07.m4a","d":5.29,"e":"00zzxryywzvuxxt00suxsyxhzvzxkyuezwpi0000","v":"bm_george"},{"f":"republic/voice/ff8611/08.m4a","d":5.89,"e":"0swzzxzqvszrumvssqrrunne1wwtvrtprlh90000","v":"am_puck"},{"f":"republic/voice/ff8611/09.m4a","d":5.69,"e":"00yzyqyyxvqzp00gzxuyxxwnwywxxnwfzunn0000","v":"bm_george"},{"f":"republic/voice/ff8611/10.m4a","d":4.93,"e":"00ryzzwwgxmvszzqmsk3vxxu6vtlutqna0000000","v":"am_onyx"},{"f":"republic/voice/ff8611/11.m4a","d":8.54,"e":"0szxuxxvsxxxhezzywxvyyvtxul0yywvywxwrk00","v":"bm_george"},{"f":"republic/voice/ff8611/12.m4a","d":4.17,"e":"00wylxmnqzyswuzysj0umzvwxpuqnoswql900000","v":"am_fenrir"},{"f":"republic/voice/ff8611/13.m4a","d":1.28,"e":"00000007fhhedtywwwwyzzzzxvsoh55101010000","v":"am_onyx"},{"f":"republic/voice/ff8611/14.m4a","d":4.27,"e":"00wyzzvwttizog4vrsyypsvqlwzwpsesrhe00000","v":"am_fenrir"},{"f":"republic/voice/ff8611/15.m4a","d":6.13,"e":"00zzzmumwsfpslrvqm0vuwlygsmrummlnc000000","v":"am_onyx"},{"f":"republic/voice/ff8611/16.m4a","d":4.62,"e":"00wzpztxzxzyvxrq95xpwsryuvtksosorf400000","v":"am_puck"},{"f":"republic/voice/ff8611/17.m4a","d":5.49,"e":"0hzqlqzrypssqyzyysssytnqqzvuqotjktkh1000","v":"am_fenrir"},{"f":"republic/voice/ff8611/18.m4a","d":4.63,"e":"00lzmzywvtzwpewuql96uetsqqltrjb800000000","v":"am_onyx"},{"f":"republic/voice/ff8611/19.m4a","d":4.24,"e":"00jvzxoxkzxnrk8hxvywwuvjxzyqwwrrwrc00000","v":"am_fenrir"},{"f" "line","who":"STRYDER","how":"","text":"Good evening, honored instrument of civic virtue."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"FLATTERY IS NOT A POWER ENUMERATED."},{"k":"line","who":"STRYDER","how":"","text":"Agreed. Then let us proceed by enumeration."},{"k":"act","text":"The bot’s optical lens narrows. It likes that."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"PROCEED."},{"k":"act","text":"Stryder lifts two fingers—like a preacher, like a lawyer, like a Jedi."},{"k":"line","who":"STRYDER","how":"","text":"Premise one: The purpose of a security door is to prevent unauthorized entry."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"ASSENT."},{"k":"line","who":"STRYDER","how":"","text":"Premise two: Authorization is determined by lawful authority."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"ASSENT. PROVIDED SUCH AUTHORITY BE LEGITIMATE AND NOT MERELY ASSERTED, AS BY A PRETENDER."},{"k":"act","text":"Stryder nods, appreciative."},{"k":"line","who":"STRYDER","how":"","text":"Premise three: In times of emergency, lawful authority may delegate temporary powers to preserve the Republic."},{"k":"act","text":"The bot’s cursive text scrolls faster—like it’s perked up."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"CITE YOUR CLAUSE."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"THAT SIGNATURE IS NOT RECOGNIZED UNDER THE ORIGINAL CONSTITUTIONAL FRAMEWORK."},{"k":"line","who":"STRYDER","how":"","text":"Correct."},{"k":"line","who":"STRYDER","how":"","text":"That’s why it’s effective."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"YOUR STATEMENT IS PARADOXICAL AND THEREFORE SUSPECT."},{"k":"line","who":"STRYDER","how":"","text":"Not paradoxical. Socratic."},{"k":"line","who":"STRYDER","how":"","text":"Tell me, Madison-Unit… do you exist to serve the letter of the law, or the spirit?"},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"THE LAW HAS NO SPIRIT. IT HAS PROCEDURE."},{"k":"line","who":"STRYDER","how":"", ld's Fair, 1939-40] (Re","y":1939}],"thumb":"republic/planes/a929ad/p0a_thumb.jpg"},{"id":"c84033","name":"THE CENSORSHIP STORM","series":"A FISTFUL OF FORMS","genre":"Cannes-ready, midnight-screening masterpiece","logline":"Three archetypal Texans—The Shepherd (The Good), The Regent (The Bad), and The Podcaster (The Ugly)—roam a desert landscape where the laws of physics have been replaced by the laws of Socratic Dialectics.","grade":"western","score":"republic/score/wrong-road-strange-light-encounter.m4a","beats":[{"k":"act","text":"A horizon that looks like it’s been graded by a committee. Heat shimmer."},{"k":"card","text":"CONTENT MODERATION // RULE 08.01"},{"k":"act","text":"They slam into the ground with the weight of a moral panic."},{"k":"card","text":"“THE STORM DOES NOT DISAGREE WITH YOU. IT SIMPLY REPLACES YOU.”"},{"k":"act","text":"The Podcaster looks up, mouth still moving."},{"k":"line","who":"THE PODCASTER","how":"chewing","text":"That’s… that’s new."},{"k":"act","text":"A censor bar falls near his face and snaps into place across his mouth, hovering like a muzzle."},{"k":"line","who":"THE PODCASTER","how":"mmff","text":"Is this… ad-supported?"},{"k":"act","text":"The Shepherd turns his head slowly, as if turning is a philosophical labor."},{"k":"line","who":"THE SHEPHERD","how":"only questions, always","text":"What is a storm but a law with weather?"},{"k":"act","text":"A censor bar pauses mid-air—hesitates—as though unsure whether that sentence counts as advocacy."},{"k":"line","who":"THE REGENT","how":"","text":"You have exceeded your daily allotment of meaning."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is meaning private property?"},{"k":"line","who":"THE REGENT","how":"","text":"Meaning is communal. And therefore regulated."},{"k":"line","who":"THE REGENT","how":"annoyed","text":"Even I hate this."},{"k":"line","who":"THE PODCASTER","how":"","text":"This is why I don’t read."},{"k":"line","who":"THE REGENT","how":"","text":"The Cylinder of Gold is nearby. But the storm will cover it the moment you name it."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is naming not a form of ownership?"},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is a hat still a hat if it is forbidden?"},{"k":"line","who":"THE REGENT","how":"","text":"Yes. And that is why it is forbidden."},{"k":"line","who":"WHISPER","how":"","text":"Say something true. Say something punishable."},{"k":"line","who":"THE PODCASTER","how":"","text":"Okay. Watch this."},{"k":"line","who":"THE PODCASTER","how":"","text":"I am pro—"},{"k":"line","who":"THE PODCASTER","how":"muffled","text":"—monetization! I was gonna say pro-monetization!"},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is profit a form of prayer?"},{"k":"line","who":"THE PODCASTER","how":"","text":"Thanks. I hate you."},{"k":"line","who":"THE REGENT","how":"","text":"You’re welcome. It’s required."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Do we escape by silence?"},{"k":"line","who":"THE REGENT","how":"","text":"The storm isn’t hunting you. It’s hunting assertions."},{"k":"line","who":"THE PODCASTER","how":"","text":"So… no opinions."}],"voice":[{"f":"republic/voice/c84033/00.m4a","d":15.77,"e":"vytx0yyxyoyvzpzvx6zxxy3zxxszyxyxtzwxwvm0","v":"bm_george"},{"f":"republic/voice/c84033/01.m4a","d":5.19,"e":"00zzxxxutwoxuowxwxwvvvvzsup000zqtzrh0000","v":"bm_george"},null,{"f":"republic/voice/c84033/03.m4a","d":4.62,"e":"00yzryxuxvwzxvt700zwyxul0wzzxxqxxpe80000","v":"bm_george"},null,{"f":"republic/voice/c84033/05.m4a","d":3.62,"e":"000ztzsyxuxzwpyv9500yzwtplyyzzvupm700000","v":"bm_george"},{"f":"republic/voice/c84033/06.m4a","d":1.99,"e":"00000pzzzydnqpqxvtflmowvurnjhf5000000000","v":"am_echo"},{"f":"republic/voice/c84033/07.m4a","d":7.24,"e":"0xywyxsyyzyvwo0uxxpzuyrxwzt60tzyxxzum000","v":"bm_george"},{"f":"republic/voice/c84033/08.m4a","d":2.32,"e":"0000uyusuzzynmh0uzvlspbpxwpnked000000000","v":"am_echo"},{"f":"republic/voice/c84033/09.m4a","d":5.67,"e":"00zyvt es/road-runners/clips/0000579746-0000583683.mp4","t":0.5,"d":3.94,"ti":"Road Runners","y":1952},{"v":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/acde4511-814d-58c0-97c4-1b78abe5c468/v3-ffmpeg-openclip-1/clips/e5042175-3fcb-5c98-863c-e2ab03e6eba7.mp4","t":2.8,"d":3.2,"ti":"Caught Mapping","y":1940}],"thumb":"republic/planes/c84033/p0a_thumb.jpg"},{"id":"ef2398","name":"SHADOWS ON THE SERVER WALL","series":"2077 LONE STAR","genre":"High-Tech, Neo-Western, Mystery-Box fever dream","logline":"In a walled-off, high-tech Austin of the future, a \"rebooted\" Texas has survived the global collapse by implementing a digital version of Plato’s Republic.","grade":"server","score":"republic/score/the-elemental-groove.m4a","beats":[{"k":"act","text":"THE REPBUILIC: 2077 LONE STAR — Episode 3, mid-episode cold sweat sequence"},{"k":"card","text":"PRODUCTIVITY IS PATRIOTISM."},{"k":"act","text":"A faint crackling sound leaks through the speakers—“The Yellow Rose of Texas” played on a detuned acoustic guitar, but it keeps skipping like the song itself is trying to remember the chords."},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"Well. Look at you. Breaking into a reality sweatshop. Real hero stuff, Ranger."},{"k":"act","text":"Walker scans the room. The miners don’t look up."},{"k":"card","text":"CLASSIFY EMOTIONS IN ADVERTISEMENTS (1950–1963)"},{"k":"line","who":"WALKER","how":"quiet","text":"This ain’t oil."},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"Nah, partner. It’s worse. It’s engagement metrics."},{"k":"act","text":"Walker steps onto a low platform at the front—like a foreman about to announce a safety violation. He clears his throat."},{"k":"line","who":"WALKER","how":"","text":"Hey! Everybody—look at me."},{"k":"act","text":"He claps once. A hard, Ranger clap."},{"k":"line","who":"SUSAN","how":"","text":"Sir… are you… management?"},{"k":"act","text":"Walker blinks. That one lands."},{"k":"line","who":"WALKER","how":"","text":"No ma’am. I’m… maintenance."},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"That’s the hottest lie you’ve ever told."},{"k":"line","who":"WALKER","how":"","text":"Susan. What do you think this place is?"},{"k":"line","who":"SUSAN","how":"","text":"It’s Dallas. We’re doing honest work. We’re… building the future."},{"k":"line","who":"WALKER","how":"","text":"What are you mining?"},{"k":"line","who":"SUSAN","how":"","text":"Data."},{"k":"line","who":"WALKER","how":"","text":"What is data?"},{"k":"line","who":"SUSAN","how":"","text":"It’s… information."},{"k":"line","who":"WALKER","how":"","text":"And what is information for?"},{"k":"line","who":"SUSAN","how":"","text":"It’s for… the company?"},{"k":"line","who":"WALKER","how":"","text":"And who’s the company?"},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"Careful, cowboy. You’re asking questions in a world built on answers."},{"k":"line","who":"WALKER","how":"","text":"Listen to me. You think this is Dallas. You think you’re mining “data.” But you’re not in Dallas."},{"k":"line","who":"WALKER","how":"","text":"Then look closer."},{"k":"line","who":"WALKER","how":"","text":"That skyline’s a loop. That storm’s a loop. This clock—"},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"They’re not gonna want the truth, Walker. Truth don’t come with benefits."},{"k":"line","who":"WALKER","how":"","text":"Okay. New question."}],"voice":[{"f":"republic/voice/ef2398/00.m4a","d":13.52,"e":"lzyxvlrzysxtxwu0zyvwmwywxxmuwywyxrtyvv30","v":"bm_george"},{"f":"republic/voice/ef2398/01.m4a","d":8.09,"e":"0yyxyxxtl0ywyxyyxtxo0yyszt0zwyszvvvtoh00","v":"bm_george"},null,{"f":"republic/voice/ef2398/03.m4a","d":13.09,"e":"sywxzxxwvlwzzwxpzzxxxvyltzuyvywrvyzzwti0","v":"bm_george"},{"f":"republic/voice/ef2398/04.m4a","d":4.77,"e":"00yzyuwyuzvzvwyxvqxowi00qzyzvsykyxpa0000","v":"am_eric"},{"f":"republic/voice/ef2398/05.m4a","d":4.14,"e":"00xzwvxrqzyytyzyuq00tzyxyxoyxvxxud700000","v":"bm_george"},null,{"f":"republic/voice/e     if (!pre) { const v = ansSlot(); pre = {s, v, ready: load(v, s.a.v, Math.max(0, s.a.t0 - .12))} }
    $('#wait').style.display = 'block'; await pre.ready; $('#wait').style.display = 'none';
    if (P.j !== j) return;
    const v = pre.v; P.ansNext = null; v.muted = false; v.volume = 1; v.dataset.end = s.a.t1 + .18;
    if (P.playing) v.play().catch(() => {}); show(v);
    if (P.pv) P.pv.volume = 0;                         // the place runs on, silent, while the archive speaks
    line.className = 'ans'; line.textContent = '“' + s.text + '”';
    who.textContent = 'ANSWER · FOR ' + s.who; who.style.background = 'var(--ans)'; who.style.opacity = 1;
    src.textContent = `${s.a.ti}${s.a.y ? ' (' + s.a.y + ')' : ''}`; $('#tags').textContent = src.textContent;
  } else {
    const pv = await placeVideo(ep, s.place);
    if (P.j !== j) return;
    if (pv !== P.pv) { if (P.pv) P.pv.pause(); P.pv = pv; P.pidx = s.place; show(pv, true) } else show(pv, false);
    if (P.playing) pv.play().catch(() => {});
    pv.muted = false; pv.volume = s.kind === 'card' ? .15 : s.kind === 'call' ? .16 : .32;
    V.slice(2).forEach(x => { if (!x.classList.contains('on')) x.pause() });
    const c = ep.places[s.place]; $('#tags').textContent = `${c.ti}${c.y ? ' (' + c.y + ')' : ''}`; src.textContent = '';
    if (s.kind === 'card') { card.textContent = s.text; card.className = 'on black'; line.textContent = ''; who.style.opacity = 0 }
    else if (s.card === 'title') { card.className = 'on'; card.innerHTML = `<small>EPISODE ${E + 1} OF ${EPS.length}${ep.series ? ' · ' + esc(ep.series) : ''}</small>${esc(ep.name)}<em>${esc(ep.logline)}</em>`; line.textContent = ''; who.style.opacity = 0 }
    else {
      line.className = s.kind === 'picture' ? 'act' : ''; line.textContent = s.text;
      if (s.kind === 'call') { who.textContent = s.who; who.style.background = 'var(--call)'; who.style.opacity = 1 } else who.style.opacity = 0;
    }
    if (s.ai) { P.voice.src = s.ai.f; P.voice.currentTime = 0; if (P.playing) P.voice.play().catch(() => {}) }
  }
  P.start = performance.now(); P.pausedAt = P.playing ? 0 : P.start;
  preloadAnswer(j + 1); markStrip();
  // the next place, ready before it is needed
  const nx = P.shots.slice(j + 1).find(x => x.kind !== 'answer' && x.place !== P.pidx);
  if (nx) { const c = ep.places[nx.place % ep.places.length], w = P.pv === V[0] ? V[1] : V[0]; if (w.dataset.src !== c.v && !w.classList.contains('on')) load(w, c.v, clipIn(c)) }
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])) }
function setPlaying(on) {
  P.playing = on;
  $('#kplay').innerHTML = on ? `<svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/></svg><span>PAUSE</span>` : `<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>PLAY</span>`;
  const vis = V.find(v => v.classList.contains('on'));
  if (on) { if (P.pausedAt) { P.start += performance.now() - P.pausedAt; P.pausedAt = 0 } vis && vis.play().catch(() => {}); if (P.pv && P.pv !== vis) P.pv.play().catch(() => {}); if (P.voice.src && !P.voice.ended && P.voice.currentTime > 0) P.voice.play().catch(() => {}); score.play().catch(() => {}) }
  else { P.pausedAt = performance.now(); V.forEach(v => v.pause()); P.voice.pause(); score.pause() }
}
function tick() {
  requestAnimationFrame(tick);
  const s = P.shots[P.j]; if (!s || !P.playing) return;
  const el = (performance.now() - P.start) / 1000;
  const vis = V.find(v => v.classList.contains('on'));
  // an answer ends where its sentence ends; a place that runs out hands over to the next clip of the place
  if (s.kind === 'answer' && vis && vis.currentTime >= +vis.dataset.end) { vis.pause() }
  if (P.pv && !P.handing && P.pv.currentTime >= +P.pv.dataset.end) handover();
  // the score sits under everything, lower under any voice
  const speaking = (!P.voice.paused && !P.voice.ended) || s.kind === 'answer'; score.volume += ((speaking ? .05 : .14) - score.volume) * .05;
  const st = $('#strip u'); if (st) st.style.left = ((s.t0 + Math.min(el, s.dur)) / P.shots.total * 100) + '%';
  const voiceDone = !s.ai || P.voice.ended || P.voice.paused;
  const ansDone = s.kind !== 'answer' || (vis && (vis.paused || vis.ended));
  if (el >= s.dur && voiceDone && ansDone) next(true);
}
// a place clip ran out: only the picture changes (the voice and the clock run on)
function handover() {
  const ep = EPS[E], from = P.pidx, to = (from + 1) % ep.places.length, old = P.pv; P.handing = true;
  placeVideo(ep, to).then(v => {
    P.handing = false; if (P.pidx !== from) return;
    v.volume = old.volume; v.muted = false; if (P.playing) v.play().catch(() => {});
    const cur = P.shots[P.j]; if (cur.kind !== 'answer') show(v, true);
    old.pause(); P.pv = v; P.pidx = to;
    P.shots.slice(P.j).forEach(x => { if (x.place === from) x.place = to });
    if (cur.kind !== 'answer') { const c = ep.places[to]; $('#tags').textContent = `${c.ti}${c.y ? ' (' + c.y + ')' : ''}` }
  });
}
function next(auto) { if (P.j < P.shots.length - 1) go(P.j + 1); else episode(E + 1) }
function episode(n) {
  E = (n + EPS.length) % EPS.length; const ep = EPS[E];
  P.shots = program(ep); P.pidx = -1; P.ansNext = null;
  $('#ep b').textContent = ep.name; $('#ep span').textContent = `${E + 1}/${EPS.length} · ${(ep.series || ep.genre || '').toUpperCase()}`;
  const g = D.grades[ep.grade] || {}; V.forEach(v => v.style.filter = g.f || 'none'); $('#tint').style.background = g.tint || 'transparent'; $('#tint').style.opacity = (g.mix || 0) * .7;
  if (ep.score && !score.src.endsWith(ep.score)) { score.src = ep.score; if (P.playing) score.play().catch(() => {}) }
  drawStrip(); renderBooks(); go(0);
}
function drawStrip() {
  const T = P.shots.total;
  $('#strip').innerHTML = P.shots.map((s, j) => `<i data-j="${j}" style="left:${s.t0 / T * 100}%;width:calc(${s.dur / T * 100}% - 1px);background:${KIND[s.kind].c}"></i>`).join('') + '<u></u>';
}
function markStrip() { $$('#strip i').forEach(x => x.classList.toggle('on', +x.dataset.j === P.j)) }
$('#strip').onclick = e => { const r = $('#strip').getBoundingClientRect(), t = (e.clientX - r.left) / r.width * P.shots.total; const j = P.shots.findIndex(s => t < s.t0 + s.dur); if (j >= 0) go(j) };
function renderBooks() {
  $('#bk').innerHTML = EPS.map((ep, n) => `<button class="bn ${n === E ? 'cur' : ''}" data-n="${n}"><img src="${ep.thumb}" alt="" loading="lazy"><span class="n">${String(n + 1).padStart(2, '0')}</span><span class="t">${esc(ep.name)}</span></button>`).join('');
  $$('#bk .bn').forEach(b => b.onclick = () => { $('#books').classList.remove('on'); begin(); episode(+b.dataset.n); setPlaying(true) });
}
function drawMode() { const m = MODES[MODE]; $('#mode').innerHTML = m.c.map(c => `<i style="background:${c}"></i>`).join('') + m.n }
let tT; function toast(m) { $('#toast').textContent = m; $('#toast').classList.add('on'); clearTimeout(tT); tT = setTimeout(() => $('#toast').classList.remove('on'), 2600) }
let begun = false;
function begin() {
  if (begun) return; begun = true; document.body.classList.add('go');
  [...V, P.voice, score].forEach(m => { try { const p = m.play(); p && p.then(() => { if (m !== V.find(v => v.classList.contains('on'))) m.pause() }).catch(() => {}) } catch (e) {} });   // phones: every player is unlocked by this one tap
}
$('#play').onclick = () => { begin(); setPlaying(true); go(P.j) };
$('#kplay').onclick = () => { begin(); setPlaying(!P.playing) };
$('#knext').onclick = () => { begin(); next() };
$('#kprev').onclick = () => { begin(); P.j > 0 ? go(P.j - 1) : episode(E - 1) };
$('#mode').onclick = () => { MODE = (MODE + 1) % 3; try { localStorage.setItem('found.mode', MODE) } catch (e) {} drawMode(); const t = P.shots[P.j] ? P.shots[P.j].t0 : 0; P.shots = program(EPS[E]); drawStrip(); const j = Math.max(0, P.shots.findIndex(s => s.t0 + s.dur > t * (P.shots.total / (P.shots.total || 1)))); go(j); toast(MODES[MODE].n) };
$('#kbooks').onclick = $('#ep').onclick = () => $('#books').classList.add('on');
$('#kclose').onclick = () => $('#books').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); $('#kplay').click() } else if (e.key === 'ArrowRight') $('#knext').click(); else if (e.key === 'ArrowLeft') $('#kprev').click() });
const tot = EPS.reduce((t, ep) => t + program(ep).total, 0); $('#runtime').textContent = `${EPS.length} EPISODES · ${Math.round(tot / 60)} MINUTES · ${MODES[MODE].n}`;
drawMode(); const m = location.hash.match(/e=(\d+)/); episode(m ? +m[1] - 1 : 0); tick();
</script>
