<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Odyssey · Episode 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="explain/film.css?v=3"><link rel="stylesheet" href="explain/episode.css?v=2">
<!-- CINEOSIS · EPISODE 4 · THE ODYSSEY. Homer asks; the archive answers in its own recorded words. How a scene is turned into
     questions, what the archive sends back, how a line finds what the archive says, a critic's verdict on what is missing, and the
     flock that served two books. All from the Odyssey's own files (explain/ep4.py → explain/ep/ep4.json). -->
<style>
.id-ody { position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 120%, #1d2d6b, #050816 70%); display: flex; flex-direction: column; justify-content: center; padding: 0 140px; gap: 16px; }
.id-ody::before, .id-ody::after { content: ''; position: absolute; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(90deg, #6f8cff 0 22px, transparent 22px 44px); opacity: .5; }
.id-ody::before { top: 40px; } .id-ody::after { bottom: 40px; }
.id-ody h1 { margin: 0; font: 600 130px/1 var(--serif); color: #8ea6ff; letter-spacing: .03em; } .id-ody small { font: 600 16px var(--mono); letter-spacing: .2em; color: #a8b6e8; }
.scgrid { position: absolute; inset: 40px 50px 150px; display: grid; grid-template-columns: repeat(19, 1fr); gap: 3px; }
.scgrid i { aspect-ratio: 4/3; background-size: cover; background-position: center; opacity: 0; animation: fade .3s ease forwards; border-bottom: 2px solid #6f8cff55; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><p style="font:600 16px var(--mono);letter-spacing:.2em;color:var(--dim);margin:0 0 14px">CINEOSIS · EPISODE 4</p><h1>The Odyssey</h1><p>Homer asks. The archive answers in its own recorded words. About seven minutes, with sound.</p><b>▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script>
window.EPISODE = {
  data: ['explain/ep/ep4.json?v=1'],
  cues: ['dae-odin-above-the-breakers', 'dae-compass-spin-in-heavy-fog', 'dae-cold-current-paddle', 'dae-preparation-drift', 'dae-salvaged-timber', 'dae-snowbound-umea-cabin', 'dae-slide-carousel-at-blue-hour'],
  build([O], B, K) {
    const { esc, fmt, line, later, raf, typeIn, startVideos, scene } = K;
    const P = Object.fromEntries(O.play.map(p => [p.id, p])), BL = P['OD-B09-S09'], G0 = P['OD-B01-S01'];
    const span = (sc, ls) => [Math.max(0, ls[0].at - .3), ls.at(-1).aend + .8];
    const playB = (ch, sc, ls, extra = '') => { const [a, b] = span(sc, ls); B(ch, b - a + .6, () => `<div class="scn"></div><div class="subl"></div>${extra}`, el => scene(el, sc, a, b, ls), { voice: true }); };
    /* cold open: the Blinding */
    playB('Homer asks', BL, BL.lines);
    B('Homer asks', 10, () => `<div class="scn"></div><div class="otitle"><b>The Odyssey</b><span>after Homer · the archive answers in its own recorded words</span></div>`, el => { K.scene(el, P['OD-B12-S03'], 0, 10, []); K.voice().volume = .35; });
    B('Homer asks', 10, () => `<div class="scgrid">${O.scenes.map((s, i) => `<i title="${esc(s.title)}" style="background-image:url('${esc(s.thumb)}');animation-delay:${i * .03}s"></i>`).join('')}</div>${line([`Twenty-four books, cut into <b style="color:#8ea6ff">${O.count.scenes}</b> scenes.`, `${fmt(O.count.lines)} lines.`])}`);
    /* how a scene asks */
    const S0 = O.spec;
    B('How a scene asks', 9, () => `<div class="big2" style="color:#8ea6ff">${esc(S0.title)}</div><div class="big2 fadein" style="top:220px;font:400 40px/1.35 var(--serif);color:#e8e4da;animation-delay:1s">${esc(S0.card)}</div>${line(['Each scene starts as a sentence of the story.'])}`);
    B('How a scene asks', 13, () => `<div class="big2" style="font:400 22px var(--mono);color:var(--dim);letter-spacing:.1em">A LANGUAGE MODEL DESCRIBES THE WORLD THE CAMERA NEEDS</div><div class="big2" style="top:170px;font:400 38px/1.35 var(--serif);color:#dfe6ff" id="w"></div>
        <div class="roles" style="top:420px">${['ground', 'action', 'figures', 'sign'].map((r, i) => `<div style="animation-delay:${5 + i * 1.3}s"><b>${r.toUpperCase()}</b><p>“${esc(S0.roles[r][0])}”</p></div>`).join('')}</div>`, el => later(400, () => typeIn(K.$('#w', el), S0.world, 40)));
    B('How a scene asks', 9, () => `<div class="roles" style="top:160px;grid-template-columns:1fr 1fr">${[['GROUND', 'the place, nearly empty'], ['ACTION', 'what happens, with names replaced by what a camera sees'], ['FIGURES', 'single subjects worth cutting out'], ['SIGN', "the scene's cinematic sign, as an operation"]].map(([r, d], i) => `<div style="animation-delay:${i * .6}s"><b>${r}</b><p>${d}</p></div>`).join('')}</div>${line(['Four kinds of question for every scene.'])}`);
    Object.entries(O.answers).forEach(([q, hits]) => B('How a scene asks', 13, () => `<div style="--c:#6f8cff"><div class="sbar"><i></i><span id="q"></span></div><div class="who">The Odyssey<em>1 October · ${esc(S0.title)}</em></div>
        <div class="sheet">${hits.map((h, i) => `<figure style="animation-delay:${2.6 + i * .2}s"><img src="${esc(h.thumb)}"><figcaption>${esc(h.title)} ${esc(h.year || '')}</figcaption></figure>`).join('')}</div></div>`, el => later(300, () => typeIn(K.$('#q', el), q))));
    B('How a scene asks', 11, () => `<canvas class="full" id="cv" width="1600" height="900"></canvas>${line([`Every scene asked like this, one question at a time: <b style="color:#8ea6ff">${fmt(O.count.questions)}</b> questions.`, `${fmt(O.count.clips)} shots came back, from ${fmt(O.count.films)} films.`])}`,
      el => { const g = K.$('#cv', el).getContext('2d'); raf(t => { const n = Math.min(4000, Math.floor(t * 900)); g.fillStyle = '#000'; g.fillRect(0, 0, 1600, 900); g.fillStyle = 'rgba(111,140,255,.8)'; for (let i = 0; i < n; i++) { const a = i * 2.39996, r = 9 * Math.sqrt(i); g.fillRect(800 + r * Math.cos(a), 360 + r * Math.sin(a) * .6, 3, 3); } return t < 5; }); });
    /* the archive answers */
    B('The archive answers', 9, () => line(['Then each line of Homer listens for something the archive itself says:', 'a sentence spoken in one of its films.']).replace('class="line"', 'class="line" style="bottom:auto;top:330px"'));
    B('The archive answers', 12, () => `<div class="roles" style="top:200px;grid-template-columns:1fr">${[['CLOSE IN MEANING', 'the sentence means something near the line'], ['SHARES ITS WORDS', 'it says some of the line\'s own words, or their kin'], ['A VOICE THAT FITS', 'a woman for Athena, a man for the Cyclops'], ['FOLLOWS THE LAST SOUND', 'it sounds like it belongs after the clip before'], ['NEVER TWICE', 'a sentence used once is not used again']].map(([r, d], i) => `<div style="animation-delay:${i * 1.1}s;--c:var(--gold)"><b>${r}</b><p>${d}</p></div>`).join('')}</div>`);
    playB('The archive answers', G0, G0.lines);
    /* the critic */
    const Cp = O.captain;
    B('The critic', 15, () => `<div class="scn"></div><div style="position:absolute;inset:0;background:rgba(0,0,0,.6)"></div><div class="diag"><p class="ask">The scene asks: ${esc(Cp.asks)}</p>${Cp.diagnosis.map((d, i) => `<p style="animation-delay:${2.5 + i * 2.4}s">${esc(d)}</p>`).join('')}</div>${line(['A critic watches each scene and writes down what is missing.'])}`,
      el => { scene(el, G0, 0, 16, []); K.voice().volume = .25; });
    B('The critic', 12, () => `<div class="scn"></div><div class="verdicts">${Cp.shots.map((s, i) => `<div style="--vc:${s.verdict === 'KEEP' ? '#7fd6a4' : s.verdict === 'REPLACE' ? '#f2c14e' : '#ff8a7e'};animation-delay:${i * 1.6}s"><b>SHOT ${i + 1} · ${esc(s.verdict)}</b><p><span style="color:var(--dim)">${esc(s.seen)}.</span> ${esc(s.why)}</p></div>`).join('')}</div>`,
      el => { scene(el, G0, 0, 13, []); K.voice().volume = .2; });
    const AF = P['OD-B22-S01'];
    playB('The critic', AF, AF.lines, `<div class="diag" style="top:60px"><p style="animation-delay:4s;font-size:26px">${esc(O.captain22.diagnosis[0])}</p></div>`);
    /* the flock */
    B('The flock', 13, () => `<video class="full" data-src="${esc(O.sheep.video)}" data-t="2" muted playsinline loop></video><div class="fog"></div>${line([`Book 9 asked for <i>${esc(O.sheep.uses[0])}</i>.`, `Book 11 asked for <i>${esc(O.sheep.uses[1])}</i>.`, 'The archive gave this flock to both.'])}`, el => startVideos(el));
    B('The flock', 10, () => `<video class="full" data-src="${esc(O.sheep.video)}" data-t="6.5" muted playsinline loop></video><div class="fog"></div>${line(['There are no men in the wool.', 'Watched whole, the dark one is a sheepdog.'])}`, el => startVideos(el));
    /* the voyage */
    ['OD-B11-S01', 'OD-B12-S03'].forEach(k => playB('The voyage', P[k], P[k].lines, `<div class="ident" style="--c:#8ea6ff;bottom:auto;top:50px"><b style="font-size:34px">${esc(P[k].title)}</b><span>book ${esc(String(P[k].book))}</span></div>`));
    /* what is left */
    B('What is left', 12, () => line(['The archive has no Cyclops, no gods, no archer in a doorway.', 'Every scene is an approximation, and the gaps are where the film happens.'], 'what if a scene asked for what the archive actually holds?'));
    B('What is left', 11, () => `<div class="roles" style="top:150px;grid-template-columns:1fr 1fr">${[['GATHERING', `${fmt(O.count.questions)} questions, sent one at a time, never in parallel`], ['LISTENING', 'every clip with speech transcribed, so a line can find a sentence'], ['CRITIC', `${O.count.scenes} scenes watched and judged: keep, replace, or nothing fits`], ['NEXT', 'match motion, not only looks: oars, waves, a door opening (a model that learns from video)']].map(([r, d], i) => `<div style="animation-delay:${i * .8}s;--c:#8ea6ff"><b>${r}</b><p>${d}</p></div>`).join('')}</div>`);
    B('What is left', 40, () => `<div class="next"><small>WATCH THE WHOLE ODYSSEY · ${O.count.scenes} SCENES</small><h1 style="color:#8ea6ff">The Found Odyssey</h1><nav><a href="found-odyssey-museum.html" style="background:#8ea6ff">Open the museum</a><a class="ghost" href="series.html">All episodes</a><a class="ghost" href="episode-1.html">Episode 1</a></nav></div>`);
  }
};
</script>
<script src="explain/player.js?v=9"></script>
</body>
</html>
