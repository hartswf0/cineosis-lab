<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Myth</title>
<meta name="description" content="A film about the films of Cineosis Lab: what fifteen hundred archive films were made for, and what the lab made them into. Side by side, in their own sound, with a D-A-E score.">
<meta property="og:title" content="The Myth · Cineosis Lab"><meta property="og:description" content="What the archive's films were made for, and what we made them into.">
<meta property="og:image" content="https://hartswf0.github.io/cineosis-lab/lab/myth/ui/cast.jpg"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#f3ebe0;--dim:#9c9083;--gold:#f2c14e;--made:#7fb6d9;--into:#ff7a45}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%;background:#000;color:var(--ink);font:13px/1.4 ui-monospace,'IBM Plex Mono',Menlo,monospace;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
/* the frame: always 16:9, as large as the window allows, never stretched */
#stage{position:relative;width:min(100vw,calc((100dvh - 64px) * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden}
.layer{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.layer.on{opacity:1}
.layer video,.layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.layer video.fit{object-fit:contain}
.split{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#000}
.panel{position:relative;overflow:hidden;background:#000}
.panel .tag{position:absolute;left:10px;top:10px;font-size:clamp(9px,1.25vw,12px);letter-spacing:.16em;padding:3px 8px;border-radius:2px;color:#000;background:var(--c);z-index:2}
.panel .role{position:absolute;left:10px;right:10px;bottom:10px;font:italic clamp(11px,1.5vw,15px)/1.3 Georgia,serif;color:#fff;text-shadow:0 1px 3px #000;z-index:2}
.grid{display:grid;gap:2px;background:#000}
.grid > div{position:relative;overflow:hidden}
.grid small{position:absolute;left:6px;bottom:5px;font-size:clamp(8px,1vw,10px);letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.6);padding:1px 5px;z-index:2}
.live,.lpanel{overflow:hidden;background:#000}
.live iframe,.lpanel iframe,.live4 iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;background:#0b0a09}
.live4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#000}
.live4 > div{position:relative;overflow:hidden}
.ui img{animation:drift 14s ease-in-out both}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-3%)}}
@media (prefers-reduced-motion:reduce){.ui img{animation:none}}
.ui::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75))}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:5%;background:#000}
.card h1{font:clamp(26px,6vw,74px)/.95 'Arial Black',Impact,sans-serif;letter-spacing:.01em}
.card p{color:var(--dim);font-size:clamp(11px,1.6vw,15px);letter-spacing:.08em}
.card a{color:var(--gold);font-size:clamp(12px,1.6vw,15px);letter-spacing:.14em;text-decoration:none;border:1px solid var(--gold);padding:8px 16px;border-radius:20px;pointer-events:auto}
/* words stay small and low, so the pictures are seen */
#cap{position:absolute;left:12px;top:10px;font-size:clamp(9px,1.2vw,12px);letter-spacing:.12em;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:2px;z-index:5;max-width:70%;transition:opacity .5s}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none;z-index:4;opacity:var(--band,0);transition:opacity .5s}
#sub{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);width:min(78%,880px);text-align:center;font:500 clamp(12px,1.7vw,17px)/1.35 'Helvetica Neue',Arial,sans-serif;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.9);z-index:5;transition:opacity .4s}
#sub.voice{font:italic clamp(12px,1.7vw,17px)/1.35 Georgia,serif;color:#ffe9cf}
#sub i{display:block;font:normal clamp(8px,1vw,10px) ui-monospace,monospace;letter-spacing:.18em;color:var(--dim);margin-bottom:2px}
#start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 45%,#16120e,#000 70%)}
#start h1{font:clamp(38px,9vw,110px)/.9 'Arial Black',Impact,sans-serif}
#start p{color:var(--dim);max-width:46ch;font-size:clamp(11px,1.5vw,14px)}
.go{display:inline-flex;align-items:center;gap:10px;font:700 13px ui-monospace,monospace;letter-spacing:.16em;padding:13px 26px;border-radius:26px;background:var(--gold);color:#000}
.go svg{width:16px;height:16px;fill:currentColor}
#bar{width:min(100vw,calc((100dvh - 64px) * 16 / 9));display:flex;align-items:center;gap:10px;padding:0 12px;min-height:40px}
#bar button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid #2b2520}
#bar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#acts{flex:1;display:flex;gap:3px;min-width:0}
#acts span{flex:1;height:4px;border-radius:2px;background:#2b2520;position:relative;overflow:hidden}
#acts span i{position:absolute;inset:0;width:0;background:var(--gold)}
#now{font-size:10.5px;letter-spacing:.12em;color:var(--dim);white-space:nowrap;max-width:34%;overflow:hidden;text-overflow:ellipsis}
#bar a{color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-decoration:none;white-space:nowrap}
</style></head><body>
<div id="wrap">
  <div id="stage">
    <div id="cap"></div><div id="sub"></div>
    <div id="start"><h1>THE MYTH</h1><p>A film about the films of Cineosis Lab. What fifteen hundred archive films were made for, and what we made them into. About twenty minutes, with sound.</p>
      <button class="go" id="go"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>PLAY</button><small id="load" style="color:var(--dim)">loading…</small></div>
  </div>
  <div id="bar">
    <button id="pp" aria-label="Pause"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14M16 5v14"/></svg></button>
    <button id="prevb" aria-label="Back one shot"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
    <button id="nextb" aria-label="Forward one shot"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    <div id="acts"></div><span id="now"></span><a href="rushes.html#myth">CUT IT IN RUSHES</a>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1&&!/Chrome/.test(navigator.userAgent));
let F=null,I=0,RUN=0,PAUSED=false,layer=null;
const sleep=(ms,run)=>new Promise(r=>{const t0=performance.now();const tick=()=>{if(run!==RUN)return r(false);if(PAUSED){setTimeout(tick,120);return}if(performance.now()-t0>=ms)return r(true);setTimeout(tick,60)};tick()});
/* ---------- the score: one D-A-E cue an act, crossfaded, ducked under every voice ---------- */
let AC=null,cueEls={},curAct=-1;const BED=.42,UNDER=.11,LOUD=.3;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==="suspended")AC.resume()}
function cue(act){const c=F.cues[String(act)];if(!c)return null;if(!cueEls[act]){const el=new Audio(c[0]);el.loop=true;el.preload="auto";const g=AC.createGain();g.gain.value=0;AC.createMediaElementSource(el).connect(g).connect(AC.destination);cueEls[act]={el,g}}return cueEls[act]}
function setAct(act){if(act===curAct)return;const old=cueEls[curAct];if(old){old.g.gain.setTargetAtTime(0,AC.currentTime,1.2);setTimeout(()=>old.el.pause(),5000)}
  curAct=act;const n=cue(act);if(n){n.el.currentTime=0;n.el.play().catch(()=>{});n.g.gain.setTargetAtTime(BED,AC.currentTime,1.4)}
  [...$("acts").children].forEach((s,i)=>s.firstChild.style.width=i<act?"100%":i===act?"50%":"0")}
function duck(level,secs=.5){const n=cueEls[curAct];if(n)n.g.gain.setTargetAtTime(level,AC.currentTime,secs/3)}
/* ---------- the pictures ---------- */
function vid(t,{sound=false,fit=false}={}){const v=document.createElement("video");v.playsInline=true;v.muted=!sound||IOS&&!sound;v.preload="auto";v.src=t.v+(t.in?`#t=${t.in}`:"");if(fit)v.className="fit";v.volume=sound?1:0;return v}
function fade(v,to,secs=.8){clearInterval(v._f);if(IOS){v.muted=to<.02;return}const from=v.volume,t0=performance.now();v._f=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/(secs*1000));v.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k>=1)clearInterval(v._f)},40)}
/* a sequence of tiles in one frame: each plays to its own length, then the next; the run loops until the shot ends */
function seq(box,tiles,{sound=false,vol=1}={}){let k=0,stop=false;const v=vid(tiles[0],{sound});v.volume=sound?vol:0;box.appendChild(v);
  const next=()=>{if(stop)return;k=(k+1)%tiles.length;const t=tiles[k];
    if(tiles.length===1){try{v.currentTime=t.in||0}catch(e){}v.play().catch(()=>{});return}   // one clip: start it again
    v.src=t.v;v.addEventListener("loadedmetadata",()=>{try{v.currentTime=t.in||0}catch(e){}v.play().catch(()=>{})},{once:true})};
  const watch=setInterval(()=>{const t=tiles[k];if(v.ended||(t.d&&v.currentTime-(t.in||0)>=t.d))next()},150);v.onended=next;v.play().catch(()=>{});
  return {v,stop(){stop=true;clearInterval(watch);v.pause()}}}
/* ---------- the interfaces, live: a lab page drawn at desktop size, scaled into the frame, and driven ---------- */
function frame(box,page,steps,run,w=1600,h=900){const f=document.createElement("iframe");f.src=page;f.width=w;f.height=h;f.setAttribute("allow","autoplay");f.title="Cineosis Lab interface";
  const fit=()=>{const r=box.getBoundingClientRect();const k=Math.max(r.width/w,r.height/h);f.style.transform=`scale(${k})`;f.style.left=`${(r.width-w*k)/2}px`;f.style.top=`${(r.height-h*k)/2}px`};
  box.appendChild(f);requestAnimationFrame(fit);new ResizeObserver(fit).observe(box);
  f.addEventListener("load",()=>drive(f,steps||[],run),{once:true});return f}
async function drive(f,steps,run){let doc;try{doc=f.contentDocument}catch(e){return}if(!doc)return;
  const W=f.contentWindow,live=()=>run===RUN&&f.isConnected;
  for(const st of steps){if(!live())return;try{
    if(st.wait)await sleep(st.wait,run);
    if(st.click){const el=doc.querySelector(st.click);if(el)el.click()}
    if(st.mute){const P=W.HTMLMediaElement&&W.HTMLMediaElement.prototype;   // everything the page plays plays silently, even sound it makes in code
      if(P&&!P._mythMuted){const orig=P.play;P.play=function(){this.muted=true;return orig.call(this)};P._mythMuted=1}
      const m=()=>{if(!f.isConnected)return clearInterval(t);doc.querySelectorAll("video,audio").forEach(x=>{x.muted=true})};m();const t=setInterval(m,400)}
    if(st.scroll){const y0=W.scrollY,t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/5000);W.scrollTo(0,y0+st.scroll*k*k*(3-2*k));if(k<1&&live())requestAnimationFrame(step)};step()}
    if(st.find){const want=st.find.toLowerCase();let el=null;
      for(let k=0;k<25&&!el&&live();k++){el=[...doc.querySelectorAll(".card,.t,b,h2,h3,article,li")].find(x=>x.children.length<12&&(x.textContent||"").toLowerCase().includes(want));if(!el)await sleep(300,run)}
      if(el){const card=el.closest(".card")||el;card.scrollIntoView({behavior:"smooth",block:"center"});await sleep(1600,run);const pic=card.querySelector(".pic,video,button");if(pic&&pic.click)pic.click()}}
  }catch(e){}}}
function show(b){const L=document.createElement("div");L.className="layer";const ctl=[];
  if(b.lay==="card"){L.classList.add("card");L.innerHTML=`<h1>${esc(b.card)}</h1>${b.sub?`<p>${esc(b.sub)}</p>`:""}${b.link?`<a href="${esc(b.link)}">${esc(b.sub||"open")}</a>`:""}`}
  else if(b.lay==="ui"){L.classList.add("ui");L.innerHTML=`<img alt="" src="${esc(b.ui)}">`}
  else if(b.lay==="live"){L.classList.add("live");frame(L,b.page,b.steps,RUN)}
  else if(b.lay==="live4"){L.classList.add("live4");b.pages.forEach(p=>{const d=document.createElement("div");L.appendChild(d);frame(d,p.page,p.steps,RUN)})}
  else if(b.lay==="full"||b.lay==="long"){const s=seq(L,b.tiles,{sound:true});ctl.push(s);L._v=s.v}
  else if(b.lay==="split"){L.classList.add("split");
    const P=(tiles,tag,c,role,img)=>{const p=document.createElement("div");p.className="panel";p.style.setProperty("--c",c);
      if(tiles&&tiles.length){const s=seq(p,tiles,{sound:false});ctl.push(s)}else if(img){p.innerHTML=`<img alt="" src="${esc(img)}" style="opacity:.55">`}
      p.insertAdjacentHTML("beforeend",`<span class="tag">${esc(tag)}</span>${role?`<span class="role">${esc(role)}</span>`:""}`);return p};
    L.appendChild(P(b.left,b.lcap,"var(--made)"));
    if(b.live){const p=document.createElement("div");p.className="panel lpanel";p.style.setProperty("--c","var(--into)");L.appendChild(p);frame(p,b.live.page,b.live.steps,RUN,1280,720);
      p.insertAdjacentHTML("beforeend",`<span class="tag">${esc(b.rcap)} · LIVE</span>`)}
    else L.appendChild(P(b.right,b.rcap,"var(--into)",null,b.ui))}
  else if(b.lay==="mosaic"){L.classList.add("grid");const items=b.ui4?b.ui4.map(u=>({img:u})):b.tiles,n=items.length,c=n<=4?2:n<=9?3:4;
    L.style.gridTemplateColumns=`repeat(${c},1fr)`;L.style.gridTemplateRows=`repeat(${Math.ceil(n/c)},1fr)`;
    items.forEach((t,i)=>{const d=document.createElement("div");if(t.img)d.innerHTML=`<img alt="" src="${esc(t.img)}">`;else{const s=seq(d,[{...t,d:null}],{sound:false});ctl.push(s);s.v.style.animationDelay=i*.15+"s"}
      if(t.label)d.insertAdjacentHTML("beforeend",`<small>${esc(t.label)}</small>`);L.appendChild(d)})}
  $("stage").insertBefore(L,$("cap"));requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add("on")));
  const old=layer;layer={L,ctl};if(old){if(old.L._v)fade(old.L._v,0,.9);setTimeout(()=>{old.ctl.forEach(c=>c.stop());old.L.querySelectorAll("iframe").forEach(f=>{f.src="about:blank"});old.L.remove()},1100)}
  return layer}
/* ---------- the voices ---------- */
const NAMES={am_fenrir:"THE LAB",bm_george:"THE HISTORY",am_michael:"THE MYTH"};
let nar=null;
function say(b,run){if(!b.a)return Promise.resolve(0);if(!nar){nar=new Audio();}nar.src=b.a;$("sub").className="";$("sub").innerHTML=`<i>${NAMES[b.voice]||""}</i>${esc(b.line)}`;
  return new Promise(r=>{let done=false;const end=()=>{if(!done){done=true;r(1)}};nar.onended=end;nar.play().catch(end);setTimeout(end,((b.ad||8)+2)*1000)})}
/* ---------- one shot ---------- */
async function play(i,run){const b=F.beats[i];I=i;setAct(b.act);$("now").textContent=(b.cap||b.card||b.lcap||"").toUpperCase();
  $("stage").style.setProperty("--band",/live|ui|mosaic|split/.test(b.lay)?1:.55);
  $("sub").innerHTML="";$("cap").textContent=b.cap||"";$("cap").style.opacity=b.cap?1:0;
  const lay=show(b),v=lay.L._v,t0=performance.now();
  if(b.lay==="full"&&v){
    if(b.speak){const pre=b.line&&b.a?(b.ad||4)+.6:0;   // the narrator first, over the picture running silent toward the moment; then the film's people speak
      v.volume=0;v.muted=true;v.addEventListener("loadedmetadata",()=>{try{v.currentTime=Math.max(0,b.speak[0]-1.6-pre)}catch(e){}},{once:true});
      if(b.line){duck(UNDER);await say(b,run);if(run!==RUN)return}
      $("sub").className="voice";$("sub").innerHTML=b.answer?`<i>AN ANSWER</i>`:"";v.muted=false;fade(v,1,1);duck(UNDER);
      v.onended=null;v.loop=false;const lastT={t:-1,n:0};
      while(run===RUN&&performance.now()-t0<60000){const d=v.duration||1e9,t=v.currentTime;
        if(t>=Math.min(b.speak[1]+2.4,d-.08)||v.ended)break;
        lastT.n=Math.abs(t-lastT.t)<.01&&!PAUSED?lastT.n+1:0;lastT.t=t;if(lastT.n>30)break;await sleep(120,run)}
      duck(BED,1.6)}
    else{v.volume=.25;if(b.line){duck(UNDER);await say(b,run);duck(BED,1.2)}fade(v,1,1.2);await sleep(Math.max(0,b.hold*1000-(performance.now()-t0)),run)}
    return}
  if(b.lay==="long"){duck(LOUD,1);await sleep(b.hold*1000,run);duck(BED,1.2);return}
  if(b.line){duck(UNDER);await say(b,run);duck(BED,1.2)}
  await sleep(Math.max(1200,b.hold*1000-(performance.now()-t0)),run)}
async function runFrom(i){const run=++RUN;$("start").hidden=true;audio();
  for(let k=i;k<F.beats.length;k++){if(run!==RUN)return;await play(k,run);$("sub").innerHTML=""}
  if(run===RUN){duck(0,3);$("now").textContent="THE END"}}
$("go").onclick=()=>runFrom(0);
$("pp").onclick=()=>{PAUSED=!PAUSED;$("ppi").innerHTML=PAUSED?'<path d="M7 5v14l12-7z"/>':'<path d="M8 5v14M16 5v14"/>';
  document.querySelectorAll("video").forEach(v=>PAUSED?v.pause():v.play().catch(()=>{}));if(nar)PAUSED?nar.pause():nar.play().catch(()=>{});
  Object.values(cueEls).forEach(c=>PAUSED?c.el.pause():(c===cueEls[curAct]&&c.el.play()))};
$("nextb").onclick=()=>{if(nar)nar.pause();runFrom(Math.min(F.beats.length-1,I+1))};
$("prevb").onclick=()=>{if(nar)nar.pause();runFrom(Math.max(0,I-1))};
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();$("start").hidden?$("pp").click():$("go").click()}if(e.key==="ArrowRight")$("nextb").click();if(e.key==="ArrowLeft")$("prevb").click()});
fetch("myth/film.json").then(r=>r.json()).then(f=>{F=f;const acts=Math.max(...f.beats.map(b=>b.act))+1;
  $("acts").innerHTML=Array.from({length:acts},()=>"<span><i></i></span>").join("");
  const secs=f.beats.reduce((a,b)=>a+Math.max(b.hold||4,(b.ad||0)+1),0);$("load").textContent=`${f.beats.length} shots · about ${Math.round(secs/60)} minutes`}).catch(()=>$("load").textContent="The film could not load.");
</script></body></html>
