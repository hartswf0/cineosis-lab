.big{ display:flex; } .big .t{ height:clamp(40px, 8vh, 96px); }

  box-shadow:0 0 0 3px var(--mustard), 0 0 0 8px var(--red), 0 14px 30px #6a2a2a33; outline:5px dotted #f6e3a8; outline-offset:-7px; }

#cab.spin .reel:not(.landed) .stopb{ display:block; } #cab.spin .reel:not(.landed) .pl span, #cab.spin .reel:not(.landed) .star{ display:none; }
.reel .star{ opacity:.25; }
.reel .stopb{ display:none; flex:1; margin:2px 0 1px; padding:6px 0; border-radius:16px; background:var(--ink); color:var(--cream); font-size:clamp(10px, .9vw, 13px); letter-spacing:.3em; }
#cab.spin .reel:not(.landed) .stopb{ display:block; } #cab.spin .reel:not(.landed) .pl span, #cab.spin .reel:not(.landed) .star{ display:none; }
.reel .star{ font-size:clamp(24px, 2vw, 32px); }
.lever{ width:46px; height:100%; min-height:120px; position:relative; display:grid; justify-items:center; } .lever .slot{ position:absolute; top:22px; bottom:10px; width:10px; border-radius:5px; background:#5a1a22; }

.lever.down .arm{ top:52%; height:10%; } .lever:disabled{ cursor:wait; } .lever .lab{ position:absolute; bottom:-18px; font-size:9px; letter-spacing:.24em; color:var(--cream); }
.curtain{ position:absolute; top:0; bottom:0; width:51%; z-index:3; background:repeating-linear-gradient(90deg,#8e2632 0 14px,#a8323e 14px 22px,#7d1f2a 22px 30px); box-shadow:inset 0 -18px 24px #0004; transition:transform 1.4s cubic-bezier(.6,0,.2,1); pointer-events:none; }
.curtain.l{ left:0; } .curtain.r{ right:0; } #screen.open .curtain.l{ transform:translateX(-102%); } #screen.open .curtain.r{ transform:translateX(102%); }
.ticket{ position:fixed; left:50%; bottom:22%; z-index:9; width:230px; margin-left:-115px; padding:12px 10px; text-align:center; font:600 15px var(--sans); letter-spacing:.24em; color:var(--ink); background:var(--cream);
  border:2px dashed var(--red); outline:6px solid var(--cream); box-shadow:0 10px 30px #0003; animation:ticket 2.6s cubic-bezier(.2,.9,.3,1) forwards; pointer-events:none; }
.ticket small{ display:block; font-size:9px; letter-spacing:.3em; color:var(--red); margin:3px 0; } @keyframes ticket{ 0%{ transform:translateY(60px) rotate(-4deg); opacity:0; } 18%{ transform:translateY(0) rotate(-2deg); opacity:1; } 80%{ opacity:1; } 100%{ transform:translateY(-40px) rotate(1deg); opacity:0; } }
.keptl .strip{ opacity:1; margin-bottom:6px; } .empty{ text-align:center; color:var(--soft); font:italic 400 16px var(--serif); text-transform:none; letter-spacing:0; padding:14px 0; }

#cab.spin .reel:not(.landed) .stopb{ display:block; } #cab.spin .reel:not(.landed) .pl span, #cab.spin .reel:not(.landed) .star{ display:none; }
.reel .star{ font-size:24px; } header h1{ font-size:12px; letter-spacing:.3em; } #cap{ font-size:18px; line-height:1.25; } .tale{ font-size:.82em; color:var(--ink); opacity:.85; } .tale b{ color:var(--mustard); font-style:normal; margin:0 .2em; }
#cap small{ font-size:10.5px; letter-spacing:.16em; } #three{ gap:10px; } #why{ font-size:11.5px; letter-spacing:.1em; line-height:1.5; } nav{ gap:16px; } nav button{ font-size:12px; letter-spacing:.14em; } nav .main{ padding:10px 16px; } #hint{ font-size:13px; letter-spacing:.3em; } .mark{ width:46px !important; height:46px !important; font-size:20px !important; } .two{ grid-template-columns:1fr; } .taste{ grid-template-columns:repeat(4,minmax(0,1fr)); } }

<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MC = window.MonteCinema, W = { ...MC.CRITIC, yours: 0 }, VIDX = {}, NO = ['I', 'II', 'III'];
  let M = null, E = null, three = [], cur = 0, hist = [], kept = [], marks = {}, undo = null;
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }, save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
  kept = load('monte-kept', []); marks = load('monte-marks', {});
  const thumb = s => M.r2 + s.v.replace('/clips/', '/thumbnails/').replace('.mp4', '.jpg');
  const mutate = (g, s) => g.map(x => Math.min(1, Math.max(0, x + (Math.random() - .5) * s)));
  // ---- taste: marks become a direction; the critic's "yours" weighs it once there is any
  function retaste() { MC.taste(M, marks); W.yours = M.taste ? Math.max(W.yours, .2) : 0; three.forEach(f => MC.critic(M, f, W)); drawCritic(); }
  function mark(f, n, w) { const e = f.ev[n]; if (!e) return; const i = M.shots[e.k].i; marks[i] = marks[i] === w ? 0 : w; if (!marks[i]) delete marks[i]; save('monte-marks', marks); retaste(); drawThree();
    const fl = $('#flash'); fl.textContent = marks[i] ? (w > 0 ? '♥' : '✕') : '·'; fl.style.transition = 'none'; fl.style.opacity = .9; requestAnimationFrame(() => { fl.style.transition = 'opacity .7s'; fl.style.opacity = 0; }); }
  // ---- evolution, with the viewer on the committee
  function breed(start) { E = MC.evolve(M, { seed: Math.floor(Math.random() * 1e9), pop: 24, films: 6, critic: W, start }); }
  // every film begins differently and tells its own story: no opening, first chapter or first shot shared with its companions or the three before,
  // and no chapter card shared with its companions
  let lastStarts = [];
  const chapters = f => f.ev.filter(e => e.kind === 'card' && !e.end && M.middle.includes(e.k)).map(e => e.k);
