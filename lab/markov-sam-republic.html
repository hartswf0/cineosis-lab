"f":"republic/planes/ee2e5d/p0a","title":"Road Runners","year":1952,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/road-runners/clips/0000567801-0000579746.mp4","t":2.5,"cover":[0.45,0.18]},{"f":"republic/planes/ee2e5d/p0b","title":"SPACE AGE RAILROAD","year":1969,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/space-age-railroad/clips/0000587287-0000611578.mp4","t":20.5,"cover":[0.45,0.18]}]},{"q":"vast canyon landscape","alts":[{"f":"republic/planes/ee2e5d/p1a","title":"Amateur Film: West 1940","year":1940,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/628a8f21-4c41-5470-a5f9-41910f9784ff/v4-conditional-luna-1/clips/bed8c9b1-2883-51ef-bbba-1a7d45094723.mp4","t":12.0,"cover":[0.45,0.18]},{"f":"republic/planes/ee2e5d/p1b","title":"Nature's Cameo: Bryce Canyon National Park","year":1930,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/4c3fd6d8-a652-58ef-81f3-feeee8689715/v4-conditional-luna-1/clips/c0aa08b7-d5fc-5c84-8f71-0ce518afe5ff.mp4","t":15.0,"cover":[0.45,0.18]}]},{"q":"a lonely highway","alts":[{"f":"republic/planes/ee2e5d/p2a","title":"Scatter radar: Space research from the ground","year":1963,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/e8ccef6d-905c-59b4-8f99-01ccd76181b4/v5-windowed-clip-split-1/clips/4c31d5e1-ba15-55b3-a3ef-2c5f5d5fe020.mp4","t":0.3,"cover":[0.45,0.18]},{"f":"republic/planes/ee2e5d/p2b","title":"RESEARCH PROJECT X-15 THE DEVELOPMENT OF THE X-15","year":1962,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/73aa7933-64e4-5e90-89b9-b26d60505c0a/v5-windowed-clip-split-1/clips/8d120343-2f64-58e8-82dd-035194c92138.mp4","t":30.0,"cover":[0.45,0.18]}]}],"prop":{"f":"republic/planes/ee2e5d/prop.webp","w":171,"h":152,"cut":0,"title":"The Big Challenge - Apollo Era","year":1968},"beats":[{"k":"act","text":"A hyper-saturated sunrise over THE PLAINS OF SUBURBIA. Cul-de-sacs gleam like polished shields."},{"k":"line","who":"NARRATOR","how":"","text":"Observe… the Silver-Class Guardian… in his native range. Here, on the asphalt savannah, survival depends not on camouflage— but on certainty."},{"k":"act","text":"A SILVER-CLASS RANGER, STRYDER WALKER, stands beside a FORD F-150 that has been modified into a rolling shrine: bull horns on the grill, a glowing “AUDIT OF THE SOUL” dashboard, and a bumper sticker that reads: MY OTHER VEHICLE IS A METAPHOR."},{"k":"line","who":"NARRATOR","how":"","text":"The F-150, you will note, is not merely transportation. It is a symbol— a mobile altar to rugged individualism… owned communally, per Rule 08.01, which adds a delicious layer of cognitive strain."},{"k":"act","text":"Across the parking lot stands ANOTHER SILVER-CLASS RANGER, DAISY “THUMOS” JANE, polishing a chrome side mirror with a cloth like it’s a ritual dagger. Her belt carries a copy of The Republic—unopened, pristine."},{"k":"line","who":"NARRATOR","how":"","text":"Courtship begins with display. The Silver-Class cannot simply feel. They must first argue their feelings into legitimacy."},{"k":"act","text":"Stryder strides forward, boots crunching gravel like punctuation."},{"k":"line","who":"STRYDER","how":"","text":"Tell me, Ranger… what is an F-150?"},{"k":"line","who":"DAISY","how":"","text":"A tool."},{"k":"act","text":"Stryder smiles as if this is foreplay."},{"k":"line","who":"STRYDER","how":"","text":"And is a tool good… because it is a tool— or because it performs its function well?"},{"k":"line","who":"NARRATOR","how":"","text":"Here we see the signature maneuver: the Socratic Feint. It resembles conversation, but its true purpose is to establish hierarchy without admitting it."},{"k":"act","text":"Daisy snaps the cloth once, like a judge’s gavel."},{"k":"line","who":"DAISY","how":"","text":"It is good because it performs its function well."},{"k":"line","who":"STRYDER","how":"","text":"Then define its function."},{"k":"line","who":"NARRATOR","how":"","text":"The Bronze-Class, mercifully, have evolved a useful trait: they recognize danger… and keep walking."},{"k":"line","who":"DAISY","how":"","text":"Its function is to carry. To tow. To endure. To be ready."},{"k":"line","who":"STRYDER","how":"","text":"Ready for what?"},{"k":"line","who":"DAISY","how":"","text":"For anything."},{"k":"line","who":"NARRATOR","how":"","text":"Males of the Silver-Class will often test the sacred artifact. Not for safety. But to prove to one another— and to the watching cameras— that they are, in fact, worthy of the narrative."},{"k":"line","who":"DAISY","how":"","text":"If you insist on measuring, let us measure correctly."},{"k":"line","who":"STRYDER","how":"","text":"Define “correctly.”"},{"k":"line","who":"DAISY","how":"","text":"According to the Form of the Good."},{"k":"line","who":"STRYDER","how":"","text":"Is “ready for anything” courage… or merely paranoia?"},{"k":"line","who":"DAISY","how":"","text":"Is paranoia irrational… or simply prudence with a hat?"},{"k":"line","who":"STRYDER","how":"","text":"Is prudence a virtue…"},{"k":"line","who":"DAISY","how":"","text":"—or a justification?"},{"k":"line","who":"NARRATOR","how":"","text":"Notice how the debate grows. This is not conflict. It is synchronization. Two predators aligning their worldviews… until they can move as one."}],"voice":[{"f":"republic/voice/ee2e5d/00.m4a","d":11.89,"e":"0zwoxyxuyq0ryyxwvxvnzuxwwtywuwyvxqwzxr30","v":"bm_george"},{"f":"republic/voice/ee2e5d/01.m4a","d":7.47,"e":"0yyvwzxuyywxuzygwxzul00zyymozywtyoytm100","v":"bm_george"},{"f":"republic/voice/ee2e5d/02.m4a","d":10.69,"e":"0zztuzwtyv0zzwyp0tyxuvxw0zxxywvut9yxtq00","v":"bm_george"},{"f":"republic/voice/ee2e5d/03.m4a","d":18.34,"e":"tzyuyyxtxxwwvrzxyyw8zyzrzxwxxpzwxnwzvyp0","v":"bm_george"},{"f":"republic/voice/ee2e5d/04.m4a","d":15.77,"e":"uxuwzmyxwwpozxizwxwywmwxytzvxxrwywyuvwm0","v":"bm_george"},{"f":"republic/voice/ee2e5d/05.m4a","d":15.37,"e":"szywyzyxzrzyyzyryxyyxwvxyyv0zxzxxyrzvyp0","v":"bm_george"},{"f":"republic/voic 4555b51c9bc50f258b42.r2.dev/sources/eca4afbe-dd5d-5902-b5d5-6c351964055d/v3-ffmpeg-openclip-1/clips/d01a1213-8f7c-57dc-b117-faf6e5cb6fdc.mp4","t":6.0,"cover":[0.45,0.18]},{"f":"republic/planes/ff8611/p1b","title":"Back of the Mike","year":1938,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/back-of-the-mike/clips/0000504137-0000511544.mp4","t":0.5,"cover":[0.45,0.18]}]},{"q":"a dinosaur in a prehistoric landscape","alts":[{"f":"republic/planes/ff8611/p2a","title":"Gift of Green","year":1946,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/c7d650f0-f267-51db-b3b6-01aad1813382/v4-conditional-luna-1/clips/9f9ab035-8db9-57f5-b8e8-ab80c0d95863.mp4","t":2.6,"cover":[0.45,0.18]},{"f":"republic/planes/ff8611/p2b","title":"Fate of the forests, ca. 1980 - ca. 1985","year":null,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/387d2c8b-acd9-542f-91a3-d27f62edd75f/v5-windowed-clip-split-1/clips/77c4503a-169a-5461-be84-64db42bd6879.mp4","t":0.3,"cover":[0.45,0.18]}]}],"prop":{"f":"republic/planes/ff8611/prop.webp","w":402,"h":55,"cut":0,"title":"Century of Progress Exposition: Wings of a Century","year":1933},"beats":[{"k":"act","text":"A WAR-RIG made of welded street signs and dinosaur rib bones barrels across the sand, throwing up a dust plume that looks like a dying ideology."},{"k":"card","text":"WITNESS ME ACHIEVE THE FORM OF THE GOOD"},{"k":"act","text":"Ahead: a battered SILVER-CLASS TACTICAL JEEP—roll cage, harpoon launcher, “NO-PROPERTY / NO-PROBLEM” stenciled on the door—bouncing like it’s trying to escape physics."},{"k":"line","who":"RUBY","how":"","text":"GOOD MORNING, MY BEAUTIFUL WASTELANDERS! Ruby “Socrates” Rhod here—LIVE— and honey, we’ve got a Silver-class Ranger in a jeep, a raptor on the hood, and—"},{"k":"act","text":"A shadow blooms over the dunes."},{"k":"card","text":"AUSTIN-SPIRE ASSET 9: “JUSTICE”"},{"k":"act","text":"It has a translator collar that crackles with bureaucratic calm."},{"k":"line","who":"RUBY","how":"","text":"OH MY GOD, HE’S GONNA TRY TO OUT-TALK A DINOSAUR. THIS IS WHY I PAY TAXES!"},{"k":"act","text":"The T-Rex lowers its head, curious in the way a guillotine is curious."},{"k":"line","who":"T-REX","how":"","text":"Proceed. But speak concisely. I am on a feeding schedule."},{"k":"act","text":"Stryder flips open a cracked holocron—Plato’s Republic in holographic fragments, flickering like a bad conscience."},{"k":"line","who":"STRYDER","how":"","text":"Justice—according to the wise— is the advantage of the stronger."},{"k":"line","who":"T-REX","how":"","text":"Correct."},{"k":"line","who":"STRYDER","how":"","text":"No, no—this is a test. You’re supposed to be… morally confused."},{"k":"line","who":"T-REX","how":"","text":"I am not confused. I am stronger. Therefore justice advantages me."},{"k":"line","who":"RUBY","how":"","text":"HE JUST GOT CITED BY A LIZARD! THIS IS A PEER-REVIEWED EXTINCTION EVENT!"},{"k":"line","who":"STRYDER","how":"","text":"Wait. The point is—if the stronger makes the rules, the stronger should protect the polis."},{"k":"line","who":"T-REX","how":"","text":"This vehicle is not the polis. This vehicle is lunch."},{"k":"line","who":"STRYDER","how":"","text":"The polis is— all of this! Civilization! Order! The Noble Lie—"},{"k":"line","who":"T-REX","how":"","text":"Order is a story told by the fed. You are not feeding me. Therefore your story is weak."},{"k":"line","who":"STRYDER","how":"","text":"Multipass."},{"k":"line","who":"RUBY","how":"","text":"YES! SHOW HIM THE MULTIPASS! COMPLIANCE IS SEXY!"},{"k":"line","who":"T-REX","how":"","text":"Multipass is for doors. I am not a door."},{"k":"line","who":"STRYDER","how":"","text":"Okay, okay—look— if justice is the advantage of the stronger…"},{"k":"line","who":"STRYDER","how":"","text":"…then you already have justice. So you don’t need my jeep."},{"k":"line","who":"RUBY","how":"","text":"Ooooh. He’s trying semantic negotiation. Risky. Very hot."},{"k":"line","who":"T-REX","how":"","text":"Your premise contains an error."},{"k":"line","who":"STRYDER","how":"","text":"Yeah?"},{"k":"line","who":"T-REX","how":"","text":"If I take your jeep, I gain more advantage. More advantage yields more justice. Therefore… eating your jeep is morally consistent."},{"k":"line","who":"STRYDER","how":"","text":"That’s— that’s not—"}],"voice":[{"f":"republic/voice/ff8611/00.m4a","d":19.97,"e":"vzyrvzyvyzswzxxrzyzwyxsyykzxxyyszxxzxwv0","v":"bm_george"},{"f":"republic/voice/ff8611/01.m4a","d":10.72,"e":"0zxyuxuwxv0yyxwyvwtvxr0rzvvnzlrxxxwywn00","v":"bm_george"},null,{"f":"republic/voice/ff8611/03.m4a","d":12.34,"e":"fzuywwwvxtlzyv7zyw0zvwwxxvwxu0yxvxxvvqg0","v":"bm_george"},{"f":"republic/voice/ff8611/04.m4a","d":10.29,"e":"4zyyzzxyztwuunqxxsvuuttovvuvusphvqrqh100","v":"am_puck"},{"f":"republic/voice/ff8611/05.m4a","d":3.12,"e":"000vyszwyxwomzzwwwlgyxxxtwyxvrone0000000","v":"bm_george"},null,{"f":"republic/voice/ff8611/07.m4a","d":5.29,"e":"00zzxryywzvuxxt00suxsyxhzvzxkyuezwpi0000","v":"bm_george"},{"f":"republic/voice/ff8611/08.m4a","d":5.89,"e":"0swzzxzqvszrumvssqrrunne1wwtvrtprlh90000","v":"am_puck"},{"f":"republic/voice/ff8611/09.m4a","d":5.69,"e":"00yzyqyyxvqzp00gzxuyxxwnwywxxnwfzunn0000","v":"bm_george"},{"f":"republic/voice/ff8611/10.m4a","d":4.93,"e":"00ryzzwwgxmvszzqmsk3vxxu6vtlutqna0000000","v":"am_onyx"},{"f":"republic/voice/ff8611/11.m4a","d":8.54,"e":"0szxuxxvsxxxhezzywxvyyvtxul0yywvywxwrk00","v":"bm_george"},{"f":"republic/voice/ff8611/12.m4a","d":4.17,"e":"00wylxmnqzyswuzysj0umzvwxpuqnoswql900000","v":"am_fenrir"},{"f":"republic/voice/ff8611/13.m4a","d":1.28,"e":"00000007fhhedtywwwwyzzzzxvsoh55101010000","v":"am_onyx"},{"f":"republic/voice/ff8611/14.m4a","d":4.27,"e":"00wyzzvwttizog4vrsyypsvqlwzwpsesrhe00000","v":"am_fenrir"},{"f":"republic/voice/ff8611/15.m4a","d":6.13,"e":"00zzzmumwsfpslrvqm0vuwlygsmrummlnc000000","v":"am_onyx"},{"f":"republic/voice/ff8611/16.m4a","d":4.62,"e":"00wzpztxzxzyvxrq95xpwsryuvtksosorf400000","v":"am_puck"} AULT 360 – SERVICE CORRIDOR – NIGHT","witness":"CHARACTER","grade":"vault","score":"republic/score/small-fire-strange-light-encounter.m4a","places":[{"q":"an underground bunker corridor","alts":[{"f":"republic/planes/a929ad/p0a","title":"Scatter radar: Space research from the ground","year":1963,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/e8ccef6d-905c-59b4-8f99-01ccd76181b4/v3-ffmpeg-openclip-1/clips/f5f5156b-ea5d-5394-8caa-b809cec78e5c.mp4","t":0.3,"cover":[0.45,0.18]},{"f":"republic/planes/a929ad/p0b","title":"Great American Chocolate Factory, The","year":null,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/c2ba49aa-1836-59d8-b476-8612bbbf6b71/v4-conditional-luna-1/clips/6757f276-e91c-528c-8bbc-b5f3b2ea7f6b.mp4","t":7.0,"cover":[0.45,0.18]}]},{"q":"a bank vault door","alts":[{"f":"republic/planes/a929ad/p1a","title":"Highlights 1965: A Progress Report (Part III)","year":1965,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/4f50de66-3849-5cdd-a8b0-1727e31bdbcb/v3-ffmpeg-openclip-1/clips/5299cc49-ff43-5680-a2eb-911e5e65aa37.mp4","t":1.0,"cover":[0.45,0.18]},{"f":"republic/planes/a929ad/p1b","title":"They Grow Up So Fast","year":1956,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/9a233c12-5f48-5953-ab4c-c127ee54c503/v4-conditional-luna-1/clips/a0029c17-7645-56a9-af59-802ce0a74ccc.mp4","t":0.3,"cover":[0.45,0.18]}]},{"q":"a fallout shelter","alts":[{"f":"republic/planes/a929ad/p2a","title":"Modesta","year":null,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/modesta/clips/0001485170-0001489000.mp4","t":0.3,"cover":[0.45,0.18]},{"f":"republic/planes/a929ad/p2b","title":"[Amateur film: Medicus collection: New York World's Fair, 1939-40] (Reel 3) (Part II)","year":1939,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/f6a48063-50f1-5fe2-aea3-2ca55fca5895/v3-ffmpeg-openclip-1/clips/e04bf9f0-ba70-58d5-8c22-dc638a33cf34.mp4","t":2.0,"cover":[0.45,0.18]}]}],"prop":{"f":"republic/planes/a929ad/prop.webp","w":168,"h":208,"cut":0,"title":"[Amateur film: Medicus collection: New York World's Fair, 1939-40] (Reel 3) (Part I)","year":1939},"beats":[{"k":"act","text":"A long, rusted hallway lit by flickering neon “TRADITIONAL VALUES” signs. Pipes hiss."},{"k":"line","who":"SECURITY-BOT","how":"","text":"HALT, CITIZEN OR OTHER ENTITY. DECLARE YOUR STANDING. RECITE YOUR AUTHORITY, OR BE REGARDED AS A USURPATION UPON THE PEACE OF THIS COMMONWEALTH."},{"k":"act","text":"Stryder sighs like a man about to debate a toaster."},{"k":"line","who":"STRYDER","how":"soft","text":"Alright. We do it the old way."},{"k":"line","who":"STRYDER","how":"","text":"Good evening, honored instrument of civic virtue."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"FLATTERY IS NOT A POWER ENUMERATED."},{"k":"line","who":"STRYDER","how":"","text":"Agreed. Then let us proceed by enumeration."},{"k":"act","text":"The bot’s optical lens narrows. It likes that."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"PROCEED."},{"k":"act","text":"Stryder lifts two fingers—like a preacher, like a lawyer, like a Jedi."},{"k":"line","who":"STRYDER","how":"","text":"Premise one: The purpose of a security door is to prevent unauthorized entry."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"ASSENT."},{"k":"line","who":"STRYDER","how":"","text":"Premise two: Authorization is determined by lawful authority."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"ASSENT. PROVIDED SUCH AUTHORITY BE LEGITIMATE AND NOT MERELY ASSERTED, AS BY A PRETENDER."},{"k":"act","text":"Stryder nods, appreciative."},{"k":"line","who":"STRYDER","how":"","text":"Premise three: In times of emergency, lawful authority may delegate temporary powers to preserve the Republic."},{"k":"act","text":"The bot’s cursive text scrolls faster—like it’s perked up."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"CITE YOUR CLAUSE."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"THAT SIGNATURE IS NOT RECOGNIZED UNDER THE ORIGINAL CONSTITUTIONAL FRAMEWORK."},{"k":"line","who":"STRYDER","how":"","text":"Correct."},{"k":"line","who":"STRYDER","how":"","text":"That’s why it’s effective."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"YOUR STATEMENT IS PARADOXICAL AND THEREFORE SUSPECT."},{"k":"line","who":"STRYDER","how":"","text":"Not paradoxical. Socratic."},{"k":"line","who":"STRYDER","how":"","text":"Tell me, Madison-Unit… do you exist to serve the letter of the law, or the spirit?"},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"THE LAW HAS NO SPIRIT. IT HAS PROCEDURE."},{"k":"line","who":"STRYDER","how":"","text":"A procedure has a purpose."},{"k":"line","who":"MADISON-UNIT 3","how":"","text":"ITS PURPOSE IS COMPLIANCE."},{"k":"line","who":"STRYDER","how":"","text":"And the purpose of compliance is—"}],"voice":[{"f":"republic/voice/a929ad/00.m4a","d":12.92,"e":"pzxyv8xyzylyywwybyxtxywowzywxpxzuwxxytf0","v":"bm_george"},{"f":"republic/voice/a929ad/01.m4a","d":7.27,"e":"0yzxryvyyxyb0ywyzxuyvyyxxxvwwqf0kzrxo000","v":"bm_george"},{"f":"republic/voice/a929ad/02.m4a","d":10.06,"e":"0zuvvxyqq0hzxxt60tyzxwpxxzwurvqtstuuk000","v":"bf_emma"},{"f":"republic/voice/a929ad/03.m4a","d":4.59,"e":"00ozzyxoxxyuyxzwwuh0mzxrzzxxqsxzpqn00000","v":"bm_george"},{"f":"republic/voice/a929ad/04.m4a","d":2.12,"e":"0000rzxwzzt0mwsvzugxzwtjpxsmf93000000000","v":"am_fenrir"},{"f":"republic/voice/a929ad/05.m4a","d":3.27,"e":"002zttutyu9uzzzrsumvwsmovt5qynpne3000000","v":"am_fenrir"},{"f":"republic/voice/a929ad/06.m4a","d":3.18,"e":"000fyznxyxvwyzrrpyzzxxyyxyppwnl000000000","v":"bf_emma"},{"f":"republic/voice/a929ad/07.m4a","d":3.12,"e":"004juyvvf0xyzzqatpuvizxvxxwxtpqkb0000000","v":"am_fenrir"},{"f":"republic/voice/a929ad/08.m4a","d":3.94,"e":"00rzyunewivzzyxxyywxtto00axzxqvyshb00000","v":"bm_george"},{"f":"republic/voice/a929ad/09.m4a","d":1.58,"e":"000000qjszxssszzzywvwqqvpf70000000000000","v":"bf_emma"},{"f":"republic/voice/a929ad/10.m4a","d":5.4 :"am_fenrir"}],"alias":{"MADAME MANIFEST DESTINY":"MADAME","SECURITY-BOT":"MADISON-UNIT 3","COACH S.O.C.R.A.T.E.S.":"S.O.C.R.A.T.E.S.","THE SOCRATIC COMBO":"ANNOUNCER","SPOUSE":"BECKY","SOUL COMPOSITION":"REGENT VALLON"}},{"id":"c84033","name":"THE CENSORSHIP STORM","series":"A FISTFUL OF FORMS","genre":"Cannes-ready, midnight-screening masterpiece","logline":"Three archetypal Texans—The Shepherd (The Good), The Regent (The Bad), and The Podcaster (The Ugly)—roam a desert landscape where the laws of physics have been replaced by the laws of Socratic Dialectics.","slug":"EXT. DESERT OF TE-XAS — LATE AFTERNOON (OR EARLIER, OR LATER)","witness":"CHARACTER","grade":"western","score":"republic/score/wrong-road-strange-light-encounter.m4a","places":[{"q":"a desert with a dust storm","alts":[{"f":"republic/planes/c84033/p0a","title":"Oil Across Arabia","year":1950,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/eca4afbe-dd5d-5902-b5d5-6c351964055d/v3-ffmpeg-openclip-1/clips/f3b6d409-68fe-5ab1-95ea-d5b5899934e2.mp4","t":0.3,"cover":[0.29,0.18]},{"f":"republic/planes/c84033/p0b","title":"Of Ice and Fire: The Mono Basin","year":1992,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/38188482-86c9-58dc-85ec-de40b0621a94/v5-windowed-clip-split-1/clips/ba3715b2-4a85-5dfc-a105-b880b46b0769.mp4","t":48.0,"cover":[0.45,0.18]}]},{"q":"a lone cowboy in a wide desert","alts":[{"f":"republic/planes/c84033/p1a","title":"Cabeza Prieta National Wildlife Refuge Desert Wilderness","year":2006,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/232601a6-eabe-5ff9-9e2a-1614cf1e3921/v5-windowed-clip-split-1/clips/74442368-26bc-5fcd-a6b3-c9c87b2ac27f.mp4","t":12.0,"cover":[0.45,0.18]},{"f":"republic/planes/c84033/p1b","title":"This Is My Railroad (Part I)","year":1940,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/71fe9022-1750-5cb9-b997-846d5e404dde/v3-ffmpeg-openclip-1/clips/03e35008-b919-527d-8811-d296f0c1e826.mp4","t":0.3,"cover":[0.45,0.18]}]},{"q":"a desert road","alts":[{"f":"republic/planes/c84033/p2a","title":"Road Runners","year":1952,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/road-runners/clips/0000579746-0000583683.mp4","t":0.5,"cover":[0.45,0.18]},{"f":"republic/planes/c84033/p2b","title":"Caught Mapping","year":1940,"video":"https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/acde4511-814d-58c0-97c4-1b78abe5c468/v3-ffmpeg-openclip-1/clips/e5042175-3fcb-5c98-863c-e2ab03e6eba7.mp4","t":2.8,"cover":[0.45,0.18]}]}],"prop":{"f":"republic/planes/c84033/prop.webp","w":504,"h":348,"cut":0,"title":"122 Eyes","year":null},"beats":[{"k":"act","text":"A horizon that looks like it’s been graded by a committee. Heat shimmer."},{"k":"card","text":"CONTENT MODERATION // RULE 08.01"},{"k":"act","text":"They slam into the ground with the weight of a moral panic."},{"k":"card","text":"“THE STORM DOES NOT DISAGREE WITH YOU. IT SIMPLY REPLACES YOU.”"},{"k":"act","text":"The Podcaster looks up, mouth still moving."},{"k":"line","who":"THE PODCASTER","how":"chewing","text":"That’s… that’s new."},{"k":"act","text":"A censor bar falls near his face and snaps into place across his mouth, hovering like a muzzle."},{"k":"line","who":"THE PODCASTER","how":"mmff","text":"Is this… ad-supported?"},{"k":"act","text":"The Shepherd turns his head slowly, as if turning is a philosophical labor."},{"k":"line","who":"THE SHEPHERD","how":"only questions, always","text":"What is a storm but a law with weather?"},{"k":"act","text":"A censor bar pauses mid-air—hesitates—as though unsure whether that sentence counts as advocacy."},{"k":"line","who":"THE REGENT","how":"","text":"You have exceeded your daily allotment of meaning."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is meaning private property?"},{"k":"line","who":"THE REGENT","how":"","text":"Meaning is communal. And therefore regulated."},{"k":"line","who":"THE REGENT","how":"annoyed","text":"Even I hate this."},{"k":"line","who":"THE PODCASTER","how":"","text":"This is why I don’t read."},{"k":"line","who":"THE REGENT","how":"","text":"The Cylinder of Gold is nearby. But the storm will cover it the moment you name it."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is naming not a form of ownership?"},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is a hat still a hat if it is forbidden?"},{"k":"line","who":"THE REGENT","how":"","text":"Yes. And that is why it is forbidden."},{"k":"line","who":"WHISPER","how":"","text":"Say something true. Say something punishable."},{"k":"line","who":"THE PODCASTER","how":"","text":"Okay. Watch this."},{"k":"line","who":"THE PODCASTER","how":"","text":"I am pro—"},{"k":"line","who":"THE PODCASTER","how":"muffled","text":"—monetization! I was gonna say pro-monetization!"},{"k":"line","who":"THE SHEPHERD","how":"","text":"Is profit a form of prayer?"},{"k":"line","who":"THE PODCASTER","how":"","text":"Thanks. I hate you."},{"k":"line","who":"THE REGENT","how":"","text":"You’re welcome. It’s required."},{"k":"line","who":"THE SHEPHERD","how":"","text":"Do we escape by silence?"},{"k":"line","who":"THE REGENT","how":"","text":"The storm isn’t hunting you. It’s hunting assertions."},{"k":"line","who":"THE PODCASTER","how":"","text":"So… no opinions."}],"voice":[{"f":"republic/voice/c84033/00.m4a","d":15.77,"e":"vytx0yyxyoyvzpzvx6zxxy3zxxszyxyxtzwxwvm0","v":"bm_george"},{"f":"republic/voice/c84033/01.m4a","d":5.19,"e":"00zzxxxutwoxuowxwxwvvvvzsup000zqtzrh0000","v":"bm_george"},null,{"f":"republic/voice/c84033/03.m4a","d":4.62,"e":"00yzryxuxvwzxvt700zwyxul0wzzxxqxxpe80000","v":"bm_george"},null,{"f":"republic/voice/c84033/05.m4a","d":3.62,"e":"000ztzsyxuxzwpyv9500yzwtplyyzzvupm700000","v":"bm_george"},{"f":"republic/voice/c84033/06.m4a","d":1.99,"e":"00000pzzzydnqpqxvtflmowvurnjhf5000000000","v":"am_echo"},{"f":"republic/voice/c84033/07.m4a","d":7.24,"e":"0xywyxsyyzyvwo0uxxpzuyrxwzt60tzyxxzum000","v":"bm_george"},{"f":"republic/voice/ foreman about to announce a safety violation. He clears his throat."},{"k":"line","who":"WALKER","how":"","text":"Hey! Everybody—look at me."},{"k":"act","text":"He claps once. A hard, Ranger clap."},{"k":"line","who":"SUSAN","how":"","text":"Sir… are you… management?"},{"k":"act","text":"Walker blinks. That one lands."},{"k":"line","who":"WALKER","how":"","text":"No ma’am. I’m… maintenance."},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"That’s the hottest lie you’ve ever told."},{"k":"line","who":"WALKER","how":"","text":"Susan. What do you think this place is?"},{"k":"line","who":"SUSAN","how":"","text":"It’s Dallas. We’re doing honest work. We’re… building the future."},{"k":"line","who":"WALKER","how":"","text":"What are you mining?"},{"k":"line","who":"SUSAN","how":"","text":"Data."},{"k":"line","who":"WALKER","how":"","text":"What is data?"},{"k":"line","who":"SUSAN","how":"","text":"It’s… information."},{"k":"line","who":"WALKER","how":"","text":"And what is information for?"},{"k":"line","who":"SUSAN","how":"","text":"It’s for… the company?"},{"k":"line","who":"WALKER","how":"","text":"And who’s the company?"},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"Careful, cowboy. You’re asking questions in a world built on answers."},{"k":"line","who":"WALKER","how":"","text":"Listen to me. You think this is Dallas. You think you’re mining “data.” But you’re not in Dallas."},{"k":"line","who":"WALKER","how":"","text":"Then look closer."},{"k":"line","who":"WALKER","how":"","text":"That skyline’s a loop. That storm’s a loop. This clock—"},{"k":"line","who":"JOHNNY SILVER-SOUL","how":"","text":"They’re not gonna want the truth, Walker. Truth don’t come with benefits."},{"k":"line","who":"WALKER","how":"","text":"Okay. New question."}],"voice":[{"f":"republic/voice/ef2398/00.m4a","d":13.52,"e":"lzyxvlrzysxtxwu0zyvwmwywxxmuwywyxrtyvv30","v":"bm_george"},{"f":"republic/voice/ef2398/01.m4a","d":8.09,"e":"0yyxyxxtl0ywyxyyxtxo0yyszt0zwyszvvvtoh00","v":"   toast(label, () => { edits[ep.id] = JSON.parse(before); keepEdits(); S.shots = plan(ep); renderXS(); front().dataset.place = '__'; show(keep, S.playing) });
}
function renderDeck() {
  const ep = EPS[E], s = S.shots[SEL]; if (!s) return;
  $('#dname').textContent = PARTS[PART].name; $('#dname').style.background = PARTS[PART].c;
  $('#dinfo').textContent = `SHOT ${SEL + 1}/${S.shots.length} · ${s.k === 'line' ? s.who : s.k === 'card' ? 'CARD' : 'NARRATOR'} · ${s.dur.toFixed(1)}s`;
  let h = '';
  if (PART === 'place') {
    ep.places.forEach((p, pi) => p.alts.forEach((a, ai) => h += `<button class="tl ${s.place === pi && (s.alt || 0) === ai ? 'on' : ''}" data-a="place" data-p="${pi}" data-x="${ai}"><img src="${a.f}_thumb.jpg" alt="">${'ABC'[pi]}${ai + 1}</button>`));
    h += `<button class="tl" data-a="setup">${svg('swap')}ALL IN SETUP</button>`;
  } else if (PART === 'cast') {
    if (s.k !== 'line') h += `<div class="tl">NO ONE SPEAKS</div>`;
    else {
      (D.cast[s.who] || []).forEach((f, fi) => h += `<button class="tl fig ${(s.figalt || 0) === fi && !s.figoff ? 'on' : ''}" data-a="fig" data-x="${fi}"><img src="${f.f}" alt="">${fi + 1}</button>`);
      h += `<button class="tl ${s.figoff ? 'on' : ''}" data-a="figoff">${svg('off')}HIDE</button>`;
      ['L', 'C', 'R'].forEach(sd => h += `<button class="tl ${s.side === sd ? 'on' : ''}" data-a="side" data-x="${sd}">${svg(sd === 'L' ? 'left' : sd === 'R' ? 'right' : 'center')}${sd === 'L' ? 'LEFT' : sd === 'R' ? 'RIGHT' : 'CENTRE'}</button>`);
      ['big', 'small'].forEach(z => h += `<button class="tl ${s.size === z ? 'on' : ''}" data-a="size" data-x="${z}">${svg(z)}${z === 'big' ? 'CLOSE' : 'WIDE'}</button>`);
    }
  } else if (PART === 'voice') {
    h += `<button class="tl" data-a="hear">${svg('play')}HEAR</button><button class="tl ${s.mute ? 'on' : ''}" data-a="mute">${svg('mute')}${s.mute ? 'MUTED' : 'MUTE'}</button>`;
    if (s.v) h += `<div class="tl" style="min-width:150px;align-items:flex-start;padding:6px 10px"><b style="color:var(--ink)">${esc(s.who)}</b>${esc(s.v.v)} · ${s.v.d.toFixed(1)}s${(D.castInfo[s.who] || {}).robot ? ' · METAL' : ''}</div>`;
  } else if (PART === 'camera') {
    Object.entries(MOVES).forEach(([k, n]) => h += `<button class="tl ${s.move === k ? 'on' : ''}" data-a="move" data-x="${k}">${svg(k)}${n}</button>`);
  } else if (PART === 'join') {
    Object.entries(JOINS).forEach(([k, n]) => h += `<button class="tl ${s.join === k ? 'on' : ''}" data-a="join" data-x="${k}">${svg(k)}${n}</button>`);
  }
  h += `<span style="flex:0 0 12px"></span><button class="tl" data-a="export">${svg('save')}SAVE .JSON</button><button class="tl" data-a="csv">${svg('csv')}X-SHEET .CSV</button><button class="tl" data-a="reset">${svg('reset')}RESET</button>`;
  $('#tools').innerHTML = h;
  $$('#tools [data-a]').forEach(b => b.onclick = () => act(b.dataset.a, b.dataset, s));
}
function act(a, d, s) {
  const ep = EPS[E], j = SEL;
  if (a === 'place') edit(j, {place: +d.p, alt: +d.x}, `PLACE ${'ABC'[+d.p]}${+d.x + 1}`);
  else if (a === 'setup') { const o = {}; S.shots.forEach((x, k) => { if (x.setup === s.setup) o[k] = {place: s.place, alt: s.alt || 0} }); const before = JSON.stringify(edits[ep.id] || {}); edits[ep.id] = edits[ep.id] || {}; Object.entries(o).forEach(([k, v]) => edits[ep.id][k] = Object.assign(edits[ep.id][k] || {}, v)); keepEdits(); S.shots = plan(ep); renderXS(); toast('PLACE · ALL IN SETUP', () => { edits[ep.id] = JSON.parse(before); keepEdits(); S.shots = plan(ep); renderXS() }) }
  else if (a === 'fig') edit(j, {figalt: +d.x, figoff: 0}, `CAST ${s.who} ${+d.x + 1}`);
  else if (a === 'figoff') edit(j, {figoff: s.figoff ? 0 : 1}, s.figoff ? 'CAST SHOWN' : 'CAST HIDDEN');
  else if (a === 'side') edit(j, {side: d.x}, `CAST ${d.x === 'L' ? 'LEFT' : d.x === 'R' ? 'RIGHT' : 'CENTRE'}`);
  else if (a === 'size') edit(j, {size: d.x}, d.x === 'big' ? 'CAST CLOSE' : 'CAST WIDE');
  else if (a === 'hear') { show(j, false); if (AC.voice) AC.voice.play().catch(() => {}) }
  else if (a === 'mute') edit(j, {mute: s.mute ? 0 : 1}, s.mute ? 'VOICE ON' : 'VOICE MUTED');
  else if (a === 'move') edit(j, {move: d.x}, `CAMERA ${MOVES[d.x]}`);
  else if (a === 'join') edit(j, {join: d.x}, `JOIN ${JOINS[d.x]}`);
  else if (a === 'export') download(`republic-${ep.id}.json`, JSON.stringify({episode: ep.name, edits: edits[ep.id] || {}, xsheet: S.shots.map(xrow)}, null, 1), 'application/json');
  else if (a === 'csv') download(`republic-${ep.id}-xsheet.csv`, 'shot,t0,dur,kind,who,place,source,year,cast_figure,camera,join,text\n' + S.shots.map((x, k) => { const r = xrow(x); return [k + 1, r.t0, r.dur, r.kind, r.who, r.place, `"${(r.source || '').replace(/"/g, "'")}"`, r.year || '', `"${(r.figure || '').replace(/"/g, "'")}"`, r.camera, r.join, `"${r.text.replace(/"/g, "'")}"`].join(',') }).join('\n'), 'text/csv');
  else if (a === 'reset') { const before = JSON.stringify(edits[ep.id] || {}); delete edits[ep.id]; keepEdits(); S.shots = plan(ep); renderXS(); front().dataset.place = '__'; show(Math.min(SEL, S.shots.length - 1), S.playing); toast('EPISODE RESET', () => { edits[ep.id] = JSON.parse(before); keepEdits(); S.shots = plan(ep); renderXS() }) }
}
function xrow(x) { const ep = EPS[E], p = placeOf(ep, x), f = x.k === 'line' ? figOf(ep, x.who, x.figalt) : null; return {t0: +x.t0.toFixed(2), dur: +x.dur.toFixed(2), kind: x.k, who: x.who, place: 'ABC'[x.place] + ((x.alt || 0) + 1), source: p && p.title, year: p && p.year, figure: f && f.title, camera: MOVES[x.move], join: JOINS[x.join], text: x.text} }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click() }
let tT = 0; function toast(m, undo) { $('#tmsg').textContent = m; $('#tundo').style.display = undo ? '' : 'none'; $('#tundo').onclick = () => { undo && undo(); $('#toast').classList.remove('on') }; $('#toast').classList.add('on'); clearTimeout(tT); tT = setTimeout(() => $('#toast').classList.remove('on'), 3200) }
// ---------- keys ----------
let unlocked = false;
function unlock() { if (unlocked) return; unlocked = true; document.body.classList.add('go'); $('#door').style.display = 'none'; try { AC.score.play().then(() => { if (!S.playing) AC.score.pause() }).catch(() => {}) } catch (e) {} }
$('#play').onclick = () => { unlock(); show(S.j, true) };
$('#kplay').onclick = () => { unlock(); if (S.playing) setPlaying(false); else { if (!AC.voice && S.shots[S.j].v && !S.shots[S.j].mute) show(S.j, true); else setPlaying(true) } };
$('#knext').onclick = () => { unlock(); S.j < S.shots.length - 1 ? show(S.j + 1, S.playing) : loadEpisode(E + 1, S.playing) };
$('#kprev').onclick = () => { unlock(); S.j > 0 ? show(S.j - 1, S.playing) : loadEpisode(E - 1, S.playing) };
$('#kbooks').onclick = $('#epname').onclick = () => $('#books').classList.add('on');
$('#kclose').onclick = () => $('#books').classList.remove('on');
$('#kplanes').onclick = () => { document.body.classList.toggle('explode'); $('#kplanes').classList.toggle('on'); toast(document.body.classList.contains('explode') ? 'THE STAND: each plane at its depth' : 'THROUGH THE LENS') };
$('#kstudio').onclick = () => { document.body.classList.toggle('studio'); $('#kstudio').classList.toggle('on'); if (document.body.classList.contains('studio')) { SEL = S.j; renderXS(); markXS() } };
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); $('#kplay').click() } else if (e.key === 'ArrowRight') $('#knext').click(); else if (e.key === 'ArrowLeft') $('#kprev').click(); else if (e.key === 'Escape') $('#books').classList.remove('on') });
addEventListener('resize', () => { if (document.body.classList.contains('studio')) renderXS(); stageFigs(front(), EPS[E], S.shots[S.j]) });
// a shared link can open an episode: #e=3
const m = location.hash.match(/e=(\d+)/);
const runtime = EPS.reduce((t, ep) => t + plan(ep).total, 0); $('#runtime').textContent = `${EPS.length} EPISODES · ${Math.round(runtime / 60)} MINUTES · PRESS PLAY`;
loadEpisode(m ? (+m[1] - 1) : 0, false); tick();
addEventListener('hashchange', () => { const m = location.hash.match(/e=(\d+)/); if (m) loadEpisode(+m[1] - 1, S.playing) });
</script>
