<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Poet</title>
<meta name="description" content="The Markov Poet. An empty room that waits for a line, typed or spoken, answers with the archive, and lets you choose, keep and send the film.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#7d776f; --faint:#3a3631; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font:12px var(--mono); -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; } button{ font:inherit; color:inherit; }
#film{ position:fixed; inset:0; opacity:0; transition:opacity 1.8s ease; } #film.on{ opacity:1; }
#film::after{ content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, #0008 0%, transparent 22%, transparent 55%, #000b 100%); z-index:3; }
#ghosts{ position:fixed; inset:0; pointer-events:none; z-index:4; }
#ghosts img{ position:absolute; border-radius:2px; opacity:0; transform:translate(-50%,-50%) scale(.9); transition:opacity .9s ease, transform 1.6s cubic-bezier(.2,.7,.2,1), left 1.6s cubic-bezier(.2,.7,.2,1), top 1.6s cubic-bezier(.2,.7,.2,1), width 1.6s, filter 1.2s; filter:grayscale(1) brightness(.8); }
#ghosts img.show{ opacity:.55; transform:translate(-50%,-50%) scale(1); } #ghosts img.gone{ opacity:0; transform:translate(-50%,-50%) scale(.6); } #ghosts img.take{ opacity:1; filter:none; }
/* the words: always the most important thing on screen */
#room{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; z-index:5; }
#say{ max-width:min(1100px,92vw); text-align:center; font:300 clamp(30px,5.4vw,72px)/1.16 var(--serif); min-height:1.2em; }
#say .plea{ color:#6a645c; transition:opacity 1.2s; } #say .heard{ color:var(--dim); font-style:italic; }
#say .caret{ display:inline-block; width:.06em; height:.9em; background:var(--hi); margin-left:.08em; vertical-align:-.08em; animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
#say.playing{ position:fixed; left:50%; bottom:calc(122px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(1150px,90vw); font-size:clamp(26px,4vw,56px); text-shadow:0 0 22px #000, 0 0 4px #000; }
#say .w{ display:inline-block; opacity:0; filter:blur(10px); transform:translateY(.12em); animation:word .9s cubic-bezier(.2,.7,.2,1) forwards; white-space:pre; }
@keyframes word{ to{ opacity:1; filter:none; transform:none; } }
#poem{ position:fixed; left:24px; top:22px; max-width:min(420px,64vw); font:300 16px/1.55 var(--serif); color:var(--dim); z-index:6; }
#poem div{ cursor:pointer; opacity:0; animation:settle 1.2s forwards; transition:color .4s; } #poem div:hover{ color:var(--ink); } #poem div.now{ color:var(--ink); }
#poem div.now::before{ content:''; display:inline-block; width:14px; height:1px; background:var(--hi); vertical-align:middle; margin:0 8px 0 -22px; }
@keyframes settle{ from{ opacity:0; transform:translateY(10px); } to{ opacity:.95; transform:none; } }
#dna{ position:fixed; right:22px; top:20px; z-index:6; opacity:.8; transition:opacity .6s; max-width:min(520px,60vw); justify-content:flex-end; }
#bar{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:10px; z-index:7; transition:opacity .7s; }
.ico{ width:42px; height:42px; display:grid; place-items:center; border:0; background:none; border-radius:50%; cursor:pointer; color:var(--dim); position:relative; }
.ico:hover{ color:var(--ink); background:#ffffff10; } .ico svg{ width:19px; height:19px; } .ico.on{ color:var(--hi); } .ico:disabled{ opacity:.25; cursor:default; }
.ico .tip{ position:absolute; bottom:48px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:10px; letter-spacing:.08em; color:var(--dim); opacity:0; transition:opacity .3s; pointer-events:none; } .ico:hover .tip{ opacity:1; }
#mic{ width:58px; height:58px; border:1px solid var(--faint); margin:0 8px; } #mic svg{ width:20px; height:20px; }
#mic .ring{ position:absolute; inset:-1px; border-radius:50%; border:1px solid var(--hi); opacity:0; transition:transform .08s linear, opacity .3s; }
#mic.on{ border-color:var(--hi); color:var(--hi); } #mic.on .ring{ opacity:.7; }
#mic.on::before{ content:''; position:absolute; inset:-14px; border-radius:50%; border:1px solid #e8c07033; animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(.9); opacity:.2; } 50%{ transform:scale(1.15); opacity:.7; } }
#sys{ position:fixed; left:22px; bottom:calc(34px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; color:var(--dim); letter-spacing:.06em; max-width:26vw; z-index:7; transition:opacity .7s; }
#sys i{ width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none; } #sys.busy i{ background:var(--hi); animation:pulse 1s ease-in-out infinite; } #sys.play i{ background:var(--ink); }
@keyframes pulse{ 50%{ opacity:.2; transform:scale(.7); } } #sys span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#line{ position:fixed; left:0; right:0; bottom:0; height:3px; display:flex; gap:1px; z-index:7; cursor:pointer; } #line i{ height:100%; background:#ffffff14; } #line i.done{ background:#e8c07055; } #line i.now{ background:var(--hi); }
#nav{ position:fixed; right:18px; bottom:calc(34px + env(safe-area-inset-bottom)); display:flex; gap:16px; z-index:7; transition:opacity .7s; }
#nav a,#nav button{ color:var(--dim); text-decoration:none; background:none; border:0; letter-spacing:.1em; cursor:pointer; padding:6px 0; } #nav a:hover,#nav button:hover{ color:var(--ink); }
body.quiet #bar, body.quiet #sys, body.quiet #nav, body.quiet #dna{ opacity:0; } body.quiet{ cursor:none; }
#wall{ position:fixed; left:0; right:0; bottom:0; z-index:9; background:#0b0a09ee; backdrop-filter:blur(8px); border-top:1px solid #24211d; padding:14px 18px calc(18px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .5s cubic-bezier(.2,.7,.2,1); max-height:62vh; display:flex; flex-direction:column; }
#wall.open{ transform:none; }
#wall header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; } #wall header b{ font:300 20px/1.2 var(--serif); flex:1; min-width:200px; }
#wall header span{ color:var(--dim); letter-spacing:.06em; }
#wall .tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; overflow:auto; }
.tile{ position:relative; padding:0; border:0; border-radius:3px; overflow:hidden; aspect-ratio:16/10; cursor:pointer; background:#000; outline:2px solid transparent; outline-offset:-2px; animation:settle .5s both; }
.tile img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.8; transition:opacity .3s; } .tile:hover img{ opacity:1; }
.tile.chosen{ outline-color:var(--hi); } .tile.mine::after{ content:'kept'; position:absolute; left:6px; top:5px; font-size:9px; letter-spacing:.1em; color:var(--hi); }
.tile .p{ position:absolute; left:0; right:0; bottom:0; height:3px; background:#0008; } .tile .p u{ display:block; height:100%; background:var(--hi); }
.tile .n{ position:absolute; right:5px; top:4px; font-size:10px; text-shadow:0 0 4px #000; } .tile .s{ position:absolute; left:5px; bottom:7px; display:flex; gap:2px; }
.tile .s i{ font-style:normal; font-size:8.5px; color:#15120d; padding:1px 3px; border-radius:2px; }
#share{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom)); z-index:10; background:#0e0d0c; border:1px solid #24211d; border-radius:10px; padding:6px; min-width:280px; max-width:92vw; }
#share button{ display:block; width:100%; text-align:left; background:none; border:0; padding:11px 12px; border-radius:6px; cursor:pointer; color:var(--ink); } #share button:hover{ background:#ffffff0c; }
#share button small{ display:block; color:var(--dim); font-size:10.5px; margin-top:2px; } #share button:disabled{ opacity:.35; cursor:default; }
#toast{ position:fixed; left:50%; top:22px; transform:translateX(-50%); z-index:11; background:#0e0d0c; border:1px solid #24211d; border-radius:20px; padding:8px 14px; color:var(--ink); opacity:0; transition:opacity .4s; pointer-events:none; } #toast.on{ opacity:1; }
#veil{ position:fixed; inset:0; z-index:12; display:grid; place-items:center; background:#000c; cursor:pointer; text-align:center; padding:20px; } #veil b{ display:block; font:300 clamp(26px,4vw,48px)/1.2 var(--serif); } #veil span{ color:var(--dim); }
input#type{ position:fixed; opacity:0; pointer-events:none; left:0; top:0; width:1px; height:1px; }
@media (max-width:640px){ #sys{ max-width:50vw; bottom:calc(92px + env(safe-area-inset-bottom)); } #nav{ top:16px; bottom:auto; gap:12px; } #poem{ top:56px; font-size:13px; } #dna{ top:auto; bottom:calc(92px + env(safe-area-inset-bottom)); right:12px; max-width:48vw; } #bar{ gap:0; } #bar .ico{ width:38px; } #say.playing{ bottom:calc(150px + env(safe-area-inset-bottom)); } }
</style></head>

<div id="film"></div>

<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SH = window.SH, S = window.Shannon, EDIT = MPFilm.EDIT;
  const PLEAS = ['say a line', 'or type one', 'the archive is listening', 'sixteen thousand shots are waiting for a word', 'a poem does not exist before it is said', 'anything spoken can become a film', 'say it again, differently'];
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  let D, F, lines = [], locks = {}, history = [], draft = '', cur = null, voiceRec = null, recTimes = null, pleaI = 0, pleaTimer = 0, listening = false, composing = 0;
  let voice = store.get('poet.voice', 'piper');                           // piper | mine | none
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };

  SH.onStatus(s => { $('#sys').className = /rest|idle/.test(s.stage) ? '' : s.stage === 'playing' ? 'play' : 'busy'; $('#sysText').textContent = s.text + (s.frac != null ? ' ' + Math.round(s.frac * 100) + '%' : ''); });
  let wakeT; const wake = () => { document.body.classList.remove('quiet'); clearTimeout(wakeT); wakeT = setTimeout(() => { if (clock.running && !$('#wall').classList.contains('open') && $('#share').hidden) document.body.classList.add('quiet'); }, 3200); };
  ['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake));

  // ------------------------------------------------------------ the plea and the draft
  function plea() {
    if (draft || listening || cur) return;
    const say = $('#say'); say.classList.remove('playing'); say.innerHTML = `<span class="plea" style="opacity:0">${esc(PLEAS[pleaI % PLEAS.length])}</span><span class="caret"></span>`;
    requestAnimationFrame(() => { const p = say.querySelector('.plea'); if (p) p.style.opacity = 1; });
    pleaTimer = setTimeout(() => { const p = say.querySelector('.plea'); if (p) p.style.opacity = 0; pleaI++; pleaTimer = setTimeout(plea, 1300); }, 4200);
  }
  function showDraft(interim) { clearTimeout(pleaTimer); const say = $('#say'); say.classList.remove('playing');
    say.innerHTML = esc(draft) + (interim ? `<span class="heard">${draft ? ' ' : ''}${esc(interim)}</span>` : '') + '<span class="caret"></span>'; if (!draft && !interim) plea(); }
  function sayLine(text) { const say = $('#say'); say.classList.add('playing'); say.innerHTML = text.split(/(\s+)/).map((w, i) => /^\s+$/.test(w) ? w : `<span class="w" style="animation-delay:${i * 45}ms">${esc(w)}</span>`).join(''); }

  // ------------------------------------------------------------ typing anywhere; with a film on screen, single keys steer it
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) { if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); } return; }
    const k = e.key;
    if (!draft && cur) {
      if (k === ' ') { e.preventDefault(); toggle(); return; }
      if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); stepLine(k === 'ArrowRight' ? 1 : -1); return; }
      if (k === 'Escape') { if ($('#wall').classList.contains('open')) closeWall(); else $('#share').hidden = true; return; }
    }
    if (k === 'Enter') { e.preventDefault(); if (draft.trim()) commit(draft.trim()); return; }
    if (k === 'Escape') { draft = ''; showDraft(); return; }
    if (k === 'Backspace') { draft = draft.slice(0, -1); showDraft(); e.preventDefault(); return; }
    if (k.length === 1) { if (cur && !draft) pause(); draft += k; showDraft(); e.preventDefault(); }
  });
  $('#room').addEventListener('click', () => { if (matchMedia('(pointer:coarse)').matches) { const t = $('#type'); t.value = draft; t.focus(); } else if (cur && !draft) toggle(); });
  $('#type').addEventListener('input', e => { draft = e.target.value; showDraft(); });
  $('#type').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (draft.trim()) { commit(draft.trim()); e.target.value = ''; } } e.stopPropagation(); });

  // ------------------------------------------------------------ speaking (and keeping the voice)
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, stream = null, raf = 0, media = null, chunks = [];
  $('#mic').onclick = async () => {
    if (listening) { rec && rec.stop(); return; }
    if (!Rec) { toast('this browser cannot hear; type instead (Chrome and Safari can)'); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast('the microphone was not allowed; type instead'); return; }
    pause(); const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize);
    const level = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); $('#ring').style.transform = `scale(${1 + m / 40})`; raf = requestAnimationFrame(level); }; level();
    try { media = new MediaRecorder(stream); chunks = []; media.ondataavailable = e => chunks.push(e.data); media.start(); } catch (e) { media = null; }
    rec = new Rec(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
    rec.onresult = e => { let fin = '', inter = ''; for (let i = e.resultIndex; i < e.results.length; i++) (e.results[i].isFinal ? fin += e.results[i][0].transcript : inter += e.results[i][0].transcript);
      if (fin.trim()) { const t = fin.trim().replace(/^\w/, c => c.toUpperCase()); draft = ''; commit(t, true); } else showDraft(inter.trim()); };
    rec.onend = () => { listening = false; $('#mic').classList.remove('on'); cancelAnimationFrame(raf); $('#ring').style.transform = ''; stream.getTracks().forEach(t => t.stop()); ac.close();
      if (media && media.state !== 'inactive') { media.onstop = () => { voiceRec = new Blob(chunks, { type: media.mimeType || 'audio/webm' }); recTimes = null;
        if (SH.server) { voice = 'mine'; drawVoice(); toast('your voice is kept; the film will speak with it'); recompose(0, true); } else toast('your voice is kept for the film card'); }; media.stop(); }
      showDraft(); };
    rec.start(); listening = true; $('#mic').classList.add('on'); SH.status('listening', 'listening'); showDraft();
  };

  // ------------------------------------------------------------ composing
  async function phrasesWithVoice(text) {
    if (voice === 'mine' && voiceRec && SH.server) {                    // the person's own voice keeps the time (the lab transcribes it for word times)
      try { if (!recTimes) { SH.status('listening', 'listening back to your voice'); const r = await fetch('/api/transcribe?ext=webm', { method: 'POST', body: voiceRec }); const j = await r.json(); if (r.ok) recTimes = j; }
        if (recTimes && recTimes.segments.length) { const ph = S.parse(text), W = []; recTimes.segments.forEach(sg => sg.words.forEach(w => W.push([w.t0, w.t1])));
          let w = 0; ph.forEach(p => { const n = p.text.split(/\s+/).length, a = W[Math.min(w, W.length - 1)], b = W[Math.min(w + n - 1, W.length - 1)]; p.t0 = a[0]; p.t1 = b[1]; w += n; p.timed = true; });

$('#bar i').style.width=((t-D.T0)/(D.T1-D.T0)*100)+'%';const v=V[on];if(run){if(v.ended||(v.duration&&v.currentTime>=v.duration-.12))v.pause();else if(v.paused&&v.readyState>=2)v.play().catch(()=>{})}}
setInterval(()=>{if(!run)return;const n=performance.now();if(D.audio&&!au.paused)t=au.currentTime+D.T0;else t+=(n-last)/1e3;last=n;if(t>=D.T1){run=!1;au.pause();V.forEach(v=>v.pause());t=D.T0;shown=-1;ls=-1;$('#go').hidden=!1;$('#go span').textContent='touch to watch again';return}frame()},40);
