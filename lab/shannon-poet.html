<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Poet</title>
<meta name="description" content="The Markov Poet. An empty room that waits for a line, typed or spoken, and answers with the archive.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#77716a; --faint:#35322e; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font:12px var(--mono); -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
/* the film, when there is one, is the room's only light */
#film{ position:fixed; inset:0; opacity:0; transition:opacity 1.6s ease; } #film.on{ opacity:1; }
#film video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .5s; }
#film::after{ content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 60%, transparent 30%, #000c 100%); }
/* possibilities surface while the engine weighs, then give way to the one it takes */
#ghosts{ position:fixed; inset:0; pointer-events:none; }
#ghosts img{ position:absolute; border-radius:2px; opacity:0; transform:translate(-50%,-50%) scale(.9); transition:opacity .9s ease, transform 1.6s cubic-bezier(.2,.7,.2,1), left 1.6s cubic-bezier(.2,.7,.2,1), top 1.6s cubic-bezier(.2,.7,.2,1), width 1.6s, filter 1.2s; filter:grayscale(1) brightness(.8); }
#ghosts img.show{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
#ghosts img.gone{ opacity:0; transform:translate(-50%,-50%) scale(.6); }
#ghosts img.take{ opacity:1; filter:none; }
/* the words */
#room{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; }
#say{ max-width:min(1100px,92vw); text-align:center; font:300 clamp(28px,5.2vw,68px)/1.18 var(--serif); letter-spacing:.005em; min-height:1.2em; outline:none; caret-color:transparent; }
#say .plea{ color:#6a645c; transition:opacity 1.2s; } #say .heard{ color:var(--dim); font-style:italic; }
#say .caret{ display:inline-block; width:.06em; height:.9em; background:var(--hi); margin-left:.08em; vertical-align:-.08em; animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
#say.playing{ font-size:clamp(20px,3.2vw,40px); text-shadow:0 0 18px #000, 0 0 3px #000; position:fixed; left:50%; bottom:13vh; transform:translateX(-50%); width:min(1100px,90vw); }
#poem{ position:fixed; left:24px; top:22px; max-width:min(420px,70vw); font:300 15px/1.55 var(--serif); color:var(--dim); pointer-events:none; }
#poem div{ opacity:.0; animation:settle 1.2s forwards; } #poem div.now{ color:var(--ink); }
@keyframes settle{ from{ opacity:0; transform:translateY(10px); } to{ opacity:.9; transform:none; } }
/* listening */
#mic{ position:fixed; left:50%; bottom:calc(34px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:58px; height:58px; border-radius:50%; border:1px solid var(--faint); background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--dim); transition:border-color .4s, color .4s; }
#mic:hover{ border-color:var(--dim); color:var(--ink); } #mic svg{ width:20px; height:20px; }
#mic .ring{ position:absolute; inset:-1px; border-radius:50%; border:1px solid var(--hi); opacity:0; transform:scale(1); transition:transform .08s linear, opacity .3s; }
#mic.on{ border-color:var(--hi); color:var(--hi); } #mic.on .ring{ opacity:.7; }
#mic.on::before{ content:''; position:absolute; inset:-14px; border-radius:50%; border:1px solid #e8c07033; animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(.9); opacity:.2; } 50%{ transform:scale(1.15); opacity:.7; } }
/* the machine, speaking quietly about itself */
#sys{ position:fixed; left:22px; bottom:calc(26px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; color:var(--dim); letter-spacing:.06em; max-width:40vw; }
#sys i{ width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none; transition:background .4s; }
#sys.busy i{ background:var(--hi); animation:pulse 1s ease-in-out infinite; } #sys.play i{ background:var(--ink); }
@keyframes pulse{ 50%{ opacity:.2; transform:scale(.7); } }
#sys span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#dist{ position:fixed; left:0; right:0; bottom:0; height:3px; display:flex; opacity:0; transition:opacity .8s; } #dist.on{ opacity:1; }
#dist i{ height:100%; background:#3a362f; border-right:1px solid var(--bg); transition:width 1.2s cubic-bezier(.2,.7,.2,1); } #dist i.c{ background:var(--hi); }
#nav{ position:fixed; right:18px; top:16px; display:flex; gap:16px; opacity:0; transition:opacity .6s; } body.awake #nav{ opacity:1; }
#nav a,#nav button{ color:var(--dim); text-decoration:none; background:none; border:0; font:inherit; letter-spacing:.1em; cursor:pointer; padding:6px 0; } #nav a:hover,#nav button:hover{ color:var(--ink); }
#hint{ position:fixed; right:22px; bottom:calc(26px + env(safe-area-inset-bottom)); color:var(--faint); letter-spacing:.06em; text-align:right; }
input#type{ position:fixed; opacity:0; pointer-events:none; left:0; top:0; width:1px; height:1px; }
@media (max-width:640px){ #sys{ max-width:60vw; } #hint{ display:none; } #poem{ font-size:13px; } }
</style></head>
<body>
<div id="film"><video id="va" playsinline muted></video><video id="vb" playsinline muted></video></div>
<div id="ghosts"></div>
<div id="poem" aria-live="polite"></div>
<div id="room"><div id="say" tabindex="0" aria-label="Type a line and press Enter, or press the circle and speak"></div></div>
<button id="mic" aria-label="Speak"><span class="ring" id="ring"></span><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.2" y="2.5" width="5.6" height="10" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
<div id="sys" aria-live="polite"><i></i><span id="sysText">waking</span></div>
<div id="hint">type, then return · or touch the circle and speak</div>
<div id="dist"></div>
<nav id="nav"><button id="again">BEGIN AGAIN</button><button id="replay">REPLAY</button><a href="shannon-narrative.html">NARRATIVE</a><a href="markov-engine.html">ENGINE</a><a href="markov-poet.html">MARKOV POET</a></nav>
<input id="type" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-hidden="true">
<audio id="aud"></audio>
<script src="markov/engine.js?v=5"></script>
<script src="markov/clip-text.js?v=2"></script>
<script src="markov/shared.js?v=1"></script>
<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SH = window.SH, S = window.Shannon;
  const PLEAS = ['say a line', 'or type one', 'the archive is listening', 'sixteen thousand shots are waiting for a word', 'a poem does not exist before it is said', 'anything spoken can become a film', 'say it again, differently'];
  let D, lines = [], draft = '', cur = null, voiceRec = null, pleaI = 0, pleaTimer = 0, listening = false, composing = 0;
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };

  // ------------------------------------------------------------ status: the machine speaks quietly about itself
  SH.onStatus(s => { $('#sys').className = /rest|idle/.test(s.stage) ? '' : s.stage === 'playing' ? 'play' : 'busy';
    $('#sysText').textContent = s.text + (s.frac != null ? ' ' + Math.round(s.frac * 100) + '%' : ''); });
  let wakeT; const wake = () => { document.body.classList.add('awake'); clearTimeout(wakeT); wakeT = setTimeout(() => document.body.classList.remove('awake'), 2600); };
  ['mousemove', 'touchstart'].forEach(e => addEventListener(e, wake));

  // ------------------------------------------------------------ the plea
  function plea() {
    if (draft || listening || cur) return;
    const say = $('#say'); say.innerHTML = `<span class="plea" style="opacity:0">${esc(PLEAS[pleaI % PLEAS.length])}</span><span class="caret"></span>`;
    requestAnimationFrame(() => { const p = say.querySelector('.plea'); if (p) p.style.opacity = 1; });
    pleaTimer = setTimeout(() => { const p = say.querySelector('.plea'); if (p) p.style.opacity = 0; pleaI++; pleaTimer = setTimeout(plea, 1300); }, 4200);
  }
  function showDraft(interim) {
    clearTimeout(pleaTimer); const say = $('#say'); say.classList.remove('playing');
    say.innerHTML = esc(draft) + (interim ? `<span class="heard">${draft ? ' ' : ''}${esc(interim)}</span>` : '') + '<span class="caret"></span>';
    if (!draft && !interim) plea();
  }

  // ------------------------------------------------------------ typing anywhere
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter') { e.preventDefault(); if (draft.trim()) commit(draft.trim()); return; }
    if (e.key === 'Escape') { again(); return; }
    if (e.key === 'Backspace') { draft = draft.slice(0, -1); showDraft(); e.preventDefault(); return; }
    if (e.key.length === 1) { if (cur && !draft) stopFilm(false); draft += e.key; showDraft(); e.preventDefault(); }
  });
  // a phone keyboard needs a real field to type into
  $('#room').addEventListener('click', () => { if (matchMedia('(pointer:coarse)').matches) { const t = $('#type'); t.value = draft; t.focus(); } });
  $('#type').addEventListener('input', e => { draft = e.target.value; showDraft(); });
  $('#type').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (draft.trim()) { commit(draft.trim()); e.target.value = ''; } } e.stopPropagation(); });

  // ------------------------------------------------------------ speaking: the words as they are heard, the level as a ring
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, stream = null, raf = 0, media = null, chunks = [];
  $('#mic').onclick = async () => {
    if (listening) { rec && rec.stop(); return; }
    if (!Rec) { SH.status('rest', 'this browser cannot hear; type instead (Chrome and Safari can)'); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { SH.status('rest', 'the microphone was not allowed; type instead'); return; }
    const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize);
    const level = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); $('#ring').style.transform = `scale(${1 + m / 40})`; raf = requestAnimationFrame(level); }; level();
    try { media = new MediaRecorder(stream); chunks = []; media.ondataavailable = e => chunks.push(e.data); media.start(); } catch (e) { media = null; }
    rec = new Rec(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
    rec.onresult = e => { let fin = '', inter = ''; for (let i = e.resultIndex; i < e.results.length; i++) (e.results[i].isFinal ? fin += e.results[i][0].transcript : inter += e.results[i][0].transcript);
      if (cur && (fin || inter)) stopFilm(false);
      if (fin.trim()) { const t = fin.trim().replace(/^\w/, c => c.toUpperCase()); draft = ''; showDraft(); commit(t, true); } else showDraft(inter.trim()); };
    rec.onend = () => { listening = false; $('#mic').classList.remove('on'); cancelAnimationFrame(raf); $('#ring').style.transform = ''; stream.getTracks().forEach(t => t.stop()); ac.close();
      if (media && media.state !== 'inactive') { media.onstop = () => { voiceRec = new Blob(chunks, { type: media.mimeType || 'audio/webm' }); SH.status('rest', 'your voice is kept for the replay'); }; media.stop(); }
      showDraft(); };
    rec.start(); listening = true; $('#mic').classList.add('on'); SH.status('listening', 'listening'); showDraft();
  };

  // ------------------------------------------------------------ a line arrives: the archive weighs it, the film answers
  async function commit(text, spoken) {
    draft = ''; lines.push(text); store.set('poet.lines', lines); drawPoem(); const my = ++composing;
    $('#say').innerHTML = `<span style="color:var(--dim)">${esc(text)}</span>`;
    try {
      const P = await SH.phrases('own', spoken || !SH.server ? 'none' : store.get('poet.voice', 'ryan'), lines.join('\n')); if (my !== composing) return;
      const c = await SH.compose(P, { wOp: 1, wHome: .09, gap: .045, close: lines.length > 2 }); if (my !== composing) return;
      const first = c.cut.findIndex(s => c.ph[s.phrase].text && lines.length && s.phrase >= c.ph.length - S.parse(text).length);
      await see(c, Math.max(0, first)); if (my !== composing) return;
      cur = c; play(c, Math.max(0, first));
    } catch (e) { SH.status('rest', 'the words could not be read: ' + e.message); showDraft(); }
  }
  function drawPoem() { const p = $('#poem'); p.innerHTML = ''; lines.forEach((l, i) => { const d = document.createElement('div'); d.textContent = l; d.style.animationDelay = (i === lines.length - 1 ? 0 : 0) + 's'; if (i === lines.length - 1) d.className = 'now'; p.append(d); }); }
  // seeing: the shots in contention surface around the words, sized by their chance, then give way to the one taken
  function see(c, from) {
    return new Promise(res => {
      const s = c.cut[from], g = $('#ghosts'); g.innerHTML = ''; const W = innerWidth, H = innerHeight, top = s.alts[0].p;
      SH.status('weighing', `about ${Math.max(1, Math.round(s.perp))} shots can carry this line`);
      const dist = $('#dist'); dist.innerHTML = ''; dist.classList.add('on');
      s.alts.forEach(a => { const i = document.createElement('i'); i.style.width = '0'; if (a.k === s.k) i.className = 'c'; dist.append(i); setTimeout(() => i.style.width = (a.p * 100) + '%', 60); });
      const imgs = s.alts.slice(0, 14).map((a, j) => { const im = new Image(); im.src = D.LIB.shots[a.k].thumb; const ang = j * 2.39996, r = .28 + .16 * ((j * 37) % 10) / 10;
        im.style.left = (50 + Math.cos(ang) * r * 100 * (H / W) * 1.6) + '%'; im.style.top = (50 + Math.sin(ang) * r * 100) + '%'; im.style.width = Math.round(70 + 190 * Math.sqrt(a.p / top)) + 'px';
        g.append(im); setTimeout(() => im.classList.add('show'), 80 + j * 90); return [im, a]; });
      setTimeout(() => {
        imgs.forEach(([im, a]) => { if (a.k === s.k) { im.classList.add('take'); im.style.left = '50%'; im.style.top = '50%'; im.style.width = Math.max(W, H * 16 / 9) + 'px'; } else im.classList.add('gone'); });
        SH.status('choosing', `it takes ${D.LIB.shots[s.k].title}${D.LIB.shots[s.k].year ? ', ' + D.LIB.shots[s.k].year : ''}`);
        setTimeout(() => { res(); setTimeout(() => { g.innerHTML = ''; dist.classList.remove('on'); }, 900); }, 1500);
      }, 2300);
    });
  }

  // ------------------------------------------------------------ the film
  const vids = [$('#va'), $('#vb')], clock = SH.Clock($('#aud'), null); let on = 0, shown = -1, timer = 0, lineShown = -1;
  function load(v, u, at) { if (v.dataset.u !== u) { v.dataset.u = u; v.src = u; } const set = () => { try { v.currentTime = Math.min(at, (v.duration || 1e9) - .05); } catch (e) { } }; if (v.readyState >= 1) set(); else v.addEventListener('loadedmetadata', set, { once: true }); }
  function play(c, from) {
    clearInterval(timer); $('#film').classList.add('on'); shown = -1; lineShown = -1; clock.set(c); const t0 = c.cut[from] ? c.cut[from].t0 : c.T0; clock.seek(t0); clock.play();
    $('#say').classList.add('playing');
    timer = setInterval(() => {
      const t = clock.now(); if (t >= c.T1) { clearInterval(timer); clock.pause(); SH.status('rest', 'the film rests on its last frame · say another line'); $('#say').classList.remove('playing'); $('#say').innerHTML = '<span class="caret"></span>'; setTimeout(() => { if (!draft && !listening) { cur = null; plea(); } }, 5000); return; }
      const i = c.cut.findIndex(s => t >= s.t0 && t < s.t1);
      if (i >= 0 && i !== shown) { const s = c.cut[i], u = D.LIB.shots[s.k].video, nv = vids[1 - on];
        if (nv.dataset.u === u) on = 1 - on; else load(vids[on], u, (s.in || 0) + Math.max(0, t - s.t0));
        vids[on].style.opacity = 1; vids[1 - on].style.opacity = 0; vids[on].play().catch(() => { }); vids[1 - on].pause(); shown = i;
        const nx = c.cut[i + 1]; if (nx) load(vids[1 - on], D.LIB.shots[nx.k].video, nx.in || 0); }
      const li = c.ph.findIndex(p => t >= p.t0 && t < p.t1); if (li >= 0 && li !== lineShown) { lineShown = li; $('#say').innerHTML = esc(c.ph[li].text); }
      const v = vids[on]; if (v.ended || (v.duration && v.currentTime >= v.duration - .12)) v.pause(); else if (v.paused && v.readyState >= 2) v.play().catch(() => { });
    }, 40);
    SH.status('playing', `${Object.keys(c.eng.scenes).length} scene${Object.keys(c.eng.scenes).length > 1 ? 's' : ''} · ${c.cut.length} shot${c.cut.length > 1 ? 's' : ''}`);
  }
  function stopFilm(clear) { clearInterval(timer); clock.pause(); vids.forEach(v => v.pause()); $('#film').classList.remove('on'); $('#say').classList.remove('playing'); cur = null; if (clear !== false) showDraft(); }
  function again() { stopFilm(); lines = []; store.set('poet.lines', []); draft = ''; voiceRec = null; drawPoem(); SH.status('rest', 'the room is empty again'); showDraft(); }
  $('#again').onclick = again;
  // replay the whole poem; if it was spoken here, in the poet's own voice (the lab transcribes it for the timing)
  $('#replay').onclick = async () => {
    if (!lines.length) return; stopFilm(false);
    let P = null;
    if (voiceRec && SH.server) { SH.status('listening', 'listening back to your voice');
      try { const r = await fetch('/api/transcribe?ext=webm', { method: 'POST', body: voiceRec }); const j = await r.json();
        if (r.ok && j.segments.length) { const ph = S.parse(j.segments.map(s => s.text).join('\n')), W = []; j.segments.forEach(sg => sg.words.forEach(w => W.push([w.t0, w.t1])));
          let w = 0; ph.forEach(p => { const n = p.text.split(/\s+/).length, a = W[Math.min(w, W.length - 1)], b = W[Math.min(w + n - 1, W.length - 1)]; p.t0 = a[0]; p.t1 = b[1]; w += n; p.timed = true; });
          ph.forEach((p, i) => { if (ph[i + 1]) p.t1 = Math.max(p.t1, ph[i + 1].t0); }); ph[0].t0 = 0; P = { ph, audio: { src: j.audio, offset: 0 }, second: null, T0: 0, T1: ph[ph.length - 1].t1 + .8 }; } } catch (e) { }
    }
    if (!P) P = await SH.phrases('own', SH.server ? store.get('poet.voice', 'ryan') : 'none', lines.join('\n'));
    const c = await SH.compose(P, { wOp: 1, wHome: .09, gap: .045, close: lines.length > 2 }); cur = c; play(c, 0);
  };

  SH.load().then(d => { D = d; lines = store.get('poet.lines', []); drawPoem(); SH.status('rest', `${d.LIB.n.toLocaleString()} shots at rest`);
    if (!window.ClipText) return; setTimeout(() => { if (SH.server === false) window.ClipText.warm(s => SH.status(s.stage === 'ready' ? 'rest' : 'loading', s.stage === 'ready' ? 'ready to read' : s.text, s.frac)); }, 1500);
  }).catch(e => SH.status('rest', 'the archive could not wake: ' + e.message));
  plea();
})();
</script>
</body></html>
