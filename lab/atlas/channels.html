<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channels · Atlas</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bets.css?v=1">
<!-- CHANNELS · bet on Bolas set 07, Wink, Not Blink. The lab as television: each page is a channel playing its own frames. Up and
     down change the channel, and every cut is a blink (the machine passing over). Enter is a wink (a reading): the channel is kept
     on the reel of finds at the bottom, which is remembered in this browser. Search chooses which channels are on; surf mode cuts on
     its own every few seconds until you wink. Steering the film is finding. -->
<style>
body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; overflow: hidden; }
.tv { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; padding: 18px 22px; min-height: 0; }
.set { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.scr { position: relative; flex: 1; min-height: 240px; background: #000; border-radius: 14px; overflow: hidden; border: 10px solid #1a1714; box-shadow: inset 0 0 60px #000; }
.scr img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity .08s; }
.scr .black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .07s; }
.scr .black.on { opacity: 1; }
.below { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.ch { font: 600 40px var(--mono); color: var(--gold); text-align: center; line-height: 1; } .ch small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--faint); margin-top: 4px; }
.below h1 { margin: 0; font-size: 28px; line-height: 1.1; } .below p { margin: 4px 0 0; color: var(--dim); font-size: 15.5px; }
.keys { display: flex; gap: 8px; } .keys button { min-height: 48px; min-width: 52px; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 14px; font-size: 16px; }
.keys button:hover { border-color: var(--dim); } .keys .wk { border-color: var(--lime); color: var(--lime); }
.guide { overflow: auto; border-left: 1px solid var(--rule); padding-left: 16px; }
.guide h4 { margin: 0 0 8px; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
.gl { display: grid; grid-template-columns: 36px 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.gl:hover { background: #15130f; } .gl.on { background: #221d16; }
.gl span { font: 12px var(--mono); color: var(--faint); text-align: right; } .gl img { width: 64px; height: 40px; object-fit: cover; border-radius: 2px; } .gl b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kept { border-top: 1px solid var(--rule); padding: 10px 22px 14px; display: flex; gap: 12px; align-items: center; overflow-x: auto; min-height: 104px; }
.kept > b { font: 600 12px var(--mono); letter-spacing: .14em; color: var(--lime); text-transform: uppercase; flex: none; width: 92px; }
.kept a { flex: none; width: 140px; text-decoration: none; } .kept a img { width: 140px; height: 88px; object-fit: cover; border-radius: 4px; outline: 2px solid var(--lime); outline-offset: 2px; display: block; }
.kept a span { display: block; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#eyes { flex: none; }
@media (max-width: 860px) { .tv { grid-template-columns: minmax(0, 1fr); } .guide { display: none; } .below { grid-template-columns: 70px minmax(0, 1fr); } .keys { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header class="top"><a class="who" href="index.html"><svg id="eyes" width="34" height="44" viewBox="-17 -30 34 44"><line x1="0" y1="-30" x2="0" y2="-13" stroke="#e0483a" stroke-width="2.4"/><circle r="12" fill="#0b0a09" stroke="#ece6da" stroke-width="3"/><g id="lid"><circle cx="-4" cy="0" r="2.6" fill="#ece6da"/><circle cx="4" cy="0" r="2.6" fill="#ece6da"/></g></svg><span><b>Channels</b><small>bet on set 07 · wink, not blink</small></span></a>
  <label class="find"><svg width="18" height="18" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#b3ab9e" stroke-width="2"/><line x1="11" y1="11" x2="15" y2="15" stroke="#b3ab9e" stroke-width="2"/></svg><input id="q" type="search" placeholder="Which channels are on? type a work, a kind, a look… (empty: all)" autocomplete="off"><span class="n" id="n"></span></label>
  <nav><a href="index.html">SIX BETS</a><a href="../atlas.html">ATLAS</a></nav></header>
<section class="tv"><div class="set"><div class="scr"><img id="scr" alt=""><div class="black" id="black"></div></div>
  <div class="below"><div class="ch" id="ch"></div><div id="cap"></div><div class="keys"><button id="up" title="previous channel (↑)">▲</button><button id="dn" title="next channel (↓)">▼</button><button id="surf" title="surf: cut on its own (S)">surf</button><button id="wink" class="wk" title="keep this one (Enter)">wink · keep</button><a class="btn" id="open" target="_blank" rel="noopener">open ↗</a></div></div></div>
  <aside class="guide"><h4><span>Channel guide</span><span id="gn"></span></h4><div id="guide"></div></aside></section>
<footer class="kept" id="kept"></footer>
<script src="atlas-core.js?v=1"></script>
<script>
const A = ATLAS, esc = A.esc, $ = s => document.querySelector(s);
let chans = [], c = 0, fi = 0, surfing = false, q = '', kept = [];
try { kept = JSON.parse(localStorage.getItem('atlas.kept') || '[]'); } catch (e) { }
const saveKept = () => { try { localStorage.setItem('atlas.kept', JSON.stringify(kept)); } catch (e) { } };
function eyes(state) { $('#lid').innerHTML = state === 'blink' ? '<path d="M-7 0 Q-4 2 -1 0 M1 0 Q4 2 7 0" stroke="#ece6da" stroke-width="2" fill="none" stroke-linecap="round"/>'
  : state === 'wink' ? '<circle cx="-4" cy="0" r="2.6" fill="#ece6da"/><path d="M1 0 Q4 -3 7 0" stroke="#ece6da" stroke-width="2" fill="none" stroke-linecap="round"/>' : '<circle cx="-4" cy="0" r="2.6" fill="#ece6da"/><circle cx="4" cy="0" r="2.6" fill="#ece6da"/>'; }
function tune(i, quiet) { if (!chans.length) return; c = (i + chans.length) % chans.length; fi = 1; const p = chans[c];
  $('#black').classList.add('on'); eyes('blink'); setTimeout(() => { $('#black').classList.remove('on'); eyes(); }, 140);
  const f = A.frames(p); setTimeout(() => $('#scr').src = f[1] || f[0] || '', 70);
  $('#ch').innerHTML = `${c + 1}<small>OF ${chans.length}</small>`; $('#cap').innerHTML = `<h1>${A.mark(p.clean, q)}</h1><p>${esc(A.subjects[p.subject].name)} · ${esc(A.KIND[p.kind])} · ${esc(p.born || '')} · ${p.lines.toLocaleString()} lines</p>`;
  $('#open').href = A.open(p); history.replaceState(null, '', '#' + encodeURIComponent(p.path));
  document.querySelectorAll('.gl').forEach((g, k) => g.classList.toggle('on', k === c)); const g = document.querySelectorAll('.gl')[c]; g && !quiet && g.scrollIntoView({ block: 'nearest' }); }
function lineup() { const rs = A.search(q); chans = (q ? rs : rs.sort((a, b) => a.p.rank - b.p.rank)).map(r => r.p); $('#n').textContent = q ? `${chans.length} on` : ''; $('#gn').textContent = `${chans.length} channels`;
  $('#guide').innerHTML = chans.map((p, i) => { const f = A.frames(p); return `<div class="gl" data-i="${i}"><span>${i + 1}</span><img src="${esc(f[1] || f[0] || '')}" loading="lazy" alt=""><b>${A.mark(p.clean, q)}</b></div>`; }).join('') || '<p class="hint">No channel matches.</p>';
  document.querySelectorAll('.gl').forEach(g => g.onclick = () => tune(+g.dataset.i)); tune(0, true); }
function keep() { const p = chans[c]; if (!p) return; eyes('wink'); setTimeout(eyes, 700); if (!kept.includes(p.path)) { kept.unshift(p.path); kept = kept.slice(0, 24); saveKept(); } drawKept(); surfing = false; $('#surf').textContent = 'surf'; }
function drawKept() { $('#kept').innerHTML = '<b>Kept · ' + kept.length + '</b>' + (kept.map(x => A.by[x]).filter(Boolean).map(p => `<a href="${esc(A.open(p))}" target="_blank" rel="noopener" title="${esc(p.path)}"><img src="${esc(A.frames(p)[1] || A.frames(p)[0] || '')}" alt=""><span>${esc(p.clean)}</span></a>`).join('') || '<span class="hint">Wink (Enter) at a channel to keep it here. Kept channels stay in this browser.</span>')
  + (kept.length ? '<button class="hint" id="clr" style="flex:none">clear</button>' : ''); const cl = $('#clr'); if (cl) cl.onclick = () => { kept = []; saveKept(); drawKept(); }; }
setInterval(() => { const p = chans[c]; if (!p) return; const f = A.frames(p); if (f.length) { fi = (fi + 1) % f.length; $('#scr').src = f[fi]; } }, 800);
setInterval(() => { if (surfing) tune(c + 1); }, 3200);
$('#up').onclick = () => tune(c - 1); $('#dn').onclick = () => tune(c + 1); $('#wink').onclick = keep;
$('#surf').onclick = () => { surfing = !surfing; $('#surf').textContent = surfing ? '■ stop' : 'surf'; };
$('#q').oninput = e => { q = e.target.value.trim(); lineup(); };
addEventListener('keydown', e => { if (document.activeElement === $('#q')) { if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); $('#q').blur(); } return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); tune(c - 1); } else if (e.key === 'ArrowDown') { e.preventDefault(); tune(c + 1); } else if (e.key === 'Enter') keep();
  else if (e.key === 's' || e.key === 'S') $('#surf').click(); else if (e.key === '/') { e.preventDefault(); $('#q').focus(); } else if (e.key === 'o' || e.key === 'O') window.open($('#open').href, '_blank'); });
A.load().then(() => { lineup(); drawKept(); const h = decodeURIComponent(location.hash.slice(1)), j = chans.findIndex(p => p.path === h); if (j >= 0) tune(j); });
</script>
</body>
</html>
