<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wall · Atlas</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bets.css?v=1">
<!-- THE WALL · bet on Bolas set 09, Idents: every page of the lab as its own ident, a short loop of the screen it shows. Find by
     recognition: type and the wall shrinks to the pages that match, best first, with the words that matched shown under each.
     Order the wall by look and pages that look alike sit together. A drawer plays the chosen page large, frame by frame, with its
     facts, its look-alikes and the pages that share its code. Keys: arrows move, Enter opens the drawer, O opens the page. -->
<style>
.bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--rule); }
.bar2 span { font: 600 12px var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; margin-right: 4px; }
.bar2 button { font-size: 15.5px; border: 1px solid var(--rule); border-radius: 99px; padding: 8px 14px; min-height: 40px; }
.bar2 button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 0; height: calc(100% - 140px); transition: grid-template-columns .3s; }
.main.open { grid-template-columns: minmax(0, 1fr) min(560px, 46vw); }
.wall { overflow: auto; padding: 16px 18px 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.t { cursor: pointer; border-radius: 8px; padding: 6px; border: 2px solid transparent; min-width: 0; }
.t:hover { background: #15130f; } .t.sel { border-color: var(--ink); background: #1b1814; }
.t img { border-radius: 4px; }
.t h3 { margin: 8px 2px 2px; font-size: 18px; line-height: 1.2; font-weight: 600; }
.t .m { margin: 0 2px; font: 12.5px var(--mono); color: var(--dim); display: flex; gap: 8px; align-items: center; }
.t .m i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.t .s { margin: 6px 2px 0; font-size: 14px; line-height: 1.4; color: #cfc7ba; }
.sec { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; margin: 14px 0 0; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.sec h2 { margin: 0; font-size: 24px; font-weight: 600; color: var(--c); } .sec small { font: 12.5px var(--mono); color: var(--faint); }
.drawer { overflow: auto; border-left: 1px solid var(--rule); padding: 16px 20px 60px; background: #0e0d0b; }
.drawer h2 { margin: 14px 0 4px; font-size: 28px; line-height: 1.12; }
.drawer .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.drawer .strip img { cursor: pointer; opacity: .55; border-radius: 3px; } .drawer .strip img.on { opacity: 1; outline: 2px solid var(--ink); }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.facts div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; } .facts b { display: block; font: 600 20px var(--mono); } .facts small { font: 11.5px var(--mono); color: var(--faint); }
.sh { font: 600 12px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin: 18px 0 8px; }
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.row .t h3 { font-size: 13.5px; } .row .t .m { display: none; }
.empty { padding: 60px 20px; text-align: center; color: var(--dim); font-size: 19px; }
@media (max-width: 760px) { .main.open { grid-template-columns: 0 100%; } .main { height: auto; } }
</style>
</head>
<body>
<header class="top"><a class="who" href="index.html"><svg width="30" height="42" viewBox="-15 -30 30 42"><line x1="0" y1="-30" x2="0" y2="-12" stroke="#e0483a" stroke-width="2.4"/><circle r="11" fill="none" stroke="#ece6da" stroke-width="3"/><circle cx="-3.6" cy="0" r="2.4" fill="#ece6da"/><circle cx="3.6" cy="0" r="2.4" fill="#ece6da"/></svg><span><b>The Wall</b><small>bet on set 09 · idents</small></span></a>
  <label class="find"><svg width="18" height="18" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#b3ab9e" stroke-width="2"/><line x1="11" y1="11" x2="15" y2="15" stroke="#b3ab9e" stroke-width="2"/></svg><input id="q" type="search" placeholder="What do you remember? a word, a work, what it looked like…" autocomplete="off" autofocus><span class="n" id="n"></span></label>
  <nav><a href="index.html">SIX BETS</a><a href="../atlas.html">ATLAS</a></nav></header>
<div class="bar2" id="bar2"></div>
<div class="main" id="main"><div class="wall" id="wall"></div><aside class="drawer" id="drawer"></aside></div>
<script src="atlas-core.js?v=1"></script>
<script>
const A = ATLAS, esc = A.esc; let q = '', order = 'match', group = true, sel = null, list = [];
const ORDERS = [['match', 'Best match'], ['look', 'By look'], ['born', 'Newest'], ['hours', 'Most worked'], ['rank', 'Most linked']];
function bar() { $('#bar2').innerHTML = '<span>Order</span>' + ORDERS.map(([k, t]) => `<button data-o="${k}" class="${order === k ? 'on' : ''}">${t}</button>`).join('') + `<span style="margin-left:14px">Group</span><button id="grp" class="${group ? 'on' : ''}">by work</button>`;
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { order = b.dataset.o; bar(); draw(); }); $('#grp').onclick = () => { group = !group; bar(); draw(); }; }
const $ = s => document.querySelector(s);
const tile = (r, i) => { const p = r.p; return `<div class="t ${sel === p.path ? 'sel' : ''}" data-p="${esc(p.path)}" tabindex="-1"><img class="shot" loading="lazy" ${A.flipAttr(p, i % 4)} alt="">
  <h3>${A.mark(p.clean, q)}</h3><div class="m"><i style="--c:${A.color(p)}"></i>${esc(A.subjects[p.subject].name)} · ${esc(A.KIND[p.kind])}</div>${r.snip ? `<div class="s">${r.snip}</div>` : p.tags.length && q ? `<div class="s">${A.mark(p.tags.join(' · '), q)}</div>` : ''}</div>`; };
function draw() {
  let rs = A.search(q);
  const sorts = { match: (a, b) => q ? b.s - a.s : (b.p.importance - a.p.importance), look: (a, b) => (a.p.xy ? Math.round(a.p.xy[1] * 6) * 10 + a.p.xy[0] : 99) - (b.p.xy ? Math.round(b.p.xy[1] * 6) * 10 + b.p.xy[0] : 99),
    born: (a, b) => (b.p.born || '').localeCompare(a.p.born || ''), hours: (a, b) => b.p.hours - a.p.hours, rank: (a, b) => a.p.rank - b.p.rank };
  rs.sort(sorts[order]); list = rs.map(r => r.p.path); $('#n').textContent = q ? `${rs.length} of ${A.pages.length}` : `${A.pages.length} pages`;
  if (!rs.length) { $('#wall').innerHTML = `<div class="empty">Nothing matches “${esc(q)}”. Try a work (odyssey, republic), a kind (film, game), or what you saw (map, timeline, grid, crowd).</div>`; return; }
  let h = '<div class="grid">';
  if (group && order !== 'look') { const by = {}; rs.forEach(r => (by[r.p.subject] = by[r.p.subject] || []).push(r)); const ks = Object.keys(by).sort((a, b) => (q ? by[b][0].s - by[a][0].s : by[b].length - by[a].length));
    let i = 0; ks.forEach(k => { const s = A.subjects[k]; h += `<div class="sec" style="--c:${s.color}"><h2>${esc(s.name)}</h2><small>${by[k].length} page${by[k].length > 1 ? 's' : ''}</small></div>` + by[k].map(r => tile(r, i++)).join(''); }); list = ks.flatMap(k => by[k].map(r => r.p.path)); }
  else h += rs.map(tile).join('');
  $('#wall').innerHTML = h + '</div>';
  $('#wall').querySelectorAll('.t').forEach(t => t.onclick = () => pick(t.dataset.p));
}
function pick(path, keep) { sel = path; document.querySelectorAll('.t').forEach(t => t.classList.toggle('sel', t.dataset.p === path)); if (!keep) drawer(); const el = document.querySelector(`.wall .t[data-p="${CSS.escape(path)}"]`); el && el.scrollIntoView({ block: 'nearest' }); }
function drawer() {
  const p = A.by[sel]; if (!p) { $('#main').classList.remove('open'); return; } $('#main').classList.add('open'); const f = A.frames(p);
  const mini = path => { const x = A.by[path]; return x ? tile({ p: x, snip: '' }, 0) : ''; };
  const code = (p.versions || []).filter(v => v[1] >= .3).map(v => v[0]).filter(x => A.by[x]).slice(0, 4);
  $('#drawer').innerHTML = `<img class="shot" id="big" ${A.flipAttr(p)} alt="" style="border-radius:6px"><div class="strip">${f.map((x, i) => `<img class="shot ${i === 1 ? 'on' : ''}" src="${esc(x)}" data-i="${i}" alt="">`).join('')}</div>
    <h2>${esc(p.clean)}</h2><div class="hint">${esc(p.path)}</div>
    <p style="margin:10px 0"><span class="pill" style="--c:${A.color(p)}">${esc(A.subjects[p.subject].name)}</span> <span class="pill">${esc(A.KIND[p.kind])}</span>${p.status !== 'reachable' ? ` <span class="pill" style="--c:#ff8f6e">${esc(p.status)}</span>` : ''}</p>
    <a class="btn" href="${esc(A.open(p))}" target="_blank" rel="noopener">Open the page ↗</a>
    <p style="font-size:16.5px;line-height:1.5;color:#ddd5c8">${esc(p.desc)}</p>
    <div class="facts"><div><b>${p.lines.toLocaleString()}</b><small>lines of code</small></div><div><b>~${p.hours.toFixed(1)}</b><small>hours</small></div><div><b>${p.commits}</b><small>commits</small></div><div><b>#${p.rank}</b><small>importance</small></div></div>
    ${p.tags.length ? `<div class="sh">What it looks like</div><div class="hint" style="font-size:14px">${esc(p.tags.join(' · '))}</div>` : ''}
    ${p.looks.length ? `<div class="sh">Looks like</div><div class="row">${p.looks.slice(0, 4).map(l => mini(l[0])).join('')}</div>` : ''}
    ${code.length ? `<div class="sh">Shares code with</div><div class="row">${code.map(mini).join('')}</div>` : ''}
    <div class="sh">How to reach it</div><div class="hint" style="font-size:14px">${p.route.length ? [...p.route, p.path].map(x => esc(A.by[x]?.clean || x)).join(' → ') : 'Nothing in the lab links here.'}</div>`;
  $('#drawer').querySelectorAll('.strip img').forEach(im => im.onclick = () => { const b = $('#big'); b.dataset.hold = 1; b.src = im.src; $('#drawer').querySelectorAll('.strip img').forEach(x => x.classList.toggle('on', x === im)); });
  $('#drawer').querySelectorAll('.row .t').forEach(t => t.onclick = () => pick(t.dataset.p)); $('#drawer').scrollTop = 0;
}
$('#q').oninput = e => { q = e.target.value.trim(); if (q && order !== 'match') order = 'match'; bar(); draw(); };
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape') { if (sel) { sel = null; drawer(); draw(); } else { $('#q').value = ''; q = ''; draw(); } return; }
  if (!list.length) return; const cols = Math.max(1, Math.round($('#wall .grid').clientWidth / 266)), i = Math.max(0, list.indexOf(sel));
  const mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
  if (mv && (document.activeElement !== $('#q') || e.key === 'ArrowDown')) { e.preventDefault(); $('#q').blur(); pick(list[Math.min(list.length - 1, Math.max(0, sel ? i + mv : 0))], true); }
  if (e.key === 'Enter' && sel) drawer(); if ((e.key === 'o' || e.key === 'O') && sel && document.activeElement !== $('#q')) window.open(A.open(A.by[sel]), '_blank');
});
A.load().then(() => { const u = new URLSearchParams(location.search).get('q'); if (u) { q = u; $('#q').value = u; } bar(); const h = decodeURIComponent(location.hash.slice(1)); draw(); if (A.by[h]) pick(h); });
</script>
</body>
</html>
