<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Call Time</title>
<meta name="description" content="Make today's movie with whatever survived yesterday. A multiplayer production: one screen is the TV, every phone is a remote. Call sheet, channel guide, hot remote, dailies, circle take, continuity, tomorrow's call sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Jost:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#14213d; --bg2:#0d1630; --panel:#1d2c52; --line:#2e4275; --cyan:#7fe3ff; --yel:#ffd34d; --red:#ff5a5f; --grn:#61e294; --paper:#fbf6e9; --ink:#222; --dim:#9fb0d6;
  --tv:'VT323',ui-monospace,monospace; --sans:'Jost',system-ui,sans-serif; --type:'Courier Prime','Courier New',monospace; color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; min-height:100%; background:var(--bg2); color:#eef2ff; font:400 15px/1.4 var(--sans); }
body{ min-height:100vh; background:radial-gradient(ellipse at 50% 0%, #22346a, var(--bg2) 70%); }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; touch-action:manipulation; }
button:disabled{ opacity:.35; cursor:default; }
[hidden]{ display:none !important; }
a{ color:var(--cyan); }
.wrap{ width:min(1280px,100%); margin:0 auto; padding:10px 14px 24px; }
/* the station bar */
#top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:6px 2px 10px; }
#top .logo{ font:400 34px/1 var(--tv); letter-spacing:.06em; color:var(--yel); text-shadow:0 0 12px #ffd34d55; }
#top .logo small{ font:500 10px var(--sans); letter-spacing:.3em; color:var(--dim); margin-left:8px; text-transform:uppercase; text-shadow:none; }
#top .sp{ flex:1; } #top .room{ font:400 22px var(--tv); color:var(--cyan); letter-spacing:.08em; } #top a{ font-size:12px; color:var(--dim); text-decoration:none; }
/* the crew */
#crew{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.mem{ display:flex; align-items:center; gap:6px; padding:4px 10px 4px 4px; border-radius:20px; background:var(--panel); border:2px solid transparent; font-size:13px; }
.mem .av{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:17px; }
.mem b{ font:400 20px var(--tv); color:var(--yel); margin-left:2px; }
.mem.air{ border-color:var(--red); box-shadow:0 0 12px #ff5a5f88; } .mem.done{ opacity:.6; } .mem .st{ font-size:10px; color:var(--dim); letter-spacing:.08em; }
.mem.off{ opacity:.4; }
/* the set */
.stage{ display:grid; gap:14px; }
@media (min-width:960px){ .stage{ grid-template-columns:1.45fr 1fr; align-items:start; } }
.stage > div{ min-width:0; }
#tvbox{ background:#0a0a0a; border-radius:18px; padding:12px; box-shadow:inset 0 0 0 2px #333, 0 18px 40px #0008; }
#screen{ position:relative; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
#screen video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; opacity:0; }
#screen video.on{ opacity:1; }
#paper{ position:absolute; inset:0; overflow:auto; background:#000; }
#slate{ position:absolute; inset:0; display:grid; place-items:center; background:#000; text-align:center; }
#cap{ position:absolute; left:0; right:0; bottom:0; padding:22px 6% 10px; text-align:center; font:italic 400 clamp(14px,2.2vw,22px)/1.3 Georgia,serif; background:linear-gradient(transparent,#000c); pointer-events:none; }
#cap:empty{ display:none; }
#bug{ position:absolute; left:10px; top:10px; right:10px; display:flex; gap:8px; align-items:flex-start; pointer-events:none; font:400 clamp(15px,2vw,22px)/1.1 var(--tv); }
#bug:empty{ display:none; }
#bug .onair{ background:var(--red); color:#fff; padding:2px 8px; border-radius:4px; letter-spacing:.1em; animation:blink 1.2s infinite; }
@keyframes blink{ 50%{ opacity:.55; } }
#bug .who{ background:#000b; padding:2px 8px; border-radius:4px; } #bug .ch{ background:#000b; color:var(--cyan); padding:2px 8px; border-radius:4px; } #bug .sp{ flex:1; } #bug .left{ background:#000b; color:var(--yel); padding:2px 8px; border-radius:4px; }
#log{ position:absolute; right:10px; bottom:46px; display:flex; flex-direction:column; align-items:flex-end; gap:3px; pointer-events:none; font:400 clamp(13px,1.6vw,18px) var(--tv); }
#log div{ background:#000b; padding:1px 8px; border-radius:3px; animation:fade 4s forwards; }
@keyframes fade{ 0%{ opacity:1; transform:translateX(0); } 80%{ opacity:1; } 100%{ opacity:0; } }
/* the clapboard */
.clap{ width:min(78%,520px); font:700 clamp(14px,2.4vw,24px)/1.25 var(--type); color:#fff; text-align:left; }
.clap .sticks{ height:clamp(22px,4vw,40px); background:repeating-linear-gradient(-45deg,#fff 0 18px,#111 18px 36px); border-radius:4px 4px 0 0; transform-origin:0 100%; transform:rotate(-14deg); transition:transform .12s ease-in; border:2px solid #fff; }
.clap.shut .sticks{ transform:rotate(0); }
.clap .body{ background:#111; border:2px solid #fff; border-top:0; padding:10px 14px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px 10px; }
.clap .body div small{ display:block; font:500 9px var(--sans); letter-spacing:.24em; color:#aaa; } .clap .body .w{ grid-column:1/-1; }
.big{ font:400 clamp(30px,6vw,64px)/1 var(--tv); color:var(--yel); letter-spacing:.04em; text-align:center; padding:0 6%; }
.big small{ display:block; margin-top:8px; font:500 clamp(10px,1.4vw,14px) var(--sans); letter-spacing:.28em; color:var(--dim); text-transform:uppercase; }
/* the call sheet (paper) */
.sheet{ background:var(--paper); color:var(--ink); font:400 13px/1.35 var(--type); padding:16px 18px; border-radius:4px; box-shadow:0 8px 24px #0007; }
#paper .sheet{ min-height:100%; border-radius:0; font-size:clamp(12px,1.6vw,16px); }
.sheet h3{ margin:0; font:700 1.5em var(--type); letter-spacing:.06em; display:flex; justify-content:space-between; border-bottom:2px solid #222; padding-bottom:4px; }
.sheet .g{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:4px 18px; margin-top:8px; }
.sheet .k{ font-weight:700; letter-spacing:.12em; font-size:.8em; margin-top:8px; color:#555; }
.sheet .call{ margin-top:10px; padding:6px 8px; border:2px solid #222; font-weight:700; letter-spacing:.08em; text-align:center; font-size:1.15em; }
.sheet .note{ margin-top:8px; color:#b3261e; font-weight:700; } .sheet .no{ text-decoration:line-through; color:#b3261e; }
.sheet .sm{ font-size:.85em; color:#555; }
/* the guide */
.panel{ background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 10px 30px #0006; }
.ph{ font:400 24px var(--tv); color:var(--yel); letter-spacing:.06em; margin:0 0 6px; display:flex; justify-content:space-between; align-items:baseline; }
.ph small{ font:500 10px var(--sans); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
.guide{ width:100%; border-collapse:collapse; font:400 17px/1 var(--tv); }
.guide td{ border-bottom:1px solid var(--line); padding:3px 4px; vertical-align:middle; }
.guide .no{ color:var(--cyan); width:30px; } .guide .nm{ color:#fff; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.guide .th{ width:56px; } .guide .th i{ display:block; width:52px; aspect-ratio:4/3; background:#000 center/cover; border-radius:2px; }
.guide .th i.q{ display:grid; place-items:center; color:var(--dim); background:#0b1430; font-style:normal; }
.guide .vis{ color:var(--yel); font-size:13px; letter-spacing:-.1em; width:34px; }
.guide tr.cur td{ background:#ff5a5f22; } .guide tr.cur .nm{ color:var(--red); }
.guide tr.off td{ color:#7b86a8; text-decoration:line-through; } .guide tr.off .rs{ text-decoration:none; color:var(--red); font-size:13px; }
.guide .hd td{ color:var(--dim); font-size:13px; letter-spacing:.1em; border-bottom:2px solid var(--line); }
.guide .sec td{ color:var(--yel); font-size:14px; letter-spacing:.14em; padding-top:10px; }
.guide .mine td{ background:#7fe3ff0d; }
.cta{ display:block; width:100%; margin-top:12px; padding:14px; border-radius:12px; background:var(--yel); color:#1a1a1a; font:400 28px/1 var(--tv); letter-spacing:.08em; box-shadow:0 4px 0 #b38f1a; }
.cta:active{ transform:translateY(2px); box-shadow:0 2px 0 #b38f1a; }
.cta.red{ background:var(--red); color:#fff; box-shadow:0 4px 0 #a3292d; }
.hint{ color:var(--dim); font-size:12px; text-align:center; margin-top:6px; }
/* lobby */
.lob{ display:grid; gap:14px; } @media (min-width:760px){ .lob{ grid-template-columns:auto 1fr; } }
.qr{ background:#fff; padding:10px; border-radius:12px; width:min(250px,70vw); margin:0 auto; } .qr svg{ display:block; width:100%; height:auto; }
.url{ font:400 18px var(--tv); color:var(--cyan); word-break:break-all; text-align:center; margin-top:6px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
input[type=text]{ font:inherit; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:#0d1630; color:#fff; min-width:0; flex:1; }
.chip{ padding:6px 12px; border-radius:16px; border:2px solid var(--line); font:400 18px var(--tv); } .chip.on{ border-color:var(--yel); color:var(--yel); }
.avs{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; } .avs button{ font-size:26px; padding:6px 0; border-radius:10px; border:2px solid transparent; background:#0d1630; } .avs button.on{ border-color:var(--yel); }
.intro{ font:400 15px/1.5 var(--sans); color:#dfe6ff; } .intro b{ color:var(--yel); font-weight:600; }
/* dailies, the circle */
.takes{ display:grid; gap:8px; } .tk{ display:flex; align-items:center; gap:8px; padding:6px; border-radius:10px; background:#0d1630; border:2px solid transparent; text-align:left; width:100%; }
.tk .n{ flex:0 0 40px; font:400 30px var(--tv); color:var(--yel); text-align:center; } .tk .strip{ flex:1; display:flex; gap:3px; } .tk .strip i{ flex:1; max-width:56px; aspect-ratio:4/3; background:#000 center/cover; border-radius:2px; }
.tk .by{ flex:0 0 auto; text-align:right; font-size:12px; } .tk .vs{ font-size:16px; letter-spacing:-.1em; } .tk.win{ border-color:var(--yel); box-shadow:0 0 16px #ffd34d55; } .tk.now{ border-color:var(--red); }
.ledger{ font:400 14px/1.45 var(--type); background:var(--paper); color:var(--ink); padding:12px 14px; border-radius:4px; }
.ledger div{ border-bottom:1px dashed #bbb; padding:4px 0; } .ledger b{ letter-spacing:.06em; }
.stack{ display:grid; gap:10px; } .stack .sheet{ transform:rotate(-.4deg); } .stack .sheet:nth-child(2n){ transform:rotate(.5deg); }
/* the remote */
.remote{ max-width:360px; margin:0 auto; background:linear-gradient(#2b2b30,#18181b); border-radius:36px; padding:18px 16px 22px; box-shadow:inset 0 2px 0 #ffffff22, 0 14px 30px #000a; }
.remote .scr{ background:#0f2a1c; color:var(--grn); font:400 20px/1.1 var(--tv); border-radius:10px; padding:8px 10px; min-height:62px; box-shadow:inset 0 0 12px #000; }
.remote .scr .t{ float:right; color:var(--yel); }
.remote .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.remote .k{ padding:16px 0; border-radius:18px; background:linear-gradient(#45454d,#2e2e34); font:400 24px var(--tv); letter-spacing:.06em; box-shadow:0 4px 0 #111; color:#fff; }
.remote .k:active, .remote .k.hit{ transform:translateY(3px); box-shadow:0 1px 0 #111; background:#5a5a64; }
.remote .k.on{ color:var(--yel); box-shadow:0 4px 0 #111, inset 0 0 0 2px var(--yel); }
.remote .k.full{ grid-column:1/-1; }
.remote .rec{ background:radial-gradient(circle at 50% 40%, #ff6b6f, #c3262b); font-size:30px; padding:20px 0; }
.remote .lbl{ grid-column:1/-1; text-align:center; font:600 9px var(--sans); letter-spacing:.3em; color:#999; margin:4px 0 -4px; }
.remote .chs{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; } .remote .chs button{ padding:8px 4px; border-radius:8px; background:#222; font:400 17px var(--tv); text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .remote .chs button.on{ color:var(--red); }
/* the phone */
.phone{ max-width:440px; margin:0 auto; padding:12px 14px 30px; }
.look{ text-align:center; padding:40px 10px; font:400 44px/1 var(--tv); color:var(--yel); }
.look small{ display:block; font:500 13px var(--sans); color:var(--dim); letter-spacing:.14em; margin-top:12px; text-transform:uppercase; }
.look .av{ font-size:64px; display:block; margin-bottom:10px; }
.vote{ display:grid; grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); gap:10px; margin-top:12px; }
.vote button{ aspect-ratio:1; border-radius:50%; border:3px solid var(--yel); font:400 40px var(--tv); color:var(--yel); }
.vote button.on{ background:var(--yel); color:#111; } .vote button:disabled{ border-style:dashed; }
.me{ display:flex; align-items:center; gap:10px; justify-content:center; font:400 22px var(--tv); color:var(--dim); }
</style></head>
<body>
<div class="wrap" id="app"></div>
<script src="casino/vendor/peerjs.min.js"></script>
<script src="casino/vendor/qrcode.js"></script>
<script src="attrib/attrib.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const Q = new URLSearchParams(location.search), ROOM = (Q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), NET = Q.get('net') === 'bc' ? 'bc' : 'peer';
  const AV = ['🦊', '🐙', '🦉', '🐸', '🐯', '🐼', '🦄', '🐝', '🐢', '🦖', '🐧', '🦁'], COL = ['#ff7a45', '#7fe3ff', '#ffd34d', '#61e294', '#c792ea', '#ff8fb1', '#9ad0ff', '#f6c177', '#8bd5ca', '#f28fad', '#b5e8a0', '#ffb86c'];
  const rnd = Math.random, pick = xs => xs[Math.floor(rnd() * xs.length)], shuffle = xs => { xs = xs.slice(); for (let k = xs.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [xs[k], xs[j]] = [xs[j], xs[k]]; } return xs; };
  const UP = s => String(s).toUpperCase(), pad = n => String(n).padStart(2, '0');

  // ---- the wire: PeerJS between devices; BroadcastChannel between tabs of one browser (?net=bc)
  const Net = {
    host(code, onMsg, onState) {
      if (NET === 'bc') { const ch = new BroadcastChannel('calltime-' + code); ch.onmessage = e => { if (e.data.to === 'host') onMsg(e.data.pid, e.data.msg); }; setTimeout(() => onState('open')); return { send: (pid, msg) => ch.postMessage({ to: pid, msg }), close: () => ch.close() }; }
      const peer = new Peer('calltime-' + code), conns = new Map();
      peer.on('open', () => onState('open')); peer.on('error', e => onState(e.type === 'unavailable-id' ? 'taken' : 'error', e.type));
      peer.on('connection', c => { c.on('data', m => { if (m && m.pid) { conns.set(m.pid, c); onMsg(m.pid, m.msg); } });
        c.on('close', () => { for (const [k, v] of conns) if (v === c) { conns.delete(k); onMsg(k, { t: 'gone' }); } }); });
      return { send: (pid, msg) => { const c = conns.get(pid); if (c && c.open) c.send(msg); }, close: () => peer.destroy() };
    },
    join(code, pid, onMsg, onState) {
      if (NET === 'bc') { const ch = new BroadcastChannel('calltime-' + code); ch.onmessage = e => { if (e.data.to === pid) onMsg(e.data.msg); }; setTimeout(() => onState('open')); return { send: msg => ch.postMessage({ to: 'host', pid, msg }) }; }
      let conn = null; const go = () => { const peer = new Peer();
        peer.on('open', () => { conn = peer.connect('calltime-' + code, { reliable: true }); conn.on('open', () => onState('open')); conn.on('data', onMsg); conn.on('close', () => { onState('lost'); setTimeout(go, 1500); }); });
        peer.on('error', e => { onState('error', e.type); if (e.type === 'peer-unavailable' || e.type === 'network') setTimeout(go, 2500); }); };
      go(); return { send: msg => { if (conn && conn.open) conn.send({ pid, msg }); } };
    }
  };

  if (ROOM) return phone();
  return host();

  // =====================================================================  THE PHONE: a name, an avatar, then a remote
  function phone() {
    const app = $('#app'); let pid = null; try { pid = sessionStorage.getItem('ct.pid'); } catch (e) { }
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 9); try { sessionStorage.setItem('ct.pid', pid); } catch (e) { } }
    let me = { name: '', av: 0 }; try { me = JSON.parse(localStorage.getItem('ct.me')) || me; } catch (e) { }
    let S = null, net = null, joined = false, guideOpen = false, wire = 'connecting';
    const send = m => net && net.send(m);
    const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) { } };
    function form() {
      app.innerHTML = `<div class="phone"><div class="logo" style="font:400 40px var(--tv);color:var(--yel);text-align:center">CALL TIME</div>
        <p class="hint" style="font-size:14px">Room ${esc(ROOM)} · you're joining the crew</p>
        <div class="row" style="margin-top:14px"><input type="text" id="nm" maxlength="12" placeholder="Your name" value="${esc(me.name)}" autocomplete="off"></div>
        <p class="hint" style="text-align:left;margin-top:14px">Pick your face</p><div class="avs">${AV.map((a, k) => `<button data-a="${k}" class="${k === me.av ? 'on' : ''}">${a}</button>`).join('')}</div>
        <button class="cta" id="jn">Join the crew</button></div>`;
      app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { me.av = +b.dataset.a; app.querySelectorAll('[data-a]').forEach(x => x.classList.toggle('on', x === b)); });
      $('#jn').onclick = () => { me.name = ($('#nm').value || '').trim().slice(0, 12) || 'Crew'; try { localStorage.setItem('ct.me', JSON.stringify(me)); } catch (e) { } joined = true; try { sessionStorage.setItem('ct.joined', '1'); } catch (e) { } connect(); draw(); };
    }
    function connect() { if (net) return; net = Net.join(ROOM, pid, m => { if (m.t === 'state') { S = m; draw(); } if (m.t === 'full') { S = { phase: 'full' }; draw(); } }, (st, why) => { wire = st === 'open' ? 'open' : st; if (st === 'open') send({ t: 'hello', name: me.name, av: me.av }); draw(); }); }
    function draw() {
      if (!joined) return form();
      if (!S) { app.innerHTML = `<div class="phone"><div class="look">FINDING<br>THE SET…<small>${wire === 'open' ? 'room ' + esc(ROOM) : wire === 'error' || wire === 'lost' ? 'the set is not answering yet · still trying' : 'connecting'}</small></div></div>`; return; }
      const head = `<div class="me"><span style="font-size:26px">${AV[S.you ? S.you.av : me.av]}</span>${esc(S.you ? S.you.name : me.name)}${S.you ? ` · <span style="color:var(--yel)">${S.you.score} ★</span>` : ''}</div>`;
      const look = (big, sub, av) => `<div class="phone">${head}<div class="look">${av != null ? `<span class="av">${AV[av]}</span>` : ''}${big}<small>${sub || ''}</small></div></div>`;
      const P = S.phase;
      if (P === 'full') { app.innerHTML = look('THE CREW<br>IS FULL', 'twelve is the limit'); return; }
      if (P === 'lobby') { app.innerHTML = look('YOU’RE ON<br>THE CREW', 'look at the TV · waiting for call time', S.you.av); return; }
      if (P === 'call') { app.innerHTML = `<div class="phone">${head}<div class="sheet" style="margin-top:14px">${S.sheet}</div><div class="look" style="padding:20px 0;font-size:30px">LOOK UP<small>${S.youNext ? 'you have the remote first' : 'today’s call sheet is on the TV'}</small></div></div>`; return; }
      if ((P === 'slate' || P === 'air') && S.isYou) return remote();
      if (P === 'slate' || P === 'air' || P === 'pass') { app.innerHTML = look('LOOK UP', esc(S.onAir.name) + (P === 'pass' ? ' gets the remote' : ' is on air'), S.onAir.av); return; }
      if (P === 'house') { app.innerHTML = look('THE HOUSE<br>IS ROLLING', 'it makes a take too · you won’t know which'); return; }
      if (P === 'dailies') { app.innerHTML = look('DAILIES', 'take ' + S.daily + ' of ' + S.nTakes + ' · watch the TV'); return; }
      if (P === 'circle') {
        app.innerHTML = `<div class="phone">${head}<div class="look" style="padding:18px 0 6px;font-size:38px">CIRCLE ONE<small>the take that goes on air · not your own</small></div>
          <div class="vote">${Array.from({ length: S.nTakes }, (_, k) => `<button data-k="${k}" class="${S.mine === k ? 'on' : ''}" ${k === S.own ? 'disabled' : ''}>${k + 1}</button>`).join('')}</div>
          ${S.own >= 0 ? `<p class="hint">Take ${S.own + 1} is yours.</p>` : ''}${S.mine != null ? `<p class="hint" style="color:var(--yel)">Circled take ${S.mine + 1}. Tap another to change it.</p>` : ''}</div>`;
        app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { buzz(); send({ t: 'vote', k: +b.dataset.k }); });
        return; }
      if (P === 'result') { app.innerHTML = look('ON AIR:<br>TAKE ' + (S.win + 1), esc(S.winBy) + (S.gain ? ' · you +' + S.gain + ' ★' : ''), S.winAv); return; }
      if (P === 'continuity') { app.innerHTML = look('CONTINUITY', 'what changed is on the TV · tomorrow it’s true'); return; }
      if (P === 'wrap') { app.innerHTML = look('THAT’S A<br>WRAP', 'you placed #' + S.rank + ' of ' + S.of + ' · ' + S.you.score + ' ★', S.you.av); return; }
      app.innerHTML = look('LOOK UP', '');
    }
    function remote() {

    }
    function localRemote() { const st = G.eng ? G.eng.st() : { mute: false, hold: false };
      return `<div class="remote" style="margin-top:12px"><div class="grid"><button class="k" data-b="cam-">CAM −</button><button class="k" data-b="cam+">CAM +</button><button class="k" data-b="snd-">SND −</button><button class="k" data-b="snd+">SND +</button><button class="k" data-b="slip-">◀</button><button class="k" data-b="slip+">▶</button><button class="k ${st.mute ? 'on' : ''}" data-b="mute">MUTE</button><button class="k ${st.hold ? 'on' : ''}" data-b="hold">HOLD</button><button class="k full rec" data-b="rec">● REC</button></div><p class="hint" style="color:#999">Keys: ↑↓ cam · [ ] sound · ←→ slip · M mute · H hold · Enter rec</p></div>`; }
    function draw() { $('#roomTag').textContent = G.code && !wireNote ? 'ROOM ' + G.code : ''; drawCrew(); drawSide(); }
    function callSheet() { hushAll(); newDay(); G.phase = 'call'; $('#paper').innerHTML = `<div class="sheet">${sheetHTML(G.sheets[G.sheets.length - 1], false)}</div>`; show('#paper'); $('#bug').innerHTML = ''; draw(); broadcast(); }
    addEventListener('keydown', e => { if (G.phase !== 'air' || !G.air) return; const p = P(G.air.by); if (!p || !p.local) return;
      const b = { ArrowUp: 'cam+', ArrowDown: 'cam-', ']': 'snd+', '[': 'snd-', ArrowLeft: 'slip-', ArrowRight: 'slip+', m: 'mute', h: 'hold', Enter: 'rec' }[e.key]; if (b) { e.preventDefault(); press(p.id, b); } });
    openRoom(); slate(`<div class="big">CALL TIME<small>scan the code to join the crew</small></div>`); draw();
  }
})();
</script>
</body></html>
