<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Call Time</title>
<meta name="description" content="Make today's movie with whatever survived yesterday. A multiplayer production in a multiplane animation studio: one screen is the camera stand, every phone is a remote. Call sheet, guide, hot remote, dailies, circle take, continuity, tomorrow's call sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --ink:#2a1f1a; --paper:#f4ecd8; --paper2:#e9dcc0; --desk:#2f4f4f; --desk2:#223a3a; --verm:#c8553d; --ochre:#d9a441; --teal:#2f6f6b; --sky:#8fb8c9; --sap:#6a8d4e; --rose:#e8a7b8;
  --hand:'Patrick Hand','Comic Sans MS',cursive; --title:'Fredericka the Great',Georgia,serif; --type:'Courier Prime','Courier New',monospace; --topH:46px; --crewH:118px; color-scheme:light; }
@media (max-height:560px){ :root{ --topH:32px; --crewH:78px; } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; color:var(--ink); font:400 17px/1.3 var(--hand); overscroll-behavior:none; }
body{ background:var(--desk2) radial-gradient(ellipse at 50% 30%, var(--desk), var(--desk2) 75%); }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; touch-action:manipulation; }
button:disabled{ opacity:.4; cursor:default; }
[hidden]{ display:none !important; }
/* the hand-drawn button: gouache fill, an ink line that boils */
.btn{ position:relative; display:inline-block; padding:8px 16px; font:400 1.05em var(--hand); background:var(--paper); border-radius:255px 15px 225px 15px/15px 225px 15px 255px; }
.btn::after{ content:''; position:absolute; inset:0; border:2.5px solid var(--ink); border-radius:inherit; filter:url(#boil); pointer-events:none; }
.btn:active{ transform:translateY(2px) scale(.98); }
.cta{ display:block; width:100%; margin-top:10px; padding:10px; background:var(--verm); color:#fff8ec; font:400 1.35em var(--title); letter-spacing:.04em; box-shadow:0 4px 0 #7a2f22; }
#side .cta{ position:sticky; bottom:0; z-index:3; }
.cta.alt{ background:var(--teal); box-shadow:0 4px 0 #1d4644; } .cta.dim{ background:var(--paper2); color:var(--ink); box-shadow:none; }
.chip{ padding:3px 12px; } .chip.on{ background:var(--ochre); }
/* ======================= THE HOST: the camera stand ======================= */
#host{ position:fixed; inset:0; display:grid; grid-template-rows:var(--topH) minmax(0,1fr) var(--crewH); }
#top{ display:flex; align-items:center; gap:12px; padding:0 12px; background:linear-gradient(#1b2d2d,#203838); color:var(--paper); box-shadow:0 2px 0 #0004; min-width:0; }
.pegs{ display:flex; gap:6px; } .pegs i{ display:block; width:22px; height:9px; border-radius:5px; background:#c9c2ae; box-shadow:inset 0 -2px 0 #8d8672; } .pegs i:nth-child(2){ width:10px; border-radius:50%; height:10px; }
.logo{ font:400 calc(var(--topH) * .62) var(--title); color:var(--ochre); white-space:nowrap; }
.tagline{ font-size:13px; color:#c9d6cf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
#roomTag{ font:700 calc(var(--topH) * .42) var(--type); color:var(--paper); letter-spacing:.12em; white-space:nowrap; }
#top .btn{ font-size:14px; padding:3px 10px; color:var(--ink); }
#top a{ color:#c9d6cf; font-size:14px; text-decoration:none; white-space:nowrap; }
@media (max-height:560px){ .tagline{ display:none; } .pegs{ display:none; } }
#stage{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; padding:6px 8px; min-height:0; }
#stand{ align-self:center; width:min(64vw, calc((100dvh - var(--topH) - var(--crewH) - 12px - 12px) * 16 / 9)); padding:6px; background:#141a1a; border-radius:10px; box-shadow:0 0 0 2px #0008, 0 16px 40px #0009, inset 0 0 0 1px #ffffff14; }
#screen{ position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; container-type:size; }
#vids video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; opacity:0; }
#vids video.on{ opacity:1; }
#slate, #paper{ position:absolute; inset:0; }
#paper{ background:var(--desk) radial-gradient(ellipse at 50% 40%, #3b6262, var(--desk2)); display:grid; place-items:center; padding:3cqh 3cqw; }
#cap{ position:absolute; left:0; right:0; bottom:0; padding:5cqh 6% 2.5cqh; text-align:center; font:400 6.2cqh/1.2 var(--hand); color:#fff; text-shadow:0 2px 0 #000, 0 0 10px #000; background:linear-gradient(transparent,#000a); pointer-events:none; }
#cap:empty{ display:none; }
#bug{ position:absolute; left:2cqw; top:3cqh; right:2cqw; display:flex; gap:1.4cqw; align-items:flex-start; pointer-events:none; font:400 4.2cqh/1.05 var(--hand); }
#bug:empty{ display:none; }
#bug > span{ background:var(--paper); color:var(--ink); padding:.5cqh 1.2cqw; border-radius:3px; box-shadow:0 2px 0 #0006; transform:rotate(-1deg); }
#bug .onair{ background:var(--verm); color:#fff; font-family:var(--title); animation:blink 1.1s steps(2) infinite; }
#bug .sp{ flex:1; background:none; box-shadow:none; } #bug .left{ font:700 6cqh var(--type); transform:rotate(1.5deg); }
@keyframes blink{ 50%{ opacity:.55; } }
#log{ position:absolute; right:2cqw; bottom:14cqh; display:flex; flex-direction:column; align-items:flex-end; gap:.8cqh; pointer-events:none; font:400 3.9cqh var(--hand); }
#log div{ background:var(--paper); color:var(--ink); padding:.3cqh 1.2cqw; border-radius:2px; box-shadow:0 2px 0 #0006; animation:slip 4s forwards; }
#log div:nth-child(2n){ transform:rotate(1deg); }
@keyframes slip{ 0%{ opacity:0; transform:translateX(8cqw) rotate(4deg); } 8%{ opacity:1; transform:none; } 80%{ opacity:1; } 100%{ opacity:0; } }
.mini{ display:inline-block; width:1.15em; height:1.35em; vertical-align:-.3em; } .mini svg{ width:100%; height:100%; }
/* the multiplane card: painted planes that truck in at their own speeds, then drift */
.card{ position:absolute; inset:0; overflow:hidden; }
.card .l{ position:absolute; inset:0; animation:truck 1.25s cubic-bezier(.18,.75,.22,1) both; }
.card .dr{ position:absolute; inset:0 -14%; animation:drift 16s ease-in-out infinite alternate; }
.card .dr svg{ position:absolute; inset:0; width:100%; height:100%; }
@keyframes truck{ from{ transform:translateX(calc(var(--d) * 70%)); } to{ transform:none; } }
@keyframes drift{ from{ transform:translateX(calc(var(--d) * 7%)); } to{ transform:translateX(calc(var(--d) * -7%)); } }
.card .txt{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:0 8cqw; }
.big{ font:400 13cqh/1.02 var(--title); color:var(--paper); text-shadow:0 .5cqh 0 #0006; }
.big small{ display:block; margin-top:2.5cqh; font:400 5.4cqh/1.2 var(--hand); color:var(--paper); text-shadow:0 2px 0 #0007; }
.card.dawn .big, .card.gold .big, .card.dawn .big small, .card.gold .big small{ color:var(--ink); text-shadow:0 .4cqh 0 #fff6; }
.card .l.words{ z-index:2; }
.big .who{ display:inline-flex; align-items:center; gap:1.5cqw; } .big .who .mini{ width:12cqh; height:14cqh; vertical-align:middle; }
.steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:2cqw; margin-top:4cqh; font:400 4.4cqh/1.15 var(--hand); color:var(--ink); }
.steps div{ background:var(--paper); padding:1.5cqh 1cqw; border-radius:3px; box-shadow:0 .6cqh 0 #0005; transform:rotate(-1.5deg); }
.steps div:nth-child(2n){ transform:rotate(1.2deg); } .steps b{ display:block; font:400 7cqh var(--title); color:var(--verm); }
/* the clapboard: chalk on slate; the sticks anticipate, then snap */
.clap{ width:62cqw; font:400 5.4cqh/1.15 var(--hand); color:#f3f0e6; text-align:left; filter:drop-shadow(0 1.2cqh 0 #0006); }
.clap .sticks{ height:9cqh; background:repeating-linear-gradient(-50deg,#f3f0e6 0 4cqw,#1f1f1f 4cqw 8cqw); border:.5cqh solid var(--ink); border-radius:1cqh 1cqh 0 0; transform-origin:0 100%; transform:rotate(-16deg); }
.clap.shut .sticks{ animation:snap .42s both; }
@keyframes snap{ 0%{ transform:rotate(-16deg); } 55%{ transform:rotate(-27deg); } 82%{ transform:rotate(2.5deg); } 100%{ transform:rotate(0); } }
.clap .body{ background:#26302c; border:.5cqh solid var(--ink); border-top:0; padding:2cqh 2.4cqw; display:grid; grid-template-columns:1fr 1fr 1fr; gap:1.2cqh 2cqw; border-radius:0 0 1cqh 1cqh; }
.clap small{ display:block; font:700 2.6cqh var(--type); letter-spacing:.2em; color:#a9b7ae; } .clap .w{ grid-column:1/-1; } .clap .n{ font:400 7.5cqh var(--title); }
/* paper on the stand */
.sheet{ background:var(--paper); color:var(--ink); font:400 13px/1.3 var(--type); padding:12px 14px; border-radius:2px; box-shadow:0 6px 0 #0004, 0 12px 26px #0005; position:relative; }
.sheet::before{ content:''; position:absolute; top:6px; left:50%; width:44px; height:8px; margin-left:-22px; border-radius:5px; background:#00000022; box-shadow:-30px 1px 0 -1px #00000022, 30px 1px 0 -1px #00000022; }
#paper .sheet{ width:100%; max-height:100%; overflow:hidden; font-size:3.6cqh; padding:3.4cqh 3cqw 2.6cqh; animation:cel .8s cubic-bezier(.2,.8,.3,1.1) both; }
@keyframes cel{ from{ transform:translateY(60%) rotate(5deg); opacity:.2; } to{ transform:rotate(-.6deg); opacity:1; } }
.sheet h3{ margin:0; font:700 1.5em var(--type); letter-spacing:.06em; display:flex; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:2px; }
.sheet .g{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:2px 14px; margin-top:4px; }
.sheet .k{ font-weight:700; letter-spacing:.12em; font-size:.78em; margin-top:5px; color:#7a6a58; }
.sheet .call{ margin-top:6px; padding:3px 8px; border:2px solid var(--ink); font-weight:700; letter-spacing:.08em; text-align:center; font-size:1.12em; }
.sheet .note{ margin-top:4px; color:#b3261e; font-weight:700; } .sheet .no{ text-decoration:line-through; color:#b3261e; } .sheet .sm{ font-size:.85em; color:#6d6052; }
.ledger{ width:100%; max-height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font:400 3.6cqh/1.35 var(--type); padding:3cqh 3cqw; box-shadow:0 6px 0 #0004; animation:cel .8s cubic-bezier(.2,.8,.3,1.1) both; }
.ledger div{ border-bottom:1px dashed #b9ab92; padding:.6cqh 0; } .ledger .hd{ border:0; font-weight:700; letter-spacing:.14em; color:var(--verm); }
/* the exposure sheet */
#side{ min-height:0; overflow:auto; background:var(--paper) repeating-linear-gradient(transparent 0 23px, #c9b99a66 23px 24px); border-radius:4px; padding:10px 12px 12px 30px; box-shadow:0 10px 26px #0007; position:relative; scrollbar-width:thin; }
#side::before{ content:''; position:absolute; top:0; bottom:0; left:20px; width:2px; background:#d3746288; }
.ph{ font:700 13px var(--type); letter-spacing:.16em; text-transform:uppercase; margin:0 0 6px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:2px solid var(--ink); padding-bottom:2px; }
.ph small{ font:400 14px var(--hand); letter-spacing:0; text-transform:none; color:#7a6a58; }
.guide{ width:100%; border-collapse:collapse; font:400 16px/1 var(--hand); }
.guide td{ border-bottom:1px solid #c9b99a; padding:2px 3px; vertical-align:middle; }
.guide .no{ font:700 13px var(--type); color:var(--teal); width:24px; } .guide .nm{ max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.guide .th{ width:44px; } .guide .th i{ display:block; width:42px; aspect-ratio:4/3; background:#000 center/cover; border:1.5px solid var(--ink); border-radius:2px; }
.guide .th i.q{ display:grid; place-items:center; background:var(--paper2); font-style:normal; color:#7a6a58; }
.guide .vis{ color:var(--verm); font-size:12px; letter-spacing:-.1em; width:30px; }
.guide tr.cur td{ background:#c8553d26; } .guide tr.cur .nm{ color:var(--verm); }
.guide tr.off td{ color:#8b7d6a; text-decoration:line-through; } .guide tr.off .rs{ text-decoration:none; color:var(--verm); font-size:13px; }
.guide .hd td{ font:700 10px var(--type); letter-spacing:.12em; color:#7a6a58; border-bottom:2px solid var(--ink); }
.guide .sec td{ font:700 11px var(--type); letter-spacing:.16em; padding-top:8px; color:var(--teal); }
.guide .mine td{ background:#2f6f6b14; }
@media (max-height:560px){ .tk .strip i{ max-width:30px; } .tk .n{ font-size:20px; flex-basis:22px; } .tk{ padding:2px 4px; } .lob .url{ display:none; } .code{ font-size:30px; } .guide{ font-size:14px; } .guide .th{ width:34px; } .guide .th i{ width:32px; } .guide .nowc{ display:none; } #side{ padding:6px 8px 8px 26px; } }
.hint{ color:#7a6a58; font-size:14px; text-align:center; margin-top:5px; }
.lob{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; }
.qr{ background:#fff; padding:6px; border:2px solid var(--ink); border-radius:4px; width:min(30dvh,190px); } .qr svg{ display:block; width:100%; height:auto; }
.code{ font:700 clamp(26px,7dvh,44px) var(--type); letter-spacing:.14em; color:var(--verm); line-height:1; }
.url{ font:400 13px var(--type); word-break:break-all; color:#5c4f43; }
.row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
input[type=text]{ font:400 18px var(--hand); padding:6px 10px; border:2px solid var(--ink); border-radius:4px; background:#fffaf0; color:var(--ink); min-width:0; flex:1; }
.takes{ display:grid; gap:5px; } .tk{ display:flex; align-items:center; gap:6px; padding:4px; background:#fffaf0aa; border:2px solid transparent; border-radius:4px; }
.tk .n{ flex:0 0 30px; font:400 26px var(--title); color:var(--verm); text-align:center; } .tk .strip{ flex:1; display:flex; gap:3px; min-width:0; } .tk .strip i{ flex:1; max-width:48px; aspect-ratio:4/3; background:#000 center/cover; border:1.5px solid var(--ink); border-radius:2px; }
.tk .by{ flex:0 0 auto; text-align:right; font-size:14px; } .tk .vs .mini{ width:1em; height:1.2em; } .tk.win{ border-color:var(--ochre); background:#f7e3a8; } .tk.now{ border-color:var(--verm); }
.vrow{ display:flex; gap:5px; align-items:center; margin-top:6px; } .vrow span{ min-width:84px; }
.rk{ display:flex; align-items:center; gap:8px; padding:2px 0; font-size:18px; } .rk .mini{ width:28px; height:32px; } .rk b{ margin-left:auto; font:400 22px var(--title); color:var(--verm); }
.stack{ display:grid; gap:10px; margin-top:6px; } .stack .sheet{ transform:rotate(-.5deg); font-size:12px; } .stack .sheet:nth-child(2n){ transform:rotate(.6deg); }
/* the local remote, on the exposure sheet */
.lrem{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0 8px; } .lrem .btn{ padding:6px 2px; font-size:16px; text-align:center; }
.lrem .rec{ background:var(--verm); color:#fff; } .lrem .on{ background:var(--ochre); }
/* the crew on the ground plane */
#crew{ position:relative; overflow:hidden; background:linear-gradient(#9bb7a4, #7c9a7a 55%, #5d7a52 56%, #4d6a44); }
#crew .pl{ position:absolute; inset:0; pointer-events:none; } #crew .pl svg{ position:absolute; left:-10%; width:120%; height:100%; }
#toons{ position:absolute; left:0; right:0; bottom:4px; display:flex; justify-content:center; align-items:flex-end; gap:clamp(4px,1.4vw,18px); padding:0 10px; }
.tw{ position:relative; width:var(--tw,78px); display:flex; flex-direction:column; align-items:center; }
.tw .jump{ transform-origin:50% 100%; } .tw .rig{ transform-origin:50% 100%; animation:breathe 2.8s ease-in-out infinite; }
.tw .rig svg{ display:block; height:calc(var(--crewH) - 34px); width:auto; overflow:visible; }
.tw .tag{ margin-top:-3px; background:var(--paper); border:1.5px solid var(--ink); border-radius:2px; padding:0 6px; font-size:13px; line-height:1.25; white-space:nowrap; max-width:110%; overflow:hidden; text-overflow:ellipsis; transform:rotate(-2deg); }
.tw .tag b{ font-family:var(--title); color:var(--verm); margin-left:4px; } .tw:nth-child(2n) .tag{ transform:rotate(2deg); }
.tw.off{ opacity:.45; filter:grayscale(.8); }
.tw.air::before{ content:''; position:absolute; left:50%; bottom:12px; width:220%; height:260%; transform:translateX(-50%); background:radial-gradient(ellipse at 50% 100%, #fff6c8cc, #fff6c800 62%); pointer-events:none; }
.tw.air .jump{ translate:0 -6px; }
.tw .bubble, .tw .sign{ position:absolute; bottom:calc(100% - 22px); left:50%; transform:translateX(-50%) rotate(-3deg); background:var(--paper); border:2px solid var(--ink); border-radius:12px; padding:1px 8px; font-size:14px; white-space:nowrap; opacity:0; transition:opacity .15s; pointer-events:none; z-index:2; }
.tw .sign{ border-radius:2px; background:#fffaf0; color:var(--verm); font-weight:700; }
.tw.say .bubble, .tw.voted .sign{ opacity:1; animation:pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop{ from{ transform:translateX(-50%) scale(.3) rotate(-10deg); } }
.tw.enter{ animation:enter 1.1s cubic-bezier(.25,.8,.35,1) both; }
@keyframes enter{ 0%{ transform:translateX(70vw); } 60%{ transform:translateX(-8px); } 80%{ transform:translateX(3px); } 100%{ transform:none; } }
@keyframes breathe{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.025,.975); } }
.jump.hop{ animation:hop .8s both; } .jump.cheer{ animation:hop .72s 3 both; } .jump.hit{ animation:hit .26s; } .jump.catch{ animation:catchit .5s; } .jump.slump{ animation:slump 2s both; } .jump.bow{ animation:bow 1.3s both; }
@keyframes hop{ 0%{ transform:none; } 16%{ transform:scale(1.2,.76); } 36%{ transform:translateY(-34%) scale(.84,1.22); } 54%{ transform:translateY(-46%) scale(.98,1.03); } 74%{ transform:translateY(0) scale(1.17,.82); } 87%{ transform:scale(.95,1.06); } 100%{ transform:none; } }
@keyframes hit{ 40%{ transform:scale(1.12,.86); } }
@keyframes catchit{ 0%{ transform:none; } 25%{ transform:translateY(6%) scale(1.15,.82) rotate(-6deg); } 60%{ transform:scale(.96,1.05) rotate(3deg); } 100%{ transform:none; } }
@keyframes slump{ 0%{ transform:none; } 20%{ transform:translateY(4%) scale(1.06,.88) rotate(-5deg); } 80%{ transform:translateY(4%) scale(1.06,.88) rotate(-5deg); } 100%{ transform:none; } }
@keyframes bow{ 0%{ transform:none; } 30%{ transform:scale(1.04,.96); } 55%{ transform:rotate(14deg) scale(1,.9); } 80%{ transform:rotate(14deg) scale(1,.9); } 100%{ transform:none; } }
.toon .eyes{ transform-box:fill-box; transform-origin:center; animation:blinkE 5s infinite; }
@keyframes blinkE{ 0%,93%,100%{ transform:none; } 95%{ transform:scaleY(.1); } }
.toon .aL, .toon .aR{ transform-box:fill-box; transform-origin:50% 0; }
.jump.cheer .aL{ animation:armL .72s 3; } .jump.cheer .aR{ animation:armR .72s 3; }
@keyframes armL{ 30%,70%{ transform:rotate(140deg); } } @keyframes armR{ 30%,70%{ transform:rotate(-140deg); } }
.prop{ position:fixed; left:0; top:0; width:26px; height:40px; z-index:50; pointer-events:none; }
@media (orientation:portrait){ #stage{ grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); } #stand{ width:100%; } }
/* ======================= THE PHONE: a character, then a remote ======================= */
.phone{ position:fixed; inset:0; display:flex; flex-direction:column; padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); background:var(--paper) repeating-linear-gradient(transparent 0 27px, #c9b99a55 27px 28px); }
.phone .me{ display:flex; align-items:center; gap:8px; font-size:20px; border-bottom:2px solid var(--ink); padding-bottom:4px; }
.phone .me .mini{ width:30px; height:36px; } .phone .me b{ margin-left:auto; font:400 22px var(--title); color:var(--verm); }
.phone h1{ margin:2px 0; font:400 clamp(30px,10vw,46px)/1 var(--title); color:var(--verm); text-align:center; }
.phone .center{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; min-height:0; }
.phone .say{ font:400 clamp(28px,8vw,40px)/1.05 var(--title); } .phone .sub{ font-size:18px; color:#6d6052; margin-top:8px; }
.phone .hero{ height:min(32dvh,220px); } .phone .hero svg{ height:100%; width:auto; overflow:visible; } .phone .hero .jump{ transform-origin:50% 100%; } .phone .hero .rig{ animation:breathe 2.8s ease-in-out infinite; transform-origin:50% 100%; height:100%; }
.pick{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0; flex:1; min-height:0; }
.pick button{ border:2px solid transparent; border-radius:8px; display:grid; place-items:center; padding:2px; min-height:0; } .pick button svg{ height:100%; max-height:11dvh; width:auto; overflow:visible; }
.pick button.on{ border-color:var(--ink); background:#f7e3a8; }
.remote{ flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(0,1fr); gap:9px; margin-top:8px; min-height:0; }
.remote .btn{ font-size:clamp(18px,5.4vw,24px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; line-height:1.05; }
.remote .btn small{ font-size:12px; color:#6d6052; }
.remote .cam{ background:#bfe0d8; } .remote .snd{ background:#f3d898; } .remote .slip{ background:#cfe2ec; } .remote .tog{ background:#e4ddd0; } .remote .tog.on{ background:var(--ochre); }
.remote .rec{ grid-column:1/-1; background:var(--verm); color:#fff; font:400 clamp(26px,8vw,36px) var(--title); }
.remote .gd{ grid-column:1/-1; background:#efe6d3; font-size:18px; }

.scr .t{ float:right; font:700 20px var(--type); color:var(--ochre); }
.vote{ display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:12px; width:100%; margin-top:16px; }
.vote button{ position:relative; aspect-ratio:1; font:400 44px var(--title); }
.vote button svg{ position:absolute; inset:-6%; width:112%; height:112%; overflow:visible; }
.vote button svg ellipse{ fill:none; stroke:var(--verm); stroke-width:5; stroke-linecap:round; stroke-dasharray:260; stroke-dashoffset:260; }
.vote button.on svg ellipse{ animation:draw .45s ease-out forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
.vote button:disabled{ opacity:.3; }

        let svg = ''; if (G.code && !wireNote && window.qrcode) { const q = qrcode(0, 'M'); q.addData(joinURL()); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 1, scalable: true }); }
        S.innerHTML = `<div class="ph">The crew <small>${G.players.length} joined · 12 at most</small></div>
          ${wireNote ? `<p class="hint" style="color:var(--verm)">${esc(wireNote)}</p>` : `<div class="lob"><div class="qr">${svg}</div><div style="min-width:0"><div class="hint" style="text-align:left;margin:0">scan to join · room</div><div class="code">${esc(G.code || '')}</div><div class="url">${esc(joinURL().replace(/^https?:\/\//, ''))}</div>${lobbyCtl()}</div></div>`}${wireNote ? lobbyCtl() : ''}
          <button class="btn cta" id="startB" ${G.players.length ? '' : 'disabled'}>${G.players.length ? 'Call time ▸' : 'waiting for the crew'}</button>`;
        const add = () => { const v = ($('#lname').value || '').trim().slice(0, 12); if (!v) return; addPlayer('L' + Date.now(), v, null, true); draw(); };
        $('#ladd').onclick = add; $('#lname').onkeydown = e => { if (e.key === 'Enter') add(); };
        S.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { G.days = +b.dataset.d; draw(); });
        $('#startB').onclick = () => { if (!G.players.length) return; fullscreen(true); [...VP, ...AP].forEach(m => { m.muted = true; m.play().catch(() => { }); m.pause(); m.muted = m.tagName === 'VIDEO'; }); try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { } G.day = 1; callSheet(); };
        return; }
      if (ph === 'call') { S.innerHTML = `<div class="ph">The guide <small>day ${G.day} · shared channels</small></div>${guideHTML(null)}<button class="btn cta" id="go">Roll camera ▸</button><div class="hint">first on the remote: ${esc((P(G.order[0]) || {}).name || '')}</div>`; $('#go').onclick = nextTurn; return; }
      if (ph === 'slate' || ph === 'air' || ph === 'pass') { const p = G.air && P(G.air.by), local = p && p.local && ph === 'air';
        S.innerHTML = `<div class="ph">The guide <small>${p ? esc(p.name) + '’s remote' : ''}</small></div>${local ? localRemote() : ''}${p ? guideHTML(p.id) : ''}`;
        if (local) S.querySelectorAll('[data-b]').forEach(b => b.onclick = () => press(p.id, b.dataset.b, b.dataset.v != null ? +b.dataset.v : undefined));
        return; }
      if (ph === 'house') { S.innerHTML = `<div class="ph">The house <small>rolling</small></div>${guideHTML('house')}`; return; }
      if (ph === 'dailies') { S.innerHTML = `<div class="ph">Dailies <small>nobody knows whose is whose</small></div><div class="takes">${G.takes.map((t, k) => `<div class="tk ${k === G.daily ? 'now' : ''}"><span class="n">${k + 1}</span><span class="strip">${k < G.daily ? stripOf(t) : ''}</span><span class="by">${k === G.daily ? '▶ now' : k < G.daily ? 'seen' : ''}</span></div>`).join('')}</div>`; return; }
      if (ph === 'circle') { const locals = G.players.filter(p => p.local);
        S.innerHTML = `<div class="ph">Circle take <small>${Object.keys(G.votes).length} of ${voters().length} circled</small></div><div class="takes">${G.takes.map((t, k) => `<div class="tk"><span class="n">${k + 1}</span><span class="strip">${stripOf(t)}</span><span class="by"></span></div>`).join('')}</div>
          ${locals.map(p => `<div class="vrow"><span>${mini(p.av)} ${esc(p.name)}</span>${G.takes.map((t, k) => `<button class="btn chip ${G.votes[p.id] === k ? 'on' : ''}" data-p="${p.id}" data-k="${k}" ${t.by === p.id ? 'disabled' : ''}>${k + 1}</button>`).join('')}</div>`).join('')}
          <button class="btn cta dim" id="cv">close the vote</button>`;
        S.querySelectorAll('[data-p]').forEach(b => b.onclick = () => castVote(b.dataset.p, +b.dataset.k)); $('#cv').onclick = closeVote; return; }
      if (ph === 'result') { S.innerHTML = `<div class="ph">On air <small>who made what · who circled it</small></div><div class="takes">${G.takes.map((t, k) => { const vs = Object.entries(G.votes).filter(([, v]) => v === k).map(([id]) => P(id) ? mini(P(id).av) : ''); return `<div class="tk ${k === G.win ? 'win' : ''}"><span class="n">${k + 1}</span><span class="strip">${stripOf(t)}</span><span class="by">${who(t.by)}<br><span class="vs">${vs.join('') || '·'}</span></span></div>`; }).join('')}</div>
          <button class="btn cta alt" id="ct">Continuity ▸</button><div class="hint"><button id="srcB" style="text-decoration:underline">where this footage comes from ↗</button></div>`;
        $('#ct').onclick = continuity; $('#srcB').onclick = () => Attrib.show(usage(G.takes[G.win]).shots.map(s => ({ role: 'on air', video: url(s.v) }))); return; }
      if (ph === 'continuity') { S.innerHTML = `<div class="ph">Tomorrow <small>these are facts now</small></div><div class="sheet">${sheetHTML(G.sheets[G.sheets.length - 1], true)}</div><button class="btn cta" id="nd">${G.day < G.days ? 'Tomorrow’s call sheet ▸' : 'That’s a wrap ▸'}</button>`;
        $('#nd').onclick = () => { if (G.day < G.days) { G.day++; callSheet(); } else wrap(); }; return; }
      if (ph === 'wrap') { const r = rank();
        S.innerHTML = `<div class="ph">That’s a wrap <small>+1 a circle · +2 on air</small></div>${r.map((p, k) => `<div class="rk">#${k + 1} ${mini(p.av)} ${esc(p.name)}<b>${p.score}</b></div>`).join('')}<div class="rk">· ${mini('house')} the house<b>${G.house}</b></div>
          <button class="btn cta" id="pf">▶ The film</button><div class="ph" style="margin-top:12px">The call sheets <small>the history of the production</small></div><div class="stack">${G.sheets.map(s => `<div class="sheet">${sheetHTML(s, false)}${s.ledger ? `<div class="k">CONTINUITY</div>${s.ledger.map(([a, b]) => `<div class="sm"><b>${esc(a)}</b> — ${esc(b)}</div>`).join('')}` : ''}</div>`).join('')}</div>
          <button class="btn cta dim" id="again">New production</button>`;
        $('#pf').onclick = playFilm; $('#again').onclick = () => { G.phase = 'lobby'; G.day = 0; G.sheets = []; G.ledger = []; G.film = []; G.cont = {}; G.house = 0; G.players.forEach(p => p.score = 0); lobbyCard(); draw(); broadcast(); }; return; }
    }
    function lobbyCtl() { return `<div class="row" style="margin-top:6px"><input type="text" id="lname" maxlength="12" placeholder="add a player here"><button class="btn chip" id="ladd">+</button></div><div class="row" style="margin-top:6px"><span>days</span>${[2, 3, 4, 6].map(d => `<button class="btn chip ${G.days === d ? 'on' : ''}" data-d="${d}">${d}</button>`).join('')}</div>`; }
    function localRemote() { const st = G.eng ? G.eng.st() : { mute: false, hold: false };
      return `<div class="lrem"><button class="btn" data-b="cam-">CAM −</button><button class="btn" data-b="cam+">CAM +</button><button class="btn rec" data-b="rec">● REC</button><button class="btn" data-b="snd-">SND −</button><button class="btn" data-b="snd+">SND +</button><button class="btn ${st.mute ? 'on' : ''}" data-b="mute">MUTE</button><button class="btn" data-b="slip-">◀ slip</button><button class="btn" data-b="slip+">slip ▶</button><button class="btn ${st.hold ? 'on' : ''}" data-b="hold">HOLD</button></div><div class="hint" style="margin:-4px 0 6px">keys: ↑↓ cam · [ ] sound · ←→ slip · M · H · Enter</div>`; }
    function draw() { $('#roomTag').textContent = G.code && !wireNote ? 'ROOM ' + G.code : ''; syncCrew(); drawSide(); }
    function callSheet() { hushAll(); newDay(); G.phase = 'call'; $('#paper').innerHTML = `<div class="sheet">${sheetHTML(G.sheets[G.sheets.length - 1], false)}</div>`; show('#paper'); $('#bug').innerHTML = ''; draw(); broadcast(); }
    function lobbyCard() { slate(card(`<div><div class="big">Call Time<small>make today’s movie with whatever survived yesterday</small></div><div class="steps"><div><b>1</b>scan the code · pick a character</div><div><b>2</b>take the remote · cut it live</div><div><b>3</b>watch the dailies · circle the best</div><div><b>4</b>tomorrow lives with it</div></div></div>`, 'dawn')); }
    addEventListener('keydown', e => { if (G.phase !== 'air' || !G.air) return; const p = P(G.air.by); if (!p || !p.local) return;
      const b = { ArrowUp: 'cam+', ArrowDown: 'cam-', ']': 'snd+', '[': 'snd-', ArrowLeft: 'slip-', ArrowRight: 'slip+', m: 'mute', h: 'hold', Enter: 'rec' }[e.key]; if (b) { e.preventDefault(); press(p.id, b); } });
    addEventListener('resize', () => syncCrew());
    openRoom(); lobbyCard(); draw();
  }
})();
</script>
</body></html>
