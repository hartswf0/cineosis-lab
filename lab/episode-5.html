        el => { startVideos(el); subs(el); const v = el.querySelector('video'), sh = $('#shot', el); raf(() => { const t = v.currentTime, r = rows.find(x => t >= x.t0 && t < x.t1) || rows[0]; const tx = `${r.title} ${r.year || ''}`; if (sh.dataset.t !== tx) { sh.dataset.t = tx; sh.innerHTML = `now: <b>${esc(r.title)}</b> ${r.year || ''}`; } }); }); });
    B('Four ways to cut one line', 9, () => `<video class="full" data-src="https://pub-075ff01374c04555b51c9bc50f258b42.r2.dev/sources/5ecaea55-0235-5d7c-afbc-7626429f8f4e/v3-ffmpeg-openclip-1/clips/391c6fea-8b60-5f47-8deb-5a570ff8ff8f.mp4" muted playsinline loop></video><div class="fog"></div>
        ${line(['And “mine”: in Videotext, the lab\'s editing tool, anyone can put their own shot under a line.', 'This eye, from Small Steps… Giant Strides (1973), is one choice. That is a fifth take.'])}`, el => startVideos(el));
    /* 5 · the problems of time */
    const R0 = LN.takes.suite;
    B('The problems of time', LD + .8, () => `${film('suite', LN.t0, true)}<div class="poemsub" style="bottom:170px;font-size:24px"></div>
        <div style="position:absolute;left:60px;right:60px;bottom:60px;height:56px;background:rgba(0,0,0,.6);border:1px solid #2e2a26" id="tl">${R0.map(r => `<div style="position:absolute;top:0;bottom:0;left:${(Math.max(r.t0, LN.t0) - LN.t0) / LD * 100}%;width:${(Math.min(r.t1, LN.t1) - Math.max(r.t0, LN.t0)) / LD * 100}%;border-right:3px solid var(--red);font:15px var(--mono);color:var(--ink);padding:6px 10px;overflow:hidden">${esc(r.title)} · ${(r.t1 - r.t0).toFixed(1)} s</div>`).join('')}<div id="ph" style="position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--lime)"></div></div>
        <div id="tn" style="position:absolute;left:60px;top:50px;right:60px;z-index:3;font:30px/1.3 var(--serif);color:var(--ink);text-shadow:0 2px 10px #000"></div>`,
      el => { startVideos(el); subs(el); const v = el.querySelector('video'), ph = $('#ph', el), tn = $('#tn', el);
        const notes = [[0, `The line is ${LD.toFixed(1)} seconds long. The music decides where it is cut: here, at ${(cut - LN.t0).toFixed(1)} s.`], [3.5, 'A shot must last its whole moment: no slowing down, no looping.'], [8, 'Each starts at its liveliest few seconds, not at its beginning.'], [12, 'And the cut never waits for the end of a sentence.']];
        raf(() => { const t = v.currentTime - LN.t0; ph.style.left = Math.max(0, Math.min(100, t / LD * 100)) + '%'; const n = notes.filter(x => t >= x[0]).at(-1); if (n && tn.dataset.k != n[0]) { tn.dataset.k = n[0]; tn.textContent = n[1]; } }); });
    /* 6 · what the signs ask */
    const C0 = LN.takes.cineosis[0], SG = LN.signs, s0 = SG.find(x => x.n === C0.codes[1]) || SG[0];
    B('What the signs ask', 10, () => `${ask('What does the Cineosis take look for?')}<div class="roles" style="top:200px;grid-template-columns:1fr 1fr">${SG.filter(x => C0.codes.includes(x.n)).map((x, i) => `<div style="animation-delay:${i * 1.2}s;--c:var(--lime)"><b>${esc(x.symbol)} · ${esc(x.name)}</b><p style="font-size:34px">${esc(x.question)}</p></div>`).join('')}</div>
        ${line(['The poem\'s treatment gives each moment one or two signs.', 'Each sign is a question the picture should answer.'])}`);
    B('What the signs ask', 13, () => { const others = NAMES.map(n => ({ n, r: LN.takes[n][0] })); const mx = Math.max(...others.map(o => o.r.aff[s0.n] || 0));
      return `${film('cineosis', LN.t0 + .5, false)}<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.2) 60%)"></div>
        <div style="position:absolute;left:60px;top:60px;width:760px;z-index:3"><b style="font:600 16px var(--mono);color:var(--lime);letter-spacing:.12em">“${esc(s0.question)}”</b><p style="font:22px var(--serif);color:var(--dim);margin:8px 0 22px">how strongly the machine finds it in each take's shot for this moment</p>
        <div style="display:flex;flex-direction:column;gap:16px">${others.map((o, i) => `<div class="${o.n === 'cineosis' ? 'won' : ''}" style="display:grid;grid-template-columns:150px 1fr 90px;gap:16px;align-items:center;font:22px var(--serif);animation-delay:${.5 + i * .4}s;opacity:0;animation:up .6s ease forwards ${.5 + i * .4}s"><span style="font:600 15px var(--mono);color:var(--lime);text-transform:uppercase">${o.n}</span><i style="height:22px;background:#1e1a14;position:relative;border-radius:3px"><b data-w="${(o.r.aff[s0.n] || 0) / mx * 100}" style="position:absolute;inset:0 auto 0 0;width:0;background:${o.n === 'cineosis' ? 'var(--lime)' : '#5a544a'};transition:width 1.6s;border-radius:3px"></b></i><em style="font:18px var(--mono);color:var(--ink);font-style:normal;text-align:right">${(o.r.aff[s0.n] || 0).toFixed(1)}%</em></div>`).join('')}</div>
        <p style="font:18px var(--mono);color:var(--dim);margin-top:24px">${esc(C0.title)} ${C0.year || ''} · a machine pointer, not a reading: ${C0.read.length ? 'it was also read' : 'no person has read this shot'}</p></div>`; },
      el => { startVideos(el); later(600, () => el.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%')); });
    /* 4 · why that shot: the rule, replayed */
    const WHY = window.__why;
    ['suite', 'cineosis', 'drift'].forEach((tk, k) => { const r = WHY && WHY.takes[tk] && WHY.takes[tk]['20']; if (!r) return;
      B('Why that shot', 16, () => { const C = r.cands.slice(0, 11), ok = C.filter(c => !c.out), lo = Math.min(...C.map(c => c.total)), hi = Math.max(...C.map(c => c.total)), win = C.find(c => c.won), second = ok.filter(c => !c.won).sort((a, b) => b.total - a.total)[0];
        const adj = c => [['pace', c.pace], ['stock', c.stock], ['sign', c.sign], ['reviewed', c.reviewed], ['follows', c.drift], ['used before', c.reuse]].filter(([, v]) => Math.abs(v) >= .005).map(([n, v]) => `${n} ${v > 0 ? '+' : ''}${v.toFixed(2)}`).join(' · ');
        return `${k ? '' : ask('Why that shot, and not another?')}<div class="want"><b>${tk} asks for</b>“${esc(r.intent.join(' · '))}”</div>
          <div class="cands">${C.map((c, i) => `<div class="cand ${c.won ? 'won' : ''} ${c.out ? 'out' : ''}" style="animation-delay:${.6 + i * .25}s"><div class="bar" data-h="${20 + (c.total - lo) / Math.max(.001, hi - lo) * 220}"><span class="sc">${c.total.toFixed(3)}</span></div>${c.out ? `<span class="why">${esc(c.out)}</span>` : ''}<img src="${esc(c.thumb)}"><div class="adj">${esc(adj(c))}</div><div class="nm">${esc(c.title)}</div></div>`).join('')}</div>
          ${line([win && second ? `It won by ${(win.total - second.total).toFixed(3)}.` : '', k === 2 ? 'Its best matches were already used: the rule, not the match, decided.' : 'Every bar is the same question: how close is this picture to those words?'].filter(Boolean), 'bars stretched so differences of a thousandth can be seen · dark red: not allowed, and why')}`; },
        el => later(500, () => el.querySelectorAll('.cand .bar').forEach(b => b.style.height = b.dataset.h + 'px'))); });
    B('Why that shot', 9, () => line(['Scenes, the fourth take, asks differently:', 'it picks a whole run of one film\'s shots for the line, in that film\'s own order.']).replace('class="line"', 'class="line" style="bottom:auto;top:360px"'));
    B('Every track at once', 32, () => `<div class="roomcap"></div>`, el => K.room(el, 'syzygy/', [
      { act: d => { const b = d.querySelector('#play'); if (b) b.click(); }, cap: '<b>Syzygy</b>Every version of the poem as a track, aligned phrase by phrase.' },
      { at: 5, sel: '#stage', pad: 4, cap: '<b>One clock</b>Each row a way of answering the poem; the column is the moment you are hearing.' },
      { at: 14, sel: '#stage', frac: [0, 0, .5, .5], cap: '<b>Close</b>The same words, answered differently in every row.' },
      { at: 23, sel: '#stage', frac: [.45, .3, .55, .7], cap: '<b>Where they agree</b>Where rows line up, several ways of asking reached the same kind of picture.' }]));
    /* 5 · the map of every shot */
    const lanes = rule => `<div class="lanes">${NAMES.map((n, j) => `<div class="lane" data-n="${n}"><span class="lanelab">${n}</span>${P[n].map((p, i) => `<i class="${W.agree.includes(i) ? 'agree' : ''}" style="width:${(p[1] - p[0]) / W.dur * 1400}px;background-image:url('${esc(p[2])}');animation-delay:${j * .5 + i * .006}s"></i>`).join('')}${rule ? `<div class="lanerule" style="transition-delay:${j * .8}s">${RULE[n]}</div>` : ''}</div>`).join('')}</div>`;
    B('How different are they?', 15, () => `${ask('How different are they, really?')}${lanes(false)}<div class="playhead" id="ph" style="left:150px"></div>
        ${line([`Every shot of all four takes, along the poem's twenty-four minutes.`, `Any two share at most ${Math.max(...Object.values(W.shared))} of their ${P.suite.length}. All four agree only ${W.agree.length} times.`], 'the lime frames: the few moments all four chose the same')}`,
      el => raf(t => { $('#ph', el).style.left = (150 + Math.min(1, t / 14) * 1400) + 'px'; return t < 14; }));
    /* 6 · which one is right */
    B('Which one is right?', 17, () => { const ps = patch(120); return `${ask('Which one is right?')}<div class="two" style="top:100px">${[['suite', 0], ['drift', 3]].map(([n, j]) => `<figure>${film(n, ps[j][0] + .3, n === 'suite', '', 'width:100%;height:100%;object-fit:cover')}<figcaption>${n}</figcaption></figure>`).join('')}</div>
        ${line(['None of them. Each rule makes a different film.', 'You choose by watching.'])}`; }, el => startVideos(el));
    /* 7 · what the archive could not give */
    W.beats.filter(b => [1, 4].includes(b.id)).forEach((b, k) => B('What the archive could not give', 10, () => `${k ? '' : ask('What could the archive not give?')}${film('suite', b.t0 + .5, true)}
        <div class="gapbox"><div style="animation-delay:.6s;border-left:4px solid var(--lime)"><small style="color:var(--lime)">THE TREATMENT ASKED FOR</small><p>${esc(b.title)}</p></div><div style="animation-delay:2.4s;border-left:4px solid var(--red)"><small style="color:var(--red)">THE ARCHIVE COULD NOT GIVE</small><p>${esc(b.gap)}</p></div></div>`, el => startVideos(el)));
    B('What the archive could not give', 8, () => line(['The poet is never in the picture.', 'Strangers from old films stand in for him, every time.']).replace('class="line"', 'class="line" style="bottom:auto;top:380px"'));
    }
    /* 8 · next */
    if (PART !== 'compare') B('What next', 40, () => `<div class="next"><small>NEXT · THE FOUR TAKES, ONE AT A TIME</small><h1 style="color:var(--lime);font-style:italic;font-weight:400">Suite</h1><p style="font:28px/1.35 var(--serif);color:#d8d0c2;margin:0">What happens when the director's notes become search words?</p><nav><a href="wygwyl-take.html?t=suite" style="background:var(--lime)">Watch Suite</a><a class="ghost" href="wygwyl-take.html?t=scenes" style="color:var(--lime);border-color:var(--lime)">Scenes</a><a class="ghost" href="wygwyl-take.html?t=cineosis" style="color:var(--lime);border-color:var(--lime)">Cineosis</a><a class="ghost" href="wygwyl-take.html?t=drift" style="color:var(--lime);border-color:var(--lime)">Drift</a></nav></div>`);
    else B('What next', 40, () => `<div class="next"><small>WATCH ALL FOUR TAKES · OR CUT YOUR OWN</small><h1 style="color:var(--lime);font-style:italic;font-weight:400">Where You Go When You Leave</h1><nav><a href="wygwyl.html" style="background:var(--lime)">The four takes</a><a class="ghost" href="videotext.html" style="color:var(--lime);border-color:var(--lime)">Videotext: cut your own</a><a class="ghost" href="series.html" style="color:var(--lime);border-color:var(--lime)">All episodes</a></nav></div>`);
  }
};
