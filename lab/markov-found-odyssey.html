<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Found Odyssey</title>
<meta name="description" content="The Odyssey said by the archive: every line answered by whole things archival people actually said, delivered with a breath between, or translated word for word (literal, kinship, performance), set interlinear, Homer above and the archive below.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#8a8378; --faint:#2a2723; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px var(--mono); overflow:hidden; } button,select{ font:inherit; color:inherit; }
body{ display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto auto; height:100dvh; }
header{ display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 4px; } #markLink{ display:flex; align-items:center; gap:8px; color:var(--ink); text-decoration:none; letter-spacing:.2em; font-size:10.5px; white-space:nowrap; } #markLink span{ color:var(--dim); }
#scene{ flex:1; min-width:0; background:#121110; border:1px solid var(--faint); border-radius:16px; padding:6px 10px; font-size:11px; }
#dial{ display:flex; gap:2px; margin:4px 12px 6px; background:#121110; border:1px solid var(--faint); border-radius:18px; padding:2px; overflow-x:auto; scrollbar-width:none; } #dial::-webkit-scrollbar{ display:none; }
#dial button{ flex:1 0 auto; border:0; background:none; border-radius:16px; padding:7px 10px; cursor:pointer; color:var(--dim); font-size:10px; letter-spacing:.14em; } #dial button.on{ background:#e8c07022; color:var(--hi); }
#dial button small{ display:block; font-size:8.5px; letter-spacing:.04em; color:#6b655d; margin-top:2px; }
main{ position:relative; background:#000; min-height:0; touch-action:pan-y; } main video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .25s; } main video.on{ opacity:1; } main.rest video.on{ opacity:.35; }
#who{ position:absolute; left:10px; top:10px; font:10px var(--mono); color:#d6cfc2; background:#000a; border-radius:12px; padding:4px 9px; max-width:calc(100% - 20px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #who:empty{ display:none; }
#tap{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; } #tap svg{ width:56px; height:56px; padding:14px; border-radius:50%; background:#0009; color:#efe9dd; opacity:0; transition:opacity .3s; } #tap.show svg{ opacity:1; }
#line{ padding:10px 4vw 4px; min-height:140px; max-height:36vh; overflow:auto; }
#line small{ display:block; font:500 10px var(--mono); letter-spacing:.2em; color:var(--hi); margin-bottom:8px; text-align:center; }
.il{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px 14px; }
.il .f{ display:grid; justify-items:center; gap:2px; padding:2px 4px; border-radius:4px; transition:background .12s; } .il .f.on{ background:#ffffff10; }
.il .h{ font:300 clamp(15px,2vw,22px)/1.2 var(--serif); color:#cfc8bb; } .il .a{ font:400 11px/1.3 var(--mono); color:#7d776f; } .il .f.on .a{ color:var(--ink); } .il .f.done .a{ color:#a59e93; }
.il .a k{ color:var(--hi); } .il .f.gap .h{ color:#4a4540; text-decoration:line-through; } .il .f.gap .a{ color:#4a4540; } .il .f.el .h{ color:#4a4540; font-style:italic; }
.sp{ max-width:760px; margin:0 auto; display:grid; gap:10px; }
.sp .f{ padding:6px 10px; border-left:2px solid transparent; border-radius:2px; transition:background .15s, border-color .15s; } .sp .f.on{ background:#ffffff0c; border-left-color:var(--hi); }
.sp .h{ display:block; font:300 clamp(16px,2.1vw,22px)/1.3 var(--serif); color:#a59e93; } .sp .f.on .h{ color:#d8d1c4; }
.sp .a{ display:block; font:italic 300 clamp(18px,2.4vw,26px)/1.32 var(--serif); color:#8f887d; margin-top:3px; } .sp .f.on .a, .sp .f.done .a{ color:var(--ink); }
.sp .s{ display:block; font:10px var(--mono); color:#5f5951; margin-top:4px; letter-spacing:.04em; }
#line .cov{ margin-top:8px; font-size:10.5px; color:var(--dim); text-align:center; }
footer{ display:flex; align-items:center; gap:6px; padding:4px 10px calc(10px + env(safe-area-inset-bottom)); }
.ico{ width:44px; height:44px; display:grid; place-items:center; background:none; border:0; border-radius:50%; cursor:pointer; color:#bdb5a9; flex:none; } .ico:hover{ background:#ffffff12; } .ico svg{ width:20px; height:20px; } #bPlay{ background:#e8c07018; color:var(--hi); }
.tg{ border:1px solid var(--faint); background:none; border-radius:16px; padding:7px 11px; cursor:pointer; color:var(--dim); font-size:10px; letter-spacing:.1em; white-space:nowrap; } .tg.on{ color:var(--hi); border-color:#5a4e33; }
#prog{ flex:1; color:var(--dim); font-size:10.5px; text-align:right; }
@media (max-width:640px){
  body{ grid-template-rows:auto auto 34vh minmax(0,1fr) auto; }
  #markLink b{ display:none; } #dial{ margin:2px 10px 6px; } #dial button{ padding:8px 12px; } #dial button small{ display:none; }
  #line{ max-height:none; min-height:0; padding:12px 16px 6px; } .il{ gap:8px 10px; } .il .h{ font-size:16px; }
  footer{ justify-content:space-between; gap:2px; } #prog{ display:none; } .tg{ padding:7px 8px; font-size:9px; letter-spacing:.05em; } #deliv{ order:-1; } .ico{ width:44px; height:44px; } #bPlay{ width:54px; height:54px; }
}
</style></head><body>
<header><a id="markLink" href="markov-poet.html"></a><select id="scene" aria-label="Scene"></select></header>
<nav id="dial" aria-label="How to translate">
  <button data-m="spoken">SPOKEN<small>whole sentences that say it</small></button><button data-m="sense">SENSE<small>one sentence for the line</small></button>
  <button data-m="performance">PERFORMANCE<small>longer runs, fewer voices</small></button><button data-m="kinship">KINSHIP<small>kindred words where it lacks his</small></button>
  <button data-m="literal">LITERAL<small>Homer's words, his order</small></button></nav>
<main id="stage"><video id="a" playsinline preload="auto"></video><video id="b" playsinline preload="auto"></video><div id="who"></div><div id="tap"><svg><use href="#i-play"/></svg></div></main>
<div id="line"></div>
<footer><button class="ico" id="bPrev" aria-label="Previous line"><svg><use href="#i-prev"/></svg></button><button class="ico" id="bPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="ico" id="bNext" aria-label="Next line"><svg><use href="#i-next"/></svg></button>
  <button class="tg" id="deliv" title="How one voice gives way to the next">BREATH</button><button class="tg" id="ours" title="Our studio voice under the archive">STUDIO</button><div id="prog"></div></footer>
<audio id="voice" preload="auto"></audio>
<script src="markov/ui.js?v=3"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  MPUI.sprite(); $('#markLink').innerHTML = MPUI.mark(22) + '<b>THE FOUND </b><span>ODYSSEY</span>';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  const MODES = ['spoken', 'sense', 'performance', 'kinship', 'literal'], DELIV = ['BREATH', 'JOINED', 'CUT'];
  const qs = new URLSearchParams(location.search);
  let F = null, R = null, sid = null, li = 0, fi = 0, playing = false, layer = 0, guard = 0, ours = false, unlocked = false;
  let mode = MODES.includes(qs.get('mode')) ? qs.get('mode') : store.get('found.mode2', 'spoken'), deliv = store.get('found.deliv', 'BREATH');
  const V = [$('#a'), $('#b')], voice = $('#voice'), stage = $('#stage');
  // the delivery: BREATH leaves a held breath between voices and a longer rest between lines; JOINED lets the next voice begin
  // 90 ms early, sound and picture crossing; CUT is a straight cut
  const XF = 90, BREATH = () => mode === 'spoken' || mode === 'sense' ? 420 : 160, REST = () => deliv === 'BREATH' ? 900 : 450;
  const lines = () => F.scenes[sid] || [];
  const tr = u => u && (u.modes[mode] || (mode === 'spoken' || mode === 'sense' ? null : u.modes.kinship));
  const src = x => { const c = F.clips[x.id] || {}; return (c.title || '') + (c.year ? ' · ' + c.year : ''); };
  function drawLine() { const u = lines()[li]; if (!u) { $('#line').innerHTML = ''; return; } const t = tr(u);
    let body, cov = '';
    if (!t) body = `<div class="sp"><div class="f"><span class="h">${esc(u.text)}</span><span class="a" style="color:#4a4540">the archive has nothing that says this yet</span></div></div>`;
    else if (mode === 'spoken' || mode === 'sense') { body = `<div class="sp">${t.frags.map((x, n) => `<div class="f" data-n="${n}"><span class="h">${esc(x.homer || (t.frags.length === 1 ? u.text : ''))}</span><span class="a">“${esc(x.words)}”</span><span class="s">${esc(src(x))}</span></div>`).join('')}</div>`;
      cov = `${t.frags.length === 1 ? 'one voice' : t.frags.length + ' voices'} · ${t.frags.reduce((a, x) => a + x.t1 - x.t0, 0).toFixed(1)} s · match ${Math.round((t.score || 0) * 100)}`; }
    else { body = `<div class="il">${t.frags.map((x, n) => x.gap ? `<div class="f gap" data-n="${n}"><span class="h">${esc(x.gap)}</span><span class="a">never said</span></div>`
        : x.elided ? `<div class="f el" data-n="${n}"><span class="h">${esc(x.elided)}</span><span class="a">·</span></div>`
        : `<div class="f" data-n="${n}"><span class="h">${esc(x.homer)}</span><span class="a">${esc(x.words).split(' ').map(w => (x.kin || []).some(p => p[1] === w.toLowerCase().replace(/[^a-z0-9']/g, '')) ? `<k>${w}</k>` : w).join(' ')}</span></div>`).join('')}</div>`;
      cov = `fidelity ${Math.round(t.fidelity * 100)}% · ${t.cuts} fragment${t.cuts === 1 ? '' : 's'} · ${t.voices} voice${t.voices === 1 ? '' : 's'}${t.gaps ? ' · ' + t.gaps + ' never said' : ''}${t.elided ? ' · ' + t.elided + ' left out' : ''}`; }
    $('#line').innerHTML = `<small>${esc(u.who)} · line ${li + 1} of ${lines().length}</small>${body}<div class="cov">${cov}</div>`; $('#line').scrollTop = 0;
    const all = lines().map(tr).filter(Boolean); $('#prog').textContent = !all.length ? '' : all[0].fidelity != null ? `scene fidelity ${Math.round(all.reduce((a, x) => a + x.fidelity, 0) / all.length * 100)}%` : `scene match ${Math.round(all.reduce((a, x) => a + (x.score || 0), 0) / all.length * 100)}`; }
  function mark(n) { $('#line').querySelectorAll('.f').forEach(f => { const k = +f.dataset.n; f.classList.toggle('on', k === n); f.classList.toggle('done', k < n); }); const on = $('#line .f.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  // ready the next voice on the hidden layer, already sought to where it begins, so it starts on time
  function prep(v, x) { const c = F.clips[x.id]; if (!c) return; if (v.dataset.id !== x.id) { v.src = c.video; v.dataset.id = x.id; v.load(); }
    const seek = () => { try { if (Math.abs(v.currentTime - x.t0) > .12) v.currentTime = x.t0; } catch (e) { } }; if (v.readyState >= 1) seek(); else v.addEventListener('loadedmetadata', seek, { once: true }); }
  function fade(v, to, ms, from) { const t0 = performance.now(), a = from == null ? v.volume : from; try { v.volume = a; } catch (e) { } const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); try { v.volume = Math.max(0, Math.min(1, a + (to - a) * k)); } catch (e) { } if (k < 1) requestAnimationFrame(step); }; step(); }
  function upcoming(after) { const t = tr(lines()[li]); if (t) for (let n = after + 1; n < t.frags.length; n++) if (t.frags[n].id) return t.frags[n];
    const t2 = tr(lines()[li + 1]); return t2 ? t2.frags.find(x => x.id) : null; }
  function rest(ms, then) { stage.classList.add('rest'); const my = guard; setTimeout(() => { if (my === guard && playing) { stage.classList.remove('rest'); then(); } }, ms); }
  function playFrag() { if (!playing) return; const u = lines()[li]; const t = tr(u);
    if (!u) { stop(); return; }
    if (!t || fi >= t.frags.length) { const p = V[1 - layer]; if (deliv !== 'JOINED') { fade(p, 0, 120); setTimeout(() => p.pause(), 130); }
      li++; fi = 0; if (li >= lines().length) { stepScene(1); return; } drawLine(); rest(t ? REST() : 1600, startLine); return; }
    const x = t.frags[fi]; mark(fi);
    if (x.gap || x.elided) { $('#who').textContent = x.gap ? 'the archive never says “' + x.gap + '”' : '“' + x.elided + '” left out'; fi++; setTimeout(playFrag, x.gap ? 360 : 60); return; }
    const v = V[layer], o = V[1 - layer], my = ++guard; prep(v, x);
    $('#who').textContent = src(x) + ' · “' + x.words + '”';
    const start = () => { if (my !== guard) return; try { if (Math.abs(v.currentTime - x.t0) > .12) v.currentTime = x.t0; } catch (e) { } v._unlock = false; v.muted = false; v.classList.add('on'); v.play().catch(() => { });
      if (deliv === 'JOINED') { fade(v, 1, XF, 0); if (!o.paused) fade(o, 0, XF); setTimeout(() => { if (my === guard) { o.pause(); o.classList.remove('on'); } }, XF + 20); }
      else { fade(v, 1, deliv === 'BREATH' ? 60 : 1, 0); o.pause(); o.classList.remove('on'); }
      const nx = upcoming(fi); if (nx) prep(o, nx);
      const lead = deliv === 'JOINED' ? XF / 1000 : deliv === 'BREATH' ? .07 : 0;
      const watch = setInterval(() => { if (my !== guard) { clearInterval(watch); return; } if (v.currentTime >= x.t1 - lead || v.ended) { clearInterval(watch);
        fi++; const more = fi < t.frags.length;
        if (deliv === 'BREATH') { fade(v, 0, 70); setTimeout(() => { if (my === guard) v.pause(); }, 80); layer = 1 - layer; if (more) rest(BREATH(), playFrag); else playFrag(); }
        else { if (deliv === 'CUT') v.pause(); layer = 1 - layer; playFrag(); } } }, 15); };
    if (v.readyState >= 2 && !v.seeking) start(); else { const go = () => { v.removeEventListener('seeked', go); v.removeEventListener('canplay', go); start(); }; v.addEventListener('seeked', go); v.addEventListener('canplay', go);
      setTimeout(() => { if (my === guard && v.paused) { fi++; playFrag(); } }, 6000); } }
  function startLine() { const u = lines()[li]; if (ours && u && R) { const s = R.find(x => x.id === sid); if (s) { if (voice.dataset.u !== s.voice) { voice.src = s.voice; voice.dataset.u = s.voice; } voice._unlock = false; voice.muted = false; voice.currentTime = u.t0; try { voice.volume = .55; } catch (e) { } voice.play().catch(() => { }); clearTimeout(voice._t); voice._t = setTimeout(() => voice.pause(), (u.t1 - u.t0) * 1000 + 200); } } fi = 0; playFrag(); }
  function stop() { playing = false; guard++; V.forEach(v => v.pause()); voice.pause(); stage.classList.remove('rest'); $('#bPlay').innerHTML = '<svg><use href="#i-play"/></svg>'; }
  function go(n) { guard++; V.forEach(v => v.pause()); voice.pause(); stage.classList.remove('rest'); li = Math.max(0, Math.min(lines().length - 1, n)); fi = 0; drawLine(); const x = (tr(lines()[li]) || { frags: [] }).frags.find(x => x.id); if (x) { prep(V[layer], x); if (!playing) { V[layer].classList.add('on'); V[1 - layer].classList.remove('on'); $('#who').textContent = src(x); } } if (playing) startLine(); }
  function stepScene(d) { const o = $('#scene'), k = o.selectedIndex + d; if (k < 0 || k >= o.options.length) { stop(); return; } o.selectedIndex = k; sid = o.value; li = 0; drawLine(); if (playing) rest(1400, startLine); }
  function setMode(m) { mode = m; store.set('found.mode2', m); document.querySelectorAll('#dial button').forEach(b => { b.classList.toggle('on', b.dataset.m === m); if (b.dataset.m === m && b.scrollIntoView) b.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }); go(li); }
  // phones only let a page sound after a touch: wake both picture layers and the studio voice on the first one
  function unlock() { if (unlocked) return; unlocked = true; [...V, voice].forEach(m => { if (!m.src) return; m._unlock = true; m.muted = true; const p = m.play(); const done = () => { if (m._unlock) { m.pause(); m.muted = false; } m._unlock = false; }; if (p) p.then(done, done); }); }   // a voice claimed meanwhile is left playing
  function toggle() { unlock(); playing = !playing; $('#bPlay').innerHTML = `<svg><use href="#i-${playing ? 'pause' : 'play'}"/></svg>`; if (playing) startLine(); else stop();
    const tp = $('#tap'); tp.innerHTML = `<svg><use href="#i-${playing ? 'play' : 'pause'}"/></svg>`; tp.classList.add('show'); setTimeout(() => tp.classList.remove('show'), 500); }
  document.querySelectorAll('#dial button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  $('#bPlay').onclick = toggle; $('#bNext').onclick = () => go(li + 1); $('#bPrev').onclick = () => go(li - 1);
  $('#ours').onclick = () => { ours = !ours; $('#ours').classList.toggle('on', ours); };
  const drawDeliv = () => { $('#deliv').textContent = deliv; $('#deliv').classList.toggle('on', deliv !== 'CUT'); }; drawDeliv();
  $('#deliv').onclick = () => { deliv = DELIV[(DELIV.indexOf(deliv) + 1) % DELIV.length]; store.set('found.deliv', deliv); drawDeliv(); };
  $('#scene').onchange = () => { sid = $('#scene').value; go(0); };
  // touch: tap the picture to play or pause, swipe across the picture or the words for the next or previous line
  let sx = null, sy = 0, st = 0; const touch = 'ontouchstart' in window;
  [stage, $('#line')].forEach(el => { el.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now(); }, { passive: true });
    el.addEventListener('touchend', e => { if (sx == null) return; const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy; sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { go(li + (dx < 0 ? 1 : -1)); e.preventDefault(); }
      else if (el === stage && Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - st < 400) { toggle(); e.preventDefault(); } }); });
  stage.addEventListener('click', () => { if (!touch) toggle(); });
  addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === ' ') { e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') go(li + 1); else if (e.key === 'ArrowLeft') go(li - 1); else if ('12345'.includes(e.key)) setMode(MODES[+e.key - 1]); });
  Promise.all([fetch('odyssey/found.json').then(r => r.json()), fetch('odyssey/radio.json').then(r => r.json()).catch(() => null)]).then(([f, r]) => { F = f; R = r ? r.books.flatMap(b => b.scenes) : null;
    const titles = R ? Object.fromEntries(R.map(s => [s.id, s.title])) : {};
    Object.keys(F.scenes).sort().forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = `${id.slice(3).replace('-', ' ')} · ${titles[id] || ''}`; $('#scene').append(o); });
    const want = qs.get('scene'); sid = F.scenes[want] ? want : 'OD-B09-S09'; $('#scene').value = sid;
    if (mode === 'spoken' && !Object.values(F.scenes).some(v => v.some(u => u.modes.spoken))) mode = 'sense';
    setMode(mode); }).catch(e => { $('#line').textContent = 'could not load: ' + e.message; });
})();
</script></body></html>
