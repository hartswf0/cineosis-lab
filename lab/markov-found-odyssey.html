<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Found Odyssey</title>
<meta name="description" content="The Odyssey said by the archive: every line answered by whole things archival people actually said, delivered with a breath between, or translated word for word (literal, kinship, performance), set interlinear, Homer above and the archive below.">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px var(--mono); overflow:hidden; } button,select{ font:inherit; color:inherit; }

.cr .ans .a{ display:block; font:italic 300 clamp(19px,2.6vw,28px)/1.32 var(--serif); color:#8f887d; } .cr .ans.on .a, .cr .ans.done .a{ color:var(--ink); }
.cr .ans .s{ display:block; font:10px var(--mono); color:#5f5951; margin-top:3px; }

  #line{ max-height:none; min-height:0; padding:12px 16px 6px; } .il{ gap:8px 10px; } .il .h{ font-size:16px; }
  footer{ justify-content:space-between; gap:2px; } #prog{ display:none; } .tg{ padding:7px 8px; font-size:9px; letter-spacing:.05em; } #deliv{ order:-1; } .ico{ width:44px; height:44px; } #bPlay{ width:54px; height:54px; }
}
</style></head><body>
<header><a id="markLink" href="markov-poet.html"></a><button class="tg" id="gridBtn" title="See everyone at once: the voices as a call, the poem's footage beside">GRID</button><a class="tg" href="markov-odyssey-drive.html" style="text-decoration:none">DRIVE</a><select id="scene" aria-label="Scene"></select></header>
<nav id="dial" aria-label="How to translate">
  <button data-m="call">CALL<small>the line, then the archive answers</small></button><button data-m="spoken">SPOKEN<small>whole sentences that say it</small></button><button data-m="sense">SENSE<small>one sentence for the line</small></button>
  <button data-m="performance">PERFORMANCE<small>longer runs, fewer voices</small></button><button data-m="kinship">KINSHIP<small>kindred words where it lacks his</small></button>
  <button data-m="literal">LITERAL<small>Homer's words, his order</small></button></nav>
<main id="stage"><video class="pool" playsinline muted preload="auto"></video><video class="pool" playsinline muted preload="auto"></video><video class="pool" playsinline muted preload="auto"></video><video class="pool" playsinline muted preload="auto"></video><video class="bs" playsinline muted preload="auto"></video><video class="bs" playsinline muted preload="auto"></video><div id="grid" aria-label="The call"></div><div id="who"></div><div id="tap"><svg><use href="#i-play"/></svg></div></main>
<div id="line"></div>
<footer><button class="ico" id="bPrev" aria-label="Previous line"><svg><use href="#i-prev"/></svg></button><button class="ico" id="bPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="ico" id="bNext" aria-label="Next line"><svg><use href="#i-next"/></svg></button>
  <button class="tg" id="deliv" title="How one voice gives way to the next">BREATH</button><button class="tg" id="ours" title="Our studio voice under the archive">STUDIO</button><div id="prog"></div></footer>
<audio id="voice" preload="auto"></audio><audio id="track" preload="auto"></audio>
<script src="markov/ui.js?v=3"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  MPUI.sprite(); $('#markLink').innerHTML = MPUI.mark(22) + '<b>THE FOUND </b><span>ODYSSEY</span>';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  const MODES = ['call', 'spoken', 'sense', 'performance', 'kinship', 'literal'], DELIV = ['BREATH', 'JOINED', 'CUT'];
  const qs = new URLSearchParams(location.search);
  let F = null, R = null, sid = null, li = 0, fi = 0, playing = false, layer = 0, guard = 0, ours = false, unlocked = false;
  let mode = MODES.includes(qs.get('mode')) ? qs.get('mode') : store.get('found.mode3', 'call'), deliv = store.get('found.deliv', 'BREATH');
  const POOL = [...document.querySelectorAll('#stage video.pool')], voice = $('#voice'), stage = $('#stage');
  // The delivery. Four picture layers: the next voices are loaded and parked on their first frame before they are needed, so a
  // voice starts the moment it is called. The picture never stops: it plays on, silent, through each breath and each rest between
  // lines, and dissolves into the next picture. A short fragment is heard without taking the picture (it would only flicker);
  // a word the archive never says is said by our own studio voice under the held picture.
  // BREATH: a held breath between voices. JOINED: the next voice begins 90 ms early, the sounds cross. CUT: no dissolve, no breath.
  const XF = 90, BREATH = () => mode === 'spoken' || mode === 'sense' ? 420 : 120, REST = () => deliv === 'BREATH' ? 900 : 450, TAKE = 0.9;
  const lines = () => F.scenes[sid] || [];
  const tr = u => u && (mode === 'call' ? u.modes.spoken : u.modes[mode] || (mode === 'spoken' || mode === 'sense' ? null : u.modes.kinship));
  const src = x => { const c = F.clips[x.id] || {}; return (c.title || '') + (c.year ? ' · ' + c.year : ''); };
  const keyOf = x => x.id + '@' + x.t0;
  let shown = null, cur = null, z = 1;
  // what the call and its answer have in common: the content words they share, by stem, lit in both
  const STOPW = new Set('a an the and or but of to in on at by for with from as is are was were be been it its this that i you he she we they me him her us them my your his our their not no so if then than there here what who which when where how all any some one into out up down over under o oh let now upon shall will would should could may might must do did does have has had am'.split(' '));
  const stem = w => w.toLowerCase().replace(/[^a-z']/g, '').replace(/'s$/, '').replace(/(ing|ed|es|s)$/, '');
  function shared(a, b) { const A = new Set(a.split(/\s+/).map(w => w.toLowerCase().replace(/[^a-z']/g, '')).filter(w => w.length > 2 && !STOPW.has(w)).map(stem)); const S = new Set();
    b.split(/\s+/).forEach(w => { const c = w.toLowerCase().replace(/[^a-z']/g, ''); if (c.length > 2 && !STOPW.has(c) && A.has(stem(c))) S.add(stem(c)); }); return S; }
  const lit = (text, S) => text.split(/(\s+)/).map(w => S.has(stem(w)) && !STOPW.has(w.toLowerCase().replace(/[^a-z']/g, '')) ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
  function drawLine() { const u = lines()[li]; if (!u) { $('#line').innerHTML = ''; return; } const t = tr(u);
    let body, cov = '';
    if (mode === 'call' && t) { const sh = shared(u.text, t.frags.map(x => x.words).join(' '));
      body = `<div class="cr"><div class="call" data-n="-1"><em>THE LINE</em>${lit(u.text, sh)}</div>${t.frags.map((x, n) => `<div class="ans" data-n="${n}"><span class="a">“${lit(x.words, sh)}”</span><span class="s">${esc(src(x))}</span></div>`).join('')}</div>`;
      cov = sh.size ? `they share ${[...sh].join(', ')}` : 'it answers in other words'; }
    else if (!t) body = `<div class="sp"><div class="f"><span class="h">${esc(u.text)}</span><span class="a" style="color:#4a4540">the archive has nothing that says this yet</span></div></div>`;
    else if (mode === 'spoken' || mode === 'sense') { body = `<div class="sp">${t.frags.map((x, n) => `<div class="f" data-n="${n}"><span class="h">${esc(x.homer || (t.frags.length === 1 ? u.text : ''))}</span><span class="a">“${esc(x.words)}”</span><span class="s">${esc(src(x))}</span></div>`).join('')}</div>`;
      cov = `${t.frags.length === 1 ? 'one voice' : t.frags.length + ' voices'} · ${t.frags.reduce((a, x) => a + x.t1 - x.t0, 0).toFixed(1)} s · match ${Math.round((t.score || 0) * 100)}`; }
    else { body = `<div class="il">${t.frags.map((x, n) => x.fill ? `<div class="f gap fill" data-n="${n}"><span class="h">${esc(x.gap || x.elided)}</span><span class="a">our voice</span></div>`
        : x.gap ? `<div class="f gap" data-n="${n}"><span class="h">${esc(x.gap)}</span><span class="a">never said</span></div>`
        : x.elided ? `<div class="f el" data-n="${n}"><span class="h">${esc(x.elided)}</span><span class="a">·</span></div>`
        : `<div class="f" data-n="${n}"><span class="h">${esc(x.homer)}</span><span class="a">${esc(x.words).split(' ').map(w => (x.kin || []).some(p => p[1] === w.toLowerCase().replace(/[^a-z0-9']/g, '')) ? `<k>${w}</k>` : w).join(' ')}</span></div>`).join('')}</div>`;
      cov = `fidelity ${Math.round(t.fidelity * 100)}% · ${t.cuts} fragment${t.cuts === 1 ? '' : 's'} · ${t.voices} voice${t.voices === 1 ? '' : 's'}${t.gaps ? ' · ' + t.gaps + ' never said' : ''}${t.frags.some(x => x.fill) ? ' · our voice fills ' + t.frags.filter(x => x.fill).length : ''}${t.elided ? ' · ' + t.elided + ' left out' : ''}`; }
    $('#line').innerHTML = `<small>${esc(u.who)} · line ${li + 1} of ${lines().length}</small>${body}<div class="cov">${cov}</div>`; $('#line').scrollTop = 0;
    const all = lines().map(tr).filter(Boolean); $('#prog').textContent = !all.length ? '' : all[0].fidelity != null ? `scene fidelity ${Math.round(all.reduce((a, x) => a + x.fidelity, 0) / all.length * 100)}%` : `scene match ${Math.round(all.reduce((a, x) => a + (x.score || 0), 0) / all.length * 100)}`; }
  function mark(n) { $('#line').querySelectorAll('.f, .call, .ans').forEach(f => { const k = +f.dataset.n; f.classList.toggle('on', k === n); f.classList.toggle('done', k < n); }); const on = $('#line .on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  function upcoming(n) { const out = []; for (let l = li; l < lines().length && l <= li + 2 && out.length < n; l++) { const t = tr(lines()[l]); if (!t) continue;
      t.frags.forEach((x, k) => { if ((l > li || k >= fi) && x.id && out.length < n) out.push(x); }); } return out; }
  function load(el, x) { const c = F.clips[x.id]; if (!c) return; el._key = keyOf(x);
    if (el.dataset.id !== x.id) { el.src = c.video; el.dataset.id = x.id; el.load(); }
    const seek = () => { if (el._key !== keyOf(x)) return; try { if (Math.abs(el.currentTime - x.t0) > .1) el.currentTime = x.t0; } catch (e) { } };
    if (el.readyState >= 1) seek(); else el.addEventListener('loadedmetadata', seek, { once: true }); }
  // keep the next three voices loaded and parked, never touching the one speaking or the one on screen
  function anticipate() { const want = upcoming(3), busy = new Set([cur, shown].filter(Boolean)), need = [];
    want.forEach(x => { const e = POOL.find(e => e._key === keyOf(x) && !busy.has(e)); if (e) busy.add(e); else need.push(x); });
    need.forEach(x => { const e = POOL.find(e => !busy.has(e)); if (e) { busy.add(e); load(e, x); } }); }
  const ready = (el, x) => el.readyState >= 3 && !el.seeking && Math.abs(el.currentTime - x.t0) < .3;
  function vol(el, to, ms) { const a = el.volume, t0 = performance.now(); const step = () => { const k = ms <= 1 ? 1 : Math.min(1, (performance.now() - t0) / ms); try { el.volume = Math.max(0, Math.min(1, a + (to - a) * k)); } catch (e) { } if (k < 1) requestAnimationFrame(step); }; step(); }
  function take(el, ms) { if (el === shown) return; const old = shown; el.style.transition = `opacity ${ms}ms ease, filter .6s`; el.style.zIndex = ++z; el.style.opacity = 1; shown = el;
    if (old) setTimeout(() => { if (old !== shown && old !== cur) { old.style.transition = 'none'; old.style.opacity = 0; old.pause(); } }, ms + 60); }
  function rest(ms, then) { stage.classList.add('rest'); const my = guard; setTimeout(() => { if (my === guard && playing) { stage.classList.remove('rest'); then(); } }, ms); }
  const sceneVoice = () => { const s = R && R.find(x => x.id === sid); return s && s.voice; };
  function ourWords(x, done) { const my = guard, url = sceneVoice(); if (!url) { setTimeout(done, 300); return; }
    if (ours) { setTimeout(() => { if (my === guard) done(); }, (x.fill[1] - x.fill[0]) * 1000); return; }   // the full studio line is already sounding
    if (voice.dataset.u !== url) { voice.src = url; voice.dataset.u = url; }
    voice._unlock = false; voice.muted = false; try { voice.currentTime = x.fill[0]; } catch (e) { } voice.play().catch(() => { });
    const w = setInterval(() => { if (my !== guard) { clearInterval(w); return; } if (voice.currentTime >= x.fill[1] || voice.ended) { clearInterval(w); voice.pause(); done(); } }, 15);
    setTimeout(() => { if (my === guard && voice.paused) { clearInterval(w); done(); } }, 3000); }
  function playFrag() { if (!playing) return; const u = lines()[li], t = tr(u);
    if (!u) { stop(); return; }
    if (!t || fi >= t.frags.length) { li++; fi = 0; if (li >= lines().length) { stepScene(1); return; } drawLine(); anticipate(); rest(t ? REST() : 1600, startLine); return; }
    const x = t.frags[fi]; mark(fi); anticipate(); const next = () => { fi++; playFrag(); };
    if (!x.id) { const w = x.gap || x.elided;
      if (x.fill) { $('#who').textContent = 'our voice · “' + w + '”'; ourWords(x, next); }
      else { $('#who').textContent = x.gap ? 'the archive never says “' + w + '”' : '“' + w + '” left out'; setTimeout(next, x.gap ? 300 : 40); } return; }
    const my = ++guard; let el = POOL.find(e => e._key === keyOf(x) && e !== shown) || POOL.find(e => e._key === keyOf(x));
    if (!el) { const e = POOL.find(e => e !== shown && e !== cur); if (!e) { next(); return; } load(e, x); el = e; }
    const t0 = performance.now();
    const wait = () => { if (my !== guard) return; if (ready(el, x)) begin(); else if (performance.now() - t0 > 3000) next(); else { if (!el.seeking && Math.abs(el.currentTime - x.t0) > .3 && el.readyState >= 1) try { el.currentTime = x.t0; } catch (e) { } setTimeout(wait, 30); } };
    function begin() { cur = el; el._unlock = false; try { el.volume = 0; } catch (e) { } el.muted = false; el.play().catch(() => { }); vol(el, 1, deliv === 'CUT' ? 1 : 60);
