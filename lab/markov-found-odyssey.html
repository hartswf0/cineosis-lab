<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Found Odyssey</title>
<meta name="description" content="The Odyssey translated into the archive's own speech: every line rendered from words archival people actually said, four ways (literal, kinship, performance, sense), set interlinear, Homer above and the archive below.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg:#050505; --ink:#efe9dd; --dim:#8a8378; --faint:#2a2723; --hi:#e8c070; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px var(--mono); overflow:hidden; } button,select{ font:inherit; color:inherit; }
body{ display:grid; grid-template-rows:auto auto minmax(0,1fr) auto auto; height:100dvh; }
header{ display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 4px; } #markLink{ display:flex; align-items:center; gap:8px; color:var(--ink); text-decoration:none; letter-spacing:.2em; font-size:10.5px; white-space:nowrap; } #markLink span{ color:var(--dim); }
#scene{ flex:1; min-width:0; background:#121110; border:1px solid var(--faint); border-radius:16px; padding:6px 10px; }
#dial{ display:flex; gap:2px; margin:4px 12px 6px; background:#121110; border:1px solid var(--faint); border-radius:18px; padding:2px; }
#dial button{ flex:1; border:0; background:none; border-radius:16px; padding:7px 4px; cursor:pointer; color:var(--dim); font-size:10px; letter-spacing:.14em; } #dial button.on{ background:#e8c07022; color:var(--hi); }
#dial button small{ display:block; font-size:8.5px; letter-spacing:.04em; color:#6b655d; margin-top:2px; }
main{ position:relative; background:#000; min-height:0; } main video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; } main video.on{ opacity:1; }
#who{ position:absolute; left:10px; top:10px; font:10px var(--mono); color:#d6cfc2; background:#000a; border-radius:12px; padding:4px 9px; max-width:86%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#line{ padding:10px 4vw 4px; min-height:132px; max-height:34vh; overflow:auto; }
#line small{ display:block; font:500 10px var(--mono); letter-spacing:.2em; color:var(--hi); margin-bottom:8px; text-align:center; }
.il{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px 14px; }
.il .f{ display:grid; justify-items:center; gap:2px; padding:2px 4px; border-radius:4px; transition:background .12s; } .il .f.on{ background:#ffffff10; }
.il .h{ font:300 clamp(15px,2vw,22px)/1.2 var(--serif); color:#cfc8bb; } .il .a{ font:400 11px/1.3 var(--mono); color:#7d776f; } .il .f.on .a{ color:var(--ink); } .il .f.done .a{ color:#a59e93; }
.il .a k{ color:var(--hi); } .il .f.gap .h{ color:#4a4540; text-decoration:line-through; } .il .f.gap .a{ color:#4a4540; } .il .f.el .h{ color:#4a4540; font-style:italic; }
.il.sense .a{ font:300 clamp(15px,2vw,21px)/1.35 var(--serif); color:#cfc8bb; font-style:italic; }
#line .cov{ margin-top:8px; font-size:10.5px; color:var(--dim); text-align:center; }
footer{ display:flex; align-items:center; gap:6px; padding:4px 10px calc(10px + env(safe-area-inset-bottom)); }
.ico{ width:44px; height:44px; display:grid; place-items:center; background:none; border:0; border-radius:50%; cursor:pointer; color:#bdb5a9; } .ico:hover{ background:#ffffff12; } .ico svg{ width:20px; height:20px; }
.tg{ border:1px solid var(--faint); background:none; border-radius:16px; padding:7px 11px; cursor:pointer; color:var(--dim); font-size:10px; letter-spacing:.1em; } .tg.on{ color:var(--hi); border-color:#5a4e33; }
#prog{ flex:1; color:var(--dim); font-size:10.5px; text-align:right; }
</style></head><body>
<header><a id="markLink" href="markov-poet.html"></a><select id="scene" aria-label="Scene"></select></header>
<nav id="dial" aria-label="How to translate">
  <button data-m="literal">LITERAL<small>Homer's words, his order</small></button><button data-m="kinship">KINSHIP<small>kindred words where it lacks his</small></button>
  <button data-m="performance">PERFORMANCE<small>longer runs, fewer voices</small></button><button data-m="sense">SENSE<small>a sentence that says it</small></button></nav>
<main><video id="a" playsinline preload="auto"></video><video id="b" playsinline preload="auto"></video><div id="who"></div></main>
<div id="line"></div>
<footer><button class="ico" id="bPrev" aria-label="Previous line"><svg><use href="#i-prev"/></svg></button><button class="ico" id="bPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="ico" id="bNext" aria-label="Next line"><svg><use href="#i-next"/></svg></button>
  <button class="tg" id="ours">STUDIO VOICE</button><button class="tg on" id="smooth">JOINED</button><div id="prog"></div></footer>
<audio id="voice" preload="auto"></audio>
<script src="markov/ui.js?v=3"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  MPUI.sprite(); $('#markLink').innerHTML = MPUI.mark(22) + 'THE FOUND <span>ODYSSEY</span>';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  let F = null, R = null, sid = null, li = 0, fi = 0, playing = false, layer = 0, guard = 0, ours = false, smooth = true, mode = store.get('found.mode', 'kinship');
  const V = [$('#a'), $('#b')], voice = $('#voice'), XF = 90;   // the join: the next voice begins 90 ms early, sound and picture cross
  const lines = () => F.scenes[sid] || [];
  const tr = u => u && (u.modes[mode] || (mode === 'sense' ? null : u.modes.kinship));
  function drawLine() { const u = lines()[li]; if (!u) { $('#line').innerHTML = ''; return; } const t = tr(u);
    let body;
    if (!t) body = `<div class="il sense"><div class="f gap"><span class="a">the archive has no sentence that says this yet</span></div></div>`;
    else if (mode === 'sense') body = `<div class="il sense">${t.frags.map((x, n) => `<div class="f" data-n="${n}"><span class="a">“${esc(x.words)}”</span></div>`).join('')}</div>`;
    else body = `<div class="il">${t.frags.map((x, n) => x.gap ? `<div class="f gap" data-n="${n}"><span class="h">${esc(x.gap)}</span><span class="a">never said</span></div>`
        : x.elided ? `<div class="f el" data-n="${n}"><span class="h">${esc(x.elided)}</span><span class="a">·</span></div>`
        : `<div class="f" data-n="${n}"><span class="h">${esc(x.homer)}</span><span class="a">${esc(x.words).split(' ').map(w => (x.kin || []).some(p => p[1] === w.toLowerCase().replace(/[^a-z0-9']/g, '')) ? `<k>${w}</k>` : w).join(' ')}</span></div>`).join('')}</div>`;
    $('#line').innerHTML = `<small>${esc(u.who)} · line ${li + 1} of ${lines().length}</small>${body}<div class="cov">${t ? (mode === 'sense' ? 'said by the archive in its own words · match ' + Math.round((t.score || 0) * 100) : `fidelity ${Math.round(t.fidelity * 100)}% · ${t.cuts} fragment${t.cuts === 1 ? '' : 's'} · ${t.voices} voice${t.voices === 1 ? '' : 's'}${t.gaps ? ' · ' + t.gaps + ' never said' : ''}${t.elided ? ' · ' + t.elided + ' left out' : ''}`) : ''}</div>`;
    const all = lines().map(tr).filter(Boolean); $('#prog').textContent = all.length && mode !== 'sense' ? `scene fidelity ${Math.round(all.reduce((a, x) => a + x.fidelity, 0) / all.length * 100)}%` : ''; }
  function mark(n) { $('#line').querySelectorAll('.f').forEach(f => { const k = +f.dataset.n; f.classList.toggle('on', k === n); f.classList.toggle('done', k < n); }); }
  function prep(v, x) { const c = F.clips[x.id]; if (!c) return; if (v.dataset.id !== x.id) { v.src = c.video; v.dataset.id = x.id; } }
  function fade(v, to, ms, from) { const t0 = performance.now(), a = from == null ? v.volume : from; v.volume = a; const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); v.volume = Math.max(0, Math.min(1, a + (to - a) * k)); v.style.opacity = to > a ? k : 1 - k; if (k < 1) requestAnimationFrame(step); }; step(); }
  function nextIdx(after) { const t = tr(lines()[li]); if (!t) return -1; for (let n = after + 1; n < t.frags.length; n++) if (t.frags[n].id) return n; return -1; }
  function playFrag() { if (!playing) return; const u = lines()[li]; const t = tr(u);
    if (!u) { playing = false; return; }
    if (!t || fi >= t.frags.length) { li++; fi = 0; if (li >= lines().length) { stepScene(1); return; } drawLine(); setTimeout(() => startLine(), 450); return; }
    const x = t.frags[fi]; mark(fi);
    if (x.gap || x.elided) { $('#who').textContent = x.gap ? 'the archive never says “' + x.gap + '”' : '“' + x.elided + '” left out'; fi++; setTimeout(playFrag, x.gap ? 360 : 60); return; }
    const v = V[layer], o = V[1 - layer], c = F.clips[x.id], my = ++guard; prep(v, x);
    $('#who').textContent = (c.title || '') + (c.year ? ' · ' + c.year : '') + ' · “' + x.words + '”';
    const start = () => { if (my !== guard) return; try { v.currentTime = x.t0; } catch (e) { } v.muted = false; v.classList.add('on'); v.play().catch(() => { });
      if (smooth) { fade(v, 1, XF, 0); if (!o.paused) fade(o, 0, XF); setTimeout(() => { if (my === guard) { o.pause(); o.classList.remove('on'); } }, XF + 20); } else { v.volume = 1; v.style.opacity = 1; o.pause(); o.classList.remove('on'); o.style.opacity = 0; }
      const n2 = nextIdx(fi); if (n2 >= 0) { const nx = tr(u).frags[n2]; prep(o, nx); }
      const lead = smooth ? XF / 1000 : 0;
      const watch = setInterval(() => { if (my !== guard) { clearInterval(watch); return; } if (v.currentTime >= x.t1 - lead || v.ended) { clearInterval(watch); fi++; layer = 1 - layer; playFrag(); } }, 15); };
    if (v.readyState >= 2) start(); else { v.addEventListener('loadeddata', start, { once: true }); setTimeout(() => { if (my === guard && v.readyState < 2) { fi++; playFrag(); } }, 5000); } }
  function startLine() { const u = lines()[li]; if (ours && u && R) { const s = R.find(x => x.id === sid); if (s) { if (voice.dataset.u !== s.voice) { voice.src = s.voice; voice.dataset.u = s.voice; } voice.currentTime = u.t0; voice.play().catch(() => { }); clearTimeout(voice._t); voice._t = setTimeout(() => voice.pause(), (u.t1 - u.t0) * 1000 + 200); } } fi = 0; playFrag(); }
  function go(n) { guard++; V.forEach(v => { v.pause(); }); voice.pause(); li = Math.max(0, Math.min(lines().length - 1, n)); fi = 0; drawLine(); if (playing) startLine(); }
  function stepScene(d) { const o = $('#scene'), k = o.selectedIndex + d; if (k < 0 || k >= o.options.length) { playing = false; return; } o.selectedIndex = k; sid = o.value; li = 0; drawLine(); if (playing) setTimeout(startLine, 600); }
  function setMode(m) { mode = m; store.set('found.mode', m); document.querySelectorAll('#dial button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); go(li); }
  document.querySelectorAll('#dial button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  $('#bPlay').onclick = () => { playing = !playing; $('#bPlay').innerHTML = `<svg><use href="#i-${playing ? 'pause' : 'play'}"/></svg>`; if (playing) startLine(); else { guard++; V.forEach(v => v.pause()); voice.pause(); } };
  $('#bNext').onclick = () => go(li + 1); $('#bPrev').onclick = () => go(li - 1);
  $('#ours').onclick = () => { ours = !ours; $('#ours').classList.toggle('on', ours); };
  $('#smooth').onclick = () => { smooth = !smooth; $('#smooth').classList.toggle('on', smooth); $('#smooth').textContent = smooth ? 'JOINED' : 'HARD CUTS'; };
  $('#scene').onchange = () => { sid = $('#scene').value; go(0); };
  addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); $('#bPlay').click(); } else if (e.key === 'ArrowRight') go(li + 1); else if (e.key === 'ArrowLeft') go(li - 1); else if ('1234'.includes(e.key)) setMode(['literal', 'kinship', 'performance', 'sense'][+e.key - 1]); });
  Promise.all([fetch('odyssey/found.json').then(r => r.json()), fetch('odyssey/radio.json').then(r => r.json()).catch(() => null)]).then(([f, r]) => { F = f; R = r ? r.books.flatMap(b => b.scenes) : null;
    const titles = R ? Object.fromEntries(R.map(s => [s.id, s.title])) : {};
    Object.keys(F.scenes).sort().forEach(id => { const o = document.createElement('option'); o.value = id; const ls = F.scenes[id].map(u => u.modes.kinship).filter(Boolean), fid = ls.length ? Math.round(ls.reduce((a, x) => a + x.fidelity, 0) / ls.length * 100) : 0; o.textContent = `${id.slice(3)} · ${titles[id] || ''} · ${fid}%`; $('#scene').append(o); });
    const want = new URLSearchParams(location.search).get('scene'); sid = F.scenes[want] ? want : 'OD-B09-S09'; $('#scene').value = sid; setMode(mode); });
})();
</script></body></html>
