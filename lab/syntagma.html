<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grand Syntagmatique</title>
<meta name="description" content="WYGWYL's cuts divided into Metz's autonomous segments: watch every cut at the same moment, see which of the eight syntagmatic types each one uses for each beat, and count them.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="syntagma/syntagma.css?v=3">
</head>
<body>
<header class="top">
  <b class="ttl">Grand Syntagmatique</b>
  <button id="play" class="play" title="Play / pause (space)">▶</button>
  <span class="clock" id="clock">0:00</span>
  <nav class="poems" id="poems"></nav>
  <span class="grow"></span>
  <button id="exp" title="Download the selected cut's outline in Metz's form">outline ↓</button>
  <button id="helpBtn" title="Notation and keys">?</button>
</header>
<main>
  <section class="stage">
    <div class="main" id="main"><video id="mv" playsinline muted preload="auto"></video><div class="tag" id="tag"></div><div class="sub" id="sub"></div></div>
    <aside class="read"><div id="tree"></div><div class="why" id="why"></div></aside>
  </section>
  <section class="mons" id="mons"></section>
  <section class="tbl" id="tbl"></section>
  <section class="freq" id="freq"></section>
</main>
<div id="menu" class="menu" hidden></div>
<div id="pop" class="pop" hidden></div>
<script src="syntagma/metz.js?v=1"></script>
<script src="syntagma/syntagma.js?v=2"></script>
</body></html>
