<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monte Carlo Casino</title>
<meta name="description" content="Ten rounds from the Cineosis archive. A clip plays; tap one of three answers; the archive plays the truth.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{ --felt:#0e3a2c; --felt2:#0a2c21; --gold:#e2b23c; --cream:#f1e8da; --ink:#2b2020; --ok:#7fd49a; --no:#e0675e; --dim:#9fb5a9; --jost:'Jost',Futura,sans-serif; --serif:'Fraunces',Georgia,serif; color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; min-height:100%; background:var(--felt2); color:var(--cream); font:400 16px/1.4 var(--jost); }
body{ min-height:100vh; background:radial-gradient(ellipse at 50% 30%, var(--felt), var(--felt2) 75%) fixed; }
button{ font:inherit; color:inherit; cursor:pointer; }
[hidden]{ display:none !important; }
header{ display:flex; align-items:center; gap:14px; padding:12px 16px; font:500 12px var(--jost); letter-spacing:.24em; text-transform:uppercase; color:var(--dim); }
header a{ color:var(--dim); text-decoration:none; } header #hud{ flex:1; text-align:right; color:var(--gold); }
header #end{ background:none; border:1px solid #9fb5a955; border-radius:14px; padding:4px 12px; font-size:11px; letter-spacing:.2em; color:var(--dim); }
main{ width:min(980px,100%); margin:0 auto; padding:0 16px 32px; }
.big{ text-align:center; padding-top:8vh; } .big h1{ margin:0; font:300 clamp(40px,8vw,84px)/1 var(--serif); letter-spacing:.04em; }
.big p{ margin:18px auto 0; max-width:30em; color:var(--dim); font-size:17px; }
.go{ margin-top:28px; background:var(--gold); color:var(--ink); border:0; border-radius:40px; padding:16px 54px; font:600 18px var(--jost); letter-spacing:.24em; box-shadow:0 10px 30px #0008; }
.keys{ margin-top:18px; font-size:12px; color:#9fb5a9aa; letter-spacing:.08em; }
h2{ margin:4px 0 12px; text-align:center; font:500 clamp(15px,2.4vw,22px)/1.25 var(--jost); letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
#stage{ position:relative; width:100%; aspect-ratio:16/9; max-height:46vh; margin:0 auto; background:#000; border-radius:8px; overflow:hidden; box-shadow:0 0 0 2px #e2b23c44, 0 20px 50px #0009; }
#stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
#black{ position:absolute; inset:0; background:#000; opacity:0; transition:opacity .25s; pointer-events:none; } #black.on{ opacity:1; }
#cap{ position:absolute; left:0; right:0; bottom:0; padding:28px 6% 14px; text-align:center; font:italic 300 clamp(16px,2.6vw,28px)/1.3 var(--serif); background:linear-gradient(transparent,#000c); pointer-events:none; }
#cap:empty{ display:none; }
#again{ position:absolute; top:10px; right:10px; background:#000a; border:1px solid #fff3; border-radius:16px; padding:5px 12px; font-size:12px; letter-spacing:.12em; }
#fault{ position:absolute; inset:0; display:grid; place-content:center; gap:12px; text-align:center; background:#000d; color:var(--cream); }
#fault button{ background:var(--gold); color:var(--ink); border:0; border-radius:20px; padding:8px 22px; font-weight:600; letter-spacing:.16em; }
#choices{ display:grid; gap:10px; margin-top:14px; grid-template-columns:repeat(3,1fr); }
#choices.two{ grid-template-columns:1fr 1fr; } #choices.words{ grid-template-columns:1fr; }
.c{ position:relative; background:var(--cream); color:var(--ink); border:0; border-radius:10px; padding:8px; text-align:center; box-shadow:0 8px 20px #0007; transition:transform .15s, opacity .3s; }
.c:active{ transform:scale(.97); }
.c .k{ display:block; font:600 12px var(--jost); letter-spacing:.3em; color:#8a3a33; }
.c img, .c video{ display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#000; border-radius:6px; margin-top:6px; }
.c .t{ display:block; margin-top:4px; font:300 clamp(17px,2.4vw,24px)/1.3 var(--serif); }
#choices.words .c{ text-align:left; padding:12px 16px; } #choices.words .k{ display:inline; margin-right:10px; } #choices.words .t{ display:inline; }
#choices.two .t, #choices.decade .t{ font:600 clamp(22px,4vw,34px)/1.2 var(--jost); letter-spacing:.12em; padding:10px 0; }
.c.ok{ box-shadow:0 0 0 4px var(--ok), 0 8px 20px #0007; } .c.no{ box-shadow:0 0 0 4px var(--no), 0 8px 20px #0007; } .c.off{ opacity:.35; }
.c .m{ position:absolute; top:6px; right:10px; font:600 22px var(--jost); } .c.ok .m{ color:#2c7a45; } .c.no .m{ color:#a8322a; }
#out{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:16px; padding:14px 16px; background:#0006; border-radius:10px; }
#res{ font:600 20px var(--jost); letter-spacing:.06em; } #res.ok{ color:var(--ok); } #res.no{ color:var(--no); }
#fact{ flex:1 1 14em; color:var(--dim); font-size:15px; }
#src{ background:none; border:1px solid #9fb5a955; border-radius:16px; padding:6px 12px; font-size:12px; color:var(--dim); }
#next{ background:var(--gold); color:var(--ink); border:0; border-radius:24px; padding:12px 30px; font:600 15px var(--jost); letter-spacing:.2em; }
#marks{ margin-top:20px; font:600 26px var(--jost); letter-spacing:.3em; } #marks .y{ color:var(--ok); } #marks .n{ color:var(--no); }
@media (max-width:600px){ #stage{ max-height:none; } .c{ padding:5px; } #next{ flex:1 0 100%; } }
</style></head>
<body>
<header><a href="index.html">← Lab</a><a href="party.html?play=quiz" style="margin-left:14px;color:var(--gold)">play with friends ▸</a><span id="hud"></span><button id="end" hidden>End</button></header>
<main>
  <section id="rest" class="big">
    <h1>Casino</h1>
    <p>Ten rounds. A clip plays. Tap one of three answers. The archive plays the right one. One point per right answer.</p>
    <button class="go" id="deal" disabled>Loading…</button>
    <div class="keys">On a keyboard: 1 2 3 to answer · Enter for the next round · R to replay</div>
  </section>
  <section id="round" hidden>
    <h2 id="q"></h2>
    <div id="stage"><video id="pic" playsinline preload="auto"></video><div id="black"></div><div id="cap"></div>
      <button id="again" aria-label="Play the clip again">↻ Replay</button>
      <div id="fault" hidden><div>This clip did not load.</div><div><button id="skip">Skip this round</button></div></div></div>
    <audio id="voice" preload="auto"></audio>
    <div id="choices"></div>
    <div id="out" hidden aria-live="polite"><span id="res"></span><span id="fact"></span><button id="src">Source film ↗</button><button id="next">Next</button></div>
  </section>
  <section id="done" class="big" hidden>
    <h1 id="total"></h1>
    <div id="marks"></div>
    <button class="go" id="redeal">Deal again</button>
  </section>
</main>
<script src="attrib/attrib.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pic = $('#pic'), voice = $('#voice'), ROUNDS = 10, LETTERS = ['A', 'B', 'C'];
  const Q = await fetch('casino/quiz.json').then(r => r.json()), R2 = Q.r2;
  const rnd = Math.random, pick = xs => xs[Math.floor(rnd() * xs.length)], shuffle = xs => { xs = xs.slice(); for (let k = xs.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [xs[k], xs[j]] = [xs[j], xs[k]]; } return xs; };
  const thumb = v => R2 + v.replace('/clips/', '/thumbnails/').replace('.mp4', '.jpg');
  const from = x => x.film ? x.film + (x.year ? ' (' + x.year + ')' : '') : '';
  const others = (pool, a, n) => shuffle(pool.filter(x => x.film !== a.film && x.v !== a.v)).slice(0, n);
  const DECADES = [...new Set(Q.year.map(x => Math.floor(x.year / 10) * 10))].sort();

  // ---- the six rounds: each is a question, a clip to ask with, three answers (one right), and the clip that shows the answer
  const KINDS = {
    said() { const a = pick(Q.said), line = { v: a.v, t0: a.t0, t1: a.t1, cap: '“' + a.text + '”' };
      return { q: 'Tap the picture that spoke this line', ask: [{ ...line, black: true }], show: [line], fact: from(a), src: [a.v],
        opts: shuffle([{ pic: a.v, ok: true }, ...others(Q.said, a, 2).map(x => ({ pic: x.v }))]) }; },
    heard() { const a = pick(Q.heard);
      return { q: 'Tap the words they said', ask: [{ v: a.v, t0: a.t0, t1: a.t1 }], show: [{ v: a.v, t0: a.t0, t1: a.t1, cap: '“' + a.text + '”' }], fact: from(a), src: [a.v], cls: 'words',
        opts: shuffle([{ text: a.text, ok: true }, ...a.fakes.map(t => ({ text: t }))]) }; },
    year() { const a = pick(Q.year), d = Math.floor(a.year / 10) * 10, clip = { v: a.v, t0: a.at, t1: a.at + 6 };
      return { q: 'Tap the decade this was filmed', ask: [clip], show: [{ ...clip, cap: a.year }], fact: from(a), src: [a.v], cls: 'decade',
        opts: [d, ...shuffle(DECADES.filter(x => Math.abs(x - d) >= 20)).slice(0, 2)].sort().map(x => ({ text: x + 's', ok: x === d })) }; },
    next() { const a = pick(Q.next);
      return { q: 'Tap the shot that came next in this film', ask: [{ v: a.v, t1: 5 }], show: [{ v: a.v, t1: 2.5 }, { v: a.nv, t1: 5, cap: 'next' }], fact: from(a), src: [a.v],
        opts: shuffle([{ pic: a.nv, ok: true }, ...others(Q.next, a, 2).map(x => ({ pic: x.nv }))]) }; },
    bin() { const keep = rnd() < .5, a = pick(Q.bin.filter(x => keep ? x.score >= 8 : x.score <= 4));
      return { q: 'The judge scored this shot. Kept or binned?', ask: [{ v: a.v, t1: 5 }], show: [{ v: a.v, t1: 5, cap: a.score + '/10: ' + a.why }], fact: 'The judge: ' + a.score + '/10, “' + a.why + '” · ' + from(a), src: [a.v], cls: 'two',
        opts: [{ text: 'Kept', ok: keep }, { text: 'Binned', ok: !keep }] }; },
    dub() { const a = pick(Q.dub), L = a.line;
      return { q: 'Tap the picture the comedy judge put under this voice', ask: [{ v: L.v, t0: L.t0, t1: L.t1, black: true, cap: '“' + L.text + '”' }], show: [{ v: a.v, t1: L.t1 - L.t0 + 1.4, mute: true, voice: L, cap: '“' + L.text + '”' }],
        fact: 'Funny: ' + a.funny + '/10 · voice from ' + (L.film || '?') + ' · picture from ' + a.film, src: [L.v, a.v],
        opts: shuffle([{ pic: a.v, ok: true }, ...others(Q.dub, a, 2).map(x => ({ pic: x.v }))]) }; }
  };
  const deck = () => { const k = Object.keys(KINDS), out = shuffle(k); while (out.length < ROUNDS) { const n = pick(k); if (n !== out[out.length - 1]) out.push(n); } return out; };

  // ---- the player: clips in order; each runs from t0 to t1 (or to its end, at most 7 s); a voice can play over a muted picture
  let tok = 0, stopT = 0;
  function seek(el, src, t0) { if (el.dataset.src !== src) { el.dataset.src = src; el.src = src; el.addEventListener('loadedmetadata', () => { try { el.currentTime = t0; } catch (e) { } }, { once: true }); } else { try { el.currentTime = t0; } catch (e) { } } el.play().catch(() => { }); }
  function play(steps, onFault) { const my = ++tok; let n = 0; clearTimeout(stopT); voice.pause(); $('#fault').hidden = true;
    pic.onerror = () => { if (my === tok && onFault) onFault(); };
    const go = () => { if (my !== tok) return; const s = steps[n++]; if (!s) { pic.pause(); return; }
      $('#black').classList.toggle('on', !!s.black); $('#cap').textContent = s.cap || ''; pic.muted = !!s.mute;
      const t0 = s.t0 || 0, len = Math.min(7, (s.t1 != null ? s.t1 - t0 : 7)) + .25;
      seek(pic, R2 + s.v, t0);
      if (s.voice) { voice.muted = false; setTimeout(() => { if (my === tok) seek(voice, R2 + s.voice.v, s.voice.t0); }, 300); }
      pic.onended = () => { if (my === tok) { clearTimeout(stopT); go(); } };
      stopT = setTimeout(() => { if (my === tok) { if (s.voice) voice.pause(); go(); } }, (s.voice ? Math.max(len, s.voice.t1 - s.voice.t0 + .6) : len) * 1000 + 400); };
    go(); }

  // ---- the game
  let order, i, score, marks, cur, answered;
  const hud = () => { $('#hud').textContent = `Round ${i + 1} / ${ROUNDS} · Score ${score}`; };
  function show(id) { ['#rest', '#round', '#done'].forEach(s => $(s).hidden = s !== id); $('#end').hidden = id !== '#round'; if (id !== '#round') $('#hud').textContent = ''; }
  function deal() { order = deck(); i = 0; score = 0; marks = []; show('#round'); round(); }
  function round() { cur = KINDS[order[i]](); answered = false; hud();
    $('#q').textContent = cur.q; $('#out').hidden = true;
    const C = $('#choices'); C.className = cur.cls || '';
    C.innerHTML = cur.opts.map((o, n) => `<button class="c" data-n="${n}"><span class="k">${LETTERS[n]}</span>${o.pic ? `<img alt="answer ${LETTERS[n]}" src="${esc(thumb(o.pic))}" data-v="${esc(R2 + o.pic)}">` : ''}${o.text ? `<span class="t">${esc(o.text)}</span>` : ''}<span class="m"></span></button>`).join('');
    C.querySelectorAll('img').forEach(im => im.onerror = () => { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = im.dataset.v + '#t=1'; im.replaceWith(v); });
    play(cur.ask, fault); }
  function fault() { if (answered) return; $('#fault').hidden = false; }
  function choose(n) { if (answered || !cur.opts[n]) return; answered = true;
    const ok = !!cur.opts[n].ok, right = cur.opts.findIndex(o => o.ok); score += ok; marks.push(ok); hud();
    $('#choices').querySelectorAll('.c').forEach((b, k) => { b.classList.add(k === right ? 'ok' : k === n ? 'no' : 'off'); b.querySelector('.m').textContent = k === right ? '✓' : k === n ? '✗' : ''; });
    $('#res').className = ok ? 'ok' : 'no'; $('#res').textContent = ok ? 'Right · +1' : 'Wrong · the answer is ' + LETTERS[right];
    $('#fact').textContent = cur.fact; $('#next').textContent = i + 1 < ROUNDS ? 'Next' : 'Finish'; $('#out').hidden = false;
    play(cur.show); }
  function next() { if (!answered) return; i++; if (i < ROUNDS) round(); else finish(); }
  function finish() { tok++; pic.pause(); voice.pause(); show('#done');
    $('#total').textContent = `${score} of ${marks.length}`; $('#marks').innerHTML = marks.map(m => m ? '<span class="y">✓</span>' : '<span class="n">✗</span>').join(' '); }

  $('#deal').disabled = false; $('#deal').textContent = 'Deal';
  $('#deal').onclick = $('#redeal').onclick = () => { voice.muted = true; voice.src = R2 + Q.said[0].v; voice.play().then(() => { voice.pause(); voice.muted = false; }).catch(() => { voice.muted = false; }); voice.dataset.src = ''; deal(); };
  $('#choices').onclick = e => { const b = e.target.closest('.c'); if (b) choose(+b.dataset.n); };
  $('#next').onclick = next;
  $('#again').onclick = () => play(answered ? cur.show : cur.ask, fault);
  $('#skip').onclick = () => round();
  $('#end').onclick = finish;
  $('#src').onclick = () => Attrib.show(cur.src.map((v, k) => ({ role: cur.src.length > 1 ? (k ? 'the picture' : 'the voice') : 'the clip', video: R2 + v })));
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return;
    if (!$('#round').hidden) { const n = '123abc'.indexOf(e.key.toLowerCase()); if (n >= 0) choose(n % 3); else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); } else if (e.key.toLowerCase() === 'r') $('#again').click(); }
    else if (e.key === 'Enter') { e.preventDefault(); ($('#rest').hidden ? $('#redeal') : $('#deal')).click(); } });
})();
</script>
</body></html>
