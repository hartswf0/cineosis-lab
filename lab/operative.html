<!-- HOW THE IMAGE BECOMES OPERATIVE — Part II of the lab's film about itself. Part I (how-it-sees.html) showed how the models learned.
     This part follows the image into operations: how a colour becomes a number, how 45 questions are asked of a shot, what a segment
     is, how the Odyssey, the Norse house, the Republic and WYGWYL decide what to show and say, what no model sees, how few words they
     have, what the archive is made of, what is brittle, what it all costs, and what has not been tried. Every number is the lab's own
     (explain/build2.py, build3.py → explain/film2.json; costs measured on this machine → explain/costs.json). -->
<style>
.wheel { position: absolute; }
.wheel line, .wheel path { transition: all 1.4s cubic-bezier(.2,.7,.2,1); }
.readout { position: absolute; font: 600 96px var(--serif); color: var(--gold); }
.readout small { display: block; font: 16px var(--mono); color: var(--dim); letter-spacing: .12em; }
.swatches { position: absolute; display: flex; gap: 14px; }
.swatches div { width: 120px; opacity: 0; animation: up .8s ease forwards; } .swatches i { display: block; height: 90px; border-radius: 4px; } .swatches span { font: 15px var(--mono); color: var(--dim); display: block; margin-top: 6px; }
.strip { position: absolute; left: 60px; right: 60px; display: flex; gap: 2px; } .strip i { flex: 1; aspect-ratio: 3/4; background-size: cover; background-position: center; opacity: 0; animation: fade .4s ease forwards; }
.ladder { position: absolute; left: 140px; right: 140px; top: 170px; display: flex; flex-direction: column; gap: 22px; }
.ladder div { display: grid; grid-template-columns: 260px 1fr 150px; align-items: center; gap: 20px; opacity: 0; animation: up .9s ease forwards; font: 26px var(--serif); }
.ladder i { height: 34px; background: #1a1916; border-radius: 4px; position: relative; } .ladder i b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; width: 0; transition: width 2s cubic-bezier(.2,.7,.2,1); }
.ladder em { font: 600 30px var(--mono); font-style: normal; text-align: right; }
.phr { position: absolute; left: 140px; right: 140px; top: 150px; display: flex; flex-direction: column; gap: 14px; }
.phr p { margin: 0; font: 30px/1.25 var(--serif); color: var(--word); opacity: 0; animation: up .8s ease forwards; } .phr p.hit { color: var(--gold); }
.chain { position: absolute; left: 50px; right: 50px; top: 120px; display: flex; gap: 12px; align-items: stretch; }
.chain > div { flex: 1; border: 1px solid #2a2722; background: #0c0b09; padding: 12px; opacity: 0; animation: up .9s ease forwards; position: relative; min-width: 0; }
.chain > div::after { content: '→'; position: absolute; right: -14px; top: 40%; color: var(--gold); font-size: 22px; }
.chain > div:last-child::after { content: ''; }
.chain small { display: block; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--gold); margin-bottom: 8px; } .chain p { margin: 0; font: 19px/1.3 var(--serif); } .chain img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; margin-top: 6px; }
.formula { position: absolute; left: 120px; right: 120px; top: 150px; display: flex; flex-direction: column; gap: 16px; }
.formula div { display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: baseline; opacity: 0; animation: up .8s ease forwards; } .formula b { font: 600 34px var(--mono); color: var(--gold); text-align: right; } .formula span { font: 27px/1.3 var(--serif); }
.quad { position: absolute; inset: 40px 60px 150px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
.quad figure { margin: 0; position: relative; background: #050505; overflow: hidden; border: 1px solid #222; } .quad video, .quad img { width: 100%; height: 100%; object-fit: cover; display: block; }
.quad figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,.9)); font: 15px/1.3 var(--mono); } .quad figcaption b { color: var(--gold); letter-spacing: .12em; text-transform: uppercase; } .quad figcaption em { display: block; color: var(--dim); font-style: normal; font-size: 13px; }
.poem { position: absolute; left: 80px; right: 80px; bottom: 40px; font: italic 28px/1.3 var(--serif); color: #e6dfd2; text-align: center; }
.cloud { position: absolute; inset: 120px 120px 170px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 10px 26px; }
.cloud span { font-family: var(--serif); opacity: 0; animation: up .8s ease forwards; color: #e6dfd2; }
.count4 { position: absolute; left: 120px; right: 120px; top: 230px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; text-align: center; }
.count4 div { opacity: 0; animation: up .9s ease forwards; } .count4 b { display: block; font: 600 140px/1 var(--serif); color: var(--gold); } .count4 span { font: 22px var(--mono); color: var(--dim); }
.hbars { position: absolute; display: flex; flex-direction: column; gap: 12px; }
.hbars div { display: grid; grid-template-columns: 300px 1fr 160px; gap: 16px; align-items: center; font: 22px var(--serif); opacity: 0; animation: up .7s ease forwards; }
.hbars i { height: 22px; background: #15130f; border-radius: 3px; position: relative; } .hbars i b { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--pic); transition: width 1.8s cubic-bezier(.2,.7,.2,1); }
.hbars em { font: 18px var(--mono); color: var(--ink); font-style: normal; text-align: right; }
.links { position: absolute; left: 120px; right: 120px; top: 150px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.links i { height: 80px; border: 2px solid #3a352d; border-radius: 40px; opacity: 0; animation: fade .5s ease forwards; } .links i.crack { border-color: #ff5a4e; transform: rotate(12deg); transition: transform .6s; }
.fails { position: absolute; inset: 120px 90px 170px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.fails div { border: 1px solid #3a2a26; background: #0d0908; padding: 18px 22px; opacity: 0; animation: up .8s ease forwards; } .fails small { display: block; font: 600 13px var(--mono); letter-spacing: .14em; color: #ff8a7e; margin-bottom: 8px; } .fails p { margin: 0; font: 26px/1.3 var(--serif); } .fails em { display: block; margin-top: 8px; font: 15px var(--mono); color: var(--dim); font-style: normal; }
.todo { position: absolute; inset: 100px 90px 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; align-content: start; }
.todo div { opacity: 0; animation: up .7s ease forwards; border-left: 3px solid var(--c, var(--ours)); padding: 4px 14px; } .todo b { display: block; font: 600 22px var(--serif); } .todo span { font: 17px/1.35 var(--serif); color: #d8d0c2; } .todo em { font: 12px var(--mono); color: var(--ours); font-style: normal; letter-spacing: .08em; }
.subline { position: absolute; left: 140px; right: 140px; bottom: 70px; text-align: center; font: 36px/1.3 var(--serif); text-shadow: 0 2px 10px #000; }
.subline span { background: rgba(0,0,0,.55); padding: 2px 12px; } .subline small { display: block; font: 15px var(--mono); color: var(--dim); margin-bottom: 6px; letter-spacing: .1em; }
.score { position: absolute; right: 50px; top: 40px; background: rgba(0,0,0,.82); border: 1px solid #333; padding: 12px 16px; font: 16px var(--mono); color: var(--dim); text-align: right; } .score b { display: block; font: 600 44px var(--serif); color: var(--gold); }

.idc { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; gap: 18px; }
.idc h1 { margin: 0; line-height: 1; } .idc p { margin: 0; max-width: 1100px; font: 30px/1.35 var(--serif); color: #eee6d6; } .idc small { font: 16px var(--mono); letter-spacing: .14em; opacity: .8; }
.id-ody { background: radial-gradient(ellipse at 70% 120%, #1d2d6b, #050816 70%); } .id-ody h1 { font: 600 120px 'Fraunces', serif; color: #8ea6ff; letter-spacing: .04em; }
.id-ody::before, .id-ody::after { content: ''; position: absolute; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(90deg, #6f8cff 0 22px, transparent 22px 44px), repeating-linear-gradient(0deg, transparent 0 6px, #050816 6px 16px); opacity: .55; }
.id-ody::before { top: 40px; } .id-ody::after { bottom: 40px; }
.id-nor { background: linear-gradient(160deg, #06161a, #0c2a30); } .id-nor h1 { font: 600 112px var(--mono); letter-spacing: .3em; color: #6cc4d6; text-transform: uppercase; }
.id-nor::after { content: ''; position: absolute; right: 160px; top: 140px; width: 300px; height: 300px; border-radius: 50%; background: linear-gradient(90deg, #6cc4d6 50%, transparent 50%); opacity: .35; animation: spin 40s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.id-rep { background: repeating-linear-gradient(135deg, #2a0d05 0 40px, #1c0803 40px 80px); } .id-rep h1 { font: 900 128px Impact, 'Arial Narrow', sans-serif; color: #e0572a; letter-spacing: .02em; text-transform: uppercase; text-shadow: 6px 6px 0 #000; }
.id-wyg { background: radial-gradient(ellipse at 30% 40%, #1d2a0a, #050603 70%); } .id-wyg h1 { font: italic 400 96px 'Fraunces', serif; color: #c4f46a; }
.id-wyg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 120px; height: 3px; background: repeating-linear-gradient(90deg, #c4f46a 0 60px, transparent 60px 110px); animation: road 3s linear infinite; } @keyframes road { to { background-position: 110px 0; } }
.verdict2 { display: inline-block; font: 600 14px var(--mono); letter-spacing: .12em; padding: 2px 8px; border-radius: 3px; color: #000; }
.v-holds { background: var(--ours); } .v-partial { background: var(--gold); } .v-revise { background: #ff8a7e; }
.strike { text-decoration: line-through; text-decoration-color: #ff8a7e; text-decoration-thickness: 3px; color: #8f877a; }
.planes { position: absolute; left: 200px; top: 70px; width: 1200px; height: 680px; overflow: hidden; border: 1px solid #333; }
.planes img { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; }
@keyframes par1 { to { transform: translateX(-2%); } } @keyframes par2 { to { transform: translateX(-5%) scale(1.02); } } @keyframes par3 { to { transform: translateX(-9%) scale(1.05); } }
</style>

<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="bPrev" title="previous (←)">‹</button><button id="bPlay" title="play / pause (space)">❚❚</button><button id="bNext" title="next (→)">›</button><div id="chs"></div><span id="time"></span><button id="bSnd" title="sound">♪ on</button></div>
<div id="start"><div><h1>How the Image Becomes Operative</h1><p>Part II. What the lab does to a moving image: how a colour becomes a number, how a shot is asked its questions, how our films decide what to show and say, what no machine sees, what is brittle, and what it all costs. About eleven minutes, with sound.</p><b>▶ Watch</b></div></div>
<audio id="score" preload="auto"></audio><audio id="voice" preload="auto"></audio>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const DOMC = { perception: '#e9d9a8', affect: '#f0b9a4', action: '#e7a37c', reflection: '#b9cfa0', mental: '#a9c9c9', break: '#d9d3c7', time: '#b8b3d8', read: '#d9b8d2' };
const fmt = n => Number(n).toLocaleString('en-US');
let F, P1, MV, WA, VJ, S, beats = [], cur = -1, timer = 0, paused = false, sound = true, tok = 0, t0 = 0, left = 0;
const stage = $('#stage'), score = $('#score'), voice = $('#voice');
const say = (lines, cls = '') => `<div class="say ${cls}">${lines.map((l, i) => `<span style="animation-delay:${.25 + i * 1.1}s">${l}</span>`).join('')}</div>`;
const chip = (n, size = '') => { const s = S[n]; return s ? `<span class="chip" style="background:${DOMC[s.dom]};${size}">${esc(s.symbol)}</span>` : ''; };
const vid = (src, t, cls = 'full', muted = true, style = '') => `<video class="${cls}" style="${style}" data-src="${esc(src)}" data-t="${t || 0}" ${muted ? 'muted' : 'data-snd="1"'} playsinline loop></video>`;
function startVideos(el) { el.querySelectorAll('video[data-src]').forEach(v => { v.src = v.dataset.src; if (v.dataset.end) v.addEventListener('timeupdate', () => { if (v.currentTime > +v.dataset.end) v.currentTime = +v.dataset.t; }); v.addEventListener('loadedmetadata', () => { try { v.currentTime = +v.dataset.t || 0; } catch (e) { } if (v.dataset.snd && sound) { v.muted = false; v.volume = 1; } v.play().catch(() => { v.muted = true; v.play().catch(() => { }); }); }, { once: true }); }); }
const later = (ms, f) => { const my = tok; setTimeout(() => { if (my === tok) f(); }, ms); };
const raf = f => { const my = tok, t = performance.now(); const go = () => { if (my !== tok) return; if (f((performance.now() - t) / 1000) !== false) requestAnimationFrame(go); }; go(); };
const typeIn = (el, text, cps = 30) => { const my = tok; let i = 0; el.classList.add('typed'); const step = () => { if (my !== tok) return; el.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, 1000 / cps); else el.classList.remove('typed'); }; step(); };
const duck = on => { score.volume = sound ? (on ? .06 : .3) : 0; };
const grow = el => later(400, () => el.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%'));
const hms = s => s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;

function build() {
  const B = (ch, secs, html, after, opt = {}) => beats.push({ ch, secs, html, after, ...opt });
  const Hc = F.hue[0], Hs = F.hue[1], seed = P1.seed, rd = seed.reading, T = F.total;
  /* 1 · A COLOUR IS A NUMBER */
  B('A colour is a number', 7, () => `${vid(F.colour_card.video, F.colour_card.t, 'full ken')}${say(['Colour, as the lab counts it.'], 'small')}<div class="credit">${esc(Hc.title)} ${esc(Hc.year || '')}</div>`, el => startVideos(el));
  const pixCanvas = (mode) => `<canvas id="px" width="1600" height="900" style="position:absolute;inset:0"></canvas>`;
  const drawPix = (el, phase) => { const g = $('#px', el).getContext('2d'), px = Hc.px, lab = Hc.lab, N = lab.length, cell = 10, gx = 120, gy = 190;
    const cnt = [0, 0, 0, 0, 0], slot = lab.map(k => cnt[k]++), per = 28;
    raf(t => { const k = phase === 0 ? 1 : Math.min(1, Math.max(0, (t - .8) / 3.2)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; g.fillStyle = '#000'; g.fillRect(0, 0, 1600, 900);
      for (let i = 0; i < N; i++) { const x0 = gx + (i % 64) * cell, y0 = gy + Math.floor(i / 64) * cell, c = lab[i], s = slot[i], x1 = 840 + c * 148 + (s % per) * 5, y1 = 190 + Math.floor(s / per) * 5;
        const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e, sz = cell - 1 - (cell - 5.5) * e; g.fillStyle = `rgb(${px[i * 3]},${px[i * 3 + 1]},${px[i * 3 + 2]})`; g.fillRect(x, y, sz, sz); }
      if (phase && k >= 1) { Hc.cols.forEach((c, j) => { g.fillStyle = c; g.fillRect(840 + j * 148, 720, 130, 60); g.fillStyle = '#cfc8ba'; g.font = '16px IBM Plex Mono'; g.fillText(`${Math.round(Hc.share[j] * 100)}%`, 840 + j * 148, 805); }); return false; }
      return phase ? true : false; }); };
  B('A colour is a number', 8, () => `${pixCanvas()}<div class="label" style="position:absolute;left:120px;top:150px">the frame at 64 × 48: 3,072 pixels</div>${say(['First the frame is shrunk:', '64 by 48 squares. 3,072 pixels.'], 'small')}`, el => drawPix(el, 0));
  B('A colour is a number', 11, () => `${pixCanvas()}<div class="label" style="position:absolute;left:840px;top:150px">k-means: five colours</div>${say(['A sorting rule, k-means,', 'gathers them into five colours.'], 'corner')}`, el => drawPix(el, 1));
  const wheel = (h, chain, show) => { const cx = 520, cy = 470, R = 300, sc = R / Math.max(.05, h.chroma) * .9; let ring = ''; for (let a = 0; a < 360; a += 6) ring += `<path d="M${cx + Math.cos(a * Math.PI / 180) * (R + 10)},${cy + Math.sin(a * Math.PI / 180) * (R + 10)} A${R + 10},${R + 10} 0 0 1 ${cx + Math.cos((a + 6) * Math.PI / 180) * (R + 10)},${cy + Math.sin((a + 6) * Math.PI / 180) * (R + 10)}" stroke="hsl(${a},70%,55%)" stroke-width="14" fill="none"/>`;
    let x = cx, y = cy, arrows = '';
    h.ang.forEach((a, j) => { const L = h.weight[j] * sc, dx = Math.cos(a * Math.PI / 180) * L, dy = Math.sin(a * Math.PI / 180) * L, sx = chain ? x : cx, sy = chain ? y : cy;
      arrows += `<line class="ar" x1="${sx}" y1="${sy}" x2="${sx + dx}" y2="${sy + dy}" stroke="${h.cols[j]}" stroke-width="9" stroke-linecap="round"/>`; x += dx; y += dy; });
    const res = show ? `<line x1="${cx}" y1="${cy}" x2="${cx + h.vec[0] * sc}" y2="${cy + h.vec[1] * sc}" stroke="#f2c14e" stroke-width="5" stroke-dasharray="10 6"/><circle cx="${cx + h.vec[0] * sc}" cy="${cy + h.vec[1] * sc}" r="12" fill="#f2c14e"/>` : '';
    const thr = `<circle cx="${cx}" cy="${cy}" r="${.03 * sc}" fill="none" stroke="#ff8a7e" stroke-dasharray="4 6" stroke-width="2"/>`;
    return `<svg class="wheel" width="1600" height="900" style="left:0;top:0">${ring}${chain === 'thr' ? thr : ''}${arrows}${res}<circle cx="${cx}" cy="${cy}" r="5" fill="#fff"/></svg>`; };
  B('A colour is a number', 13, () => `<div id="wh">${wheel(Hc, false, false)}</div><img src="${esc(Hc.thumb)}" style="position:absolute;right:120px;top:110px;width:420px">
      <div class="swatches" style="right:120px;top:450px">${Hc.cols.map((c, j) => `<div style="width:76px;animation-delay:${j * .2}s"><i style="background:${c};height:50px"></i><span>${Math.round(Hc.ang[j])}°</span></div>`).join('')}</div>
      ${say(['Each colour pulls toward its hue on the wheel,', 'as hard as it is saturated, bright and large.'], 'corner')}`,
    el => later(4500, () => { $('#wh', el).innerHTML = wheel(Hc, true, false); later(2500, () => { $('#wh', el).innerHTML = wheel(Hc, true, true); el.insertAdjacentHTML('beforeend', `<div class="readout fadein" style="right:200px;top:640px">${Hc.hue.toFixed(1)}°<small>the shot's hue: where the pulls add up</small></div>`); }); }));
  B('A colour is a number', 11, () => `${wheel(Hs, 'thr', true)}<img src="${esc(Hs.thumb)}" style="position:absolute;right:120px;top:110px;width:420px">
      <div class="readout fadein" style="right:150px;top:470px;font-size:72px;animation-delay:2s">no hue<small>the pulls add to ${Hs.chroma.toFixed(3)}; the line is 0.03 (red circle)</small></div>
      ${say(['Black and white: the pulls add to almost nothing.', 'Below the line, the machine says: no colour.'], 'corner')}`);
  B('A colour is a number', 10, () => `<div class="strip" style="top:150px">${F.hue_strip.map((h, i) => `<i style="background-image:url('${esc(h.thumb)}');animation-delay:${i * .04}s"></i>`).join('')}</div>
      <div class="strip" style="top:330px;height:24px">${F.hue_strip.map(h => `<i style="aspect-ratio:auto;height:24px;background:hsl(${h.hue},65%,50%);animation-delay:1.5s"></i>`).join('')}</div>
      <div class="panel fadein" style="left:60px;top:420px;animation-delay:2.5s;font:30px/1.3 var(--serif)"><b style="color:var(--gold);font-size:54px">${fmt(F.hue_stats.none)}</b> of ${fmt(T)} shots have <b>no hue at all</b>.</div>
      ${say(['Hue orders the colour map and the colour filter.', 'Half the archive is invisible to it.'], 'small')}`);
  B('A colour is a number', 8, () => say([`Run it again on the same frame: <b>${Hc.hue.toFixed(1)}°</b>.`, `The lab stored <b>${Hc.stored}°</b>.`, 'k-means starts from chance.'], 'mid'));
  /* 2 · FORTY-FIVE QUESTIONS */
  const aff = Object.fromEntries(P1.seed_aff), amax = Math.max(...P1.seed_aff.map(x => x[1]));
  const table = (val, lit = []) => { const cols = Math.max(...P1.signs.map(s => s.col)) + 1; return `<div class="table" style="left:640px;top:110px;grid-template-columns:repeat(${cols},58px);gap:4px">${P1.signs.map(s => { const v = val ? val(s) : 1; return `<div class="t${lit.includes(s.n) ? ' lit' : ''}" style="width:58px;height:58px;font-size:20px;padding:4px;grid-column:${s.col + 1};grid-row:${s.row + 1};background:${DOMC[s.dom]};filter:brightness(${.25 + .9 * v}) saturate(${.3 + v});animation-delay:${s.col * .1}s">${esc(s.symbol)}</div>`; }).join('')}</div>`; };
  B('Forty-five questions', 11, () => `<img src="${esc(seed.thumb)}" style="position:absolute;left:60px;top:120px;width:540px">${table(s => (aff[s.n] || 0) / amax)}${say(['The lab asks every shot 45 questions.', 'Brighter: closer, by CLIP.'], 'small')}`);
  const ask = ['1', '4', '9', '14', '22', '32', '42', '5'];
  B('Forty-five questions', 14, () => `<img src="${esc(seed.thumb)}" style="position:absolute;left:60px;top:120px;width:540px">${table(s => (aff[s.n] || 0) / amax)}<div class="panel" id="qq" style="left:60px;right:60px;bottom:50px;font:34px/1.3 var(--serif)"></div>`,
    el => ask.forEach((n, i) => later(i * 1650, () => { el.querySelectorAll('.t').forEach(t => t.classList.toggle('lit', t.textContent.trim() === S[n].symbol)); $('#qq', el).innerHTML = `${chip(n, 'font-size:28px')} <b style="color:var(--gold)">${esc(S[n].question)}</b> <span style="color:var(--dim);font:24px var(--mono)">${(aff[n] || 0).toFixed(1)}%</span>`; })));

/* ---------- the player (as Part I) ---------- */
const CUES = ['dae-slide-carousel-at-blue-hour', 'dae-preparation-drift', 'dae-salvaged-room-traveling-light', 'republic-ordinary-magic', 'dae-snowbound-umea-cabin', 'dae-compass-spin-in-heavy-fog', 'dae-cold-current-paddle', 'dae-cedar-and-cassette', 'dae-salvaged-timber', 'dae-odin-above-the-breakers'];
let chapters = [];
function cue(ci) { const src = `score/cues/${CUES[ci % CUES.length]}.m4a`; if (score.dataset.src === src) return; score.dataset.src = src;
  const v0 = score.volume, t = performance.now(); const out = () => { const k = Math.min(1, (performance.now() - t) / 900); score.volume = v0 * (1 - k); if (k < 1) requestAnimationFrame(out); else { score.src = src; score.currentTime = 0; duck(false); if (!paused) score.play().catch(() => { }); } }; out(); }
function show(i) {
  if (i < 0 || i >= beats.length) return; clearTimeout(timer); tok++; cur = i; const b = beats[i]; voice.pause();
  stage.querySelectorAll('.beat').forEach(o => { o.classList.remove('on'); o.querySelectorAll('video').forEach(v => { v.pause(); v.muted = true; }); setTimeout(() => o.remove(), 1000); });
  const el = document.createElement('div'); el.className = 'beat'; el.innerHTML = b.html(); stage.appendChild(el); requestAnimationFrame(() => el.classList.add('on'));
  duck(false); if (b.after) b.after(el); cue(chapters.findIndex(c => c.name === b.ch));
  left = b.secs * 1000; t0 = performance.now(); if (!paused) timer = setTimeout(() => show(i + 1), left); ui();
}
function ui() {
  const done = beats.slice(0, cur).reduce((a, b) => a + b.secs, 0), tot = beats.reduce((a, b) => a + b.secs, 0);
  document.querySelectorAll('#chs div').forEach((d, ci) => { const c = chapters[ci], cb = beats.filter(b => b.ch === c.name), first = beats.indexOf(cb[0]), passed = beats.slice(first, cur).reduce((a, b) => a + b.secs, 0);
    d.classList.toggle('on', beats[cur] && beats[cur].ch === c.name); d.querySelector('i').style.width = Math.min(100, (cur > first + cb.length - 1 ? 1 : cur < first ? 0 : passed / c.secs) * 100) + '%'; });
  const m = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; $('#time').textContent = `${m(done)} / ${m(tot)}`;
}
function pause(p) { paused = p; $('#bPlay').textContent = p ? '▶' : '❚❚';
  stage.querySelectorAll('.beat.on video').forEach(v => p ? v.pause() : v.play().catch(() => { })); p ? (score.pause(), voice.pause()) : (score.play().catch(() => { }), beats[cur] && beats[cur].voice && voice.play().catch(() => { }));
  if (p) { clearTimeout(timer); left -= performance.now() - t0; } else { t0 = performance.now(); timer = setTimeout(() => show(cur + 1), Math.max(500, left)); } }
function fit() { const W = innerWidth, H = innerHeight - 64, k = Math.min(W / 1600, H / 900); stage.style.transform = `translate(-50%, -50%) scale(${k})`; $('#wrap').style.height = H + 'px'; }
addEventListener('resize', fit);
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); pause(!paused); } if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
$('#bPlay').onclick = () => pause(!paused); $('#bNext').onclick = () => show(cur + 1); $('#bPrev').onclick = () => show(cur - 1);
$('#bSnd').onclick = () => { sound = !sound; $('#bSnd').textContent = sound ? '♪ on' : '♪ off'; duck(false); voice.muted = !sound; stage.querySelectorAll('video').forEach(v => { if (!sound) v.muted = true; }); };
(async function () {
  fit(); [F, P1, MV, WA, VJ] = await Promise.all(['explain/film2.json?v=2', 'explain/film.json?v=2', 'explain/moving.json?v=1', 'explain/watched.json?v=1', 'explain/vjepa.json?v=1'].map(u => fetch(u).then(r => r.json()))); S = Object.fromEntries(P1.signs.map(s => [s.n, s]));
  build();
  beats.forEach(b => { let c = chapters.find(c => c.name === b.ch); if (!c) chapters.push(c = { name: b.ch, secs: 0 }); c.secs += b.secs; });
  $('#chs').innerHTML = chapters.map(c => `<div style="--w:${c.secs}"><i></i><span>${esc(c.name)}</span></div>`).join('');
  document.querySelectorAll('#chs div').forEach((d, ci) => d.onclick = () => show(beats.findIndex(b => b.ch === chapters[ci].name)));
