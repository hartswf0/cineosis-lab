<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WARGAMES // 4D GRID CINEMA</title>
<style>
  :root {
    --bg: #000000;
    --fg: #33ff77;
    --fg-bright: #d0ffe4;
    --fg-dim: #1d6b38;
    --border: #0f381d;
    --amber: #ffb000;
    --cyan: #00e5ff;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }
  * {
    box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  *::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    background: transparent !important;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: var(--fg);
    font-family: var(--mono); font-size: 11px;
    user-select: none; -webkit-user-select: none;
  }

  .app {
    display: grid;
    grid-template-rows: 32px 1fr 74px 116px;
    width: 100vw; height: 100vh;
    background: #000;
  }

  /* 1. TOP TRANSPORT & GRID RULE BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-bottom: 1px solid var(--border);
    background: #020804; overflow-x: auto; white-space: nowrap; gap: 10px;
  }
  .bar-group { display: flex; align-items: center; gap: 4px; }
  .btn {
    font-family: var(--mono); font-size: 10px;
    background: #000; color: var(--fg);
    border: 1px solid var(--fg-dim); padding: 3px 8px;
    cursor: pointer; text-decoration: none;
  }
  .btn:hover, .btn.on { background: var(--fg); color: #000; font-weight: 700; }
  .btn.amber { color: var(--amber); border-color: #775200; }
  .btn.amber.on, .btn.amber:hover { background: var(--amber); color: #000; }
  .btn.cyan { color: var(--cyan); border-color: #006677; }
  .btn.cyan.on, .btn.cyan:hover { background: var(--cyan); color: #000; }

  /* 2. FULL-THEATER 16:9 VIDEO STAGE */
  .theater-stage {
    position: relative;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 14px; min-height: 0; overflow: hidden;
  }
  .video-16x9 {
    position: relative;
    height: 100%;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: #000;
    border: 1px solid var(--fg-dim);
    overflow: hidden;
    cursor: pointer;
  }
  .video-16x9 video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }
  .video-16x9 svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    opacity: 0.55;
    transition: opacity 0.2s;
  }
  body.hide-grid .video-16x9 svg { opacity: 0; }

  .hud-pill {
    position: absolute; top: 8px; left: 8px; z-index: 15;
    background: rgba(0,0,0,0.75); border: 1px solid var(--border);
    padding: 2px 8px; font-size: 10px; color: var(--fg-bright); pointer-events: none;
  }
  .hud-sub {
    position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 15;
    background: rgba(0,0,0,0.75); border: 1px solid var(--border);
    padding: 3px 8px; font-size: 11px; color: var(--fg-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }

  /* 3. 8 SUB-FRAMES (f1..f8) LEFT TO RIGHT */
  .strip-row {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px; padding: 4px 14px;
    border-top: 1px solid var(--border);
    background: #020603;
    align-items: center;
  }
  .f-card {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--border);
    overflow: hidden; cursor: pointer;
  }
  .f-card.active { border: 2px solid var(--amber); }
  .f-strip-img {
    position: absolute; top: 0; height: 100%; width: 800%; max-width: none;
    opacity: 0.85;
  }
  .f-card.active .f-strip-img { opacity: 1; }
  .f-card svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
  }
  .f-num {
    position: absolute; top: 2px; left: 3px; z-index: 8;
    background: rgba(0,0,0,0.75); padding: 0 3px; font-size: 8.5px; color: var(--fg-bright);
  }

  /* 4. UPGRADED BOTTOM TIMELINE & GRID-RULE SCRUBBER DOCK */
  .bottom-dock {
    display: grid;
    grid-template-rows: 22px 1fr;
    border-top: 1px solid var(--fg-dim);
    background: #010502;
    min-height: 0; overflow: hidden;
  }
  .dock-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; gap: 8px;
    background: #030b05; border-bottom: 1px solid var(--border);
    font-size: 9px;
  }
  .macro-barcode {
    flex: 1; height: 12px;
    background: #000; border: 1px solid #174425;
    display: flex; cursor: pointer; position: relative; overflow: hidden;
  }
  .bc-slice { flex: 1; height: 100%; opacity: 0.7; }
  .bc-slice:hover { opacity: 1; }
  .bc-slice.active { opacity: 1; box-shadow: inset 0 0 0 1px #fff; }

  .filmstrip {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; overflow-y: hidden; padding: 4px 10px;
    background: #000;
    scroll-behavior: smooth;
  }
  .sc-card {
    width: 142px; height: 84px;
    flex-shrink: 0;
    background: #020704; border: 1px solid #143d21;
    display: grid; grid-template-rows: 15px 1fr 15px;
    cursor: pointer; overflow: hidden;
  }
  .sc-card:hover { border-color: var(--fg); }
  .sc-card.active { border: 2px solid var(--amber); background: #0d0a00; }
  .sc-card-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px; background: #041008; font-size: 8px; color: var(--fg-bright);
    border-bottom: 1px solid #0c2915;
  }
  .sp-pill { padding: 0 3px; font-size: 7.5px; font-weight: 700; color: #000; }
  .sc-card-mid { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .sc-card-mid img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.78; }
  .sc-card.active .sc-card-mid img { opacity: 1; }
  .sc-card-mid svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .sc-card-bot {
    padding: 0 4px; line-height: 14px; font-size: 8px; color: #99e6b3;
    background: #020804; border-top: 1px solid #0c2915;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  @media (max-width: 900px) {
    .app { grid-template-rows: 32px 1fr 62px 112px; }
    .video-16x9 { width: 100%; height: auto; }
    .strip-row { padding: 3px 6px; gap: 2px; }
    .filmstrip { padding: 3px 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 1. TOP BAR -->
  <div class="topbar">
    <div class="bar-group">
      <button class="btn amber on" id="btnPlay" onclick="togglePlay()">[PAUSE]</button>
      <button class="btn cyan on" id="btnSound" onclick="toggleSound()">[UNMUTE SOUND]</button>
      <button class="btn" onclick="stepShot(-1)">[&lt; PREV]</button>
      <span id="shotNum" style="color:var(--fg-bright);font-weight:700;padding:0 4px;">001 / 105</span>
      <button class="btn" onclick="stepShot(1)">[NEXT &gt;]</button>
      <button class="btn on" id="btnGrid" onclick="toggleGrid()">[GRID OVERLAY: ON]</button>
    </div>

    <div class="bar-group" id="ruleBar">
      <span style="color:var(--amber);font-size:9.5px;">GRID:</span>
      <button class="btn amber on" data-rule="AUTO" onclick="setRuleMode('AUTO')">AUTO (WINNING)</button>
      <button class="btn" data-rule="golden_spiral" onclick="setRuleMode('golden_spiral')">SPIRAL</button>
      <button class="btn" data-rule="rule_of_thirds" onclick="setRuleMode('rule_of_thirds')">THIRDS</button>
      <button class="btn" data-rule="s_curve" onclick="setRuleMode('s_curve')">S-CURVE</button>
      <button class="btn" data-rule="symmetry" onclick="setRuleMode('symmetry')">SYMMETRY</button>
      <button class="btn" data-rule="frame_in_frame" onclick="setRuleMode('frame_in_frame')">APERTURE</button>
      <button class="btn" data-rule="v_shape" onclick="setRuleMode('v_shape')">V-WEDGE</button>
      <a class="btn amber" href="wg-studio-worm.html">[DUAL WORM CINEMA]</a>
      <a class="btn" href="wg-studio-screens.html">[68 SCREENS]</a>
    </div>
  </div>

  <!-- 2. LARGE UNCLUTTERED 16:9 VIDEO STAGE -->
  <div class="theater-stage">
    <div class="video-16x9" onclick="togglePlay()">
      <video id="stglVideo" autoplay muted playsinline webkit-playsinline preload="auto"></video>
      <svg id="stglSvg" viewBox="0 0 160 90" preserveAspectRatio="none"></svg>
      <div class="hud-pill" id="hudTop">S01-B01 // GOLDEN SPIRAL</div>
      <div class="hud-sub" id="hudSub">Loading...</div>
    </div>
  </div>

  <!-- 3. 8 SUB-FRAMES (f1..f8) -->
  <div class="strip-row" id="stripGrid"></div>

  <!-- 4. UPGRADED 105-SCENE FILMSTRIP DOCK -->
  <div class="bottom-dock">
    <div class="dock-header">
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
        <span style="color:var(--amber);font-weight:700;">105 SCENES GRID BARCODE:</span>
        <button class="btn" onclick="document.getElementById('filmstrip').scrollBy({left:-420,behavior:'smooth'})" style="padding:1px 5px;font-size:8.5px;">[&lt;&lt;]</button>
        <button class="btn" onclick="document.getElementById('filmstrip').scrollBy({left:420,behavior:'smooth'})" style="padding:1px 5px;font-size:8.5px;">[&gt;&gt;]</button>
      </div>
      <div class="macro-barcode" id="macroBarcode"></div>
      <span style="color:#99e6b3;font-size:8.5px;flex-shrink:0;">105 SCENES</span>
    </div>
    <div class="filmstrip" id="filmstrip"></div>
  </div>
</div>

<audio id="sceneAudio" preload="auto"></audio>

<script>
let SHOTS = [], CUR = 0, SUB = 0;
let PLAYING = true, SOUND_ON = false, SHOW_GRID = true, RULE_MODE = 'AUTO';

async function init() {
  const res = await fetch('wargames-stgl-ir.json?v=3');
  const data = await res.json();
  SHOTS = data.shots || [];
  renderFilmstrip();
  setupKeys();
  const fs = document.getElementById('filmstrip');
  fs.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); fs.scrollLeft += e.deltaY; }
  }, { passive: false });
  if (SHOTS.length) selectShot(0);
  requestAnimationFrame(loop);
}

function toggleGrid() {
  SHOW_GRID = !SHOW_GRID;
  document.body.classList.toggle('hide-grid', !SHOW_GRID);
  const btn = document.getElementById('btnGrid');
  btn.textContent = SHOW_GRID ? '[GRID OVERLAY: ON]' : '[GRID OVERLAY: OFF]';
  btn.classList.toggle('on', SHOW_GRID);
}

function setRuleMode(m) {
  RULE_MODE = m;
  document.querySelectorAll('#ruleBar button[data-rule]').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-rule') === m);
  });
  const sh = SHOTS[CUR];
  if (sh && sh.frames_8 && sh.frames_8[SUB]) renderSVG(sh, sh.frames_8[SUB]);
}

function toggleSound() {
  SOUND_ON = !SOUND_ON;
  const btn = document.getElementById('btnSound');
  btn.textContent = SOUND_ON ? '[SOUND: ON]' : '[UNMUTE SOUND]';
  btn.classList.toggle('on', !SOUND_ON);
  if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
}

function syncAudio(sh) {
  const aud = document.getElementById('sceneAudio');
  if (!SOUND_ON || !PLAYING) { aud.pause(); return; }
  const bId = sh.id.startsWith('S') && sh.id.includes('-B') ? sh.id : 'S01-B01';
  const src = `cache/wg_sound/${bId}_orig.m4a`;
  if (aud.dataset.src !== src) { aud.dataset.src = src; aud.src = src; }
  aud.currentTime = 0;
  aud.play().catch(() => {});
}

function togglePlay() {
  PLAYING = !PLAYING;
  const btn = document.getElementById('btnPlay');
  btn.textContent = PLAYING ? '[PAUSE]' : '[PLAY]';
  btn.classList.toggle('on', PLAYING);
  const vid = document.getElementById('stglVideo');
  const aud = document.getElementById('sceneAudio');
  if (PLAYING) {
    vid.play().catch(() => {});
    if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
  } else {
    vid.pause();
    aud.pause();
  }
}

const RULE_META = {
  golden_spiral:   { short: 'SPIRAL',   col: '#ff44cc' },
  rule_of_thirds:  { short: 'THIRDS',   col: '#00e5ff' },
  s_curve:         { short: 'S-CURVE',  col: '#ffb000' },
  symmetry:        { short: 'SYMMETRY', col: '#33ff77' },
  frame_in_frame:  { short: 'APERTURE', col: '#ff5544' },
  v_shape:         { short: 'V-WEDGE',  col: '#aa88ff' }
};

function renderFilmstrip() {
  const bc = document.getElementById('macroBarcode');
  const el = document.getElementById('filmstrip');

  bc.innerHTML = SHOTS.map((s, i) => {
    const r = (s.frames_8 && s.frames_8[0] && s.frames_8[0].primary_rule) || 'golden_spiral';
    const rm = RULE_META[r] || { short: 'GRID', col: '#33ff77' };
    return `<div class="bc-slice ${i === CUR ? 'active' : ''}"
                 style="background:${rm.col};"
                 onclick="selectShot(${i})"
                 title="#${i+1} ${s.id} · ${rm.short} · ${s.fulcrum_line || ''}"></div>`;
  }).join('');

  el.innerHTML = SHOTS.map((s, i) => {
    const fFrames = s.frames_8 || [];
    const r = (fFrames[0] && fFrames[0].primary_rule) || 'golden_spiral';
    const rm = RULE_META[r] || { short: 'GRID', col: '#33ff77' };
    const pts = fFrames.map(f => `${(f.u*100).toFixed(1)},${(f.v*56).toFixed(1)}`).join(' ');
    const mid = fFrames[3] || { u: 0.5, v: 0.5 };
    const cap = `${s.who ? s.who + ': ' : ''}${s.fulcrum_line || ''}`;
    return `
      <div class="sc-card ${i === CUR ? 'active' : ''}" id="ftile_${i}" onclick="selectShot(${i})">
        <div class="sc-card-top">
          <span>#${String(i+1).padStart(3,'0')} · ${s.id}</span>
          <span class="sp-pill" style="background:${rm.col};">${rm.short}</span>
        </div>
        <div class="sc-card-mid">
          <img src="${s.thumb}" loading="lazy" alt="">
          <svg viewBox="0 0 100 56" preserveAspectRatio="none">
            <polyline points="${pts}" fill="none" stroke="#00e5ff" stroke-width="1.8"/>
            <circle cx="${mid.u*100}" cy="${mid.v*56}" r="3" fill="${rm.col}" stroke="#fff" stroke-width="0.6"/>
          </svg>
        </div>
        <div class="sc-card-bot">${cap}</div>
      </div>
    `;
  }).join('');
}

function selectShot(idx) {
  if (!SHOTS.length) return;
  CUR = (idx + SHOTS.length) % SHOTS.length;
  const sh = SHOTS[CUR];

  document.getElementById('shotNum').textContent =
    `${String(CUR+1).padStart(3,'0')} / ${String(SHOTS.length).padStart(3,'0')}`;

  document.querySelectorAll('#filmstrip .sc-card').forEach((t, i) => t.classList.toggle('active', i === CUR));
  document.querySelectorAll('#macroBarcode .bc-slice').forEach((b, i) => b.classList.toggle('active', i === CUR));
  const tile = document.getElementById(`ftile_${CUR}`);
  if (tile) tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const vid = document.getElementById('stglVideo');
  vid.src = sh.video;
  vid.currentTime = 0;
  if (PLAYING) vid.play().catch(() => {});

  document.getElementById('hudSub').textContent =
    `${sh.who ? sh.who + ': ' : ''}"${sh.fulcrum_line || ''}"`;

  renderStrip8(sh);
  selectSubframe(0);
  syncAudio(sh);
}

function stepShot(d) { selectShot(CUR + d); }

function renderStrip8(sh) {
  const grid = document.getElementById('stripGrid');
  const frames = sh.frames_8 || [];
  const W = 160, H = 90;
  grid.innerHTML = frames.map((f, k) => {
    const [bx, by, bw, bh] = f.jev_box || [0.3, 0.3, 0.4, 0.4];
    return `
      <div class="f-card ${k === SUB ? 'active' : ''}" id="fCell_${k}" onclick="onTapSubframe(${k})">
        <img class="f-strip-img" src="${sh.strip}" style="left:${-(k*100)}%;">
        <svg viewBox="0 0 160 90" preserveAspectRatio="none">
          <rect x="${bx*W}" y="${by*H}" width="${bw*W}" height="${bh*H}" fill="none" stroke="#ffb000" stroke-width="1.6"/>
          <circle cx="${f.u*W}" cy="${f.v*H}" r="3" fill="#00e5ff" stroke="#fff" stroke-width="0.6"/>
        </svg>
        <div class="f-num">f${k+1}</div>
      </div>
    `;
  }).join('');
}

function onTapSubframe(k) {
  const vid = document.getElementById('stglVideo');
  if (vid.duration > 0) {
    vid.currentTime = ((k + 0.2) / 8.0) * vid.duration;
  }
  selectSubframe(k);
}

function selectSubframe(k) {
  const sh = SHOTS[CUR];
  if (!sh || !sh.frames_8 || !sh.frames_8[k]) return;
  SUB = k;
  document.querySelectorAll('.f-card').forEach((c, idx) => c.classList.toggle('active', idx === k));
  renderSVG(sh, sh.frames_8[k]);
}

function singleRuleSvg(rule, f, W, H, col) {
  const ux = f.u * W, uy = f.v * H;
  const dot = `<circle cx="${ux}" cy="${uy}" r="3.5" fill="#00e5ff" stroke="#fff" stroke-width="0.8"/>`;
  if (rule === 'golden_spiral') {
    const gn = f.focal_node || [0.618, 0.382];
    const gx = gn[0]*W, gy = gn[1]*H;
    const pts = [];
    for (let t = 0; t <= 4.0 * Math.PI; t += 0.16) {
      const r = W * 0.42 * Math.exp(-0.34 * t);
      pts.push(`${(gx + r*Math.cos(t)).toFixed(1)},${(gy + r*Math.sin(t)*(H/W)).toFixed(1)}`);
    }
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${gx}" cy="${gy}" r="4.5" fill="none" stroke="${col}" stroke-width="1.5"/>${dot}`;
  }
  if (rule === 'rule_of_thirds') {
    return `<line x1="${W/3}" y1="0" x2="${W/3}" y2="${H}" stroke="${col}" stroke-width="1.2"/><line x1="${2*W/3}" y1="0" x2="${2*W/3}" y2="${H}" stroke="${col}" stroke-width="1.2"/><line x1="0" y1="${H/3}" x2="${W}" y2="${H/3}" stroke="${col}" stroke-width="1.2"/><line x1="0" y1="${2*H/3}" x2="${W}" y2="${2*H/3}" stroke="${col}" stroke-width="1.2"/>${dot}`;
  }
  if (rule === 's_curve' && f.s_curve_bezier) {
    const b = f.s_curve_bezier;
    return `<path d="M ${b[0][0]*W} ${b[0][1]*H} C ${b[1][0]*W} ${b[1][1]*H}, ${b[2][0]*W} ${b[2][1]*H}, ${b[3][0]*W} ${b[3][1]*H}" fill="none" stroke="${col}" stroke-width="1.8"/>${dot}`;
  }
  if (rule === 'symmetry') {
    return `<line x1="${W*0.5}" y1="0" x2="${W*0.5}" y2="${H}" stroke="${col}" stroke-width="1.4"/><line x1="0" y1="${H*0.5}" x2="${W}" y2="${H*0.5}" stroke="${col}" stroke-width="1.4"/>${dot}`;
  }
  if (rule === 'centered') {
    return `<circle cx="${W*0.5}" cy="${H*0.5}" r="${H*0.28}" fill="none" stroke="${col}" stroke-width="1.5"/>${dot}`;
  }
  if (rule === 'frame_in_frame') {
    return `<rect x="${0.12*W}" y="${0.12*H}" width="${0.76*W}" height="${0.76*H}" fill="none" stroke="${col}" stroke-width="1.6"/>${dot}`;
  }
  if (rule === 'v_shape') {
    return f.v_orientation === 'A_PYRAMID'
      ? `<polyline points="0,${H} ${W*0.5},${H*0.14} ${W},${H}" fill="none" stroke="${col}" stroke-width="1.6"/>${dot}`
      : `<polyline points="0,0 ${W*0.5},${H*0.86} ${W},0" fill="none" stroke="${col}" stroke-width="1.6"/>${dot}`;
  }
  return dot;
}

function renderSVG(sh, f) {
  const svg = document.getElementById('stglSvg');
  const W = 160, H = 90;
  const sg = sh.spatial_grid || {};
  const winArm = f.primary_armature || sg.armature || 'golden_spiral';
  const activeRule = RULE_MODE === 'AUTO' ? winArm : RULE_MODE;

  document.getElementById('hudTop').textContent =
    `${sh.id} (${sh.shot_id}) // GRID: ${activeRule.replace(/_/g, ' ').toUpperCase()} · f${f.f}/8`;

  const parts = [singleRuleSvg(activeRule, f, W, H, '#ffb000')];

  if (f.jev_box) {
    const [bx, by, bw, bh] = f.jev_box;
    const tracePts = (sh.frames_8 || []).map(fr => `${fr.u*W},${fr.v*H}`).join(' ');
    parts.push(`
      <polyline points="${tracePts}" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="${bx*W}" y="${by*H}" width="${bw*W}" height="${bh*H}" fill="none" stroke="#ffb000" stroke-width="1.4"/>
    `);
  }

  svg.innerHTML = parts.join('');
}

function loop() {
  const sh = SHOTS[CUR];
  const vid = document.getElementById('stglVideo');
  if (PLAYING && sh) {
    if (vid.ended) {
      selectShot(CUR + 1);
    } else if (vid.duration > 0) {
      const k = Math.min(7, Math.floor((vid.currentTime / vid.duration) * 8));
      if (k !== SUB) selectSubframe(k);
    }
  }
  requestAnimationFrame(loop);
}

function setupKeys() {
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); stepShot(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepShot(-1); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
}

init();
</script>
</body>
</html>
