<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>4D GRID CINEMA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #33ff77;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    display: grid;
    grid-template-rows: 1fr 76px 56px;
    width: 100vw; height: 100vh;
    background: #061c0d; gap: 1px;
  }
  .stage {
    position: relative; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .vp-box {
    position: relative; width: 100%; height: 100%;
    max-width: 177.78vh; max-height: 56.25vw;
    background: #000; overflow: hidden;
  }
  #stglVideo {
    width: 100%; height: 100%; object-fit: fill; display: block;
  }
  #frameCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: none; pointer-events: none;
  }
  #stglSvg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 15;
  }
  .snd-dot {
    position: absolute; top: 8px; right: 8px; z-index: 25;
    width: 24px; height: 24px; background: rgba(0,0,0,0.7);
    border: 1px solid #33ff77; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .snd-dot.on { border-color: #00e5ff; background: rgba(0,229,255,0.2); }

  /* 8-FRAME VISUAL SUB-LATTICE STRIP */
  .strip-bar {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 2px; padding: 2px; background: #000;
  }
  .f-cell {
    position: relative; border: 1px solid #092612; background: #000;
    cursor: pointer; overflow: hidden;
  }
  .f-cell.active { border: 2px solid #ffb000; }
  .f-strip-img {
    position: absolute; top: 0; height: 100%; width: 800%; max-width: none;
    opacity: 0.78;
  }
  .f-cell.active .f-strip-img { opacity: 1; }
  .f-mini-svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  /* 105-BEAT VISUAL FILMSTRIP */
  .filmstrip {
    display: flex; align-items: center; gap: 2px;
    overflow-x: auto; overflow-y: hidden; padding: 2px;
    background: #000; scroll-behavior: smooth;
  }
  .tile {
    position: relative; height: 52px; width: 90px; flex-shrink: 0;
    border: 1px solid #092612; background: #000; cursor: pointer; overflow: hidden;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.6; }
  .tile.active { border: 2px solid #ffb000; }
  .tile.active img { opacity: 1; }

  @media (max-width: 900px) {
    .app { grid-template-rows: 1fr 62px 50px; }
    .vp-box { max-width: 100%; max-height: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- FULL-BLEED 16:9 STAGE -->
  <div class="stage" onclick="togglePlay()">
    <div class="vp-box">
      <video id="stglVideo" autoplay muted playsinline webkit-playsinline preload="auto"></video>
      <canvas id="frameCanvas" width="960" height="540"></canvas>
      <svg id="stglSvg" viewBox="0 0 1000 562.5" preserveAspectRatio="none"></svg>
      <div class="snd-dot" id="sndBtn" onclick="event.stopPropagation();toggleSound()" title="Audio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#33ff77" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path id="sndWaves" d="M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14" style="display:none;" stroke="#00e5ff"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 8-FRAME VISUAL SUB-LATTICE STRIP -->
  <div class="strip-bar" id="stripGrid"></div>

  <!-- 105-BEAT VISUAL FILMSTRIP -->
  <div class="filmstrip" id="filmstrip"></div>
</div>

<audio id="sceneAudio" preload="auto"></audio>

<script>
let SHOTS = [], CUR = 0, SUB = 0;
let PLAYING = true, SOUND_ON = false;
let STRIP_CACHE = {};

async function init() {
  const res = await fetch('wargames-stgl-ir.json');
  const data = await res.json();
  SHOTS = data.shots || [];
  renderFilmstrip();
  setupKeys();
  if (SHOTS.length) selectShot(0);
  requestAnimationFrame(loop);
}

function toggleSound() {
  SOUND_ON = !SOUND_ON;
  document.getElementById('sndBtn').classList.toggle('on', SOUND_ON);
  document.getElementById('sndWaves').style.display = SOUND_ON ? 'block' : 'none';
  if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
}

function syncAudio(sh) {
  const aud = document.getElementById('sceneAudio');
  if (!SOUND_ON || !PLAYING) { aud.pause(); return; }
  const bId = sh.id.startsWith('S') && sh.id.includes('-B') ? sh.id : 'S01-B01';
  const src = `cache/wg_sound/${bId}_orig.m4a`;
  if (aud.dataset.src !== src) { aud.dataset.src = src; aud.src = src; }
  aud.currentTime = 0;
  aud.play().catch(() => {});
}

function togglePlay() {
  PLAYING = !PLAYING;
  const vid = document.getElementById('stglVideo');
  const canvas = document.getElementById('frameCanvas');
  const aud = document.getElementById('sceneAudio');
  if (PLAYING) {
    canvas.style.display = 'none';
    vid.play().catch(() => {});
    if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
  } else {
    vid.pause();
    aud.pause();
    if (SHOTS[CUR]) drawSubframe(SHOTS[CUR].strip, SUB);
  }
}

function renderFilmstrip() {
  const el = document.getElementById('filmstrip');
  el.innerHTML = SHOTS.map((s, i) => `
    <div class="tile ${i === CUR ? 'active' : ''}" id="ftile_${i}" onclick="selectShot(${i})">
      <img src="${s.thumb}" loading="lazy" alt="">
    </div>
  `).join('');
}

function selectShot(idx) {
  if (!SHOTS.length) return;
  CUR = (idx + SHOTS.length) % SHOTS.length;
  const sh = SHOTS[CUR];

  document.querySelectorAll('.tile').forEach((t, i) => t.classList.toggle('active', i === CUR));
  const tile = document.getElementById(`ftile_${CUR}`);
  if (tile) tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const vid = document.getElementById('stglVideo');
  vid.src = sh.video;
  vid.currentTime = 0;
  if (PLAYING) {
    document.getElementById('frameCanvas').style.display = 'none';
    vid.play().catch(() => {});
  }

  renderStrip8(sh);
  selectSubframe(0);
  syncAudio(sh);
}

function stepShot(d) { selectShot(CUR + d); }

function renderStrip8(sh) {
  const grid = document.getElementById('stripGrid');
  const frames = sh.frames_8 || [];
  grid.innerHTML = frames.map((f, k) => {
    const [bx, by, bw, bh] = f.jev_box || [0.3, 0.3, 0.4, 0.4];
    return `
      <div class="f-cell ${k === SUB ? 'active' : ''}" id="fCell_${k}" onclick="onTapSubframe(${k})">
        <img class="f-strip-img" src="${sh.strip}" style="left:${-(k*100)}%;">
        <svg class="f-mini-svg" viewBox="0 0 100 56.25" preserveAspectRatio="none">
          <rect x="${bx*100}" y="${by*56.25}" width="${bw*100}" height="${bh*56.25}" fill="none" stroke="#ffb000" stroke-width="1.4"/>
          <circle cx="${f.u*100}" cy="${f.v*56.25}" r="2.8" fill="#00e5ff"/>
        </svg>
      </div>
    `;
  }).join('');
}

function onTapSubframe(k) {
  PLAYING = false;
  document.getElementById('stglVideo').pause();
  document.getElementById('sceneAudio').pause();
  selectSubframe(k);
}

function selectSubframe(k) {
  const sh = SHOTS[CUR];
  if (!sh || !sh.frames_8 || !sh.frames_8[k]) return;
  SUB = k;
  document.querySelectorAll('.f-cell').forEach((c, idx) => c.classList.toggle('active', idx === k));
  const f = sh.frames_8[k];
  if (!PLAYING) drawSubframe(sh.strip, k);
  renderSVG(sh, f);
}

function drawSubframe(stripUrl, k) {
  const canvas = document.getElementById('frameCanvas');
  const ctx = canvas.getContext('2d');
  let im = STRIP_CACHE[stripUrl];
  const paint = (img) => {
    const fw = img.naturalWidth / 8, fh = img.naturalHeight;
    canvas.style.display = 'block';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, k * fw, 0, fw, fh, 0, 0, canvas.width, canvas.height);
  };
  if (!im) {
    im = new Image();
    im.onload = () => { STRIP_CACHE[stripUrl] = im; if (!PLAYING) paint(im); };
    im.src = stripUrl;
  } else if (im.complete) {
    paint(im);
  }
}

function renderSVG(sh, f) {
  const svg = document.getElementById('stglSvg');
  const W = 1000, H = 562.5;
  const parts = [];
  const sg = sh.spatial_grid || {};
  const winArm = f.primary_armature || sg.armature || 'golden_spiral';

  if (f.negative_space_zone && f.negative_space_zone.polygon) {
    const poly = f.negative_space_zone.polygon.map(pt => `${pt[0]*W},${pt[1]*H}`).join(' ');
    parts.push(`<polygon points="${poly}" fill="rgba(0, 229, 255, 0.05)" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4"/>`);
  }

  const isFrame = winArm === 'frame_in_frame';
  parts.push(`<rect x="${0.12*W}" y="${0.12*H}" width="${0.76*W}" height="${0.76*H}" fill="none" stroke="${isFrame ? '#ffb000' : 'rgba(51,255,119,0.22)'}" stroke-width="${isFrame ? 2.4 : 1}" stroke-dasharray="8 4"/>`);

  const isThirds = winArm === 'rule_of_thirds';
  const colT = isThirds ? '#ffb000' : 'rgba(51,255,119,0.28)';
  const wT = isThirds ? 2 : 1;
  parts.push(`
    <line x1="${W/3}" y1="0" x2="${W/3}" y2="${H}" stroke="${colT}" stroke-width="${wT}"/>
    <line x1="${2*W/3}" y1="0" x2="${2*W/3}" y2="${H}" stroke="${colT}" stroke-width="${wT}"/>
    <line x1="0" y1="${H/3}" x2="${W}" y2="${H/3}" stroke="${colT}" stroke-width="${wT}"/>
    <line x1="0" y1="${2*H/3}" x2="${W}" y2="${2*H/3}" stroke="${colT}" stroke-width="${wT}"/>
  `);
  [[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3]].forEach(([tu, tv]) => {
    parts.push(`<circle cx="${tu*W}" cy="${tv*H}" r="5" fill="none" stroke="${colT}" stroke-width="1.4"/>`);
  });

  const isSym = winArm === 'symmetry' || winArm === 'centered';
  const colS = isSym ? '#ffb000' : 'rgba(51,255,119,0.2)';
  parts.push(`
    <line x1="${W*0.5}" y1="0" x2="${W*0.5}" y2="${H}" stroke="${colS}" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="0" y1="${H*0.5}" x2="${W}" y2="${H*0.5}" stroke="${colS}" stroke-width="1.2" stroke-dasharray="3 3"/>
  `);

  const isV = winArm === 'v_shape';
  const colV = isV ? '#ffb000' : 'rgba(51,255,119,0.2)';
  if (f.v_orientation === 'A_PYRAMID') {
    parts.push(`<polyline points="0,${H} ${W*0.5},${H*0.14} ${W},${H}" fill="none" stroke="${colV}" stroke-width="${isV ? 2.4 : 1}"/>`);
  } else {
    parts.push(`<polyline points="0,0 ${W*0.5},${H*0.86} ${W},0" fill="none" stroke="${colV}" stroke-width="${isV ? 2.4 : 1}"/>`);
  }

  const isSp = winArm === 'golden_spiral';
  const colSp = isSp ? '#ffb000' : '#33ff77';
  const gn = f.focal_node || [0.618, 0.382];
  const gx = gn[0] * W, gy = gn[1] * H;
  const pts = [];
  for (let t = 0; t <= 4.2 * Math.PI; t += 0.12) {
    const r = 420 * Math.exp(-0.34 * t);
    const sx = Math.max(0, Math.min(W, gx + r * Math.cos(t)));
    const sy = Math.max(0, Math.min(H, gy + r * Math.sin(t) * (H / W)));
    pts.push(`${sx.toFixed(1)},${sy.toFixed(1)}`);
  }
  parts.push(`
    <polyline points="${pts.join(' ')}" fill="none" stroke="${colSp}" stroke-width="${isSp ? 2.6 : 1.3}" opacity="${isSp ? 0.95 : 0.55}"/>
    <circle cx="${gx}" cy="${gy}" r="8" fill="none" stroke="${colSp}" stroke-width="2"/>
  `);

  if (f.s_curve_bezier && f.s_curve_bezier.length === 4) {
    const isSC = winArm === 's_curve';
    const b = f.s_curve_bezier;
    const dPath = `M ${b[0][0]*W} ${b[0][1]*H} C ${b[1][0]*W} ${b[1][1]*H}, ${b[2][0]*W} ${b[2][1]*H}, ${b[3][0]*W} ${b[3][1]*H}`;
    parts.push(`
      <path d="${dPath}" fill="none" stroke="${isSC ? '#00e5ff' : 'rgba(0,229,255,0.45)'}" stroke-width="${isSC ? 2.8 : 1.4}"/>
      <circle cx="${b[0][0]*W}" cy="${b[0][1]*H}" r="4" fill="#00e5ff"/>
      <circle cx="${b[3][0]*W}" cy="${b[3][1]*H}" r="4" fill="#00e5ff"/>
    `);
  }

  if (f.jev_box) {
    const [bx, by, bw, bh] = f.jev_box;
    const ux = f.u * W, uy = f.v * H;
    const tracePts = (sh.frames_8 || []).map(fr => `${fr.u*W},${fr.v*H}`).join(' ');
    parts.push(`
      <polyline points="${tracePts}" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-dasharray="4 2"/>
      <rect x="${bx*W}" y="${by*H}" width="${bw*W}" height="${bh*H}" fill="rgba(255, 176, 0, 0.06)" stroke="#ffb000" stroke-width="2.2"/>
      <line x1="${ux-12}" y1="${uy}" x2="${ux+12}" y2="${uy}" stroke="#b8ffd0" stroke-width="2"/>
      <line x1="${ux}" y1="${uy-12}" x2="${ux}" y2="${uy+12}" stroke="#b8ffd0" stroke-width="2"/>
      <circle cx="${ux}" cy="${uy}" r="5.5" fill="#00e5ff"/>
    `);
  }

  svg.innerHTML = parts.join('');
}

function loop() {
  const sh = SHOTS[CUR];
  const vid = document.getElementById('stglVideo');
  if (PLAYING && sh) {
    if (vid.ended) {
      selectShot(CUR + 1);
    } else if (vid.duration > 0) {
      const k = Math.min(7, Math.floor((vid.currentTime / vid.duration) * 8));
      if (k !== SUB) selectSubframe(k);
    }
  }
  requestAnimationFrame(loop);
}

function setupKeys() {
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); stepShot(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepShot(-1); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
}

init();
</script>
</body>
</html>
