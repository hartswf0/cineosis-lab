<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>4D GRID CINEMA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #33ff77;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    display: grid;
    grid-template-rows: 1fr 82px 62px;
    width: 100vw; height: 100vh;
    background: #061c0d; gap: 1px;
  }

  /* ROW 1: MASTER VIDEO + 4x2 WALL OF ALL 8 COMPOSITION ARMATURE FRAMES */
  .top-stage {
    display: grid;
    grid-template-columns: 1.15fr 1.55fr;
    gap: 1px; background: #061c0d;
    min-height: 0; overflow: hidden;
  }
  .master-vp {
    position: relative; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .master-vp video, #frameCanvas {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #frameCanvas { position: absolute; inset: 0; display: none; pointer-events: none; }
  #stglSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* 4x2 WALL OF THE 8 COMPOSITIONAL ARMATURES OVER THE LIVE FRAME */
  .arm-wall {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 1px; background: #061c0d;
    min-height: 0; overflow: hidden;
  }
  .arm-cell {
    position: relative; background: #000; overflow: hidden; cursor: pointer;
  }
  .arm-cell.win { outline: 2px solid #ffb000; outline-offset: -2px; z-index: 5; }
  .arm-cell .f-strip-img {
    position: absolute; top: 0; height: 100%; width: 800%; max-width: none;
    opacity: 0.78;
  }
  .arm-cell.win .f-strip-img { opacity: 1; }
  .arm-cell svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  .snd-dot {
    position: absolute; top: 8px; right: 8px; z-index: 25;
    width: 26px; height: 26px; background: rgba(0,0,0,0.75);
    border: 1px solid #33ff77; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .snd-dot.on { border-color: #00e5ff; background: rgba(0,229,255,0.22); }

  /* ROW 2: 8 WATCHABLE SUB-FRAME SLICES (f1..f8) */
  .strip-bar {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 1px; background: #061c0d;
  }
  .f-cell {
    position: relative; background: #000; cursor: pointer; overflow: hidden;
  }
  .f-cell.active { outline: 2px solid #00e5ff; outline-offset: -2px; z-index: 4; }
  .f-strip-img {
    position: absolute; top: 0; height: 100%; width: 800%; max-width: none;
    opacity: 0.78;
  }
  .f-cell.active .f-strip-img { opacity: 1; }
  .f-mini-svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  /* ROW 3: 105-BEAT VISUAL FILMSTRIP */
  .filmstrip {
    display: flex; align-items: center; gap: 2px;
    overflow-x: auto; overflow-y: hidden; padding: 2px;
    background: #000; scroll-behavior: smooth;
  }
  .tile {
    position: relative; height: 58px; width: 100px; flex-shrink: 0;
    border: 1px solid #092612; background: #000; cursor: pointer; overflow: hidden;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.62; }
  .tile.active { border: 2px solid #ffb000; }
  .tile.active img { opacity: 1; }

  @media (max-width: 960px) {
    .app { grid-template-rows: 1fr 58px 52px; }
    .top-stage { grid-template-columns: 1fr; grid-template-rows: 48% 52%; }
    .tile { height: 48px; width: 82px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- TOP: MASTER VIDEO + 8-ARMATURE FRAME WALL -->
  <div class="top-stage">
    <div class="master-vp" onclick="togglePlay()">
      <video id="stglVideo" autoplay muted playsinline webkit-playsinline preload="auto"></video>
      <canvas id="frameCanvas" width="960" height="540"></canvas>
      <svg id="stglSvg" viewBox="0 0 1000 562.5" preserveAspectRatio="none"></svg>
      <div class="snd-dot" id="sndBtn" onclick="event.stopPropagation();toggleSound()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#33ff77" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path id="sndWaves" d="M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14" style="display:none;" stroke="#00e5ff"/>
        </svg>
      </div>
    </div>

    <div class="arm-wall" id="armWall"></div>
  </div>

  <!-- MIDDLE: 8-FRAME VISUAL SUB-LATTICE STRIP (f1..f8) -->
  <div class="strip-bar" id="stripGrid"></div>

  <!-- BOTTOM: 105-BEAT VISUAL FILMSTRIP -->
  <div class="filmstrip" id="filmstrip"></div>
</div>

<audio id="sceneAudio" preload="auto"></audio>

<script>
const RULES = [
  'golden_spiral','rule_of_thirds','s_curve','symmetry',
  'centered','frame_in_frame','v_shape','negative_space'
];

let SHOTS = [], CUR = 0, SUB = 0;
let PLAYING = true, SOUND_ON = false;
let STRIP_CACHE = {};

async function init() {
  const res = await fetch('wargames-stgl-ir.json');
  const data = await res.json();
  SHOTS = data.shots || [];
  renderFilmstrip();
  setupKeys();
  if (SHOTS.length) selectShot(0);
  requestAnimationFrame(loop);
}

function toggleSound() {
  SOUND_ON = !SOUND_ON;
  document.getElementById('sndBtn').classList.toggle('on', SOUND_ON);
  document.getElementById('sndWaves').style.display = SOUND_ON ? 'block' : 'none';
  if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
}

function syncAudio(sh) {
  const aud = document.getElementById('sceneAudio');
  if (!SOUND_ON || !PLAYING) { aud.pause(); return; }
  const bId = sh.id.startsWith('S') && sh.id.includes('-B') ? sh.id : 'S01-B01';
  const src = `cache/wg_sound/${bId}_orig.m4a`;
  if (aud.dataset.src !== src) { aud.dataset.src = src; aud.src = src; }
  aud.currentTime = 0;
  aud.play().catch(() => {});
}

function togglePlay() {
  PLAYING = !PLAYING;
  const vid = document.getElementById('stglVideo');
  const canvas = document.getElementById('frameCanvas');
  const aud = document.getElementById('sceneAudio');
  if (PLAYING) {
    canvas.style.display = 'none';
    vid.play().catch(() => {});
    if (SHOTS[CUR]) syncAudio(SHOTS[CUR]);
  } else {
    vid.pause();
    aud.pause();
    if (SHOTS[CUR]) drawSubframe(SHOTS[CUR].strip, SUB);
  }
}

function renderFilmstrip() {
  const el = document.getElementById('filmstrip');
  el.innerHTML = SHOTS.map((s, i) => `
    <div class="tile ${i === CUR ? 'active' : ''}" id="ftile_${i}" onclick="selectShot(${i})">
      <img src="${s.thumb}" loading="lazy" alt="">
    </div>
  `).join('');
}

function selectShot(idx) {
  if (!SHOTS.length) return;
  CUR = (idx + SHOTS.length) % SHOTS.length;
  const sh = SHOTS[CUR];

  document.querySelectorAll('.tile').forEach((t, i) => t.classList.toggle('active', i === CUR));
  const tile = document.getElementById(`ftile_${CUR}`);
  if (tile) tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const vid = document.getElementById('stglVideo');
  vid.src = sh.video;
  vid.currentTime = 0;
  if (PLAYING) {
    document.getElementById('frameCanvas').style.display = 'none';
    vid.play().catch(() => {});
  }

  renderStrip8(sh);
  selectSubframe(0);
  syncAudio(sh);
}

function stepShot(d) { selectShot(CUR + d); }

function renderStrip8(sh) {
  const grid = document.getElementById('stripGrid');
  const frames = sh.frames_8 || [];
  grid.innerHTML = frames.map((f, k) => {
    const [bx, by, bw, bh] = f.jev_box || [0.3, 0.3, 0.4, 0.4];
    return `
      <div class="f-cell ${k === SUB ? 'active' : ''}" id="fCell_${k}" onclick="onTapSubframe(${k})">
        <img class="f-strip-img" src="${sh.strip}" style="left:${-(k*100)}%;">
        <svg class="f-mini-svg" viewBox="0 0 100 56.25" preserveAspectRatio="none">
          <rect x="${bx*100}" y="${by*56.25}" width="${bw*100}" height="${bh*56.25}" fill="none" stroke="#ffb000" stroke-width="1.5"/>
          <circle cx="${f.u*100}" cy="${f.v*56.25}" r="2.8" fill="#00e5ff"/>
        </svg>
      </div>
    `;
  }).join('');
}

function onTapSubframe(k) {
  PLAYING = false;
  document.getElementById('stglVideo').pause();
  document.getElementById('sceneAudio').pause();
  selectSubframe(k);
}

function selectSubframe(k) {
  const sh = SHOTS[CUR];
  if (!sh || !sh.frames_8 || !sh.frames_8[k]) return;
  SUB = k;
  document.querySelectorAll('.f-cell').forEach((c, idx) => c.classList.toggle('active', idx === k));
  const f = sh.frames_8[k];
  if (!PLAYING) drawSubframe(sh.strip, k);
  renderSVG(sh, f);
  renderArmWall8(sh, f, k);
}

function drawSubframe(stripUrl, k) {
  const canvas = document.getElementById('frameCanvas');
  const ctx = canvas.getContext('2d');
  let im = STRIP_CACHE[stripUrl];
  const paint = (img) => {
    const fw = img.naturalWidth / 8, fh = img.naturalHeight;
    canvas.style.display = 'block';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, k * fw, 0, fw, fh, 0, 0, canvas.width, canvas.height);
  };
  if (!im) {
    im = new Image();
    im.onload = () => { STRIP_CACHE[stripUrl] = im; if (!PLAYING) paint(im); };
    im.src = stripUrl;
  } else if (im.complete) {
    paint(im);
  }
}

function singleRuleSvg(rule, f, W, H, col) {
  const ux = f.u * W, uy = f.v * H;
  const dot = `<circle cx="${ux}" cy="${uy}" r="4" fill="#00e5ff"/>`;
  if (rule === 'golden_spiral') {
    const gn = f.focal_node || [0.618, 0.382];
    const gx = gn[0]*W, gy = gn[1]*H;
    const pts = [];
    for (let t = 0; t <= 4.0 * Math.PI; t += 0.16) {
      const r = W * 0.42 * Math.exp(-0.34 * t);
      pts.push(`${(gx + r*Math.cos(t)).toFixed(1)},${(gy + r*Math.sin(t)*(H/W)).toFixed(1)}`);
    }
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2"/><circle cx="${gx}" cy="${gy}" r="5" fill="none" stroke="${col}" stroke-width="1.8"/>${dot}`;
  }
  if (rule === 'rule_of_thirds') {
    return `<line x1="${W/3}" y1="0" x2="${W/3}" y2="${H}" stroke="${col}" stroke-width="1.8"/><line x1="${2*W/3}" y1="0" x2="${2*W/3}" y2="${H}" stroke="${col}" stroke-width="1.8"/><line x1="0" y1="${H/3}" x2="${W}" y2="${H/3}" stroke="${col}" stroke-width="1.8"/><line x1="0" y1="${2*H/3}" x2="${W}" y2="${2*H/3}" stroke="${col}" stroke-width="1.8"/>${dot}`;
  }
  if (rule === 's_curve' && f.s_curve_bezier) {
    const b = f.s_curve_bezier;
    return `<path d="M ${b[0][0]*W} ${b[0][1]*H} C ${b[1][0]*W} ${b[1][1]*H}, ${b[2][0]*W} ${b[2][1]*H}, ${b[3][0]*W} ${b[3][1]*H}" fill="none" stroke="${col}" stroke-width="2.4"/>${dot}`;
  }
  if (rule === 'symmetry') {
    return `<line x1="${W*0.5}" y1="0" x2="${W*0.5}" y2="${H}" stroke="${col}" stroke-width="2"/><line x1="0" y1="${H*0.5}" x2="${W}" y2="${H*0.5}" stroke="${col}" stroke-width="2"/>${dot}`;
  }
  if (rule === 'centered') {
    return `<circle cx="${W*0.5}" cy="${H*0.5}" r="${H*0.28}" fill="none" stroke="${col}" stroke-width="2"/>${dot}`;
  }
  if (rule === 'frame_in_frame') {
    return `<rect x="${0.12*W}" y="${0.12*H}" width="${0.76*W}" height="${0.76*H}" fill="none" stroke="${col}" stroke-width="2.2"/>${dot}`;
  }
  if (rule === 'v_shape') {
    return f.v_orientation === 'A_PYRAMID'
      ? `<polyline points="0,${H} ${W*0.5},${H*0.14} ${W},${H}" fill="none" stroke="${col}" stroke-width="2.2"/>${dot}`
      : `<polyline points="0,0 ${W*0.5},${H*0.86} ${W},0" fill="none" stroke="${col}" stroke-width="2.2"/>${dot}`;
  }
  if (rule === 'negative_space' && f.negative_space_zone && f.negative_space_zone.polygon) {
    const poly = f.negative_space_zone.polygon.map(pt => `${pt[0]*W},${pt[1]*H}`).join(' ');
    return `<polygon points="${poly}" fill="rgba(0,229,255,0.18)" stroke="${col}" stroke-width="2"/>${dot}`;
  }
  return dot;
}

function renderArmWall8(sh, f, k) {
  const wall = document.getElementById('armWall');
  const winArm = f.primary_armature || (sh.spatial_grid && sh.spatial_grid.armature) || 'golden_spiral';
  wall.innerHTML = RULES.map(rule => {
    const isWin = rule === winArm;
    const col = isWin ? '#ffb000' : '#33ff77';
    return `
      <div class="arm-cell ${isWin ? 'win' : ''}" onclick="stepShot(1)">
        <img class="f-strip-img" src="${sh.strip}" style="left:${-(k*100)}%;">
        <svg viewBox="0 0 200 112.5" preserveAspectRatio="none">
          ${singleRuleSvg(rule, f, 200, 112.5, col)}
        </svg>
      </div>
    `;
  }).join('');
}

function renderSVG(sh, f) {
  const svg = document.getElementById('stglSvg');
  const W = 1000, H = 562.5;
  const parts = [];
  const sg = sh.spatial_grid || {};
  const winArm = f.primary_armature || sg.armature || 'golden_spiral';

  parts.push(singleRuleSvg(winArm, f, W, H, '#ffb000'));

  if (f.jev_box) {
    const [bx, by, bw, bh] = f.jev_box;
    const ux = f.u * W, uy = f.v * H;
    const tracePts = (sh.frames_8 || []).map(fr => `${fr.u*W},${fr.v*H}`).join(' ');
    parts.push(`
      <polyline points="${tracePts}" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-dasharray="4 2"/>
      <rect x="${bx*W}" y="${by*H}" width="${bw*W}" height="${bh*H}" fill="rgba(255, 176, 0, 0.06)" stroke="#ffb000" stroke-width="2.2"/>
      <line x1="${ux-12}" y1="${uy}" x2="${ux+12}" y2="${uy}" stroke="#b8ffd0" stroke-width="2"/>
      <line x1="${ux}" y1="${uy-12}" x2="${ux}" y2="${uy+12}" stroke="#b8ffd0" stroke-width="2"/>
    `);
  }

  svg.innerHTML = parts.join('');
}

function loop() {
  const sh = SHOTS[CUR];
  const vid = document.getElementById('stglVideo');
  if (PLAYING && sh) {
    if (vid.ended) {
      selectShot(CUR + 1);
    } else if (vid.duration > 0) {
      const k = Math.min(7, Math.floor((vid.currentTime / vid.duration) * 8));
      if (k !== SUB) selectSubframe(k);
    }
  }
  requestAnimationFrame(loop);
}

function setupKeys() {
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); stepShot(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepShot(-1); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
}

init();
</script>
</body>
</html>
