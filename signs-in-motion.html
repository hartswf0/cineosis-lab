<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Signs in Motion</title>
<meta name="description" content="The periodic table of cinematic signs as a film: the camera travels the table, every sign opens into its shots, one plays in its own sound, and the sign it is mistaken for answers it. A D-A-E score, no narration.">
<meta property="og:title" content="The Signs in Motion · Cineosis Lab"><meta property="og:description" content="Forty-four signs from the archive, played, not read.">
<meta name="theme-color" content="#0b0a09"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0a09;--ink:#ece6da;--dim:#9a9285;--rule:#34302b;
--perception:#e9d9a8;--affect:#f0b9a4;--action:#e7a37c;--reflection:#b9cfa0;--mental:#a9c9c9;--break:#d9d3c7;--time:#b8b3d8;--read:#d9b8d2}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 "IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#view{position:fixed;inset:0;overflow:hidden}
/* the table, as a world the camera moves over */
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.8s cubic-bezier(.65,0,.25,1);will-change:transform}
#world.fast{transition-duration:.9s}
#table{position:relative;display:grid;grid-template-columns:repeat(16,150px);grid-template-rows:28px repeat(3,150px);gap:8px;padding:40px}
.colh{font-size:11px;letter-spacing:.1em;color:var(--c);align-self:end;padding-bottom:4px;white-space:nowrap;overflow:hidden}
.tile{position:relative;border-radius:6px;overflow:hidden;background:#000;border-top:5px solid var(--c);transition:opacity .8s,box-shadow .6s,filter .8s}
.tile.tall{grid-row:2 / span 3}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .6s}
.tile .sym{position:absolute;left:8px;top:6px;font:900 34px/1 "Arial Black",Impact,sans-serif;color:var(--c);text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:2}
.tile .num{position:absolute;right:8px;top:8px;font-size:10px;color:#fff;opacity:.8;z-index:2;text-shadow:0 1px 3px #000}
.tile .nm{position:absolute;left:8px;right:8px;bottom:6px;font-size:10.5px;color:#fff;text-shadow:0 1px 3px #000;z-index:2;line-height:1.2}
#world.dimmed .tile{opacity:.18;filter:saturate(.3)}
#world.dimmed .tile.on,#world.dimmed .tile.near{opacity:1;filter:none}
.tile.on{box-shadow:0 0 0 3px var(--c),0 0 40px -6px var(--c)}
.tile.vs{box-shadow:0 0 0 3px #fff}
/* the shots, over the table */
.over{position:fixed;inset:0;opacity:0;transition:opacity .9s;background:#000;z-index:5}
.over.on{opacity:1}
.over video{position:absolute;width:100%;height:100%;object-fit:cover}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px}
.mosaic > .cell{position:relative;overflow:hidden;background:#000;transform:scale(.6);opacity:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .9s}
.mosaic > .cell video{inset:0}
.mosaic.in > .cell{transform:none;opacity:1}
.mosaic.in > .cell:nth-child(2){transition-delay:.12s}.mosaic.in > .cell:nth-child(3){transition-delay:.24s}.mosaic.in > .cell:nth-child(4){transition-delay:.36s}.mosaic.in > .cell:nth-child(5){transition-delay:.48s}.mosaic.in > .cell:nth-child(6){transition-delay:.6s}
.split{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.split > .cell{position:relative;overflow:hidden}
.label{position:absolute;z-index:3;display:flex;align-items:baseline;gap:12px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.label b{font:900 clamp(40px,9vw,120px)/.9 "Arial Black",Impact,sans-serif;color:var(--c)}
.label span{font-size:clamp(12px,1.8vw,20px);letter-spacing:.06em;color:#fff}
.q{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:3;width:min(86%,900px);text-align:center;font:italic clamp(16px,2.6vw,30px)/1.25 Georgia,serif;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.95)}
.src{position:absolute;right:14px;bottom:12px;z-index:3;font-size:11px;letter-spacing:.08em;color:#fff;opacity:.8;text-shadow:0 1px 3px #000}
.or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font:900 clamp(22px,4vw,48px) "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 2px 14px #000}
.wipe{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--c);color:#0b0a09;clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.7,0,.3,1)}
.wipe.on{clip-path:inset(0 0 0 0)}.wipe.off{clip-path:inset(0 0 0 100%)}
.wipe b{font:900 clamp(30px,7vw,90px)/.95 "Arial Black",Impact,sans-serif;text-transform:uppercase}
.wipe span{font-size:clamp(11px,1.6vw,16px);letter-spacing:.2em;text-transform:uppercase}
/* start and controls */
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(11,10,9,.86)}
#start h1{font:900 clamp(40px,9vw,104px)/.9 "Arial Black",Impact,sans-serif}
#start p{color:var(--dim);font-size:clamp(11px,1.6vw,14px);letter-spacing:.06em}
.go{display:inline-flex;align-items:center;gap:10px;font:700 13px "IBM Plex Mono",monospace;letter-spacing:.16em;padding:13px 28px;border-radius:26px;background:var(--ink);color:#0b0a09}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:.25;transition:opacity .4s}
#hud:hover,#hud:focus-within{opacity:1}
#hud button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
#hud svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{flex:1;display:flex;gap:2px;min-width:0}
#dots i{flex:1;height:5px;border-radius:2px;background:var(--c);opacity:.25}
#dots i.done{opacity:.7}#dots i.cur{opacity:1}
#hud a{color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-decoration:none;white-space:nowrap}
#spd{font-size:11px;width:auto!important;padding:0 10px;border-radius:16px!important}
</style></head><body>
<div id="view"><div id="world"><div id="table"></div></div></div>
<div class="over" id="o1"></div><div class="over" id="o2"></div>
<div class="wipe" id="wipe"><b></b><span></span></div>
<div id="start"><h1>THE SIGNS<br>IN MOTION</h1><p>FORTY-FOUR CINEMATIC SIGNS · TWO HUNDRED AND FIFTY SHOTS · PLAYED, NOT READ</p>
  <button class="go" id="go">▶ PLAY</button><small style="color:var(--dim)" id="load">loading the table…</small></div>
<div id="hud">
  <button id="prev" aria-label="Previous sign"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
  <button id="pp" aria-label="Pause"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14M16 5v14"/></svg></button>
  <button id="next" aria-label="Next sign"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  <button id="spd" aria-label="Speed">1×</button>
  <div id="dots"></div><a href="periodic-table.html">THE TABLE</a>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLS=[{img:"Perception",dom:"perception",signs:["1","2","3"]},{img:"Affection",dom:"affect",signs:["4","5","6"]},{img:"Impulse",dom:"action",signs:["7","8","9"]},
 {img:"Action · small",dom:"action",signs:["10","11","12"]},{img:"Action · large",dom:"action",signs:["13","14","15"]},{img:"Attraction",dom:"reflection",signs:["16","17","18"]},
 {img:"Inversion",dom:"reflection",signs:["19","20","21"]},{img:"Discourse",dom:"reflection",signs:["22","23","24"]},{img:"Dream",dom:"mental",signs:["25","26","27"]},
 {img:"Recollection",dom:"mental",signs:["28","29","30"]},{img:"Relation",dom:"mental",signs:["31","32","33"]},{img:"Opsign · Sonsign",dom:"break",signs:["34a","34b"]},
 {img:"Hyalosign",dom:"time",signs:["35","36","37"]},{img:"Chronosign",dom:"time",signs:["38","39","40"]},{img:"Noosign",dom:"time",signs:["41","42","43"]},{img:"Lectosign",dom:"read",signs:["44"]}];
const DOMNAME={perception:["Perception","the movement-image begins"],affect:["Affection","the face, the felt"],action:["Action","situations and what answers them"],reflection:["Reflection","thought working on the image"],
 mental:["The mental image","dream, memory, relation"],break:["The break","seeing and hearing come loose"],time:["The time-image","time, directly"],read:["Reading","the image becomes legible"]};
const CUE={perception:"lab/score/cues/dae-paddle-meets-current.m4a",affect:"lab/score/cues/dae-conquerors-of-the-useless.m4a",action:"lab/score/cues/dae-odin-above-the-breakers.m4a",
 reflection:"lab/score/cues/dae-preparation-drift.m4a",mental:"lab/score/cues/dae-slide-carousel-at-blue-hour.m4a",break:"lab/score/cues/dae-compass-spin-in-heavy-fog.m4a",
 time:"lab/score/cues/dae-snowbound-umea-cabin.m4a",read:"lab/score/cues/dae-the-geezer-s-stride.m4a"};
let S={},ORDER=[],tiles={},colOf={},RUN=0,PAUSED=false,SPEED=1,K=0;
const sleep=(ms,run)=>new Promise(r=>{let left=ms/SPEED,last=performance.now();const tick=()=>{if(run!==RUN)return r(false);const now=performance.now();if(!PAUSED)left-=now-last;last=now;if(left<=0)return r(true);setTimeout(tick,50)};tick()});
const exIn=e=>Math.max(0,(e.read_t??Math.max(0,(e.match||0)-(e.start||0)))-.6);
function vid(e,{sound=false,t=null}={}){const v=document.createElement("video");v.muted=!sound;v.playsInline=true;v.loop=true;v.preload="auto";v.src=e.video;
  v.addEventListener("loadedmetadata",()=>{try{v.currentTime=t??exIn(e)}catch(x){}v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})},{once:true});return v}
/* ---------- the table ---------- */
function build(){const T=$("table");
  COLS.forEach((c,i)=>{const h=document.createElement("div");h.className="colh";h.style.cssText=`grid-column:${i+1};grid-row:1;--c:var(--${c.dom})`;h.textContent=c.img;T.appendChild(h)});
  COLS.forEach((c,i)=>c.signs.forEach((n,r)=>{const s=S[n];if(!s)return;const tall=c.dom==="read";const d=document.createElement("div");
    d.className="tile"+(tall?" tall":"");d.style.cssText=`grid-column:${i+1};${tall?"":`grid-row:${r+2};`}--c:var(--${c.dom})`;
    const e=(s.examples||[])[0];d.innerHTML=`${e?`<img alt="" loading="lazy" src="${esc(e.thumb)}">`:""}<span class="sym">${esc(s.symbol)}</span><span class="num">${esc(n)}</span><span class="nm">${esc(s.name)}</span>`;
    d.onclick=()=>{if(!$("start").hidden)return;jump(ORDER.indexOf(n))};T.appendChild(d);tiles[n]=d;colOf[n]=c}));fitAll(false)}
function rectOf(el){let x=0,y=0,e=el;while(e&&e!==$("world")){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y,w:el.offsetWidth,h:el.offsetHeight}}   // layout position: unaffected by the camera's own move
const cam={x:0,y:0,z:1};
function look(r,fill=.8,fast=false){const vw=innerWidth,vh=innerHeight,z=Math.min(vw*fill/r.w,vh*fill/r.h);cam.z=z;cam.x=vw/2-(r.x+r.w/2)*z;cam.y=vh/2-(r.y+r.h/2)*z;
  $("world").classList.toggle("fast",fast);$("world").style.transform=`translate(${cam.x}px,${cam.y}px) scale(${z})`}
function fitAll(anim=true){const T=$("table");const r={x:0,y:0,w:T.scrollWidth,h:T.scrollHeight};if(!anim)$("world").style.transition="none";look(r,.96);if(!anim)requestAnimationFrame(()=>$("world").style.transition="")}
function liven(ns){Object.entries(tiles).forEach(([n,d])=>{const want=ns.includes(n),has=d.querySelector("video");
  if(want&&!has){const e=(S[n].examples||[])[0];if(e){const v=vid(e);d.insertBefore(v,d.firstChild);const im=d.querySelector("img");if(im)im.style.opacity=0}}
  if(!want&&has){has.pause();has.remove();const im=d.querySelector("img");if(im)im.style.opacity=""}})}
/* ---------- sound: one D-A-E cue a domain, through Web Audio so it can lift and fall under the shots ---------- */
let AC=null,cur=null,cueEl={};
function score(dom){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();if(cur&&cur.dom===dom)return;
  if(cur){const o=cur;o.g.gain.setTargetAtTime(0,AC.currentTime,1);setTimeout(()=>o.el.pause(),4000)}
  if(!cueEl[dom]){const el=new Audio(CUE[dom]);el.loop=true;const g=AC.createGain();g.gain.value=0;AC.createMediaElementSource(el).connect(g).connect(AC.destination);cueEl[dom]={el,g,dom}}
  cur=cueEl[dom];cur.el.currentTime=0;cur.el.play().catch(()=>{});cur.g.gain.setTargetAtTime(.5,AC.currentTime,1.2)}
const level=(v,s=.6)=>{if(cur)cur.g.gain.setTargetAtTime(v,AC.currentTime,s/3)};
/* ---------- the overlays ---------- */
let flip=0;function layer(){flip^=1;const a=$(flip?"o1":"o2"),b=$(flip?"o2":"o1");a.innerHTML="";a.className="over";return{a,b}}
function show({a,b}){requestAnimationFrame(()=>requestAnimationFrame(()=>{a.classList.add("on");b.classList.remove("on");setTimeout(()=>{if(!b.classList.contains("on")){b.querySelectorAll("video").forEach(v=>v.pause());b.innerHTML=""}},1000)}))}
function hideOver(){["o1","o2"].forEach(id=>{const o=$(id);o.classList.remove("on");setTimeout(()=>{if(!o.classList.contains("on")){o.querySelectorAll("video").forEach(v=>v.pause());o.innerHTML=""}},1000)})}
async function wipe(dom,run){const w=$("wipe");w.style.setProperty("--c",`var(--${dom})`);w.querySelector("b").textContent=DOMNAME[dom][0];w.querySelector("span").textContent=DOMNAME[dom][1];
  w.className="wipe";void w.offsetWidth;w.classList.add("on");score(dom);await sleep(2300,run);w.classList.add("off");await sleep(900,run);w.className="wipe"}
/* ---------- one sign ---------- */
async function playSign(i,run){const n=ORDER[i],s=S[n],c=colOf[n],col=`var(--${c.dom})`,ex=(s.examples||[]).filter(e=>e.video);K=i;dots();
  const prevDom=i?colOf[ORDER[i-1]].dom:null;if(c.dom!==prevDom){hideOver();await wipe(c.dom,run);if(run!==RUN)return}
  // 1. the camera finds the sign in its column; the column comes alive
  hideOver();liven(c.signs);$("world").classList.add("dimmed");Object.values(tiles).forEach(t=>t.classList.remove("on","near","vs"));
  c.signs.forEach(m=>tiles[m]&&tiles[m].classList.add("near"));tiles[n].classList.add("on");
  look(rectOf(tiles[n]),.62);level(.5);if(!await sleep(2600,run))return;
  // 2. it opens into all its shots
  if(ex.length){const L=layer();L.a.classList.add("mosaic");L.a.style.setProperty("--c",col);
    ex.slice(0,6).forEach(e=>{const d=document.createElement("div");d.className="cell";d.appendChild(vid(e));L.a.appendChild(d)});
    L.a.insertAdjacentHTML("beforeend",`<div class="label" style="left:3%;top:4%;--c:${col}"><b>${esc(s.symbol)}</b><span>${esc(s.name)}</span></div>${s.question?`<div class="q">${esc(s.question)}</div>`:""}`);
    show(L);setTimeout(()=>L.a.classList.add("in"),80);if(!await sleep(6000,run))return}
  // 3. one shot, full frame, in its own sound
  const best=[...ex].sort((a,b)=>(b.conf||0)-(a.conf||0))[0];
  if(best){const L=layer();const v=vid(best,{sound:true});L.a.appendChild(v);v.style.inset="0";
    L.a.insertAdjacentHTML("beforeend",`<div class="label" style="left:3%;top:4%;--c:${col}"><b style="font-size:clamp(28px,5vw,64px)">${esc(s.symbol)}</b></div><div class="src">${esc(best.title||"")}${best.year?" · "+best.year:""}</div>`);
    show(L);level(.16,1);if(!await sleep(8000,run))return;level(.5,1.5)}
  // 4. the sign it is mistaken for answers it, side by side
  const conf=(s.diff&&s.diff.confusions||[]).map(x=>String(x.n)).find(m=>S[m]&&(S[m].examples||[]).length);
  if(conf&&best){const o=S[conf],oc=`var(--${colOf[conf].dom})`,oe=[...o.examples].sort((a,b)=>(b.conf||0)-(a.conf||0))[0];
    tiles[conf]&&tiles[conf].classList.add("vs");
    const L=layer();L.a.classList.add("split");
    const A=document.createElement("div"),B=document.createElement("div");A.className=B.className="cell";A.appendChild(vid(best));B.appendChild(vid(oe));L.a.append(A,B);
    A.insertAdjacentHTML("beforeend",`<div class="label" style="left:5%;top:5%;--c:${col}"><b style="font-size:clamp(28px,6vw,80px)">${esc(s.symbol)}</b><span>${esc(s.name)}</span></div>`);
    B.insertAdjacentHTML("beforeend",`<div class="label" style="left:5%;top:5%;--c:${oc}"><b style="font-size:clamp(28px,6vw,80px)">${esc(o.symbol)}</b><span>${esc(o.name)}</span></div>`);
    L.a.insertAdjacentHTML("beforeend",`<div class="or">or</div>`);show(L);if(!await sleep(5000,run))return}
  hideOver();await sleep(700,run)}
async function runFrom(i){const run=++RUN;$("start").hidden=true;
  for(let k=i;k<ORDER.length;k++){if(run!==RUN)return;await playSign(k,run)}
  if(run!==RUN)return;hideOver();$("world").classList.remove("dimmed");Object.values(tiles).forEach(t=>t.classList.remove("on","near","vs"));
  liven(ORDER);fitAll(true);level(.55,2);await sleep(14000,run);liven([]);level(0,4)}
function jump(i){runFrom(Math.max(0,Math.min(ORDER.length-1,i)))}
function dots(){[...$("dots").children].forEach((d,i)=>d.className=i<K?"done":i===K?"cur":"")}
$("go").onclick=()=>runFrom(0);
$("prev").onclick=()=>jump(K-1);$("next").onclick=()=>jump(K+1);
$("pp").onclick=()=>{PAUSED=!PAUSED;$("ppi").innerHTML=PAUSED?'<path d="M7 5v14l12-7z"/>':'<path d="M8 5v14M16 5v14"/>';
  document.querySelectorAll("video").forEach(v=>PAUSED?v.pause():v.play().catch(()=>{}));if(cur)PAUSED?cur.el.pause():cur.el.play().catch(()=>{})};
$("spd").onclick=()=>{SPEED=SPEED===1?1.5:SPEED===1.5?.75:1;$("spd").textContent=SPEED+"×"};
addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();$("start").hidden?$("pp").click():$("go").click()}if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});
addEventListener("resize",()=>{if(K&&tiles[ORDER[K]])look(rectOf(tiles[ORDER[K]]),.62,true);else fitAll(false)});
fetch("cineosis-table.json").then(r=>r.json()).then(d=>{S=Object.fromEntries(d.signs.map(s=>[s.n,s]));ORDER=COLS.flatMap(c=>c.signs).filter(n=>S[n]);build();
  $("dots").innerHTML=ORDER.map(n=>`<i style="--c:var(--${colOf[n].dom})"></i>`).join("");
  $("load").textContent=`44 signs · ${ORDER.reduce((a,n)=>a+(S[n].examples||[]).length,0)} shots · about ${Math.round(ORDER.length*24/60)} minutes`;
  const h=location.hash.match(/^#(\w+)$/);if(h&&S[h[1]]){$("go").textContent="▶ PLAY FROM "+S[h[1]].symbol;$("go").onclick=()=>runFrom(ORDER.indexOf(h[1]))}}).catch(()=>$("load").textContent="The table could not load.");
</script></body></html>
